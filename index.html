[`ಅ. ಒಂದೊಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರ ಬರೆ`,[
[`ಮಕ್ಕಳು ಯಾರ ಭಾವಚಿತ್ರಗಳನ್ನು ಸಿಂಗರಿಸಿದ್ದರು?`,`ಮಕ್ಕಳು ಮಹಿಳಾ ಸಾಧಕಿಯರ ಭಾವಚಿತ್ರಗಳಿಗೆ ಹೂಮಾಲೆ ಹಾಕಿ ಸಿಂಗರಿಸಿದ್ದರು.`],
[`ಅಂತಾರಾಷ್ಟ್ರೀಯ ಮಹಿಳಾ ದಿನಾಚರಣೆಯನ್ನು ಎಂದು ಆಚರಿಸಲಾಗುತ್ತದೆ?`,`ಪ್ರತಿವರ್ಷ ಮಾರ್ಚ್ 8 ರಂದು ಆಚರಿಸಲಾಗುತ್ತದೆ.`],
[`ಸಾವಿತ್ರಿಬಾಯಿ ಫುಲೆಯವರು ಯಾವ ಕ್ಷೇತ್ರದಲ್ಲಿ ಸಾಧನೆ ಮಾಡಿದ್ದಾರೆ?`,`ಶಿಕ್ಷಣ ಕ್ಷೇತ್ರದಲ್ಲಿ ಸಾಧನೆ ಮಾಡಿದ್ದಾರೆ.`],
[`ಕಲ್ಪನಾ ಚಾವ್ಲಾರವರು ಯಾವ ಕ್ಷೇತ್ರದಲ್ಲಿ ಸಾಧನೆ ಮಾಡಿದ್ದಾರೆ?`,`ಬಾಹ್ಯಾಕಾಶ ಕ್ಷೇತ್ರದಲ್ಲಿ ಸಾಧನೆ ಮಾಡಿದ್ದಾರೆ.`]]],
[`ಆ. ವಾಕ್ಯಗಳನ್ನು ಗಮನಿಸಿ ಸರಿ/ತಪ್ಪು ಗುರುತಿಸು; ತಪ್ಪಿದ್ದರೆ ಸರಿಪಡಿಸಿ ಬರೆ`,[
[`ಮಕ್ಕಳೆಲ್ಲರೂ ಬಹಳ ಸಡಗರ ಸಂಭ್ರಮದಿಂದ ತೇಲಾಡುತ್ತಿದ್ದರು.`,`ತಪ್ಪು. ಸರಿ: ಮಕ್ಕಳೆಲ್ಲರೂ ಬಹಳ ಸಡಗರ ಸಂಭ್ರಮದಿಂದ ಓಡಾಡುತ್ತಿದ್ದರು.`],
[`ಪುರುಷರ ಭಾವಚಿತ್ರಗಳಿಗೆ ಹೂಮಾಲೆ ಹಾಕಿ ಸಿಂಗರಿಸಿದರು.`,`ತಪ್ಪು. ಸರಿ: ಮಹಿಳೆಯರ ಭಾವಚಿತ್ರಗಳಿಗೆ ಹೂಮಾಲೆ ಹಾಕಿ ಸಿಂಗರಿಸಿದರು.`],
[`ಮಕ್ಕಳೆಲ್ಲರೂ ಶಾಲಾ ಕೊಠಡಿಗೆ ಹೋಗಿ ಕುಳಿತರು.`,`ತಪ್ಪು. ಸರಿ: ಮಕ್ಕಳೆಲ್ಲರೂ ಕಾರ್ಯಕ್ರಮ ನಡೆಯುವ ಸ್ಥಳಕ್ಕೆ ಬಂದು ಆಸೀನರಾದರು.`],
[`ಮೇರಿಕೋಮ್ ಸಂಗೀತ ಕ್ಷೇತ್ರದಲ್ಲಿ ಸಾಧನೆ ಮಾಡಿದ್ದಾರೆ.`,`ತಪ್ಪು. ಸರಿ: ಮೇರಿಕೋಮ್ ಕ್ರೀಡಾ ಕ್ಷೇತ್ರದಲ್ಲಿ ಸಾಧನೆ ಮಾಡಿದ್ದಾರೆ.`]]],
[`ಇ. ವಿರುದ್ಧಾರ್ಥಕ ಪದ ಬರೆ`,[[`ಸಮಾನತೆ ×`,`ಅಸಮಾನತೆ`],[`ಸ್ವಾತಂತ್ರ್ಯ ×`,`ಪಾರತಂತ್ರ್ಯ (ಪರತಂತ್ರ)`],[`ಹಿಂದೆ ×`,`ಮುಂದೆ`],[`ಮುಕ್ತಾಯ ×`,`ಆರಂಭ`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಅ. ಸ್ತ್ರೀರೂಪ ಬರೆ`,[[`ವಿದ್ಯಾರ್ಥಿ`,`ವಿದ್ಯಾರ್ಥಿನಿ`],[`ಗಂಡು`,`ಹೆಣ್ಣು`],[`ಅಧ್ಯಕ್ಷ`,`ಅಧ್ಯಕ್ಷೆ`],[`ಸಾಧಕ`,`ಸಾಧಕಿ`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಆ. ಮಾದರಿಯಂತೆ ಬರೆ (ಮರ – ಮರಗಳು)`,[[`ಅಂಗಡಿ`,`ಅಂಗಡಿಗಳು`],[`ಚಿತ್ರ`,`ಚಿತ್ರಗಳು`],[`ಶಾಲೆ`,`ಶಾಲೆಗಳು`],[`ಪ್ರಜೆ`,`ಪ್ರಜೆಗಳು`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಇ. ಗುಂಪಿಗೆ ಸೇರದ ಪದ ಗುರುತಿಸಿ ಬರೆ`,[
[`ಮಹಿಳೆ, ಹೆಣ್ಣು, ಹೆಂಗಸು, ಇಳೆ`,`ಇಳೆ (ಇಳೆ = ಭೂಮಿ; ಉಳಿದವು ಸ್ತ್ರೀಯನ್ನು ಸೂಚಿಸುತ್ತವೆ)`],
[`ಆಸನ, ಪೀಠ, ಗದ್ದುಗೆ, ಕಿರೀಟ`,`ಕಿರೀಟ (ಉಳಿದವು ಕುಳಿತುಕೊಳ್ಳುವ ಜಾಗ)`],
[`ಸಂಚಿ ಹೊನ್ನಮ್ಮ, ಬೆಳವಡಿ ಮಲ್ಲಮ್ಮ, ಒನಕೆ ಓಬವ್ವ, ರಾಣಿ ಚೆನ್ನಮ್ಮ`,`ಸಂಚಿ ಹೊನ್ನಮ್ಮ (ಇವರು ಸಾಹಿತ್ಯ ಕ್ಷೇತ್ರದವರು; ಉಳಿದವರು ವೀರ ಮಹಿಳೆಯರು)`],
[`ಸಾಧನೆ, ಯಶಸ್ಸು, ಸಿದ್ಧಿ, ಹೋರಾಟ`,`ಹೋರಾಟ (ಉಳಿದವು ಯಶಸ್ಸಿನ ಅರ್ಥದ ಪದಗಳು)`]]],
[`ಬಳಕೆ ಚಟುವಟಿಕೆ (ಚಟುವಟಿಕೆ ಆಧಾರಿತ – ಮಾರ್ಗದರ್ಶನ)`,[
[`೧. ಸ್ವಾತಂತ್ರ್ಯ ದಿನಾಚರಣೆ ಕಾರ್ಯಕ್ರಮದ ಪಟ್ಟಿ ಸಿದ್ಧಪಡಿಸು.`,`ಮಾದರಿ ಪಟ್ಟಿ: ಧ್ವಜಾರೋಹಣ → ಪ್ರಾರ್ಥನೆ → ಸ್ವಾಗತ → ಪ್ರಾಸ್ತಾವಿಕ ಭಾಷಣ → ಮುಖ್ಯ ಅತಿಥಿಗಳ ಭಾಷಣ → ದೇಶಭಕ್ತಿ ಗೀತೆ/ನೃತ್ಯ → ಬಹುಮಾನ ವಿತರಣೆ → ವಂದನಾರ್ಪಣೆ → ರಾಷ್ಟ್ರಗೀತೆ → ಸಿಹಿ ಹಂಚಿಕೆ.`],
[`೨–೩. ಭಿತ್ತಿ ಪತ್ರ ತಯಾರಿಕೆ ಮತ್ತು ಐತಿಹಾಸಿಕ ಮಹಿಳೆಯರ ಪಾತ್ರಾಭಿನಯ`,`ಶಿಕ್ಷಕರ ಮಾರ್ಗದರ್ಶನದಲ್ಲಿ ತರಗತಿಯ ಎಲ್ಲಾ ಮಕ್ಕಳು ಗುಂಪಿನಲ್ಲಿ ಮಾಡುವ ಚಟುವಟಿಕೆ (ರಾಣಿ ಚೆನ್ನಮ್ಮ, ಒನಕೆ ಓಬವ್ವ, ರಾಣಿ ಅಬ್ಬಕ್ಕ ಪಾತ್ರಗಳನ್ನು ಅಭಿನಯಿಸಬಹುದು).`],
[`೪. ಶಾಲಾಭಿವೃದ್ಧಿ ಮತ್ತು ಮೇಲುಸ್ತುವಾರಿ ಸಮಿತಿ ಸದಸ್ಯರ ಹೆಸರುಗಳನ್ನು ನೋಟ್ ಪುಸ್ತಕದಲ್ಲಿ ಪಟ್ಟಿಮಾಡು.`,`ತಮ್ಮ ಶಾಲೆಯ SDMC ಅಧ್ಯಕ್ಷರು ಮತ್ತು ಸದಸ್ಯರ ಹೆಸರುಗಳನ್ನು ಶಿಕ್ಷಕರಿಂದ ತಿಳಿದು ಬರೆಯುವುದು.`]]]
],
qb:[
M(`'ವಂದನೆ' ಪದದ ಅರ್ಥ:`,[`ಸ್ವಾಗತ`,`ತೃಪ್ತಿಕರ`,`ನಮಸ್ಕಾರ`,`ಸಹಕಾರ`],2),
M(`ಅಂತಾರಾಷ್ಟ್ರೀಯ ಮಹಿಳಾ ದಿನಾಚರಣೆ ಆಚರಿಸುವ ದಿನ:`,[`ಜನವರಿ 26`,`ಮಾರ್ಚ್ 8`,`ಆಗಸ್ಟ್ 15`,`ನವೆಂಬರ್ 14`],1),
M(`ಸಾವಿತ್ರಿಬಾಯಿ ಫುಲೆ ಸಾಧನೆ ಮಾಡಿದ ಕ್ಷೇತ್ರ:`,[`ಕ್ರೀಡೆ`,`ಶಿಕ್ಷಣ`,`ಸಂಗೀತ`,`ಬಾಹ್ಯಾಕಾಶ`],1),
M(`ಕಲ್ಪನಾ ಚಾವ್ಲಾ ಸಾಧನೆ ಮಾಡಿದ ಕ್ಷೇತ್ರ:`,[`ಬಾಹ್ಯಾಕಾಶ`,`ಸಂಗೀತ`,`ಸಾಹಿತ್ಯ`,`ರಾಜಕೀಯ`],0),
M(`ಮಹಿಳಾ ದಿನಾಚರಣೆ ಕಾರ್ಯಕ್ರಮದ ನಿರೂಪಣೆ ಮಾಡಿದ ವಿದ್ಯಾರ್ಥಿ:`,[`ಶೇಖರ್`,`ಸುಮತಿ`,`ಫಾತಿಮಾ`,`ಕುಸುಮ`],0),
M(`ಎಸ್.ಡಿ.ಎಂ.ಸಿ. ಅಧ್ಯಕ್ಷರು ಯಾರು?`,[`ಶ್ರೀಮತಿ ಮಹಾಲಕ್ಷ್ಮಿ`,`ಶ್ರೀಮತಿ ಸುಮತಿ`,`ಮೇರಿಕೋಮ್`,`ಕುಸುಮ`],0,'m'),
O(`ಮಕ್ಕಳು ಯಾರ ಭಾವಚಿತ್ರಗಳನ್ನು ಸಿಂಗರಿಸಿದ್ದರು?`,`ಮಹಿಳಾ ಸಾಧಕಿಯರ ಭಾವಚಿತ್ರಗಳನ್ನು.`),
O(`ಅತಿಥಿಗಳನ್ನು ಸ್ವಾಗತಿಸಿದ ವಿದ್ಯಾರ್ಥಿನಿ ಯಾರು?`,`ಸುಮತಿ.`),
O(`ವಂದನೆಗಳನ್ನು ಸಲ್ಲಿಸಿದ ವಿದ್ಯಾರ್ಥಿನಿ ಯಾರು?`,`ಫಾತಿಮಾ.`),
O(`ಧನ್ಯವಾದ ಸಲ್ಲಿಸಿ ಭಾಷಣ ಮುಗಿಸಿದವರು ಯಾರು?`,`ಎಸ್.ಡಿ.ಎಂ.ಸಿ. ಅಧ್ಯಕ್ಷರಾದ ಶ್ರೀಮತಿ ಮಹಾಲಕ್ಷ್ಮಿಯವರು.`,'m'),
O(`ಪಿ.ಟಿ. ಉಷಾ ಯಾವ ಕ್ಷೇತ್ರದ ಸಾಧಕಿ?`,`ಕ್ರೀಡಾ ಕ್ಷೇತ್ರದ ಸಾಧಕಿ.`),
O(`ಸಂಗೀತ ಕ್ಷೇತ್ರದ ಒಬ್ಬ ಮಹಿಳಾ ಸಾಧಕಿಯ ಹೆಸರು ಬರೆಯಿರಿ.`,`ಎಂ.ಎಸ್. ಸುಬ್ಬಲಕ್ಷ್ಮಿ (ಗಂಗೂಬಾಯಿ ಹಾನಗಲ್, ಲತಾ ಮಂಗೇಶ್ಕರ್).`),
G(`'ಸಿಂಗರಿಸು' ಪದಕ್ಕೆ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಅಲಂಕರಿಸು`),
G(`'ಮುಕ್ತಾಯ' ಪದದ ವಿರುದ್ಧಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಆರಂಭ`),
G(`'ವಿದ್ಯಾರ್ಥಿ' ಪದದ ಸ್ತ್ರೀರೂಪ ಬರೆಯಿರಿ.`,`ವಿದ್ಯಾರ್ಥಿನಿ`),
G(`'ಅಂಗಡಿ' ಪದದ ಬಹುವಚನ ರೂಪ ಬರೆಯಿರಿ.`,`ಅಂಗಡಿಗಳು`),
G(`'ಸಮಾನತೆ' ಪದದ ವಿರುದ್ಧಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಅಸಮಾನತೆ`),
G(`'ಪಥ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ದಾರಿ, ಹಾದಿ`,'e'),
S(`ಮಹಿಳಾ ದಿನಾಚರಣೆಯು ನಮಗೆ ಏನನ್ನು ಸೂಚಿಸುತ್ತದೆ?`,`ಮಹಿಳಾ ದಿನಾಚರಣೆಯು ಪ್ರತಿಯೊಬ್ಬರ ಜೀವನದಲ್ಲಿ ಮತ್ತು ಸಮಾಜದಲ್ಲಿ ಮಹಿಳೆಯರ ಬಗ್ಗೆ ಮೆಚ್ಚುಗೆ, ಗೌರವ, ಪ್ರೀತಿ ಮತ್ತು ಕಾಳಜಿಯ ಸಂಕೇತವಾಗಿದೆ.`),
S(`ಹಿಂದೆ ಮತ್ತು ಈಗ ಮಹಿಳೆಯರ ಸ್ಥಿತಿ ಹೇಗಿದೆ?`,`ಹಿಂದೆ ಮಹಿಳೆಯರು ಮನೆಗಳಲ್ಲಿ ನಿರ್ಬಂಧವನ್ನು ಹೊಂದಿದ್ದರು. ಈಗ ಆಧುನಿಕ ಮಹಿಳೆಯರು ಕೆಲಸದಲ್ಲಿ ಸಮಾನ ಅವಕಾಶ ಪಡೆದುಕೊಂಡಿದ್ದಾರೆ ಮತ್ತು ತಮ್ಮ ಸಾಮರ್ಥ್ಯ ಅರಿತು ಕುಟುಂಬ ಹಾಗೂ ಸಮಾಜದ ಯಶಸ್ಸಿಗೆ ಕಾರಣರಾಗಿದ್ದಾರೆ.`),
S(`ಸ್ವಾತಂತ್ರ್ಯ ಹೋರಾಟದಲ್ಲಿ ಹೆಸರು ಮಾಡಿದ ಯಾವುದಾದರೂ ಮೂವರು ಮಹಿಳೆಯರನ್ನು ಹೆಸರಿಸಿ.`,`ಝಾನ್ಸಿರಾಣಿ ಲಕ್ಷ್ಮೀಬಾಯಿ, ಕಿತ್ತೂರು ರಾಣಿ ಚೆನ್ನಮ್ಮ, ಒನಕೆ ಓಬವ್ವ, ಬೆಳವಡಿ ಮಲ್ಲಮ್ಮ, ರಾಣಿ ಅಬ್ಬಕ್ಕ (ಯಾವುದಾದರೂ ಮೂವರು).`),
S(`ಸಂಗೀತ ಕ್ಷೇತ್ರದ ಮಹಿಳಾ ಸಾಧಕಿಯರು ಯಾರು?`,`ಎಂ.ಎಸ್. ಸುಬ್ಬಲಕ್ಷ್ಮಿ, ಗಂಗೂಬಾಯಿ ಹಾನಗಲ್, ಲತಾ ಮಂಗೇಶ್ಕರ್ ಮುಂತಾದವರು.`),
L(`ಮಹಿಳಾ ದಿನಾಚರಣೆ ಕಾರ್ಯಕ್ರಮ ಹೇಗೆ ನಡೆಯಿತೆಂಬುದನ್ನು ಬರೆಯಿರಿ.`,`ಮಕ್ಕಳೆಲ್ಲರೂ ಕಾರ್ಯಕ್ರಮ ನಡೆಯುವ ಸ್ಥಳಕ್ಕೆ ಬಂದು ಆಸೀನರಾದರು. ಐದನೆಯ ತರಗತಿಯ ಶೇಖರ್ ನಿರೂಪಣೆ ಮಾಡಿದನು. ಸುಮತಿ ಎಲ್ಲಾ ಗಣ್ಯರನ್ನು ಸ್ವಾಗತಿಸಿದಳು. ಮುಖ್ಯಶಿಕ್ಷಕರು ಈ ದಿನದ ಮಹತ್ವವನ್ನು ತಿಳಿಸಿದರು. ಎಸ್.ಡಿ.ಎಂ.ಸಿ. ಅಧ್ಯಕ್ಷರಾದ ಮಹಾಲಕ್ಷ್ಮಿಯವರು ಮಹಿಳಾ ಸಾಧಕಿಯರ ಬಗ್ಗೆ ಮಾತನಾಡಿ ಧನ್ಯವಾದ ಸಲ್ಲಿಸಿದರು. ಫಾತಿಮಾ ವಂದನೆ ಸಲ್ಲಿಸಿದಳು. ರಾಷ್ಟ್ರಗೀತೆಯೊಂದಿಗೆ ಕಾರ್ಯಕ್ರಮ ಮುಕ್ತಾಯವಾಗಿ ಎಲ್ಲರಿಗೂ ಸಿಹಿ ಹಂಚಲಾಯಿತು.`),
L(`ವಿಜ್ಞಾನ, ತಂತ್ರಜ್ಞಾನ ಮತ್ತು ಬಾಹ್ಯಾಕಾಶ ಕ್ಷೇತ್ರದಲ್ಲಿ ಮಹಿಳೆಯರ ಸಾಧನೆಯನ್ನು ವಿವರಿಸಿ.`,`ಮಹಿಳೆಯರು ವಿಜ್ಞಾನ, ತಂತ್ರಜ್ಞಾನ, ಬಾಹ್ಯಾಕಾಶ ಕ್ಷೇತ್ರಗಳಲ್ಲೂ ಬಹು ಹೆಮ್ಮೆ ಪಡುವಂತಹ ಸಾಧನೆ ಮಾಡಿದ್ದಾರೆ. ಕಲ್ಪನಾ ಚಾವ್ಲಾ, ಸುನಿತಾ ವಿಲಿಯಮ್ಸ್ ಇವರ ಅಪ್ರತಿಮ ಧೈರ್ಯ, ಸಾಧನೆ ದೇಶದ ಪ್ರಗತಿಯ ಹಾದಿಯಲ್ಲಿ ಒಂದು ಮೈಲಿಗಲ್ಲಾಗಿದೆ.`)
]});

LS.push({n:10,t:`ಸರ್ವಜ್ಞನ ತ್ರಿಪದಿಗಳು (ಪದ್ಯ)`,au:`ಸರ್ವಜ್ಞ`,pg:7,
words:`ಗರ್ವ – ಜಂಬ; ನುಡಿ – ಮಾತು; ಪರ್ವತ – ಬೆಟ್ಟ; ಅಗ್ನಿ – ಬೆಂಕಿ; ಕುಲಗೋತ್ರ – ಜಾತಿ, ವಂಶ; ಆಪತ್ತು – ಅಪಾಯ; ತೊಂದರೆ; ಬಗೆ – ರೀತಿ, ವಿಧ`,
notes:`ಬುತ್ತಿ – ಪ್ರಯಾಣ ಕಾಲಕ್ಕಾಗಿ ಕಟ್ಟಿ ಸಿದ್ಧಪಡಿಸಿದ ಮೊಸರನ್ನ, ಕಲಸನ್ನ, ರೊಟ್ಟಿ ಮೊದಲಾದವುಗಳನ್ನು ಒಳಗೊಂಡದ್ದು; ತ್ರಿಪದಿ – ಮೂರು ಸಾಲುಗಳನ್ನು ಹೊಂದಿರುವ ಪದ್ಯ. ಗಾದೆ: ನುಡಿದಂತೆ ನಡೆ, ನಡೆದಂತೆ ನುಡಿ.`,
ab:[
[`ಅ. ಒಂದೊಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರ ಬರೆಯಿರಿ`,[
[`ಸರ್ವಜ್ಞನು ಯಾವ ರೀತಿ ಆಗಿದ್ದಾನೆ?`,`ಸರ್ವಜ್ಞನು ಗರ್ವದಿಂದ ಆದವನಲ್ಲ; ಎಲ್ಲರಲ್ಲಿರುವ ಒಂದೊಂದು ನುಡಿಯನ್ನು ಕಲಿತು ವಿದ್ಯೆಯ ಪರ್ವತವೇ ಆದವನು.`],
[`ಕೊಟ್ಟಿದ್ದು ತನಗಾದರೆ ಬಚ್ಚಿಟ್ಟಿದ್ದು ಯಾರಿಗೆ?`,`ಕೊಟ್ಟಿದ್ದು ತನಗಾದರೆ ಬಚ್ಚಿಟ್ಟಿದ್ದು ಪರರಿಗೆ.`],
[`ಯಾರ ಮನೆಯ ಜ್ಯೋತಿಯು ಹೀನವಲ್ಲ?`,`ಜಾತಿಹೀನನ ಮನೆಯ ಜ್ಯೋತಿಯೂ ಹೀನವಲ್ಲ.`],
[`ಪಾಪದ ನೆಲಗಟ್ಟು ಯಾವುದು?`,`ಕೋಪವು ಪಾಪದ ನೆಲಗಟ್ಟು.`]]],
[`ಆ. ಎರಡು–ಮೂರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರ ಬರೆಯಿರಿ`,[
[`ಸರ್ವಜ್ಞನು ವಿದ್ಯೆಯ ಪರ್ವತ ಆದದ್ದು ಹೇಗೆ?`,`ಸರ್ವಜ್ಞನು ಎಲ್ಲರಿಂದಲೂ ಒಂದೊಂದು ಮಾತನ್ನು (ನುಡಿಯನ್ನು) ಕಲಿತನು. ಹೀಗೆ ಎಲ್ಲರಿಂದ ಕಲಿತ ವಿದ್ಯೆಯಿಂದಾಗಿ ಅವನು ವಿದ್ಯೆಯ ಪರ್ವತವೇ ಆದನು.`],
[`ಕುಲಗೋತ್ರಗಳ ನಡುವೆ ಭಿನ್ನತೆ ಏಕೆ ಇರಬಾರದು?`,`ನಾವೆಲ್ಲರೂ ನಡೆಯುವ ಭೂಮಿ ಒಂದೇ, ಕುಡಿಯುವ ನೀರು ಒಂದೇ, ಸುಡುವ ಅಗ್ನಿಯೂ ಒಂದೇ. ಎಲ್ಲರಿಗೂ ಇವು ಒಂದೇ ಆಗಿರುವಾಗ ಕುಲಗೋತ್ರಗಳ ನಡುವೆ ಭೇದ-ಭಿನ್ನತೆ ಇರಬಾರದು.`]]],
[`ಇ. ರಾಷ್ಟ್ರಗೀತೆ ಬರೆಯಿರಿ / ಕಂಠಪಾಠ ಮಾಡಿ ಹಾಡಿ`,[[`ಸರ್ವಜ್ಞನ ತ್ರಿಪದಿಗಳನ್ನು ಕಂಠಪಾಠ ಮಾಡಿ ನಿಮ್ಮದೇ ರಾಗದಲ್ಲಿ ಹಾಡಿ. ನಮ್ಮ ರಾಷ್ಟ್ರಗೀತೆಯನ್ನು ಬರೆಯಿರಿ.`,`ಚಟುವಟಿಕೆ: ಮಕ್ಕಳಿಂದ ಹಾಡಿಸಿ; ರಾಷ್ಟ್ರಗೀತೆಯನ್ನು ಶಿಕ್ಷಕರ ಸಹಾಯದಿಂದ ಸ್ಪಷ್ಟವಾಗಿ ಬರೆಯಿಸಿ. (ಅಂತ್ಯಾಕ್ಷರಿ ಆಟದ ವಿಧಾನ ಪಾಠದಲ್ಲಿದೆ.)`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಅ. ಸ್ಪಷ್ಟವಾಗಿ ಓದಿ ವ್ಯತ್ಯಾಸ ಗಮನಿಸಿ`,[[`ಹಾಳು–ಆಳು, ಹುಳಿ–ಉಳಿ, ಹುಣ್ಣು–ಉಣ್ಣು, ಹೇಳು–ಏಳು, ಹೊತ್ತು–ಒತ್ತು`,`'ಹ' ಸೇರಿದಾಗ ಪದದ ಅರ್ಥ ಬದಲಾಗುತ್ತದೆ (ಉದಾ: ಹಾಳು = ನಾಶ; ಆಳು = ಕೆಲಸಗಾರ). ಸ್ಪಷ್ಟ ಉಚ್ಚಾರಣೆ ಅಭ್ಯಾಸ.`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಆ. ಮಾದರಿಯಂತೆ ಪದಗಳನ್ನು ಬರೆ (ಟ್ಟು – ಕಟ್ಟು, ಅಟ್ಟು, ತಟ್ಟು, ಪೆಟ್ಟು)`,[
[`ಡ್ಡ`,`ಗುಡ್ಡ, ದಡ್ಡ, ಅಡ್ಡ, ಹೆಡ್ಡ (ಸೂಚಿತ)`],[`ತ್ತ`,`ಸುತ್ತ, ಮತ್ತ, ಚಿತ್ತ, ಬಿತ್ತ (ಸೂಚಿತ)`],[`ಕ್ಕ`,`ಅಕ್ಕ, ಸಿಕ್ಕ, ತಕ್ಕ, ಹಕ್ಕ (ಸೂಚಿತ)`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಇ. ಸ, ಶ, ಷ ಸೇರಿಸಿ ಪದ ರಚಿಸು`,[
[`ಸನ್ಯಾಸ – ವಿನಾಶ – ಪುರುಷ`,`ಸನ್ಯಾಸ, ವಿನಾಶ, ಪುರುಷ`],
[`ಪ್ರಯಾ__ – ಆಕಾ__ – ದೋ__`,`ಪ್ರಯಾಸ, ಆಕಾಶ, ದೋಷ`],
[`ಪ್ರವಾ__ – ವಿವ__ – ರೋ__`,`ಪ್ರವಾಸ, ವಿವಶ, ರೋಷ`],
[`ನೀರ__ – ವಿದೇ__ – ಹರು__`,`ನೀರಸ, ವಿದೇಶ, ಹರುಷ`],
[`ವಿಶ್ವಾ__ – ಹತಾ__ – ವಿಶೇ__`,`ವಿಶ್ವಾಸ, ಹತಾಶ, ವಿಶೇಷ`],
[`ವಿಲಾ__ – ವ__ – ನಿಮಿ__`,`ವಿಲಾಸ, ವಶ, ನಿಮಿಷ`]]],
[`ಬಳಕೆ ಚಟುವಟಿಕೆ – ಅ. ವಾಕ್ಯವನ್ನು ಸ್ಫುಟವಾಗಿ ನಕಲು ಮಾಡಿ`,[[`ಕೊಟ್ಟಿದ್ದು ತನಗೆ ಬಚ್ಚಿಟ್ಟಿದ್ದು ಪರರಿಗೆ`,`ವಾಕ್ಯವನ್ನು ಅಕ್ಷರ-ಗುಂಡಾಗಿ, ಸರಿಯಾದ ಒತ್ತಕ್ಷರಗಳೊಂದಿಗೆ ನಕಲು ಮಾಡಿ ಬರೆಯಿರಿ.`]]]
],
qb:[
M(`ತ್ರಿಪದಿ ಎಂದರೆ ಎಷ್ಟು ಸಾಲುಗಳ ಪದ್ಯ?`,[`ಎರಡು`,`ಮೂರು`,`ನಾಲ್ಕು`,`ಆರು`],1),
M(`ಸರ್ವಜ್ಞನ ತ್ರಿಪದಿಗಳ ಅಂಕಿತನಾಮ:`,[`ಸರ್ವಜ್ಞ`,`ಬಸವಣ್ಣ`,`ಪಂಪ`,`ಕುವೆಂಪು`],0),
M(`ಪಾಪದ ನೆಲೆಗಟ್ಟು ಯಾವುದು?`,[`ಕೋಪ`,`ಪ್ರೀತಿ`,`ದಾನ`,`ವಿದ್ಯೆ`],0),
M(`'ಗರ್ವ' ಪದದ ಅರ್ಥ:`,[`ಜಂಬ`,`ದುಃಖ`,`ಸಂತೋಷ`,`ಭಯ`],0),
M(`'ಬುತ್ತಿ' ಎಂದರೆ:`,[`ಪ್ರಯಾಣಕ್ಕಾಗಿ ಕಟ್ಟಿದ ಊಟ`,`ಬೆಟ್ಟ`,`ದಾರಿ`,`ಬೆಂಕಿ`],0),
M(`ಸರ್ವಜ್ಞನ ಪ್ರಕಾರ ನಡೆಯುವ ಭೂಮಿ ಹೇಗಿದೆ?`,[`ಒಂದೇ`,`ಎರಡು`,`ಮೂರು`,`ಹಲವು`],0,'m'),
O(`ಸರ್ವಜ್ಞನ ತ್ರಿಪದಿಗಳನ್ನು ಬರೆದವರು ಯಾರು?`,`ಸರ್ವಜ್ಞ.`),
O(`ಈ ಪಾಠದ ಗಾದೆ ಮಾತು ಯಾವುದು?`,`'ನುಡಿದಂತೆ ನಡೆ, ನಡೆದಂತೆ ನುಡಿ.'`),
O(`ತ್ರಿಪದಿ ಎಂದರೇನು?`,`ಮೂರು ಸಾಲುಗಳನ್ನು ಹೊಂದಿರುವ ಪದ್ಯ.`),
O(`ಕೊಟ್ಟಿದ್ದು ತನಗೆ ಬಚ್ಚಿಟ್ಟಿದ್ದು ಯಾರಿಗೆ?`,`ಪರರಿಗೆ.`),
O(`ಪಾಪವೆಲ್ಲಿಹುದು ಎಂದು ಸರ್ವಜ್ಞ ಹೇಳಿದ್ದಾನೆ? (ಪಾಪದ ನೆಲೆಗಟ್ಟು)`,`ಕೋಪವು ಪಾಪದ ನೆಲೆಗಟ್ಟು.`),
O(`ಸರ್ವಜ್ಞನ ಪ್ರಕಾರ ಯಾರ ಮನೆಯ ಜ್ಯೋತಿ ಹೀನವಲ್ಲ?`,`ಜಾತಿಹೀನನ ಮನೆಯ ಜ್ಯೋತಿ.`),
G(`'ಗರ್ವ' ಪದದ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಜಂಬ`),
G(`'ಪರ್ವತ' ಪದಕ್ಕೆ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಬೆಟ್ಟ`),
G(`'ಅಗ್ನಿ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಬೆಂಕಿ`),
G(`'ಆಪತ್ತು' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಅಪಾಯ`),
G(`'ಪ್ರವಾ__' ಪದದ ಖಾಲಿ ಜಾಗಕ್ಕೆ ಸೂಕ್ತ ಅಕ್ಷರ (ಸ/ಶ/ಷ) ಸೇರಿಸಿ.`,`ಪ್ರವಾಸ`),
G(`ಸ/ಶ/ಷ ಸೇರಿಸಿ ಪದ ಪೂರ್ಣಗೊಳಿಸಿ: ದೋ__`,`ದೋಷ`),
S(`ಸರ್ವಜ್ಞನು ವಿದ್ಯೆಯ ಪರ್ವತ ಆದದ್ದು ಹೇಗೆ?`,`ಸರ್ವಜ್ಞನು ಎಲ್ಲರಿಂದಲೂ ಒಂದೊಂದು ನುಡಿಯನ್ನು ಕಲಿತು ವಿದ್ಯೆಯ ಪರ್ವತವಾದನು.`),
S(`ಕುಲಗೋತ್ರಗಳ ನಡುವೆ ಭಿನ್ನತೆ ಏಕೆ ಇರಬಾರದು?`,`ನಡೆಯುವ ಭೂಮಿ, ಕುಡಿಯುವ ನೀರು, ಸುಡುವ ಅಗ್ನಿ ಎಲ್ಲರಿಗೂ ಒಂದೇ ಆಗಿರುವುದರಿಂದ ಕುಲಗೋತ್ರಗಳ ನಡುವೆ ಭಿನ್ನತೆ ಇರಬಾರದು.`),
S(`ದಾತನೇ ಜಾತ ಎಂದರೆ ಏನರ್ಥ?`,`ಜಾತಿಯಿಂದ ಯಾರೂ ಶ್ರೇಷ್ಠರಲ್ಲ; ದಾನ ಮಾಡುವ ಗುಣವುಳ್ಳವನೇ ಶ್ರೇಷ್ಠ ಎಂದು ಸರ್ವಜ್ಞ ಹೇಳಿದ್ದಾನೆ.`),
S(`ಕೋಪದ ಬಗ್ಗೆ ಸರ್ವಜ್ಞ ಏನು ಹೇಳಿದ್ದಾನೆ?`,`ಕೋಪವು ತಾನೇ ಪಾಪದ ನೆಲೆಗಟ್ಟು; ಆಪತ್ತು ಸುಖ ಎರಡನ್ನೂ ಸರಿಯೆಂದು ಕಾಣುವವನಿಗೆ ಪಾಪವೆಲ್ಲಿರುವುದು ಎಂದು ತಿಳಿಸಿದ್ದಾನೆ.`),
L(`'ಕುಲಗೋತ್ರಗಳ ಬಗ್ಗೆ' ಸರ್ವಜ್ಞನ ಅಭಿಪ್ರಾಯವನ್ನು ನಿಮ್ಮ ಮಾತುಗಳಲ್ಲಿ ವಿವರಿಸಿ.`,`ಸರ್ವಜ್ಞನ ಪ್ರಕಾರ ಜಾತಿಯಿಂದ ಯಾರೂ ಹೀನರಲ್ಲ; ಜಾತಿಹೀನನ ಮನೆಯ ಜ್ಯೋತಿಯೂ ಹೀನವಲ್ಲ. ದೇವನೊಲಿಯುವುದು ಜಾತಿಯನ್ನು ನೋಡಿ ಅಲ್ಲ. ನಡೆಯುವ ಭೂಮಿ, ಕುಡಿಯುವ ನೀರು, ಸುಡುವ ಅಗ್ನಿ ಎಲ್ಲರಿಗೂ ಒಂದೇ. ಹೀಗಿರುವಾಗ ಮನುಷ್ಯರ ನಡುವೆ ಕುಲಗೋತ್ರಗಳ ಭೇದ ಇರಬಾರದು.`),
L(`ಕೊಟ್ಟಿದ್ದು ಮತ್ತು ಬಚ್ಚಿಟ್ಟಿದ್ದರ ಕುರಿತಾದ ತ್ರಿಪದಿಯ ಸಾರವನ್ನು ಬರೆಯಿರಿ.`,`ಕೊಟ್ಟದ್ದು ತನಗೆ ಅಂದರೆ ದಾನ ಮಾಡಿದ್ದು ನಮಗೇ ಪುಣ್ಯ ತರುತ್ತದೆ; ಬಚ್ಚಿಟ್ಟದ್ದು ಬೇರೆಯವರಿಗೆ ಸೇರುತ್ತದೆ. ಕೆಟ್ಟಿತನ (ಕೆಟ್ಟದ್ದು) ಮಾಡದೆ ಮುಂದಕ್ಕೆ ಬುತ್ತಿ ಕಟ್ಟಬೇಕು, ಅಂದರೆ ಒಳ್ಳೆಯ ಕೆಲಸ ಮಾಡಿ ಪುಣ್ಯ ಸಂಪಾದಿಸಬೇಕೆಂಬುದು ತಾತ್ಪರ್ಯ.`)
]});

LS.push({n:11,t:`ವೀರ ಅಭಿಮನ್ಯು`,au:`ಸಮಿತಿ ರಚನೆ`,pg:11,
words:`ಭೇದಿಸು – ಹೊಡೆ, ಮುರಿ, ಸೀಳು; ಆಶೀರ್ವದಿಸು – ಹರಸು; ಶಂಕೆ – ಸಂದೇಹ, ಸಂಶಯ; ವಿಖ್ಯಾತ – ಪ್ರಸಿದ್ಧವಾದ; ಯುದ್ಧ – ಕದನ, ಸಮರ, ಸಂಗ್ರಾಮ; ಎರಗು – ನಮಸ್ಕಾರ ಮಾಡು; ಸೂರ್ಯ – ನೇಸರ, ರವಿ; ಸೇನೆ – ದಂಡು, ಸೈನ್ಯ; ಯಮಪುರ – ಯಮನ ಲೋಕ, ಮೃತ್ಯುಲೋಕ; ಮರಣ – ಸಾವು; ಘನಘೋರ – ಉಗ್ರವಾದ, ಭಯಂಕರವಾದ; ಚಿಂತಾಕ್ರಾಂತ – ಚಿಂತೆಗೊಳಗಾದ; ಸಂಹರಿಸು – ನಾಶಗೊಳಿಸು, ಕೊಲ್ಲು; ಪ್ರಶಂಸೆ – ಹೊಗಳಿಕೆ; ಪರಾಕ್ರಮ – ಶೌರ್ಯ; ಸಹಮತ – ಒಮ್ಮತ; ನಂದನ – ಮಗ; ದಯೆ – ಕರುಣೆ; ಮಂಗಳ – ಶುಭ; ವದನ – ಮುಖ; ಖಿನ್ನ – ದುಃಖಿತನಾದ; ಪರಿಣೀತ – ಚತುರ; ಹೇಡಿ – ಅಂಜುಬುರುಕ; ಸಾಮರ್ಥ್ಯ – ದಕ್ಷತೆ; ಗರ್ಭ – ಬಸಿರು; ಧಿಕ್ಕಾರ – ನಿಂದೆ`,
notes:`ಚಕ್ರವ್ಯೂಹ – ಒಂದು ಬಗೆಯ ಸೇನಾ ರಚನೆ; ಕ್ಷತ್ರಿಯವಂಶ – ನಾಲ್ಕು ವರ್ಣಗಳಲ್ಲಿ ಒಂದು, ಯುದ್ಧದ ದೀಕ್ಷೆಯನ್ನು ತೆಗೆದುಕೊಂಡ ವರ್ಣ; ಸಂಶಪ್ತಕರು – ಪರಸ್ಪರ ಶಪಥ ಮಾಡಿ ಯುದ್ಧ ಮಾಡುವ ವೀರರು; ರಕ್ಷಾಕವಚ – ದೇಹದ ರಕ್ಷಣೆಗಾಗಿ ತೊಟ್ಟುಕೊಳ್ಳುವ ಉಕ್ಕಿನ ಅಂಗಿ`,
ab:[
[`ಅ. ಒಂದೊಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರ ಬರೆಯಿರಿ`,[
[`ಚಕ್ರವ್ಯೂಹವನ್ನು ರಚಿಸಿದವರು ಯಾರು?`,`ದ್ರೋಣಾಚಾರ್ಯರು ಚಕ್ರವ್ಯೂಹವನ್ನು ರಚಿಸಿದರು.`],
[`ಕೌರವರು–ಪಾಂಡವರು ಯಾರಿಂದ ಬಿಲ್ವಿದ್ಯೆ ಕಲಿತರು?`,`ದ್ರೋಣಾಚಾರ್ಯರಿಂದ ಬಿಲ್ವಿದ್ಯೆ ಕಲಿತರು.`],
[`ಅಭಿಮನ್ಯುವಿನ ತಂದೆಯ ಹೆಸರೇನು?`,`ಅರ್ಜುನ.`],
[`ಕೌರವರಿಗೂ–ಪಾಂಡವರಿಗೂ ಯುದ್ಧ ಎಲ್ಲಿ ನಡೆಯಿತು?`,`ಕುರುಕ್ಷೇತ್ರದಲ್ಲಿ.`]]],
[`ಆ. ಕೊಟ್ಟಿರುವ ಮಾತುಗಳನ್ನು ಯಾರು? ಯಾರಿಗೆ ಹೇಳಿದರು?`,[
[`"ದೊಡ್ಡಪ್ಪ, ನೀವೇಕೆ ಇಂದು ಬಹಳ ಚಿಂತಾಕ್ರಾಂತರಾಗಿರುವಿರಿ?"`,`ಯಾರು: ಅಭಿಮನ್ಯು; ಯಾರಿಗೆ: ಧರ್ಮರಾಯನಿಗೆ.`],
[`"ನಿನ್ನನ್ನು ಪಡೆದ ನಾವೇ ಧನ್ಯರು"`,`ಯಾರು: ಧರ್ಮರಾಯ; ಯಾರಿಗೆ: ಅಭಿಮನ್ಯುವಿಗೆ.`],
[`"ಏನು ಕಂದಾ! ನೀನು ಯುದ್ಧದಲ್ಲಿ ಚಕ್ರವ್ಯೂಹವನ್ನು ಭೇದಿಸುವೆಯಾ?"`,`ಯಾರು: ಸುಭದ್ರೆ; ಯಾರಿಗೆ: ಅಭಿಮನ್ಯುವಿಗೆ.`]]],
[`ಇ. ಹೊಂದಿಸಿ ಬರೆಯಿರಿ`,[[`ಸುಭದ್ರೆ`,`ಅಭಿಮನ್ಯುವಿನ ತಾಯಿ`],[`ಉತ್ತರೆ`,`ಅಭಿಮನ್ಯುವಿನ ಹೆಂಡತಿ`],[`ಸುಮಿತ್ರ`,`ಅಭಿಮನ್ಯುವಿನ ಸಾರಥಿ`],[`ಧರ್ಮರಾಯ`,`ಅಭಿಮನ್ಯುವಿನ ದೊಡ್ಡಪ್ಪ`],[`(ಹೆಚ್ಚುವರಿ) ಅಭಿಮನ್ಯುವಿನ ಗುರು`,`ದ್ರೋಣಾಚಾರ್ಯ ಅಲ್ಲ – ಈ ಪಟ್ಟಿಯಲ್ಲಿ ಹೊಂದಿಸಬೇಕಾದ ಹೆಸರಿಲ್ಲ (ಹೆಚ್ಚುವರಿ ಆಯ್ಕೆ)`]]],
[`ಈ. ಗುಂಪಿಗೆ ಸೇರದ ಪದ ಗುರುತಿಸಿ ಬರೆಯಿರಿ`,[
[`ಧರ್ಮರಾಯ, ಜಯದ್ರಥ, ಭೀಮಸೇನ, ಅರ್ಜುನ`,`ಜಯದ್ರಥ (ಇವನು ಕೌರವರ ಕಡೆಯವನು; ಉಳಿದವರು ಪಾಂಡವರು)`],
[`ವಿಖ್ಯಾತ, ಕುಖ್ಯಾತ, ಹೆಸರುವಾಸಿ, ಪ್ರಸಿದ್ಧಿ`,`ಕುಖ್ಯಾತ (ಕೆಟ್ಟ ಹೆಸರು; ಉಳಿದವು ಒಳ್ಳೆಯ ಹೆಸರು)`],
[`ಸೂರ್ಯ, ರವಿ, ಆರ್ಯ, ದಿನಕರ`,`ಆರ್ಯ (ಉಳಿದವು ಸೂರ್ಯನ ಹೆಸರುಗಳು)`],
[`ಅಭಿಮನ್ಯು, ಉತ್ತರೆ, ಸುಭದ್ರೆ, ಶಕುನಿ`,`ಶಕುನಿ (ಉಳಿದವರು ಅಭಿಮನ್ಯುವಿನ ಕುಟುಂಬದವರು)`]]],
[`ಉ. ಕೊಟ್ಟಿರುವ ಪದ ಬಳಸಿ ಸ್ವಂತ ವಾಕ್ಯ ಬರೆಯಿರಿ`,[
[`ಸಂದೇಹ`,`ಮಾದರಿ: ಯಾವುದೇ ಸಂದೇಹ ಇದ್ದರೆ ಶಿಕ್ಷಕರನ್ನು ಕೇಳಬೇಕು.`],
[`ಜಯಶಾಲಿ`,`ಮಾದರಿ: ಅಭಿಮನ್ಯು ಜಯಶಾಲಿಯಾಗಿ ಬರುವೆನೆಂದು ಹೇಳಿದನು.`],
[`ನಮಸ್ಕರಿಸು`,`ಮಾದರಿ: ಅಭಿಮನ್ಯು ಹಿರಿಯರ ಪಾದಗಳಿಗೆ ನಮಸ್ಕರಿಸಿದನು.`],
[`ವೀರಾವೇಶ`,`ಮಾದರಿ: ಅಭಿಮನ್ಯು ವೀರಾವೇಶದಿಂದ ಹೋರಾಡಿದನು.`]]],
[`ಊ. ಎರಡು–ಮೂರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರ ಬರೆಯಿರಿ`,[
[`ಧರ್ಮರಾಯನು ಚಿಂತಾಕ್ರಾಂತನಾಗಲು ಕಾರಣವೇನು?`,`ದ್ರೋಣಾಚಾರ್ಯರು ರಚಿಸಿದ ಚಕ್ರವ್ಯೂಹವನ್ನು ಭೇದಿಸುವ ವಿದ್ಯೆ ಕೃಷ್ಣ, ಬಲರಾಮ ಮತ್ತು ಅರ್ಜುನರಿಗೆ ಮಾತ್ರ ಗೊತ್ತಿತ್ತು. ಅವರು ಅನಿವಾರ್ಯವಾಗಿ ಸಂಶಪ್ತಕರನ್ನು ಎದುರಿಸಲು ಹೋಗಿದ್ದರು. ಈಗ ಏನು ಮಾಡಬೇಕೆಂಬುದೇ ಧರ್ಮರಾಯನಿಗೆ ದೊಡ್ಡ ಚಿಂತೆಯಾಗಿತ್ತು.`],
[`ಸುಭದ್ರೆ ಅಭಿಮನ್ಯುವನ್ನು ಏನೆಂದು ಹರಸಿದಳು?`,`"ಶ್ರೀಕೃಷ್ಣ ಪರಮಾತ್ಮನ ಕೃಪೆ, ತಂದೆಯ ಶೌರ್ಯ ನಿನ್ನಲ್ಲಿರುವಾಗ ಸಂದೇಹದ ಮಾತೇ ಇಲ್ಲ. ಜಯಶಾಲಿಯಾಗಿ ಬಾ ಮಗನೇ, ನಿನಗೆ ಮಂಗಳವಾಗಲಿ" ಎಂದು ಹರಸಿದಳು.`],
[`ಅಭಿಮನ್ಯು ಉತ್ತರೆಯನ್ನು ಹೇಗೆ ಸಮಾಧಾನಪಡಿಸಿದನು?`,`"ಚಿಂತಿಸಬೇಡ ಉತ್ತರೆ. ನಾನು ಈ ಯುದ್ಧದಲ್ಲಿ ಜಯಶಾಲಿಯಾಗಿ ಹಿಂದಿರುಗುತ್ತೇನೆ. ಧೈರ್ಯಗೆಡದೆ ನಗುಮುಖದಿಂದ ನನ್ನನ್ನು ಕಳಿಸಿಕೊಡು" ಎಂದು ಸಮಾಧಾನಪಡಿಸಿದನು.`],
[`ಅಭಿಮನ್ಯು ಸಾರಥಿಯನ್ನು ಕುರಿತು ಏನು ಹೇಳಿದನು?`,`"ಸುಮಿತ್ರ, ಆದಷ್ಟು ಬೇಗ ನನ್ನನ್ನು ದ್ರೋಣಾಚಾರ್ಯರು ರಚಿಸಿರುವ ಚಕ್ರವ್ಯೂಹದ ಕಡೆ ಕರೆದುಕೊಂಡು ಹೋಗು" ಎಂದನು.`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಅ. ಲೇಖನ ಚಿಹ್ನೆ ಹಾಕಿ ಬರೆಯಿರಿ`,[[`ಹೂದೋಟದಲ್ಲಿ ಎಷ್ಟೊಂದು ಹೂಗಳು ಅರಳಿವೆ …`,`ಹೂದೋಟದಲ್ಲಿ ಎಷ್ಟೊಂದು ಹೂಗಳು ಅರಳಿವೆ! ಕೆಂಪು, ಗುಲಾಬಿ ಬಣ್ಣ ಕಣ್ಣನ್ನು ಸೆಳೆಯುತ್ತಿದೆ. ಏನಿದು ಶಬ್ದ? ಓಹೋ! ಸಂಪಿಗೆಯ ಕಂಪಿಗೆ ದುಂಬಿಗಳು ಝೇಂಕರಿಸುತ್ತಿವೆ. ಮಲ್ಲಿಗೆ, ಜಾಜಿ, ಸುಗಂಧರಾಜ, ಸೂರ್ಯಕಾಂತಿ, ಚೆಂಡು ಹೂ – ಅಬ್ಬಾ! ಬಗೆ ಬಗೆಯ ಹೂಗಳ ಲೋಕವೇ ಇಲ್ಲಿದೆ. (ಆಶ್ಚರ್ಯಸೂಚಕ !, ಪ್ರಶ್ನಾರ್ಥಕ ?, ಅಲ್ಪವಿರಾಮ , ಪೂರ್ಣವಿರಾಮ . ಬಳಸಬೇಕು)`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಆ. ಮಾದರಿಯಂತೆ ಸೂಕ್ತ ಪದ ರಚಿಸಿ (ನೀವು + ಏಕೆ = ನೀವೇಕೆ)`,[[`ನಾವು + ಏಕೆ`,`ನಾವೇಕೆ`],[`ಅವರು + ಏಕೆ`,`ಅವರೇಕೆ`],[`ಅವಳು + ಏಕೆ`,`ಅವಳೇಕೆ`],[`ಅದು + ಏಕೆ`,`ಅದೇಕೆ`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಇ. ಒಗಟು ಬಿಡಿಸಿ ಉತ್ತರ ಬರೆಯಿರಿ`,[
[`ಚೋಟುದ್ದ ಹುಡುಗಿಗೆ ಮಾರುದ್ದ ಜಡೆ`,`ಸೂಜಿ–ದಾರ`],
[`ಹಸಿರು ಗಿಡದ ಮೇಲೆ ಮೊಸರು ಚೆಲ್ಲಿದೆ`,`ಮಲ್ಲಿಗೆ ಹೂ`],
[`ಒಂಟಿ ಕಾಲು ಕೊಕ್ಕರೆ ಒಂಬೈನೂರು ತತ್ತಿ`,`⚠ ಸೂಚಿತ: ಸೂರ್ಯಕಾಂತಿ ಹೂ – ಮಕ್ಕಳೊಂದಿಗೆ ಚರ್ಚಿಸಿ ದೃಢಪಡಿಸಿ.`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಈ. ಅಕ್ಷರ ಚೌಕದಲ್ಲಿ ಮಹಾಭಾರತದ ಪಾತ್ರಗಳು`,[[`ಕಂಡುಹಿಡಿದು ಪಟ್ಟಿ ಮಾಡಿ`,`ಹುಡುಕಬೇಕಾದ ಹೆಸರುಗಳು (ಸೂಚಿತ): ಶಕುನಿ (ಉದಾಹರಣೆ), ಕರ್ಣ, ಅರ್ಜುನ, ಭೀಮ, ದುರ್ಯೋಧನ, ದ್ರೋಣ, ಅಭಿಮನ್ಯು, ಧರ್ಮರಾಯ, ಉತ್ತರೆ – ಚೌಕದಲ್ಲಿ ಹುಡುಕಿ ದೃಢಪಡಿಸಿ.`]]],
[`ಬಳಕೆ ಚಟುವಟಿಕೆ – ಆ. ಪೌರಾಣಿಕ ವೀರ ಬಾಲಕರ ಪರಿಚಯ`,[
[`ಏಕಲವ್ಯ –`,`ಗುರು ದ್ರೋಣಾಚಾರ್ಯರ ಮಣ್ಣಿನ ಪ್ರತಿಮೆಯ ಮುಂದೆ ಸ್ವಯಂ ಅಭ್ಯಾಸ ಮಾಡಿ ಬಿಲ್ವಿದ್ಯೆಯಲ್ಲಿ ನಿಪುಣನಾದ ವೀರ ಬಾಲಕ.`],
[`ಪ್ರಹ್ಲಾದ –`,`ವಿಷ್ಣುಭಕ್ತನಾದ ಬಾಲಕ; ತಂದೆ ಹಿರಣ್ಯಕಶಿಪುವಿನ ಕಿರುಕುಳದ ನಡುವೆಯೂ ಭಕ್ತಿ ಬಿಡಲಿಲ್ಲ.`],
[`ಬಬ್ರುವಾಹನ –`,`ಅರ್ಜುನ–ಚಿತ್ರಾಂಗದೆಯರ ಮಗ; ಮಣಿಪುರದ ವೀರ ರಾಜಕುಮಾರ.`]]]
],
qb:[
M(`ಚಕ್ರವ್ಯೂಹವನ್ನು ರಚಿಸಿದವರು:`,[`ದ್ರೋಣಾಚಾರ್ಯರು`,`ಕರ್ಣ`,`ಭೀಮ`,`ಅರ್ಜುನ`],0),
M(`ಅಭಿಮನ್ಯುವಿನ ತಂದೆ:`,[`ಭೀಮ`,`ಅರ್ಜುನ`,`ಧರ್ಮರಾಯ`,`ಕರ್ಣ`],1),
M(`ಅಭಿಮನ್ಯುವಿನ ಸಾರಥಿಯ ಹೆಸರು:`,[`ಸುಮಿತ್ರ`,`ಸಂಜಯ`,`ಜಯದ್ರಥ`,`ಶಕುನಿ`],0),
M(`'ವದನ' ಪದದ ಅರ್ಥ:`,[`ಕೈ`,`ಮುಖ`,`ಕಾಲು`,`ಕಣ್ಣು`],1),
M(`'ಹೇಡಿ' ಪದದ ಅರ್ಥ:`,[`ಅಂಜುಬುರುಕ`,`ವೀರ`,`ಜಾಣ`,`ಶ್ರೀಮಂತ`],0),
M(`ಅಭಿಮನ್ಯುವಿನ ಹೆಂಡತಿಯ ಹೆಸರು:`,[`ಸುಭದ್ರೆ`,`ಉತ್ತರೆ`,`ದ್ರೌಪದಿ`,`ಕುಂತಿ`],1,'m'),
O(`ಕೌರವರು–ಪಾಂಡವರು ಯಾರಿಂದ ಬಿಲ್ವಿದ್ಯೆ ಕಲಿತರು?`,`ದ್ರೋಣಾಚಾರ್ಯರಿಂದ.`),
O(`ಅಭಿಮನ್ಯುವಿನ ತಾಯಿಯ ಹೆಸರೇನು?`,`ಸುಭದ್ರೆ.`),
O(`ಯುದ್ಧ ಎಲ್ಲಿ ನಡೆಯಿತು?`,`ಕುರುಕ್ಷೇತ್ರದಲ್ಲಿ.`),
O(`ಚಕ್ರವ್ಯೂಹವನ್ನು ಭೇದಿಸುವ ವಿದ್ಯೆ ಯಾರಿಗೆ ಮಾತ್ರ ಗೊತ್ತಿತ್ತು?`,`ಕೃಷ್ಣ, ಬಲರಾಮ ಮತ್ತು ಅರ್ಜುನರಿಗೆ (ಹಾಗೂ ಅಭಿಮನ್ಯುವಿಗೆ).`,'m'),
O(`"ದೊಡ್ಡಪ್ಪ, ನೀವೇಕೆ ಚಿಂತಾಕ್ರಾಂತರಾಗಿರುವಿರಿ?" – ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?`,`ಅಭಿಮನ್ಯು ಧರ್ಮರಾಯನಿಗೆ ಹೇಳಿದನು.`),
O(`"ಏನು ಕಂದಾ! ನೀನು ಯುದ್ಧದಲ್ಲಿ ಚಕ್ರವ್ಯೂಹವನ್ನು ಭೇದಿಸುವೆಯಾ?" – ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?`,`ಸುಭದ್ರೆ ಅಭಿಮನ್ಯುವಿಗೆ ಹೇಳಿದಳು.`),
G(`'ಯುದ್ಧ' ಪದಕ್ಕೆ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಕದನ / ಸಮರ / ಸಂಗ್ರಾಮ`),
G(`'ಸೂರ್ಯ' ಪದಕ್ಕೆ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ರವಿ / ನೇಸರ`),
G(`ಸೇರಿಸಿ ಬರೆಯಿರಿ: ನಾವು + ಏಕೆ =`,`ನಾವೇಕೆ`),
G(`ಸೇರಿಸಿ ಬರೆಯಿರಿ: ಅದು + ಏಕೆ =`,`ಅದೇಕೆ`),
G(`'ಸಂದೇಹ' ಪದದ ಸಮಾನಾರ್ಥಕ ಪದ:`,`ಶಂಕೆ / ಸಂಶಯ`),
G(`ಗುಂಪಿಗೆ ಸೇರದ ಪದ: ಅಭಿಮನ್ಯು, ಉತ್ತರೆ, ಸುಭದ್ರೆ, ಶಕುನಿ`,`ಶಕುನಿ`),
S(`ಧರ್ಮರಾಯನು ಚಿಂತಾಕ್ರಾಂತನಾಗಲು ಕಾರಣವೇನು?`,`ಚಕ್ರವ್ಯೂಹ ಭೇದಿಸುವ ವಿದ್ಯೆ ಕೃಷ್ಣ, ಬಲರಾಮ, ಅರ್ಜುನರಿಗೆ ಮಾತ್ರ ಗೊತ್ತಿತ್ತು; ಅವರು ಸಂಶಪ್ತಕರನ್ನು ಎದುರಿಸಲು ಹೋಗಿದ್ದರು. ಆದ್ದರಿಂದ ಏನು ಮಾಡಬೇಕೆಂಬ ಚಿಂತೆ ಧರ್ಮರಾಯನಿಗೆ ಇತ್ತು.`),
S(`ಸುಭದ್ರೆ ಅಭಿಮನ್ಯುವನ್ನು ಏನೆಂದು ಹರಸಿದಳು?`,`ಶ್ರೀಕೃಷ್ಣನ ಕೃಪೆ, ತಂದೆಯ ಶೌರ್ಯ ಅವನಲ್ಲಿದೆ; ಜಯಶಾಲಿಯಾಗಿ ಬಾ, ಮಂಗಳವಾಗಲಿ ಎಂದು ಹರಸಿದಳು.`),
S(`ಅಭಿಮನ್ಯು ಉತ್ತರೆಯನ್ನು ಹೇಗೆ ಸಮಾಧಾನಪಡಿಸಿದನು?`,`ಚಿಂತಿಸಬೇಡ, ಯುದ್ಧದಲ್ಲಿ ಜಯಶಾಲಿಯಾಗಿ ಹಿಂದಿರುಗುತ್ತೇನೆ, ಧೈರ್ಯಗೆಡದೆ ನಗುಮುಖದಿಂದ ಕಳಿಸಿಕೊಡು ಎಂದು ಸಮಾಧಾನಪಡಿಸಿದನು.`),
S(`ಅಭಿಮನ್ಯು ಸಾರಥಿ ಸುಮಿತ್ರನಿಗೆ ಏನು ಹೇಳಿದನು?`,`ಆದಷ್ಟು ಬೇಗ ದ್ರೋಣಾಚಾರ್ಯರು ರಚಿಸಿರುವ ಚಕ್ರವ್ಯೂಹದ ಕಡೆಗೆ ತನ್ನನ್ನು ಕರೆದುಕೊಂಡು ಹೋಗು ಎಂದು ಹೇಳಿದನು.`),
L(`ಅಭಿಮನ್ಯು ಯುದ್ಧಕ್ಕೆ ಹೋಗಲು ಧರ್ಮರಾಯ–ಭೀಮಸೇನರಿಂದ ಅನುಮತಿ ಪಡೆದ ಸಂದರ್ಭವನ್ನು ವಿವರಿಸಿ.`,`ಚಕ್ರವ್ಯೂಹ ಭೇದಿಸಲು ತನಗೆ ಸಾಧ್ಯವೆಂದೂ, ಅದರ ವಿದ್ಯೆಯನ್ನು ತಾಯಿಯ ಗರ್ಭದಲ್ಲಿರುವಾಗಲೇ ಶ್ರೀಕೃಷ್ಣನಿಂದ ಕೇಳಿ ತಿಳಿದುಕೊಂಡಿರುವೆನೆಂದೂ ಅಭಿಮನ್ಯು ತಿಳಿಸಿದನು. ಧರ್ಮರಾಯನಿಗೆ ಅವನು ಇನ್ನೂ ಮಗು ಎಂಬ ಚಿಂತೆ ಇತ್ತು. ಭೀಮಸೇನನು ಅಭಿಮನ್ಯುವಿನ ಸಾಮರ್ಥ್ಯದ ಬಗ್ಗೆ ಧೈರ್ಯ ತುಂಬಿದನು. ತಾವೆಲ್ಲರೂ ಯುದ್ಧರಂಗದಲ್ಲಿ ರಕ್ಷಾಕವಚದಂತೆ ಇರುವೆವೆಂದು ಹೇಳಿ ಧರ್ಮರಾಯನು ಒಪ್ಪಿಗೆ ನೀಡಿದನು. ಅಭಿಮನ್ಯು ಅವರ ಪಾದಗಳಿಗೆ ನಮಸ್ಕರಿಸಿ ಹೊರಟನು.`),
L(`ಅಭಿಮನ್ಯು ವೀರಮರಣ ಹೊಂದಿದ ಸಂದರ್ಭವನ್ನು ನಿಮ್ಮ ಮಾತುಗಳಲ್ಲಿ ಬರೆಯಿರಿ.`,`ಅಭಿಮನ್ಯು ಸೂರ್ಯನಂತೆ ಪ್ರಕಾಶಿಸುತ್ತಾ ರಥವನ್ನೇರಿ ಯುದ್ಧಭೂಮಿಗೆ ಬಂದು ಚಕ್ರವ್ಯೂಹವನ್ನು ಪ್ರವೇಶಿಸಿದನು. ದ್ರೋಣ, ಕರ್ಣ ಮುಂತಾದ ಕೌರವ ಸೇನಾನಿಗಳು ಒಟ್ಟಾಗಿ ಅವನ ಮೇಲೆ ಬಿದ್ದರು. ಅವನು ವೀರಾವೇಶದಿಂದ ಹೋರಾಡುತ್ತಿದ್ದಾಗ ಕೌರವರು ಹಿಂದಿನಿಂದ ಬಂದು ಅವನ ಕೈಗಳನ್ನು ಕತ್ತರಿಸಿದರು. ಆಗಲೂ ಅಭಿಮನ್ಯು ರಥದ ಚಕ್ರವನ್ನು ಕೈಯಲ್ಲಿ ತಿರುಗಿಸಿ ಹೋರಾಡಿ ವೀರಮರಣ ಹೊಂದಿದನು.`)
]});
LS.push({n:12,t:`ಪ್ರವಾಸ ಹೋಗೋಣ`,au:`ಸಮಿತಿ ರಚನೆ`,pg:21,
words:`ಕಂಪ್ಯೂಟರ್ – ಗಣಕಯಂತ್ರ; ಶೌಚಾಲಯ – ಕಕ್ಕಸುಮನೆ; ಆಲಿಸು – ಮನಸಿಟ್ಟು ಕೇಳು, ಕಿವಿಗೊಟ್ಟು ಕೇಳು; ಫೋಟೋ – ಛಾಯಾಚಿತ್ರ, ಭಾವಚಿತ್ರ; ಆಯಾಸ – ಬಳಲಿಕೆ, ಶ್ರಮ; ಚುಕ್ ಬುಕ್ ಚುಕ್ ಬುಕ್ – ರೈಲಿನ ಶಬ್ದ; ಖುಷಿ – ಸಂತೋಷ; ಹಿಗ್ಗು – ಸಂತೋಷಪಡು; ವ್ಯವಸ್ಥೆ – ಏರ್ಪಾಡು; ಇಚ್ಛೆ – ಅಪೇಕ್ಷೆ, ಆಸೆ`,
notes:`ಟಿಕೆಟ್ – ಪ್ರಯಾಣಕ್ಕಾಗಿ ಹಣಪಡೆದು ಅನುಮತಿ ನೀಡುವ ಚೀಟಿ; ಟಿಕೆಟ್ ಕೌಂಟರ್ – ಟಿಕೆಟ್ ಕೊಡುವ ಜಾಗ; ಫ್ಲಾಟ್‌ಫಾರಂ – ರೈಲು ಬಂದು ನಿಲ್ಲಲು ಮತ್ತು ಹೊರಡಲು ನಿಗದಿಪಡಿಸಿರುವ ಜಾಗ; ಲಗೇಜ್‌ರೂಮ್ – ವಸ್ತುಗಳನ್ನು ಇಡುವ ಕೊಠಡಿ; ಭರತ – ಬಾಹುಬಲಿಯ ಅಣ್ಣ, ಭಾರತವನ್ನಾಳಿದ ಚಕ್ರವರ್ತಿ; ಬಸದಿ – ಜೈನ ದೇವಾಲಯ; ರೈಲು ಕಂಬಿ – ರೈಲು ಹೋಗಲು ಜೋಡಿಸಿರುವ ಕಂಬಿಗಳು; ಅಬ್ಬಬ್ಬಾ – ಆಶ್ಚರ್ಯ ಸೂಚಕ ಶಬ್ದ`,
ab:[
[`ಅ. ಒಂದೊಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರ ಬರೆಯಿರಿ`,[
[`ಮಕ್ಕಳೆಲ್ಲರು ಎಲ್ಲಿಗೆ ಪ್ರವಾಸ ಹೋಗಲು ಸಿದ್ಧರಾದರು?`,`ಮಕ್ಕಳೆಲ್ಲರೂ ಶ್ರವಣಬೆಳಗೊಳಕ್ಕೆ ಪ್ರವಾಸ ಹೋಗಲು ಸಿದ್ಧರಾದರು.`],
[`'ಫ್ಲಾಟ್‌ಫಾರಂ' ಎಂದರೇನು?`,`ರೈಲು ಬಂದು ನಿಲ್ಲಲು ಮತ್ತು ಹೊರಡಲು ನಿಗದಿಪಡಿಸಿರುವ ಸ್ಥಳಕ್ಕೆ ಫ್ಲಾಟ್‌ಫಾರಂ ಎನ್ನುತ್ತಾರೆ.`],
[`ರೈಲ್ವೆ ನಿಲ್ದಾಣದಲ್ಲಿ ಮಕ್ಕಳು ಯಾರ ಜೊತೆ ಸಂವಾದ ನಡೆಸಿದರು?`,`ಶಿಕ್ಷಕರ ಜೊತೆಗೆ ಹಾಗೂ ಶ್ರವಣಬೆಳಗೊಳಕ್ಕೆ ಹೋಗಿ ಬಂದಿದ್ದ ಕೆನಡಿ, ಮಧು, ರಾಜು ಅವರ ಜೊತೆ ಸಂವಾದ ನಡೆಸಿದರು.`],
[`ರೈಲು ಯಾವ ಶಬ್ದ ಮಾಡುತ್ತಾ ಚಲಿಸುತ್ತದೆ?`,`ಚುಕ್ ಬುಕ್ ಚುಕ್ ಬುಕ್ ಎಂದು ಶಬ್ದ ಮಾಡುತ್ತಾ ಚಲಿಸುತ್ತದೆ.`]]],
[`ಆ. ಎರಡು/ಮೂರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರ ಬರೆಯಿರಿ`,[
[`ಬೆಳಗೊಳ ಬೆಟ್ಟದಲ್ಲಿ ಮೂರ್ತಿಗಳನ್ನು ನೋಡುತ್ತಿದ್ದರೆ ಭಕ್ತಿ ಏಕೆ ಉಕ್ಕಿ ಬರುತ್ತದೆ?`,`ಬೆಟ್ಟದಲ್ಲಿ ಭರತ, ಬಾಹುಬಲಿ ಹಾಗೂ ಇತರ ತೀರ್ಥಂಕರರ ಮೂರ್ತಿಗಳಿವೆ. ಅವುಗಳನ್ನು ನೋಡುತ್ತಿದ್ದರೆ ಭಕ್ತಿ ಉಕ್ಕಿ ಬರುತ್ತದೆ. ಆ ಮೂರ್ತಿಗಳ ಮುಖದಲ್ಲಿ ಶಾಂತತೆಯ ಭಾವನೆ ಎದ್ದು ಕಾಣುತ್ತದೆ.`],
[`ರೈಲು ನಿಲ್ದಾಣದಲ್ಲಿ ಏನೇನು ಸೌಲಭ್ಯಗಳಿರುತ್ತವೆ?`,`ರೈಲು ನಿಲ್ದಾಣದಲ್ಲಿ ಪ್ರಯಾಣಿಕರ ಅನುಕೂಲಕ್ಕಾಗಿ ವಿಶ್ರಾಂತಿ ಕೊಠಡಿ, ಲಗೇಜ್ ರೂಮ್, ಶೌಚಾಲಯ, ಕುಡಿಯುವ ನೀರು, ಹೋಟೆಲ್ ಇತ್ಯಾದಿ ವ್ಯವಸ್ಥೆಗಳಿವೆ.`]]],
[`ಇ. ಕೊಟ್ಟಿರುವ ಮಾತನ್ನು ಯಾರು? ಯಾರಿಗೆ ಹೇಳಿದರು?`,[
[`"ನಿಮ್ಮದು ಯಾವೂರು ಮಕ್ಕಳೇ?"`,`ಯಾರು: ಕೆನಡಿ; ಯಾರಿಗೆ: (ಬೆಂಗಳೂರಿನ) ಮಕ್ಕಳಿಗೆ.`],
[`"ಬೆಟ್ಟ ಹತ್ತುವಾಗ ನಿಮಗೆ ಕಷ್ಟ ಅನಿಸಲಿಲ್ಲವೇ?"`,`ಯಾರು: ಮಕ್ಕಳು; ಯಾರಿಗೆ: ಕೆನಡಿ, ಮಧು, ರಾಜು ಅವರಿಗೆ.`],
[`"ಅದೋ ರೈಲು ಬಂದೇ ಬಿಟ್ಟಿತು."`,`ಯಾರು: ಕಾರ್ತಿಕ್; ಯಾರಿಗೆ: ಶಿಕ್ಷಕರು ಮತ್ತು ಸ್ನೇಹಿತರಿಗೆ.`]]],
[`ಈ. ಸರಿಯಾದ ಪದ ಆರಿಸಿ ಬರೆಯಿರಿ`,[
[`ಇವರೆಲ್ಲರೂ ನಮ್ಮಂತೆಯೇ ___ ಹೊರಟಿರುವವರೇ ಗುರುಗಳೇ.`,`ಪ್ರವಾಸಕ್ಕೆ`],[`ಕಂಬಿಗಳ ಮೇಲೆ ___ ಚಲಿಸುತ್ತದೆ.`,`ರೈಲು`],[`ಮೂರ್ತಿಗಳ ಮುಖದಲ್ಲಿ ___ಯ ಭಾವನೆಯು ಎದ್ದು ಕಾಣುತ್ತದೆ.`,`ಶಾಂತತೆ`]]],
[`ಉ. ಸ್ಥಳ ಹಾಗೂ ಸ್ಥಳ ವಿಶೇಷಗಳನ್ನು ಹೊಂದಿಸಿ ಬರೆಯಿರಿ`,[[`ಹಂಪಿ`,`ಕಲ್ಲಿನರಥ`],[`ಶ್ರವಣಬೆಳಗೊಳ`,`ಗೊಮ್ಮಟೇಶ್ವರ ವಿಗ್ರಹ`],[`ವಿಜಯಪುರ`,`ಗೋಲ್‌ಗುಂಬಜ್`],[`ಬೆಂಗಳೂರು`,`ವಿಧಾನಸೌಧ`],[`(ಹೆಚ್ಚುವರಿ)`,`ತಾಜ್‌ಮಹಲ್ – ಇಲ್ಲಿ ಹೊಂದಿಕೆಯಾಗುವುದಿಲ್ಲ`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಅ. ಪ್ರಶ್ನಾರ್ಥಕ ವಾಕ್ಯ ರಚಿಸಿ`,[
[`ಮಕ್ಕಳು ಮೈಸೂರಿಗೆ ಪ್ರವಾಸ ಹೋದರು.`,`ಮಕ್ಕಳು ಯಾವ ಊರಿಗೆ ಪ್ರವಾಸ ಹೋದರು?`],
[`ರೈಲುಗಳು ಕಂಬಿಗಳ ಮೇಲೆ ಚಲಿಸುತ್ತವೆ.`,`ರೈಲುಗಳು ಯಾವುದರ ಮೇಲೆ ಚಲಿಸುತ್ತವೆ?`],
[`ಮೇರಿ ನಾಲ್ಕನೆಯ ತರಗತಿಯಲ್ಲಿ ಓದುತ್ತಿದ್ದಾಳೆ.`,`ಮೇರಿ ಯಾವ ತರಗತಿಯಲ್ಲಿ ಓದುತ್ತಿದ್ದಾಳೆ?`]]],
[`ಆ. ಕೊಟ್ಟಿರುವ ಪದ ಬಳಸಿ ಸ್ವಂತ ವಾಕ್ಯ ಬರೆಯಿರಿ (ಮಾದರಿ ಉತ್ತರ)`,[
[`ಪ್ರವಾಸ`,`ನಮ್ಮ ಶಾಲೆಯ ಮಕ್ಕಳು ಶ್ರವಣಬೆಳಗೊಳಕ್ಕೆ ಪ್ರವಾಸ ಹೋದರು.`],[`ಸಂಭಾಷಣೆ`,`ಮಕ್ಕಳು ಶಿಕ್ಷಕರೊಂದಿಗೆ ಸಂಭಾಷಣೆ ನಡೆಸಿದರು.`],[`ಅದ್ಭುತ`,`ಗೊಮ್ಮಟೇಶ್ವರ ವಿಗ್ರಹ ಅದ್ಭುತವಾಗಿದೆ.`],[`ನಮಸ್ಕರಿಸು`,`ಮಕ್ಕಳು ಅತಿಥಿಗಳಿಗೆ ನಮಸ್ಕರಿಸಿದರು.`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಇ. ಸ್ವೀಕೃತ (ಬಳಕೆಯಲ್ಲಿರುವ ಇಂಗ್ಲಿಷ್ ಮೂಲದ) ಪದಗಳ ರೂಪ ಗಮನಿಸಿ`,[[`ಪ್ಲೇಟ್, ಕ್ಲಾಸ್, ಫ್ಲಾಟ್‌ಫಾರಂ, ಕ್ಲಾರ್ಕ್, ಸ್ಟೂಲ್, ಟಿಕೆಟ್‌ಕೌಂಟರ್, ಲಗೇಜ್‌ರೂಮ್, ಫೋಟೋ, ಬ್ಯಾಗ್, ಕಂಪ್ಯೂಟರ್, ಸ್ಕೂಲ್, ಪೋಲೀಸ್, ರೈಲ್, ಡ್ರೆಸ್, ಇಂಜಿನಿಯರ್, ಡಾಕ್ಟರ್, ಕಂಡಕ್ಟರ್, ಡ್ರೈವರ್`,`ಇವು ಇಂಗ್ಲಿಷ್ ಭಾಷೆಯಿಂದ ಕನ್ನಡಕ್ಕೆ ಬಂದು ಬಳಕೆಯಾಗುತ್ತಿರುವ ಸ್ವೀಕೃತ ಪದಗಳು (ಕನ್ನಡ ಲಿಪಿಯಲ್ಲಿ ಬರೆಯುವ ರೀತಿ ಗಮನಿಸಬೇಕು).`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಈ. ಮಾದರಿಯಂತೆ ಸೂಕ್ತ ಪದ ರಚಿಸಿ (ಕೇಳು – ಕೇಳಿಯಾನು – ಕೇಳಿಯಾರು)`,[[`ಹೇಳು`,`ಹೇಳಿಯಾನು – ಹೇಳಿಯಾರು`],[`ಹೋಗು`,`ಹೋದಾನು – ಹೋದಾರು`],[`ಬೇಡು`,`ಬೇಡಿಯಾನು – ಬೇಡಿಯಾರು`],[`ಮಾಡು`,`ಮಾಡಿಯಾನು – ಮಾಡಿಯಾರು`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಉ. ಪದ ಬಳ್ಳಿ ರಚಿಸಿ (ಮರ–ರಸ–ಸರ–ರಥ: ಕೊನೆಯ ಅಕ್ಷರದಿಂದ ಮುಂದಿನ ಪದ)`,[[`ಜನಕ`,`ಜನಕ – ಕಮಲ – ಲತೆ – ತರು (ಸೂಚಿತ)`],[`ವನಜ`,`ವನಜ – ಜಲ – ಲವಣ – ಣ… (ಸೂಚಿತ: ವನಜ – ಜಲ – ಲಯ – ಯತಿ)`],[`ಭವನ`,`ಭವನ – ನವಿಲು – ಲತೆ – ತರು (ಸೂಚಿತ)`]]],
[`ಬಳಕೆ ಚಟುವಟಿಕೆ – ೪. ಯಾರು–ಯಾವ ಮಾತನ್ನು ಹೇಳಿರಬಹುದು? ಹೊಂದಿಸಿ`,[
[`ಶಿಕ್ಷಕ`,`ಈ ಪಾಠ ಓದಿಕೊಂಡು ಬನ್ನಿ`],[`ದರ್ಜಿ`,`ನಿಮಗೆ ಅಂಗಿ ಹೊಲಿಯಲು 2 ಮೀಟರ್ ಬಟ್ಟೆ ಬೇಕು`],[`ರೈತ`,`ಹೊಲಕ್ಕೆ ಮಧ್ಯಾಹ್ನ ಬುತ್ತಿ ತಾ`],[`ವೈದ್ಯೆ`,`ನಿಮಗೆ ಎಷ್ಟು ದಿನಗಳಿಂದ ಜ್ವರವಿದೆ?`],[`ಹೂವಾಡಗಿತ್ತಿ`,`ಮಾರಿಗೆ ಹತ್ತು ರೂಪಾಯಿ`]]],
[`ಬಳಕೆ ಚಟುವಟಿಕೆ – ೧–೩, ೫ (ಚಟುವಟಿಕೆ ಆಧಾರಿತ)`,[[`ಪ್ರವಾಸದಲ್ಲಿ ನೋಡಿದ ಸ್ಥಳಗಳ ಪಟ್ಟಿ; ವಾಹನಗಳ ಚಿತ್ರಕೋಶ; ವೈದ್ಯ–ರೋಗಿ ಹಾಗೂ ಕಂಡಕ್ಟರ್–ಪ್ರಯಾಣಿಕ ಸಂಭಾಷಣೆ; ಅಂತ್ಯಾಕ್ಷರಿ`,`ವೈದ್ಯ–ರೋಗಿ ಮಾದರಿ: ವೈದ್ಯ: ನಿಮಗೆ ಏನು ತೊಂದರೆ? ರೋಗಿ: ಎರಡು ದಿನದಿಂದ ಜ್ವರ ಇದೆ. ವೈದ್ಯ: ಈ ಮಾತ್ರೆ ತೆಗೆದುಕೊಳ್ಳಿ. ರೋಗಿ: ಧನ್ಯವಾದಗಳು. | ಕಂಡಕ್ಟರ್: ಎಲ್ಲಿಗೆ ಟಿಕೆಟ್? ಪ್ರಯಾಣಿಕ: ಮೈಸೂರಿಗೆ ಒಂದು ಟಿಕೆಟ್ ಕೊಡಿ. ಕಂಡಕ್ಟರ್: ಹಣ ಕೊಡಿ.`]]]
],
qb:[
M(`ಮಕ್ಕಳು ಪ್ರವಾಸ ಹೋಗಲು ಆರಿಸಿದ ಸ್ಥಳ:`,[`ಹಂಪಿ`,`ಶ್ರವಣಬೆಳಗೊಳ`,`ವಿಜಯಪುರ`,`ಮೈಸೂರು`],1),
M(`ರೈಲು ಚಲಿಸುವ ಶಬ್ದ:`,[`ಚುಕ್ ಬುಕ್ ಚುಕ್ ಬುಕ್`,`ಟಣ್ ಟಣ್`,`ಭೋಂ ಭೋಂ`,`ಕಿರ್ ಕಿರ್`],0),
M(`ರೈಲು ಬಂದು ನಿಲ್ಲಲು ನಿಗದಿಪಡಿಸಿರುವ ಸ್ಥಳ:`,[`ಲಗೇಜ್ ರೂಮ್`,`ಫ್ಲಾಟ್‌ಫಾರಂ`,`ಟಿಕೆಟ್ ಕೌಂಟರ್`,`ಹೋಟೆಲ್`],1),
M(`ರೈಲು ಚಲಿಸುವುದು ಯಾವುದರ ಮೇಲೆ?`,[`ರಸ್ತೆ`,`ಕಂಬಿಗಳು`,`ನೀರು`,`ಗಾಳಿ`],1),
M(`'ಶೌಚಾಲಯ' ಪದದ ಅರ್ಥ:`,[`ಕಕ್ಕಸುಮನೆ`,`ಅಡುಗೆಮನೆ`,`ಪೂಜಾಮನೆ`,`ಓದುವ ಕೊಠಡಿ`],0),
M(`ಬಾಹುಬಲಿಯ ಅಣ್ಣನ ಹೆಸರು:`,[`ಭರತ`,`ರಾಮ`,`ಲಕ್ಷ್ಮಣ`,`ಭೀಮ`],0,'m'),
O(`ಶ್ರವಣಬೆಳಗೊಳದ ವಿಶೇಷ ಯಾವುದು?`,`ಗೊಮ್ಮಟೇಶ್ವರ (ಬಾಹುಬಲಿ) ವಿಗ್ರಹ.`),
O(`ಟಿಕೆಟ್ ಕೌಂಟರ್‌ನಲ್ಲಿ ಟಿಕೆಟ್ ಹೇಗೆ ನೀಡುತ್ತಾರೆ?`,`ಕಂಪ್ಯೂಟರ್ ಮೂಲಕ ಕೇಳಿದ ಸ್ಥಳಗಳಿಗೆ ಟಿಕೆಟ್ ನೀಡುತ್ತಾರೆ.`),
O(`ಯಾವ ರೈಲು ಯಾವ ಫ್ಲಾಟ್‌ಫಾರಂನಲ್ಲಿ ನಿಲ್ಲುತ್ತದೆ ಎಂದು ಹೇಗೆ ತಿಳಿಯಬಹುದು?`,`ಧ್ವನಿವರ್ಧಕದಲ್ಲಿ ಪ್ರಕಟಣೆ ಹಾಗೂ ಸೂಚನಾ ಫಲಕದಿಂದ ತಿಳಿಯಬಹುದು.`),
O(`ಮಕ್ಕಳು ಹತ್ತಬೇಕಾದ ರೈಲು ಎಷ್ಟನೆಯ ಫ್ಲಾಟ್‌ಫಾರಂನಲ್ಲಿ ನಿಲ್ಲುತ್ತದೆ?`,`ನಾಲ್ಕನೆಯ ಫ್ಲಾಟ್‌ಫಾರಂನಲ್ಲಿ.`),
O(`ಕೆನಡಿ, ಮಧು, ರಾಜು ಎಲ್ಲಿಂದ ಬಂದಿದ್ದರು?`,`ಶ್ರವಣಬೆಳಗೊಳಕ್ಕೆ ಹೋಗಿ ಬಂದಿದ್ದರು.`),
O(`ಬೇಗಂ ರೈಲು ಕಂಬಿಗಳ ಬಗ್ಗೆ ಏನು ಕೇಳಿದಳು? (ಕಬ್ಬಿಣದ ಕಂಬಿಗಳನ್ನು ಏಕೆ ಜೋಡಿಸಿದ್ದಾರೆ?)`,`ರೈಲು ಚಲಿಸಲು ಕಂಬಿಗಳನ್ನು ಜೋಡಿಸಿರುತ್ತಾರೆ ಎಂದು ತಿಳಿಯಿತು.`,'m'),
G(`'ಆಯಾಸ' ಪದಕ್ಕೆ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಬಳಲಿಕೆ / ಶ್ರಮ`),
G(`'ಖುಷಿ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಸಂತೋಷ`),
G(`'ಫೋಟೋ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಛಾಯಾಚಿತ್ರ / ಭಾವಚಿತ್ರ`),
G(`ಪ್ರಶ್ನಾರ್ಥಕ ವಾಕ್ಯ ಮಾಡಿ: ವಿಧಾನಸೌಧ ಬೆಂಗಳೂರಿನಲ್ಲಿದೆ.`,`ವಿಧಾನಸೌಧ ಯಾವ ಊರಿನಲ್ಲಿದೆ?`),
G(`'ಕೇಳು' ಪದದ ರೂಪ (ಕೇಳು–ಕೇಳಿಯಾನು–?)`,`ಕೇಳಿಯಾರು`),
G(`ಸ್ಥಳದೊಂದಿಗೆ ಹೊಂದಿಸಿ: ವಿಜಯಪುರ –`,`ಗೋಲ್‌ಗುಂಬಜ್`),
S(`ಬೆಳಗೊಳ ಬೆಟ್ಟದಲ್ಲಿ ಮೂರ್ತಿಗಳನ್ನು ನೋಡಿದಾಗ ಭಕ್ತಿ ಏಕೆ ಉಕ್ಕಿ ಬರುತ್ತದೆ?`,`ಅಲ್ಲಿ ಭರತ, ಬಾಹುಬಲಿ ಹಾಗೂ ತೀರ್ಥಂಕರರ ಮೂರ್ತಿಗಳಿವೆ. ಅವುಗಳ ಮುಖದಲ್ಲಿ ಶಾಂತತೆಯ ಭಾವನೆ ಎದ್ದು ಕಾಣುವುದರಿಂದ ಭಕ್ತಿ ಉಕ್ಕಿ ಬರುತ್ತದೆ.`),
S(`ರೈಲು ನಿಲ್ದಾಣದಲ್ಲಿ ಇರುವ ಸೌಲಭ್ಯಗಳನ್ನು ಬರೆಯಿರಿ.`,`ವಿಶ್ರಾಂತಿ ಕೊಠಡಿ, ಲಗೇಜ್ ರೂಮ್, ಶೌಚಾಲಯ, ಕುಡಿಯುವ ನೀರು, ಹೋಟೆಲ್ ಇತ್ಯಾದಿ.`),
S(`ರೈಲು ಹೋಗಲು ಕಂಬಿಗಳು ಏಕೆ ಬೇಕು?`,`ರೈಲು ಕಂಬಿಗಳ ಮೇಲೆಯೇ ಚಲಿಸುತ್ತದೆ. ಬಸ್ಸುಗಳಂತೆ ರಸ್ತೆಯಲ್ಲಿ ಚಲಿಸುವುದಿಲ್ಲ; ಆದ್ದರಿಂದ ರೈಲಿಗೆ ಕಂಬಿಗಳು ಬೇಕೇಬೇಕು.`),
S(`ಟಿಕೆಟ್ ಕೌಂಟರ್‌ನಲ್ಲಿ ಟಿಕೆಟ್ ಪಡೆಯುವ ವಿಧಾನ ತಿಳಿಸಿ.`,`ಟಿಕೆಟ್ ಕೌಂಟರ್‌ನ ಸಾಲಿನಲ್ಲಿ ನಿಂತು, ಹೋಗಬೇಕಾದ ಸ್ಥಳ ತಿಳಿಸಬೇಕು. ಅಲ್ಲಿ ಕುಳಿತಿರುವವರು ಕಂಪ್ಯೂಟರ್ ಮೂಲಕ ಆ ಸ್ಥಳಕ್ಕೆ ಟಿಕೆಟ್ ನೀಡುತ್ತಾರೆ.`),
L(`ಶಿಕ್ಷಕರು ಮಕ್ಕಳಿಗೆ ರೈಲು ನಿಲ್ದಾಣದಲ್ಲಿ ತಿಳಿಸಿದ ವಿಷಯಗಳನ್ನು ಬರೆಯಿರಿ.`,`ಟಿಕೆಟ್ ಕೌಂಟರ್‌ನಲ್ಲಿ ಕಂಪ್ಯೂಟರ್ ಮೂಲಕ ಬೇರೆ ಬೇರೆ ಸ್ಥಳಗಳಿಗೆ ಟಿಕೆಟ್ ಕೊಡುತ್ತಾರೆ. ಬೇರೆ ಬೇರೆ ರೈಲುಗಳಿಗೆ ನಿಗದಿತ ಫ್ಲಾಟ್‌ಫಾರಂಗಳಿರುತ್ತವೆ; ರೈಲು ಬಂದು ನಿಲ್ಲಲು ಮತ್ತು ಹೊರಡಲು ನಿಗದಿಪಡಿಸಿದ ಸ್ಥಳವೇ ಫ್ಲಾಟ್‌ಫಾರಂ. ಧ್ವನಿವರ್ಧಕದ ಮೂಲಕ ಹಾಗೂ ಫಲಕದಲ್ಲಿ ಮಾಹಿತಿ ತಿಳಿಸುತ್ತಾರೆ. ಪ್ರಯಾಣಿಕರಿಗಾಗಿ ವಿಶ್ರಾಂತಿ ಕೊಠಡಿ, ಲಗೇಜ್ ರೂಮ್, ಶೌಚಾಲಯ, ಕುಡಿಯುವ ನೀರು, ಹೋಟೆಲ್ ವ್ಯವಸ್ಥೆ ಇದೆ. ರೈಲು ಕಬ್ಬಿಣದ ಕಂಬಿಗಳ ಮೇಲೆ ಚಲಿಸುತ್ತದೆ.`),
L(`ಕೆನಡಿ, ಮಧು, ರಾಜು ಅವರು ತಮ್ಮ ಪ್ರವಾಸದ ಬಗ್ಗೆ ಮಕ್ಕಳಿಗೆ ಏನು ಹೇಳಿದರು?`,`ಅವರು ಶ್ರವಣಬೆಳಗೊಳಕ್ಕೆ ಹೋಗಿ ಬಂದಿದ್ದರು. ಅಲ್ಲಿನ ಏಕಶಿಲಾ ಗೊಮ್ಮಟಮೂರ್ತಿ ಹಾಗೂ ಬೆಟ್ಟದ ಮೇಲಿಂದ ಕಾಣುವ ಪ್ರಕೃತಿ ಸೌಂದರ್ಯ ನೋಡಲು ಎರಡು ಕಣ್ಣುಗಳು ಸಾಲದು ಎಂದರು. ಬೆಟ್ಟ ಹತ್ತುವಾಗ ಹುಮ್ಮಸ್ಸಿನಲ್ಲಿ ಕಷ್ಟ ಗೊತ್ತಾಗಲಿಲ್ಲ; ಸುಮಾರು 630 ಮೆಟ್ಟಿಲುಗಳಿವೆ. ಬೆಳಗೊಳ ಬೆಟ್ಟದಲ್ಲಿ ಭರತ, ಬಾಹುಬಲಿ ಹಾಗೂ ತೀರ್ಥಂಕರರ ಮೂರ್ತಿಗಳಿವೆ; ಮುಖದಲ್ಲಿ ಶಾಂತತೆಯ ಭಾವನೆ ಎದ್ದು ಕಾಣುತ್ತದೆ ಎಂದರು.`,'h')
]});

LS.push({n:13,t:`ಬಾವಿಯಲ್ಲಿ ಚಂದ್ರ (ಪದ್ಯ)`,au:`ಬಿ.ಎಂ. ಶರ್ಮ`,pg:31,
words:`ತಿಂಗಳು – ಚಂದ್ರ; ತಿಂಗಳು ಬೆಳಕು – ಹುಣ್ಣಿಮೆಯ ಬೆಳಕು; ಬಿಂಬ – ನೀರಿನಲ್ಲಿ ಅಥವಾ ಕನ್ನಡಿಯಲ್ಲಿ ಕಾಣುವ ನಮ್ಮ ರೂಪ; ಕೊಕ್ಕೆ – ಯಾವುದನ್ನಾದರೂ ಹಿಡಿದು ಎಳೆಯಲು ಬಳಸುವ ಲೋಹ ಅಥವಾ ಮರದ ಸಾಧನ; ರಭಸ – ವೇಗ; ಆಗಸ – ಆಕಾಶ, ಬಾನು; ಮೆಲ್ಲನೆ – ನಿಧಾನವಾಗಿ`,
notes:`ಗಾದೆ: ಸರಿಯಾಗಿ ಯೋಚಿಸಿ ಕೆಲಸ ಮಾಡಬೇಕು. ಪದ್ಯದಲ್ಲಿ ಗೋಪಿ (ತಂಗಿ) ಮತ್ತು ಪುಟ್ಟು (ಅಣ್ಣ) ಪಾತ್ರಗಳು.`,
ab:[
[`ಅ. ಒಂದೊಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರ ಬರೆಯಿರಿ`,[
[`ಗೋಪಿ, ಪುಟ್ಟು ಬಾವಿಯಲ್ಲಿ ಏನು ನೋಡಿದರು?`,`ಬಾವಿಯಲ್ಲಿ ಚಂದ್ರನ ಬಿಂಬವನ್ನು ನೋಡಿದರು.`],
[`ಕೊಕ್ಕೆಯನ್ನು ಏಕೆ ತಂದರು?`,`ಬಾವಿಗೆ ಬಿದ್ದನೆಂದು ಭಾವಿಸಿದ ಚಂದ್ರನನ್ನು ಮೇಲಕ್ಕೆ ಎತ್ತಲು ತಂದರು.`],
[`ಪುಟ್ಟು ಏಕೆ ಬಿದ್ದನು?`,`ಕೊಕ್ಕೆ ಕಲ್ಲಿಗೆ ಸಿಕ್ಕಿ ಬಲವಾಗಿ ಎಳೆದಾಗ ಹಗ್ಗ ತುಂಡಾಗಿ ಎಳೆತದ ರಭಸಕ್ಕೆ ಪುಟ್ಟು ಬಿದ್ದನು.`],
[`ಚಂದ್ರನು ಎಲ್ಲಿದ್ದನು?`,`ಚಂದ್ರನು ಆಕಾಶದಲ್ಲಿದ್ದನು.`],
[`ತಾಯಿಗೆ ಪುಟ್ಟು ಏಕೆ ಅಂಜಿದನು?`,`ಈ ವಿಷಯ ಅಮ್ಮನಿಗೆ ಗೊತ್ತಾದರೆ ಬೈಯುವಳು (ಕೆಟ್ಟೆ) ಎಂದು ಅಂಜಿದನು.`]]],
[`ಆ. ಎರಡು–ಮೂರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರ ಬರೆಯಿರಿ`,[
[`ಬಾವಿಯಲ್ಲಿ ಚಂದ್ರನ ಬಿಂಬ ನೋಡಿದಾಗ ಪುಟ್ಟು ಏನು ಮಾಡಿದನು?`,`ಚಂದ್ರನು ಬಾವಿಗೆ ಬಿದ್ದನೆಂದು ಭಾವಿಸಿ "ಅಯ್ಯೋ ಪಾಪವೇ!" ಎನ್ನುತ್ತಾ ಕೊಕ್ಕೆಯನ್ನು ಹುಡುಕಿದನು. ಚಂದ್ರನನ್ನು ಎತ್ತಲು ಬಾವಿಯ ಹಗ್ಗಕ್ಕೆ ಕೊಕ್ಕೆ ಕಟ್ಟಿ ತಂಗಿಯನ್ನು ದೂರದಲ್ಲಿ ನಿಲ್ಲಿಸಿ ಹಗ್ಗವನ್ನು ಬಾವಿಗೆ ಇಳಿಸಿದನು.`],
[`ಬಾವಿಗೆ ಕೊಕ್ಕೆ ಇಳಿಸಿ ಎಳೆದಾಗ ಏನಾಯಿತು?`,`ಹಗ್ಗದ ಕೊಕ್ಕೆ ಕಲ್ಲಿಗೆ ಸಿಕ್ಕಿತು. "ಚಂದ್ರ ಸಿಕ್ಕೇ ಸಿಕ್ಕ" ಎನ್ನುತ್ತಾ ಬಲವಾಗಿ ಎಳೆದಾಗ ಹಗ್ಗ ತುಂಡಾಯಿತು. ಎಳೆತದ ರಭಸಕ್ಕೆ ಪುಟ್ಟು ಬಿದ್ದನು.`]]],
[`ಇ. ವಾಕ್ಯಗಳನ್ನು ಸರಿಪಡಿಸಿ ಬರೆಯಿರಿ`,[
[`ಪುಟ್ಟುವು ಎಳೆತದ ಬಿದ್ದ ರಭಸಕೆ.`,`ಎಳೆತದ ರಭಸಕೆ ಪುಟ್ಟುವು ಬಿದ್ದ.`],
[`ಗೊತ್ತಾದರೆ ಕೆಟ್ಟೆ ಅಮ್ಮಗೆ ನಾ.`,`ಅಮ್ಮಗೆ ಗೊತ್ತಾದರೆ ನಾ ಕೆಟ್ಟೆ.`],
[`ಮನೆ ಮೆಲ್ಲನೆ ನೋಡುತಲೆದ್ದ ಕಡೆ.`,`ಮೆಲ್ಲನೆ ಮನೆ ಕಡೆ ನೋಡುತಲೆದ್ದ.`],
[`ಬಾವಿಗೆ ಎಂದು ಚಂದ್ರನು ಬಿದ್ದನು.`,`ಚಂದ್ರನು ಬಾವಿಗೆ ಬಿದ್ದನು ಎಂದು.`]]],
[`ಈ. ಪದ್ಯವನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ (ಬಿಟ್ಟ ಪದಗಳು)`,[[`ಹಗ್ಗದ ಕೊಕ್ಕೆಯು ___ / ___ ಸಿಕ್ಕೇ ಸಿಕ್ಕ / ಎನ್ನುತ ___ / ___ ತುಂಡಾಯ್ತು`,`ಕಲ್ಲಿಗೆ ಸಿಕ್ಕಿ; ಪುಟ್ಟುವು ಚಂದ್ರನು; ತುಂಬಾ ಬಲದಿಂದೆಳೆಯ; ಹಗ್ಗವು`]]],
[`ಉ. ಮೂರು ಅಕ್ಷರದ ಪದಗಳನ್ನು ಹುಡುಕಿ ಬರೆಯಿರಿ`,[[`ಪದ್ಯದಲ್ಲಿ ಬರುವ ಮೂರಕ್ಷರದ ಪದಗಳು`,`ತಿಂಗಳು, ಬೆಳಕಿನ, ಇರುಳಿನ, ಅಮ್ಮನು, ಕೊಕ್ಕೆಯ, ಚಂದ್ರನು, ಬಾವಿಯ, ಹಗ್ಗದ, ಬಿಂಬವ, ತಂಗಿಗೆ, ಆಗಸ (ಯಾವುದಾದರೂ)`]]],
[`ಊ. 'ಚ' ಅಕ್ಷರದಿಂದ ಪ್ರಾರಂಭವಾಗುವ ಪದಗಳು`,[
[`ಸುರುಳಿಯಾಕಾರದಂತಿರುವ ಎಣ್ಣೆಯಲ್ಲಿ ಕರೆದ ತಿಂಡಿ`,`ಚಕ್ಕುಲಿ`],[`ಅನ್ನ ತಿನ್ನಲು ನೀನಿದನ್ನು ಬಳಸುತ್ತೀಯ`,`ಚಮಚ`],[`ನಾಲ್ಕು ಸೈನ್ಯಬಲದೊಂದಿಗೆ ಆಡುವ ಒಳಾಂಗಣ ಆಟ`,`ಚದುರಂಗ`],[`ಗಾಂಧೀಜಿಯವರು ಸ್ವಾತಂತ್ರ್ಯಕ್ಕಾಗಿ ಮಾಡಿದ ಮುಷ್ಕರ`,`ಚಳವಳಿ`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಅ. ಮಾದರಿಯಂತೆ ಸೂಕ್ತ ಪದ (ಮರ + ಗಳು = ಮರಗಳು)`,[[`ಮನೆ + ಗಳು`,`ಮನೆಗಳು`],[`ಚಿತ್ರ + ಗಳು`,`ಚಿತ್ರಗಳು`],[`ಹಕ್ಕಿ + ಗಳು`,`ಹಕ್ಕಿಗಳು`],[`ಪುಸ್ತಕ + ಗಳು`,`ಪುಸ್ತಕಗಳು`],[`ನದಿ + ಗಳು`,`ನದಿಗಳು`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಆ. ಒತ್ತಕ್ಷರ ಪದಗಳನ್ನು ಪಟ್ಟಿಮಾಡಿ`,[[`ಪದ್ಯದಲ್ಲಿ ಬರುವ ಒತ್ತಕ್ಷರ ಪದಗಳು`,`ಚಂದ್ರ, ಕೊಕ್ಕೆ, ಹಗ್ಗ, ಪುಟ್ಟು, ಸಿಕ್ಕೇ, ಅಮ್ಮ, ಕೆಟ್ಟೆ, ಬದುಕಿಸಿಕೊಟ್ಟೆ, ಎತ್ತಲಿಕೆಂದು, ತುಂಡಾಯ್ತು`]]],
[`ಬಳಕೆ ಚಟುವಟಿಕೆ – ಅ. ಅ ಮತ್ತು ಆ ಪಟ್ಟಿ ಜೋಡಿಸಿ ಸಾಲುಗಳನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ`,[[`ತಿಂಗಳು ಬೆಳಕಿನ`,`ಇರುಳಿನಲಂದು`],[`ಚಂದ್ರನ ಮೇಲಕೆ`,`ಎತ್ತಲಿಕೆಂದು`],[`ಪುಟ್ಟುವು ಚಂದ್ರನು`,`ಸಿಕ್ಕೇ ಸಿಕ್ಕ`],[`ತಂಗಿಗೆ ಆಗಸ`,`ತೋರುತಲೆಂದ`],[`ನಮ್ಮಯ ದೇವರ`,`ಬದುಕಿಸಿಕೊಟ್ಟೆ`]]],
[`ಬಳಕೆ ಚಟುವಟಿಕೆ – ಆ. "ದುಡುಕಿದರೆ ಫಲವಿಲ್ಲ" ಅರ್ಥದ ಗಾದೆ ಮಾತುಗಳು`,[[`ಇದೇ ಅರ್ಥದ ಗಾದೆಗಳು`,`ಆತುರಗಾರನಿಗೆ ಬುದ್ಧಿ ಮಟ್ಟ; ಅವಸರವೇ ಅಪಘಾತಕ್ಕೆ ಕಾರಣ; ಆತುರ ಬಿದ್ದರೆ ಕೇಡು (ಸೂಚಿತ)`]]],
[`ಯೋಚಿಸಿ ಉತ್ತರಿಸಿ (ಚಿತ್ರ ರಚನೆ)`,[[`ರಾತ್ರಿಯ ಆಗಸದಲ್ಲಿ ಮೂಡಿರುವ ಚಂದ್ರ, ತಾರೆಗಳು, ತಿಂಗಳ ಬೆಳಕಿನಲ್ಲಿ ಕಾಣುವ ಗಿಡಮರಬಳ್ಳಿಗಳ ಚಿತ್ರ ಬರೆಯಿರಿ`,`ವಿದ್ಯಾರ್ಥಿಗಳ ಸ್ವಂತ ಚಿತ್ರ ರಚನೆ ಚಟುವಟಿಕೆ.`]]]
],
qb:[
M(`'ತಿಂಗಳು' ಪದದ ಅರ್ಥ ಇಲ್ಲಿ:`,[`ಸೂರ್ಯ`,`ಚಂದ್ರ`,`ನಕ್ಷತ್ರ`,`ಭೂಮಿ`],1),
M(`'ಆಗಸ' ಪದಕ್ಕೆ ಸಮಾನಾರ್ಥಕ ಪದ:`,[`ಬಾನು`,`ನೆಲ`,`ನೀರು`,`ಬೆಂಕಿ`],0),
M(`'ರಭಸ' ಎಂದರೆ:`,[`ನಿಧಾನ`,`ವೇಗ`,`ಭಯ`,`ದುಃಖ`],1),

M(`ಪದ್ಯವನ್ನು ಬರೆದವರು:`,[`ಬಿ.ಎಂ. ಶರ್ಮ`,`ಸರ್ವಜ್ಞ`,`ಕುವೆಂಪು`,`ವಿ.ಬಿ. ಕುಳಮರ್ವ`],0),
M(`ಬಾವಿಯಲ್ಲಿ ಕಂಡದ್ದು:`,[`ಚಂದ್ರನ ಬಿಂಬ`,`ಮೀನು`,`ಹಾವು`,`ಗೋಪಿಯ ಅಮ್ಮ`],0),
O(`ಬಾವಿಗೆ ಕೊಕ್ಕೆ ಇಳಿಸಿದವರು ಯಾರು?`,`ಪುಟ್ಟು (ಗೋಪಿ ಜೊತೆ).`),
O(`ಚಂದ್ರ ನಿಜವಾಗಿ ಎಲ್ಲಿದ್ದನು?`,`ಆಕಾಶದಲ್ಲಿ.`),
O(`ಹಗ್ಗ ತುಂಡಾದಾಗ ಪುಟ್ಟು ಏನಾದನು?`,`ಹಿಂದಕ್ಕೆ ಬಿದ್ದನು.`),
O(`ಪುಟ್ಟು ಚಂದ್ರನನ್ನು ಬದುಕಿಸಿದೆನೆಂದು ಯಾರಿಗೆ ಹೇಳಿದನು?`,`ತಂಗಿ ಗೋಪಿಗೆ.`),
O(`ಅಮ್ಮನಿಗೆ ಗೊತ್ತಾದರೆ ಏನಾಗುತ್ತದೆ ಎಂದು ಪುಟ್ಟು ಹೇಳಿದನು?`,`ನಾನು ಕೆಟ್ಟೆ (ಬೈಗುಳ ತಿನ್ನಬೇಕಾಗುತ್ತದೆ) ಎಂದನು.`),

G(`ಬಹುವಚನ ರೂಪ ಬರೆಯಿರಿ: ಹಕ್ಕಿ`,`ಹಕ್ಕಿಗಳು`),
G(`ಬಹುವಚನ ರೂಪ ಬರೆಯಿರಿ: ನದಿ`,`ನದಿಗಳು`),
G(`'ಚ' ಅಕ್ಷರದಿಂದ ಆರಂಭವಾಗುವ ಎಣ್ಣೆಯಲ್ಲಿ ಕರೆದ ಸುರುಳಿ ತಿಂಡಿ:`,`ಚಕ್ಕುಲಿ`),
G(`ಗುಂಪಿಗೆ ಸೇರದ ಪದ: ಚಂದ್ರ, ತಿಂಗಳು, ಬಾನು, ತಾರೆ (ಚಂದ್ರನ ಹೆಸರುಗಳು)`,`ತಾರೆ`),
G(`'ಕೊಕ್ಕೆ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಯಾವುದನ್ನಾದರೂ ಹಿಡಿದು ಎಳೆಯಲು ಬಳಸುವ ಸಾಧನ`),
S(`ಕೊಕ್ಕೆಯನ್ನು ಏಕೆ ತಂದರು?`,`ಬಾವಿಯಲ್ಲಿ ಬಿದ್ದ ಚಂದ್ರನನ್ನು ಮೇಲಕ್ಕೆ ಎತ್ತಲು ಕೊಕ್ಕೆಯನ್ನು ತಂದರು.`),
S(`ಹಗ್ಗ ತುಂಡಾದಾಗ ಏನಾಯಿತು?`,`ಎಳೆತದ ರಭಸಕ್ಕೆ ಪುಟ್ಟು ಹಿಂದಕ್ಕೆ ಬಿದ್ದನು. ಅವನು ಮೆಲ್ಲನೆ ಮನೆ ಕಡೆ ನೋಡಿ ಎದ್ದನು.`),
S(`ಪುಟ್ಟು ತಂಗಿಗೆ ಏನು ಹೇಳಿದನು?`,`ಆಗಸ ತೋರಿಸಿ "ಗೋಪೀ ನೋಡಲ್ಲಿ! ಚಂದ್ರನನ್ನು ಮೇಲಕ್ಕೆ ಏರಿಸಿಬಿಟ್ಟೆ, ನಮ್ಮ ದೇವರನ್ನು ಬದುಕಿಸಿಕೊಟ್ಟೆ" ಎಂದನು.`),
S(`ಪುಟ್ಟು ತಾಯಿಗೆ ಏಕೆ ಹೆದರಿದನು?`,`ಅಮ್ಮನಿಗೆ ಗೊತ್ತಾದರೆ ತಾನು ಕೆಟ್ಟೆ (ಬೈಯ್ಯುವಳು) ಎಂದು ಹೆದರಿದನು.`),
L(`ಈ ಪದ್ಯದ ಕಥೆಯನ್ನು ನಿಮ್ಮ ಮಾತಿನಲ್ಲಿ ಬರೆಯಿರಿ.`,`ತಿಂಗಳ ಬೆಳಕಿನ ರಾತ್ರಿ ಅಮ್ಮ ಕೆಲಸದಲ್ಲಿರುವಾಗ ಗೋಪಿ ಮತ್ತು ಪುಟ್ಟು ಹೊರಗೆ ಬಂದು ಬಾವಿಯಲ್ಲಿ ಇಣುಕಿದರು. ಅಲ್ಲಿ ಚಂದ್ರನ ಬಿಂಬ ಕಂಡು ಚಂದ್ರ ಬಾವಿಗೆ ಬಿದ್ದನೆಂದು ತಿಳಿದರು. ಕೊಕ್ಕೆಯನ್ನು ಹಗ್ಗಕ್ಕೆ ಕಟ್ಟಿ ಬಾವಿಗೆ ಇಳಿಸಿದರು. ಕೊಕ್ಕೆ ಕಲ್ಲಿಗೆ ಸಿಕ್ಕಿತು; ಚಂದ್ರ ಸಿಕ್ಕಿದ ಎಂದು ಬಲವಾಗಿ ಎಳೆಯಲು ಹಗ್ಗ ತುಂಡಾಗಿ ಪುಟ್ಟು ಬಿದ್ದನು. ಅವನು ಎದ್ದು ಆಕಾಶದಲ್ಲಿದ್ದ ಚಂದ್ರನನ್ನು ತಂಗಿಗೆ ತೋರಿಸಿ ತಾನು ಚಂದ್ರನನ್ನು ಬದುಕಿಸಿದೆನೆಂದು ಹೇಳಿದನು. ಅಮ್ಮನಿಗೆ ಗೊತ್ತಾದರೆ ಬೈಯುವಳೆಂದು ಹೆದರಿದನು.`),
L(`ಈ ಪದ್ಯದಿಂದ ನಮಗೆ ಏನು ತಿಳಿಯುತ್ತದೆ? (ಗಾದೆ ಆಧಾರಿತ)`,`ಬಾವಿಯಲ್ಲಿ ಕಂಡದ್ದು ಚಂದ್ರನ ಬಿಂಬ ಮಾತ್ರ ಎಂಬುದನ್ನು ಅರಿಯದೆ ಮಕ್ಕಳು ದುಡುಕಿ ಕೆಲಸ ಮಾಡಿದರು. ಯಾವುದೇ ಕೆಲಸವನ್ನು ಸರಿಯಾಗಿ ಯೋಚಿಸಿ, ಅರ್ಥಮಾಡಿಕೊಂಡು ಮಾಡಬೇಕು; ದುಡುಕಿದರೆ ಫಲವಿಲ್ಲ ಎಂಬುದನ್ನು ಈ ಪದ್ಯ ತಿಳಿಸುತ್ತದೆ.`)
]});

LS.push({n:14,t:`ಹುತಾತ್ಮ ಬಾಲಕ`,au:`ಸಮಿತಿ ರಚನೆ`,pg:38,
words:`ತ್ಯಾಗ – ತೊರೆಯುವಿಕೆ, ಬಿಡುವುದು; ತೊಲಗು – ಬಿಟ್ಟುಹೋಗು; ಘೋಷಣೆ – ಗಟ್ಟಿಯಾಗಿ ಕೂಗು; ಬಯಲು – ವಿಶಾಲವಾದ ಜಾಗ; ಪ್ರತಿಭಟನೆ – ವಿರೋಧ; ಕಾಂತಿ – ಬೆಳಕು; ಹರಸು – ಆಶೀರ್ವದಿಸು; ಚತುರ – ಜಾಣ; ಆಗಮನ – ಬರುವಿಕೆ; ಸುಳಿವು – ಕುರುಹು, ಗುರುತು; ತೊಯ್ದ – ಒದ್ದೆಯಾದ; ಮೃತ್ಯು – ಸಾವು; ಅಹಿಂಸೆ – ಹಿಂಸೆ ಮಾಡದಿರುವುದು; ಹೇಡಿ – ಅಂಜುಬುರುಕ, ಕೈಲಾಗದವ; ನಿರಂಕುಶ – ಯಾರ ಅಂಕೆಗೂ ಒಳಪಡದ; ತಾರಕ ಸ್ವರ – ಏರುಧ್ವನಿ, ಗಟ್ಟಿಯಾಗಿ, ಜೋರಾಗಿ`,
notes:`ಪ್ರಾಣಾರ್ಪಣೆ – ಒಳ್ಳೆಯ ಕಾರ್ಯಕ್ಕಾಗಿ ಪ್ರಾಣ ತ್ಯಾಗ ಮಾಡುವುದು; ಹುತಾತ್ಮ – ದೇಶ ಹಿತ, ಜನತೆಯ ಹಿತ ಇತ್ಯಾದಿ ಧ್ಯೇಯ ಸಾಧನೆಗಾಗಿ ಪ್ರಾಣವನ್ನು ಅರ್ಪಿಸುವವ; ಚಿರಸ್ಥಾಯಿ – ಹೆಚ್ಚು ಕಾಲ ಇರುವುದು; ಸ್ವರಾಜ್ಯ – ಸ್ವತಂತ್ರವಾದ ರಾಜ್ಯ, ಯಾರ ಅಧೀನಕ್ಕೂ ಒಳಪಡದ ರಾಜ್ಯ. ಘೋಷಣೆ: ಸ್ವಾತಂತ್ರ್ಯ ಜೀವನ ಬದುಕಿಗೆ ಸಾಧನ.`,
ab:[
[`ಅ. ಒಂದೊಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರ ಬರೆಯಿರಿ`,[
[`ಬ್ರಿಟಿಷರಿಗೆ ಭಾರತವನ್ನು ಬಿಟ್ಟು ತೊಲಗಿ ಎಂದು ಎಚ್ಚರಿಕೆ ಕೊಟ್ಟವರು ಯಾರು?`,`ಗಾಂಧೀಜಿಯವರು.`],
[`ಹುಬ್ಬಳ್ಳಿಯ ಜನತೆಗೆ ಪ್ರಮುಖವಾಗಿದ್ದ ದಿನ ಯಾವುದು?`,`1942ರ ಆಗಸ್ಟ್ 15 (ಸ್ವಾತಂತ್ರ್ಯ ಹೋರಾಟದ ಮೆರವಣಿಗೆಗೆ ಸಿದ್ಧತೆ ನಡೆದ ದಿನ).`],
[`ನಾರಾಯಣನ ತಾಯಿ ಏನೆಂದು ಮಗನನ್ನು ಹರಸಿದಳು?`,`"ದೇವರು ನಿನಗೆ ಒಳ್ಳೆಯದನ್ನು ಮಾಡಲಿ" ಎಂದು ಹರಸಿದಳು.`],
[`ನಾರಾಯಣನು ಕೂಗಿದ ಘೋಷಣೆ ಯಾವುದು?`,`"ಬ್ರಿಟಿಷರೇ, ಭಾರತ ಬಿಟ್ಟು ತೊಲಗಿ" ಎಂಬ ಘೋಷಣೆ.`],
[`ಸಾವಿನ ಅಂಚಿನಲ್ಲಿದ್ದ ಬಾಲಕ ಏನನ್ನು ಕೇಳಿದ?`,`ಬ್ರಿಟಿಷ್ ಅಧಿಕಾರಿ "ನಿನಗೆ ಏನು ಬೇಕು?" ಎಂದಾಗ 'ಸ್ವರಾಜ್ಯ' ಎಂದು ಉತ್ತರಿಸಿದನು.`]]],
[`ಆ. ಎರಡು–ಮೂರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರ ಬರೆಯಿರಿ`,[
[`ಬಾಲಕ ನಾರಾಯಣ ಮುಂಜಾನೆ ಎದ್ದು ಹೇಗೆ ಸಿದ್ಧನಾದನು?`,`ನಾರಾಯಣ ಮುಂಜಾನೆ ಬೇಗನೆ ಎದ್ದು ಸ್ನಾನ ಮಾಡಿ ಕೈಯಲ್ಲೇ ನೇಯ್ದ ಖಾದಿ ಚಡ್ಡಿ, ಅಂಗಿ ಮತ್ತು ಗಾಂಧಿ ಟೋಪಿ ಧರಿಸಿದನು. ಮನೆಯ ಬೀರುವಿನಲ್ಲಿದ್ದ ತ್ರಿವರ್ಣ ಧ್ವಜವನ್ನು ತೆಗೆದು ಬೊಂಬಿಗೆ ಕಟ್ಟಿ ಮೆರವಣಿಗೆಗೆ ಹೊರಡಲು ಸಿದ್ಧನಾದನು.`],
[`ನಾರಾಯಣನ ತಾಯಿ ಏಕೆ ಅಚ್ಚರಿಗೊಂಡಳು?`,`"ಹಿರಿಯರು, ಕಿರಿಯರು ಎನ್ನುವುದು ಮುಖ್ಯವಲ್ಲ; ಭಾರತ ಮಾತೆಯ ಸೇವೆಯನ್ನು ಹೇಗೆ ಮಾಡುತ್ತೇವೆ ಎನ್ನುವುದೇ ಮುಖ್ಯ" ಎಂಬ ಮಗನ ಮಾತು ಕೇಳಿ ಅಚ್ಚರಿಗೊಂಡಳು.`],
[`ಪೊಲೀಸರು ಸಿಟ್ಟಿನಿಂದ ಏಕೆ ಕುದಿಯುತ್ತಿದ್ದರು?`,`ಜನರು ಬ್ರಿಟಿಷರ ವಿರುದ್ಧ ಘೋಷಣೆ ಕೂಗುತ್ತಾ ಹೋರಾಟಕ್ಕೆ ಇಳಿದಿದ್ದರಿಂದ ಹಾಗೂ ಪ್ರತಿಭಟನೆ ತೀವ್ರವಾಗಿದ್ದರಿಂದ ಸಿಟ್ಟಿನಿಂದ ಕುದಿಯುತ್ತಿದ್ದರು.`]]],
[`ಇ. ಈ ಮಾತನ್ನು ಯಾರು? ಯಾರಿಗೆ ಹೇಳಿದರು?`,[
[`"ಎಲ್ಲಿಗೆ ಹೋಗುತ್ತಿರುವೆ ಮಗು?"`,`ಯಾರು: ನಾರಾಯಣನ ತಾಯಿ; ಯಾರಿಗೆ: ನಾರಾಯಣನಿಗೆ.`],
[`"ಅಮ್ಮಾ, ಹಿರಿಯರು ಮತ್ತು ಕಿರಿಯರು ಎನ್ನುವುದು ಮುಖ್ಯವಲ್ಲ"`,`ಯಾರು: ನಾರಾಯಣ; ಯಾರಿಗೆ: ತಾಯಿಗೆ.`],
[`"ನಿನಗೆ ಏನು ಬೇಕು?"`,`ಯಾರು: ಬ್ರಿಟಿಷ್ ಅಧಿಕಾರಿ (ಆಂಗ್ಲ ಅಧಿಕಾರಿ); ಯಾರಿಗೆ: ನಾರಾಯಣನಿಗೆ.`]]],
[`ಈ. ಸ್ವಂತ ವಾಕ್ಯ ರಚಿಸಿ (ಮಾದರಿ ಉತ್ತರ)`,[
[`ಘೋಷಣೆ`,`ಜನರು ಬ್ರಿಟಿಷರ ವಿರುದ್ಧ ಘೋಷಣೆ ಕೂಗಿದರು.`],[`ಅಹಿಂಸೆ`,`ಗಾಂಧೀಜಿ ಅಹಿಂಸೆಯನ್ನು ಬೋಧಿಸಿದರು.`],[`ಜೋರಾಗಿ`,`ನಾರಾಯಣ ಜೋರಾಗಿ ಘೋಷಣೆ ಕೂಗಿದನು.`],[`ಆಶ್ಚರ್ಯ`,`ತಾಯಿ ಮಗನ ಮಾತು ಕೇಳಿ ಆಶ್ಚರ್ಯಪಟ್ಟಳು.`],[`ಮೆರವಣಿಗೆ`,`ಹುಬ್ಬಳ್ಳಿಯಲ್ಲಿ ದೊಡ್ಡ ಮೆರವಣಿಗೆ ನಡೆಯಿತು.`]]],
[`ಉ. ಶಬ್ದಕೋಶದಿಂದ ಅರ್ಥ ಬರೆಯಿರಿ`,[[`ನೆರವು`,`ಸಹಾಯ, ಬೆಂಬಲ`],[`ಹರಸು`,`ಆಶೀರ್ವದಿಸು`],[`ಅದ್ಭುತ`,`ಆಶ್ಚರ್ಯ, ವಿಸ್ಮಯ`],[`ಕಸುಬು`,`ಕೆಲಸ, ಉದ್ಯೋಗ`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಅ. ವಿರುದ್ಧಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ`,[[`ಅಹಿಂಸೆ ×`,`ಹಿಂಸೆ`],[`ಕಿರಿಯ ×`,`ಹಿರಿಯ`],[`ಸಾಧ್ಯ ×`,`ಅಸಾಧ್ಯ`],[`ಬೇಕು ×`,`ಬೇಡ`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಆ. ಪದ ಬಿಡಿಸಿ ಬರೆಯಿರಿ (ಧೈರ್ಯವಂತ = ಧೈರ್ಯ + ವಂತ)`,[[`ಗುಣವಂತ`,`ಗುಣ + ವಂತ`],[`ಶೌರ್ಯವಂತ`,`ಶೌರ್ಯ + ವಂತ`],[`ಶಕ್ತಿವಂತ`,`ಶಕ್ತಿ + ವಂತ`],[`ಬುದ್ಧಿವಂತ`,`ಬುದ್ಧಿ + ವಂತ`],[`ಹಣವಂತ`,`ಹಣ + ವಂತ`]]],
[`ಬಳಕೆ ಚಟುವಟಿಕೆ – ಅ. ಸಮಾನಾರ್ಥಕ ಪದಗಳ ಜೋಡಿ`,[[`ಆಶ್ಚರ್ಯ`,`ವಿಸ್ಮಯ, ಬೆರಗು, ಅಚ್ಚರಿ`],[`ಕಾಡು`,`ಅಡವಿ, ಅರಣ್ಯ, ಕಾನನ`],[`ಸುಳಿವು`,`ಗುರುತು, ಕುರುಹು`]]],
[`ಅಕ್ಷರ ಬಂಧ / ಜಾಣ ಮರಿ`,[[`ಅಕ್ಷರ ಬಳಸಿ ಪದ ರಚಿಸಿ (ಡೆ, ಣ, ರ, ನೆ, ವು)`,`ಚಟುವಟಿಕೆ ಆಧಾರಿತ – ಶಿಕ್ಷಕರ ಸಹಾಯದಿಂದ ಪದಬಂಧ ಪೂರ್ಣಗೊಳಿಸಿ (ಉದಾ: ನೆನಪು, ಸಾವು, ಹರಣ…) ⚠ ಪಾಠಪುಸ್ತಕದ ಚೌಕ ನೋಡಿ ದೃಢಪಡಿಸಿ.`]]]
],
qb:[
M(`ನಾರಾಯಣ ಮಹಾದೇವ ದೋನಿ ಯಾವ ಊರಿನವನು?`,[`ಹುಬ್ಬಳ್ಳಿ`,`ಮೈಸೂರು`,`ಧಾರವಾಡ`,`ಬೆಂಗಳೂರು`],0),
M(`'ಬ್ರಿಟಿಷರೇ, ಭಾರತ ಬಿಟ್ಟು ತೊಲಗಿ' – ಈ ಘೋಷಣೆಯನ್ನು ಕೂಗಿದವನು:`,[`ನಾರಾಯಣ`,`ಗಾಂಧೀಜಿ`,`ನೆಹರೂ`,`ತಂದೆ`],0),
M(`'ಹುತಾತ್ಮ' ಎಂದರೆ:`,[`ದೇಶಕ್ಕಾಗಿ ಪ್ರಾಣವನ್ನು ಅರ್ಪಿಸಿದವ`,`ಶ್ರೀಮಂತ`,`ಸೈನಿಕ`,`ರಾಜ`],0),
M(`'ಅಹಿಂಸೆ' ಪದದ ಅರ್ಥ:`,[`ಹಿಂಸೆ ಮಾಡದಿರುವುದು`,`ಯುದ್ಧ`,`ಸಾವು`,`ಕೋಪ`],0),
M(`'ಸ್ವರಾಜ್ಯ' ಎಂದರೆ:`,[`ಸ್ವತಂತ್ರವಾದ ರಾಜ್ಯ`,`ಪರದೇಶ`,`ಅರಮನೆ`,`ಕೋಟೆ`],0),
M(`ನಾರಾಯಣ ಧರಿಸಿದ್ದ ಟೋಪಿ:`,[`ಗಾಂಧಿ ಟೋಪಿ`,`ಕಿರೀಟ`,`ಪೇಟ`,`ಹ್ಯಾಟ್`],0,'m'),
O(`ಗಾಂಧೀಜಿ ಬ್ರಿಟಿಷರಿಗೆ ಅಂತಿಮ ಎಚ್ಚರಿಕೆ ಕೊಟ್ಟ ವರ್ಷ ಯಾವುದು?`,`1942.`,'m'),
O(`ನಾರಾಯಣನ ತಾಯಿ ಅವನಿಗೆ ಏನೆಂದು ಹರಸಿದಳು?`,`"ದೇವರು ನಿನಗೆ ಒಳ್ಳೆಯದನ್ನು ಮಾಡಲಿ" ಎಂದು.`),
O(`ನಾರಾಯಣನು ಮನೆಯ ಬೀರುವಿನಿಂದ ಏನನ್ನು ತೆಗೆದನು?`,`ತ್ರಿವರ್ಣ ಧ್ವಜವನ್ನು.`),
O(`ಸಾವಿನ ಅಂಚಿನಲ್ಲಿದ್ದ ನಾರಾಯಣ ಏನನ್ನು ಬಯಸಿದನು?`,`ಸ್ವರಾಜ್ಯವನ್ನು.`),
O(`ನಾರಾಯಣನ ಮೇಲೆ ಗುಂಡು ಹಾರಿಸಿದವರು ಯಾರು?`,`ಪೊಲೀಸರು.`),
O(`ಮೆರವಣಿಗೆ ಯಾವ ಸ್ಥಳದಲ್ಲಿ ಸೇರಿತ್ತು?`,`ದುರ್ಗದ ಬಯಲು ಚೌಕದಲ್ಲಿ.`),
G(`'ಅಹಿಂಸೆ' ಪದದ ವಿರುದ್ಧಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಹಿಂಸೆ`),
G(`'ಕಿರಿಯ' ಪದದ ವಿರುದ್ಧಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಹಿರಿಯ`),
G(`'ಸಾಧ್ಯ' ಪದದ ವಿರುದ್ಧಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಅಸಾಧ್ಯ`),
G(`'ಹರಸು' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಆಶೀರ್ವದಿಸು`),
G(`ಬಿಡಿಸಿ ಬರೆಯಿರಿ: ಬುದ್ಧಿವಂತ`,`ಬುದ್ಧಿ + ವಂತ`),
G(`'ಆಶ್ಚರ್ಯ' ಪದಕ್ಕೆ ಒಂದು ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಅಚ್ಚರಿ / ವಿಸ್ಮಯ / ಬೆರಗು`),
S(`ನಾರಾಯಣನ ತಾಯಿ ಅಚ್ಚರಿಗೊಂಡದ್ದು ಏಕೆ?`,`ಭಾರತ ಮಾತೆಯ ಸೇವೆ ಮುಖ್ಯ, ಹಿರಿಯ–ಕಿರಿಯ ಮುಖ್ಯವಲ್ಲ ಎಂಬ ಮಗನ ಮಾತು ಕೇಳಿ ಅಚ್ಚರಿಗೊಂಡಳು.`),
S(`ನಾರಾಯಣ ಮೆರವಣಿಗೆಗೆ ಹೇಗೆ ಸಿದ್ಧನಾದನು?`,`ಬೇಗ ಎದ್ದು ಸ್ನಾನ ಮಾಡಿ ಖಾದಿ ಚಡ್ಡಿ, ಅಂಗಿ, ಗಾಂಧಿ ಟೋಪಿ ಧರಿಸಿ ತ್ರಿವರ್ಣ ಧ್ವಜವನ್ನು ಬೊಂಬಿಗೆ ಕಟ್ಟಿಕೊಂಡನು.`),
S(`ಪೊಲೀಸರು ಏಕೆ ಸಿಟ್ಟಿನಿಂದ ಕುದಿಯುತ್ತಿದ್ದರು?`,`ಜನರು ಬ್ರಿಟಿಷರ ವಿರುದ್ಧ ಘೋಷಣೆ ಕೂಗಿ ಹೋರಾಟಕ್ಕೆ ಇಳಿದಿದ್ದರಿಂದ ಸಿಟ್ಟಿನಿಂದ ಕುದಿಯುತ್ತಿದ್ದರು.`),
S(`ನಾರಾಯಣ ಬ್ರಿಟಿಷ್ ಅಧಿಕಾರಿಗೆ ಏನೆಂದು ಉತ್ತರಿಸಿದನು?`,`ಅಧಿಕಾರಿ "ನಿನಗೆ ಏನು ಬೇಕು?" ಎಂದು ಕೇಳಿದಾಗ ಸಾವಿನ ಅಂಚಿನಲ್ಲೂ ನಾರಾಯಣ 'ಸ್ವರಾಜ್ಯ' ಎಂದು ಉತ್ತರಿಸಿದನು.`),
L(`ಬಾಲಕ ನಾರಾಯಣನ ಧೈರ್ಯ ಮತ್ತು ತ್ಯಾಗವನ್ನು ನಿಮ್ಮ ಮಾತಿನಲ್ಲಿ ವಿವರಿಸಿ.`,`ಹುಬ್ಬಳ್ಳಿಯ ಹದಿಮೂರು ವರ್ಷದ ವಿದ್ಯಾರ್ಥಿ ನಾರಾಯಣ ಮಹಾದೇವ ದೋನಿ ಕ್ವಿಟ್ ಇಂಡಿಯಾ ಚಳವಳಿಯ ಮೆರವಣಿಗೆಯಲ್ಲಿ ತಾಯಿಯ ಆಶೀರ್ವಾದ ಪಡೆದು ಭಾಗವಹಿಸಿದನು. ಮುಂದೆ ನಿಂತು ತಾರಕ ಸ್ವರದಲ್ಲಿ "ಬ್ರಿಟಿಷರೇ, ಭಾರತ ಬಿಟ್ಟು ತೊಲಗಿ" ಎಂದು ಘೋಷಣೆ ಕೂಗಿದನು. ಪೊಲೀಸರ ಗುಂಡು ತಗುಲಿ ನೆಲಕ್ಕುರುಳಿದರೂ ಬ್ರಿಟಿಷ್ ಅಧಿಕಾರಿ ಏನು ಬೇಕೆಂದು ಕೇಳಿದಾಗ 'ಸ್ವರಾಜ್ಯ' ಎಂದು ಉತ್ತರಿಸಿ ಕೊನೆಯುಸಿರೆಳೆದನು. ಅವನ ಧೈರ್ಯ ಅಪ್ರತಿಮ; ಅವನು ಹುತಾತ್ಮನಾದನು.`),
L(`ನಾರಾಯಣನ ಮತ್ತು ಅವನ ತಾಯಿಯ ನಡುವಿನ ಸಂಭಾಷಣೆಯನ್ನು ಬರೆಯಿರಿ.`,`ತಾಯಿ: ಎಲ್ಲಿಗೆ ಹೋಗುತ್ತಿರುವೆ ಮಗು? ನಾರಾಯಣ: ಅಮ್ಮಾ, ಬ್ರಿಟಿಷರ ವಿರುದ್ಧ ಪ್ರತಿಭಟನಾ ಮೆರವಣಿಗೆ ನಡೆಯುತ್ತಿದೆ; ಅದನ್ನು ಕೂಡಿಕೊಳ್ಳಲು ಹೋಗುತ್ತಿದ್ದೇನೆ. ತಾಯಿ: ಮಗು, ನೀನು ಇನ್ನೂ ಕಿರಿಯವ; ದೊಡ್ಡವರ ಮೆರವಣಿಗೆಯಲ್ಲಿ ಹೇಗೆ ಸೇರಲು ಸಾಧ್ಯ? ನಾರಾಯಣ: ಅಮ್ಮಾ, ಹಿರಿಯರು ಕಿರಿಯರು ಎನ್ನುವುದು ಮುಖ್ಯವಲ್ಲ; ಭಾರತ ಮಾತೆಯ ಸೇವೆಯನ್ನು ಹೇಗೆ ಮಾಡುತ್ತೇವೆ ಎನ್ನುವುದೇ ಮುಖ್ಯ. ತಾಯಿ ಅಚ್ಚರಿಗೊಂಡು, ಮುತ್ತಿಟ್ಟು "ದೇವರು ನಿನಗೆ ಒಳ್ಳೆಯದನ್ನು ಮಾಡಲಿ" ಎಂದು ಹರಸಿ ಕಳಿಸಿದಳು.`)
]});
LS.push({n:15,t:`ದುಡಿಮೆಯ ಗರಿಮೆ (ಪದ್ಯ)`,au:`ವಿ.ಬಿ. ಕುಳಮರ್ವ`,pg:44,
words:`ದುಡಿಮೆ – ಕೆಲಸ, ಸಂಪಾದನೆ; ಗರಿಮೆ – ಹೆಮ್ಮೆ, ಹಿರಿಮೆ; ಕಸುಬು – ಕೆಲಸ, ಉದ್ಯೋಗ; ರೈತ – ಬೇಸಾಯ ಮಾಡುವವನು; ನೆರವು – ಸಹಾಯ, ಬೆಂಬಲ, ಆಧಾರ; ಸಲಹು – ಕಾಪಾಡು, ರಕ್ಷಿಸು; ಹಣ – ದುಡ್ಡು, ಧನ; ದಾತ – ದಾನಿ; ಒಡೆಯ; ಸಂಜೆ – ಸಾಯಂಕಾಲ, ಸೂರ್ಯ ಮುಳುಗುವ ಸಮಯ; ಕೊಯ್ – ಕತ್ತರಿಸು, ಸೀಳು; ಹುಡುಕು – ಶೋಧಿಸು, ಅರಸು; ತವಕಿಸು – ಆತುರಪಡು; ಹಲ – ನೇಗಿಲು; ಮೆಚ್ಚುಗೆ – ಒಪ್ಪಿಗೆ, ಸಂತೋಷ; ಇರಿಸು – ಇಡು, ಹೇರು; ಕಲುಷಿತ – ಕದಡಿದ, ಮಲಿನ; ವಸನ – ಬಟ್ಟೆ; ಉಡುಗೆ – ಉಡುಪು`,
notes:`ಹಾರೆ – ಒಂದು ಬಗೆಯ ಕಬ್ಬಿಣದ ಉಪಕರಣ; ಸಂತೆ – ನಿಯಮಿತ ಕಾಲಾವಧಿಗೆ ಕೊಡುಕೊಳ್ಳುವುದಕ್ಕಾಗಿ ಸೇರುವ ಜನರ ಗುಂಪು, ಮಾರಾಟದ ಪೇಟೆ; ನೇಗಿಲು – ಭೂಮಿಯನ್ನು ಉಳುವ ಸಾಧನ. ಘೋಷವಾಕ್ಯ: ವೃತ್ತಿ ನಿರತ ವ್ಯಕ್ತಿ, ನಾಡಿಗವನೇ ಶಕ್ತಿ. ಪದ್ಯದಲ್ಲಿ ಬರುವ ಕಸುಬುದಾರರು: ಕಮ್ಮಾರ, ಬಡಗಿ, ಅಗಸ, ಬೆಸ್ತ, ದರ್ಜಿ.`,
ab:[
[`ಅ. ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರ ಬರೆಯಿರಿ`,[
[`ಕಬ್ಬಿಣದಿಂದ ತಯಾರಿಸುವ ಸಲಕರಣೆಗಳು ಯಾವುವು?`,`ಹಾರೆ (ಕಮ್ಮಾರನು ಕಬ್ಬಿಣ ಕುಟ್ಟಿ ಹಾರೆಯನ್ನು ಮಾಡಿ ರೈತನಿಗೆ ಕೊಡುತ್ತಾನೆ).`],
[`ಜನರನ್ನು ಸಲಹುವ ದಾತ ಯಾರು?`,`ರೈತ.`],
[`ನೊಗವನ್ನು ಯಾವುದರಿಂದ ಮಾಡುವರು?`,`ಮರದಿಂದ (ಕಾಡಿನ ಒಣಮರದಿಂದ) ಮಾಡುವರು.`],
[`ಮೀನನ್ನು ಹೇಗೆ ಹಿಡಿಯುವರು?`,`ಕಡಲಲ್ಲಿ ಬಲೆಯನ್ನು ಬೀಸಿ ಮೀನನ್ನು ಹಿಡಿಯುವರು.`]]],
[`ಆ. ಎರಡು–ಮೂರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರ ಬರೆಯಿರಿ`,[
[`ಬಳಗದ ಮೆಚ್ಚುಗೆಯನ್ನು ಬಟ್ಟೆ ಹೊಲಿಯುವವರು ಹೇಗೆ ಗಳಿಸಬಹುದು?`,`ದರ್ಜಿಯು ಹೊಸ ಹೊಸ ಬಗೆಯಲ್ಲಿ ಉಡುಗೆಗಳನ್ನು ಹೊಲಿದು, ಜನರ ಮೈ–ಮನಗಳನ್ನು ಬೆಳಗಿಸುವ ಮೂಲಕ ಅಪ್ಪ, ಅಮ್ಮ, ಮಕ್ಕಳ ಬಳಗದ ಮೆಚ್ಚುಗೆಯನ್ನು ಗಳಿಸಬಹುದು.`],
[`'ನೇಗಿಲನ್ನು' ಹೇಗೆ ಮಾಡುವರು?`,`ಬಡಗಿಯು ಕಾಡನ್ನು ಸೇರಿ ಒಣಮರವನ್ನು ಹುಡುಕಿ, ನೇಗಿಲ ಅಳತೆಗೆ ಕೊಯ್ದು ಉತ್ತಮ ನೇಗಿಲನ್ನು ಮಾಡುವನು.`]]],
[`ಇ. ಸರಿಯಾದ ಪದ ಆರಿಸಿ ಬರೆಯಿರಿ (ಕಾರ್ಮಿಕ, ಕತ್ತೆ, ರೈತ, ಬಲೆ, ಮರ)`,[
[`ಜನರನ್ನು ಸಲಹುವವನು ___`,`ರೈತ`],[`ನೊಗವನ್ನು ___ ದಿಂದ ಮಾಡುತ್ತಾರೆ`,`ಮರ`],[`ಬಟ್ಟೆಯ ಗಂಟನ್ನು ___ ಹೊರುತ್ತದೆ`,`ಕತ್ತೆ`],[`ಮೀನನ್ನು ಹಿಡಿಯಲು ___ ಬಳಸುತ್ತಾರೆ`,`ಬಲೆ`]]],
[`ಈ. ಪದ್ಯದ ಮುಂದಿನ ಸಾಲುಗಳನ್ನು ಬರೆದು ಪೂರ್ಣಗೊಳಿಸಿ`,[[`ಹೊಸ ಹೊಸ ಬಗೆಯಲಿ ___ / ___ ಬೆಳಗಿಸುವೆ / ಅಪ್ಪನ ಅಮ್ಮನ ___ / ___ ತವಕಿಸುವೆ`,`ಉಡುಗೆಯ ಹೊಲಿಯುತ; ಮೈಯನು ಮನವನು; ಮಕ್ಕಳ ಬಳಗದ; ಮೆಚ್ಚುಗೆ ಗಳಿಸಲು`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಅ. ವಿರುದ್ಧಾರ್ಥಕ ಪದ ಬಳಸಿ ವಾಕ್ಯ ಮಾಡಿ`,[
[`ರಾತ್ರಿ × ಹಗಲು`,`ರಾತ್ರಿ ಕತ್ತಲಿರುತ್ತದೆ; ಹಗಲು ಬೆಳಕಿರುತ್ತದೆ.`],[`ಹಿಗ್ಗು × ಕುಗ್ಗು`,`ಗೆದ್ದಾಗ ಹಿಗ್ಗಬೇಕು, ಸೋತಾಗ ಕುಗ್ಗಬಾರದು.`],[`ಸುಳ್ಳು × ನಿಜ`,`ಸುಳ್ಳು ಹೇಳಬಾರದು, ನಿಜ ಹೇಳಬೇಕು.`],[`ಚಿಕ್ಕ × ದೊಡ್ಡ`,`ಚಿಕ್ಕ ಮರದ ಪಕ್ಕ ದೊಡ್ಡ ಮರ ಇದೆ.`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಆ. ಪ್ರಾಸ ಪದಗಳನ್ನು ಪದ್ಯದಿಂದ ಆರಿಸಿ ಬರೆಯಿರಿ`,[[`ರೈತನಿಗೆ –`,`ದಾತನಿಗೆ`],[`ಕೊಯ್ಯುವೆನು –`,`ನೀಡುವೆನು`],[`ಹಿಡಿಯುವೆನು –`,`ಎಣಿಸುವೆನು`],[`ಬೆಳಗಿಸುವೆ –`,`ತವಕಿಸುವೆ`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಇ. ಕೆಲಸವನ್ನು ಸೂಚಿಸುವ ಪದ ಗುರುತಿಸಿ`,[[`ನೇಗಿಲ ಅಳತೆಗೆ ಕೊಯ್ಯುವೆನು`,`ಕೊಯ್ಯುವೆನು`],[`ಕತ್ತೆಯ ಬೆನ್ನಲಿ ಇರಿಸುವೆನು`,`ಇರಿಸುವೆನು`],[`ಸಂಜೆಗೆ ಹಣವನು ಎಣಿಸುವೆನು`,`ಎಣಿಸುವೆನು`]]],
[`ಬಳಕೆ ಚಟುವಟಿಕೆ`,[
[`೧. ನಿಮ್ಮ ಊರಿನಲ್ಲಿರುವ ಕಸುಬುದಾರರ ಪಟ್ಟಿ ಮತ್ತು ಅವರು ಮಾಡುವ ಕೆಲಸ`,`ಮಾದರಿ: ಕುಂಬಾರ – ಮಡಕೆ ಮಾಡುವುದು; ಬಡಗಿ – ಮರದ ವಸ್ತು ಮಾಡುವುದು; ಕಮ್ಮಾರ – ಕಬ್ಬಿಣದ ಸಾಧನ ಮಾಡುವುದು; ಕ್ಷೌರಿಕ – ಕೂದಲು ಕತ್ತರಿಸುವುದು; ದರ್ಜಿ – ಬಟ್ಟೆ ಹೊಲಿಯುವುದು; ರೈತ – ಬೆಳೆ ಬೆಳೆಯುವುದು.`],
[`೨. ಊರಿನಲ್ಲಿ ವಿವಿಧ ಕಸುಬುಗಳನ್ನು ಮಾಡುವವರು ಇರಬೇಕು. ಏಕೆ?`,`ಒಬ್ಬರಿಗೆ ಎಲ್ಲಾ ಕೆಲಸ ಮಾಡಲು ಸಾಧ್ಯವಿಲ್ಲ; ಒಬ್ಬರ ಕೆಲಸ ಇನ್ನೊಬ್ಬರಿಗೆ ನೆರವಾಗುತ್ತದೆ. ಎಲ್ಲರೂ ಒಟ್ಟಾಗಿ ದುಡಿದರೆ ಊರಿನ ಎಲ್ಲಾ ಅಗತ್ಯಗಳು ಪೂರೈಕೆಯಾಗುತ್ತವೆ.`],
[`೩. ಚೌಕದಲ್ಲಿ ರೈತನಿಗೆ ಸಂಬಂಧಿಸಿದ ಪದಗಳನ್ನು ಹುಡುಕಿ ವೃತ್ತ ಹಾಕಿ`,`ಹುಡುಕಬೇಕಾದ ಪದಗಳು (ಸೂಚಿತ): ನೇಗಿಲು, ಕುಡುಗೋಲು, ಬಾವಿ, ತೋಟ, ಗಾಡಿ, ಕೊಳವೆ… ⚠ ಪಠ್ಯದ ಚೌಕ ನೋಡಿ ದೃಢಪಡಿಸಿ.`],
[`೪. ಕವಿತೆಯಲ್ಲಿ ನಿಮಗೆ ಇಷ್ಟವಾದ ಕಸುಬುದಾರರು ಯಾರು? ಏಕೆ?`,`ವಿದ್ಯಾರ್ಥಿಯ ಸ್ವಂತ ಅಭಿಪ್ರಾಯ (ಉದಾ: ರೈತ – ಅವನು ಎಲ್ಲರಿಗೂ ಅನ್ನ ನೀಡುತ್ತಾನೆ).`],
[`೫–೬. ಚಿತ್ರ ಬಿಡಿಸೋಣ; ಮೂಕಾಭಿನಯ`,`ಚಟುವಟಿಕೆ ಆಧಾರಿತ – ಇಷ್ಟವಾದ ವೃತ್ತಿಯ ಚಿತ್ರ ಬಿಡಿಸಿ ಆಲ್ಬಂ ಮಾಡುವುದು; ಕಸುಬುಗಳನ್ನು ಅಭಿನಯಿಸುವುದು.`]]]
],
qb:[
M(`ಈ ಪದ್ಯದ ಕವಿ:`,[`ವಿ.ಬಿ. ಕುಳಮರ್ವ`,`ಬಿ.ಎಂ. ಶರ್ಮ`,`ಸರ್ವಜ್ಞ`,`ಕುವೆಂಪು`],0),
M(`ಕಬ್ಬಿಣ ಕುಟ್ಟಿ ಹಾರೆ ಮಾಡುವವನು:`,[`ಕಮ್ಮಾರ`,`ಬಡಗಿ`,`ಅಗಸ`,`ಬೆಸ್ತ`],0),
M(`ನೇಗಿಲು ಮಾಡುವವನು:`,[`ಬಡಗಿ`,`ದರ್ಜಿ`,`ಅಗಸ`,`ಬೆಸ್ತ`],0),
M(`ಬಟ್ಟೆಯ ಗಂಟನ್ನು ಕತ್ತೆಯ ಬೆನ್ನಲ್ಲಿಟ್ಟು ಒಯ್ಯುವವನು:`,[`ಅಗಸ`,`ದರ್ಜಿ`,`ರೈತ`,`ಬಡಗಿ`],0),
M(`ಕಡಲಲ್ಲಿ ಬಲೆ ಬೀಸಿ ಮೀನು ಹಿಡಿಯುವವನು:`,[`ಬೆಸ್ತ`,`ರೈತ`,`ದರ್ಜಿ`,`ಕಮ್ಮಾರ`],0),
M(`'ಗರಿಮೆ' ಪದದ ಅರ್ಥ:`,[`ಹೆಮ್ಮೆ`,`ಅವಮಾನ`,`ದುಃಖ`,`ಭಯ`],0),
O(`'ಹಲ' ಎಂದರೇನು?`,`ನೇಗಿಲು.`),
O(`ಜನರನ್ನು ಸಲಹುವ ದಾತ ಯಾರು?`,`ರೈತ.`),
O(`ಸಂಜೆಗೆ ಹಣವನ್ನು ಎಣಿಸುವವರು ಯಾರು?`,`ಮೀನು ಹಿಡಿಯುವ ಬೆಸ್ತರು (ಸಂತೆಗೆ ಸಾಗಿಸಿ ಮಾರಿ).`,'m'),
O(`ಈ ಪದ್ಯದ ಘೋಷ ವಾಕ್ಯ ಯಾವುದು?`,`ವೃತ್ತಿ ನಿರತ ವ್ಯಕ್ತಿ, ನಾಡಿಗವನೇ ಶಕ್ತಿ.`),
O(`ಹಾರೆ ಯಾರಿಗೆ ಉಪಯೋಗವಾಗುತ್ತದೆ?`,`ರೈತನಿಗೆ.`),
O(`ಹೊಸ ಹೊಸ ಬಗೆಯಲ್ಲಿ ಉಡುಗೆ ಹೊಲಿಯುವವನು ಯಾರು?`,`ದರ್ಜಿ.`),
G(`'ಉಡುಗೆ' ಪದದ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಉಡುಪು / ಬಟ್ಟೆ / ವಸನ`),
G(`'ರಾತ್ರಿ' ಪದದ ವಿರುದ್ಧಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಹಗಲು`),
G(`'ಹಿಗ್ಗು' ಪದದ ವಿರುದ್ಧಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಕುಗ್ಗು`),
G(`'ಸುಳ್ಳು' ಪದದ ವಿರುದ್ಧಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ನಿಜ`),
G(`ಪ್ರಾಸ ಪದ ಬರೆಯಿರಿ: ರೈತನಿಗೆ –`,`ದಾತನಿಗೆ`),
G(`'ನೆರವು' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಸಹಾಯ / ಬೆಂಬಲ`),
S(`ಕಮ್ಮಾರನು ರೈತನಿಗೆ ಹೇಗೆ ನೆರವಾಗುತ್ತಾನೆ?`,`ಕಮ್ಮಾರನು ಕಬ್ಬಿಣ ಕುಟ್ಟಿ ಹಾರೆಯನ್ನು ತಯಾರಿಸಿ ಸಂತೋಷದಿಂದ ರೈತನಿಗೆ ಕೊಡುತ್ತಾನೆ; ಇದರಿಂದ ರೈತ ಬೆಳೆ ಬೆಳೆಯಲು ನೆರವಾಗುತ್ತದೆ.`),
S(`ನೇಗಿಲನ್ನು ಹೇಗೆ ಮಾಡುವರು?`,`ಬಡಗಿಯು ಕಾಡಿನಲ್ಲಿ ಒಣಮರ ಹುಡುಕಿ ನೇಗಿಲ ಅಳತೆಗೆ ಕೊಯ್ದು ಉತ್ತಮ ನೇಗಿಲು ಮತ್ತು ನೊಗವನ್ನು ಮಾಡಿ ಕೆತ್ತನೆಯೊಂದಿಗೆ ನೀಡುತ್ತಾನೆ.`),
S(`ಅಗಸನು ಮಾಡುವ ಕೆಲಸವೇನು?`,`ಅಗಸನು ಬಟ್ಟೆಯ ಗಂಟನ್ನು ಒಟ್ಟಿಗೆ ಸೇರಿಸಿ ಕತ್ತೆಯ ಬೆನ್ನಲ್ಲಿಟ್ಟು ಹರಿಯುವ ನೀರಿನ ಬಳಿ ಒಯ್ದು ಕಲುಷಿತ (ಕೊಳಕು) ಬಟ್ಟೆಗಳನ್ನು ಒಗೆದು ಶುಚಿಗೊಳಿಸುತ್ತಾನೆ.`),
S(`ದರ್ಜಿಯು ಬಳಗದ ಮೆಚ್ಚುಗೆಯನ್ನು ಹೇಗೆ ಗಳಿಸುತ್ತಾನೆ?`,`ಹೊಸ ಹೊಸ ಬಗೆಯಲ್ಲಿ ಉಡುಗೆಯನ್ನು ಹೊಲಿದು ಮೈ–ಮನಗಳನ್ನು ಬೆಳಗಿಸುವ ಮೂಲಕ.`),
L(`ಈ ಪದ್ಯದಲ್ಲಿ ಬರುವ ಕಸುಬುದಾರರು ಮತ್ತು ಅವರ ಕೆಲಸವನ್ನು ವಿವರಿಸಿ.`,`ಕಮ್ಮಾರ: ಕಬ್ಬಿಣ ಕುಟ್ಟಿ ಹಾರೆ ಮಾಡಿ ರೈತನಿಗೆ ಕೊಡುವವನು. ಬಡಗಿ: ಒಣಮರದಿಂದ ನೇಗಿಲು, ನೊಗ ಮಾಡುವವನು. ಅಗಸ: ಬಟ್ಟೆ ಒಗೆದು ಶುಚಿಗೊಳಿಸುವವನು. ಬೆಸ್ತ: ಕಡಲಲ್ಲಿ ಬಲೆ ಬೀಸಿ ಮೀನು ಹಿಡಿದು ಸಂತೆಯಲ್ಲಿ ಮಾರುವವನು. ದರ್ಜಿ: ಹೊಸ ಬಗೆಯ ಉಡುಗೆ ಹೊಲಿಯುವವನು.`),
L(`ಊರಿನಲ್ಲಿ ವಿವಿಧ ಕಸುಬುಗಳನ್ನು ಮಾಡುವವರು ಇರಬೇಕು. ಏಕೆ ಎಂಬುದನ್ನು ವಿವರಿಸಿ.`,`ಕಸುಬುದಾರರು ತಮ್ಮ ತಮ್ಮ ಕೆಲಸಗಳ ಮೂಲಕ ಸಮಾಜಕ್ಕೆ ನೆರವಾಗುತ್ತಾರೆ. ರೈತನಿಗೆ ಹಾರೆ ಕಮ್ಮಾರನಿಂದ, ನೇಗಿಲು ಬಡಗಿಯಿಂದ, ಉಡುಗೆ ದರ್ಜಿಯಿಂದ ದೊರೆಯುತ್ತದೆ. ಬಟ್ಟೆ ಶುಚಿಗೆ ಅಗಸ, ಮೀನಿಗೆ ಬೆಸ್ತ ಬೇಕು. ಎಲ್ಲರೂ ಒಬ್ಬರನ್ನೊಬ್ಬರು ಅವಲಂಬಿಸಿರುವುದರಿಂದ ಊರಿನಲ್ಲಿ ವಿವಿಧ ಕಸುಬುದಾರರಿರಬೇಕು.`)
]});

LS.push({n:16,t:`ಕನಸುಗಾರ ಕಲಾಂ`,au:`ಸಮಿತಿ ರಚನೆ`,pg:50,
words:`ಹೆಮ್ಮೆ – ಹಿರಿಮೆ, ಅಭಿಮಾನ; ವೇದನೆ – ನೋವು, ಯಾತನೆ; ಶ್ರಮಿಸು – ದುಡಿ, ಕಷ್ಟಪಡು; ವೀಕ್ಷಿಸು – ನೋಡು, ಅವಲೋಕಿಸು; ಗಗನ – ಆಕಾಶ, ಆಗಸ, ಬಾನು; ತೀರ – ದಡ; ಉಡಾವಣೆ – ಹಾರಿಸು; ಪ್ರೋತ್ಸಾಹಿಸು – ಹುರಿದುಂಬಿಸು, ಉತ್ತೇಜಿಸು`,
notes:`ಕ್ಷಿಪಣಿ – ದೂರದಿಂದ ನಿಯಂತ್ರಿಸಲ್ಪಡುವ ಸ್ಫೋಟಕವಾಗಿ ಉಡಾಯಿಸುವ ಸಾಧನ; ಕ್ಯಾಲಿಪರ್ – ಕೈಕಾಲುಗಳಿಗೆ ಜೋಡಿಸುವ ಕೃತಕ ಸಾಧನ; ಚಿಕಿತ್ಸೆ – ರೋಗವನ್ನು ಗುಣಪಡಿಸಲು ಮಾಡುವ ವೈದ್ಯೋಪಚಾರ; ಪ್ರಯೋಗಾಲಯ – ಸಂಶೋಧನೆ ಮಾಡುವ ಕೋಣೆ, ಪರೀಕ್ಷೆ ಮಾಡಿ ದೃಢೀಕರಿಸಿಕೊಳ್ಳುವ ಕೊಠಡಿ. ಘೋಷವಾಕ್ಯ: ಕನಸುಗಳೇ ಆಲೋಚನೆಗಳು, ಕೃತಿ ಆಲೋಚನೆಗಳ ಫಲ.`,
ab:[
[`ಅ. ಒಂದೊಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರ ಬರೆಯಿರಿ`,[
[`ಪ್ರಯೋಗಾಲಯಕ್ಕೆ ಭೇಟಿ ಕೊಟ್ಟವರು ಯಾರು?`,`ಪ್ರಸಿದ್ಧ ಮೂಳೆ ತಜ್ಞರು ಭೇಟಿ ಕೊಟ್ಟರು.`],
[`ವಿಜ್ಞಾನಿಯನ್ನು ವೈದ್ಯರು ಯಾವ ಆಸ್ಪತ್ರೆಗೆ ಕರೆದುಕೊಂಡು ಹೋದರು?`,`ಹೈದರಾಬಾದಿನಲ್ಲಿರುವ ನಿಜಾಮ್ ಆಸ್ಪತ್ರೆಗೆ.`],
[`ಆಸ್ಪತ್ರೆಯಲ್ಲಿದ್ದ ರೋಗಿಗಳಿಗೆ ಏನಾಗಿತ್ತು?`,`ಅವರ ಕಾಲಿನ ನ್ಯೂನತೆಯಿಂದಾಗಿ ಕಾಲಿಗೆ ಭಾರವಾದ ಕ್ಯಾಲಿಪರ್ ಅಳವಡಿಸಲಾಗಿತ್ತು (ಕಾಲಿನ ನ್ಯೂನತೆಗೆ ಒಳಗಾಗಿದ್ದರು).`],
[`ರೋಗಿಗಳ ಕಾಲಿಗೆ ಏನನ್ನು ಅಳವಡಿಸಲಾಗಿತ್ತು?`,`ಸುಮಾರು ಮೂರು ಕಿಲೋ ಗ್ರಾಂ ತೂಕದ ಲೋಹದ ಕ್ಯಾಲಿಪರ್.`],
[`ಅಬ್ದುಲ್ ಕಲಾಂರವರ ತಂದೆ–ತಾಯಿಯ ಹೆಸರೇನು?`,`ತಂದೆ ಜೈನುಲಾಬ್ದೀನ್ ಮರಕಯಾರ್, ತಾಯಿ ಆಶಿಯಮ್ಮ.`],
[`ಕಲಾಂರವರ ಆತ್ಮಕಥನದ ಹೆಸರೇನು?`,`'ಅಗ್ನಿಯ ರೆಕ್ಕೆಗಳು'.`]]],
[`ಆ. ಎರಡು–ಮೂರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರ ಬರೆಯಿರಿ`,[
[`ವೈದ್ಯರ ಹೃದಯ ತುಂಬಿ ಬಂದಿತು. ಏಕೆ?`,`ವಿಜ್ಞಾನಿ ತಯಾರಿಸಿದ ಹಗುರ ಕ್ಯಾಲಿಪರ್ ಹಾಕಿದ ಹುಡುಗನು ಹೆಜ್ಜೆ ಇಟ್ಟು ನಡೆದನು. ಅವನ ಕಣ್ಣಲ್ಲಿದ್ದ ಆನಂದವನ್ನು ಕಂಡು ವೈದ್ಯರ ಹೃದಯ ತುಂಬಿ ಬಂದಿತು.`],
[`ಕಲಾಂ ಬಾಲ್ಯದಲ್ಲಿ ಯಾವ ಕನಸನ್ನು ಕಾಣುತ್ತಿದ್ದರು?`,`ಬಾಲ್ಯದಲ್ಲಿ ಕಡಲ ತೀರದಲ್ಲಿ ಕುಳಿತು ಹಕ್ಕಿಗಳು ಹಾರುವುದನ್ನು ನೋಡುತ್ತಿದ್ದ ಕಲಾಂ, "ಮುಂದೊಂದು ದಿನ ನಾನು ಆಕಾಶದಲ್ಲಿ ಇವುಗಳಂತೆ ಹಾರಾಡುತ್ತೇನೆ" ಎಂದು ಕನಸು ಕಾಣುತ್ತಿದ್ದರು.`],
[`ಕಲಾಂ ಅವರಿಗೆ ಬಂದ ಪ್ರಮುಖ ಪ್ರಶಸ್ತಿಗಳು ಯಾವುವು?`,`ಪದ್ಮಭೂಷಣ, ಪದ್ಮವಿಭೂಷಣ ಹಾಗೂ ಭಾರತ ರತ್ನ ಪ್ರಶಸ್ತಿಗಳು; ಜೊತೆಗೆ ಹಲವಾರು ವಿಶ್ವವಿದ್ಯಾಲಯಗಳು ಗೌರವ ಡಾಕ್ಟರೇಟ್ ನೀಡಿವೆ.`]]],
[`ಇ. ಈ ಮಾತನ್ನು ಯಾರು? ಯಾರಿಗೆ ಹೇಳಿದರು?`,[
[`"ಇವರ ಕಷ್ಟವನ್ನು ನಿವಾರಿಸಲು ನಿಮ್ಮಿಂದ ಸಾಧ್ಯವಿಲ್ಲವೇ?"`,`ಯಾರು: ವೈದ್ಯರು; ಯಾರಿಗೆ: ವಿಜ್ಞಾನಿಗೆ (ಕಲಾಂ).`],
[`"ಕನಸು ಕಾಣಿರಿ"`,`ಯಾರು: ಅಬ್ದುಲ್ ಕಲಾಂ; ಯಾರಿಗೆ: ಮಕ್ಕಳಿಗೆ.`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಅ. ವಿರುದ್ಧಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ`,[[`ಹಗುರ ×`,`ಭಾರ`],[`ಕಷ್ಟ ×`,`ಸುಖ / ಸುಲಭ`],[`ಮೇಲೆ ×`,`ಕೆಳಗೆ`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಆ. ಸ್ವಂತ ವಾಕ್ಯ ರಚಿಸಿ (ಮಾದರಿ ಉತ್ತರ)`,[[`ಚಿಕಿತ್ಸೆ`,`ವೈದ್ಯರು ರೋಗಿಗೆ ಚಿಕಿತ್ಸೆ ನೀಡಿದರು.`],[`ಗಗನ`,`ವಿಮಾನ ಗಗನದಲ್ಲಿ ಹಾರುತ್ತಿದೆ.`],[`ಸಾಧನೆ`,`ಕಲಾಂ ಅವರ ಸಾಧನೆ ದೊಡ್ಡದು.`],[`ಕನಸು`,`ನಾನು ಕನಸು ಕಂಡು ಅದನ್ನು ನನಸಾಗಿಸುವೆ.`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಇ. ಕೂಡಿಸಿ ಪದ ರಚಿಸಿ (ಮಾಡು + ಇಸು = ಮಾಡಿಸು)`,[[`ತಿನ್ನು + ಇಸು`,`ತಿನ್ನಿಸು`],[`ಓಡು + ಇಸು`,`ಓಡಿಸು`],[`ಬಿಡು + ಇಸು`,`ಬಿಡಿಸು`],[`ಆಡು + ಇಸು`,`ಆಡಿಸು`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಈ. ಕಲಾಂರವರಿಗೆ ಸಂಬಂಧಿಸಿದ ಪದಗಳನ್ನು ಆಯ್ದು ಚೌಕದಲ್ಲಿ ಬರೆಯಿರಿ`,[[`(ಭಾರತ ರತ್ನ, ಜ್ಞಾನಪೀಠ, ರಾಷ್ಟ್ರಪತಿ, ಮುಖ್ಯಮಂತ್ರಿ, ಆಶಿಯಮ್ಮ, ಕ್ಷಿಪಣಿ, ಹಡಗು, ಕ್ಯಾಲಿಪರ್)`,`ಭಾರತ ರತ್ನ, ರಾಷ್ಟ್ರಪತಿ, ಆಶಿಯಮ್ಮ, ಕ್ಷಿಪಣಿ, ಕ್ಯಾಲಿಪರ್ (ಜ್ಞಾನಪೀಠ, ಮುಖ್ಯಮಂತ್ರಿ, ಹಡಗು – ಸಂಬಂಧವಿಲ್ಲ)`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಉ. ಪಾಠದಲ್ಲಿ ಬರುವ ಹೆಸರುಗಳನ್ನು ಆಯ್ದು ಬರೆಯಿರಿ`,[[`ವ್ಯಕ್ತಿ ಹೆಸರುಗಳು`,`ಕಲಾಂ, ಆಶಿಯಮ್ಮ, ಜೈನುಲಾಬ್ದೀನ್ ಮರಕಯಾರ್`],[`ವೃತ್ತಿಯ ಹೆಸರುಗಳು`,`ವಿಜ್ಞಾನಿ, ವೈದ್ಯ, ಮೂಳೆ ತಜ್ಞ, ರಾಷ್ಟ್ರಪತಿ`],[`ವಸ್ತುವಿನ ಹೆಸರುಗಳು`,`ಕ್ಯಾಲಿಪರ್, ಕ್ಷಿಪಣಿ, ರಾಕೆಟ್`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಊ. ಮಾದರಿಯಂತೆ ಸೂಕ್ತ ಪದ ರಚಿಸಿ (ಪಡೆದನು – ಪಡೆಯುತ್ತಾನೆ – ಪಡೆಯುವವನು)`,[[`ನಡೆದನು`,`ನಡೆಯುತ್ತಾನೆ – ನಡೆಯುವವನು`],[`ಹಾರಿದನು`,`ಹಾರುತ್ತಾನೆ – ಹಾರುವವನು`],[`ಬರೆದನು`,`ಬರೆಯುತ್ತಾನೆ – ಬರೆಯುವವನು`],[`ಓಡಿದನು`,`ಓಡುತ್ತಾನೆ – ಓಡುವವನು`],[`ಆಡಿದನು`,`ಆಡುತ್ತಾನೆ – ಆಡುವವನು`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಋ. ಪದಗಳನ್ನು ಸರಿಯಾಗಿ ಜೋಡಿಸಿ ವಾಕ್ಯ ರಚಿಸಿ`,[[`ರೈತರು, ಮಕ್ಕಳು, ಗುರುಗಳು, ಶಿಲ್ಪಿಗಳು, ರಾಜರು | ಪುಸ್ತಕವನ್ನು, ರಾಜ್ಯವನ್ನು, ಹೊಲವನ್ನು, ಹಾಡನ್ನು, ವಿಗ್ರಹಗಳನ್ನು | ಆಳಿದರು, ಕೆತ್ತಿದರು, ಹಾಡಿದರು, ಓದಿದರು, ಉತ್ತರು`,`ರೈತರು ಹೊಲವನ್ನು ಉತ್ತರು. ಮಕ್ಕಳು ಹಾಡನ್ನು ಹಾಡಿದರು. ಗುರುಗಳು ಪುಸ್ತಕವನ್ನು ಓದಿದರು. ಶಿಲ್ಪಿಗಳು ವಿಗ್ರಹಗಳನ್ನು ಕೆತ್ತಿದರು. ರಾಜರು ರಾಜ್ಯವನ್ನು ಆಳಿದರು.`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಎ. ಪದಬಂಧ`,[[`ಸುಳಿವುಗಳ ಆಧಾರದಿಂದ ಪೂರ್ಣಗೊಳಿಸಿ`,`ಚಟುವಟಿಕೆ ಆಧಾರಿತ – ಶಿಕ್ಷಕರ ಸಹಾಯದಿಂದ (⚠ ಪಾಠಪುಸ್ತಕದ ಚೌಕ ನೋಡಿ ದೃಢಪಡಿಸಿ).`]]],
[`ಬಳಕೆ ಚಟುವಟಿಕೆ – ಅ. ಊಹಿಸಿ ಬರೆಯಿರಿ`,[[`ನೀವು ಶಾಲಾ ಮಂತ್ರಿಮಂಡಲದಲ್ಲಿ ಸ್ವಚ್ಛತಾ ಮಂತ್ರಿಯಾದರೆ ಏನು ಮಾಡುವಿರಿ?`,`ಮಾದರಿ: ನಾನು ತರಗತಿ ಮತ್ತು ಶಾಲಾ ಆವರಣವನ್ನು ಪ್ರತಿದಿನ ಸ್ವಚ್ಛವಾಗಿಡಲು ಮಕ್ಕಳಿಗೆ ತಿಳಿಸುವೆ; ಕಸದ ಬುಟ್ಟಿ ಬಳಸಲು ಹೇಳುವೆ; ಶೌಚಾಲಯ, ಕುಡಿಯುವ ನೀರಿನ ಜಾಗ ಶುಚಿಯಾಗಿಡುವೆ.`]]],
[`ಬಳಕೆ ಚಟುವಟಿಕೆ – ಆ. ಯೋಚಿಸಿ ಉತ್ತರಿಸಿ (ಒಗಟುಗಳು)`,[
[`ಕೇಸರಿ, ಬಿಳಿ, ಹಸಿರು ಬಣ್ಣ ನಡುವೆ ಚಕ್ರ, ಹಾಗಾದರೆ ನಾನು ಯಾರು?`,`ರಾಷ್ಟ್ರಧ್ವಜ (ತ್ರಿವರ್ಣ ಧ್ವಜ)`],
[`ಮೂರು ಕಡೆ ನೀರು, ನೆತ್ತಿ ಮೇಲೆ ಬೆಟ್ಟ, ಹಾಗಾದರೆ ನಾನು ಯಾರು?`,`ಭಾರತ ದೇಶ`],
[`ಬಲಗೈಯಲ್ಲಿ ಗೀತೆ, ಎಡಗೈಯಲ್ಲಿ ರಾಟೆ ಹಿಡಿದಿದ್ದೆ, ಹಾಗಾದರೆ ನಾನು ಯಾರು?`,`ಗಾಂಧೀಜಿ`]]],
[`ಬಳಕೆ ಚಟುವಟಿಕೆ – ಇ. ಗಾಂಧೀಜಿ ಬಗ್ಗೆ ಕುರಿತು ಬರೆಯಿರಿ`,[[`ಗಾಂಧೀಜಿ, ರಾಷ್ಟ್ರಪಿತ, ಸ್ವಾತಂತ್ರ್ಯ ಹೋರಾಟ, ಭಾರತ, ಹಳ್ಳಿ ಉದ್ಧಾರ, ಬಡತನ, ಸ್ವಚ್ಛತೆ, ಸ್ವ ಉದ್ಯೋಗ, ಸರಳ ಜೀವನ`,`ಮಾದರಿ: ಗಾಂಧೀಜಿಯವರು ರಾಷ್ಟ್ರಪಿತ ಎಂದು ಕರೆಯಲ್ಪಡುತ್ತಾರೆ. ಅವರು ಭಾರತದ ಸ್ವಾತಂತ್ರ್ಯ ಹೋರಾಟವನ್ನು ಅಹಿಂಸೆಯಿಂದ ಮುನ್ನಡೆಸಿದರು. ಹಳ್ಳಿಗಳ ಉದ್ಧಾರ, ಬಡತನ ನಿವಾರಣೆ, ಸ್ವಚ್ಛತೆ ಮತ್ತು ಸ್ವ ಉದ್ಯೋಗದ ಬಗ್ಗೆ ಹೇಳಿದರು. ಅವರು ಸರಳ ಜೀವನ ನಡೆಸಿದರು.`]]]
],
qb:[

M(`ಕಲಾಂ ಅವರು ದೇಶದ ಯಾವ ಅತ್ಯುನ್ನತ ಹುದ್ದೆಯನ್ನು ಅಲಂಕರಿಸಿದರು?`,[`ರಾಷ್ಟ್ರಪತಿ`,`ಪ್ರಧಾನಿ`,`ಮುಖ್ಯಮಂತ್ರಿ`,`ರಾಜ್ಯಪಾಲ`],0,'m'),

G(`ಕೂಡಿಸಿ ಬರೆಯಿರಿ: ಓಡು + ಇಸು =`,`ಓಡಿಸು`),

S(`ಕಲಾಂ ಮಕ್ಕಳಿಗೆ ಏನೆಂದು ಪ್ರೋತ್ಸಾಹಿಸುತ್ತಿದ್ದರು?`,`"ಕನಸು ಕಾಣಿರಿ" ಎಂದು ಹೇಳಿ ಮಕ್ಕಳಲ್ಲಿ ಕನಸು ಹಾಗೂ ಆತ್ಮವಿಶ್ವಾಸವನ್ನು ತುಂಬುತ್ತಿದ್ದರು.`),
L(`ವಿಜ್ಞಾನಿ ಕಲಾಂ ಅವರು ಹಗುರ ಕ್ಯಾಲಿಪರ್ ತಯಾರಿಸಿದ ಘಟನೆಯನ್ನು ವಿವರಿಸಿ.`,`ಮೂಳೆ ತಜ್ಞರು ಕಲಾಂ ಅವರ ಪ್ರಯೋಗಾಲಯಕ್ಕೆ ಬಂದು ಹಗುರ ವಸ್ತುವನ್ನು ನೋಡಿ ಮೆಚ್ಚಿದರು. ಅವರು ಕಲಾಂ ಅವರನ್ನು ನಿಜಾಮ್ ಆಸ್ಪತ್ರೆಗೆ ಕರೆದೊಯ್ದು ಕಾಲಿನ ನ್ಯೂನತೆ ಇದ್ದ ರೋಗಿಗಳನ್ನು ತೋರಿಸಿದರು. ಅವರ ಕಾಲಿಗೆ ಸುಮಾರು 3 ಕಿಲೋ ತೂಕದ ಕ್ಯಾಲಿಪರ್ ಇತ್ತು. ವೇದನೆ ಕಂಡು ಕಲಾಂ ಮನ ಕಲಕಿತು. ಮೂರು ವಾರ ಶ್ರಮಿಸಿ ಕೇವಲ 300 ಗ್ರಾಂ ತೂಕದ ಹೊಸ ಕ್ಯಾಲಿಪರ್ ತಯಾರಿಸಿದರು. ಅದನ್ನು ಹಾಕಿದ ಬಾಲಕ ಹೆಜ್ಜೆ ಇಟ್ಟು ನಡೆದಾಗ ವೈದ್ಯರು, ಕಲಾಂ ಆನಂದಪಟ್ಟರು.`),
L(`ಕಲಾಂ ಅವರ ಜೀವನ ಮತ್ತು ಸಾಧನೆಗಳ ಬಗ್ಗೆ ಬರೆಯಿರಿ.`,`ಅಬ್ದುಲ್ ಕಲಾಂ ತಮಿಳುನಾಡಿನ ರಾಮೇಶ್ವರದಲ್ಲಿ ಜನಿಸಿದರು. ತಂದೆ ಜೈನುಲಾಬ್ದೀನ್ ಮರಕಯಾರ್, ತಾಯಿ ಆಶಿಯಮ್ಮ. ಬಾಲ್ಯದಲ್ಲಿ ಹಕ್ಕಿಗಳಂತೆ ಹಾರುವ ಕನಸು ಕಂಡರು. ಮುಂದೆ ಶ್ರೇಷ್ಠ ವಿಜ್ಞಾನಿಯಾಗಿ ರಾಕೆಟ್ ಹಾಗೂ ಕ್ಷಿಪಣಿ ಕ್ಷೇತ್ರದಲ್ಲಿ ಮಹತ್ವದ ಸಾಧನೆ ಮಾಡಿದರು. ಭಾರತದ ರಾಷ್ಟ್ರಪತಿಯಾದರು. 'ಅಗ್ನಿಯ ರೆಕ್ಕೆಗಳು' ಅವರ ಆತ್ಮಕಥೆ. ಪದ್ಮಭೂಷಣ, ಪದ್ಮವಿಭೂಷಣ, ಭಾರತ ರತ್ನ ಪ್ರಶಸ್ತಿಗಳಿಂದ ಗೌರವಿಸಲ್ಪಟ್ಟರು. ಮಕ್ಕಳಿಗೆ "ಕನಸು ಕಾಣಿರಿ" ಎಂದು ಪ್ರೇರೇಪಿಸಿದರು.`)
]});

LS.push({n:17,t:`ಕಾಡಿನಲ್ಲೊಂದು ಸ್ಪರ್ಧೆ`,au:`ಸಮಿತಿ ರಚನೆ`,pg:59,
words:`ಕಂಗೊಳಿಸು – ಹೊಳೆಯುವುದು; ಉಲಿ – ಮಾತು, ಧ್ವನಿ; ಸಹಬಾಳ್ವೆ – ಒಟ್ಟಾಗಿ ಬಾಳುವುದು; ಸ್ಪರ್ಧೆ – ಪೈಪೋಟಿ, ಮೇಲಾಟ; ಸರದಿ – ಸಾಲು; ತೀರ್ಪು – ತೀರ್ಮಾನ; ಸರಕು – ವಸ್ತುಗಳು; ಸಾಗಾಣಿಕೆ – ಸಾಗಿಸುವುದು; ದರ – ಬೆಲೆ; ವಾಯು – ಗಾಳಿ; ವಿದೇಶ – ಹೊರದೇಶ; ಸಭಿಕರು – ಪ್ರೇಕ್ಷಕರು; ಆಕರ್ಷಣೆ – ಸೆಳೆತ; ಲಭ್ಯ – ದೊರಕುವುದು; ವಿನಿಮಯ – ಪರಸ್ಪರ ಬದಲಾಯಿಸು; ಸಂದೇಶ – ಸುದ್ದಿ, ಮಾಹಿತಿ; ಬಂಧು – ಸಂಬಂಧಿ; ಸಹಕರಿಸು – ಸಹಾಯ ನೀಡು; ಇನಾಮು – ಬಹುಮಾನ; ಧನ್ಯ – ಪಾವನ; ಸಮ್ಮತಿ – ಒಪ್ಪಿಗೆ; ಬಿಂಕ – ಗರ್ವ; ಅದ್ಭುತ – ಆಶ್ಚರ್ಯ`,
notes:`ಆಶುಭಾಷಣ – ಸ್ಥಳದಲ್ಲಿಯೇ ಸೂಚಿಸಿದ ವಿಷಯದ ಬಗ್ಗೆ ಭಾಷಣ ಮಾಡುವುದು; ಚಿಂತನೆ – ಒಂದು ವಿಷಯದ ಬಗ್ಗೆ ಆಳವಾಗಿ ಆಲೋಚಿಸುವುದು; ಬಳ್ಳ – ಒಂದು ಅಳತೆಯ ಪ್ರಮಾಣ; ಎ.ಟಿ.ಎಂ. – ಆಟೋಮೇಟೆಡ್ ಟೆಲ್ಲರ್ ಮೆಷಿನ್ (ಹಣ ತೆಗೆದುಕೊಳ್ಳುವ ಯಂತ್ರ). ಘೋಷವಾಕ್ಯ: ಕೂಡಿ ಬಾಳಿದರೆ ಸ್ವರ್ಗ ಸುಖ.`,
ab:[
[`ಅ. ಒಂದೊಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರ ಬರೆಯಿರಿ`,[
[`ಪ್ರಾಣಿ ಪಕ್ಷಿಗಳ ಸಭೆಯನ್ನು ಕರೆದವರು ಯಾರು?`,`ಕಾಡಿನ ರಾಜನಾದ ಸಿಂಹ.`],
[`ಕಾಡಿನಲ್ಲಿ ನಡೆದ ಸ್ಪರ್ಧೆ ಯಾವುದು?`,`ಆಶುಭಾಷಣ ಸ್ಪರ್ಧೆ.`],
[`ತೀರ್ಪುಗಾರರಾಗಿ ಕಾರ್ಯ ನಿರ್ವಹಿಸಿದವರು ಯಾರು?`,`ಕೋಗಿಲೆ, ಕೋತಿ ಮತ್ತು ತೋಳ.`]]],
[`ಆ. ಮೂರು–ನಾಲ್ಕು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರ ಬರೆಯಿರಿ`,[
[`ರೇಡಿಯೋದಲ್ಲಿ ನಾವು ಪ್ರತಿದಿನ ಯಾವ ಯಾವ ಕಾರ್ಯಕ್ರಮ ಕೇಳಬಹುದು?`,`ರೇಡಿಯೋದಲ್ಲಿ ಚಿಂತನ, ಕೃಷಿ ಸಮಾಚಾರ, ಶಿಕ್ಷಣವಾರ್ತೆ, ಕ್ರೀಡೆ, ಸಂದರ್ಶನ, ರಾಜಕೀಯ, ಮನರಂಜನೆ, ಚಿತ್ರಗೀತೆ, ವಾರ್ತೆ ಮುಂತಾದ ಕಾರ್ಯಕ್ರಮಗಳು ಪ್ರಸಾರವಾಗುತ್ತವೆ. ಚಿಣ್ಣರಚುಕ್ಕಿ, ಚುಕ್ಕಿಚಿನ್ನ, ಕೇಳಿ–ಕಲಿ ಮಕ್ಕಳ ಕಾರ್ಯಕ್ರಮಗಳೂ ಇವೆ.`],
[`ರೈಲು ಪ್ರಯಾಣದ ಬಗ್ಗೆ ಚಿರತೆಯ ಅಭಿಪ್ರಾಯವೇನು?`,`ರೈಲು ಕಂಬಿಗಳ ಮೇಲೆ ಮಾತ್ರ ಚಲಿಸುವ ವೇಗವಾದ ಉದ್ದ ವಾಹನ. ಒಮ್ಮೆಗೆ ಹೆಚ್ಚು ಪ್ರಯಾಣಿಕರು ಹಾಗೂ ಸರಕುಗಳನ್ನು ಸಾಗಿಸಬಹುದು. ಶೌಚಾಲಯ, ಕುಡಿಯುವ ನೀರು, ಊಟ, ತಿಂಡಿ, ಮಲಗುವ ವ್ಯವಸ್ಥೆ ಇರುತ್ತದೆ. ರೈಲು ಪ್ರಯಾಣ ಸುಖಕರ ಹಾಗೂ ದರವೂ ಕಡಿಮೆ.`],
[`ಆಶುಭಾಷಣ ಸ್ಪರ್ಧೆಯಲ್ಲಿ ಯಾರು ಯಾರು ಭಾಗವಹಿಸಿದ್ದರು?`,`ಆನೆ (ರೇಡಿಯೋ), ಚಿರತೆ (ರೈಲು), ನವಿಲು (ವಿಮಾನ), ಕರಡಿ (ಹಿಮಾಲಯ ಪರ್ವತ), ಹಾವು (ಬ್ಯಾಂಕ್), ಗಿಳಿ (ಮೊಬೈಲ್).`]]],
[`ಇ. ಈ ಮಾತುಗಳನ್ನು ಯಾರು? ಯಾರಿಗೆ ಹೇಳಿದರು?`,[
[`"ಆಮೆಯ ಜೊತೆ ಓಟದ ಸ್ಪರ್ಧೆಯಲ್ಲಿ ಸೋತಿದ್ದಕ್ಕೆ ಭಯವೇನು?"`,`ಯಾರು: ಆನೆ; ಯಾರಿಗೆ: ಮೊಲಕ್ಕೆ.`],
[`"ಅಬ್ಬಾ! ಚೀಟಿಯಲ್ಲಿ ನನಗೆ ಇಷ್ಟವಾದ ವಿಷಯ 'ರೇಡಿಯೋ' ಬಂದಿದೆ."`,`ಯಾರು: ಆನೆ; ಯಾರಿಗೆ: ಸಭೆಯಲ್ಲಿದ್ದ ಎಲ್ಲ ಪ್ರಾಣಿ ಪಕ್ಷಿಗಳಿಗೆ.`]]],
[`ಈ. ವಾಕ್ಯಗಳನ್ನು ಸರಿಪಡಿಸಿ ಬರೆಯಿರಿ`,[
[`ಸಂತೋಷದಿಂದ ನಡೆಸುತ್ತಿದ್ದವು ಸಹಬಾಳ್ವೆ ಪ್ರಾಣಿ ಪಕ್ಷಿಗಳು`,`ಪ್ರಾಣಿ ಪಕ್ಷಿಗಳು ಸಂತೋಷದಿಂದ ಸಹಬಾಳ್ವೆ ನಡೆಸುತ್ತಿದ್ದವು.`],
[`ಕೇಳಿ ಕಲಿ ಕಾರ್ಯಕ್ರಮ ನನಗೆ ಎಂದರೆ ಅಚ್ಚುಮೆಚ್ಚು`,`ಕೇಳಿ–ಕಲಿ ಕಾರ್ಯಕ್ರಮ ಎಂದರೆ ನನಗೆ ಅಚ್ಚುಮೆಚ್ಚು.`],
[`ತುಂಬಾ ಇಷ್ಟ ನನಗೆ ಪ್ರಯಾಣವೆಂದರೆ ವಿಮಾನ`,`ವಿಮಾನ ಪ್ರಯಾಣವೆಂದರೆ ನನಗೆ ತುಂಬಾ ಇಷ್ಟ.`]]],
[`ಉ. ಸ್ವಂತ ವಾಕ್ಯ ರಚಿಸಿ (ಮಾದರಿ ಉತ್ತರ)`,[[`ಸಹಬಾಳ್ವೆ`,`ನಾವು ಎಲ್ಲರೊಂದಿಗೆ ಸಹಬಾಳ್ವೆ ನಡೆಸಬೇಕು.`],[`ಆಕರ್ಷಣೆ`,`ನವಿಲಿನ ಗರಿ ಎಲ್ಲರಿಗೂ ಆಕರ್ಷಣೆ.`],[`ಸ್ಪರ್ಧೆ`,`ನಮ್ಮ ಶಾಲೆಯಲ್ಲಿ ಭಾಷಣ ಸ್ಪರ್ಧೆ ನಡೆಯಿತು.`],[`ಅಚ್ಚುಮೆಚ್ಚು`,`ನನಗೆ ಕತೆ ಓದುವುದು ಅಚ್ಚುಮೆಚ್ಚು.`],[`ತಮಾಷೆ`,`ಕೋತಿಯ ಆಟ ತಮಾಷೆಯಾಗಿತ್ತು.`]]],
[`ಊ. ವಿರುದ್ಧಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ`,[[`ಭಯ ×`,`ಧೈರ್ಯ`],[`ಶತ್ರು ×`,`ಮಿತ್ರ`],[`ಸಂತೋಷ ×`,`ದುಃಖ`],[`ಮುಕ್ತಾಯ ×`,`ಆರಂಭ`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಅ. ನಾನು ಯಾರು? ಯೋಚಿಸಿ ಬರೆ`,[
[`ಜುಟ್ಟುಂಟು ನಾರಿಯಲ್ಲ, ಕಣ್ಣುಂಟು ಮನುಷ್ಯನಲ್ಲ, ನೀರುಂಟು ಬಾವಿಯಲ್ಲ`,`ತೆಂಗಿನಕಾಯಿ`],
[`ನಾಲ್ಕು ಕಂಬಗಳುಂಟು ದೇವಾಲಯವಲ್ಲ, ಎರಡು ಮೊರಗಳುಂಟು ಕೇರಲಾಗುವುದಿಲ್ಲ, ಒಂದು ಕಹಳೆಯುಂಟು ಊದಲಾಗುವುದಿಲ್ಲ`,`ಆನೆ`],
[`ಮರದ ಮೇಲಿರುವೆ ಪಕ್ಷಿಯಲ್ಲ, ಹಸಿರಂಗಿ ತೊಟ್ಟಿರುವೆ ಬಾಲಕನಲ್ಲ, ಕೆಂಪು ಮೂತಿಯುಂಟು ಗಿಳಿಯಲ್ಲ`,`⚠ ಸೂಚಿತ: ಮಕ್ಕಳೊಂದಿಗೆ ಚರ್ಚಿಸಿ ದೃಢಪಡಿಸಿ (ಹಸಿರಾಗಿ ಕೆಂಪು ಬಣ್ಣದ ತುದಿಯುಳ್ಳ ಕಾಯಿ/ಹಣ್ಣು).`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಆ. ಮಾದರಿಯಂತೆ ಪದ ರಚಿಸಿ (ರೈಲು + ಅನ್ನು = ರೈಲನ್ನು)`,[[`ನಾಡು + ಅನ್ನು`,`ನಾಡನ್ನು`],[`ಕಾಡು + ಅನ್ನು`,`ಕಾಡನ್ನು`],[`ಬಸ್ಸು + ಅನ್ನು`,`ಬಸ್ಸನ್ನು`],[`ಮಾತು + ಅನ್ನು`,`ಮಾತನ್ನು`]]],
[`ಭಾಷಾ ಚಟುವಟಿಕೆ – ಇ. ಗೆರೆ ಹಾಕಿದ ಪದ (ಕ್ರಿಯಾಪದ) ಗಮನಿಸಿ ಓದಿ`,[[`ಆನೆ ಘೀಳಿಟ್ಟಿತು; ನವಿಲು ನರ್ತಿಸಿತು; ಕರಡಿ ಕುಣಿಯಿತು; ಚಿರತೆ ವೇಗವಾಗಿ ಓಡಿತು; ಗಿಳಿ ರೆಕ್ಕೆ ಬಿಚ್ಚಿ ಹಾರುತ್ತಾ ಬಂದಿತು`,`ಘೀಳಿಟ್ಟಿತು, ನರ್ತಿಸಿತು, ಕುಣಿಯಿತು, ಓಡಿತು, ಹಾರುತ್ತಾ ಬಂದಿತು – ಇವು ಕೆಲಸವನ್ನು ಸೂಚಿಸುವ ಕ್ರಿಯಾಪದಗಳು.`]]],
[`ಬಳಕೆ ಚಟುವಟಿಕೆ – ಅನುಕೂಲ ಮತ್ತು ಅನನುಕೂಲ ಬರೆಯಿರಿ`,[
[`ದೂರದರ್ಶನ – ಅನುಕೂಲಗಳು`,`ಮನರಂಜನೆ, ಸುದ್ದಿ–ವಾರ್ತೆ ತಿಳಿಯುವುದು, ದೃಶ್ಯದ ಮೂಲಕ ಸುಲಭ ಕಲಿಕೆ (ಮಾದರಿ).`],
[`ದೂರದರ್ಶನ – ಅನನುಕೂಲಗಳು`,`ಕಣ್ಣಿಗೆ ಹಾನಿ, ಸಮಯ ವ್ಯರ್ಥ, ಓದಿನಲ್ಲಿ ಆಸಕ್ತಿ ಕಡಿಮೆ (ಮಾದರಿ).`],
[`ಮೊಬೈಲ್ – ಅನುಕೂಲಗಳು`,`ಸಂದೇಶ ಕಳುಹಿಸಬಹುದು, ಭಾವಚಿತ್ರ ತೆಗೆಯಬಹುದು, ಹಣ ವ್ಯವಹಾರ ಮಾಡಬಹುದು, ವಿಚಾರ ವಿನಿಮಯ ಮಾಡಬಹುದು.`],
[`ಮೊಬೈಲ್ – ಅನನುಕೂಲಗಳು`,`ಅತಿಯಾದ ಬಳಕೆಯಿಂದ ಆರೋಗ್ಯಕ್ಕೆ ಹಾನಿ, ಸಮಯ ವ್ಯರ್ಥ, ಆಟಕ್ಕೆ ಚಟ (ಮಾದರಿ).`]]],
[`ಬಳಕೆ ಚಟುವಟಿಕೆ – ಇತರ`,[[`ನೀನು ಆಡುವ ಆಟಗಳ ಪಟ್ಟಿ; ಈರುಳ್ಳಿ ಸಿಪ್ಪೆ ಆಟ; ಚಿತ್ರಕೋಶ; ಕಬಡ್ಡಿ; ಪಾಠದಲ್ಲಿ ನಿನಗಿಷ್ಟವಾದ ಪ್ರಾಣಿ/ಪಕ್ಷಿ ಮಾತು`,`ಚಟುವಟಿಕೆ ಆಧಾರಿತ – ಶಿಕ್ಷಕರ ಮಾರ್ಗದರ್ಶನದಲ್ಲಿ ತರಗತಿಯಲ್ಲಿ ಆಡಿಸಿ.`]]]

L(`Describe how the ants work together, as shown in the poem.`,`The ants move silently behind the bush, upon a mound. They pass leaves along a chain, one ant to the next, working as one with a single brain. They march on to feed the queen who lives deep below the ground, unseen. The workers also feed the silent drones in the nest. The poem shows how teamwork and discipline help the ants to live and work well.`),
L(`Compare how the ants and the spider spend their time in the poem.`,`The ants are busy and work together. They pass leaves along a chain, bring food and feed their queen. The spider works alone and quietly. It makes a web of silver strands and waits. When a fly is caught, the spider comes to seal its fate. It also shoots its web across a gap and swings on a single thread to spread the web. Ants show teamwork while the spider shows patience and cleverness.`)
]});
LSE.push({n:3,t:`Know Your Nation (Dialogue)`,au:`Prose (Dialogue)`,pg:10,
words:`hoist – to raise or pull up something using ropes; prison – a building where people are kept as punishment for a crime; represent – to be a sign or mark of something; gratitude – a feeling of being thankful to someone; signify – to mean or be a sign of something; progress – to get better at doing something; symbol – a picture or a shape that has a particular meaning or idea; abuse – to say rude things or treat someone or something badly; tribute – something you do or say to show respect for others`,

[`Let us know`,[
[`Flags of different countries are given. Identify and tick the flag of India.`,`The flag with three horizontal stripes – saffron, white and green – and a blue chakra in the centre of the white stripe (the first flag in the picture) is the flag of India. ⚠ Check with the picture in the textbook.`],
[`Describe the flag of India looking at the picture.`,`The Indian flag has three equal horizontal stripes: saffron at the top, white in the middle and green at the bottom. There is a blue Ashoka Chakra in the centre of the white stripe. (Model answer)`]]],

[`II. Who am I?`,[

[`I'm known for loyalty. I hunt thieves. I guard your house. I'm your friend.`,`Dog`]]],
[`III (a). Recognise the national leaders in the photographs and write their names`,[

[`Bhagat Singh, Lal Bahadur Shastri, Dr. S. Radhakrishnan, Dr. Abdul Kalam, Maulana Azad`,`Activity: Children collect pictures from newspapers or magazines, cut them out and paste them in the boxes against the correct names.`]]],
[`IV. Write the full names of our national leaders with the help of the clues`,[

[`V. Let us do`,[

],
qb:[
M(`We celebrate Independence Day on:`,[`January 26`,`August 15`,`October 2`,`November 14`],1),
M(`Before 1947, India was under the rule of the:`,[`French`,`Portuguese`,`British`,`Chinese`],2),
M(`In the Indian flag, saffron stands for:`,[`peace`,`sacrifice`,`prosperity`,`progress`],1),
M(`In the Indian flag, green stands for:`,[`peace`,`sacrifice`,`prosperity`,`progress`],2),
M(`The Ashoka Chakra is the symbol of:`,[`progress`,`peace`,`sacrifice`,`war`],0),
M(`Our national bird is the:`,[`parrot`,`peacock`,`crow`,`sparrow`],1),
M(`Our national anthem was written by:`,[`Rabindranath Tagore`,`Mahatma Gandhi`,`Jawaharlal Nehru`,`Bankim Chandra`],0,'m'),
M(`The National Emblem is taken from the:`,[`Sarnath pillar of Ashoka`,`Red Fort`,`Taj Mahal`,`Charminar`],0,'m'),
O(`Which is our national animal?`,`The tiger.`),
O(`Which is our national flower?`,`The lotus.`),
O(`What colour is the chakra in the white stripe of the flag?`,`Blue.`),
O(`What does the white colour in our flag stand for?`,`Peace.`),
O(`Who wrote our national anthem?`,`Gurudev Rabindranath Tagore.`),
O(`What did the teacher show to the students to explain the National Emblem?`,`A hundred rupee note.`,'m'),
G(`'Hoist' means:`,`to raise or pull up something using ropes`),
G(`'Gratitude' means:`,`a feeling of being thankful to someone`),
G(`Write the full name of 'Shastri'.`,`Lal Bahadur Shastri`),
G(`Write the full name of 'Patel'.`,`Sardar Vallabhbhai Patel`),
G(`Write the full name of 'Lal' (as in Lal–Bal–Pal).`,`Lala Lajpat Rai`),
G(`Who am I? 'I grow in muddy water and float. I'm pinkish red. I'm the national flower.'`,`Lotus`),
G(`Write the meaning of 'tribute'.`,`Something you do or say to show respect for others.`,'m'),
S(`Why do we hoist the national flag?`,`The flag means the nation itself and represents our motherland. We hoist it as a mark of respect to the country we are born in and to show our gratitude.`),
S(`What do the three colours of our flag represent?`,`Saffron stands for sacrifice, white stands for peace and green stands for prosperity.`),
S(`How can we respect our national symbols?`,`We should respect them and also protect them from abuse. We should stand at attention when the National Anthem is sung and take an active part in national festivals.`),
L(`Why is 15th August important for Indians? Who fought for our freedom?`,`We Indians became free on 15th August 1947. Before that, India was under British rule. Leaders like Tilak, Gokhale, Bhagat Singh, Gandhi, Savarkar, Nehru, Bose, Patel and others fought for many years to make India a free country. Many of them were sent to prison. We must always remember them. On this day we hoist the national flag and pay tribute to our country.`),
L(`Describe the national flag of India and explain what its colours and chakra mean.`,`The national flag of India has three horizontal stripes – saffron at the top, white in the middle and green at the bottom. In the white stripe there is a blue Ashoka Chakra. Saffron stands for sacrifice, white stands for peace and green stands for prosperity. The Ashoka Chakra is the symbol of progress. The flag represents our motherland, so we respect it.`)
]});

LSE.push({n:4,t:`A Nation's Strength (Poem)`,au:`Ralph Waldo Emerson`,pg:16,
words:`strength – the power to do things; honour – the respect you receive from other people; stand fast – to stay firm and not give up; suffer – to feel pain or trouble; dare – to be brave enough to do something; pillars – strong posts that hold up a building`,
notes:`A poem by Ralph Waldo Emerson. The poet says that a nation becomes great and strong not because of gold (wealth) but because of brave and honest people who stand firm for truth and honour, work while others sleep and build the pillars of the nation. Rhyming pairs: make – sake, strong – long, sleep – deep, fly – sky.`,
ab:[

[`strong :`,`long`],
[`deep :`,`sleep`],
[`sky :`,`fly`]]],
[`II. Answer the following questions`,[
[`What makes a nation great and strong according to the poet?`,`According to the poet, not gold but brave men who stand firm for truth and honour make a nation great and strong.`],
[`What do the brave men do while others sleep?`,`The brave men work while others sleep.`]]]
],
qb:[
M(`The poem 'A Nation's Strength' is written by:`,[`Cheryl Sandberg`,`Ralph Waldo Emerson`,`Michael Mitchell`,`Roger J Robicheau`],1),
M(`According to the poet, a nation is made great by:`,[`gold`,`brave and honest people`,`big buildings`,`weapons`],1),
M(`Which word rhymes with 'make'?`,[`sake`,`lake`,`sky`,`deep`],0),
M(`Which word rhymes with 'sky'?`,[`sleep`,`fly`,`strong`,`long`],1),
M(`The brave men work while others:`,[`sing`,`sleep`,`play`,`eat`],1),
M(`The brave men build a nation's pillars:`,[`high`,`deep`,`small`,`slowly`],1,'m'),
O(`What cannot make a people great and strong?`,`Gold (wealth).`),
O(`For whose sake do brave men stand fast?`,`For the sake of truth and honour.`),
O(`What do the brave men lift to the sky?`,`The pillars of the nation.`),
O(`Who wrote the poem 'A Nation's Strength'?`,`Ralph Waldo Emerson.`),
G(`Write the word from the poem that rhymes with 'strong'.`,`long`),
G(`Write the word from the poem that rhymes with 'deep'.`,`sleep`),
G(`Write the word from the poem that rhymes with 'sky'.`,`fly`),
G(`Write the word from the poem that rhymes with 'sake'.`,`make`),
G(`Write the meaning of 'honour'.`,`The respect you receive from other people.`,'m'),
S(`What kind of people make a nation great, according to the poet?`,`The poet says that brave people who stand firm for truth and honour and who work hard even when others sleep make a nation great and strong, not gold.`),
S(`What does the poet mean by 'They build a nation's pillars deep'?`,`The poet means that such brave people make the foundation of the nation very strong, like deep pillars that hold up a building.`),
L(`Explain the message of the poem 'A Nation's Strength' in your own words.`,`The poet tells us that wealth or gold cannot make a nation great. A nation becomes great and strong because of its people. They must be brave, honest and hard-working. They stand firm for truth and honour even when they suffer for a long time. They work while others sleep and dare while others run away. In this way they build the strong pillars of the nation and lift it to the sky. So we should become such good citizens.`)

LSE.push({n:5,t:`Dr. Kotnis`,au:`Prose (Biography)`,pg:17,
words:`matriculation – a level of examination to be passed to enter a college or university; bear – to deal with a painful or difficult situation; expenses – the amount of money spent on something; determination – the quality of trying to do something even when it is difficult; injured – having a wound or damage to a part of the body; wounded – hurt or injured; hardship – something that makes life difficult; epilepsy – a medical condition affecting the brain that can make one suddenly unconscious or unable to control movements for a short time; courtyard – an open space surrounded by buildings; mourned – felt very sad and missed someone after they died; revered – respected or admired very much; ancestors – members of the family who lived a long time ago; commemoration – a day that makes you remember and respect someone or something important; delegation – a group of people who represent a company, country, etc.; honour – the respect you receive from other people; remarkable – unusual or surprising and gets praised`,
notes:`A biography of Dwarakanath Shantharam Kotnis, born on 10 October 1910 in Solapur (a Kannada speaking area of Maharashtra). He studied Bachelor of Medicine at G.S. Medical College, University of Mumbai. During the China–Japan war of 1937 China asked India for doctors; he was one of five Indian doctors who went and the only one who stayed on. He used an ambulance as a mobile clinic, once worked for 72 hours without rest, and died of epilepsy in 1942 at the age of 32. He is buried in the Courtyard of Heroes and is still revered in China. A Hindi film, Dr. Kotnis Ki Amar Kahani, was directed by V. Shantharam. Unit IX Poem: For All We Have.`,
ab:[
[`Let us know`,[
[`Look at the map and write the names of our neighbouring countries.`,`Pakistan, Afghanistan, China, Nepal, Bhutan, Bangladesh, Myanmar (Burma), Sri Lanka (across the sea) – activity with the teacher's help. (Model answer)`],
[`How should we be with our neighbours?`,`We should be friendly, helpful and respectful towards our neighbours. (Model answer)`]]],
[`I. Answer the following questions`,[
[`When was Dwarakanath Kotnis born?`,`He was born on 10 October 1910.`],
[`Where did he study his medicine?`,`He studied Bachelor of Medicine at G.S. Medical College of the University of Mumbai.`],
[`Who invaded China in 1937?`,`Japan.`],
[`How old was Dr. Kotnis when he went to China?`,`⚠ The lesson does not state it. He was born in 1910 and went to China in 1938, so he was about 28 years old. (He died at the age of 32 in 1942.) Verify with your teacher.`],
[`Where was his body buried?`,`His body was buried in the Courtyard of Heroes (in China).`],
[`Name the movie directed by V. Shantharam on the life of Dr. Kotnis.`,`Dr. Kotnis Ki Amar Kahani.`]]],
[`II. Choose the right word given in brackets and complete the sentences`,[
[`The military life and stress made Kotnis ______ . (week / weak)`,`weak`],
[`Dr. Kotnis is revered ______ the Chinese even today. (by / buy)`,`by`],
[`School children ______ offer flowers to Dr. Kotnis' statue. (too / two)`,`too`],
[`On "Ancestors Commemoration Day" flowers ______ offered to the statue of Dr. Kotnis. (where / were)`,`were`],
[`Dr. Kotnis has ______ the hearts of many Chinese. (one / won)`,`won`]]],
[`III. Find at least ten words related to sickness from the grid`,[
[`Word grid`,`MEDICINE, NURSE, TREATMENT, EMERGENCY, DOCTOR, PATIENT, SICK, HOSPITAL, NEEDLE, AMBULANCE (all across) and WARD (down the first column).`]]],
[`IV. Circle the odd one that doesn't belong to the group`,[
[`life, progress, dull, grow, active`,`dull (given)`],
[`war, fight, bullets, love, wound`,`love`],
[`rest, sleep, relax, travel, peaceful`,`travel`],
[`rever, honour, forget, respect, tribute`,`forget`],
[`movie, shooting, theater, book, actor`,`book`],
[`medicine, clinic, ambulance, injection, movie`,`movie`],
[`death, active, bury, mourn, sad`,`active`]]],
[`V. Talk to your friends and find out how they helped others`,[
[`Table: Name – helped whom – where – what help`,`Model answers: Kotnis – wounded soldiers of war – in the ambulance – treatment; Ravi – an old man – on the road – helped him to cross; Anita – a lost child – at the market – took her to her mother.`]]],
[`VI. Imagine you are walking to school and you see a small child wounded and crying. Write a few lines about what you would do.`,[
[`Write a few lines`,`Model answer: I will go near the child and ask, "What happened?" I will speak kindly and give the child some water. I will call a grown-up or take the child to a nearby clinic. I will also inform the child's parents.`]]],
[`VII. Identify the differences in the picture 'B' and complete the sentences`,[
[`The building is ______; The playground is ______; The trees are ______; The man is ______; The sun is ______.`,`⚠ Check with the pictures. Model answers: The building is smaller; The playground is bigger; The trees are bigger; The man is taller; The sun is bigger.`]]],
[`VIII. Look at the pictures and complete the sentences`,[
[`The hospital is bigger than the ambulance. (big / huge)`,`(given)`],
[`There are ______ number of beds in the hospital ______ the ambulance. (more / much)`,`more ... than`],
[`There are ______ number of doctors in the ambulance ______ in the hospital. (little / fewer)`,`fewer ... than`],
[`The facility in the ambulance is ______ ______ the hospital. (less / small)`,`less than`],
[`There is ______ ______ one room in the hospital. (much / more)`,`more than`]]],
[`IX. Let us speak – complete the dialogue with suitable responses`,[
[`You: ______? Seema: I have fever. You: ______? Seema: Yes. You: ______ Seema: Thank you.`,`Model answer: You: What is the matter, Seema? Seema: I have fever. You: Have you taken any medicine? Seema: Yes. You: Take rest and drink plenty of water. Seema: Thank you.`]]]
],
qb:[
M(`Dr. Kotnis was born in:`,[`Bengaluru`,`Solapur`,`Mumbai`,`Mysuru`],1),
M(`Dr. Kotnis studied medicine at:`,[`G.S. Medical College, Mumbai`,`Bangalore Medical College`,`Delhi University`,`Mysore University`],0),
M(`The war in 1937 was between:`,[`India and China`,`China and Japan`,`India and Japan`,`Japan and Korea`],1),
M(`How many Indian doctors went to China?`,[`two`,`three`,`five`,`ten`],2),
M(`Dr. Kotnis used a/an ______ as a mobile clinic.`,[`bus`,`ambulance`,`train`,`tent`],1),
M(`Dr. Kotnis died at the age of:`,[`22`,`32`,`42`,`52`],1),
M(`'Revered' means:`,[`forgotten`,`respected very much`,`punished`,`teased`],1,'m'),
M(`'Delegation' means:`,[`a group of people who represent a country`,`a type of food`,`a kind of medicine`,`a small village`],0,'m'),
O(`Who was Dwarakanath Shantharam Kotnis?`,`He was a great Indian doctor who served wounded soldiers in China.`),
O(`Why did China request India to send doctors?`,`To treat the soldiers injured in the war with Japan.`),
O(`For how many hours did Dr. Kotnis once work continuously?`,`72 hours.`),
O(`On which occasion were flowers sent to the statue of Dr. Kotnis in April 2005?`,`On Ancestors Commemoration Day.`),
O(`Who directed the Hindi film on Dr. Kotnis?`,`V. Shantharam.`,'m'),
G(`Choose the right word: The military life made Kotnis ______ . (week / weak)`,`weak`),
G(`Choose the right word: Flowers ______ offered to the statue. (where / were)`,`were`),
G(`Choose the right word: Dr. Kotnis has ______ the hearts of many Chinese. (one / won)`,`won`),
G(`Circle the odd one out: war, fight, bullets, love, wound`,`love`),
G(`Circle the odd one out: rever, honour, forget, respect, tribute`,`forget`),
G(`Write the meaning of 'epilepsy'.`,`A medical condition affecting the brain that can make one suddenly unconscious or unable to control movements for a short time.`,'m'),
S(`How did Dr. Kotnis treat the wounded soldiers in China?`,`He used an ambulance as a mobile clinic. At times he carried the wounded soldiers on his shoulders. Once he worked for 72 hours without rest or sleep.`),
S(`What difficulties did Kotnis face to become a doctor?`,`His family could not bear the expenses of his medical education. But with hard work, determination and help from others he was able to study medicine.`),
S(`How do the Chinese show their respect for Dr. Kotnis even today?`,`Flowers are sent to his statue on Ancestors Commemoration Day, even by school children. Any top-level Chinese delegation to India honours his family.`),
L(`Write a short note on the life and service of Dr. Kotnis.`,`Dr. Dwarakanath Shantharam Kotnis was born on 10 October 1910 in Solapur. His family was poor, but with hard work and help from others he studied Bachelor of Medicine in Mumbai. In 1937 there was a war between China and Japan, and China asked India for doctors. Kotnis was one of five Indian doctors who went. When the others returned, he stayed on. He treated wounded soldiers in an ambulance that served as a mobile clinic and once worked for 72 hours without rest. The hardships made him weak and he died of epilepsy in 1942 at the age of 32. The Chinese still honour him.`),
L(`'The army has lost a helping hand, the nation has lost a friend.' Who said this and what does it show?`,`The President of China said this when Dr. Kotnis died. It shows that Dr. Kotnis served the Chinese soldiers like a true friend and helper. He worked for the people of another country without thinking of himself, so the Chinese people felt that they had lost a friend. His international spirit is remembered even today.`)
]});

LSE.push({n:6,t:`For All We Have (Poem)`,au:`Roger J Robicheau`,pg:24,
words:`delight – great pleasure or joy; tender – gentle and loving; embrace – to hold someone lovingly or to accept something happily; reflections – serious thoughts about the past; nurtured – cared for and helped to grow; spirit – the inner strength or memory of a person; praise – to say good things about someone; freedom – the power to act or speak without being controlled`,
notes:`A poem by Roger J Robicheau about thankfulness. The poet is grateful for family, friends, love and hugs, for the lessons of life, and for the people who serve the nation and are often far from home. The poem says our nation should praise every special person, because all that we have comes through what they have done. Rhyming pairs include sight – delight, smile – mile, air – near, thought – taught, day – away, one – done.`,
ab:[
[`I. Write a rhyming word from the poem for each of the following words and add one more of your own`,[
[`smile`,`mile, file (given)`],
[`day`,`away, say (or play, stay)`],
[`sight`,`delight, light (or night, bright)`],
[`one`,`done, run (or sun, fun)`]]],
[`II. Underline the correct words in the brackets`,[
[`The presence of love fills ______ (the air / our hearts)`,`the air`],
[`We should remember our loved ones who are ______ (away / near)`,`away`],
[`Our nation should ______ (hate / praise) all people for what they have done for us.`,`praise`]]]
],
qb:[
M(`The poem 'For All We Have' is written by:`,[`Roger J Robicheau`,`Michael Mitchell`,`Cheryl Sandberg`,`Ralph Waldo Emerson`],0),
M(`The presence of love fills:`,[`the sea`,`the air`,`the school`,`the road`],1),
M(`The poet thinks often of loved ones who are:`,[`near`,`away`,`sleeping`,`angry`],1),
M(`Our nation should ______ each special one.`,[`hate`,`praise`,`forget`,`punish`],1),
M(`Which word rhymes with 'sight'?`,[`delight`,`day`,`smile`,`mile`],0),
M(`Which word rhymes with 'smile'?`,[`mile`,`near`,`one`,`gone`],0,'m'),
O(`Who wrote the poem 'For All We Have'?`,`Roger J Robicheau.`),
O(`What brings our hearts so near?`,`The presence of love, a gift of God.`),
O(`What should our nation do for each special one?`,`Praise them.`),
O(`Through whom do we get all that we have, according to the poet?`,`Through what the special people (those who serve the nation) have done.`,'m'),
G(`Write the word from the poem that rhymes with 'day'.`,`away`),
G(`Write the word from the poem that rhymes with 'one'.`,`done`),
G(`Write the word from the poem that rhymes with 'sight'.`,`delight`),
G(`Write the word from the poem that rhymes with 'air'.`,`near`,'m'),
G(`Write the meaning of 'tender'.`,`gentle and loving`,'m'),
S(`What things in life is the poet thankful for?`,`The poet is thankful for family and friends, a caring kiss and a gentle smile, tender hugs, the presence of love and the lessons that life has taught.`),
S(`Why does the poet say our nation should praise each special one?`,`The poet says all that we have is through what those special people have done. They serve the nation, so we should be thankful to them.`),
L(`What is the message of the poem 'For All We Have'? Write in your own words.`,`The poem teaches us to be thankful. We should be grateful for our family and friends, for love and hugs, and for the things life has taught us. We should also remember the people who serve the nation and are often away from their loved ones. Their spirit stays with us. All that we have, including our freedom, is because of what they have done. So our nation should praise and respect each of them.`)
]});
LSE.push({n:7,t:`Thimmakka`,au:`Prose (Biography)`,pg:26,
words:`cowherd – someone whose job is to care for cattle; labourer – a worker who does physical work; saplings – young trees; effort – hard work; earn – to get money (or praise) for the work that you do; award – a prize or money given to someone for something they have done; gallery – a large building where people can see works of art or pictures of famous people; appreciation – a feeling of being thankful to someone for doing something good; display – show`,
notes:`A biography of Thimmakka of Hulikal village, Magadi taluk, near Bengaluru. She was born poor and could not go to school; she cannot read or write even today. She married Chikkaiah, a cowherd, and learned that she could not have a child. To keep herself busy she and her husband planted saplings along the road to the neighbouring village – 10 in the first year, 15 in the second, 20 in the third and more every year – and looked after them like children, carrying water four kilometres. They have planted 284 trees. Her work earned many awards, but she has no one to look after her in old age. Poem in this unit: Trees are a lot Like Us.`,
ab:[
[`Let us know`,[
[`Compare the two pictures (Bengaluru 25 years ago and now) and write sentences using 'Then' and 'Now'.`,`Model answers: Trees – Then Bengaluru had many trees, but now it has few trees. Houses – Then there were small houses, but now there are tall buildings. Vehicles – Then there were few vehicles, but now there are many vehicles. Roads – Then the roads were quiet and clean, but now they are crowded.`]]],
[`I. Underline the correct answer`,[
[`Thimmakka could not go to school because (a) There was no school in her village. (b) Her parents were very poor.`,`(b) Her parents were very poor.`],
[`Thimmakka earned many awards for (a) being illiterate. (b) planting trees.`,`(b) planting trees.`]]],
[`II. How many times are the following words repeated in this lesson?`,[
[`THIMMAKKA`,`7 times ⚠`],
[`TREES`,`5 times ⚠`],
[`PLANTS`,`4 times ⚠`],
[`SAPLING`,`7 times (saplings 6 + sapling 1) ⚠. These counts are for the passage only, excluding the title and the word list. Ask children to count and check.`]]],
[`III. Answer the following questions`,[
[`What did Thimmakka do to keep herself busy?`,`She decided to grow something. She began to plant trees along the road connecting her village with the neighbouring village.`],
[`Why did Thimmakka want to plant trees?`,`Thimmakka could not have a child, so she wanted to create life. Her only aim was to create life by growing trees.`],
[`When did Thimmakka and Chikkaiah plant trees mostly?`,`They planted the saplings mainly when the rains started.`],
[`How did people come to know about Thimmakka and her love for plants?`,`When she stopped the villagers from cutting her trees with the help of the local police, it made news. Many people read about her efforts.`],
[`How have people shown their appreciation of her work?`,`People have given her many awards and certificates, such as the National Citizen's Award and the Indira Priyadarshini Vrikshamitra Award. They are displayed on the walls of her hut.`],
[`What kind of a woman is Thimmakka?`,`Thimmakka is a hard-working, caring and determined woman who loves plants and nature. (Model answer)`]]],
[`IV. Identify the trees and write their names`,[
[`Six pictures`,`⚠ Check with the pictures. Likely answers in order: mango tree, neem (or banyan) tree, banana plant, coconut tree, papaya tree, Ashoka tree (cone shaped).`]]],
[`V. Put the plants / trees in their right boxes`,[
[`Trees / plants that grow from seeds`,`guava, neem, coconut, mango, papaya, black neem`],
[`Trees / plants that grow from cuttings`,`rose, cactus, hibiscus, drumstick (drumstick can also grow from seeds) ⚠`]]],
[`VI. Verbs that come after the word 'to' in this lesson`,[

G(`Write the meaning of 'sneak off'.`,`to leave a place quietly without being seen or heard`,'m'),
G(`Write the meaning of 'devour'.`,`to eat quickly, greedily or hungrily`,'m'),
G(`Write the opposite of 'backward'.`,`forward`),
S(`How did the fawn escape from the lion?`,`The fawn replied that the water was flowing from the lion's side towards him, so he could not spoil it. The lion could not think of another blame. Just then the fawn heard his mother calling and ran to her.`),
S(`Why was the lion disappointed in the end?`,`The lion wanted to eat the fawn but the fawn ran away to his mother and was soon out of sight.`),
L(`Write the story 'Obey Your Parents' in your own words and say what you learn from it.`,`A little fawn lived with his mother. He had grown up but his mother did not allow him to go alone, so he felt frustrated. One hot summer day, when she was asleep, he slipped out and played in an open field. When he felt thirsty he went to a stream. There he saw a lion staring at him with burning eyes. The lion falsely blamed him for spoiling the water. The fawn politely said that the water was flowing from the lion's side. The lion could not think of another blame. At that moment the fawn's mother called him, and he ran to her. The story teaches us to obey our parents.`)
