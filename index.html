.cnt{color:var(--mut);margin:.4rem 0 1rem}
.qwrap{display:grid;gap:1.1rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,26rem),1fr))}.qwrap .card{margin:0}

.bph{font-weight:800;margin:.9rem 0 .3rem;color:var(--tan2)}

/* ===== ಹೋಮ್ / ವಿಷಯ ಪಟ್ಟಿ ರೆಸ್ಪಾನ್ಸಿವ್ ಗ್ರಿಡ್ (index-4 ನಿಂದ) ===== */
.fade.fill{flex:1;display:flex;flex-direction:column}
.hgrid{flex:1;display:grid;gap:clamp(.6rem,1.6vw,1.6rem);grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr}

.hgrid .tile{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:.6rem}
.sgrid .tile{display:flex;align-items:center;justify-content:flex-start;min-height:7rem}
.hgrid .tile .n{font-size:clamp(2.2rem,6.5vw,5.5rem)}

@media(max-width:700px){.hero{min-height:8rem}.hero h1{font-size:2.1rem}.hero p{font-size:.68rem;margin-top:.1rem}.hgrid .tile .e,.hgrid .tile .badge{font-size:.68rem}.hgrid .tile .e{display:none}.hgrid .tile .l{font-size:.85rem;margin-top:.2rem}.hgrid .tile .badge{margin-top:.3rem;padding:.1rem .6rem}.h2{font-size:1.15rem}.fade .sub{margin-bottom:.7rem;font-size:.82rem}.sgrid{grid-template-columns:1fr}main{padding-top:.7rem;padding-bottom:.7rem}.hgrid{gap:.55rem}.hgrid .tile{padding:.3rem}.hgrid .tile .n{font-size:1.9rem}}
main{max-width:min(1100px,100%)}

/* ===== ಹಂತ-ಹಂತ ಉತ್ತರಗಳು: ಹೊಸ ಸಾಲು ಉಳಿಸಿ ತೋರಿಸು ===== */
.ans{white-space:pre-line}
/* ===== ಅಭ್ಯಾಸ ಉತ್ತರ ಚಿತ್ರಗಳು ===== */
.qpic{margin:.5rem 0;text-align:center}.qpic img,.qpic svg{max-width:100%;height:auto;max-height:22rem;background:#fff;border-radius:.6rem;padding:.4rem}
/* ===== ಅಭ್ಯಾಸ ಉತ್ತರಗಳು: ಎಡಿಟ್ ಮತ್ತು ಮುದ್ರಣ ===== */
.abhead{display:flex;align-items:flex-start;justify-content:space-between;gap:.6rem;flex-wrap:wrap}.abhead h3{flex:1;min-width:10rem;margin-bottom:.4rem}.abbtns{display:flex;gap:.5rem;flex-wrap:wrap}.abbtns .btn{margin:0;padding:.45rem .9rem;font-size:.85rem}#abbody.editing{outline:2px dashed var(--tan);outline-offset:6px}
.ans.col{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
.tbl{display:grid;grid-template-columns:1fr auto;gap:.15rem 1.6rem;max-width:30rem;margin:.4rem 0 .6rem}.trow{display:contents}.tbl span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.vsum{display:grid;width:max-content;max-width:100%;grid-template-columns:auto auto auto auto;column-gap:.3rem;font-family:ui-monospace,Menlo,Consolas,monospace;margin:.3rem 0 .5rem}.vsum .r,.vsum .op{text-align:right}.vsum .l,.vsum .dot{text-align:left}.vsum .dot{text-align:center}.vsum .h{font-family:inherit;font-weight:700;color:var(--tan)}.vsum .h.r{text-align:right;padding-right:.2rem}.vsum .rule{grid-column:1/-1;border-top:1px solid currentColor;margin:.1rem 0}
.gridwrap{overflow-x:auto;margin:.4rem 0}.gtbl{border-collapse:collapse;font-size:.9em;min-width:60%}.gtbl td{border:1px solid rgba(255,255,255,.28);padding:.3rem .55rem;text-align:left;vertical-align:top}.gtbl td.n{text-align:right;font-variant-numeric:tabular-nums}.gtbl tr:first-child td{font-weight:700;color:var(--tan)}
.qpic img{max-width:100%;border-radius:10px;margin:6px 0;background:#fff}
/* ===== v12: ಬ್ಲೂಪ್ರಿಂಟ್ (ಮಾದರಿ ಪತ್ರಿಕೆಯಂತೆ), ಮುದ್ರಣ ===== */
.bpt td.l{text-align:left}.bpt small{font-weight:400}.bpg{font-size:.78rem;min-width:46rem}.bpg th,.bpg td{padding:.3rem .2rem}
.paper .bpt td.l{text-align:left}
.pq .qpic img{max-height:14rem}
@media print{
 html,body{background:#fff!important;color:#000!important;display:block}
 .top,.hero,footer,.tabs,.pills,.fl,select,.note,.btn,.h2,.sub,.toast,.nopr,.dd,.ddz,.bpwrap{display:none!important}
 main{padding:0;max-width:none}

/* ===== v13: ಕನ್ನಡ ಪತ್ರಿಕೆ ಮಾದರಿ, ಬ್ಲೂಪ್ರಿಂಟ್ ಸ್ಥಾನ ಮತ್ತು ಪ್ರತ್ಯೇಕ ಮುದ್ರಣ ===== */
.paper .sh{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;font-weight:700;margin:.2rem 0 .35rem}
.paper .wl{border-bottom:1px solid #6b7390;height:1.7rem;margin:.1rem 0 0 1.4rem}

.paper .wh{margin:.35rem 0 0 1.4rem}

.paper .mt td.ml,.paper .mt td.mr{width:36%}
.paper .mt td.ma{width:28%;border-bottom:1px solid #232a45}

 .bpwrap{display:none!important}

 body.pr-bp .bpwrap .bpbar{display:none!important}
 body.pr-bp .bpg{min-width:0!important}
 .paper .wl{border-bottom-color:#000}.paper .ln,.paper .mt td.ma{border-bottom-color:#000}
 .paper .pq .qpic img{max-height:8.5rem}
 .paper .sec,.paper .pq{break-inside:avoid}

.top{position:absolute;left:0;right:0;top:0;z-index:50;max-width:var(--wmax);margin:0 auto;padding:12px 13px;gap:9px;background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none}
.top .ib{width:38px;height:38px;position:relative;color:#fff;background:rgba(38,30,20,.55);border:1px solid rgba(255,230,190,.22);box-shadow:0 3px 10px rgba(0,0,0,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.top .ib svg{width:19px;height:19px}.top .ib:hover{transform:none}
.top #bk{width:42px;height:42px;margin-right:2px}
.top .ic-menu,.top .ic-user{display:none}
.top #bk[disabled]{opacity:1;pointer-events:none}.top #bk[disabled] .ic-back{display:none}.top #bk[disabled] .ic-menu{display:block}
.top:has(#bk[disabled]) .ic-home{display:none}.top:has(#bk[disabled]) .ic-user{display:block}
.top .deco{cursor:default}.top .rd{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:#ff4a4a;border:1px solid rgba(0,0,0,.35)}
.crumb{color:var(--gold);font-weight:700;font-size:13px;text-shadow:0 1px 6px rgba(0,0,0,.65);text-align:center}.crumb b{color:var(--gold)}
.hero{container-type:inline-size;max-width:var(--wmax);margin:0 auto;aspect-ratio:841/428;height:var(--banner-h,auto);max-height:30dvh;min-height:0;display:block;text-align:left;border:0;box-shadow:none;background:var(--hero-a) center/cover no-repeat #2a241a;border-bottom:1px solid rgba(255,230,190,.16)}
@media (min-width:900px) and (min-aspect-ratio:1/1){.hero{background-position:center 30%}}
.hero svg{display:none}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28),transparent 28%,transparent 62%,rgba(15,13,9,.55));pointer-events:none}
.hero .ht{position:absolute;z-index:2;left:27.7%;top:38%;padding:0;width:70%}
@media (min-width:900px) and (min-aspect-ratio:1/1){.hero .ht{top:22%}}
.hero h1{font-size:min(9.6cqw,7.4dvh);line-height:1.1;background:linear-gradient(180deg,#fff0d2,#f0c98f 60%,#d9a768);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));white-space:nowrap}
.hero .hsub{color:#f7e6c6;font-weight:600;font-size:min(3.1cqw,2.6dvh);margin-top:.5cqw;white-space:nowrap;text-shadow:0 1px 5px rgba(0,0,0,.6)}
.hero p{display:inline-block;margin-top:1.8cqw;padding:1.4cqw 0;border-top:1px solid rgba(255,230,190,.3);border-bottom:1px solid rgba(255,230,190,.3);font-size:2.2cqw;letter-spacing:.2em;color:#f2d49b;opacity:.95;white-space:nowrap}
.hero.sm{max-width:none;aspect-ratio:auto;min-height:150px;background:var(--hero-b) center 40%/cover no-repeat #2a241a}
.hero.sm .ht{position:relative;left:auto;top:auto;width:auto;padding:62px 16px 20px;text-align:center}
.hero.sm h1{font-size:34px}.hero.sm .hsub{display:none}.hero.sm p{border:0;font-size:11px;padding:0;margin-top:2px}
main:has(.hgrid){max-width:var(--wmax);padding:12px 13px 8px}
.feat{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;min-height:59px;padding:9px 14px;border-radius:18px;border:1px solid rgba(255,225,185,.25);background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04));box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-bottom:11px}
.fic{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--gold);background:rgba(20,17,12,.65);border:1px solid rgba(255,225,185,.25)}.fic svg{width:22px;height:22px}
.ft{position:relative;z-index:1;min-width:0}
.feat .h2{font-size:16px;margin:0;line-height:1.25;color:#fbf1dd}.feat .sub{font-size:11px;margin:1px 0 0;color:#d5c8b0;line-height:1.35}
.fleaf{position:absolute;right:0;top:0;height:100%;width:auto;mix-blend-mode:screen;opacity:.55;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 35%);mask-image:linear-gradient(90deg,transparent,#000 35%)}
.hgrid{flex:none;grid-template-columns:repeat(var(--hcols),minmax(0,1fr))!important;grid-auto-rows:auto;gap:clamp(8px,1.2vw,22px) clamp(6px,1.2vw,22px)}
.hgrid .tile.pc{container-type:inline-size;position:relative;display:flex;flex-direction:column;justify-content:center;text-align:left;aspect-ratio:390/190;padding:0;border-radius:18px;overflow:hidden;color:var(--t);background:linear-gradient(100deg,var(--a),var(--b));border:1px solid rgba(255,225,185,.4);box-shadow:0 6px 14px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.22);backdrop-filter:none;-webkit-backdrop-filter:none}
.hgrid .tile.pc:nth-child(n+9){aspect-ratio:390/204}
.hgrid .tile.pc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:56%;background:var(--ph) left center/cover no-repeat;-webkit-mask-image:linear-gradient(90deg,#000 62%,transparent);mask-image:linear-gradient(90deg,#000 62%,transparent)}
.hgrid .tile.pc::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 38%,rgba(0,0,0,.14))}
.hgrid .tile.pc .tx{position:absolute;z-index:2;left:47%;right:3%;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.hgrid .tile.pc .n{font-size:14cqw;line-height:1;font-weight:800;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--t);text-shadow:0 1px 4px rgba(0,0,0,.25)}
.hgrid .tile.pc .l{margin:1cqw 0 0;font-size:5.4cqw;font-weight:800;color:var(--t);line-height:1.3}

.top{padding:20px 9px 12px 13px;gap:6px}
.top #bk{width:34px;height:34px;margin-right:0}
.top .ib{width:30px;height:30px}
.top #bk svg,.top .ib svg{width:17px;height:17px}
.top .rd{top:3px;right:4px;width:7px;height:7px}
.crumb{padding-left:22px}
.hero p{margin-top:.25cqw;padding:.75cqw 0;line-height:1.5}
main:has(.hgrid){padding:10px 12px 8px}
.feat{min-height:50px;padding:6px 12px 6px 6px;gap:9px;margin-bottom:8px;border-radius:16px}
.fic{width:34px;height:34px;border-radius:10px}.fic svg{width:20px;height:20px}
.feat .h2{font-size:17px}
.hgrid{gap:8px 5px}
.hgrid .tile.pc{aspect-ratio:390/181}
.hgrid .tile.pc:nth-child(n+3){aspect-ratio:390/187}
.hgrid .tile.pc:nth-child(n+5){aspect-ratio:390/189}
.hgrid .tile.pc:nth-child(n+7){aspect-ratio:390/190}
.hgrid .tile.pc:nth-child(n+9){aspect-ratio:390/202}
.hgrid .tile.pc .tx{left:48.5%;right:3%}
.hgrid .tile.pc .n{font-size:16.5cqw}
.hgrid .tile.pc .l{margin-top:.4cqw;font-size:5.7cqw}
.hgrid .tile.pc .act{gap:3.3cqw;margin-top:2.8cqw}
.hgrid .tile.pc .badge{padding:2.5cqw 2cqw}
.hgrid .tile.pc .arw{width:11.3cqw;height:11.3cqw}
footer{margin:13px auto 26px;padding:12px 44px;border-radius:16px;white-space:nowrap;font-size:min(11px,2.9vw);display:flex;justify-content:center;align-items:center;gap:.4em}
footer b{font-size:min(12.5px,3.3vw)}

/* ===== v16: class screen (subject list) matched to target reference ===== */
body.vcls .top{padding:20px 13px 12px 13px;gap:8px}
body.vcls .top .deco{display:none}
body.vcls .top .ib,body.vcls .top #bk{width:36px;height:36px;margin:0}
body.vcls .top .ib svg,body.vcls .top #bk svg{width:18px;height:18px}
body.vcls .crumb b{color:var(--gold)}

function colHtml(txt,L1='ರೂ.',L2='ಪೈ'){const lines=txt.split('\n');let i=0;
 const cell=(c,cls)=>`<span class="${cls||''}">${c}</span>`;
 let rows=cell('')+cell(L1,'h r')+cell('')+cell(L2,'h');
 while(i<lines.length&&lines[i].trim()!==''){const t=lines[i].trim();
   if(/^[-—]+$/.test(t))rows+=cell('','rule');
   else{const m=t.match(/^([+−-]?)\s*(\d+)\.(\d+)$/);
     if(m)rows+=cell(m[1]||'','op')+cell(m[2],'r')+cell('.','dot')+cell(m[3],'l');
     else rows+=cell(esc(t),'rule')}
   i++}
 const rest=lines.slice(i).join('\n').trim();
 return `<div class="ans"><b>${T('ans')}</b><div class="vsum">${rows}</div>${esc(rest)}</div>`}
function gridHtml(txt){const lines=txt.split('\n');let html='',rest=[],inG=true;
 lines.forEach(ln=>{if(inG&&ln.includes('|')){html+='<tr>'+ln.split('|').map(c=>{c=c.trim();const num=/^[\d.,₹\-]+$/.test(c)||/^\d/.test(c);return `<td class="${num?'n':''}">${esc(c)}</td>`}).join('')+'</tr>'}else{inG=false;rest.push(ln)}});
 return `<div class="ans"><b>${T('ans')}</b><div class="gridwrap"><table class="gtbl"><tbody>${html}</tbody></table></div>${esc(rest.join('\n').trim())}</div>`}
function ansHtml(a){a=String(a);

 if(a.startsWith('[COLKG]'))return colHtml(a.slice(7),'kg','g');
 if(a.startsWith('[COLLM]'))return colHtml(a.slice(7),'ಲೀ','ಮಿಲೀ');
 if(a.startsWith('[GRID]'))return gridHtml(a.slice(6));
 if(a.startsWith('[TAB]')){let rows='',rest=[];a.slice(5).split('\n').forEach(ln=>{const i=ln.indexOf('|');if(i>0&&!rest.length){rows+=`<div class="trow"><span>${esc(ln.slice(0,i))}</span><span>${esc(ln.slice(i+1))}</span></div>`}else rest.push(ln)});return `<div class="ans"><b>${T('ans')}</b><div class="tbl">${rows}</div>${esc(rest.join('\n'))}</div>`}

function buildPaperKN(){

function printMode(m,ev){
 const c=document.body.classList;c.remove('pr-paper','pr-bp','pr-ab');c.add('pr-'+m);
 /* mouse/touch activation → drop focus so the button cannot look selected; keyboard activation (detail 0) keeps focus for accessibility */
 const b=ev&&ev.currentTarget;PRN.blur=!(ev&&ev.detail===0);
 if(b&&PRN.blur&&b.blur)b.blur();
 PRN.on=true;PRN.t=Date.now();clearTimeout(PRN.timer);PRN.timer=setTimeout(endPrint,180000);
 setTimeout(()=>{try{window.print()}catch(e){endPrint()}},60)}
window.addEventListener('afterprint',endPrint);
window.addEventListener('pageshow',()=>{resetPrintUi();if(PRN.on&&Date.now()-PRN.t>500)endPrint()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){resetPrintUi();if(PRN.on&&Date.now()-PRN.t>800)endPrint()}});
window.addEventListener('focus',()=>{if(PRN.on&&Date.now()-PRN.t>1500)endPrint();else resetPrintUi()});
function togEdit(b){const p=$('pp');if(!p)return;const on=p.getAttribute('contenteditable')==='true';p.setAttribute('contenteditable',on?'false':'true');p.classList.toggle('editing',!on);b.classList.toggle('on',!on);b.textContent=pl(on?T('edit'):T('editDone'))}
/* v21: leading emoji removed from action pills (icons are drawn in CSS) */
const pl=s=>String(s).replace(/^[^\p{L}\p{N}]+/u,'');
/* v22: selected state for one-shot actions (new / print paper / print blueprint); resets when exam tab or lesson changes */
function actCtx(){return ST.ptype+'|'+(ST.sel&&ST.sel[ST.ptype])}
function actOn(k){return ST.act&&ST.act.k===k&&ST.act.c===actCtx()?' on':''}
function setAct(k){ST.act={k:k,c:actCtx()};document.querySelectorAll('.acts .btn[data-act]').forEach(x=>x.classList.toggle('on',x.dataset.act===k))}
/* v21: ಬ್ಲೂಪ್ರಿಂಟ್ ಮುದ್ರಿಸಿ now lives in the action rows; blueprint must exist in DOM to print */
function printBpMode(ev){if(!ST.bpOpen){ST.bpOpen=true;render()}printMode('bp',ev)}
/* ===== ಬ್ಲೂಪ್ರಿಂಟ್ (ಮಾದರಿ ಪ್ರಶ್ನೆ ಪತ್ರಿಕೆಯಂತೆ) ===== */
function formIdx(q){return q.fi!==undefined?q.fi:(q.t==='short'?1:q.t==='long'?2:0)}
function lessonShort(l){return ST.sub==='en'?l.t.replace(/\s*\(.*$/,''):l.t}
function bpPaperHtml(qs,ls){const B=T('bt'),max=PT[ST.ptype].max;const tq=qs.length,tm=qs.reduce((s,q)=>s+q.mk,0);const pc=m=>fmt(Math.round(m*1000/max)/10)+'%';
 /* 1. ಉದ್ದಿಷ್ಟವಾರು */
 const o=T('obj').map((n,i)=>{const f=qs.filter(q=>objOf(q)===i);return {n,q:f.length,m:f.reduce((s,q)=>s+q.mk,0),calc:false}});
 if(ST.sub!=='en')o.filter(x=>x.q===0).forEach(x=>{const big=o.reduce((a,b)=>b.m>a.m?b:a);big.m-=1;x.m=1;x.calc=true});
 const t1=`<div class="tw"><table class="bpt"><thead><tr><th>${B.objs}</th>${o.map(x=>`<th>${x.n}</th>`).join('')}<th>${B.total}</th></tr></thead><tbody><tr><td>${B.nq}</td>${o.map(x=>`<td>${x.q}</td>`).join('')}<td>${tq}</td></tr><tr class="tot"><td>${B.marks}</td>${o.map(x=>`<td>${fmt(x.m)}</td>`).join('')}<td>${fmt(max)}</td></tr><tr><td>${B.pct}</td>${o.map(x=>`<td>${pc(x.m)}</td>`).join('')}<td>100%</td></tr></tbody></table></div>`;
 /* 2. ಘಟಕವಾರು */
 const LS=lessons().filter(l=>ls.includes(l.n));
 const lrow=LS.map(l=>{const f=qs.filter(q=>q.ch===l.n);return {n:lessonShort(l),q:f.length,m:f.reduce((s,q)=>s+q.mk,0)}});
 const tbl=(rows,head)=>`<div class="tw"><table class="bpt"><thead><tr><th>${B.sl}</th><th>${head}</th><th>${B.nq}</th><th>${B.marks}</th><th>${B.pct}</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td class="l">${esc(r.n)}</td><td>${r.q}</td><td>${fmt(r.m)}</td><td>${pc(r.m)}</td></tr>`).join('')}<tr class="tot"><td colspan="2">${B.total}</td><td>${tq}</td><td>${fmt(tm)}</td><td>100%</td></tr></tbody></table></div>`;
 /* 3. ಸ್ವರೂಪ  4. ಕಠಿಣತೆ */
 const frow=B.qtypes.map((n,i)=>{const f=qs.filter(q=>formIdx(q)===i);return {n,q:f.length,m:f.reduce((s,q)=>s+q.mk,0)}});
 const drow=B.diffs.map((n,i)=>{const c='emh'[i];const f=qs.filter(q=>q.lv===c);return {n,q:f.length,m:f.reduce((s,q)=>s+q.mk,0)}});
 /* 5. ನೀಲನಕ್ಷೆ ಗ್ರಿಡ್ */
 const cell=(f)=>f.length?`${f.length}(${fmt(f.reduce((s,q)=>s+q.mk,0))})`:'';
 let g=`<div class="tw"><table class="bpt bpg"><thead><tr><th rowspan="2">${B.sl}</th><th rowspan="2">${B.unitsName}</th>${T('obj').map(n=>`<th colspan="3">${n}</th>`).join('')}<th colspan="2">${B.total}</th></tr><tr>${[0,1,2,3].map(()=>B.short3.map(s=>`<th>${s}</th>`).join('')).join('')}<th>${ST.sub==='en'?'Qns':'ಪ್ರಶ್ನೆ'}</th><th>${ST.sub==='en'?'Marks':'ಅಂಕ'}</th></tr></thead><tbody>`;
 const colQ=Array(12).fill(0),colM=Array(12).fill(0);
 LS.forEach((l,i)=>{const f=qs.filter(q=>q.ch===l.n);g+=`<tr><td>${i+1}</td><td class="l">${esc(lessonShort(l))}</td>`;
  for(let ob=0;ob<4;ob++)for(let fm=0;fm<3;fm++){const c=f.filter(q=>objOf(q)===ob&&formIdx(q)===fm);g+=`<td>${cell(c)}</td>`;colQ[ob*3+fm]+=c.length;colM[ob*3+fm]+=c.reduce((s,q)=>s+q.mk,0)}
  g+=`<td><b>${f.length}</b></td><td><b>${fmt(f.reduce((s,q)=>s+q.mk,0))}</b></td></tr>`});
 g+=`<tr class="tot"><td colspan="2">${B.totQ}</td>${colQ.map(x=>`<td>${x||''}</td>`).join('')}<td>${tq}</td><td></td></tr><tr class="tot"><td colspan="2">${B.totM}</td>${colM.map(x=>`<td>${x?fmt(x):''}</td>`).join('')}<td></td><td>${fmt(tm)}</td></tr></tbody></table></div><div class="chn">${B.note}</div>`;
 /* 6. ಪ್ರಶ್ನಾವಾರು ವಿಶ್ಲೇಷಣೆ */
 const lname=n=>{const l=lessons().find(x=>x.n===n);return l?lessonShort(l):''};
 let a=`<div class="tw"><table class="bpt"><thead><tr><th>${B.qn}</th><th>${B.unit}</th><th>${B.obj}</th><th>${B.spec}</th><th>${B.mk}</th><th>${B.form}</th><th>${B.diffc}</th><th>${B.tm}</th></tr></thead><tbody>`;
 let tt=0;qs.forEach((q,i)=>{const tmv=q.tm||TMIN[q.t];tt+=tmv;a+=`<tr><td>${i+1}</td><td class="l">${esc(lname(q.ch))}</td><td>${T('obj')[objOf(q)]}</td><td>${q.sp||B.specs[q.t]}</td><td>${fmt(q.mk)}</td><td>${q.fi!==undefined?B.qtypes[q.fi]:B.forms[q.t]}</td><td>${B.diffs['emh'.indexOf(q.lv)]}</td><td>${tmv}</td></tr>`});
 a+=`<tr class="tot"><td colspan="4">${B.total}</td><td>${fmt(tm)}</td><td></td><td></td><td>${tt}</td></tr></tbody></table></div>`;
 return `<div class="bph">${B.t1}</div>${t1}<div class="bph">${B.t2}</div>${tbl(lrow,B.unitName)}<div class="bph">${B.t3}</div>${tbl(frow,B.qform)}<div class="bph">${B.t4}</div>${tbl(drow,B.diff)}<div class="bph">${B.t5}</div>${g}<div class="bph">${B.t6}</div>${a}`}
function vPaper(){if(!allQ().length)return `<div class="card glass neu">${T('noPaper')}</div>`;
 const P=ST.ptype;ensureSel(P);const o=selOpts(P),v=ST.sel[P];
 const paperHtml=ST.sub==='kn'?buildPaperKN():ST.sub==='en'?buildPaperEN():buildPaper();
 const bpSec=ST.bpOpen?`<div class="card glass neu bpwrap"><div class="bpbar"><h3>${T('bpTitle')}</h3></div>${bpPaperHtml(ST.lastPicked,ST.lastLs)}</div>`:'';
 const tabs=['unit','fa3','fa4','sa2'].map(k=>`<button class="tb sm ${P===k?'on':''}" data-p="${k}" onclick="ST.ptype='${k}';render()">${T('examTab')[k]} (${PT[k].max})</button>`).join('');
 const po=[];if(o.g.length){po.push([null,T('groups')]);o.g.forEach(x=>po.push(x))}if(o.s.length){po.push([null,T('single')]);o.s.forEach(x=>po.push(x))}
 return `<div class="card glass neu nopr ddz hsel"><label class="fl" style="margin-top:0">${T('lessonSel')}</label>${sel('psel',po,v,'ST.sel[ST.ptype]=value;render()')}</div><div class="tabs nopr">${tabs}</div>
 <div class="card glass neu nopr acard">
 <div class="pills acts"><button class="btn${actOn('new')}" data-ic="new" data-act="new" onclick="setAct('new');ST.seed[ST.ptype]++;render()">${pl(T('newP'))}</button><button class="btn${ST.showAns?'':' on'}" data-ic="hide" onclick="ST.showAns=!ST.showAns;render()">${ST.showAns?T('hideA'):T('showA')}</button><button class="btn ${ST.bpOpen?'on':''}" data-ic="bp" onclick="ST.bpOpen=!ST.bpOpen;render()">${pl(T('bp'))} ${ST.bpOpen?'▴':'▾'}</button><button class="btn" data-ic="edit" onclick="togEdit(this)">${pl(T('edit'))}</button><button class="btn" type="button" data-ic="print" onclick="printMode('paper',event)">${pl(T('printP'))}</button><button class="btn" type="button" data-ic="print" onclick="printBpMode(event)">${pl(T('printBp'))}</button></div></div>${bpSec}${paperHtml}`}
/* ===== ರಸಪ್ರಶ್ನೆ ===== */
function vQuiz(){const list=allQ().filter(q=>(ST.qzc==='all'||q.ch==ST.qzc)&&(ST.qzt==='all'||q.t===ST.qzt)&&((ST.qzl||'all')==='all'||q.lv===ST.qzl));
 const lo=[['all',T('allCh')],...lessons().filter(l=>l.qb.length).map(l=>[String(l.n),lessonLabel(l)])];
 const to=[['all',T('allTypes')],...Object.keys(T('types')).map(k=>[k,T('types')[k]])];
 return `<div class="fgrid nopr"><div class="card glass neu nopr ddz fc"><label class="fl" style="margin-top:0">${T('chapter')}</label>${sel('qzc',lo,ST.qzc,'ST.qzc=value;startQuiz()')}</div><div class="card glass neu nopr ddz fc"><label class="fl" style="margin-top:0">${T('qtype')}</label>${sel('qzt',to,ST.qzt,'ST.qzt=value;startQuiz()')}</div></div><div class="pills lvp nopr">${[['all',T('allLv')],['e',T('lv').e],['m',T('lv').m],['h',T('lv').h]].map(p=>`<button class="pill ${(ST.qzl||'all')===p[0]?'on':''}" onclick="ST.qzl='${p[0]}';startQuiz()">${p[1]}</button>`).join('')}</div>`+quizHtml(list)}
function startQuiz(){ST.qi=0;ST.qs=0;ST.qa=null;ST.qo=[];render()}
function quizHtml(list){if(!list.length)return `<div class="card glass neu">${T('noQ')}</div>`;
 if(!ST.qo.length)ST.qo=shuffle(list.map(q=>q.id),rng(Date.now()%99999));const id=ST.qo[ST.qi];
 if(!id)return `<div class="card glass neu"><h3>${T('done')}</h3><p>${T('doneTxt')(ST.qo.length,ST.qs)}</p><button class="btn" onclick="startQuiz()">${T('again')}</button></div>`;
 const q=allQ().find(x=>x.id===id);const ans=ST.qa!==null;
 let h=`<div class="card glass neu qzcard qzb${ST.qi%7}${ans?' qzans':''}"><div class="qzbody"><div class="meta"><span class="tag">${T('types')[q.t]}</span><span>${markTxt(q.mk)}</span><span>${ST.qi+1}/${ST.qo.length}</span></div><div class="qt">${esc(q.q)}</div>${q.img?`<div class="qpic"><img loading="lazy" src="${q.img}" alt=""></div>`:''}`;
 if(q.t==='mcq')h+='<div class="opts'+(q.o.some(o=>String(o).length>45)?' lg':'')+'">'+q.o.map((o,i)=>{let c='';if(ans){if(i===q.a)c='ok';else if(i===ST.qa)c='bad'}return `<div class="opt ${c}" onclick="ansQ(${i},${q.a})" style="cursor:pointer"><span class="ol">${'ABCD'[i]}</span><span class="ot">${esc(o)}</span></div>`}).join('')+'</div>';
 else if(ans)h+=`<div class="ans"><b>${T('ans')}</b> ${esc(q.a)}</div>`;
 h+='</div><div class="qzact">';
 if(q.t!=='mcq'&&!ans)h+=`<button class="btn" onclick="ST.qa=0;render()">${T('showAns')}</button>`;
 if(ans)h+=`<button class="btn" onclick="ST.qi++;ST.qa=null;render()">${T('next')}</button>`;
 return h+'</div></div>'}
function ansQ(i,a){if(ST.qa!==null)return;ST.qa=i;if(i===a)ST.qs++;render()}
/* ===== ರೆಂಡರ್ ===== */
function render(){
 const hero=$('hero');hero.classList.toggle('sm',ST.view!=='home'&&ST.view!=='class'&&ST.view!=='subject');document.body.classList.toggle('vcls',ST.view==='class');document.body.classList.toggle('vsub',ST.view==='subject');{const qz=ST.view==='subject'&&ST.tab==='quiz';document.body.classList.toggle('vquiz',qz);document.documentElement.classList.toggle('vquiz',qz)}
 $('herop').textContent=(ST.view==='home'||ST.view==='class')?'Shikshana Parva · ಕಲಿಕೆಯ ಹಬ್ಬ':'ಶಿಕ್ಷಕರಿಗಾಗಿ ಕಲಿಕಾ ಸಂಪನ್ಮೂಲ ವೇದಿಕೆ';
 $('bk').disabled=ST.view==='home';
 let c='<b>ಮುಖಪುಟ</b>';if(ST.cls)c+=` › ${ORD[ST.cls-1]} ತರಗತಿ`;if(ST.sub&&ST.view==='subject'&&cur())c+=` › <b>${cur().title}</b>`;$('crumb').innerHTML=c;
 $('main').innerHTML=ST.view==='home'?vHome():ST.view==='class'?vClass():vSubject();}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
