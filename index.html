LSE6.push({n:4,t:`The Way to Succeed (Poem) – Unit 6 Poetry`,au:`Norman Macleod`,pg:35,
words:`strike – hit; might – strength; gaze – look; stumble – trip and lose one's balance; oft – often; downcast – disgraced, sad; succeed – win; aright – correctly, in the right way; persevere – keep trying; with a will – with determination`,
notes:`The poet advises boys (children) how to succeed in life: do every work properly ('drive the nail aright'), put in all your strength, and do it at the right time ('while the iron is red' – hot). Those who want to reach the top must first climb the hill; just standing at the foot and gazing at the sky will not take us up. Even if we stumble many times we should never feel sad, but try and try again – we will succeed at last. Theme: hard work, perseverance and positive attitude. Related proverbs: Where there is a will there is a way; Do or die; There is no shortcut to hard work. Further reading: Kannada translation by Panje Mangesh Rao.`,
ab:[
[`I. Discuss in pairs and answer`,[
[`"Drive the nail aright boys ……." What does the statement mean?`,`It means we should do our work properly and correctly, just as a nail must be hit on the head to go in straight.`],
[`What will happen if one never tries?`,`If one never tries, one can never get up to the top, that is, one can never achieve success.`],
[`When should we try and try again?`,`We should try again whenever we stumble or fail.`],
[`Why should we try and try again?`,`Because if we keep trying and do not give up, we will succeed at last.`],
[`What should one do to reach the top?`,`One must first climb the hill, that is, work hard and do the work with a will.`],
[`What suggestions does the poet give to succeed in life?`,`Do the work properly, with all your might and at the right time; do it with a will; never be downcast when you stumble; try and try again.`],
[`State True or False: a) The poet says that we must wait for the opportunity before doing anything.`,`False. The poet says we should strike while the iron is red (use the opportunity at once).`],
[`State True or False: b) According to the poet, failure is a stepping stone to success.`,`True.`],
[`Which words/phrases are related to achieving success in life? Colour them.`,`persevere, work hard, be active, aim high, be positive, be confident (take help from others). Not related: give up, be lazy, lose hope, never try.`],
[`What do you want to achieve in life? What efforts will you make?`,`Model answer: I want to become a doctor. I will study hard, work regularly and never give up even if I fail sometimes.`]]],
[`II. Match the Idioms with their meanings`,[
[`Drive the nail aright`,`have clear aims and vision`],
[`Strike while the iron is red`,`use the opportunity in the right way`],
[`Standing at the foot, gazing at the sky`,`hoping for the best without putting efforts`]]],
[`III. Match column A with column B`,[
[`1. Drive the nail aright`,`c) hit it on the head`],
[`2. Strike with all your might`,`d) while the iron is red`],
[`3. When you have work to do`,`e) do it with a will`],
[`4. To reach the top`,`a) one must first climb the hill`],
[`5. Though you stumble oft`,`b) never feel downcast (f – you will succeed at last, is an extra)`]]],
[`IV. Proverbs related to the theme of the poem`,[
[`Where there is a will there is a way`,`Related. If we have strong determination, we can find a way to succeed.`],
[`Do or die`,`Related. We must try our best to achieve the goal.`],
[`There is no shortcut to hard work`,`Related. Success comes only through hard work.`],
[`Awake, arise, stop not until you reach your goal`,`Related. We should keep working until we reach our goal.`],
[`Not related`,`A rolling stone gathers no moss; All that glitters is not gold; An idle mind is a devil's workshop (partly); Face is the index of mind.`]]],
[`Let's Appreciate`,[
[`Pick out the rhyming words`,`head – red; will – hill; sky – try; downcast – last (also aright – might)`],
[`Mime a line from the poem`,`Activity: A child acts a line such as 'Strike with all your might' or 'Gazing at the sky' and the others guess.`],
[`Suggest some more titles to the poem`,`Try and Try Again; Never Give Up; Climb the Hill; Hard Work Wins.`]]],
[`Extended activity – Word Bingo (action words from the poem)`,[
[`Six action words`,`drive, hit, strike, do, climb, reach (also: stand, gaze, stumble, try, succeed, get up)`]]],
[`About the Poet`,[
[`Who was Norman Macleod?`,`Reverend Norman Macleod (3 June 1812 – 16 June 1872) was a Scottish clergyman and author who worked for strengthening the Scottish Church.`]]]
],
qb:[
M(`The poem 'The Way to Succeed' is written by:`,[`Tony Bradman`,`Norman Macleod`,`Edgar A. Guest`,`F. Joanna`],1),
M(`'Strike while the iron is red' means:`,[`wait for a long time`,`use the opportunity at the right time`,`play with fire`,`stop working`],1),
M(`According to the poet, those who reach the top must first climb the:`,[`stairs`,`hill`,`tree`,`ladder`],1),
M(`'Stumble' means:`,[`run fast`,`trip and lose one's balance`,`jump`,`sit down`],1),
M(`'Oft' means:`,[`often`,`rarely`,`never`,`soon`],0),
M(`'Downcast' in the poem means:`,[`disgraced`,`happy`,`strong`,`angry`],0,'m'),
M(`Which word rhymes with 'head'?`,[`red`,`hill`,`sky`,`last`],0),
M(`The poet advises us to ______ if we fail.`,[`give up`,`try again`,`cry`,`wait`],1),
O(`What should we do when we have work to do?`,`We should do it with a will.`),
O(`What happens if we stand at the foot and only gaze at the sky?`,`We cannot get up (reach the top) if we never try.`),
O(`What will happen if we try and try again?`,`We will succeed at last.`),
O(`Who translated the poem into Kannada?`,`Panje Mangesh Rao.`,'m'),
O(`Name any two action words from the poem.`,`Drive, strike (also hit, climb, try).`),
G(`Write the meaning of 'strike'.`,`hit`),
G(`Write the meaning of 'gaze'.`,`look`),
G(`Write the meaning of 'might'.`,`strength`),
G(`Write the meaning of 'succeed'.`,`win`,'e'),
G(`Write the word from the poem that rhymes with 'try'.`,`sky`),
G(`Write the word from the poem that rhymes with 'will'.`,`hill`),
G(`Complete the proverb: Where there is a will, ______.`,`there is a way`),
S(`What does the poet mean by 'Standing at the foot, gazing at the sky'?`,`The poet means that one cannot reach the top by only standing at the foot of the hill and looking at the sky. We must make efforts. Wishing without working will not bring success.`),
S(`What advice does the poet give to those who stumble?`,`The poet says that we should never be downcast when we stumble. We should try and try again and we will succeed at last.`),
S(`Write the message of the poem in your own words.`,`The poem teaches us to work hard and to do our work properly and at the right time. We should do every job with determination and never give up. If we fail, we should try again, because success will come at last.`),
L(`Explain the poem 'The Way to Succeed' in your own words.`,`The poet Norman Macleod gives advice to children on how to succeed. He says that we should drive the nail aright and hit it on the head; that is, we must do our work properly. We should strike with all our might while the iron is red, that is, use the right opportunity. When we have work to do, we must do it with a will. Those who want to reach the top must first climb the hill. If we only stand at the foot and gaze at the sky, we can never get up. Even if we stumble many times, we should not feel sad, but try and try again. In the end we will surely succeed.`,'h')
]});

LSE6.push({n:5,t:`Neerja Bhanot: Brave in Life, Brave in Death – Unit 7 Prose`,au:`Prose (Biography)`,pg:42,
words:`attendant – a person employed to provide a service to the public; on board – on a plane; hijack – take control of a plane by force (ವಿಮಾನ ಅಪಹರಣ); recipient – a person who is awarded something; civilian – a person not in the armed services; alumna – a former woman student; purser – an officer on a plane who takes care of passengers; en route – on the way; cockpit – a compartment for the pilot; crew – all the people working on a plane; tarmac – a runway; flee – run away; take charge – assume control; set off – put in motion; explosive – a substance used in bombs; shield – protect from danger; hail of bullets – a collection of bullets; distress – anxiety, sorrow, pain; tribute – an act that shows gratitude, respect or admiration; citation – an official document in praise of some brave act; plaque (ಫಲಕ) – a piece of metal or stone given in memory of a person or event`,
notes:`Neerja Bhanot (7 September 1963 – 5 September 1986) was born in Chandigarh to Rama Bhanot and Harish Bhanot (a Mumbai-based journalist). She studied at Sacred Heart Senior Secondary School (Chandigarh), Bombay Scottish School and St. Xavier's College, Mumbai. She joined Pan Am Airlines in 1986 and was the senior flight purser on Pan Am Flight 73, which was hijacked by four heavily armed terrorists at Karachi. She alerted the cockpit crew, who fled from the plane, and took charge as the senior-most cabin crew member. The hijackers shot dead a passenger who said he was an American and asked her to collect the passports. Neerja and her colleagues hid the passports of 40 Americans. After seventeen hours the terrorists opened fire and set off explosives. Neerja opened the emergency door and helped many passengers escape but did not escape herself; she died shielding three children. She is the youngest recipient of the Ashoka Chakra, India's highest civilian award for bravery. Language work: present and past tense forms, missing words (was/were/did), making sentences.`,
ab:[
[`Preparatory activity 2 – Listening (news report: Air Hostess Neerja Bhanot honoured by Civil Aviation Ministry)`,[
[`Who is the air hostess mentioned in the report?`,`Neerja Bhanot, a Pan Am air hostess.`],

[`Why was she honoured?`,`She lost her life while saving the passengers of the Pan Am flight hijacked at Karachi airport. She was honoured at the function to launch the centenary celebrations of civil aviation in India.`],
[`Who hijacked the plane?`,`Armed terrorists.`]]],
[`Questions to find the answers while reading`,[

[`When did she join Pan Am Airlines?`,`In 1986.`],
[`Who escaped from the aircraft? Why?`,`The three-member cockpit crew (pilot, co-pilot and flight engineer) fled from the aircraft when it was hijacked, to save themselves from the armed terrorists. ⚠ (model answer)`],
[`How did Neerja die?`,`She died while shielding three children from a hail of bullets when the hijackers opened fire.`]]],
[`C1. Answer in a sentence each`,[
[`Where did Neerja study?`,`She studied at Sacred Heart Senior Secondary School, Chandigarh, Bombay Scottish School and St. Xavier's College, Mumbai.`],
[`Why was the flight described as 'ill-fated'?`,`Because it was hijacked by terrorists and ended in a tragedy in which many lives were lost, including Neerja's.`],
[`Name the highest civilian award for bravery given by the Indian government.`,`The Ashoka Chakra.`],
[`Name the flight that was hijacked. When and where did this happen?`,`Pan Am Flight 73 was hijacked at Karachi airport on 5 September 1986.`],
[`Who did the terrorists shoot first?`,`A passenger who identified himself to the terrorists as an American.`],
[`What did the pilot, co-pilot and the flight engineer do when they heard about the hijack? Do you think they were right?`,`They fled from the aircraft. Model answer: They saved their lives, but they should have stayed to help the passengers, so I think they were not right. ⚠ (opinion)`],
[`Did Neerja hide the passports of the Americans? Why/Why not?`,`Yes. The terrorists wanted to identify and kill the Americans, so Neerja and the other attendants hid the passports of the 40 Americans.`],
[`Why is Neerja called 'the heroine of the hijack'?`,`Because she saved the lives of many passengers by risking and finally giving her own life.`],
[`What is your ambition in life?`,`Model answer: I want to become a pilot / doctor / teacher and serve my country.`]]],
[`C2. Arrange the sentences in order to make a meaningful paragraph`,[
[`Correct order`,`3, 4, 6, 1, 2, 5`],
[`Paragraph`,`Neerja was the Senior Flight Purser on a Pan Am flight which was hijacked at Karachi airport. She hid the passports of the Americans as the hijackers wanted to execute Americans. Neerja comforted the passengers, especially the elderly and small children. After 17 hours, the hijackers opened fire and set off explosives. Acting quickly, Neerja opened the emergency door and helped a number of passengers escape. Neerja laid down her life, while saving hundreds of others.`]]],
[`C3. Which statements are true about Neerja? Tick them`,[
[`1. Neerja was the senior most cabin crew on the aircraft.`,`True (✓)`],
[`2. Neerja escaped from the flight when the terrorists opened fire.`,`False (✗). She helped others to escape but did not escape herself.`],
[`3. She showed the passports of all the passengers to the hijackers.`,`False (✗). She hid the passports of the Americans.`],
[`4. She received the Ashoka Chakra from the Civil Aviation Minister.`,`False (✗). The Ashoka Chakra is awarded by the Government of India; the Civil Aviation Ministry honoured her later in 2011.`]]],
[`C4. Write a short paragraph about Neerja`,[
[`Model paragraph`,`Model answer: Neerja Bhanot was born on 7 September 1963 in Chandigarh. She was a flight attendant of Pan Am Airlines. She was the senior flight purser on Pan Am Flight 73, which was hijacked at Karachi. She hid the passports of the Americans and helped many passengers escape. She died while shielding three children. She received the Ashoka Chakra and is the youngest recipient of this award.`]]],
[`C5. Circle the words related to airport / flight`,[
[`crew, driver, runway, kidnap, check-in, pilot, air hostess, cabin, cockpit, overtake, hijack, traffic police, depot, emergency door`,`Related: crew, runway, check-in, pilot, air hostess, cabin, cockpit, hijack, emergency door. (Not related: driver, kidnap, overtake, traffic police, depot)`]]],

[`G2. Think of a few more words and write their past tense forms`,[

[`G3. Add the missing word and complete the sentences`,[

O(`What did Neerja do to help passengers at the end?`,`She opened the emergency door and helped a number of passengers to escape.`),

G(`Write the meaning of 'tribute'.`,`an act that shows gratitude, respect or admiration`,'m'),
S(`What did Neerja do when she learnt about the hijack?`,`Neerja alerted the cockpit crew about the hijack. The cockpit crew fled from the aircraft. Then Neerja, being the most senior cabin crew member, took charge of the situation.`),
S(`How did Neerja save the Americans on the flight?`,`The terrorists wanted to find the Americans, so they told Neerja to collect all the passports. Neerja and the other attendants hid the passports of the 40 Americans so that the terrorists could not identify them.`),
S(`Why is Neerja called the 'heroine of the hijack'?`,`Neerja helped many passengers to escape by opening the emergency door. She did not escape herself and died while shielding three children. For her bravery she was recognised internationally as the heroine of the hijack.`),
L(`Narrate the story of Neerja Bhanot in your own words.`,`Neerja Bhanot was born on 7 September 1963 in Chandigarh. Her parents were Rama and Harish Bhanot. She joined Pan Am Airlines in 1986 and became the senior flight purser. On 5 September 1986, Pan Am Flight 73 was hijacked at Karachi by four armed terrorists. Neerja alerted the cockpit crew, who fled, and she took charge. The terrorists shot a passenger who said he was an American and asked her to collect the passports. Neerja hid the passports of the 40 Americans. After seventeen hours the terrorists opened fire. Neerja opened the emergency door and helped many passengers to escape, but she died while shielding three children. She received the Ashoka Chakra and is its youngest recipient.`),
L(`What qualities of Neerja Bhanot do you admire? Why?`,`Model answer: I admire Neerja's courage, presence of mind and selflessness. She alerted the crew at once, hid the passports to protect others and took charge when the other crew had left. She thought of the safety of the passengers, especially the children, before her own life. Her bravery teaches us to help others in danger.`,'h')

LSE6.push({n:6,t:`My People (Poem) – Unit 7 Poetry`,au:`Dr Siddalingaiah (translated by Dr Sumatheendra Nadig)`,pg:49,
words:`site – an area used for building; swoon – faint; excavate – dig up; weave – make cloth on a machine; plough – a large tool used by farmers to turn over the soil; sigh – a sad breath; misery – sadness and suffering; debt – money you owe; collapse – fall down; suppress – hold back; ash – soft grey powder left after burning (ಬೂದಿ); interest – extra money paid when you borrow; pay through the nose – pay much more than the worth; fiery – angry, excited; eat your fill – eat as much as you want; devote – use time or energy for a purpose`,
notes:`'My People' is a poem by the Kannada Dalit poet Dr Siddalingaiah, translated into English by Dr Sumatheendra Nadig. The poet describes the hard life of the poor, working people ('my people'): they carry stones, dig gold, weave cloth, plough fields and build shops and bungalows, yet they die of hunger, have no clothes, are kicked and insulted, fall into heavy debts, pay heavy interest and are exploited by the rich and so-called 'God-loving' men. They are so devoted and obedient that they listen to anything told to them and 'live on air'. The poet is sympathetic to them. Theme: poverty, exploitation and social inequality. About the poet: Siddalingaiah (b. 1954), Professor of Kannada, Bangalore University; pioneered Dalit voice in 1975 with 'Holemaadigana Haadu'; autobiography 'Ooru Keri'. Translator Dr Sumatheendra R. Nadig (b. 1935) wrote 'Dampatya Gita'.`,
ab:[
[`Preparatory activity 1a. Names of professions`,[
[`A person who mends shoes`,`cobbler`],
[`A person who stitches clothes`,`tailor`],
[`A person who makes ornaments`,`goldsmith (jeweller)`],
[`A person who represents people in court`,`lawyer (advocate)`],
[`A person who works in the field`,`farmer`],
[`A person who sells fruits and vegetables`,`vendor (fruit seller / vegetable seller)`]]],
[`C1. Answer in a word, a phrase or a sentence`,[
[`Who are referred to as 'they' in the poem?`,`The poor, hard-working and oppressed people (labourers, farmers, weavers) are referred to as 'they'.`],
[`"They weave cloth, but they go naked." What does this line mean?`,`It means that the weavers make cloth for others, but they are so poor that they cannot buy clothes for themselves.`],
[`Why do these people sigh?`,`They sigh because they work very hard but still return home empty handed, hungry and in misery.`],
[`Who does the poet refer to as God-loving men? What do they do?`,`The rich and so-called religious men who eat their fill. They make the poor prepare their footwear, while the poor are kicked and insulted. ⚠ (check with the textbook / teacher)`],
[`Is the poet sympathetic to them? How do you know?`,`Yes. The poet calls them 'my people' in every stanza and describes their sufferings with deep feeling.`]]],
[`C2. Discuss in small groups and answer`,[
[`Who is the speaker in this poem? Who is he talking about?`,`The speaker is the poet. He is talking about the poor, working and exploited people of society.`],
[`What are the different activities done by them?`,`They carry stones for building sites, dig gold, weave cloth, plough the fields, sow seeds, cut the crops, build shops and bungalows and prepare footwear.`],
[`Why does the poet have sympathy towards these people?`,`Because they work hard for others but get hunger, insults, debts and misery in return.`],
[`Isn't it a pity that some people build the shops but get into heavy debts? How does this happen?`,`Yes. They borrow money from others because they are poor, and they have to pay heavy interest ('pay interest through their noses'), so their debts keep growing. ⚠ (model answer)`],
[`What do you think should be done to solve the miseries of these people?`,`Model answer: They should get education, fair wages, loans at low interest, government help, and respect and equal treatment in society.`]]],
[`Let's Speak – Debate: 'Poverty is the cause of all crimes in society.'`,[
[`For the topic`,`Model points: Poor people may steal to feed their families; lack of education and jobs can lead to crime; poverty creates anger and hopelessness.`],
[`Against the topic`,`Model points: Many rich people also commit crimes like fraud and corruption; crime depends on one's values and upbringing; many poor people are honest and hard working.`]]],
[`Let's Appreciate`,[
[`Select the five most important words and say why`,`Model answer: hunger, misery, debt, sympathy, 'my people' – because they show the sufferings of the poor and the poet's feeling for them.`],
[`Role play – the poet and the interviewer`,`Activity: One child plays the poet and another asks questions such as 'Why did you write this poem?', 'Who are your people?', 'What message do you give to society?'`]]],
[`Kannada original`,[
[`Who wrote the original poem in Kannada?`,`Dr Siddalingaiah (original title: 'ನನ್ನ ಜನಗಳು').`]]]
],
qb:[
M(`The poem 'My People' was originally written in:`,[`Hindi`,`Tamil`,`Kannada`,`Telugu`],2),
M(`The poem was written by:`,[`Dr Siddalingaiah`,`Dr Sumatheendra Nadig`,`Tony Bradman`,`F. Joanna`],0),
M(`The poem was translated into English by:`,[`Dr Siddalingaiah`,`Dr Sumatheendra Nadig`,`Panje Mangesh Rao`,`Norman Macleod`],1),
M(`'Excavate' means:`,[`fill`,`dig up`,`weave`,`plough`],1),
M(`'Weave' means to:`,[`make cloth on a machine`,`dig the ground`,`sing`,`cook`],0),
M(`'Misery' means:`,[`joy`,`sadness and suffering`,`wealth`,`anger`],1),
M(`'Debt' means:`,[`money you owe`,`money you save`,`a gift`,`a loan to a friend only`],0,'m'),
M(`'Swoon' means:`,[`faint`,`sing`,`run`,`swim`],0),
M(`Dr Siddalingaiah is a professor of Kannada in:`,[`Mysore University`,`Bangalore University`,`Karnatak University`,`Mangalore University`],1,'m'),
O(`Who are 'my people' in the poem?`,`The poor, hard-working and oppressed people.`),
O(`What do 'my people' carry for building sites?`,`Stones.`),
O(`What do they excavate but never get a meal?`,`Gold.`),
O(`Why do they get into heavy debts?`,`They build shops and bungalows with borrowed money and have to pay heavy interest.`,'m'),
O(`What do they prepare for the God-loving men?`,`Footwear.`),
O(`What is the autobiography of Dr Siddalingaiah called?`,`'Ooru Keri'.`,'m'),
G(`Write the meaning of 'plough'.`,`a large tool used by farmers to turn over the soil before planting crops`),
G(`Write the meaning of 'sigh'.`,`make a noise when you breathe out, often when you are sad`),
G(`Write the meaning of 'collapse'.`,`fall down`,'e'),
G(`Write the meaning of 'suppress'.`,`hold back, restrain`),
G(`Write the profession: a person who mends shoes.`,`cobbler`,'e'),
G(`Write the profession: a person who represents people in court.`,`lawyer (advocate)`,'e'),
G(`Write the meaning of 'eat your fill'.`,`eat as much as you want`),
S(`What does the poem say about the life of the poor?`,`The poem says that the poor work very hard carrying stones, digging gold, weaving cloth and ploughing fields. But they remain hungry and half-naked, are kicked and insulted, fall into heavy debts and live in misery.`),

L(`Explain the poem 'My People' in your own words.`,`In the poem 'My People', Dr Siddalingaiah speaks about the poor working people of society. They carry stones for building sites, dig gold, weave cloth, plough the fields and build shops and bungalows, but they themselves die of hunger, wear no clothes and live in misery. They are kicked and insulted and they fall into heavy debts and pay heavy interest. They make footwear for the rich 'God-loving' men who eat their fill. They are so devoted that they listen to anything said to them and live on air. The poet feels great sympathy for them and calls them 'my people'. The poem makes us think about poverty and social inequality.`,'h'),

LSE6.push({n:7,t:`'What I Want for You and Every Child' – A Letter from Obama to His Daughters – Unit 8 Prose`,au:`Barack Obama (Letter)`,pg:56,
words:`campaign trail – a series of things a politician or party does to win an election; parade – a public procession celebrating a special day or event; make up for something – take the place of something that has been lost; potential – ability; instill – introduce; compassionate – showing sympathy and concern for others; thrive – grow or develop well, flourish; fulfillment – satisfaction; dignity – self-respect; contest – compete in an election; opportunity – chance; boundaries – limits`,
notes:`In this tender letter to his daughters Malia (10) and Sasha (7), America's former President Barack Obama explains why he decided to contest for the post of President. The girls enjoyed the campaign trail – picnics, parades, state fairs and junk food – but he missed them. When he was young he thought life was about himself, but after his daughters were born he realised that his greatest joy was their joy and that his life would not count for much unless he gave them and every child opportunities for happiness and fulfilment. He wants every child to go to good schools, to be able to go to college even if parents are not rich, to get good jobs, to live in a cleaner and safer world with new inventions, and to rise above divides of race, region, gender and religion. He wants his daughters to grow into compassionate and committed women. He ends by saying he is proud of them, loves them and is grateful for their patience, poise, grace and humour. Language work: letter writing (formal parts, thanks, birthday wishes, a friendly letter), contracted forms (you've, shouldn't, I'd), conversation (offering and refusing food). Listening poem: 'Dear Grown-ups' by Stevie Ann Wilde.`,
ab:[
[`Preparatory activity – Listening (poem 'Dear Grown-ups') – fill in the blanks`,[
[`Dear ____, Please leave all the ____ there`,`Dear Grown-ups, Please leave all the flowers there`],
[`And don't ____ ____ the trees.`,`cut down`],
[`We need the trees to make ____ ____`,`fresh air`],
[`Please don't always use your ____`,`car`],
[`Because the fumes ... And ____ the atmosphere.`,`heat`],
[`And all the ____ will die.`,`plants`],
[`So please get out and ____ a lot`,`walk`],
[`And grow up ____ and ____;`,`strong; tall`],
[`Then we'll be ____ everyday`,`happy`],
[`With love from the ____.`,`children`]]],
[`C1. Discuss the following questions in groups and answer`,[
[`How old were Obama's daughters when he wrote this letter to them?`,`Malia was 10 and Sasha was 7.`],
[`What fun did Obama's daughters have when he was on the campaign trail?`,`They went to picnics, parades and state fairs and ate all sorts of junk food. They also got a new puppy.`],
[`What is the 'journey' that Obama is referring to?`,`The journey is his election campaign for the post of President and the new life of the family in the White House.`],
[`What fun did his daughters have when he was campaigning for the elections?`,`They enjoyed picnics, parades, state fairs and junk food during the last two years.`],
[`What, for Obama, is the greatest joy in life?`,`The joy he sees in the lives of his daughters is his greatest joy.`],
[`What did he think as a young man?`,`As a young man he thought life was all about him – how he would make his way in the world, become successful and get the things he wanted.`],
[`What did he realize after the birth of his daughters?`,`He realized that his own life would not count for much unless his daughters had every opportunity for happiness and fulfilment.`],
[`Why did he contest for the President's post?`,`He contested so that he could give his daughters and every child in the nation opportunities for a better life.`],
[`What does he expect his daughters to do?`,`He expects them to grow into compassionate, committed women who will help to build a better world.`],
[`What is the 'great adventure' referred to in the letter?`,`It is the family's life on the campaign trail and the move to the White House as the President's family.`]]],
[`C2. Discuss in small groups and present your answers`,[
[`How did Obama's daughters change his view of the world?`,`After they were born, his plans for himself did not seem important; he started to think about their future and the future of every child.`],
[`What does Obama want for all the children?`,`Good schools, a chance to go to college, good jobs with benefits, a clean and safe world, and a society without divides of race, region, gender and religion.`],
[`Why did Obama write this letter to his daughters?`,`To explain why he decided to take the family on the journey of the election and to tell them what he wants for them and every child.`],
[`How do you feel when you read this letter?`,`Model answer: I feel touched by a father's love for his daughters and inspired by his thoughts for all children.`],
[`Which line appeals to you the most in this letter?`,`Model answer: 'I soon found that the greatest joy in my life was the joy I saw in yours.' (any line of your choice)`]]],
[`W1. Rearrange the jumbled letter`,[
[`Correct order`,`f, b, d, c, a, e`],
[`Letter`,`Mysuru / 20 January 2017 / My dear uncle, / I write this letter to thank you for your timely help during my mother's illness. ... Thanks once again. / Your loving niece / Salma`]]],
[`W2. Help Pappu complete the letter`,[
[`I feel so ____ to have a grandfather like you.`,`proud`],
[`you are blessed with ____ and ____`,`good health; long life`],
[`I'm doing well in my ____`,`studies`],
[`I am selected as the ____ of the class.`,`monitor`],
[`How's ____?`,`grandma`],
[`____, we'll come there during Deepavali holidays.`,`Don't worry`],
[`A very ____ ____ once again, grandpa! ____`,`happy birthday; Take care`]]],
[`W3. Write a letter to a friend or cousin about a story / drama / TV programme / film`,[
[`Steps to plan`,`Decide whom to write to; choose what to write about; note down the important points; write a rough draft; exchange it with classmates for feedback; revise and submit.`],
[`Model letter`,`Model answer: Mysuru, 10 Oct 2026. My dear Ravi, How are you? I watched a film called 'Chinnari Mutha' last week. It was very interesting. The story is about a small boy who wants to become a champion. Do watch it with your family. Please convey my love to all. Keep in touch. Lovingly yours, Kiran`]]],
[`S1. Contracted forms (full forms)`,[
[`you've`,`you have`],[`shouldn't`,`should not`],[`hasn't`,`has not`],[`we've`,`we have`],[`I'd`,`I would`],
[`More from the letter: that's, didn't, wouldn't, aren't, you'll, I've`,`that is; did not; would not; are not; you will; I have`]]],
[`S2. Dialogue (Anil and Sneha)`,[
[`Practise the dialogue and make similar conversations`,`Activity: Read in pairs. Then make a conversation, e.g. offering chocolates or fruits: 'Would you like to have some chocolate?' – 'I'd love to, but I can't. I have a toothache.' – 'Okay, then have an apple.'`]]],
[`Further reading`,[
[`Key words from the Kannada version (e.g. ಸವಾಲು, ಘನತೆ)`,`challenge, dignity (other words: opportunity, compassion, discovery, technology, adventure)`]]]
],
qb:[
M(`Obama wrote the letter to his daughters:`,[`Malia and Sasha`,`Malala and Sasha`,`Maya and Sara`,`Malia and Sophia`],0),

M(`The full form of 'shouldn't' is:`,[`should not`,`should now`,`shall not`,`should note`],0),
O(`Why did Obama write this letter?`,`To tell his daughters why he decided to take the family on the journey of the election.`),
O(`What did Obama think life was about when he was young?`,`He thought life was all about himself.`),
O(`What does Obama want every child to have the chance to do, even if their parents aren't rich?`,`To go to college.`),
O(`Where was the family going to start its new life?`,`In the White House.`),
O(`What are the qualities of the daughters that Obama is grateful for?`,`Their patience, poise, grace and humour.`,'m'),
O(`Who wrote the poem 'Dear Grown-ups'?`,`Stevie Ann Wilde.`,'m'),
G(`Write the full form of 'I've'.`,`I have`),
G(`Write the full form of 'hasn't'.`,`has not`),
G(`Write the full form of 'I'd'.`,`I would`),
G(`Write the contracted form of 'we have'.`,`we've`),
G(`Write the meaning of 'potential'.`,`ability`,'e'),
G(`Write the meaning of 'parade'.`,`a public procession celebrating a special day or event`),
G(`Complete the closing of a letter to your uncle: Your loving ______.`,`niece / nephew`,'e'),
S(`What did Obama's daughters do on the campaign trail?`,`They went to picnics, parades and state fairs and ate all kinds of junk food. They enjoyed a lot, but it was not easy for them as they were away from their father for a long time.`),
S(`What changed in Obama's thinking after his daughters were born?`,`Earlier he thought only about his own success. After the birth of his daughters, his big plans for himself did not seem important. He felt that his life would not count for much unless he gave them every opportunity for happiness.`),
S(`What kind of schools does Obama want for children?`,`Obama wants schools worthy of children's potential – schools that challenge them, inspire them and instill in them a sense of wonder about the world around them.`),
L(`Write what Obama wants for his daughters and for every child, as given in the letter.`,`Obama wants all children to go to good schools that challenge and inspire them. He wants them to get a chance to go to college even if their parents are not rich, and to get good jobs with good pay and benefits like health care. He wants the world to make new discoveries and inventions that make the planet cleaner and safer, and to rise above the divides of race, region, gender and religion. For his daughters he wants a world with no limits on their dreams, and he hopes they will grow into compassionate and committed women who help to build such a world.`),
L(`Write the letter-writing steps and a model friendly letter to a friend about a film you liked.`,`Steps: decide whom to write to; decide what to write about; note down the important points; write a rough draft; exchange it with classmates for feedback; revise it and submit it. Model letter: Mysuru, 10 Oct 2026. My dear Ravi, How are you? I watched a film last week. It was very interesting and funny. The hero was a small boy who worked hard to win a race. I enjoyed it very much. Do watch it with your family. Please convey my love to all. Keep in touch. Lovingly yours, Kiran`,'h')
]});

LSE6.push({n:8,t:`A Sonnet for My Incomparable Mother (Poem) – Unit 8 Poetry`,au:`F. Joanna`,pg:67,
words:`sonnet – a poem having 14 lines with a fixed rhyme scheme; incomparable – extremely good, beautiful; contemplate – think about; raise – bring up, look after; hard – difficult; sacrifice – giving up something for others; devotion – great love and loyalty; security – protection; imbibe – take in, learn`,
notes:`A sonnet (a 14-line poem) in which a daughter, who is now a mother herself, thinks about her childhood and thanks her mother. She now understands that hard work is mixed with the fun of bringing up a child. Her mother gave her sacrifice, devotion, love and tears; spent her heart, mind, energy and soul on her; loved her with a never-failing love; gave strength and security; and did the hardest thing of all – let her go and set her free. The poet says that every day she tries to be a mother like her own mother. Theme: a mother's love and sacrifice; gratitude. About the poet: F. Joanna is a professional writer in English who has written poems and stories for children.`,
ab:[
[`Preparatory activity – Write about your mother`,[
[`My mother is ____ / but my mother is not ____`,`Model answer: My mother is kind. My mother is loving. My mother is helpful. But my mother is not selfish.`],
[`My mother likes ____ / but my mother does not like ____`,`Model answer: My mother likes cooking. She likes reading. She likes fruits. But she does not like wasting time.`]]],
[`C1. Answer in a word, a phrase or a sentence`,[
[`Who is the poet talking to?`,`The poet is talking to her mother ('Mom').`],
[`What makes the poet think of her childhood?`,`The poet is a mother now, so she understands how hard her mother worked to bring her up, and she thinks about her childhood.`],
[`Which word in the poem means a) 'great love and loyalty'?`,`devotion`],
[`Which word in the poem means b) protection?`,`security`],
[`Fill in the blank: The mother ________ many things to look after her child.`,`sacrificed (gave up)`],
[`What is the most difficult thing that the poet talks about in the poem?`,`Letting her child separate and setting her free (letting her go).`],
[`State true or false: 1. The poet is still a child.`,`False. She is a mother now.`],
[`State true or false: 2. The poet shows her affection and admiration for her mother.`,`True.`]]],
[`C2. Work in small groups and discuss`,[
[`What qualities has the poet imbibed from her mother?`,`Love, sacrifice, devotion, hard work and strength. She tries to be a mother just like her mother.`],
[`"You let me separate and set me free" – What is the meaning of this line?`,`It means that her mother allowed her to grow up and become independent, though letting go was very hard for her.`],
[`What does the poet say in the last two lines?`,`She says that every day she tries her best to be a mother like the mom her mother was to her.`],
[`Who do you admire the most in your life? Why?`,`Model answer: I admire my mother because she works hard, takes care of everyone and always loves me.`]]],
[`Let's Appreciate`,[
[`Pick out the pairs of rhyming words`,`know – ago; tears – years; security – free; be – me (the last two lines). ⚠ (check with the textbook)`],
[`Discuss the poem with your friends`,`Model points: The poem is about a mother's love and sacrifice. I like it because it is true and touching. It means that mothers give everything for their children. It reminds me of my own mother.`]]],
[`About the Poet`,[
[`Who is F. Joanna?`,`F. Joanna is a professional writer in English who has written poems and stories for children.`]]]
],
qb:[
M(`The poem 'A Sonnet for My Incomparable Mother' is written by:`,[`F. Joanna`,`Tony Bradman`,`Norman Macleod`,`Stevie Ann Wilde`],0),
M(`A sonnet is a poem having ______ lines.`,[`10`,`12`,`14`,`16`],2),
M(`The poet is talking to:`,[`her father`,`her mother`,`her teacher`,`her daughter`],1),
M(`'Incomparable' means:`,[`extremely good`,`very small`,`very sad`,`very angry`],0),
M(`'Contemplate' means:`,[`think about`,`forget`,`shout`,`run`],0),
M(`'Raise' in the poem means:`,[`lift up`,`bring up, look after`,`increase`,`collect`],1,'m'),
M(`The word in the poem that means 'protection' is:`,[`devotion`,`security`,`sacrifice`,`energy`],1),
M(`The hardest thing the mother did was:`,[`cooking`,`letting her child go and set free`,`teaching`,`working late`],1),
O(`What does the poet often think about?`,`Her childhood.`),
O(`What did the mother give the poet? (Name any three things)`,`Sacrifice, devotion, love and tears (also strength and security).`),
O(`What did the mother spend on the poet throughout the years?`,`Her heart, mind, energy and soul.`),
O(`What is the poet trying to be every day?`,`A mother like her own mother.`),
O(`Why does the poet say 'I am a mother now'?`,`Because she now understands the hard work her mother did.`,'m'),
G(`Write the word from the poem that rhymes with 'ago'.`,`know`),
G(`Write the word from the poem that rhymes with 'years'.`,`tears`),
G(`Write the word from the poem that rhymes with 'me'.`,`be`,'e'),
G(`Write the meaning of 'sonnet'.`,`a poem having 14 lines with a fixed rhyme scheme`),
G(`Write the meaning of 'devotion'.`,`great love and loyalty`),
G(`Write the meaning of 'raise' as used in the poem.`,`bring up, look after`),
S(`What does the poet say about the hard work of a mother?`,`The poet says that hard work is mixed together with the fun of bringing up a child. She learnt this when she became a mother herself and understood how her own mother had raised her.`),
S(`What is the meaning of 'You let me separate and set me free'?`,`The mother allowed her daughter to grow up and live her own life. It was the hardest thing for the mother, but she did it out of love.`),
S(`How does the poet show her love and admiration for her mother?`,`The poet thanks her mother for her sacrifice, devotion, love and energy. She says her mother gave her strength and security. She tries every day to be a mother like her own mother.`),
L(`Write the summary of the poem 'A Sonnet for My Incomparable Mother' in your own words.`,`In this sonnet the poet thinks about her childhood. Now she is a mother herself and she knows that hard work is mixed with the fun of bringing up a child. She remembers all the things her mother gave her – sacrifice, devotion, love and tears. Her mother spent her heart, mind, energy and soul on her through the years, loved her with a never-failing love and gave her strength and security. The hardest thing her mother did was to let her go and set her free. The poet says that she tries her best every day to be a mother like her own mother.`,'h')
]});

LSE6.push({n:9,t:`Channapatna Toys – Supplementary Reading (Lesson 2)`,au:`Prose (Informative)`,pg:71,
words:`wonder – surprise; wander – roam; exquisite – very beautiful and delicate; pester – trouble with persistent requests; origin – the point where something begins; NGO – Non-Governmental Organisation; lathe – a machine for shaping pieces of wood by turning them against a cutting tool; foreign – of a country other than your own; lacquerware – articles made with a hard glossy varnish; spectacles – a pair of glasses; renovate – restore to a good condition; found – establish, build; artisan – a skilled craftsperson`,
notes:`Channapatna, a small town between Bengaluru and Mysuru, is famous for its colourful toys and is called 'Gombegala Ooru'. Sisters Divya and Muktha ask their grandpa for a story about toys. He tells them: Tippu Sultan loved children and brought Persian toy makers who trained local artisans. Earlier toys were made by chipping wood by hand; now workers at 'Maya Organic' (an NGO) use power lathes. The toys use vegetable colours and are exported. Mr Girish, a toy maker with 18 years' experience, says they make plain toys ('Saada Bombe') from Aale Mara (Ivory wood, Wrightia tinctoria); the toys have the Geographical Indication (GI) tag under the WTO. The Government of Karnataka helps artisans through KSHDC training, a Lacquerware craft complex on Tatte Kere Road, and financial help with the Dutch Government and the 'VISHWA' scheme. Kengal Anjaneya Swamy temple (renovated by Kengal Hanumanthaiah) and Janapada Loka (founded by Dr H.L. Nage Gowda) are near Channapatna.`,
ab:[
[`Preparatory activity`,[
[`Locate Mysuru, Bengaluru, Ramanagara and Channapatna on the Karnataka map`,`Activity: Channapatna lies on the Bengaluru–Mysuru highway in Ramanagara district, between Bengaluru and Mysuru.`],
[`What is Channapatna famous for?`,`Channapatna is famous for its beautiful and colourful wooden toys.`]]],
[`I. Answer the following questions briefly`,[
[`Which organization is helping the toy makers?`,`The Karnataka State Handicrafts Development Corporation (KSHDC) is giving training to toy makers, along with the Government of Karnataka. ⚠ (the NGO 'Maya Organic' also supports toy making)`],
[`How were the toys made in olden days?`,`People used to chip away on a piece of wood by hand.`],
[`How are the toys made in 'Maya Organic' now?`,`Workers chip away the wood on power lathes and make the toys.`],
[`What is the opinion of Mr Girish about toy making?`,`He says that they are a family of toy makers and that their plain toys ('Saada Bombe') are world famous and protected as a Geographical Indication (GI) under the WTO.`],
[`How did the toy industry originate in Channapatna?`,`Tippu Sultan brought Persian toy makers to his kingdom. They trained the local artisans and left this wonderful art in our state.`],
[`What is special about Channapatna toys?`,`Vegetable colours are used in them, they are world famous, have the GI protection and are sent to foreign countries.`],
[`What type of wood is used to make Channapatna toys?`,`Aale Mara (Ivory wood) or Wrightia tinctoria tree.`],
[`What is special about the Lacquerware craft complex?`,`It was constructed by the government on Tatte Kere Road to help the artisans make toys and other lacquerware items.`],
[`What do the toy makers make besides toys?`,`Cricket bats, wickets, photo frames, trophy bases, spectacle holders etc.`],
[`How is the Karnataka government helping the artisans?`,`It gives training through KSHDC, has built a Lacquerware craft complex and gives financial help with the Dutch Government and the 'VISHWA' scheme.`]]],
[`Let's Practise Words (a). Full forms of abbreviations`,[
[`NGO`,`Non-Governmental Organisation`],
[`GI`,`Geographical Indication`],
[`WHO`,`World Health Organization`],
[`PIN`,`Postal Index Number`],
[`WTO`,`World Trade Organization`],
[`SSLC`,`Secondary School Leaving Certificate`],
[`KMF`,`Karnataka Milk Federation`],
[`CM`,`Chief Minister`],
[`PM`,`Prime Minister`],
[`IAS`,`Indian Administrative Service`],
[`KPSC`,`Karnataka Public Service Commission`]]],
[`Let's Practise Words (b). More abbreviations`,[
[`Some more short forms`,`Model answer: ISRO – Indian Space Research Organisation; ATM – Automated Teller Machine; KSRTC – Karnataka State Road Transport Corporation; ID – Identity; DC – Deputy Commissioner; MLA – Member of Legislative Assembly.`]]],
[`Let's Speak`,[
[`What would you like to see in Channapatna?`,`Model answer: I would like to see how the toys are made on the lathe and the colourful toys, and also visit Janapada Loka and Kengal Anjaneya temple.`],
[`What questions will you ask the toy makers?`,`Model answer: How long have you been making toys? Which wood do you use? How do you get the colours? Where do you sell your toys?`],
[`Important or historical places in your town`,`Activity: Name and describe a fort, temple, palace or museum in your town and tell the class why it is important.`]]]
],
qb:[
M(`Channapatna is a small town between:`,[`Mysuru and Mandya`,`Bengaluru and Mysuru`,`Mysuru and Hassan`,`Bengaluru and Tumakuru`],1),
M(`Channapatna is also known as:`,[`Gombegala Ooru`,`Silk City`,`Garden City`,`Temple Town`],0),
M(`The Persian toy makers were brought to the kingdom by:`,[`Hyder Ali`,`Tippu Sultan`,`Krishnadevaraya`,`Kempegowda`],1),
M(`Channapatna toys are made out of:`,[`Teak wood`,`Aale Mara (Ivory wood)`,`Rosewood`,`Bamboo`],1),
M(`The colours used in Channapatna toys are:`,[`chemical colours`,`vegetable colours`,`oil paints`,`water colours`],1),
M(`'GI' stands for:`,[`General Information`,`Geographical Indication`,`Global Industry`,`Government India`],1),
M(`Janapada Loka was founded by:`,[`Kengal Hanumanthaiah`,`Dr H. L. Nage Gowda`,`Dr Rajkumar`,`Mr Girish`],1,'m'),
M(`The temple near Channapatna is:`,[`Kengal Anjaneya Swamy Temple`,`Chamundeshwari Temple`,`Ghati Subramanya`,`Dharmasthala`],0),
M(`A 'lathe' is a machine for:`,[`cutting cloth`,`shaping pieces of wood`,`grinding grains`,`pumping water`],1,'m'),
O(`Who are Divya and Muktha?`,`Two school-going sisters.`),
O(`Who told the story about toys?`,`Their grandpa.`),
O(`What is 'Maya Organic'?`,`An NGO in Channapatna where toys are made.`),
O(`What are 'Saada Bombe'?`,`Plain toys.`),
O(`Where has the government constructed the Lacquerware craft complex?`,`On Tatte Kere Road.`),
O(`Which famous actor has sung songs in praise of the Kengal Anjaneya Swamy?`,`Dr Rajkumar.`,'m'),
G(`Write the full form of 'NGO'.`,`Non-Governmental Organisation`),
G(`Write the full form of 'WTO'.`,`World Trade Organization`),
G(`Write the full form of 'PIN'.`,`Postal Index Number`),
G(`Write the full form of 'KMF'.`,`Karnataka Milk Federation`),
G(`Write the full form of 'IAS'.`,`Indian Administrative Service`),
G(`Write the meaning of 'pester'.`,`trouble with persistent requests`),
G(`Write the meaning of 'exquisite'.`,`very beautiful and delicate`,'e'),
S(`How did Channapatna become famous for toys?`,`Tippu Sultan loved children and brought Persian toy makers to his kingdom. They trained the local artisans and left this wonderful art in our state. Because of this, Channapatna became famous for its colourful wooden toys.`),
S(`What is the difference between the old way and the new way of making toys?`,`In olden days people chipped away on a piece of wood by hand. Now, in 'Maya Organic', workers chip the wood using power lathes and make the toys more quickly.`),
S(`How is the Karnataka government helping the toy makers?`,`The government gives training with the help of KSHDC. It has built a Lacquerware craft complex on Tatte Kere Road. It also gives financial help with the help of the Dutch Government and the 'VISHWA' scheme.`),
L(`Write about Channapatna toys in your own words.`,`Channapatna is a small town between Bengaluru and Mysuru and is known as 'Gombegala Ooru'. It is famous for its colourful wooden toys. The art came with the Persian toy makers whom Tippu Sultan brought to his kingdom. The toys are made from Aale Mara (Ivory wood) and coloured with vegetable colours. Earlier they were made by hand; now power lathes are used. The toys are world famous and have the GI tag under the WTO. The Karnataka government helps the artisans with training, a Lacquerware craft complex and financial help. Besides toys they make cricket bats, wickets, photo frames and trophy bases.`),
L(`Describe the places of interest near Channapatna that are mentioned in the lesson.`,`Near Channapatna there is the Kengal Anjaneya Swamy Temple beside the Bengaluru–Mysuru highway. It was renovated by Kengal Hanumanthaiah and thousands of devotees visit it. Dr Rajkumar has sung songs in praise of this God. Near Ramanagara there is Janapada Loka, founded by Dr H. L. Nage Gowda, where we can see articles of rural people used in farming in olden days. Young artists are trained there to continue our tradition, culture and art.`,'h')
]});

LSE6.push({n:10,t:`Listening Passages – Supplementary Reading (Lesson 3)`,au:`Listening Texts (Units 2, 6, 7, 8)`,pg:78,
words:`decathlon – a sporting event in which people compete in ten different sports; cripple – a person who is unable to walk; laurels – honour and praise; impediment – something that stops or delays; infancy – young age; centenary – the 100th anniversary of an event; plaque – a piece of metal or stone with a name and date given in memory of a person or event (ಫಲಕ); purser – an officer on a flight who takes care of passengers; crew – all the people working on a plane; handicap – a physical or mental disability`,
notes:`These passages are to be read aloud by the teacher for listening practice. Unit 2 (pronunciation): pairs of sentences that practise similar sounds (live/leave, go/won't, tails/tales, sailing/sell, wait/weight). Unit 6 (Listening text): 'Visually challenged man develops a website' – Dr Vinod Sena, a retired English professor of Delhi University, visually challenged since infancy, developed a website that can be used without a mouse, with text-to-speech software; it is a 'site (sight) for the unsighted'. Beethoven was deaf and Bob Mathias, the Olympic decathlon winner, was once a cripple – a handicap is no impediment to greatness. Unit 7: 'Air Hostess Neerja Bhanot honoured by Civil Aviation Ministry' – she was honoured on 19 February 2011 at the Ashoka Convention Centre, New Delhi; Union Minister Vayalar Ravi presented a plaque, shawl and citation to her brother Aneesh Bhanot. Unit 8: the poem 'Dear Grown-ups' by Stevie Ann Wilde (about saving trees and the environment).`,
ab:[
[`Unit 2 – Extended activity: Pronunciation (read the pairs aloud)`,[
[`I live in this place. / I will leave this place.`,`Activity: Contrast the short 'i' in live and the long 'ee' in leave.`],
[`I want to go. / I won't go.`,`Activity: Contrast want and won't.`],
[`Elephants have short tails. / Children are fond of folk tales.`,`'tails' and 'tales' have the same sound (homophones).`],
[`Are you sailing in a boat? / Would you like to sell the boat?`,`Activity: Contrast sail (long 'ay') and sell (short 'e').`],
[`I always wait for my friend. / My weight is 32 kgs.`,`'wait' and 'weight' have the same sound (homophones).`]]],
[`Unit 6 – Listening text: Visually challenged man develops a website`,[
[`Who was the great composer who was deaf?`,`Beethoven.`],
[`Who is Dr Vinod Sena?`,`A retired English professor from Delhi University who has been visually challenged since infancy.`],
[`What is the extraordinary feature of his website?`,`It can be navigated without a mouse. With text-to-speech software it becomes audio-based and can be used by the visually challenged without sighted help.`],
[`What does the passage say about a handicap?`,`A handicap is no impediment to greatness.`],
[`Extended Activity – Word Bingo (try, succeed, climb, drive, do, reach, stand, get up, stumble, strike, hit)`,`Activity: The teacher reads the words; children tick the words they wrote in the boxes. The first child to tick all six words says 'Bingo'.`]]],
[`Unit 7 – Listening text: Air Hostess Neerja Bhanot honoured by Civil Aviation Ministry`,[
[`When and where was Neerja Bhanot honoured?`,`On 19 February 2011 at the Ashoka Convention Centre, New Delhi.`],
[`Why was the function held?`,`To launch the centenary celebrations of civil aviation in India.`],
[`When did the first commercial plane fly in India? Between which places?`,`On 18 February 1911, between Allahabad and Naini.`],
[`Who received the honour on her behalf?`,`Her brother, Aneesh Bhanot.`],
[`What was presented?`,`A plaque, a shawl and a citation, presented by Union Minister Vayalar Ravi.`]]],
[`Unit 8 – Poem 'Dear Grown-ups' by Stevie Ann Wilde`,[
[`What do the children ask the grown-ups not to do?`,`Not to cut down the trees and not to always use the car.`],
[`Why do we need trees?`,`To make fresh air, and flowers to feed the bees.`],
[`What happens if fumes heat the atmosphere?`,`The sun will be too hot and all the plants will die.`],
[`What do the children want the grown-ups to do?`,`Get out and walk a lot to see the clear blue sky.`]]]
],
qb:[
M(`Dr Vinod Sena is a retired professor of English from:`,[`Mysuru University`,`Delhi University`,`Mumbai University`,`Bangalore University`],1),
M(`Dr Sena has been visually challenged since:`,[`birth (infancy)`,`youth`,`old age`,`1948`],0),
M(`The great composer who was deaf was:`,[`Mozart`,`Beethoven`,`Bach`,`Tagore`],1),
M(`Bob Mathias won the Olympic:`,[`marathon`,`decathlon`,`swimming`,`javelin`],1),
M(`Dr Sena's website can be used without a:`,[`mouse`,`keyboard`,`screen`,`speaker`],0),
M(`Neerja Bhanot was honoured by the:`,[`Defence Ministry`,`Civil Aviation Ministry`,`Home Ministry`,`Railway Ministry`],1),
M(`The first commercial plane in India flew between:`,[`Mumbai and Delhi`,`Allahabad and Naini`,`Chennai and Bengaluru`,`Kolkata and Patna`],1),
M(`'Centenary' means the:`,[`50th anniversary`,`100th anniversary`,`25th anniversary`,`10th anniversary`],1,'m'),
M(`The poem 'Dear Grown-ups' is by:`,[`Stevie Ann Wilde`,`Tony Bradman`,`F. Joanna`,`Norman Macleod`],0),
O(`What is special about Dr Vinod Sena's website?`,`It can be used without a mouse and is audio-based with text-to-speech software.`),
O(`Who presented the plaque, shawl and citation to Neerja's brother?`,`Union Minister Vayalar Ravi.`),
O(`Who is Neerja Bhanot's brother?`,`Aneesh Bhanot.`),
O(`What do trees give us according to the poem?`,`Fresh air.`),
O(`What do flowers feed?`,`The bees.`),
O(`What do the children want the grown-ups to do instead of using the car?`,`Walk a lot.`,'m'),
G(`Write the meaning of 'impediment'.`,`something that stops or delays`),
G(`Write the meaning of 'laurels'.`,`honour and praise`),
G(`Write the meaning of 'infancy'.`,`young age`,'e'),
G(`Write the meaning of 'centenary'.`,`the 100th anniversary of an event`),
G(`Write a homophone of 'wait'.`,`weight`,'e'),
G(`Write a homophone of 'tails'.`,`tales`,'e'),
G(`Fill in the blank: Dr Sena's site is a '______ for the unsighted' (site/sight).`,`site (sight)`,'m'),
S(`What is the message of the listening text about Dr Vinod Sena?`,`The text says that a handicap is no impediment to greatness. Beethoven was deaf, Bob Mathias was once a cripple, and Dr Vinod Sena, though visually challenged, developed a useful website for the blind.`),
S(`Why was Neerja Bhanot honoured in 2011?`,`She had given her life to save passengers of a hijacked Pan Am flight at Karachi. The Civil Aviation Ministry honoured her at a function in New Delhi to launch the centenary celebrations of civil aviation in India.`),
S(`What requests do the children make in the poem 'Dear Grown-ups'?`,`The children ask the grown-ups to leave the flowers, not to cut down the trees, not to use the car always and to walk a lot, so that the air stays clean and the earth does not become too hot.`),
L(`Describe the website developed by Dr Vinod Sena and explain why it is useful.`,`Dr Vinod Sena is a retired English professor from Delhi University. He has been visually challenged since infancy. He developed a website which is a 'site (sight) for the unsighted'. It can be used without a mouse. With text-to-speech software it becomes audio-based, so visually challenged people can use it without the help of sighted people. It connects them to the world of the Internet and shows that a handicap is no impediment to greatness.`)
]});

/* ===== ಗಣಿತ (Mathematics) – 4ನೇ ತರಗತಿ ಭಾಗ–2 ===== */
const LSM=[];
LSM.push({n:10,t:`ಹಣದ ಸಂಕಲನ ಮತ್ತು ವ್ಯವಕಲನ`,au:`ಅಧ್ಯಾಯ 10 (ಹಣ)`,pg:1,
words:`ಒಂದು ರೂಪಾಯಿ = 100 ಪೈಸೆ; ರೂಪಾಯಿ → ಪೈಸೆ: 100 ರಿಂದ ಗುಣಿಸು; ಪೈಸೆ → ರೂಪಾಯಿ: 100 ರಿಂದ ಭಾಗಿಸು; ಹಣದ ಸಂಕಲನ – ಪೈಸೆಯನ್ನು ಪೈಸೆಯೊಂದಿಗೆ, ರೂಪಾಯಿಯನ್ನು ರೂಪಾಯಿಯೊಂದಿಗೆ ಕೂಡು; ಹಣದ ವ್ಯವಕಲನ – ಪೈಸೆಯಿಂದ ಪೈಸೆ, ರೂಪಾಯಿಯಿಂದ ರೂಪಾಯಿ ಕಳೆ; ಒಟ್ಟು ಬೆಲೆ = ಪರಿಮಾಣ × ಒಂದರ ಬೆಲೆ; ಒಂದರ ಬೆಲೆ = ಒಟ್ಟು ಬೆಲೆ ÷ ಸಂಖ್ಯೆ; ರಸೀದಿ (ಬಿಲ್); ದರಪಟ್ಟಿ; ಬೋರ್ಡ್`,
notes:`ಹಿಂದಿನ ತರಗತಿಯಲ್ಲಿ ಕಲಿತ ದಶಕ ರಹಿತ ಸಂಕಲನ/ವ್ಯವಕಲನದಂತೆಯೇ ಹಣವನ್ನು ಸಂಕಲನ ಮಾಡುವಾಗ ಪೈಸೆ ಅಂಕಣದ ಮೊತ್ತ 100 ಅಥವಾ ಹೆಚ್ಚಾದರೆ ಅದನ್ನು ರೂಪಾಯಿಗೆ ಪರಿವರ್ತಿಸಿ ರೂಪಾಯಿ ಅಂಕಣಕ್ಕೆ ಕೂಡಬೇಕು. ವ್ಯವಕಲನದಲ್ಲಿ ಪೈಸೆ ಸಾಲದಿದ್ದರೆ 1 ರೂಪಾಯಿಯನ್ನು 100 ಪೈಸೆಗೆ ಪರಿವರ್ತಿಸಿ ಎರವಲು ಪಡೆಯಬೇಕು. ಗುಣಾಕಾರ: ಒಂದು ವಸ್ತುವಿನ ಬೆಲೆ ಗೊತ್ತಿದ್ದಾಗ ಹಲವು ವಸ್ತುಗಳ ಬೆಲೆ = ಗುಣಾಕಾರ; ಭಾಗಾಕಾರ: ಹಲವು ವಸ್ತುಗಳ ಬೆಲೆ ಗೊತ್ತಿದ್ದಾಗ ಒಂದರ ಬೆಲೆ. ರಸೀದಿಯಲ್ಲಿ ಅಂಗಡಿ ಹೆಸರು, ವಿಳಾಸ, ರಸೀದಿ ಸಂಖ್ಯೆ, ದಿನಾಂಕ, ಗ್ರಾಹಕರ ಹೆಸರು, ವಿವರ, ಪರಿಮಾಣ, ಬೆಲೆ, ಒಟ್ಟು ಮೊತ್ತ ಇರುತ್ತದೆ. ರಸೀದಿ ಪಡೆಯುವುದು ಗ್ರಾಹಕರ ಹಕ್ಕು.`,
ab:[
[`ಪುನರಾವರ್ತನೆ – ಭರ್ತಿಮಾಡಿ (ಪುಟ 1)`,[
[`₹10 = ____ ಪೈಸೆ`,`1000 ಪೈಸೆ (10 × 100)`],
[`₹15 = ____ ಪೈಸೆ`,`1500 ಪೈಸೆ`],
[`₹6.25 = ____ ಪೈಸೆ`,`625 ಪೈಸೆ`],
[`500 ಪೈಸೆ = ₹ ____`,`₹5 (500 ÷ 100)`],
[`657 ಪೈಸೆ = ____ ರೂಪಾಯಿ ಮತ್ತು ____ ಪೈಸೆ`,`6 ರೂಪಾಯಿ ಮತ್ತು 57 ಪೈಸೆ (₹6.57)`]]],
[`ಅಭ್ಯಾಸ 10.1 – I. ಕೂಡು`,[
[`₹29.60 + ₹61.75 + ₹78.50`,`₹169.85`],
[`₹50.50 + ₹19.00 + ₹44.50`,`₹114.00`]]],
[`ಅಭ್ಯಾಸ 10.1 – II`,[
[`ಅ) ₹7 ನ್ನು ₹8.50 ಕ್ಕೆ ಕೂಡು`,`₹8.50 + ₹7.00 = ₹15.50`],
[`ಆ) ₹45.35 ನ್ನು ₹33.29 ಕ್ಕೆ ಕೂಡು`,`₹45.35 + ₹33.29 = ₹78.64`]]],
[`ಅಭ್ಯಾಸ 10.1 – III. ಸಮಸ್ಯೆಗಳನ್ನು ಬಿಡಿಸು`,[
[`ಅಮೂಲ್ಯಳ ಬಳಿ ₹25.50 ಹಣವಿದೆ. ಇವಳ ಚಿಕ್ಕಮ್ಮ ₹50 ಹಣ ನೀಡಿದರೆ ಅಮೂಲ್ಯಳ ಬಳಿ ಇರುವ ಒಟ್ಟು ಹಣ ಎಷ್ಟು?`,`₹25.50 + ₹50.00 = ₹75.50`],
[`ರವಿ ಪುಸ್ತಕದ ಅಂಗಡಿಯಿಂದ ಒಗಟಿನ ಪುಸ್ತಕ (₹7.50), ಪಂಚತಂತ್ರ ಕಥೆಗಳು (₹14), ಮೋಜಿನ ಕಥೆಗಳು (₹5.50) ಕೊಳ್ಳುತ್ತಾನೆ. ಅವನು ನೀಡಬೇಕಾದ ಒಟ್ಟು ಹಣವೆಷ್ಟು?`,`₹7.50 + ₹14.00 + ₹5.50 = ₹27.00`],
[`ಥಾಮಸ್ ಗಣಿತ ಪುಸ್ತಕವನ್ನು ₹47.50 ಕ್ಕೆ, ವಿಜ್ಞಾನ ಪುಸ್ತಕವನ್ನು ₹35.25 ಕ್ಕೆ ಹಾಗೂ ನೋಟ್ ಪುಸ್ತಕವನ್ನು ₹18 ಕ್ಕೆ ಕೊಂಡರೆ ಅವನು ಅಂಗಡಿಯವನಿಗೆ ನೀಡಬೇಕಾದ ಒಟ್ಟು ಹಣವೆಷ್ಟು?`,`₹47.50 + ₹35.25 + ₹18.00 = ₹100.75`],
[`ಸುರೇಖಾ 3 ಚೆಂಡುಗಳನ್ನು ₹30 ಕ್ಕೆ, 5 ಪೆನ್ಸಿಲ್‌ಗಳನ್ನು ₹12.50 ಕ್ಕೆ ಹಾಗೂ 4 ನೋಟ್ ಪುಸ್ತಕಗಳನ್ನು ₹20 ಕ್ಕೆ ಕೊಂಡರೆ ಅವಳು ನೀಡಬೇಕಾದ ಒಟ್ಟು ಹಣವೆಷ್ಟು?`,`₹30.00 + ₹12.50 + ₹20.00 = ₹62.50`]]],
[`ಅಭ್ಯಾಸ 10.2 – I. ಕಳೆ`,[
[`₹76.25 − ₹44.50`,`₹31.75`],
[`₹98.50 − ₹55.50`,`₹43.00`]]],
[`ಅಭ್ಯಾಸ 10.2 – II`,[
[`ಅ) ₹18.50 ನ್ನು ₹25.10 ರಿಂದ ಕಳೆ`,`₹25.10 − ₹18.50 = ₹6.60`],
[`ಆ) ₹30.50 ನ್ನು ₹75.50 ರಿಂದ ಕಳೆ`,`₹75.50 − ₹30.50 = ₹45.00`]]],
[`ಅಭ್ಯಾಸ 10.2 – III. ಸಮಸ್ಯೆಗಳನ್ನು ಬಿಡಿಸಿ`,[
[`ಸೋನಿಕಾಳ ಬಳಿ ₹50 ಹಣವಿದೆ. ಅವಳು ₹45.50 ಕ್ಕೆ ಬಳೆ, ಉಂಗುರಗಳನ್ನು ಕೊಂಡರೆ ಅವಳ ಬಳಿ ಉಳಿದ ಹಣವೆಷ್ಟು?`,`₹50.00 − ₹45.50 = ₹4.50`],
[`ಡೇವಿಡ್‌ನು ₹399.99 ಬೆಲೆಯ ಶೂ ಕೊಳ್ಳಲು ಇಚ್ಛಿಸುತ್ತಾನೆ. ಅವನ ಬಳಿ ಗೋಲಕದಲ್ಲಿ ₹25.50 ಮಾತ್ರ ಇದೆ. ಶೂ ಕೊಳ್ಳಲು ಇನ್ನು ಎಷ್ಟು ಹಣ ಬೇಕಾಗುತ್ತದೆ?`,`₹399.99 − ₹25.50 = ₹374.49`],
[`ಲಕ್ಷ್ಮೇಶನು ಅಂಚೆ ಕಚೇರಿಯಲ್ಲಿ ₹52.50 ಕ್ಕೆ ಸ್ಟ್ಯಾಂಪ್, ಪೋಸ್ಟ್ ಕಾರ್ಡ್‌ಗಳನ್ನು ಕೊಂಡನು. ಒಟ್ಟಾರೆ ₹100 ರ ನೋಟನ್ನು ನೀಡಿದರೆ ಅಂಚೆ ಕಚೇರಿಯವನು ಲಕ್ಷ್ಮೇಶನಿಗೆ ಹಿಂದಿರುಗಿಸಬೇಕಾದ ಹಣ ಎಷ್ಟು?`,`₹100.00 − ₹52.50 = ₹47.50`],
[`ಸೌಮ್ಯಳ ಬಳಿ ₹37.50 ಇದೆ. ಅವಳು ₹23.50 ಕ್ಕೆ ತರಕಾರಿಗಳನ್ನು ಕೊಳ್ಳುತ್ತಾಳೆ. ಅವಳ ಬಳಿ ಉಳಿಯುವ ಹಣವೆಷ್ಟು?`,`₹37.50 − ₹23.50 = ₹14.00`]]],
[`ಅಭ್ಯಾಸ 10.3 – ಗುಣಾಕಾರ`,[
[`ಒಂದು ಆಟಿಕೆ ಬೊಂಬೆಯ ಬೆಲೆ ₹45. ಅಂತಹ 3 ಆಟಿಕೆ ಬೊಂಬೆಗಳ ಬೆಲೆ ಎಷ್ಟು?`,`45 × 3 = ₹135`],
[`ಒಂದು ಪ್ಯಾಕೆಟ್ ಅಡುಗೆ ಎಣ್ಣೆಯ ಬೆಲೆ ₹82.50. ಅಂತಹ 5 ಪ್ಯಾಕೆಟ್‌ಗಳ ಬೆಲೆ ಎಷ್ಟು?`,`82.50 × 5 = ₹412.50`],
[`ಒಬ್ಬ ವ್ಯಕ್ತಿ ದೈನಂದಿನ ಆಹಾರಕ್ಕಾಗಿ ₹95.50 ಖರ್ಚು ಮಾಡುತ್ತಾನೆ. ಅವನು ಒಂದು ವಾರದ ಆಹಾರಕ್ಕೆ ಖರ್ಚು ಮಾಡುವ ಹಣವೆಷ್ಟು?`,`1 ವಾರ = 7 ದಿನ. 95.50 × 7 = ₹668.50`],
[`ಒಂದು ಪುಸ್ತಕದ ಬೆಲೆ ₹23.75 ಆದರೆ 5 ಪುಸ್ತಕಗಳ ಬೆಲೆ ಎಷ್ಟು?`,`23.75 × 5 = ₹118.75`]]],
[`ಅಭ್ಯಾಸ 10.4 – ಭಾಗಾಕಾರ`,[
[`6 ಮೊಜೆಗಳ (ಸಾಕ್ಸ್) ಒಟ್ಟು ಬೆಲೆ ₹42. ಆದರೆ ಒಂದು ಮೊಜೆಯ ಬೆಲೆ ಎಷ್ಟು?`,`42 ÷ 6 = ₹7`],

S(`ಹಾಲಿನ ಕುಕ್ಕರ್‌ನ ಸಾಮರ್ಥ್ಯ 2 ಲೀ 500 ಮಿಲೀ. ಇದರಲ್ಲಿ 1 ಲೀ 200 ಮಿಲೀ ಹಾಲಿದ್ದರೆ ಪೂರ್ಣ ತುಂಬಲು ಎಷ್ಟು ಹಾಲು ಬೇಕು?`,`1 ಲೀ 300 ಮಿಲೀ`),

S(`ಲೀಟರ್ ಅನ್ನು ಮಿಲೀಟರ್‌ಗೆ ಪರಿವರ್ತಿಸುವ ವಿಧಾನವನ್ನು ಉದಾಹರಣೆಯೊಂದಿಗೆ ಬರೆಯಿರಿ.`,`1 ಲೀ = 1000 ಮಿಲೀ, ಆದ್ದರಿಂದ ಲೀಟರ್ ಅನ್ನು 1000 ರಿಂದ ಗುಣಿಸಬೇಕು. ಉದಾ: 8 ಲೀ = 8 × 1000 = 8000 ಮಿಲೀ.`),
S(`ಮಿಲೀಟರ್‌ನ್ನು ಲೀಟರ್‌ಗೆ ಪರಿವರ್ತಿಸುವ ವಿಧಾನವನ್ನು ಉದಾಹರಣೆಯೊಂದಿಗೆ ಬರೆಯಿರಿ.`,`ಮಿಲೀ ಅನ್ನು 1000 ರಿಂದ ಭಾಗಿಸಬೇಕು. ಉದಾ: 6860 ಮಿಲೀ = 6000 + 860 = 6 ಲೀ 860 ಮಿಲೀ.`),

L(`ಒಬ್ಬ ವ್ಯಾಪಾರಿ 12 ಲೀ 250 ಮಿಲೀ ಕಡಲೆಕಾಯಿ ಎಣ್ಣೆ, 5 ಲೀ 500 ಮಿಲೀ ಕೊಬ್ಬರಿ ಎಣ್ಣೆ ಮತ್ತು 2 ಲೀ ಎಳ್ಳೆಣ್ಣೆ ಮಾರಿದನು. ಒಟ್ಟು ಮಾರಿದ ಎಣ್ಣೆಯನ್ನು ಕಂಡುಹಿಡಿಯಿರಿ.`,`ಮಿಲೀ: 250 + 500 = 750 ಮಿಲೀ. ಲೀ: 12 + 5 + 2 = 19 ಲೀ. ಒಟ್ಟು = 19 ಲೀ 750 ಮಿಲೀ.`)

LSM.push({n:14,t:`ಕಾಲ`,au:`ಅಧ್ಯಾಯ 14 (ಕಾಲ)`,pg:71,
words:`1 ವಾರ = 7 ದಿನ; 1 ವರ್ಷ = 12 ತಿಂಗಳು = 52 ವಾರ = 365 ದಿನ; ಅಧಿಕ ವರ್ಷ = 366 ದಿನ (ಫೆಬ್ರವರಿಯಲ್ಲಿ 29 ದಿನ); 31 ದಿನಗಳ ತಿಂಗಳು: ಜನವರಿ, ಮಾರ್ಚ್, ಮೇ, ಜುಲೈ, ಆಗಸ್ಟ್, ಅಕ್ಟೋಬರ್, ಡಿಸೆಂಬರ್; 30 ದಿನಗಳ ತಿಂಗಳು: ಏಪ್ರಿಲ್, ಜೂನ್, ಸೆಪ್ಟೆಂಬರ್, ನವೆಂಬರ್; ಫೆಬ್ರವರಿ: 28 ದಿನ (ಅಧಿಕ ವರ್ಷದಲ್ಲಿ 29); 1 ಗಂಟೆ = 60 ನಿಮಿಷ; 1 ನಿಮಿಷ = 60 ಸೆಕೆಂಡ್; ಪೂರ್ವಾಹ್ನ (am); ಅಪರಾಹ್ನ (pm); 24 ಗಂಟೆ ಗಡಿಯಾರ`,
notes:`ಒಂದು ವರ್ಷದಲ್ಲಿ 12 ತಿಂಗಳುಗಳು; ಜನವರಿ, ಮಾರ್ಚ್, ಮೇ, ಜುಲೈ, ಆಗಸ್ಟ್, ಅಕ್ಟೋಬರ್, ಡಿಸೆಂಬರ್ ತಿಂಗಳುಗಳಲ್ಲಿ 31 ದಿನ (ಮುಷ್ಟಿಯ ಗಿಣ್ಣು ವಿಧಾನದಿಂದ ನೆನಪಿಡಬಹುದು – ಗಿಣ್ಣಿನ ಉಬ್ಬು ಭಾಗ 31 ದಿನ, ತಗ್ಗಿನ ಭಾಗ 30 ದಿನ ಮತ್ತು ಫೆಬ್ರವರಿ ಹೊರತು). ಒಂದು ವರ್ಷದಲ್ಲಿ ಎಲ್ಲಾ ತಿಂಗಳುಗಳ ವಾರ ಮತ್ತು ದಿನಗಳನ್ನು ಕೂಡಿದರೆ 48 ವಾರ 29 ಅಥವಾ 30 ದಿನ ಆಗುತ್ತದೆ; 29 ಅಥವಾ 30 ದಿನಗಳನ್ನು ವಾರಕ್ಕೆ ಪರಿವರ್ತಿಸಿದರೆ 4 ವಾರ → ಒಟ್ಟು 52 ವಾರ. ಒಂದು ವರ್ಷ ನಿಖರವಾಗಿ 365¼ ದಿನ; ಹಾಗಾಗಿ ಪ್ರತಿ 4 ವರ್ಷಕ್ಕೊಮ್ಮೆ ಅಧಿಕ ವರ್ಷ (ಫೆಬ್ರವರಿಯಲ್ಲಿ 29 ದಿನ, ವರ್ಷಕ್ಕೆ 366 ದಿನ). 4 ರಿಂದ ನಿಶ್ಶೇಷವಾಗಿ ಭಾಗವಾಗುವ ವರ್ಷ ಅಧಿಕ ವರ್ಷ (ಉದಾ: 2008, 2012, 2016); ಶತಮಾನದ ವರ್ಷಗಳು 400 ರಿಂದ ಭಾಗವಾದರೆ ಮಾತ್ರ ಅಧಿಕ ವರ್ಷ (1900 ಅಲ್ಲ). ಗಡಿಯಾರದಲ್ಲಿ ದೊಡ್ಡ ಮುಳ್ಳು ನಿಮಿಷ, ಚಿಕ್ಕ ಮುಳ್ಳು ಗಂಟೆ ಸೂಚಿಸುತ್ತದೆ. ಮಧ್ಯರಾತ್ರಿ 12 ರಿಂದ ಮಧ್ಯಾಹ್ನ 12 ರವರೆಗೆ ಪೂರ್ವಾಹ್ನ (am); ಮಧ್ಯಾಹ್ನ 12 ರಿಂದ ಮಧ್ಯರಾತ್ರಿ 12 ರವರೆಗೆ ಅಪರಾಹ್ನ (pm). 24 ಗಂಟೆ ಗಡಿಯಾರದಲ್ಲಿ 13 ಅಥವಾ ಹೆಚ್ಚಿನ ಗಂಟೆಯಿಂದ 12 ಕಳೆದು ಅಪರಾಹ್ನ ಸಮಯ ಪಡೆಯುತ್ತೇವೆ. ಎರಡು ದಿನಾಂಕಗಳ ನಡುವಿನ ದಿನಗಳನ್ನು ದಿನಾಂಕಗಳ ವ್ಯತ್ಯಾಸ ಕಂಡು ಲೆಕ್ಕ ಹಾಕುತ್ತೇವೆ.`,
ab:[
[`ಕ್ಯಾಲೆಂಡರ್ ಚಟುವಟಿಕೆ – 2017 ರ ತಿಂಗಳು, ವಾರ ಮತ್ತು ದಿನಗಳು (ಪುಟ 74)`,[
[`ಜನವರಿ (31 ದಿನ) – ಎಷ್ಟು ವಾರ ಮತ್ತು ದಿನ?`,`4 ವಾರ 3 ದಿನ`],
[`ಫೆಬ್ರವರಿ (28 ದಿನ)`,`4 ವಾರ 0 ದಿನ (28 ದಿನ)`],
[`ಏಪ್ರಿಲ್ (30 ದಿನ)`,`4 ವಾರ 2 ದಿನ`],

[`2013 ರ ಫೆಬ್ರವರಿಯಲ್ಲಿ ಎಷ್ಟು ದಿನಗಳಿವೆ?`,`28 ದಿನ`],
[`2014 ರ ಫೆಬ್ರವರಿಯಲ್ಲಿ ಎಷ್ಟು ದಿನಗಳಿವೆ?`,`28 ದಿನ`],
[`2015 ರ ಫೆಬ್ರವರಿಯಲ್ಲಿ ಎಷ್ಟು ದಿನಗಳಿವೆ?`,`28 ದಿನ`],
[`2016 ರ ಫೆಬ್ರವರಿಯಲ್ಲಿ ಎಷ್ಟು ದಿನಗಳಿವೆ?`,`29 ದಿನ`],

[`ಫೆಬ್ರವರಿ 29 ದಿನಗಳಿರುವ ವರ್ಷ ಯಾವುದು?`,`ಅಧಿಕ ವರ್ಷ (2012, 2016) – ಪ್ರತಿ 4 ವರ್ಷಕ್ಕೊಮ್ಮೆ ಪುನರಾವರ್ತನೆ`]]],
[`ಅಭ್ಯಾಸ 14.1 – ಅಧಿಕ ವರ್ಷ`,[

[`II. ಅ) 1908 ಅಧಿಕ ವರ್ಷವೇ?`,`ಹೌದು. 1908 ÷ 4 = 477 (ನಿಶ್ಶೇಷವಾಗಿ ಭಾಗವಾಗುತ್ತದೆ)`],
[`ಆ) 2003 ಅಧಿಕ ವರ್ಷವೇ?`,`ಅಲ್ಲ. 4 ರಿಂದ ಭಾಗವಾಗುವುದಿಲ್ಲ`],
[`ಇ) 1972 ಅಧಿಕ ವರ್ಷವೇ?`,`ಹೌದು. 1972 ÷ 4 = 493`],
[`ಈ) 1990 ಅಧಿಕ ವರ್ಷವೇ?`,`ಅಲ್ಲ. 90 ÷ 4 ನಿಶ್ಶೇಷವಾಗಿ ಭಾಗವಾಗುವುದಿಲ್ಲ`],
[`ಉ) 2013 ಅಧಿಕ ವರ್ಷವೇ?`,`ಅಲ್ಲ`],
[`III. 2013 ರಿಂದ 2025 ರ ವರೆಗೆ ಎಷ್ಟು ಅಧಿಕ ವರ್ಷ ಬರುತ್ತದೆ?`,`2016, 2020, 2024 – ಒಟ್ಟು 3 ಅಧಿಕ ವರ್ಷಗಳು`],
[`IV. 2014 ರಲ್ಲಿ ಎಷ್ಟು ದಿನಗಳಿವೆ?`,`2014 ಅಧಿಕ ವರ್ಷವಲ್ಲ; ಆದ್ದರಿಂದ 365 ದಿನಗಳು`],
[`V. ಅಧಿಕ ವರ್ಷದ ಫೆಬ್ರವರಿ 29 ರ ತಾರೀಖು ಜನಿಸಿದವರು ಪ್ರತಿ ಎಷ್ಟು ವರ್ಷಕ್ಕೊಮ್ಮೆ ಹುಟ್ಟುಹಬ್ಬ ಆಚರಿಸಿಕೊಳ್ಳಬೇಕು?`,`4 ವರ್ಷಕ್ಕೊಮ್ಮೆ (ನಿಜವಾದ ದಿನಾಂಕದಂದು)`]]],
[`ಸಮಯದ ಗಣನೆ – ಪುಟ 79 ರ ಪ್ರಶ್ನೆಗಳು`,[

[`ಗಡಿಯಾರದ ದೊಡ್ಡ ಮುಳ್ಳು ಏನನ್ನು ಸೂಚಿಸುತ್ತದೆ?`,`ನಿಮಿಷಗಳನ್ನು`],

[`ಒಂದು ಗಂಟೆಗೆ ಎಷ್ಟು ನಿಮಿಷ?`,`60 ನಿಮಿಷ`],
[`ಒಂದು ನಿಮಿಷಕ್ಕೆ ಎಷ್ಟು ಸೆಕೆಂಡ್?`,`60 ಸೆಕೆಂಡ್`]]],

S(`ಮುಷ್ಟಿಯ ಗಿಣ್ಣು ವಿಧಾನದಿಂದ 31 ಮತ್ತು 30 ದಿನಗಳ ತಿಂಗಳುಗಳನ್ನು ಹೇಗೆ ಗುರುತಿಸುತ್ತೇವೆ?`,`ಮುಷ್ಟಿಯ ಗಿಣ್ಣಿನ ಉಬ್ಬು ಭಾಗ 31 ದಿನದ ತಿಂಗಳನ್ನೂ, ಗಿಣ್ಣುಗಳ ನಡುವಿನ ತಗ್ಗು 30 ದಿನದ ತಿಂಗಳನ್ನೂ ಸೂಚಿಸುತ್ತವೆ. ಫೆಬ್ರವರಿ ತಗ್ಗಿನಲ್ಲಿದ್ದರೂ 28 ಅಥವಾ 29 ದಿನ.`),
S(`ಗಡಿಯಾರದಲ್ಲಿ ಪೂರ್ವಾಹ್ನ ಮತ್ತು ಅಪರಾಹ್ನ ಎಂದರೇನು?`,`ಮಧ್ಯರಾತ್ರಿ 12 ರಿಂದ ಮಧ್ಯಾಹ್ನ 12 ರವರೆಗಿನ ಸಮಯ ಪೂರ್ವಾಹ್ನ (am); ಮಧ್ಯಾಹ್ನ 12 ರಿಂದ ಮಧ್ಯರಾತ್ರಿ 12 ರವರೆಗಿನ ಸಮಯ ಅಪರಾಹ್ನ (pm).`),
S(`ಲಕ್ಷ್ಮಿ ರಾತ್ರಿ 9 ಗಂಟೆಗೆ ಮಲಗುತ್ತಾಳೆ ಮತ್ತು ಸಂಜೆ 5.30 ಕ್ಕೆ ಆಡುತ್ತಾಳೆ. ಈ ಎರಡು ಸಮಯಗಳನ್ನು 24 ಗಂಟೆ ಗಡಿಯಾರದಲ್ಲಿ ಬರೆಯಿರಿ.`,`ರಾತ್ರಿ 9 ಗಂಟೆ = 9 + 12 = 21.00; ಸಂಜೆ 5.30 = 5.30 + 12 = 17.30`),
S(`ಸುರೇಶನು 3-10-11 ರಿಂದ 7-10-11 ರ ವರೆಗೆ ಶಾಲಾ ಪ್ರವಾಸಕ್ಕೆ ಹೋದರೆ ಎಷ್ಟು ದಿನ?`,`7 − 3 = 4 ದಿನ`),
L(`ಇವುಗಳಲ್ಲಿ ಯಾವ ವರ್ಷಗಳು ಅಧಿಕ ವರ್ಷ ಎಂದು ಕಾರಣ ಸಹಿತ ಬರೆಯಿರಿ: 1908, 2003, 1972, 1990, 2013.`,`4 ರಿಂದ ನಿಶ್ಶೇಷವಾಗಿ ಭಾಗವಾದರೆ ಮಾತ್ರ ಅಧಿಕ ವರ್ಷ. 1908 ÷ 4 = 477 → ಅಧಿಕ ವರ್ಷ. 2003 → ಭಾಗವಾಗುವುದಿಲ್ಲ, ಅಲ್ಲ. 1972 ÷ 4 = 493 → ಅಧಿಕ ವರ್ಷ. 1990 → ಅಲ್ಲ. 2013 → ಅಲ್ಲ.`),
L(`ಒಂದು ದಿನದಲ್ಲಿ ಲಕ್ಷ್ಮಿ ಬೆಳಗ್ಗೆ 6 ಕ್ಕೆ ಏಳುತ್ತಾಳೆ, 8.30 ಕ್ಕೆ ಶಾಲೆಗೆ ಹೊರಡುತ್ತಾಳೆ, 12.30 ಕ್ಕೆ ಊಟ ಮಾಡುತ್ತಾಳೆ, 5.30 ಕ್ಕೆ ಆಟವಾಡುತ್ತಾಳೆ ಮತ್ತು ರಾತ್ರಿ 9 ಕ್ಕೆ ಮಲಗುತ್ತಾಳೆ. ಪ್ರತಿ ಸಮಯವನ್ನು ಪೂರ್ವಾಹ್ನ/ಅಪರಾಹ್ನ ಎಂದು ಹೇಳಿ 24 ಗಂಟೆ ಗಡಿಯಾರದಲ್ಲಿ ಬರೆಯಿರಿ.`,`6.00 am → 06:00; 8.30 am → 08:30; 12.30 pm → 12:30; 5.30 pm → 17:30; 9.00 pm → 21:00.`),
L(`ದಸರಾ ರಜೆ ಅಕ್ಟೋಬರ್ 3 ರಂದು ಘೋಷಿಸಲಾಯಿತು. ಶಾಲೆ ಅಕ್ಟೋಬರ್ 31 ರಂದು ಪ್ರಾರಂಭವಾಯಿತು. ರಜೆಯ ಅವಧಿ ಎಷ್ಟು? ಹಂತಗಳನ್ನು ವಿವರಿಸಿ.`,`ಶಾಲೆ ಪ್ರಾರಂಭವಾದ ದಿನಾಂಕ = 31; ರಜೆ ಘೋಷಿಸಿದ ದಿನಾಂಕ = 3. ವ್ಯತ್ಯಾಸ = 31 − 3 = 28. ಶಾಲೆಯ ರಜೆ ಅವಧಿ 28 ದಿನ.`)
]});

LSM.push({n:15,t:`ದತ್ತಾಂಶಗಳ ನಿರ್ವಹಣೆ`,au:`ಅಧ್ಯಾಯ 15 (ದತ್ತಾಂಶ)`,pg:91,
words:`ದತ್ತಾಂಶ (ಮಾಹಿತಿ); ಕೋಷ್ಟಕ; ಕಂಬ ನಕ್ಷೆ (ಸ್ತಂಭ ನಕ್ಷೆ); ಅಡ್ಡ ರೇಖೆ (X ಅಕ್ಷ); ಲಂಬ ರೇಖೆ (Y ಅಕ್ಷ); ಪ್ರಮಾಣ (ಸ್ಕೇಲ್); ಹೆಚ್ಚು/ಕಡಿಮೆ ಸಂಖ್ಯೆ; ಒಟ್ಟು`,
notes:`ಸಂಗ್ರಹಿಸಿದ ಮಾಹಿತಿಯನ್ನು ಕೋಷ್ಟಕ ರೂಪದಲ್ಲಿ ಬರೆದು, ಕಂಬ ನಕ್ಷೆಯಲ್ಲಿ ಸೂಚಿಸಬಹುದು. ಕಂಬ ನಕ್ಷೆಯಲ್ಲಿ ಅಡ್ಡ ರೇಖೆಯ ಮೇಲೆ ದತ್ತಾಂಶದ ವಿವರ (ಹೆಸರು), ಲಂಬ ರೇಖೆಯ ಮೇಲೆ ಸಂಖ್ಯೆಯನ್ನು ಸೂಚಿಸುತ್ತೇವೆ. ಸಂಖ್ಯೆ ಹೆಚ್ಚಿರುವಾಗ ಪ್ರಮಾಣ (ಸ್ಕೇಲ್) ನಿರ್ಧರಿಸುತ್ತೇವೆ (ಉದಾ: 1 ಸೆಂಮೀ = 5 ವಿದ್ಯಾರ್ಥಿಗಳು). ಕಂಬ ನಕ್ಷೆಯ ಅನುಕೂಲ: ಆಕರ್ಷಕವಾಗಿ ಮಾಹಿತಿ ತೋರಿಸಬಹುದು, ಹೋಲಿಕೆ ಸುಲಭ, ವೀಕ್ಷಣೆಯಿಂದಲೇ ಗ್ರಹಿಸಬಹುದು.`,
ab:[
[`ಪುಟ 91 – ಹೂವುಗಳ ಕೋಷ್ಟಕ (ಚಿತ್ರಪಟ ನೋಡಿ ಪೂರ್ಣಗೊಳಿಸಿ) ⚠ ಚಿತ್ರದಲ್ಲಿ ಎಣಿಸಿ ಪರಿಶೀಲಿಸಿ`,[
[`ಹೂವುಗಳನ್ನು ಕೋಷ್ಟಕದಲ್ಲಿ ಬರೆಯುವ ವಿಧಾನ`,`ಪ್ರತಿ ಹೂವಿನ ಹೆಸರಿನ ಮುಂದೆ ಚಿತ್ರದಲ್ಲಿರುವ ಅದರ ಸಂಖ್ಯೆಯನ್ನು ಎಣಿಸಿ ಬರೆಯಬೇಕು.`],
[`ಒಟ್ಟು ಹೂವುಗಳ ಸಂಖ್ಯೆ ಕಂಡುಹಿಡಿಯುವ ವಿಧಾನ`,`ಎಲ್ಲಾ ಹೂವುಗಳ ಸಂಖ್ಯೆಗಳನ್ನು ಕೂಡಬೇಕು.`]]],
[`ಉದಾಹರಣೆ 2 (ಪುಟ 94–95) – ಸ್ಪರ್ಧೆಗಳಲ್ಲಿ ಭಾಗವಹಿಸಿದ ವಿದ್ಯಾರ್ಥಿಗಳು (ಭಾವಗೀತೆ 10, ಚರ್ಚಾ ಸ್ಪರ್ಧೆ 20, ಪ್ರಬಂಧ 25, ಆಶುಭಾಷಣ 15; ಪ್ರಮಾಣ 1 ಸೆಂಮೀ = 5 ವಿದ್ಯಾರ್ಥಿಗಳು)`,[
[`ಕಂಬ ನಕ್ಷೆ ಸೂಚಿಸುವ ದತ್ತಾಂಶಗಳು ಯಾವುವು?`,`ವಿವಿಧ ಸ್ಪರ್ಧೆಗಳಲ್ಲಿ ಭಾಗವಹಿಸಿದ ವಿದ್ಯಾರ್ಥಿಗಳ ಸಂಖ್ಯೆ`],
[`ಯಾವ ಸ್ಪರ್ಧೆಯಲ್ಲಿ ಅತಿ ಹೆಚ್ಚು ವಿದ್ಯಾರ್ಥಿಗಳು ಭಾಗವಹಿಸಿದ್ದರು?`,`ಪ್ರಬಂಧ (25 ವಿದ್ಯಾರ್ಥಿಗಳು)`],
[`ಯಾವ ಸ್ಪರ್ಧೆಯಲ್ಲಿ ಅತಿ ಕಡಿಮೆ ವಿದ್ಯಾರ್ಥಿಗಳು ಭಾಗವಹಿಸಿದರು?`,`ಭಾವಗೀತೆ (10 ವಿದ್ಯಾರ್ಥಿಗಳು)`],
[`4 ಸ್ಪರ್ಧೆಗಳಲ್ಲಿ ಭಾಗವಹಿಸಿದ ಒಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳ ಸಂಖ್ಯೆ?`,`10 + 20 + 25 + 15 = 70`],
[`ಚರ್ಚಾ ಸ್ಪರ್ಧೆ ಮತ್ತು ಆಶುಭಾಷಣದಲ್ಲಿ ಯಾವುದರಲ್ಲಿ ಹೆಚ್ಚು ವಿದ್ಯಾರ್ಥಿಗಳು?`,`ಚರ್ಚಾ ಸ್ಪರ್ಧೆ (20 > 15)`]]],
[`ಉದಾಹರಣೆ 1 (ಪುಟ 93) – ಹೂಗಳ ಕಂಬ ನಕ್ಷೆ (ಮಲ್ಲಿಗೆ, ಸೇವಂತಿಗೆ, ಗುಲಾಬಿ, ಕಾಕಡ) ⚠ ಚಿತ್ರದ ಅಳತೆಗೆ ಅನುಗುಣವಾಗಿ ಪರಿಶೀಲಿಸಿ`,[
[`ಅತಿ ಹೆಚ್ಚು ಮಾರಾಟವಾಗಿರುವ ಹೂ ಯಾವುದು?`,`ಅತಿ ಎತ್ತರದ ಕಂಬವಿರುವ ಹೂ – ಮಲ್ಲಿಗೆ`],
[`ಅತಿ ಕಡಿಮೆ ಮಾರಾಟವಾಗಿರುವ ಹೂ ಯಾವುದು?`,`ಅತಿ ಕಡಿಮೆ ಎತ್ತರದ ಕಂಬವಿರುವ ಹೂ – ಕಾಕಡ`]]],
[`ಅಭ್ಯಾಸ 15.1 – I. ತಿಂಡಿಗಳ ಕಂಬ ನಕ್ಷೆ (ಇಡ್ಲಿ 9, ಚಪಾತಿ 8, ದೋಸೆ 5, ಪೂರಿ 7) ⚠ ಒಟ್ಟು 29 ಆಗುತ್ತದೆ (ಪುಸ್ತಕದಲ್ಲಿ 25 ವಿದ್ಯಾರ್ಥಿಗಳು ಎಂದಿದೆ)`,[
[`ಅತಿ ಹೆಚ್ಚು ವಿದ್ಯಾರ್ಥಿಗಳು ಇಷ್ಟಪಡುವ ತಿಂಡಿ ಯಾವುದು?`,`ಇಡ್ಲಿ`],
[`8 ಕ್ಕಿಂತ ಕಡಿಮೆ, 6 ಕ್ಕಿಂತ ಹೆಚ್ಚು ವಿದ್ಯಾರ್ಥಿಗಳು ಇಷ್ಟಪಡುವ ತಿಂಡಿ ಯಾವುದು?`,`ಪೂರಿ (7)`],
[`4 ಕ್ಕಿಂತ ಹೆಚ್ಚು, 7 ಕ್ಕಿಂತ ಕಡಿಮೆ ವಿದ್ಯಾರ್ಥಿಗಳು ಇಷ್ಟಪಡುವ ತಿಂಡಿ ಯಾವುದು?`,`ದೋಸೆ (5)`],
[`ಅತಿ ಕಡಿಮೆ ಸಂಖ್ಯೆಯ ವಿದ್ಯಾರ್ಥಿಗಳು ಇಷ್ಟಪಡುವ ತಿಂಡಿ ಯಾವುದು?`,`ದೋಸೆ (5)`]]],
[`ಅಭ್ಯಾಸ 15.1 – II. ಪ್ರಾಣಿ ಸಂಗ್ರಹಾಲಯ (ಸಿಂಹ 5, ಜಿಂಕೆ 20, ಮೊಲ 10, ಮಂಗ 15)`,[
[`ಕೋಷ್ಟಕ ಬರೆದು ವಿವರಗಳನ್ನು ಬರೆಯಿರಿ`,`ಸಿಂಹ – 5; ಜಿಂಕೆ – 20; ಮೊಲ – 10; ಮಂಗ – 15. ಒಟ್ಟು ಪ್ರಾಣಿಗಳು = 50. ಜಿಂಕೆ ಹೆಚ್ಚು, ಸಿಂಹ ಕಡಿಮೆ.`]]]
],
qb:[
M(`ಕಂಬ ನಕ್ಷೆಯಲ್ಲಿ ಅಡ್ಡ ರೇಖೆಯ ಮೇಲೆ ಏನನ್ನು ಸೂಚಿಸುತ್ತೇವೆ?`,[`ಸಂಖ್ಯೆ`,`ದತ್ತಾಂಶದ ಹೆಸರು`,`ಬೆಲೆ`,`ದಿನ`],1),
M(`ಕಂಬ ನಕ್ಷೆಯಲ್ಲಿ ಲಂಬ ರೇಖೆಯ ಮೇಲೆ ಏನನ್ನು ಸೂಚಿಸುತ್ತೇವೆ?`,[`ಹೆಸರು`,`ದತ್ತಾಂಶದ ಸಂಖ್ಯೆ`,`ಚಿತ್ರ`,`ಬಣ್ಣ`],1),
M(`ಅತಿ ಎತ್ತರದ ಕಂಬ ಸೂಚಿಸುವುದು:`,[`ಅತಿ ಕಡಿಮೆ ಸಂಖ್ಯೆ`,`ಅತಿ ಹೆಚ್ಚು ಸಂಖ್ಯೆ`,`ಸಮ ಸಂಖ್ಯೆ`,`ಏನೂ ಇಲ್ಲ`],1),
M(`ಮಾಹಿತಿಯನ್ನು ಕೋಷ್ಟಕ ರೂಪದಲ್ಲಿ ಬರೆಯುವುದರ ಪ್ರಯೋಜನ:`,[`ಓದಲು ಸುಲಭ`,`ಕಷ್ಟ`,`ಬೆಲೆ ಹೆಚ್ಚು`,`ಯಾವುದೂ ಅಲ್ಲ`],0),
M(`1 ಸೆಂಮೀ = 5 ವಿದ್ಯಾರ್ಥಿಗಳು ಪ್ರಮಾಣದಲ್ಲಿ 4 ಸೆಂಮೀ ಕಂಬ ಸೂಚಿಸುವ ವಿದ್ಯಾರ್ಥಿಗಳು:`,[`4`,`9`,`20`,`45`],2,'m'),
M(`ಪ್ರಬಂಧ ಸ್ಪರ್ಧೆಯಲ್ಲಿ 25 ವಿದ್ಯಾರ್ಥಿಗಳಿದ್ದರೆ (1 ಸೆಂಮೀ = 5) ಕಂಬದ ಎತ್ತರ:`,[`5 ಸೆಂಮೀ`,`25 ಸೆಂಮೀ`,`10 ಸೆಂಮೀ`,`2 ಸೆಂಮೀ`],0,'m'),
M(`10 + 20 + 25 + 15 =`,[`60`,`70`,`80`,`50`],1),
M(`ಹೆಚ್ಚು ದತ್ತಾಂಶಗಳನ್ನು ನಕ್ಷೆಯ ಮೂಲಕ ಸೂಚಿಸುವ ಅನುಕೂಲ:`,[`ಹೋಲಿಕೆ ಸುಲಭ`,`ಸಮಯ ವ್ಯರ್ಥ`,`ಕಷ್ಟ`,`ಯಾವುದೂ ಇಲ್ಲ`],0),
O(`ಕಂಬ ನಕ್ಷೆಯನ್ನು ಇನ್ನೊಂದು ಹೆಸರಿನಿಂದ ಏನೆನ್ನುತ್ತಾರೆ?`,`ಸ್ತಂಭ ನಕ್ಷೆ`),
O(`ಸ್ಪರ್ಧೆಗಳಲ್ಲಿ ಅತಿ ಹೆಚ್ಚು ವಿದ್ಯಾರ್ಥಿಗಳು ಭಾಗವಹಿಸಿದ ಸ್ಪರ್ಧೆ (ಭಾವಗೀತೆ 10, ಚರ್ಚೆ 20, ಪ್ರಬಂಧ 25, ಆಶುಭಾಷಣ 15)?`,`ಪ್ರಬಂಧ`),
O(`ಅದರಲ್ಲಿ ಅತಿ ಕಡಿಮೆ ವಿದ್ಯಾರ್ಥಿಗಳು ಭಾಗವಹಿಸಿದ ಸ್ಪರ್ಧೆ?`,`ಭಾವಗೀತೆ`),
O(`4 ಸ್ಪರ್ಧೆಗಳಲ್ಲಿ ಭಾಗವಹಿಸಿದ ಒಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳು?`,`70`),
O(`ಚರ್ಚಾ ಸ್ಪರ್ಧೆ ಮತ್ತು ಆಶುಭಾಷಣ – ಯಾವುದರಲ್ಲಿ ಹೆಚ್ಚು ವಿದ್ಯಾರ್ಥಿಗಳು?`,`ಚರ್ಚಾ ಸ್ಪರ್ಧೆ`),

S(`9 ರ ಮಗ್ಗಿಯಲ್ಲಿ ನೀವು ಗಮನಿಸಿದ ವಿನ್ಯಾಸ ಬರೆಯಿರಿ.`,`ಬಿಡಿ ಸ್ಥಾನದ ಅಂಕಿಗಳು ಇಳಿಕೆ ಕ್ರಮದಲ್ಲಿ, ಹತ್ತರ ಸ್ಥಾನದ ಅಂಕಿಗಳು ಏರಿಕೆ ಕ್ರಮದಲ್ಲಿ ಇರುತ್ತವೆ; ಅಂಕಿಗಳ ಮೊತ್ತ ಯಾವಾಗಲೂ 9.`),
S(`10 ಮತ್ತು 100 ರಿಂದ ಸಂಖ್ಯೆಯನ್ನು ಗುಣಿಸುವ ನಿಯಮ ಬರೆಯಿರಿ.`,`10 ರಿಂದ ಗುಣಿಸಲು ಸಂಖ್ಯೆಯ ಬಲಭಾಗದಲ್ಲಿ ಒಂದು ಸೊನ್ನೆ, 100 ರಿಂದ ಗುಣಿಸಲು ಎರಡು ಸೊನ್ನೆ ಸೇರಿಸಬೇಕು. ಉದಾ: 7 × 100 = 700.`),
S(`ಸಮಮಿತಿ ಎಂದರೇನು? ಒಂದು ಉದಾಹರಣೆ ಕೊಡಿ.`,`ಒಂದು ರೇಖೆಯ ಮೇಲೆ ಮಡಚಿದಾಗ ಎರಡೂ ಭಾಗಗಳು ಸಂಪೂರ್ಣವಾಗಿ ಹೊಂದಿದರೆ ಅದು ಸಮಮಿತಿ. ಉದಾ: ಚೌಕ (4 ಅಕ್ಷಗಳು), ಅಕ್ಷರ A.`),
S(`ಬೆಸ ಸಂಖ್ಯೆಗಳ ಸಂಕಲನದ ವಿನ್ಯಾಸ ವಿವರಿಸಿ.`,`1 + 3 = 4 = 2×2; 1 + 3 + 5 = 9 = 3×3; 1+3+5+7 = 16 = 4×4. ಒಂದರಿಂದ ಆರಂಭಿಸಿ ಕ್ರಮವಾಗಿ ಬೆಸ ಸಂಖ್ಯೆ ಕೂಡಿದರೆ ವರ್ಗ ಸಂಖ್ಯೆ ಸಿಗುತ್ತದೆ.`),
L(`ಈ ಲೆಕ್ಕಗಳನ್ನು ವಿನ್ಯಾಸ ಗಮನಿಸಿ ಬಿಡಿಸಿ: (4×4)−(3×3), (5×5)−(4×4), (6×6)−(5×5), (9×9)−(8×8). ಉತ್ತರಗಳಲ್ಲಿ ಏನು ಗಮನಿಸಿದಿರಿ?`,`7, 9, 11, 17. ಪ್ರತಿ ಉತ್ತರ ಅದೇ ಸಂಖ್ಯೆಗೆ ಹಿಂದಿನ ಸಂಖ್ಯೆಯನ್ನು ಕೂಡಿದ ಮೊತ್ತಕ್ಕೆ ಸಮ: 4+3 = 7, 5+4 = 9, 6+5 = 11, 9+8 = 17.`),
L(`ಸಮಬಾಹು ತ್ರಿಭುಜ, ಚೌಕ ಮತ್ತು ಆಯತಗಳ ಸಮಮಿತಿ ಅಕ್ಷಗಳ ಸಂಖ್ಯೆ ಬರೆದು ಕಾರಣ ವಿವರಿಸಿ.`,`ಸಮಬಾಹು ತ್ರಿಭುಜಕ್ಕೆ 3 (ಪ್ರತಿ ಶೃಂಗದಿಂದ ಎದುರು ಬಾಹುವಿನ ಮಧ್ಯಬಿಂದುವಿಗೆ); ಚೌಕಕ್ಕೆ 4 (2 ಕರ್ಣಗಳು + 2 ಮಧ್ಯರೇಖೆಗಳು); ಆಯತಕ್ಕೆ 2 (ಎರಡು ಮಧ್ಯರೇಖೆಗಳು). ಈ ರೇಖೆಗಳ ಮೇಲೆ ಮಡಚಿದಾಗ ಎರಡೂ ಭಾಗ ಹೊಂದುತ್ತವೆ.`)
]});

LSM.push({n:17,t:`ಟ್ಯಾನ್‌ಗ್ರಾಮ್ಸ್ ಮತ್ತು ವಿನ್ಯಾಸಗಳು`,au:`ಅಧ್ಯಾಯ 17 (ರೇಖಾಗಣಿತ)`,pg:116,
words:`ಟ್ಯಾನ್‌ಗ್ರಾಮ್ (7 ತುಣುಕುಗಳ ಒಗಟು (ಪಝಲ್)); ಹಾಸುಗಳು (ಟೆಸಲೇಶನ್); ಸಮಬಾಹು ತ್ರಿಭುಜ; ಷಡ್ಭುಜ; ಚೌಕ; ಆಯತ; ಸಮಾಂತರ ಚತುರ್ಭುಜ; ತ್ರಿಭುಜ`,
notes:`ಟ್ಯಾನ್‌ಗ್ರಾಮ್‌ನಲ್ಲಿ 7 ತುಣುಕುಗಳಿರುತ್ತವೆ: 5 ತ್ರಿಭುಜಗಳು (2 ಚಿಕ್ಕ, 1 ಮಧ್ಯಮ, 2 ದೊಡ್ಡ), 1 ಚೌಕ ಮತ್ತು 1 ಸಮಾಂತರ ಚತುರ್ಭುಜ. 36 ಚೌಕಗಳ ಜಾಲದ ಹಾಳೆಯನ್ನು ಕತ್ತರಿಸಿ 7 ತುಣುಕುಗಳನ್ನು ಮಾಡಬಹುದು. ಈ ತುಣುಕುಗಳನ್ನು ಬಳಸಿ ಹಲವು ಆಕೃತಿಗಳನ್ನು ರಚಿಸಬಹುದು. ಹಾಸುಗಳು: ಚೌಕ, ತ್ರಿಭುಜ, ಆಯತಗಳನ್ನು ಅಂತರವಿಲ್ಲದೆ, ಒಂದರ ಮೇಲೊಂದು ಬರದಂತೆ ಹೊಂದಿಸಿ ಮಾಡುವ ವಿನ್ಯಾಸ. ಸಮಬಾಹು ತ್ರಿಭುಜ ಮತ್ತು ಸಮ ಷಡ್ಭುಜಗಳಿಂದಲೂ ಹಾಸುಗಳನ್ನು ಮಾಡಬಹುದು. ಷಡ್ಭುಜ ಎಂದರೆ 6 ಸಮ ರೇಖಾಖಂಡಗಳಿಂದ ಆವೃತವಾದ ಆಕೃತಿ.`,
ab:[
[`ಟ್ಯಾನ್‌ಗ್ರಾಮ್ ತುಣುಕುಗಳು (ಪುಟ 116–117)`,[
[`ಟ್ಯಾನ್‌ಗ್ರಾಮ್‌ನಲ್ಲಿ ಒಟ್ಟು ಎಷ್ಟು ತುಣುಕುಗಳಿವೆ?`,`7 ತುಣುಕುಗಳು`],
[`ಈ 7 ತುಣುಕುಗಳಲ್ಲಿ ತ್ರಿಭುಜಗಳೆಷ್ಟು, ಚೌಕ ಎಷ್ಟು, ಸಮಾಂತರ ಚತುರ್ಭುಜ ಎಷ್ಟು?`,`5 ತ್ರಿಭುಜಗಳು, 1 ಚೌಕ, 1 ಸಮಾಂತರ ಚತುರ್ಭುಜ`],
[`ಜಾಲದ ಹಾಳೆಯಲ್ಲಿ ಎಷ್ಟು ಚೌಕಗಳಿರಬೇಕು?`,`36 ಚೌಕಗಳು (6 × 6)`]]],
[`ಅಭ್ಯಾಸ 17.1 – I. ಸೂಚಿಸಿರುವ ತುಣುಕುಗಳನ್ನು ಬಳಸಿ ಆಕೃತಿಗಳನ್ನು ರಚಿಸಿ (ಚಟುವಟಿಕೆ ಆಧಾರಿತ)`,[
[`1. ತ್ರಿಭುಜಗಳನ್ನು ಮಾತ್ರ ಬಳಸಿ`,`ಮಾದರಿ: 5 ತ್ರಿಭುಜಗಳನ್ನೂ ಸೇರಿಸಿ ಒಂದು ದೊಡ್ಡ ಆಕೃತಿ (ಉದಾ: ದೊಡ್ಡ ತ್ರಿಭುಜ) ರಚಿಸಿ. ಶಿಕ್ಷಕರ ಸಹಾಯ ಪಡೆಯಿರಿ.`],
[`2. ಎರಡು ತ್ರಿಭುಜಗಳನ್ನು ಮಾತ್ರ ಬಳಸಿ`,`ಮಾದರಿ: ಎರಡು ಸಮಾನ ತ್ರಿಭುಜಗಳಿಂದ ಚೌಕ ಅಥವಾ ದೊಡ್ಡ ತ್ರಿಭುಜ ಮಾಡಬಹುದು.`],
[`3. ತ್ರಿಭುಜ ಮತ್ತು ಸಮಾಂತರ ಚತುರ್ಭುಜಗಳನ್ನು ಮಾತ್ರ ಬಳಸಿ`,`ಮಾದರಿ: ಬಾಣದ ಆಕೃತಿ ರಚಿಸಬಹುದು.`],
[`4. ಚೌಕ ಮತ್ತು ತ್ರಿಭುಜಗಳನ್ನು ಮಾತ್ರ ಬಳಸಿ`,`ಮಾದರಿ: ಮನೆ/ಪ್ರಾಣಿಯ ಆಕೃತಿ ರಚಿಸಬಹುದು.`]]],
[`ಹಾಸುಗಳು – ಬಳಸಿರುವ ಆಕೃತಿಗಳು (ಪುಟ 118–119)`,[
[`ತ್ರಿಭುಜಗಳ ಹಾಸಿನಲ್ಲಿ ಬಳಸಿರುವ ಜ್ಯಾಮಿತೀಯ ಆಕೃತಿ`,`ಸಮಬಾಹು ತ್ರಿಭುಜ`],
[`ಜೇನುಗೂಡಿನ ವಿನ್ಯಾಸದಲ್ಲಿ ಬಳಸಿರುವ ಆಕೃತಿ`,`ಷಡ್ಭುಜ (6 ಸಮ ರೇಖಾಖಂಡಗಳು)`],
[`ಇಟ್ಟಿಗೆ ಹಾಸಿನಲ್ಲಿ ಬಳಸಿರುವ ಆಕೃತಿ`,`ಆಯತ`],
[`ಚೌಕ ಹಾಸಿನ ಆಕೃತಿ`,`ಚೌಕ`]]],
[`ಅಭ್ಯಾಸ 17.2 – ವಿನ್ಯಾಸ ಪೂರ್ಣಗೊಳಿಸುವಿಕೆ (ಚಟುವಟಿಕೆ ಆಧಾರಿತ)`,[
[`ಚುಕ್ಕಿ ಹಾಳೆಯಲ್ಲಿ ಷಡ್ಭುಜ ಹಾಸು ಪೂರ್ಣಗೊಳಿಸಿ`,`ಒಂದೇ ಅಳತೆಯ ಷಡ್ಭುಜಗಳನ್ನು ಅಂತರವಿಲ್ಲದೆ ಪಕ್ಕದಲ್ಲಿ ಹೊಂದಿಸಿ ರೇಖೆಗಳಿಂದ ಪೂರ್ಣಗೊಳಿಸಿ.`],
[`ತ್ರಿಭುಜಗಳ ಹಾಸು ಪೂರ್ಣಗೊಳಿಸಿ`,`ಒಂದೇ ಅಳತೆಯ ಸಮಬಾಹು ತ್ರಿಭುಜಗಳನ್ನು ಒಂದರ ಪಕ್ಕ ಇನ್ನೊಂದನ್ನು ತಿರುಗಿಸಿ ಬರೆದು ಪೂರ್ಣಗೊಳಿಸಿ.`],
[`ಬಣ್ಣ ತುಂಬಿ ವಿನ್ಯಾಸ ಪೂರ್ಣಗೊಳಿಸಿ`,`ತೋರಿಸಿರುವ ಬಣ್ಣದ ತ್ರಿಭುಜಗಳ ಕ್ರಮವನ್ನು ಗಮನಿಸಿ ಉಳಿದ ತ್ರಿಭುಜಗಳಿಗೆ ಅದೇ ಕ್ರಮದಲ್ಲಿ ಬಣ್ಣ ತುಂಬಿ.`]]]
],
qb:[
M(`ಟ್ಯಾನ್‌ಗ್ರಾಮ್‌ನಲ್ಲಿರುವ ತುಣುಕುಗಳ ಸಂಖ್ಯೆ:`,[`5`,`6`,`7`,`8`],2),
M(`ಟ್ಯಾನ್‌ಗ್ರಾಮ್‌ನಲ್ಲಿರುವ ತ್ರಿಭುಜಗಳ ಸಂಖ್ಯೆ:`,[`3`,`4`,`5`,`7`],2),
M(`ಟ್ಯಾನ್‌ಗ್ರಾಮ್‌ನಲ್ಲಿರುವ ಚೌಕಗಳ ಸಂಖ್ಯೆ:`,[`0`,`1`,`2`,`3`],1),
M(`ಟ್ಯಾನ್‌ಗ್ರಾಮ್‌ನಲ್ಲಿರುವ ಸಮಾಂತರ ಚತುರ್ಭುಜಗಳ ಸಂಖ್ಯೆ:`,[`0`,`1`,`2`,`3`],1),
M(`ಜೇನುಗೂಡಿನ ಹಾಸಿನಲ್ಲಿರುವ ಆಕೃತಿ:`,[`ಚೌಕ`,`ತ್ರಿಭುಜ`,`ಷಡ್ಭುಜ`,`ವೃತ್ತ`],2),
M(`ಷಡ್ಭುಜಕ್ಕೆ ಎಷ್ಟು ಬಾಹುಗಳಿವೆ?`,[`4`,`5`,`6`,`8`],2),
M(`ಮೂರು ಬಾಹುಗಳು ಸಮನಾದ ತ್ರಿಭುಜಕ್ಕೆ ಏನೆನ್ನುತ್ತಾರೆ?`,[`ವಿಷಮಬಾಹು`,`ಸಮಬಾಹು ತ್ರಿಭುಜ`,`ಲಂಬಕೋನ`,`ಸಮದ್ವಿಬಾಹು`],1),
M(`ಜಾಲದ ಹಾಳೆಯಲ್ಲಿ ಟ್ಯಾನ್‌ಗ್ರಾಮ್‌ಗಾಗಿ ಇರುವ ಚೌಕಗಳ ಸಂಖ್ಯೆ:`,[`16`,`25`,`36`,`49`],2),
M(`ಅಂತರವಿಲ್ಲದೆ ಆಕೃತಿಗಳನ್ನು ಹೊಂದಿಸಿ ಮಾಡುವ ವಿನ್ಯಾಸಕ್ಕೆ ಏನೆನ್ನುತ್ತೇವೆ?`,[`ಹಾಸು`,`ಜಾಲ`,`ಕಂಬ ನಕ್ಷೆ`,`ಕೋಷ್ಟಕ`],0),
O(`ಟ್ಯಾನ್‌ಗ್ರಾಮ್ ಎಂದರೇನು?`,`7 ತುಣುಕುಗಳ (5 ತ್ರಿಭುಜ, 1 ಚೌಕ, 1 ಸಮಾಂತರ ಚತುರ್ಭುಜ) ಒಗಟು (ಪಝಲ್); ಇದರಿಂದ ಅನೇಕ ಆಕೃತಿ ರಚಿಸಬಹುದು.`,'m'),
O(`ಟ್ಯಾನ್‌ಗ್ರಾಮ್ ತುಣುಕುಗಳನ್ನು ಬರೆಯಿರಿ.`,`5 ತ್ರಿಭುಜಗಳು, 1 ಚೌಕ, 1 ಸಮಾಂತರ ಚತುರ್ಭುಜ`),
O(`ಜೇನುಗೂಡಿನಲ್ಲಿ ಯಾವ ಆಕೃತಿ ಕಾಣುತ್ತದೆ?`,`ಷಡ್ಭುಜ`),
O(`ಇಟ್ಟಿಗೆ ಹಾಸಿನಲ್ಲಿ ಯಾವ ಆಕೃತಿ ಬಳಕೆಯಾಗಿದೆ?`,`ಆಯತ`),
O(`ಷಡ್ಭುಜ ಎಂದರೆ ಏನು?`,`6 ಸಮ ರೇಖಾಖಂಡಗಳಿಂದ ಆವೃತವಾದ ಜ್ಯಾಮಿತೀಯ ಆಕೃತಿ`),
G(`ಸರಿ/ತಪ್ಪು: ಟ್ಯಾನ್‌ಗ್ರಾಮ್‌ನಲ್ಲಿ 7 ತುಣುಕುಗಳಿವೆ.`,`ಸರಿ`),
G(`ಸರಿ/ತಪ್ಪು: ಹಾಸಿನಲ್ಲಿ ಆಕೃತಿಗಳ ನಡುವೆ ಅಂತರವಿರುತ್ತದೆ.`,`ತಪ್ಪು (ಅಂತರವಿರುವುದಿಲ್ಲ)`),
S(`ಹಾಸು ಎಂದರೇನು? ಯಾವ ಆಕೃತಿಗಳಿಂದ ಹಾಸು ಮಾಡಬಹುದು?`,`ಒಂದೇ ಆಕೃತಿಯನ್ನು ಅಂತರವಿಲ್ಲದೆ, ಒಂದರ ಮೇಲೊಂದು ಬರದಂತೆ ಹೊಂದಿಸಿ ಮಾಡಿದ ವಿನ್ಯಾಸ. ಚೌಕ, ಆಯತ, ಸಮಬಾಹು ತ್ರಿಭುಜ, ಸಮ ಷಡ್ಭುಜಗಳಿಂದ ಮಾಡಬಹುದು.`),
S(`ಟ್ಯಾನ್‌ಗ್ರಾಮ್ ಬಳಸಿ ನೀವು ರಚಿಸಬಹುದಾದ ಯಾವುದಾದರೂ ಎರಡು ಆಕೃತಿ ಹೆಸರಿಸಿ.`,`ಹಕ್ಕಿ, ಮನೆ, ಮೀನು, ಮನುಷ್ಯ, ಬೆಕ್ಕು (ಯಾವುದಾದರೂ ಎರಡು).`),
L(`36 ಚೌಕಗಳ ಜಾಲದ ಹಾಳೆಯಿಂದ ಟ್ಯಾನ್‌ಗ್ರಾಮ್ ತುಣುಕುಗಳನ್ನು ಹೇಗೆ ಮಾಡುತ್ತೀರಿ? ತುಣುಕುಗಳ ವಿವರ ಬರೆಯಿರಿ.`,`36 ಚೌಕಗಳ ಹಾಳೆಯನ್ನು ಕಾಗದದ ಮೇಲೆ ಅಂಟಿಸಿ, ಚಿತ್ರ–2 ರಂತೆ ಗೆರೆ ಎಳೆದು ಕತ್ತರಿಸಿದರೆ 7 ತುಣುಕುಗಳು ಸಿಗುತ್ತವೆ: 2 ದೊಡ್ಡ ತ್ರಿಭುಜಗಳು, 1 ಮಧ್ಯಮ ತ್ರಿಭುಜ, 2 ಚಿಕ್ಕ ತ್ರಿಭುಜಗಳು, 1 ಚೌಕ, 1 ಸಮಾಂತರ ಚತುರ್ಭುಜ.`)
]});

LSM.push({n:18,t:`ಘನಾಕೃತಿಗಳು`,au:`ಅಧ್ಯಾಯ 18 (ರೇಖಾಗಣಿತ)`,pg:122,
words:`ಘನಾಕೃತಿ; ಸಮತಲಾಕೃತಿ; ಮುಖ; ಅಂಚು; ಶೃಂಗ; ಆಯತ ಘನ; ಚೌಕ ಘನ; ಸ್ತಂಭಾಕೃತಿ; ಶಂಕು; ಗೋಳ; ಸಮತಲ ಮುಖ; ವಕ್ರ ಮೇಲ್ಮೈ; ವಕ್ರ ಅಂಚು; ಜಾಲ`,
notes:`ಎರಡು ಮುಖಗಳು ಸೇರುವ ಭಾಗ ಅಂಚು; ಎರಡು ಅಂಚುಗಳು (ಅಥವಾ ಹೆಚ್ಚು) ಸೇರುವ ಭಾಗ ಶೃಂಗ. ಆಯತ ಘನ (ಸಾಬೂನು, ಪುಸ್ತಕ, ಬೆಂಕಿ ಪೆಟ್ಟಿಗೆ): 6 ಮುಖ, 12 ಅಂಚು, 8 ಶೃಂಗ. ಚೌಕ ಘನ (ದಾಳ, ರೂಬಿಕ್ ಕ್ಯೂಬ್): 6 ಮುಖ, 12 ಅಂಚು, 8 ಶೃಂಗ. ಸ್ತಂಭಾಕೃತಿ (ಅಗರಬತ್ತಿ ಪ್ಯಾಕೆಟ್, ಬ್ಯಾಟರಿ, ಡ್ರಮ್): 2 ಸಮತಲ ಮುಖ + 1 ವಕ್ರ ಮೇಲ್ಮೈ; 2 ವಕ್ರ ಅಂಚು; ಶೃಂಗ ಇಲ್ಲ. ಶಂಕು (ಕೋನ್ ಐಸ್ ಕ್ರೀಂ, ಟೋಪಿ): 1 ಸಮತಲ ಮುಖ, 1 ವಕ್ರ ಮೇಲ್ಮೈ, 1 ವಕ್ರ ಅಂಚು, 1 ಶೃಂಗ. ಗೋಳ (ಚೆಂಡು, ಗ್ಲೋಬ್): 1 ವಕ್ರ ಮೇಲ್ಮೈ; ಅಂಚು ಇಲ್ಲ, ಶೃಂಗ ಇಲ್ಲ. ಸಮತಲಾಕೃತಿಗೆ ಉದ್ದ–ಅಗಲ (2 ಆಯಾಮ); ಘನಾಕೃತಿಗೆ ಉದ್ದ–ಅಗಲ–ಎತ್ತರ (3 ಆಯಾಮ). ಘನಾಕೃತಿಯನ್ನು ಬಿಡಿಸಿ ಹರಡಿದ ಎರಡು ಆಯಾಮದ ರೂಪವೇ ಜಾಲ.`,
ab:[
[`ಘನಾಕೃತಿಗಳ ಮುಖ, ಅಂಚು ಮತ್ತು ಶೃಂಗ (ಪುಟ 122–126)`,[
[`ಆಯತ ಘನದ ಮುಖಗಳು / ಅಂಚುಗಳು / ಶೃಂಗಗಳು`,`6 / 12 / 8`],
[`ಚೌಕ ಘನದ ಮುಖಗಳು / ಅಂಚುಗಳು / ಶೃಂಗಗಳು`,`6 / 12 / 8`],
[`ಸ್ತಂಭಾಕೃತಿಯ ಮುಖಗಳು / ಅಂಚುಗಳು / ಶೃಂಗಗಳು`,`2 (ಸಮತಲ) + ವಕ್ರ ಮೇಲ್ಮೈ / 2 ವಕ್ರ ಅಂಚು / ಶೃಂಗ ಇಲ್ಲ`],
[`ಶಂಕುವಿನ ಮುಖಗಳು / ಅಂಚುಗಳು / ಶೃಂಗಗಳು`,`2 / 1 / 1`],
[`ಗೋಳದ ಮುಖಗಳು / ಅಂಚುಗಳು / ಶೃಂಗಗಳು`,`1 / ಇಲ್ಲ / ಇಲ್ಲ`]]],
[`ಘನಾಕೃತಿಯನ್ನು ಹೋಲುವ ವಸ್ತುಗಳು (ಉದಾಹರಣೆಗಳು)`,[
[`ಆಯತ ಘನ`,`ಸಾಬೂನು, ಪುಸ್ತಕ, ಬೆಂಕಿ ಪೆಟ್ಟಿಗೆ, ಇಟ್ಟಿಗೆ`],
[`ಚೌಕ ಘನ`,`ದಾಳ, ಡಬ್ಬ, ರೂಬಿಕ್ ಕ್ಯೂಬ್`],
[`ಸ್ತಂಭಾಕೃತಿ`,`ಅಗರಬತ್ತಿ ಪ್ಯಾಕೆಟ್, ಬ್ಯಾಟರಿ, ನೀರಿನ ಡ್ರಮ್, ಮರದ ದಿಮ್ಮಿ`],
[`ಶಂಕು`,`ಕೋನ್ ಐಸ್ ಕ್ರೀಂ, ಕ್ಯಾರೆಟ್, ಮರಳಿನ ರಾಶಿ, ಹುಟ್ಟುಹಬ್ಬದ ಟೋಪಿ`],
[`ಗೋಳ`,`ಕ್ರಿಕೆಟ್ ಚೆಂಡು, ಫುಟ್‌ಬಾಲ್, ಗೋಲಿ, ಗ್ಲೋಬ್`]]],
[`ಅಭ್ಯಾಸ 18.1 – I. ಸಮತಲಾಕೃತಿ / ಘನಾಕೃತಿ ಎಂದು ಗುರುತಿಸಿ ಬರೆ (ಚಿತ್ರಾಧಾರಿತ ⚠)`,[
[`1) ಆಯತ ಘನ ಚಿತ್ರ`,`ಘನಾಕೃತಿ (ಆಯತ ಘನ)`],
[`2) ವೃತ್ತ`,`ಸಮತಲಾಕೃತಿ`],
[`4) ತ್ರಿಭುಜ`,`ಸಮತಲಾಕೃತಿ`],
[`5) ಬ್ಯಾಟರಿ`,`ಘನಾಕೃತಿ (ಸ್ತಂಭಾಕೃತಿ)`],

[`7) ಗ್ಯಾಸ್ ಸಿಲಿಂಡರ್`,`ಘನಾಕೃತಿ (ಸ್ತಂಭಾಕೃತಿ)`]]],
[`ಅಭ್ಯಾಸ 18.1 – II. ಜ್ಯಾಮಿತೀಯ ಹೆಸರುಗಳನ್ನು ಬರೆಯಿರಿ (ಚಿತ್ರಾಧಾರಿತ ⚠)`,[
[`1) ದಾಳ`,`ಚೌಕ ಘನ`],[`2) ಪೆಟ್ಟಿಗೆ ರೂಪ`,`ಆಯತ ಘನ`],[`3) ನೀರಿನ ಡ್ರಮ್`,`ಸ್ತಂಭಾಕೃತಿ`],[`4) ಪಾತ್ರೆ (ಸ್ಟೀಲ್ ಡ್ರಮ್)`,`ಸ್ತಂಭಾಕೃತಿ`],
[`5) ಮರದ ದಿಮ್ಮಿ`,`ಸ್ತಂಭಾಕೃತಿ`],[`6) ಟೊಮೆಟೊ`,`ಗೋಳ`],[`7) ಕೋನ್ ಐಸ್ ಕ್ರೀಂ`,`ಶಂಕು`],[`8) ಪೆಟ್ಟಿಗೆ`,`ಆಯತ ಘನ`]]],
[`ಅಭ್ಯಾಸ 18.1 – III. ಸರಿ ಅಥವಾ ತಪ್ಪು ಬರೆ`,[
[`ಒಂದು ಚೌಕ ಘನದಲ್ಲಿ 8 ಶೃಂಗಗಳು, 12 ಅಂಚುಗಳು ಮತ್ತು 6 ಮುಖಗಳಿವೆ.`,`ಸರಿ`],
[`ಒಂದು ಆಯತ ಘನದಲ್ಲಿ 8 ಶೃಂಗಗಳು, 6 ಅಂಚುಗಳು ಮತ್ತು 12 ಮುಖಗಳಿವೆ.`,`ತಪ್ಪು. ಸರಿ: 8 ಶೃಂಗ, 12 ಅಂಚು, 6 ಮುಖ`],
[`ಒಂದು ಶಂಕುವಿನಲ್ಲಿ 1 ಶೃಂಗ, 1 ಸಮತಲ ಮುಖ, 1 ವಕ್ರ ಅಂಚು ಮತ್ತು 1 ವಕ್ರ ಮೇಲ್ಮೈ ಇವೆ.`,`ಸರಿ`],
[`ಒಂದು ಸ್ತಂಭಾಕೃತಿಯಲ್ಲಿ 2 ಸಮತಲ ಮುಖಗಳು, 1 ವಕ್ರ ಮುಖ, 2 ವಕ್ರ ಅಂಚುಗಳಿದ್ದು ಯಾವುದೇ ಶೃಂಗಗಳಿರುವುದಿಲ್ಲ.`,`ಸರಿ`],
[`ಒಂದು ಗೋಳಾಕೃತಿಯಲ್ಲಿ 2 ವಕ್ರ ಮೇಲ್ಮೈಗಳಿರುತ್ತವೆ.`,`ತಪ್ಪು. ಗೋಳದಲ್ಲಿ 1 ವಕ್ರ ಮೇಲ್ಮೈ ಇರುತ್ತದೆ`]]],
[`ಸಮತಲಾಕೃತಿ ಮತ್ತು ಘನಾಕೃತಿಗಳ ವ್ಯತ್ಯಾಸ (ಪುಟ 128–129)`,[
[`ಸಮತಲಾಕೃತಿಗೆ ಎಷ್ಟು ಆಯಾಮಗಳಿವೆ?`,`2 ಆಯಾಮ (ಉದ್ದ ಮತ್ತು ಅಗಲ)`],
[`ಘನಾಕೃತಿಗೆ ಎಷ್ಟು ಆಯಾಮಗಳಿವೆ?`,`3 ಆಯಾಮ (ಉದ್ದ, ಅಗಲ ಮತ್ತು ಎತ್ತರ)`],
[`ಜಾಲ ಎಂದರೇನು?`,`ಘನಾಕೃತಿಯನ್ನು ಬಿಡಿಸಿ ಹರಡಿದಾಗ ಸಿಗುವ ಎರಡು ಆಯಾಮದ ರೂಪ; ಅದನ್ನು ಮಡಚಿದರೆ ಘನಾಕೃತಿ ಆಗುತ್ತದೆ.`]]]
],

O(`ದಾಳದ ಮುಖಗಳ ಸಂಖ್ಯೆ ಎಷ್ಟು?`,`6`),
O(`ಚೌಕ ಘನದ ಅಂಚುಗಳ ಸಂಖ್ಯೆ ಎಷ್ಟು?`,`12`),

]});
