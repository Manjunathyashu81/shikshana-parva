function vPaperKn(){if(!allQ().length)return '<div class="card glass neu">ಈ ವಿಷಯಕ್ಕೆ LBA ಪ್ರಶ್ನೆ ಪತ್ರಿಕೆ ಇನ್ನೂ ಸಿದ್ಧಪಡಿಸಲಾಗಿಲ್ಲ.</div>';const P=ST.ptype,cfg=PT[P];const o=selOpts(P);if(ST.sub==='en'){const ok=[...o.g.map(x=>x[0]),...o.s.map(x=>x[0])];if(!ok.includes(ST.sel[P]))ST.sel[P]=enDefault(P)}const v=ST.sel[P];const paperHtml=buildPaper();const bpSec=ST.bpOpen?'<div class="card glass neu nopr"><h3>ಬ್ಲೂಪ್ರಿಂಟ – ಈ ಪ್ರಶ್ನೆ ಪತ್ರಿಕೆಯ ಅಂಕಗಳ ಹಂಚಿಕೆ</h3>'+bpPaperHtml(ST.lastPicked||[])+'</div>':'';
 const tabs=[['unit','ಘಟಕ ಪರೀಕ್ಷೆ'],['fa3','FA 3'],['fa4','FA 4'],['sa2','SA 2']].map(([k,l])=>`<button class="tb sm ${P===k?'on':''}" onclick="ST.ptype='${k}';render()">${l} (${PT[k].max})</button>`).join('');
 const po=[];if(o.g.length){po.push([null,'ಪಾಠಗಳ ಗುಂಪು']);o.g.forEach(x=>po.push(x))}if(o.s.length){po.push([null,'ಒಂದು ಪಾಠ']);o.s.forEach(x=>po.push(x))}
 return `<div class="tabs nopr">${tabs}</div>
 <div class="card glass neu nopr ddz"><label class="fl" style="margin-top:0">ಪಾಠ ಆಯ್ಕೆ</label>${sel('psel',po,v,'ST.sel[ST.ptype]=value;render()')}
 <div class="pills"><button class="btn" onclick="ST.seed[ST.ptype]++;render()">🔀 ಹೊಸ ಪ್ರಶ್ನೆಪತ್ರಿಕೆ</button><button class="btn" onclick="ST.showAns=!ST.showAns;render()">${ST.showAns?'ಉತ್ತರ ಮರೆಮಾಡಿ':'ಉತ್ತರ ತೋರಿಸಿ'}</button><button class="btn" onclick="togEdit(this)">✏ ಎಡಿಟ್ ಮಾಡಿ</button><button class="btn" onclick="window.print()">🖨 ಮುದ್ರಿಸಿ</button><button class="btn ${ST.bpOpen?'on':''}" onclick="ST.bpOpen=!ST.bpOpen;render()">📊 ಬ್ಲೂಪ್ರಿಂಟ ${ST.bpOpen?'▴':'▾'}</button></div></div>${bpSec}${paperHtml}`}

function vQuiz(){const list=allQ().filter(q=>(ST.qzc==='all'||q.ch==ST.qzc)&&(ST.qzt==='all'||q.t===ST.qzt));
 const lo=[['all',T('ಎಲ್ಲಾ ಪಾಠಗಳು')],...lessons().map(l=>[String(l.n),`${l.n}. ${l.t}`])];
 const to=[['all',T('ಎಲ್ಲಾ ಪ್ರಕಾರ')],...Object.keys(TLx()).map(k=>[k,TLx()[k]])];
 return `<div class="card glass neu nopr ddz"><div class="row"><div><label class="fl" style="margin-top:0">ಪಾಠ</label>${sel('qzc',lo,ST.qzc,'ST.qzc=value;startQuiz()')}</div><div><label class="fl" style="margin-top:0">ಪ್ರಶ್ನೆ ಪ್ರಕಾರ</label>${sel('qzt',to,ST.qzt,'ST.qzt=value;startQuiz()')}</div></div></div>`+quizHtml(list)}
function startQuiz(){ST.qi=0;ST.qs=0;ST.qa=null;ST.qo=[];render()}
function quizHtml(list){if(!list.length)return '<div class="card glass neu">ಪ್ರಶ್ನೆಗಳಿಲ್ಲ</div>';
 if(!ST.qo.length)ST.qo=shuffle(list.map(q=>q.id),rng(Date.now()%99999));const id=ST.qo[ST.qi];
 if(!id)return `<div class="card glass neu"><h3>ಮುಗಿಯಿತು!</h3><p>ಒಟ್ಟು ${ST.qo.length} ಪ್ರಶ್ನೆಗಳು; ಬಹು ಆಯ್ಕೆ ಸರಿ ಉತ್ತರ: ${ST.qs}</p><button class="btn" onclick="startQuiz()">ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ</button></div>`;
 const q=allQ().find(x=>x.id===id);let h=`<div class="card glass neu"><div class="meta"><span class="tag">${TLx()[q.t]}</span><span>${q.mk} ${T('ಅಂಕ')}</span><span>${ST.qi+1}/${ST.qo.length}</span></div><div class="qt">${esc(q.q)}</div>`;
 if(q.t==='mcq')h+=q.o.map((o,i)=>{let c='';if(ST.qa!==null){if(i===q.a)c='ok';else if(i===ST.qa)c='bad'}return `<div class="opt ${c}" onclick="ansQ(${i},${q.a})" style="cursor:pointer"><span class="ol">${'ABCD'[i]}</span>${esc(o)}</div>`}).join('');
 else h+=ST.qa!==null?`<div class="ans"><b>${T('ಉತ್ತರ:')}</b> ${esc(q.a)}</div>`:`<button class="btn" onclick="ST.qa=0;render()">${T('ಉತ್ತರ ನೋಡಿ')}</button>`;
 if(ST.qa!==null)h+=`<button class="btn" onclick="ST.qi++;ST.qa=null;render()">ಮುಂದಿನದು →</button>`;return h+'</div>'}
function ansQ(i,a){if(ST.qa!==null)return;ST.qa=i;if(i===a)ST.qs++;render()}
