words:`ಜೀವಾಳ – ಜೀವಕ್ಕೆ ಆಧಾರ, ಮುಖ್ಯ ಸಾರ; ಪೋಷಕಾಂಶ – ದೇಹಕ್ಕೆ ಬೇಕಾದ ಪೌಷ್ಟಿಕ ಅಂಶ; ಏಕದಳ ಧಾನ್ಯ – ಒಂದೇ ದಳವಿರುವ ಧಾನ್ಯ (ರಾಗಿ, ಜೋಳ, ಗೋಧಿ); ದ್ವಿದಳ ಧಾನ್ಯ – ಎರಡು ದಳವಿರುವ ಬೇಳೆಕಾಳು (ತೊಗರಿ, ಹೆಸರು); ಸಿರಿಧಾನ್ಯ – ನವಣೆ, ಊದಲು, ಆರ್ಕ ಮುಂತಾದ ಪೌಷ್ಟಿಕ ಧಾನ್ಯ; ಲಭ್ಯತೆ – ದೊರೆಯುವಿಕೆ; ವೈವಿಧ್ಯತೆ – ಬೇರೆ ಬೇರೆ ಬಗೆ; ಪೋಲು – ವ್ಯರ್ಥ; ಸಂರಕ್ಷಣೆ – ಕೆಡದಂತೆ ಕಾಪಾಡುವುದು; ನ್ಯಾಯಬೆಲೆ ಅಂಗಡಿ – ಸರ್ಕಾರ ಕಡಿಮೆ ಬೆಲೆಗೆ ಆಹಾರ ಪದಾರ್ಥ ನೀಡುವ ಅಂಗಡಿ; ಗೋದಾಮು – ಧಾನ್ಯ ಸಂಗ್ರಹಿಸುವ ದೊಡ್ಡ ಕೋಣೆ; ಶೀತಕ ಸಂಗ್ರಹಣೆ – ಅತಿ ಕಡಿಮೆ ಉಷ್ಣತೆಯಲ್ಲಿ ಸಂಗ್ರಹಿಸುವುದು`,
notes:`ಆಹಾರ ನಮಗೆ ಶಕ್ತಿ, ಬೆಳವಣಿಗೆ ಮತ್ತು ಆರೋಗ್ಯ ನೀಡುತ್ತದೆ. ಪೋಷಕಾಂಶಗಳು: ಕಾರ್ಬೋಹೈಡ್ರೇಟ್ಸ್, ಲಿಪಿಡ್ (ಕೊಬ್ಬು), ಪ್ರೋಟೀನ್, ವಿಟಮಿನ್, ಖನಿಜ ಲವಣಗಳು, ನೀರಿನಾಂಶ. ಆಹಾರ ಮೂಲ: ಸಸ್ಯ ಮೂಲ (ಏಕದಳ, ದ್ವಿದಳ, ಎಣ್ಣೆಬೀಜ, ತರಕಾರಿ, ಸೊಪ್ಪು, ಹಣ್ಣು) ಮತ್ತು ಪ್ರಾಣಿ ಮೂಲ (ಹಾಲು, ಮೊಟ್ಟೆ, ಮಾಂಸ, ಮೀನು, ತುಪ್ಪ). ಆಹಾರ ಪದ್ಧತಿಯನ್ನು ಪ್ರದೇಶದ ವಾಯುಗುಣ, ಬೆಳೆಯುವ ಬೆಳೆ, ಕುಟುಂಬದ ಸಂಪ್ರದಾಯ ಮತ್ತು ಕಾಲ (ಬೇಸಿಗೆ, ಮಳೆ, ಚಳಿ) ನಿರ್ಧರಿಸುತ್ತವೆ. ಜಂಕ್ ಫುಡ್ ಆರೋಗ್ಯಕ್ಕೆ ಒಳ್ಳೆಯದಲ್ಲ. ಆಹಾರ ಪೋಲು ಮಾಡಬಾರದು; ಉಪ್ಪು, ಸಕ್ಕರೆ, ಒಣಗಿಸುವುದು, ಶೀತಕ ಸಂಗ್ರಹಣೆಗಳಿಂದ ಸಂರಕ್ಷಿಸಬಹುದು.`,
ab:[
[`ಸರ್ವಜ್ಞನ ತ್ರಿಪದಿ – ಯೋಚಿಸಿ ಬರೆ`,[
[`"ಬಿಸಿಗೂಡಿ ತಂಗಳುಣಬೇಡ" ಎಂದು ಯಾವುದರ ಬಗ್ಗೆ ಹೇಳಿದ್ದಾರೆ?`,`ನಾವು ಸೇವಿಸುವ ಆಹಾರದ ಬಗ್ಗೆ. ಬಿಸಿ ಆಹಾರವನ್ನು ತಣ್ಣಗಾದ/ಹಳಸಿದ ಆಹಾರದೊಂದಿಗೆ ಬೆರೆಸಿ ಅಥವಾ ತಂಗಳನ್ನು ಸೇವಿಸಬಾರದು.`]]],
[`ಪೋಷಕಾಂಶಗಳು ಮತ್ತು ಆಹಾರ ಪದಾರ್ಥಗಳನ್ನು ಜೋಡಿಸು (ಮಾದರಿ ಉತ್ತರ ⚠)`,[
[`ಕಾರ್ಬೋಹೈಡ್ರೇಟ್ಸ್`,`ರಾಗಿ, ಗೋಧಿ, ಜೋಳ, ನವಣೆ, ಸಾಮೆ, ಬ್ರೆಡ್, ಜೇನುತುಪ್ಪ`],
[`ಲಿಪಿಡ್ (ಕೊಬ್ಬು)`,`ಶೇಂಗಾ, ಒಣಕೊಬ್ಬರಿ, ಎಳ್ಳು, ಮೀನೆಣ್ಣೆ, ಮೊಟ್ಟೆಯ ಹಳದಿ ಭಾಗ`],

[`ವಿಟಮಿನ್`,`ತರಕಾರಿ, ಹಣ್ಣುಗಳು, ನಿಂಬೆ, ಕ್ಯಾರೆಟ್, ಮೆಂತ್ಯ, ಹಸಿರು–ಹಳದಿ ತರಕಾರಿಗಳು, ಮೊಳಕೆಕಾಳು`],
[`ಖನಿಜ ಲವಣಗಳು ಮತ್ತು ನೀರಿನಾಂಶ`,`ಸೌತೆಕಾಯಿ, ಕಲ್ಲಂಗಡಿ, ದ್ರಾಕ್ಷಿ, ಮೂಲಂಗಿ, ಕುಂಬಳಕಾಯಿ, ಬದನೆಕಾಯಿ, ಕೋಸು, ಹೂಕೋಸು`]]],
[`ಆಲೋಚಿಸು`,[
[`ಪ್ರತಿದಿನ ಒಂದೇ ರೀತಿಯ ಪೋಷಕಾಂಶವುಳ್ಳ ಆಹಾರ ಸೇವನೆಯಿಂದ ಉತ್ತಮ ಆರೋಗ್ಯ ಹೊಂದಲು ಸಾಧ್ಯವಿಲ್ಲ. ಏಕೆ?`,`ದೇಹಕ್ಕೆ ಎಲ್ಲಾ ಪೋಷಕಾಂಶಗಳೂ (ಶಕ್ತಿ, ಬೆಳವಣಿಗೆ, ರೋಗ ನಿರೋಧಕತೆಗಾಗಿ) ಬೇಕು. ಒಂದೇ ಬಗೆಯ ಆಹಾರದಲ್ಲಿ ಎಲ್ಲಾ ಪೋಷಕಾಂಶಗಳು ಇರುವುದಿಲ್ಲ; ಆದ್ದರಿಂದ ಸಮತೋಲನ ಆಹಾರ ಬೇಕು.`],
[`ವೈದ್ಯರು ರೋಗಿಗಳಿಗೆ ಸಿರಿಧಾನ್ಯ ಸೇವಿಸಲು ಸಲಹೆ ನೀಡುತ್ತಿದ್ದಾರೆ. ಏಕೆ?`,`ಸಿರಿಧಾನ್ಯಗಳು ಹೆಚ್ಚು ಪೋಷಕಾಂಶಗಳುಳ್ಳ ಧಾನ್ಯಗಳು; ರಾಸಾಯನಿಕಗಳಿಲ್ಲದೆ ಬೆಳೆಯುವುದರಿಂದ ಆರೋಗ್ಯಕ್ಕೆ ಉತ್ತಮ.`],
[`ಏರುತ್ತಿರುವ ಜನಸಂಖ್ಯೆ ಮತ್ತು ಕೃಷಿ ಭೂಮಿ ಕಡಿಮೆಯಾಗುತ್ತಿರುವುದು ಆಹಾರದ ಲಭ್ಯತೆ ಕಡಿಮೆಯಾಗಲು ಕಾರಣವಾಗಿದೆಯೇ?`,`ಹೌದು. ತಿನ್ನುವವರ ಸಂಖ್ಯೆ ಹೆಚ್ಚುತ್ತಿದೆ, ಆದರೆ ಆಹಾರ ಬೆಳೆಯುವ ಭೂಮಿ ಕಡಿಮೆಯಾಗುತ್ತಿದೆ; ಹೀಗಾಗಿ ಎಲ್ಲರಿಗೂ ಆಹಾರ ಸಿಗುವುದು ಕಷ್ಟವಾಗುತ್ತಿದೆ.`],
[`ಶಾಲೆಯಲ್ಲಿ ಬಿಸಿಯೂಟ ಮತ್ತು ಹಾಲು ನೀಡುವುದರಿಂದ ಆಗುವ ಅನುಕೂಲಗಳೇನು?`,`ಮಕ್ಕಳಿಗೆ ಪೌಷ್ಟಿಕ ಆಹಾರ ಸಿಗುತ್ತದೆ, ಹಸಿವಿಲ್ಲದೆ ಓದಲು ಸಾಧ್ಯವಾಗುತ್ತದೆ, ಶಾಲೆಗೆ ಹಾಜರಾತಿ ಹೆಚ್ಚುತ್ತದೆ, ಆರೋಗ್ಯ ಚೆನ್ನಾಗಿರುತ್ತದೆ (ಮಾದರಿ).`],
[`ಜಂಕ್ ಫುಡ್ ಆರೋಗ್ಯಕ್ಕೆ ಒಳ್ಳೆಯದಲ್ಲ. ಏಕೆ?`,`ಅದರಲ್ಲಿ ಪೌಷ್ಟಿಕಾಂಶ ಕಡಿಮೆ ಮತ್ತು ರಾಸಾಯನಿಕಗಳು, ಎಣ್ಣೆ, ಉಪ್ಪು, ಸಕ್ಕರೆ ಹೆಚ್ಚಿರುತ್ತವೆ; ಇದರಿಂದ ಬೊಜ್ಜು ಹಾಗೂ ರೋಗಗಳು ಬರುತ್ತವೆ.`],
[`ಫಾಸ್ಟ್ ಫುಡ್ ಎಂದರೇನು?`,`ನಗರಗಳ ಯಾಂತ್ರಿಕ ಜೀವನದಲ್ಲಿ ಬೇಗನೆ ಸಿದ್ಧಪಡಿಸಿ ಅಥವಾ ಸಿದ್ಧಪಡಿಸಿ ಇಟ್ಟು ನೀಡುವ ಆಹಾರ (ಉದಾ: ಪಿಜ್ಜಾ, ಬರ್ಗರ್, ನೂಡಲ್ಸ್).`],
[`ಅವಧಿ ಮುಗಿದ ಅಥವಾ ಹೆಚ್ಚು ರಾಸಾಯನಿಕ ಸೇರಿಸಿದ ಆಹಾರ ಸೇವನೆ ಅಪಾಯಕಾರಿ. ಏಕೆ?`,`ಅವು ಕೆಟ್ಟುಹೋಗಿರುವ ಸಾಧ್ಯತೆ ಇರುತ್ತದೆ; ವಿಷಯುಕ್ತವಾಗಿ ಅನಾರೋಗ್ಯ ಉಂಟುಮಾಡುತ್ತವೆ.`]]],
[`ಚಟುವಟಿಕೆ`,[
[`ಸಸ್ಯಮೂಲ ಮತ್ತು ಪ್ರಾಣಿಮೂಲ ಆಹಾರ ವಿಂಗಡಿಸು: ಅಕ್ಕಿ, ನವಣೆ, ಮಾಂಸ, ಸಜ್ಜೆ, ಮಾವು, ಗಿಣ್ಣು, ರಾಗಿ, ತುಪ್ಪ, ಮೊಟ್ಟೆ, ಹೂಕೋಸು, ಹಾಲು, ಮೆಂತ್ಯ, ಕ್ಯಾರೆಟ್, ಮಜ್ಜಿಗೆ, ಮೂಲಂಗಿ`,`ಸಸ್ಯಮೂಲ: ಅಕ್ಕಿ, ನವಣೆ, ಸಜ್ಜೆ, ಮಾವು, ರಾಗಿ, ಹೂಕೋಸು, ಮೆಂತ್ಯ, ಕ್ಯಾರೆಟ್, ಮೂಲಂಗಿ. ಪ್ರಾಣಿಮೂಲ: ಮಾಂಸ, ಗಿಣ್ಣು, ತುಪ್ಪ, ಮೊಟ್ಟೆ, ಹಾಲು, ಮಜ್ಜಿಗೆ.`],
[`ಸಿರಿಧಾನ್ಯಗಳನ್ನು ಹೆಸರಿಸು`,`ನವಣೆ, ಊದಲು, ಆರ್ಕ, ರಾಗಿ, ಸಾಮೆ, ಸಜ್ಜೆ, ಕೊರಲೆ (ಚಿತ್ರದಲ್ಲಿರುವಂತೆ ⚠ ಪಠ್ಯಪುಸ್ತಕ ನೋಡಿ ದೃಢಪಡಿಸಿ).`],
[`ಆಹಾರವನ್ನು ಕೆಡದಂತೆ ಸಂರಕ್ಷಿಸುವ ವಿಧಾನಗಳನ್ನು ಬರೆ`,`ಉಪ್ಪು ಹಾಕುವುದು (ಉಪ್ಪಿನಕಾಯಿ), ಸಕ್ಕರೆ ಬಳಸುವುದು (ಹಣ್ಣುಗಳು), ಒಣಗಿಸುವುದು (ಒಣದ್ರಾಕ್ಷಿ), ಶೀತಕ ಸಂಗ್ರಹಣೆ (ಫ್ರಿಡ್ಜ್ನಲ್ಲಿ ಮೀನು, ಮಾಂಸ, ಹಾಲು).`],
[`ಪ್ಯಾಕೆಟ್ ಆಹಾರ ಕೊಳ್ಳುವಾಗ ಗಮನಿಸಬೇಕಾದ ಅಂಶಗಳು`,`ತಯಾರಾದ ದಿನಾಂಕ ಮತ್ತು ಅವಧಿ ಮುಗಿಯುವ ದಿನಾಂಕ, ಸೇರಿಸಿದ ಇತರ ಪದಾರ್ಥಗಳು (ಇನ್ಗ್ರೇಡಿಯೆಂಟ್ಸ್), ರಾಸಾಯನಿಕ ಪ್ರಮಾಣ, ಸಂರಕ್ಷಿಸಲು ಬೇಕಾದ ಉಷ್ಣತೆ.`],
[`ನಿನ್ನ ಜಿಲ್ಲೆಯ/ಊರಿನ ಮುಖ್ಯ ಆಹಾರ ಯಾವುದು? (ಮಾದರಿ)`,`ವಿದ್ಯಾರ್ಥಿಯ ಸ್ವಂತ ಉತ್ತರ. ಉದಾ: ಉತ್ತರ ಕರ್ನಾಟಕ – ಜೋಳದ ರೊಟ್ಟಿ; ದಕ್ಷಿಣ ಕರ್ನಾಟಕ – ರಾಗಿ ಮುದ್ದೆ; ಕರಾವಳಿ – ಅನ್ನ, ಮೀನು ಸಾರು; ಮಲೆನಾಡು – ಅಕ್ಕಿ ಹಾಗೂ ತೆಂಗಿನ ಪದಾರ್ಥಗಳು.`],
[`ಕರ್ನಾಟಕದ ವಿವಿಧ ಪ್ರದೇಶಗಳ ಆಹಾರ ಬೇರೆ ಬೇರೆಯಾಗಿರಲು ಕಾರಣಗಳು`,`ವಾಯುಗುಣ ಬೇರೆ; ಬೆಳೆಯುವ ಬೆಳೆಗಳು ಬೇರೆ; ಕುಟುಂಬದ ಸಂಪ್ರದಾಯ/ನಂಬಿಕೆಗಳು ಬೇರೆ (ಮಾದರಿ).`]]]
],
qb:[
M(`ಆಹಾರ ನಮಗೆ ಏನನ್ನು ನೀಡುತ್ತದೆ?`,[`ಶಕ್ತಿ`,`ಹಣ`,`ಬಟ್ಟೆ`,`ಮನೆ`],0),
M(`ಸಿರಿಧಾನ್ಯಕ್ಕೆ ಉದಾಹರಣೆ:`,[`ನವಣೆ`,`ಕ್ಯಾರೆಟ್`,`ಮಾವು`,`ಹಾಲು`],0),
M(`ಪ್ರಾಣಿ ಮೂಲದ ಆಹಾರ ಪದಾರ್ಥ:`,[`ರಾಗಿ`,`ಮೊಟ್ಟೆ`,`ಮೂಲಂಗಿ`,`ಮಾವು`],1),
M(`ಜೋಳ, ರಾಗಿ, ಗೋಧಿ – ಇವು ಯಾವ ಬಗೆಯ ಧಾನ್ಯಗಳು?`,[`ದ್ವಿದಳ ಧಾನ್ಯ`,`ಏಕದಳ ಧಾನ್ಯ`,`ಎಣ್ಣೆಬೀಜ`,`ಸೊಪ್ಪು`],1),
M(`ಅತಿ ಕಡಿಮೆ ಉಷ್ಣತೆಯಲ್ಲಿ ಆಹಾರ ಸಂಗ್ರಹಿಸುವ ವಿಧಾನ:`,[`ಒಣಗಿಸುವುದು`,`ಶೀತಕ ಸಂಗ್ರಹಣೆ`,`ಉಪ್ಪು ಹಾಕುವುದು`,`ಸಕ್ಕರೆ ಬೆರೆಸುವುದು`],1),
M(`ಜಂಕ್ ಫುಡ್ಗೆ ಉದಾಹರಣೆ:`,[`ರಾಗಿ ಮುದ್ದೆ`,`ಪಿಜ್ಜಾ`,`ಹೆಸರುಕಾಳು`,`ಮಜ್ಜಿಗೆ`],1),
M(`ಶಾಲೆಗಳಲ್ಲಿ ಮಕ್ಕಳಿಗೆ ನೀಡುವ ಆಹಾರ:`,[`ಬಿಸಿಯೂಟ ಮತ್ತು ಹಾಲು`,`ಪಿಜ್ಜಾ`,`ಐಸ್ಕ್ರೀಂ`,`ಚಾಕ್ಲೇಟ್`],0,'m'),
M(`ಸಿರಿಧಾನ್ಯಗಳನ್ನು ಹೀಗೆ ಕರೆಯುತ್ತಾರೆ:`,[`ಬರಗಾಲದ ಮಿತ್ರರು`,`ಮಳೆಗಾಲದ ಶತ್ರುಗಳು`,`ರಾಸಾಯನಿಕ ಧಾನ್ಯ`,`ಜಂಕ್ ಧಾನ್ಯ`],0,'m'),
O(`ಆಹಾರದಲ್ಲಿರುವ ಯಾವುದಾದರೂ ಎರಡು ಪೋಷಕಾಂಶಗಳನ್ನು ಹೆಸರಿಸಿ.`,`ಕಾರ್ಬೋಹೈಡ್ರೇಟ್ಸ್ ಮತ್ತು ಪ್ರೋಟೀನ್ (ಲಿಪಿಡ್, ವಿಟಮಿನ್, ಖನಿಜ ಲವಣ, ನೀರು).`),
O(`ಸಸ್ಯಮೂಲದ ಆಹಾರ ಪದಾರ್ಥಗಳ ಯಾವುದಾದರೂ ಎರಡು ಗುಂಪುಗಳನ್ನು ಹೆಸರಿಸಿ.`,`ಏಕದಳ ಧಾನ್ಯಗಳು ಮತ್ತು ದ್ವಿದಳ ಧಾನ್ಯಗಳು (ತರಕಾರಿ, ಹಣ್ಣು, ಸೊಪ್ಪು, ಎಣ್ಣೆಬೀಜ).`),
O(`ಬೇಳೆಕಾಳುಗಳಿಗೆ ಇನ್ನೊಂದು ಹೆಸರೇನು?`,`ದ್ವಿದಳ ಧಾನ್ಯಗಳು.`),
O(`ಜಂಕ್ ಫುಡ್ ಎಂದರೇನು?`,`ಆರೋಗ್ಯಕ್ಕೆ ಅನುಪಯುಕ್ತವಾದ ಅಥವಾ ಕಡಿಮೆ ಪೌಷ್ಟಿಕಾಂಶ ಹೊಂದಿರುವ ಆಹಾರ ಪದಾರ್ಥ.`),
O(`ಆಹಾರ ಪೋಲಾಗುವಿಕೆ ಎಂದರೇನು?`,`ಸೇವಿಸಲು ಯೋಗ್ಯವಾದ ಆಹಾರವನ್ನು ಸೇವಿಸದೆ ಎಲ್ಲೆಂದರಲ್ಲಿ ಚೆಲ್ಲುವುದು.`,'m'),
O(`ಅತಿ ಕಡಿಮೆ ಬೆಲೆಯಲ್ಲಿ ಆಹಾರ ಪದಾರ್ಥ ನೀಡುವ ಅಂಗಡಿ ಯಾವುದು?`,`ನ್ಯಾಯಬೆಲೆ ಅಂಗಡಿ (ಪಡಿತರ ಅಂಗಡಿ).`),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ಆಹಾರ ನಮ್ಮ ಬದುಕಿನ ______.`,`ಜೀವಾಳ`),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ಹೆಸರುಕಾಳು, ತೊಗರಿ, ಅಲಸಂದೆ ಇವು ______ ಧಾನ್ಯಗಳು.`,`ದ್ವಿದಳ`),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ಉಪ್ಪಿನಕಾಯಿ ಕೆಡದಿರಲು ಅದಕ್ಕೆ ______ ಹಾಕುತ್ತಾರೆ.`,`ಉಪ್ಪು`),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ಹಣ್ಣುಗಳನ್ನು ಸಂರಕ್ಷಿಸಲು ______ ಬಳಸುತ್ತಾರೆ.`,`ಸಕ್ಕರೆ`),
G(`ಹೊಂದಿಸಿ ಬರೆಯಿರಿ: ದ್ರಾಕ್ಷಿಯನ್ನು ಒಣಗಿಸಿದರೆ ಸಿಗುವುದು –`,`ಒಣದ್ರಾಕ್ಷಿ`),
G(`ಸಸ್ಯಮೂಲವೋ ಪ್ರಾಣಿಮೂಲವೋ ತಿಳಿಸಿ: ತುಪ್ಪ`,`ಪ್ರಾಣಿ ಮೂಲ`,'e'),
G(`ಗುಂಪಿಗೆ ಸೇರದ ಪದ: ರಾಗಿ, ಜೋಳ, ಗೋಧಿ, ಮೊಟ್ಟೆ`,`ಮೊಟ್ಟೆ (ಉಳಿದವು ಏಕದಳ ಧಾನ್ಯಗಳು)`),
S(`ಸಿರಿಧಾನ್ಯಗಳ ಯಾವುದಾದರೂ ಮೂರು ಉಪಯೋಗಗಳನ್ನು ಬರೆಯಿರಿ.`,`ಕಡಿಮೆ ನೀರಿನಿಂದ ಕಡಿಮೆ ಅವಧಿಯಲ್ಲಿ ಬೆಳೆಯಬಹುದು; ರಾಸಾಯನಿಕ ಗೊಬ್ಬರ, ಕೀಟನಾಶಕ ಇಲ್ಲದೆ ಬೆಳೆಯಬಹುದು; ಹೆಚ್ಚು ಪೋಷಕಾಂಶಗಳುಳ್ಳವು; ಬರಗಾಲದ ಮಿತ್ರರು.`),
S(`ಜನರಿಗೆ ಆಹಾರ ಲಭ್ಯವಾಗಲು ಸರ್ಕಾರ ಕೈಗೊಂಡಿರುವ ಯಾವುದಾದರೂ ಎರಡು ಕ್ರಮಗಳನ್ನು ಬರೆಯಿರಿ.`,`ಶಾಲೆಯಲ್ಲಿ ಬಿಸಿಯೂಟ ಮತ್ತು ಹಾಲು ನೀಡುವುದು; ನ್ಯಾಯಬೆಲೆ ಅಂಗಡಿಗಳ ಮೂಲಕ ಕಡಿಮೆ ಬೆಲೆಗೆ ಆಹಾರ ಪೂರೈಸುವುದು; ವ್ಯಾಪಾರಿಗಳು ಹೆಚ್ಚು ಸಂಗ್ರಹಿಸದಂತೆ ನಿಯಂತ್ರಣ; ರೈತರ ಆಹಾರ ಖರೀದಿಸಿ ಗೋದಾಮಿನಲ್ಲಿಟ್ಟು ವಿತರಿಸುವುದು.`),
S(`ನಮ್ಮ ಆಹಾರ ಪದ್ಧತಿಯನ್ನು ನಿರ್ಧರಿಸುವ ಅಂಶಗಳು ಯಾವುವು?`,`ವಾಸಿಸುವ ಪ್ರದೇಶದಲ್ಲಿ ದೊರೆಯುವ ಆಹಾರ ಪದಾರ್ಥಗಳು ಮತ್ತು ವಾಯುಗುಣ; ಕುಟುಂಬದ ಸಂಪ್ರದಾಯ ಹಾಗೂ ನಂಬಿಕೆಗಳು; ಬೇಸಿಗೆ, ಮಳೆ ಮತ್ತು ಚಳಿಗಾಲದ ಕಾಲ.`),
S(`ಬದಲಾದ ಆಹಾರ ಅಭ್ಯಾಸದ ಪರಿಣಾಮಗಳನ್ನು ಬರೆಯಿರಿ.`,`ಜನರು ಬೇಗ ರೋಗಗಳಿಗೆ ತುತ್ತಾಗುತ್ತಿದ್ದಾರೆ; ರುಚಿಕರ ಆಹಾರದಿಂದ ದೇಹಕ್ಕೆ ವಿಷಯುಕ್ತ ರಾಸಾಯನಿಕಗಳು ಸೇರುತ್ತಿವೆ; ರೋಗ ನಿರೋಧಕ ಶಕ್ತಿ ಕಡಿಮೆಯಾಗುತ್ತಿದೆ; ಬೊಜ್ಜು ಸಮಸ್ಯೆ ಉಂಟಾಗಿದೆ.`),
L(`ಆಹಾರವನ್ನು ಕೆಡದಂತೆ ಸಂರಕ್ಷಿಸುವ ವಿಧಾನಗಳನ್ನು ಉದಾಹರಣೆಗಳೊಂದಿಗೆ ವಿವರಿಸಿ.`,`ಆಹಾರ ಪೋಲಾಗದಂತೆ ಮತ್ತು ಕೆಡದಂತೆ ಕಾಪಾಡುವುದು ಮುಖ್ಯ. ಉಪ್ಪಿನಕಾಯಿ ಕೆಡದಿರಲು ಉಪ್ಪು ಹಾಕುತ್ತಾರೆ. ತಾಜಾ ಹಣ್ಣುಗಳನ್ನು ಸಂರಕ್ಷಿಸಲು ಸಕ್ಕರೆ ಬಳಸುತ್ತಾರೆ. ದ್ರಾಕ್ಷಿಯನ್ನು ಒಣಗಿಸಿ ಒಣದ್ರಾಕ್ಷಿ ಮಾಡುತ್ತಾರೆ. ಮೀನು, ಮಾಂಸ ಮತ್ತು ಹಾಲನ್ನು ಅತಿ ಕಡಿಮೆ ಉಷ್ಣತೆಯಲ್ಲಿ (ರೆಫ್ರಿಜರೇಟರ್/ಫ್ರಿಡ್ಜ್ನಲ್ಲಿ) ಇಡುವುದನ್ನು ಶೀತಕ ಸಂಗ್ರಹಣೆ ಎನ್ನುತ್ತಾರೆ.`),
L(`ಬದಲಾಗುತ್ತಿರುವ ಆಹಾರ ಅಭ್ಯಾಸಗಳಿಗೆ ಕಾರಣಗಳು ಮತ್ತು ಅವುಗಳ ಪರಿಣಾಮಗಳನ್ನು ವಿವರಿಸಿ.`,`ಪತ್ರಿಕೆ, ಜಾಹೀರಾತು, ಟಿ.ವಿ./ರೇಡಿಯೋ ಅಡುಗೆ ಕಾರ್ಯಕ್ರಮಗಳು, ಮೊಬೈಲ್ ಹಾಗೂ ಇಂಟರ್ನೆಟ್ ಬಳಕೆ ಮತ್ತು ಅಡುಗೆ ಪುಸ್ತಕಗಳ ಪ್ರಭಾವದಿಂದ ನಮ್ಮ ಆಹಾರ ಅಭ್ಯಾಸಗಳು ಬದಲಾಗಿವೆ. ಮನೆ ಊಟದ ಬದಲು ಪಿಜ್ಜಾ, ಬರ್ಗರ್, ನೂಡಲ್ಸ್ ಮುಂತಾದ ಜಂಕ್ ಫುಡ್, ಫಾಸ್ಟ್ ಫುಡ್ ಸೇವನೆ ಹೆಚ್ಚಿದೆ. ಇದರಿಂದ ಬೊಜ್ಜು ಬರುತ್ತಿದೆ, ರೋಗ ನಿರೋಧಕ ಶಕ್ತಿ ಕಡಿಮೆಯಾಗುತ್ತಿದೆ ಮತ್ತು ಜನರು ಬೇಗನೆ ರೋಗಗಳಿಗೆ ತುತ್ತಾಗುತ್ತಿದ್ದಾರೆ.`)
]});

LSV5.push({n:10,t:`ಜನವಸತಿಗಳು`,au:`ವಸತಿ ಮತ್ತು ಸಮುದಾಯ`,pg:14,
words:`ವಸತಿ – ವಾಸಿಸುವ ಸ್ಥಳ, ಮನೆ; ಜನವಸತಿ – ಅನೇಕ ಕುಟುಂಬಗಳು ಒಂದೆಡೆ ವಾಸಿಸುವ ಪ್ರದೇಶ; ವೈಯಕ್ತಿಕ ವಸತಿ – ಒಂದು ಕುಟುಂಬ ತನ್ನದೇ ಕಟ್ಟಿಕೊಂಡ ಮನೆ; ಸಾಮೂಹಿಕ ವಸತಿ – ಹಲವು ಕುಟುಂಬಗಳಿಗೆ ಒಟ್ಟಾಗಿ ಯೋಜನಾಬದ್ಧವಾಗಿ ನಿರ್ಮಿಸಿದ ವಸತಿ; ಒಳಚರಂಡಿ – ಕೊಳಕು ನೀರು ಹೋಗುವ ಭೂಗತ ವ್ಯವಸ್ಥೆ; ವಿಲೇವಾರಿ – ಕಸವನ್ನು ಸರಿಯಾಗಿ ತೆಗೆದುಹಾಕುವುದು; ತ್ಯಾಜ್ಯ – ಕಸ; ಅಗ್ನಿ ದುರಂತ – ಬೆಂಕಿ ಅಪಘಾತ; ಮಳೆ ಕೊಯ್ಲು – ಮಳೆ ನೀರು ಸಂಗ್ರಹಿಸುವ ವಿಧಾನ; ಸಮರ್ಪಕ – ಸರಿಯಾದ; ಗ್ರಾಮೀಣ – ಹಳ್ಳಿಗೆ ಸಂಬಂಧಿಸಿದ`,
notes:`ಆದಿ ಮಾನವರು ಗುಹೆ ಮತ್ತು ಮರದ ಪೊಟರೆಗಳನ್ನು ಆಶ್ರಯಿಸಿ ಬಿಸಿಲು, ಮಳೆ, ಗಾಳಿ, ಕಾಡುಪ್ರಾಣಿಗಳಿಂದ ರಕ್ಷಣೆ ಪಡೆಯುತ್ತಿದ್ದರು – ಇವು ಮಾನವನ ಮೊದಲ ವಸತಿಗಳು. ಒಂದೆಡೆ ನೆಲೆ ನಿಂತಾಗ ಮನೆಯ ಅಗತ್ಯ ಹೆಚ್ಚಾಯಿತು. ವೈಯಕ್ತಿಕ ವಸತಿ ಸಾಮೂಹಿಕ ವಸತಿಯಾಗಿ ಬದಲಾಯಿತು. ಸಾಮೂಹಿಕ ವಸತಿಗಳಲ್ಲಿ ರಸ್ತೆ, ದೀಪ, ನೀರು, ಕಸ ವಿಲೇವಾರಿ, ಉದ್ಯಾನ, ಆಸ್ಪತ್ರೆ ಮುಂತಾದ ಸೌಲಭ್ಯಗಳನ್ನು ಯೋಜನಾಬದ್ಧವಾಗಿ ನೀಡಲಾಗುತ್ತದೆ. ನಗರ ಹಾಗೂ ಗ್ರಾಮೀಣ ಪ್ರದೇಶಗಳಲ್ಲಿ ವಸತಿ ಸಮಸ್ಯೆಗಳಿವೆ. ಉತ್ತಮ ವಸತಿಯಲ್ಲಿ ಗಾಳಿ–ಬೆಳಕು, ಮಳೆ ನೀರು ಸಂಗ್ರಹ, ಸೌರಶಕ್ತಿ, ಮುಚ್ಚಿದ ಒಳಚರಂಡಿ, ಕಸದಿಂದ ಗೊಬ್ಬರ ತಯಾರಿಕೆ ಇರುತ್ತವೆ.`,
ab:[
[`ಮನೆ ಮತ್ತು ವಸತಿ – ಯೋಚಿಸಿ ಬರೆ`,[
[`ಮನೆ ಕಟ್ಟಲು ಬೇಕಾದ ಸಾಮಗ್ರಿಗಳನ್ನು ಬರೆ (ಗುಡಿಸಲು, ಹೆಂಚಿನ ಮನೆ, ಕಾಂಕ್ರೀಟ್ ಮನೆ)`,`ಗುಡಿಸಲು – ಬಿದಿರು, ಹುಲ್ಲು, ಮಣ್ಣು, ತಟ್ಟೆ; ಹೆಂಚಿನ ಮನೆ – ಇಟ್ಟಿಗೆ, ಮಣ್ಣು, ಮರ, ಹೆಂಚು; ಕಾಂಕ್ರೀಟ್ ಮನೆ – ಸಿಮೆಂಟ್, ಮರಳು, ಜಲ್ಲಿ, ಕಬ್ಬಿಣದ ಸರಳು, ಇಟ್ಟಿಗೆ (ಮಾದರಿ).`],
[`ಜನವಸತಿಗಳೆಂದರೇನು?`,`ಹಳ್ಳಿ ಅಥವಾ ನಗರಗಳಲ್ಲಿ ಅನೇಕ ಕುಟುಂಬಗಳು ಅಕ್ಕಪಕ್ಕದಲ್ಲಿ ಮನೆ ಕಟ್ಟಿಕೊಂಡು ಒಂದೆಡೆ ವಾಸಿಸುವುದು.`]]],
[`ಸಾಮೂಹಿಕ ವಸತಿಗಳ ಬಗ್ಗೆ ಸರಿಯಾದ ಕಾರಣಗಳಿಗೆ ✓ ಗುರುತಿಸು`,[
[`ಸಾಮೂಹಿಕ ವಸತಿಗಳಲ್ಲಿ ಹಲವು ಕುಟುಂಬಗಳು ಒಂದೆಡೆ ವಾಸಿಸುತ್ತವೆ.`,`ಸರಿ (✓)`],
[`ಹಣದ ಸೌಲಭ್ಯ ಕಡಿಮೆ ಇರುವ ಬಡ ಕುಟುಂಬಗಳಿಗೆ ಸರ್ಕಾರವೇ ಸಾಮೂಹಿಕ ವಸತಿ ನಿರ್ಮಿಸಿ ನೀಡುತ್ತದೆ.`,`ಸರಿ (✓)`],
[`ಕಡಿಮೆ ಭೂಮಿಯಲ್ಲಿ ಹೆಚ್ಚು ಜನಸಂಖ್ಯೆಗೆ ವ್ಯವಸ್ಥಿತ ಮೂಲ ಸೌಲಭ್ಯ ನೀಡಲು ನಿರ್ಮಿಸಲಾಗುತ್ತದೆ.`,`ಸರಿ (✓)`],
[`ಬಹುಮಹಡಿ ವಸತಿ ಕಟ್ಟಡಗಳನ್ನು ಕೇವಲ ಒಂದೇ ಕುಟುಂಬ ವಾಸಿಸುವಂತೆ ನಿರ್ಮಿಸಲಾಗುತ್ತದೆ.`,`ತಪ್ಪು (✗) – ಅವು ಹಲವು ಕುಟುಂಬಗಳಿಗಾಗಿ ನಿರ್ಮಿತವಾಗುತ್ತವೆ.`]]],
[`ಸಾಮೂಹಿಕ ವಸತಿಗಳ ಸೌಲಭ್ಯಗಳು ಮತ್ತು ಸಮಸ್ಯೆಗಳು`,[
[`ಸಾಮೂಹಿಕ ವಸತಿಗಳಲ್ಲಿ ಸಿಗುವ ಸೌಲಭ್ಯಗಳು`,`ಉತ್ತಮ ರಸ್ತೆ, ಸಂಚಾರ ವ್ಯವಸ್ಥೆ, ದೀಪ, ನೀರು, ಕಸ ವಿಲೇವಾರಿ, ಉದ್ಯಾನ, ಆಸ್ಪತ್ರೆ, ಮುಖ್ಯ ರಸ್ತೆಗೆ ಸಂಪರ್ಕ.`],
[`ವೈಯಕ್ತಿಕ ಕುಟುಂಬಗಳಿಗೆ ಸಾಮೂಹಿಕ ವಸತಿಯಲ್ಲಿರುವ ಸೌಲಭ್ಯಗಳನ್ನು ನಿರ್ಮಿಸಲು ಸಾಧ್ಯವೇ?`,`ಕಷ್ಟ. ಉದ್ಯಾನ, ಆಸ್ಪತ್ರೆ, ಉತ್ತಮ ರಸ್ತೆ ಮುಂತಾದವನ್ನು ಒಂದು ಕುಟುಂಬ ಸ್ವತಃ ಮಾಡಿಕೊಳ್ಳಲಾಗದು; ಎಲ್ಲರೂ ಸೇರಿ ಅಥವಾ ಸರ್ಕಾರ ಮಾಡಬೇಕು.`],
[`ನಗರ ಪ್ರದೇಶದ ವಸತಿ ಸಮಸ್ಯೆಗಳು`,`ಸಮರ್ಪಕ ಒಳಚರಂಡಿ ಇಲ್ಲದಿರುವುದು; ಕಸ/ತ್ಯಾಜ್ಯ ವಿಲೇವಾರಿ ಸಮಸ್ಯೆ; ಬಹುಮಹಡಿ ಕಟ್ಟಡಗಳಲ್ಲಿ ಅಗ್ನಿ ದುರಂತಗಳು.`],
[`ಗ್ರಾಮೀಣ ಪ್ರದೇಶದ ವಸತಿ ಸಮಸ್ಯೆಗಳು`,`ಸ್ನಾನಗೃಹ, ಶೌಚಾಲಯ ಇಲ್ಲದಿರುವುದು; ವಿದ್ಯುತ್ ಸೌಲಭ್ಯ ಇಲ್ಲದಿರುವುದು; ಶುದ್ಧ ಕುಡಿಯುವ ನೀರು ಇಲ್ಲದಿರುವುದು; ವಾಹನ ಸಂಚಾರಕ್ಕೆ ಸೂಕ್ತವಲ್ಲದ ಬೀದಿಗಳು; ಒಳಚರಂಡಿ ಇಲ್ಲದಿರುವುದು.`],
[`ಉತ್ತಮ ವಸತಿಯ ಲಕ್ಷಣಗಳು`,`ಗಾಳಿ–ಬೆಳಕು ಯಥೇಚ್ಛವಾಗಿ ಬರುವುದು; ಮೇಲ್ಛಾವಣಿಯಲ್ಲಿ ಮಳೆ ನೀರು ಸಂಗ್ರಹ; ಸೌರಶಕ್ತಿಯಿಂದ ವಿದ್ಯುತ್; ಮುಚ್ಚಿದ ಒಳಚರಂಡಿ; ಕಸ ವಿಲೇವಾರಿ ಮತ್ತು ಕಸದಿಂದ ಗೊಬ್ಬರ ತಯಾರಿಕೆ.`]]]
],
qb:[
M(`ಮಾನವನ ಮೊದಲ ವಸತಿಗಳು:`,[`ಗುಹೆ ಮತ್ತು ಮರದ ಪೊಟರೆ`,`ಬಹುಮಹಡಿ ಕಟ್ಟಡ`,`ಹೆಂಚಿನ ಮನೆ`,`ಅರಮನೆ`],0),
M(`ಅನೇಕ ಕುಟುಂಬಗಳು ಒಂದೆಡೆ ವಾಸಿಸುವ ಪ್ರದೇಶ:`,[`ಜನವಸತಿ`,`ಕಾಡು`,`ಹೊಲ`,`ಗುಹೆ`],0),
M(`ಸಾಮೂಹಿಕ ವಸತಿ ಎಂದರೆ:`,[`ಒಂದೇ ಕುಟುಂಬದ ಮನೆ`,`ಹಲವು ಕುಟುಂಬಗಳಿಗೆ ಯೋಜಿತ ವಸತಿ`,`ಗುಹೆ`,`ಗುಡಿಸಲು`],1),
M(`ಗ್ರಾಮೀಣ ವಸತಿ ಸಮಸ್ಯೆ:`,[`ಬಹುಮಹಡಿ ಬೆಂಕಿ`,`ಶೌಚಾಲಯ ಇಲ್ಲದಿರುವುದು`,`ಸೌರಶಕ್ತಿ`,`ಮಳೆ ಕೊಯ್ಲು`],1),
M(`ನಗರ ವಸತಿ ಸಮಸ್ಯೆ:`,[`ಕಸ ವಿಲೇವಾರಿ ಸಮಸ್ಯೆ`,`ಹೊಲ ಇಲ್ಲದಿರುವುದು`,`ಹಸು ಇಲ್ಲದಿರುವುದು`,`ಮರ ಇಲ್ಲದಿರುವುದು`],0),
M(`ಉತ್ತಮ ವಸತಿಯ ಲಕ್ಷಣ:`,[`ಗಾಳಿ–ಬೆಳಕು ಬರುವಂತಿರುವುದು`,`ತೆರೆದ ಚರಂಡಿ`,`ಕಸದ ರಾಶಿ`,`ಇಕ್ಕಟ್ಟಾದ ಬೀದಿ`],0),
M(`ನಗರಗಳಲ್ಲಿ ವಸತಿ ನಿರ್ಮಾಣಕ್ಕಾಗಿ ಸರ್ಕಾರ ರಚಿಸಿರುವುದು:`,[`ಮಂಡಳಿಗಳು`,`ಶಾಲೆಗಳು`,`ಗೋದಾಮುಗಳು`,`ಕಾಡುಗಳು`],0,'m'),
O(`ಮಾನವನ ಮೊದಲ ವಸತಿಗಳು ಯಾವುವು?`,`ಗುಹೆ ಮತ್ತು ಮರದ ಪೊಟರೆಗಳು.`),
O(`ಜನವಸತಿಗಳೆಂದರೇನು?`,`ಅನೇಕ ಕುಟುಂಬಗಳು ಅಕ್ಕಪಕ್ಕದಲ್ಲಿ ಮನೆ ಕಟ್ಟಿಕೊಂಡು ಒಂದೆಡೆ ವಾಸಿಸುವ ಪ್ರದೇಶ.`),
O(`ಸಾಮೂಹಿಕ ವಸತಿಗೆ ಒಂದು ಉದಾಹರಣೆ ಬರೆಯಿರಿ.`,`ಬಹುಮಹಡಿ ವಸತಿ ಕಟ್ಟಡಗಳು (ಅಪಾರ್ಟ್ಮೆಂಟ್).`),
O(`ಹಳ್ಳಿಗಳಲ್ಲಿ ಸಾಮೂಹಿಕ ವಸತಿಗಳನ್ನು ಯಾರು ನಿರ್ಮಿಸುತ್ತಾರೆ?`,`ಸರ್ಕಾರ.`),
O(`ಮಳೆ ನೀರು ಸಂಗ್ರಹ ಎಲ್ಲಿ ಮಾಡಬೇಕು?`,`ಮನೆಯ ಮೇಲ್ಛಾವಣಿಯಲ್ಲಿ.`,'m'),
O(`ಕಸದಿಂದ ಏನು ತಯಾರಿಸಬಹುದು?`,`ಗೊಬ್ಬರ.`),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ಆದಿ ಮಾನವರು ______ ಮತ್ತು ಮರದ ಪೊಟರೆಗಳಲ್ಲಿ ವಾಸಿಸುತ್ತಿದ್ದರು.`,`ಗುಹೆ`),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ವೈಯಕ್ತಿಕ ವಸತಿ ನಿರ್ಮಾಣವು ______ ವಸತಿಯಾಗಿ ಬದಲಾಯಿತು.`,`ಸಾಮೂಹಿಕ`),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ಮನೆಯೇ ಮೊದಲ ______.`,`ಪಾಠಶಾಲೆ`),
G(`ಹೊಂದಿಸಿ: ಹಳ್ಳಿ ವಸತಿ ಸಮಸ್ಯೆ –`,`ಶುದ್ಧ ಕುಡಿಯುವ ನೀರಿನ ಕೊರತೆ`),
G(`ಹೊಂದಿಸಿ: ನಗರ ವಸತಿ ಸಮಸ್ಯೆ –`,`ಅಗ್ನಿ ದುರಂತ / ತ್ಯಾಜ್ಯ ವಿಲೇವಾರಿ`),
G(`ಸರಿ/ತಪ್ಪು ತಿಳಿಸಿ: ಬಹುಮಹಡಿ ಕಟ್ಟಡಗಳನ್ನು ಒಂದೇ ಕುಟುಂಬಕ್ಕಾಗಿ ಕಟ್ಟುತ್ತಾರೆ.`,`ತಪ್ಪು`,'e'),
S(`ಸಾಮೂಹಿಕ ವಸತಿಗಳ ಮುಖ್ಯ ಉದ್ದೇಶಗಳನ್ನು ಬರೆಯಿರಿ.`,`ಎಲ್ಲಾ ಮನೆಗಳಿಗೆ ಉತ್ತಮ ರಸ್ತೆ, ದೀಪ, ನೀರು, ಕಸ ವಿಲೇವಾರಿ ಯೋಜನಾಬದ್ಧವಾಗಿ ನೀಡುವುದು; ಉದ್ಯಾನ, ಆಸ್ಪತ್ರೆ ನಿರ್ಮಿಸುವುದು; ಮುಖ್ಯ ರಸ್ತೆಗೆ ಸೇರಿಸುವುದು; ಕಡಿಮೆ ಭೂಮಿಯಲ್ಲಿ ಹೆಚ್ಚು ಜನರಿಗೆ ವಸತಿ ನೀಡುವುದು.`),
S(`ಗ್ರಾಮೀಣ ಪ್ರದೇಶದ ಯಾವುದಾದರೂ ಮೂರು ವಸತಿ ಸಮಸ್ಯೆಗಳನ್ನು ಬರೆಯಿರಿ.`,`ಶೌಚಾಲಯ ಮತ್ತು ಸ್ನಾನಗೃಹ ಇಲ್ಲದಿರುವುದು, ವಿದ್ಯುತ್ ಇಲ್ಲದಿರುವುದು, ಶುದ್ಧ ಕುಡಿಯುವ ನೀರಿಲ್ಲದಿರುವುದು.`),
S(`ನಗರ ಪ್ರದೇಶದ ವಸತಿ ಸಮಸ್ಯೆಗಳನ್ನು ಬರೆಯಿರಿ.`,`ಸಮರ್ಪಕ ಒಳಚರಂಡಿ ಇಲ್ಲದಿರುವುದು, ಕಸ/ತ್ಯಾಜ್ಯ ವಿಲೇವಾರಿ ಸಮಸ್ಯೆ, ಬಹುಮಹಡಿ ಕಟ್ಟಡಗಳಲ್ಲಿ ಅಗ್ನಿ ದುರಂತಗಳು.`),
S(`ಉತ್ತಮ ವಸತಿ ಆರೋಗ್ಯಕ್ಕೆ ಹೇಗೆ ಸಹಕಾರಿ?`,`ಉತ್ತಮ ಗಾಳಿ–ಬೆಳಕು, ಶುದ್ಧ ನೀರು, ಶುಚಿತ್ವ ಇರುವುದರಿಂದ ಅಲ್ಲಿ ವಾಸಿಸುವ ಕುಟುಂಬ ಮತ್ತು ನೆರೆಯವರಿಗೆ ಆರೋಗ್ಯ, ಸಂತಸ, ನೆಮ್ಮದಿ ದೊರೆಯುತ್ತದೆ.`),
L(`ಮಾನವನ ವಸತಿಗಳು ಕಾಲಕ್ರಮೇಣ ಹೇಗೆ ಬದಲಾದವು ಎಂಬುದನ್ನು ವಿವರಿಸಿ.`,`ಆದಿ ಮಾನವರು ಗುಹೆ ಮತ್ತು ಮರದ ಪೊಟರೆಗಳಲ್ಲಿ ವಾಸಿಸಿ ಬಿಸಿಲು, ಮಳೆ, ಗಾಳಿ ಮತ್ತು ಕಾಡುಪ್ರಾಣಿಗಳಿಂದ ರಕ್ಷಣೆ ಪಡೆಯುತ್ತಿದ್ದರು. ನಾಗರಿಕನಾದ ಮಾನವ ಒಂದೆಡೆ ನೆಲೆ ನಿಂತಾಗ ಮನೆಗಳ ಅಗತ್ಯ ಹೆಚ್ಚಾಯಿತು. ಗುಡಿಸಲು, ಹೆಂಚಿನ ಮನೆ, ಕಾಂಕ್ರೀಟ್ ಮನೆಗಳು ಬಂದವು. ಜನಸಂಖ್ಯೆ ಹೆಚ್ಚಿದಂತೆ ವೈಯಕ್ತಿಕ ವಸತಿಯಿಂದ ಸಾಮೂಹಿಕ ವಸತಿ ಯೋಜನೆಗಳು ಆರಂಭವಾದವು.`),
L(`ಉತ್ತಮ ವಸತಿಯ ಲಕ್ಷಣಗಳನ್ನು ಪಟ್ಟಿ ಮಾಡಿ ವಿವರಿಸಿ.`,`ಗಾಳಿ–ಬೆಳಕು ಯಥೇಚ್ಛವಾಗಿ ಬರುವಂತಿರಬೇಕು. ಮೇಲ್ಛಾವಣಿಯಲ್ಲಿ ಮಳೆ ನೀರು ಸಂಗ್ರಹ ವ್ಯವಸ್ಥೆ ಇರಬೇಕು. ಸೌರಶಕ್ತಿಯಿಂದ ವಿದ್ಯುತ್ ಪಡೆಯಬೇಕು. ಮುಚ್ಚಿದ ಒಳಚರಂಡಿ ಇರಬೇಕು. ಕಸ ವಿಲೇವಾರಿಗೆ ಸಮರ್ಪಕ ವ್ಯವಸ್ಥೆ ಮತ್ತು ಕಸದಿಂದ ಗೊಬ್ಬರ ತಯಾರಿಕೆ ಇರಬೇಕು. ಇಂತಹ ವಸತಿ ಆರೋಗ್ಯ ಹಾಗೂ ನೆಮ್ಮದಿ ನೀಡುತ್ತದೆ.`)
]});

LSV5.push({n:11,t:`ವಸ್ತು ಸ್ವರೂಪ`,au:`ದ್ರವ್ಯ (ವಸ್ತು)`,pg:20,
words:`ದ್ರವ್ಯ – ಸ್ಥಳವನ್ನು ಆಕ್ರಮಿಸಿ ರಾಶಿ ಹೊಂದಿರುವ ವಸ್ತು; ಕಣ – ದ್ರವ್ಯದ ಅತಿ ಸೂಕ್ಷ್ಮ ಚೂರು; ಅಗೋಚರ – ಕಣ್ಣಿಗೆ ಕಾಣದ; ರಾಶಿ (ದ್ರವ್ಯರಾಶಿ) – ವಸ್ತುವಿನಲ್ಲಿರುವ ಕಣಗಳ ಒಟ್ಟು ಮೊತ್ತ; ಘನ – ಗಟ್ಟಿಯಾದ ಸ್ಥಿತಿ; ದ್ರವ – ಹರಿಯುವ ಸ್ಥಿತಿ; ಅನಿಲ – ಎಲ್ಲೆಡೆ ಹರಡುವ ಸ್ಥಿತಿ; ಉತ್ಪತನ – ಘನ ನೇರವಾಗಿ ಅನಿಲವಾಗುವುದು; ಸಾಂದ್ರತೆ – ಏಕಮಾನ ಗಾತ್ರದ ವಸ್ತುವಿನ ರಾಶಿ; ಒತ್ತಡ – ಏಕಮಾನ ವಿಸ್ತೀರ್ಣದ ಮೇಲೆ ಪ್ರಯೋಗಿಸುವ ಬಲ; ಪ್ಲವನತೆ – ದ್ರವ ವಸ್ತುವನ್ನು ಮೇಲ್ಮುಖವಾಗಿ ತಳ್ಳುವ ಬಲ; ವಿಲೀನತೆ – ನೀರಿನಲ್ಲಿ ಕರಗುವ ಗುಣ; ಕಿಲೋಗ್ರಾಮ್ – ರಾಶಿಯ ಅಂತಾರಾಷ್ಟ್ರೀಯ ಮಾನ`,
notes:`ದ್ರವ್ಯ (ವಸ್ತು) ಅತಿ ಸೂಕ್ಷ್ಮ ಕಣಗಳಿಂದ ಆಗಿದೆ. ಸ್ಥಳವನ್ನು ಆಕ್ರಮಿಸಿ ರಾಶಿ ಹೊಂದಿರುವುದೇ ದ್ರವ್ಯ. ಲಕ್ಷಣಗಳು: (1) ಸ್ಥಳ ಆಕ್ರಮಿಸುತ್ತದೆ, (2) ಕಣಗಳಿಂದ ಆಗಿದೆ, (3) ರಾಶಿ ಇದೆ. ಕಣಗಳ ಜೋಡಣೆಯಂತೆ ಮೂರು ಸ್ಥಿತಿ: ಘನ (ಕಣಗಳು ಒತ್ತೊತ್ತಾಗಿ; ನಿರ್ದಿಷ್ಟ ಆಕಾರ ಮತ್ತು ಗಾತ್ರ), ದ್ರವ (ಕಣಗಳು ಸ್ವಲ್ಪ ವಿರಳ; ನಿರ್ದಿಷ್ಟ ಗಾತ್ರ, ಪಾತ್ರೆಯ ಆಕಾರ), ಅನಿಲ (ಕಣಗಳು ತುಂಬಾ ವಿರಳ; ಆಕಾರ ಹಾಗೂ ಗಾತ್ರ ಬದಲಾಗುತ್ತದೆ). ಉಷ್ಣದಿಂದ ದ್ರವ್ಯ ಹಿಗ್ಗುತ್ತದೆ ಮತ್ತು ಸ್ಥಿತಿ ಬದಲಾಗುತ್ತದೆ: ಘನ → ದ್ರವ → ಅನಿಲ (ಬಿಸಿ), ಅನಿಲ → ದ್ರವ → ಘನ (ತಂಪು). ಕರ್ಪೂರ, ಅಯೋಡಿನ್, ನ್ಯಾಫ್ತಲೀನ್ ಉತ್ಪತನಕ್ಕೆ ಉದಾಹರಣೆ. ರಾಶಿಯ ಮಾನ ಕಿಲೋಗ್ರಾಂ; ಸಾಂದ್ರತೆಯ ಮಾನ ಕೆಜಿ/ಮೀ³. ವಸ್ತು ನೀರಿನಲ್ಲಿ ತೇಲುವುದು ಅಥವಾ ಮುಳುಗುವುದು ಪ್ಲವನತೆಯನ್ನು ಅವಲಂಬಿಸಿದೆ. ಉಪ್ಪು, ಸಕ್ಕರೆ ನೀರಿನಲ್ಲಿ ಕರಗುತ್ತವೆ; ಮರಳು, ಇದ್ದಲು ಪುಡಿ ಕರಗುವುದಿಲ್ಲ.`,
ab:[
[`ದ್ರವ್ಯದ ಬಗ್ಗೆ`,[
[`ದ್ರವ್ಯ ಎಂದರೇನು?`,`ಯಾವ ವಸ್ತುವು ಸ್ಥಳವನ್ನು ಆಕ್ರಮಿಸುತ್ತದೆಯೋ ಮತ್ತು ರಾಶಿಯನ್ನು ಹೊಂದಿದೆಯೋ ಅದು ದ್ರವ್ಯ.`],
[`ದ್ರವ್ಯಗಳು ಯಾವುದರಿಂದ ಆಗಿವೆ?`,`ಅತ್ಯಂತ ಸಣ್ಣ ಕಣಗಳಿಂದ (ಕಣ್ಣಿಗೆ ಕಾಣುವ ದ್ರವ್ಯವು ಕಣ್ಣಿಗೆ ಕಾಣದ ಕಣಗಳಿಂದಾಗಿದೆ).`],
[`ದ್ರವ್ಯದ ಲಕ್ಷಣಗಳು ಯಾವುವು?`,`ಸ್ಥಳವನ್ನು ಆಕ್ರಮಿಸುತ್ತದೆ; ಅನೇಕ ಗೋಚರ ಮತ್ತು ಅಗೋಚರ ಕಣಗಳಿಂದಾಗಿದೆ; ರಾಶಿ (ದ್ರವ್ಯರಾಶಿ) ಇದೆ.`],
[`ಜಾಡಿಯಲ್ಲಿ ಕಂಠಪೂರ್ತಿ ನೀರಿರುವಾಗ ಕಲ್ಲು ಹಾಕಿದರೆ ಏನಾಗುತ್ತದೆ?`,`ನೀರು ಹೊರಚೆಲ್ಲುತ್ತದೆ; ಕಲ್ಲು ಸ್ಥಳವನ್ನು ಆಕ್ರಮಿಸುತ್ತದೆ. ಒಂದು ದ್ರವ್ಯ ಆಕ್ರಮಿಸಿದ ಸ್ಥಳವನ್ನು ಇನ್ನೊಂದು ಆಕ್ರಮಿಸಲಾರದು.`],
[`ಕಂಠಪೂರ್ತಿ ನೀರಿರುವ ಜಾಡಿಗೆ ಚಿಟಿಕೆ ಉಪ್ಪು/ಸಕ್ಕರೆ ಹಾಕಿದರೆ ನೀರು ಏಕೆ ಚೆಲ್ಲುವುದಿಲ್ಲ?`,`ನೀರಿನ ಕಣಗಳು ವಿರಳವಾಗಿರುವುದರಿಂದ ಅವುಗಳ ಮಧ್ಯದ ಸ್ಥಳದಲ್ಲಿ ಸಕ್ಕರೆ/ಉಪ್ಪಿನ ಕಣಗಳು ಸೇರಿಕೊಳ್ಳುತ್ತವೆ.`],
[`ವಾಹನದ ಚಕ್ರದ ಟ್ಯೂಬ್ಗೆ ಅತಿ ಹೆಚ್ಚು ಗಾಳಿ ತುಂಬಿದರೆ ಏನಾಗುತ್ತದೆ?`,`ಟ್ಯೂಬ್ ಒಡೆದುಹೋಗುತ್ತದೆ; ಏಕೆಂದರೆ ಅನಿಲವು ಸ್ಥಳವನ್ನು ಆಕ್ರಮಿಸುತ್ತದೆ ಮತ್ತು ಸೀಮಿತ ಸ್ಥಳಕ್ಕಿಂತ ಹೆಚ್ಚಾದರೆ ಒತ್ತಡ ಹೆಚ್ಚುತ್ತದೆ.`],
[`ಗಾಳಿ ತುಂಬಿದ ಮತ್ತು ಖಾಲಿ ಬಲೂನನ್ನು ದಾರದ ಕೋಲಿಗೆ ಕಟ್ಟಿದರೆ ಏನಾಗುತ್ತದೆ?`,`ಗಾಳಿ ತುಂಬಿದ ಬಲೂನಿನ ಕಡೆಗೆ ಕೋಲು ವಾಲುತ್ತದೆ; ಅನಿಲಕ್ಕೂ ತೂಕ (ರಾಶಿ) ಇದೆ.`]]],
[`ದ್ರವ್ಯದ ಸ್ಥಿತಿಗಳು`,[
[`ಘನ ವಸ್ತುವಿನ ಲಕ್ಷಣ ಮತ್ತು ಉದಾಹರಣೆ`,`ಕಣಗಳು ನಿರ್ದಿಷ್ಟವಾಗಿ ಮತ್ತು ಒತ್ತೊತ್ತಾಗಿ ಜೋಡಣೆಯಾಗಿರುತ್ತವೆ; ಆಕಾರ ಮತ್ತು ಗಾತ್ರ ಬದಲಾಗುವುದಿಲ್ಲ. ಉದಾ: ಕಲ್ಲು, ಕಬ್ಬಿಣ, ಮೇಣದ ಬತ್ತಿ, ಇದ್ದಲು, ಇಟ್ಟಿಗೆ ಚೂರು.`],
[`ದ್ರವ ವಸ್ತುವಿನ ಲಕ್ಷಣ ಮತ್ತು ಉದಾಹರಣೆ`,`ಕಣಗಳು ಘನದ ಕಣಗಳಿಗಿಂತ ಸ್ವಲ್ಪ ವಿರಳ; ಪಾತ್ರೆಯ ಆಕಾರ ಪಡೆಯುತ್ತದೆ ಆದರೆ ಗಾತ್ರ ಬದಲಾಗದು. ಉದಾ: ನೀರು, ಹಾಲು, ಮಜ್ಜಿಗೆ, ಮೊಸರು, ಸೀಮೆಎಣ್ಣೆ, ಜೇನುತುಪ್ಪ.`],
[`ಅನಿಲ ವಸ್ತುವಿನ ಲಕ್ಷಣ ಮತ್ತು ಉದಾಹರಣೆ`,`ಕಣಗಳು ತುಂಬಾ ವಿರಳ; ಪಾತ್ರೆಯ ತುಂಬೆಲ್ಲಾ ಹರಡುತ್ತದೆ; ಆಕಾರ ಮತ್ತು ಗಾತ್ರ ಬದಲಾಗುತ್ತದೆ. ಉದಾ: ವಾಯು, ಹೊಗೆ.`]]],
[`ಉಷ್ಣದ ಪರಿಣಾಮ`,[
[`ಉಷ್ಣ ತಗುಲಿದಾಗ ದ್ರವ್ಯಕ್ಕೆ ಏನಾಗುತ್ತದೆ?`,`ದ್ರವ್ಯ ಹಿಗ್ಗುತ್ತದೆ. ಘನ, ದ್ರವ, ಅನಿಲಗಳು ಅನುಕ್ರಮವಾಗಿ ಹೆಚ್ಚು ಹೆಚ್ಚು ಹಿಗ್ಗುತ್ತವೆ.`],
[`ಸ್ಥಿತಿ ಬದಲಾವಣೆ: ಮಂಜುಗಡ್ಡೆಯನ್ನು ಬಿಸಿ ಮಾಡಿದಾಗ / ನೀರನ್ನು ಬಿಸಿ ಮಾಡಿದಾಗ / ನೀರಾವಿಯನ್ನು ತಂಪು ಮಾಡಿದಾಗ / ನೀರನ್ನು ಪೂರ್ತಿ ತಂಪು ಮಾಡಿದಾಗ`,`ನೀರು (ದ್ರವ) / ನೀರಾವಿ (ಅನಿಲ) / ನೀರು (ದ್ರವ) / ಮಂಜುಗಡ್ಡೆ (ಘನ).`],
[`ಉತ್ಪತನ ಎಂದರೇನು? ಉದಾಹರಣೆ ಕೊಡಿ`,`ಘನ ವಸ್ತು ನೇರವಾಗಿ ಅನಿಲವಾಗಿ ಅಥವಾ ಅನಿಲ ನೇರವಾಗಿ ಘನವಾಗಿ ಬದಲಾಗುವುದು. ಉದಾ: ಕರ್ಪೂರ, ಅಯೋಡಿನ್, ನ್ಯಾಫ್ತಲೀನ್.`],
[`ಕಮ್ಮಾರ ಕಬ್ಬಿಣವನ್ನು ಏಕೆ ಕಾಯಿಸುತ್ತಾನೆ?`,`ಕಾಯಿಸಿದಾಗ ಕಬ್ಬಿಣ ಮೆತ್ತಗಾಗುತ್ತದೆ; ಆಗ ಬಡಿದು ಬೇಕಾದ ಆಕಾರಕ್ಕೆ ತರಬಹುದು.`]]],
[`ರಾಶಿ, ಸಾಂದ್ರತೆ, ಒತ್ತಡ, ಪ್ಲವನತೆ`,[
[`ರಾಶಿ (ದ್ರವ್ಯರಾಶಿ) ಎಂದರೇನು? ಅದರ ಮಾನ ಯಾವುದು?`,`ವಸ್ತುವಿನಲ್ಲಿ ಅಡಕವಾಗಿರುವ ಕಣಗಳ ಒಟ್ಟು ಮೊತ್ತ. ಮಾನ – ಕಿಲೋಗ್ರಾಂ (kg).`],
[`ಸಾಂದ್ರತೆ ಎಂದರೇನು? ಮಾನ?`,`ಒಂದು ವಸ್ತುವಿನ ಏಕಮಾನ ಗಾತ್ರದಲ್ಲಿರುವ ರಾಶಿ. ಮಾನ – ಕೆಜಿ/ಮೀ³.`],
[`ಒತ್ತಡ ಎಂದರೇನು?`,`ಏಕಮಾನ ಪ್ರದೇಶದ ಮೇಲೆ ಪ್ರಯೋಗಿಸಲ್ಪಡುವ ಬಲ.`],
[`ಪ್ಲವನತೆ ಎಂದರೇನು?`,`ದ್ರವದಲ್ಲಿ ಹಾಕಿದ ವಸ್ತುವಿನ ಮೇಲೆ ದ್ರವ ಮೇಲ್ಮುಖವಾಗಿ ತಳ್ಳುವ ಬಲ. ಇದು ಹೆಚ್ಚಿದ್ದರೆ ವಸ್ತು ತೇಲುತ್ತದೆ.`],
[`ಬ್ಲೇಡು ನೀರಿನಲ್ಲಿ ಸಮಾನಾಂತರವಾಗಿಟ್ಟಾಗ ತೇಲಿ, ಲಂಬವಾಗಿಟ್ಟಾಗ ಮುಳುಗುವುದೇಕೆ?`,`ಸಮಾನಾಂತರವಾಗಿದ್ದಾಗ ರಾಶಿ ಹೆಚ್ಚು ಜಾಗದಲ್ಲಿ ಹರಡಿ ಒತ್ತಡ ಕಡಿಮೆಯಾಗುತ್ತದೆ; ಲಂಬವಾಗಿದ್ದಾಗ ಸಣ್ಣ ಜಾಗದ ಮೇಲೆ ಒತ್ತಡ ಹೆಚ್ಚಾಗಿ ಮುಳುಗುತ್ತದೆ.`],
[`ನೀರಿನಲ್ಲಿ ತೇಲುವ ಯಾವುದಾದರೂ ನಾಲ್ಕು ವಸ್ತುಗಳು`,`ಒಣ ಮರದ ತುಂಡು, ಥರ್ಮೋಕೋಲ್, ಒಣ ಎಲೆ, ಸ್ಟ್ರಾ, ಎಣ್ಣೆ (ಮಾದರಿ).`],
[`ನೀರಿನಲ್ಲಿ ಕರಗುವ ಮತ್ತು ಕರಗದ ವಸ್ತುಗಳು`,`ಕರಗುವವು: ಉಪ್ಪು, ಸಕ್ಕರೆ, ಕಲ್ಲುಸಕ್ಕರೆ. ಕರಗದವು: ಮರಳು, ಇದ್ದಲು ಪುಡಿ, ಕಲ್ಲು, ಸೀಮೆಸುಣ್ಣ, ತೆಂಗಿನೆಣ್ಣೆ.`]]]
],
qb:[
M(`ಸ್ಥಳವನ್ನು ಆಕ್ರಮಿಸಿ ರಾಶಿ ಹೊಂದಿರುವುದು:`,[`ದ್ರವ್ಯ`,`ಬೆಳಕು`,`ನೆರಳು`,`ಧ್ವನಿ`],0),
M(`ದ್ರವ್ಯದ ಮೂರು ಸ್ಥಿತಿಗಳು:`,[`ಘನ, ದ್ರವ, ಅನಿಲ`,`ಬಿಸಿ, ತಂಪು, ಉಷ್ಣ`,`ನೀರು, ಮಣ್ಣು, ಗಾಳಿ`,`ಕಲ್ಲು, ಮರ, ಕಬ್ಬಿಣ`],0),
M(`ಘನ ವಸ್ತುವಿಗೆ ಉದಾಹರಣೆ:`,[`ಕಲ್ಲು`,`ಹಾಲು`,`ಹೊಗೆ`,`ವಾಯು`],0),
M(`ಅನಿಲಕ್ಕೆ ಉದಾಹರಣೆ:`,[`ಇಟ್ಟಿಗೆ`,`ಹೊಗೆ`,`ಜೇನುತುಪ್ಪ`,`ಇದ್ದಲು`],1),
M(`ನೇರವಾಗಿ ಘನದಿಂದ ಅನಿಲಕ್ಕೆ ಬದಲಾಗುವ ವಸ್ತು:`,[`ಕರ್ಪೂರ`,`ನೀರು`,`ಮೇಣ`,`ಹಾಲು`],0),
M(`ರಾಶಿಯ ಅಂತಾರಾಷ್ಟ್ರೀಯ ಮಾನ:`,[`ಕಿಲೋಗ್ರಾಂ`,`ಮೀಟರ್`,`ಲೀಟರ್`,`ಸೆಕೆಂಡ್`],0),
M(`ನೀರಿನಲ್ಲಿ ಕರಗದ ವಸ್ತು:`,[`ಉಪ್ಪು`,`ಸಕ್ಕರೆ`,`ಮರಳು`,`ಕಲ್ಲುಸಕ್ಕರೆ`],2),
M(`ಮೇಲ್ಮುಖವಾಗಿ ತಳ್ಳುವ ಬಲಕ್ಕೆ ಹೀಗೆನ್ನುತ್ತಾರೆ:`,[`ಪ್ಲವನತೆ`,`ಒತ್ತಡ`,`ಸಾಂದ್ರತೆ`,`ವಿಲೀನತೆ`],0,'m'),
O(`ದ್ರವ್ಯವನ್ನು ವೈಜ್ಞಾನಿಕವಾಗಿ ಏನೆಂದು ಕರೆಯುತ್ತಾರೆ? (ವಸ್ತು ಎಂದರೆ?)`,`ದ್ರವ್ಯ.`),
O(`ದ್ರವ್ಯದ ಅತಿ ಸೂಕ್ಷ್ಮ ಚೂರನ್ನು ಏನೆನ್ನುವರು?`,`ಕಣ.`),
O(`ದ್ರವ್ಯದ ಯಾವುದಾದರೂ ಎರಡು ಲಕ್ಷಣಗಳನ್ನು ಬರೆಯಿರಿ.`,`ಸ್ಥಳವನ್ನು ಆಕ್ರಮಿಸುತ್ತದೆ; ರಾಶಿ ಹೊಂದಿದೆ.`),
O(`ಉತ್ಪತನ ಎಂದರೇನು?`,`ಘನ ವಸ್ತು ನೇರವಾಗಿ ಅನಿಲವಾಗುವುದು ಅಥವಾ ಅನಿಲ ನೇರವಾಗಿ ಘನವಾಗುವುದು.`),
O(`ನೀರಿನಲ್ಲಿ ವಸ್ತುಗಳು ಕರಗುವ ಗುಣಕ್ಕೆ ಏನೆನ್ನುತ್ತಾರೆ?`,`ವಿಲೀನತೆ.`),
O(`ಸಾಂದ್ರತೆಯ ಅಂತಾರಾಷ್ಟ್ರೀಯ ಮಾನ ಯಾವುದು?`,`ಕೆಜಿ/ಮೀ³ (ಕಿಲೋಗ್ರಾಂ ಪ್ರತಿ ಘನ ಮೀಟರ್).`,'m'),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ಕರ್ಪೂರ ಮತ್ತು ______ ಉತ್ಪತನಕ್ಕೆ ಉದಾಹರಣೆ.`,`ಅಯೋಡಿನ್ (ನ್ಯಾಫ್ತಲೀನ್)`),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ಮಂಜುಗಡ್ಡೆಯನ್ನು ಬಿಸಿ ಮಾಡಿದರೆ ______ ಆಗುತ್ತದೆ.`,`ನೀರು`),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ನೀರನ್ನು ಬಿಸಿ ಮಾಡಿದರೆ ______ ಆಗುತ್ತದೆ.`,`ನೀರಾವಿ`),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ______ ವಸ್ತುವಿನಲ್ಲಿ ಕಣಗಳು ಒತ್ತೊತ್ತಾಗಿರುತ್ತವೆ.`,`ಘನ`),
G(`ಹೊಂದಿಸಿ: ದ್ರವವು ತಾನಿರುವ ಪಾತ್ರೆಯ –`,`ಆಕಾರ ಪಡೆಯುತ್ತದೆ`),
G(`ಗುಂಪಿಗೆ ಸೇರದ ಪದ: ಕಲ್ಲು, ಕಬ್ಬಿಣ, ಮರ, ಹಾಲು`,`ಹಾಲು (ಉಳಿದವು ಘನ ವಸ್ತುಗಳು)`),
G(`ಸರಿ/ತಪ್ಪು: ಅನಿಲಕ್ಕೆ ತೂಕ ಇಲ್ಲ.`,`ತಪ್ಪು (ಅನಿಲಕ್ಕೂ ರಾಶಿ ಇದೆ)`,'e'),
S(`ಘನ, ದ್ರವ ಮತ್ತು ಅನಿಲ ಸ್ಥಿತಿಗಳಲ್ಲಿ ಕಣಗಳ ಜೋಡಣೆಯನ್ನು ಬರೆಯಿರಿ.`,`ಘನ – ಕಣಗಳು ಒತ್ತೊತ್ತಾಗಿ ಜೋಡಿಸಲ್ಪಟ್ಟಿರುತ್ತವೆ; ದ್ರವ – ಸ್ವಲ್ಪ ವಿರಳ; ಅನಿಲ – ತುಂಬಾ ವಿರಳ.`),
S(`ಘನ, ದ್ರವ, ಅನಿಲಗಳ ಆಕಾರ ಮತ್ತು ಗಾತ್ರದ ವ್ಯತ್ಯಾಸ ತಿಳಿಸಿ.`,`ಘನ – ಆಕಾರ, ಗಾತ್ರ ಎರಡೂ ನಿರ್ದಿಷ್ಟ; ದ್ರವ – ಗಾತ್ರ ನಿರ್ದಿಷ್ಟ, ಆಕಾರ ಪಾತ್ರೆಯಂತೆ; ಅನಿಲ – ಆಕಾರ ಮತ್ತು ಗಾತ್ರ ಬದಲಾಗುತ್ತದೆ.`),
S(`ದ್ರವ್ಯದ ಮೇಲೆ ಉಷ್ಣದ ಪರಿಣಾಮವನ್ನು ಬರೆಯಿರಿ.`,`ಉಷ್ಣ ಕೊಟ್ಟಾಗ ವಸ್ತುವಿನ ಉಷ್ಣತೆ ಏರುತ್ತದೆ; ದ್ರವ್ಯ ಹಿಗ್ಗುತ್ತದೆ; ಸ್ಥಿತಿ ಬದಲಾಗುತ್ತದೆ.`),
S(`ಸಾಂದ್ರತೆ ಎಂದರೇನು? ಹತ್ತಿ ಹಗುರ, ಕಬ್ಬಿಣ ಭಾರ ಎನ್ನಲು ಕಾರಣವೇನು?`,`ಏಕಮಾನ ಗಾತ್ರದ ವಸ್ತುವಿನ ರಾಶಿಯೇ ಸಾಂದ್ರತೆ. ಕಬ್ಬಿಣದ ಸಾಂದ್ರತೆ ಹತ್ತಿಗಿಂತ ಹೆಚ್ಚು; ಸಮಗಾತ್ರದಲ್ಲಿ ಅದರ ತೂಕ ಹೆಚ್ಚು.`),
L(`ದ್ರವ್ಯದ ಲಕ್ಷಣಗಳನ್ನು ಚಟುವಟಿಕೆಗಳ ಮೂಲಕ ವಿವರಿಸಿ.`,`ದ್ರವ್ಯವು ಸ್ಥಳವನ್ನು ಆಕ್ರಮಿಸುತ್ತದೆ – ಕಂಠಪೂರ್ತಿ ನೀರಿರುವ ಜಾಡಿಗೆ ಕಲ್ಲು ಹಾಕಿದರೆ ನೀರು ಹೊರ ಚೆಲ್ಲುತ್ತದೆ. ದ್ರವ್ಯ ಕಣಗಳಿಂದಾಗಿದೆ – ಸೀಮೆಸುಣ್ಣದ ಪುಡಿಯನ್ನು ಭೂತಕನ್ನಡಿಯಲ್ಲಿ ನೋಡಿದರೆ ಸಣ್ಣ ಚೂರುಗಳು ಕಾಣುತ್ತವೆ. ದ್ರವ್ಯಕ್ಕೆ ರಾಶಿ ಇದೆ – ತಕ್ಕಡಿಯಲ್ಲಿ ವಸ್ತು ಇಟ್ಟರೆ ಸೂಚಕ ಮುಳ್ಳು ಚಲಿಸುತ್ತದೆ; ಗಾಳಿ ತುಂಬಿದ ಬಲೂನಿಗೂ ತೂಕವಿದೆ.`),
L(`ಉಷ್ಣದಿಂದ ದ್ರವ್ಯದ ಸ್ಥಿತಿ ಬದಲಾವಣೆಯನ್ನು ಉದಾಹರಣೆಯೊಂದಿಗೆ ವಿವರಿಸಿ.`,`ಉಷ್ಣದ ಏರಿಕೆಯಿಂದ ಘನ ದ್ರವವಾಗಿ, ದ್ರವ ಅನಿಲವಾಗುತ್ತದೆ. ತಂಪು ಮಾಡಿದಾಗ ಅನಿಲ ದ್ರವವಾಗಿ, ದ್ರವ ಘನವಾಗುತ್ತದೆ. ಉದಾ: ಮಂಜುಗಡ್ಡೆ ಬಿಸಿಯಾದಾಗ ನೀರು, ನೀರು ಬಿಸಿಯಾದಾಗ ನೀರಾವಿ; ನೀರಾವಿ ತಂಪಾದಾಗ ನೀರು, ನೀರು ತಂಪಾದಾಗ ಮಂಜುಗಡ್ಡೆ. ಕರ್ಪೂರ, ಅಯೋಡಿನ್ ನೇರವಾಗಿ ಘನದಿಂದ ಅನಿಲಕ್ಕೆ ಬದಲಾಗುತ್ತವೆ; ಇದಕ್ಕೆ ಉತ್ಪತನ ಎನ್ನುತ್ತಾರೆ.`)
]});

LSV5.push({n:12,t:`ಧಾತು, ಸಂಯುಕ್ತ ಮತ್ತು ಮಿಶ್ರಣಗಳು`,au:`ದ್ರವ್ಯದ ವರ್ಗೀಕರಣ`,pg:46,
words:`ಪರಮಾಣು – ಮೂಲಧಾತುವಿನ ಅದೇ ಗುಣಗಳುಳ್ಳ ಅತ್ಯಂತ ಚಿಕ್ಕ ಘಟಕ; ಧಾತು – ಒಂದೇ ಬಗೆಯ ಪರಮಾಣುಗಳಿಂದಾದ ವಸ್ತು; ಸಂಯುಕ್ತ – ಎರಡು ಅಥವಾ ಹೆಚ್ಚು ಧಾತುಗಳು ರಾಸಾಯನಿಕವಾಗಿ ಸೇರಿ ಆದ ವಸ್ತು; ಮಿಶ್ರಣ – ಹಲವು ವಸ್ತುಗಳು ರಾಸಾಯನಿಕ ಬದಲಾವಣೆಯಿಲ್ಲದೆ ಬೆರೆತಿರುವುದು; ಅಣುಸೂತ್ರ – ಸಂಯುಕ್ತದ ಪರಮಾಣುಗಳ ಸಂಖ್ಯೆಯನ್ನು ರಾಸಾಯನಿಕ ಸಂಕೇತದಲ್ಲಿ ಸೂಚಿಸುವುದು; ಸಂಯೋಜನೆ – ಸೇರುವಿಕೆ; ಅನುಪಾತ – ಪ್ರಮಾಣದ ಹೋಲಿಕೆ; ಸಂಶ್ಲೇಷಣೆ – ಕೂಡಿಸಿ ತಯಾರಿಸುವುದು; ವಿಭಜನೆ – ಬೇರ್ಪಡಿಸುವುದು`,
notes:`ದ್ರವ್ಯವು ಪರಮಾಣುಗಳಿಂದ ಅಥವಾ ಸಂಯುಕ್ತ ಅಣುಗಳಿಂದ ಆಗಿದೆ. ದ್ರವ್ಯವನ್ನು ಧಾತು, ಸಂಯುಕ್ತ ಮತ್ತು ಮಿಶ್ರಣ ಎಂದು ವರ್ಗೀಕರಿಸುತ್ತಾರೆ. ಧಾತು: ಒಂದೇ ಲಕ್ಷಣದ ಕಣಗಳಿಂದಾದ ವಸ್ತು; ರಾಸಾಯನಿಕವಾಗಿ ವಿಭಜಿಸಲಾಗದು (ಆಕ್ಸಿಜನ್, ಹೈಡ್ರೋಜನ್, ಚಿನ್ನ). ಧಾತುಗಳು ಲೋಹ ಮತ್ತು ಅಲೋಹ. ಸಂಯುಕ್ತ: ಎರಡು ಅಥವಾ ಹೆಚ್ಚು ಧಾತುಗಳು ನಿರ್ದಿಷ್ಟ ಅನುಪಾತದಲ್ಲಿ ರಾಸಾಯನಿಕವಾಗಿ ಸೇರಿ ಹೊಸ ಲಕ್ಷಣದ ವಸ್ತು (ನೀರು H₂O, ಉಪ್ಪು NaCl, ಸಕ್ಕರೆ). ಮಿಶ್ರಣ: ಯಾವ ಅನುಪಾತದಲ್ಲಾದರೂ ಸೇರಿ ತಮ್ಮ ಮೂಲ ಲಕ್ಷಣ ಉಳಿಸಿಕೊಳ್ಳುವುದು (ಮಣ್ಣು). ಸಂಯುಕ್ತದ ಘಟಕಗಳನ್ನು ಸುಲಭವಾಗಿ ಬೇರ್ಪಡಿಸಲಾಗದು; ಮಿಶ್ರಣದ ಘಟಕಗಳನ್ನು ಸರಳವಾಗಿ ಬೇರ್ಪಡಿಸಬಹುದು.`,
ab:[
[`ಧಾತು, ಸಂಯುಕ್ತ, ಮಿಶ್ರಣ`,[
[`ಧಾತುಗಳು ಎಂದರೇನು? ಉದಾಹರಣೆ ಕೊಡಿ`,`ಒಂದೇ ಲಕ್ಷಣದ ಅತಿ ಸೂಕ್ಷ್ಮ ಕಣಗಳಿಂದಾದ ವಸ್ತು. ಉದಾ: ಆಕ್ಸಿಜನ್, ಹೈಡ್ರೋಜನ್, ಚಿನ್ನ.`],
[`ಧಾತುಗಳನ್ನು ಹೇಗೆ ವಿಂಗಡಿಸಲಾಗಿದೆ?`,`ಲೋಹಗಳು ಮತ್ತು ಅಲೋಹಗಳು ಎಂದು.`],
[`ನೈಸರ್ಗಿಕ ಮತ್ತು ಕೃತಕ ಧಾತುಗಳಿಗೆ ಒಂದೊಂದು ಉದಾಹರಣೆ`,`ನೈಸರ್ಗಿಕ ಧಾತು – ಚಿನ್ನ; ಕೃತಕ ಧಾತು – ಪ್ಲುಟೋನಿಯಂ/ಕೃತಕವಾಗಿ ಸೃಷ್ಟಿಸಿದ ಧಾತು ⚠ (ಪಠ್ಯದಲ್ಲಿ ದೃಢಪಡಿಸಿ).`],
[`ಸಂಯುಕ್ತ ವಸ್ತು ಎಂದರೇನು?`,`ಎರಡು ಅಥವಾ ಹೆಚ್ಚು ಧಾತುಗಳು ರಾಸಾಯನಿಕವಾಗಿ ನಿರ್ದಿಷ್ಟ ಅನುಪಾತದಲ್ಲಿ ಸಂಯೋಗಗೊಂಡು ಹೊಸ ಲಕ್ಷಣದ ವಸ್ತುವಾದಲ್ಲಿ ಅದು ಸಂಯುಕ್ತ.`],
[`ನೀರು ಯಾವ ಧಾತುಗಳಿಂದ ಆಗಿದೆ? ಅದರ ಅಣುಸೂತ್ರ?`,`ಹೈಡ್ರೋಜನ್ ಮತ್ತು ಆಕ್ಸಿಜನ್ (2:1 ಅನುಪಾತ). ಅಣುಸೂತ್ರ H₂O.`],
[`ಅಣುಸೂತ್ರ ಎಂದರೇನು?`,`ಅಣುವಿನಲ್ಲಿರುವ ಪರಮಾಣುಗಳ ಸಂಖ್ಯೆಯನ್ನು ರಾಸಾಯನಿಕ ಸಂಕೇತದ ಮೂಲಕ ಸೂಚಿಸುವುದು.`],
[`ಸೋಡಿಯಂ ಮತ್ತು ಕ್ಲೋರಿನ್ ವಿಷಯುಕ್ತ; ಆದರೆ ಉಪ್ಪು ವಿಷಯುಕ್ತವಲ್ಲ. ಏಕೆ?`,`ಸಂಯುಕ್ತವು ತನ್ನ ಘಟಕ ಧಾತುಗಳ ಲಕ್ಷಣಗಳನ್ನು ಹೊಂದಿರುವುದಿಲ್ಲ; ಹೊಸ ಲಕ್ಷಣದ ವಸ್ತುವಾಗುತ್ತದೆ.`],
[`ಮಿಶ್ರಣ ಎಂದರೇನು? ಉದಾಹರಣೆ`,`ಎರಡು ಅಥವಾ ಹೆಚ್ಚು ವಸ್ತುಗಳು ಯಾವುದೇ ಅನುಪಾತದಲ್ಲಿ ರಾಸಾಯನಿಕ ಬದಲಾವಣೆಯಾಗದೆ ಮೂಲ ಲಕ್ಷಣ ಉಳಿಸಿಕೊಂಡು ಬೆರೆತಿರುವುದು. ಉದಾ: ಮಣ್ಣು (ಮರಳು, ಜೇಡಿಮಣ್ಣು, ಲವಣ, ಸಸ್ಯ–ಪ್ರಾಣಿ ಅವಶೇಷ).`]]],
[`ಸಂಯುಕ್ತ ಮತ್ತು ಮಿಶ್ರಣಗಳ ವ್ಯತ್ಯಾಸ`,[
[`ಸಂಯುಕ್ತ`,`ಧಾತುಗಳು ರಾಸಾಯನಿಕವಾಗಿ ಬೆರೆತು ಉಂಟಾಗುತ್ತದೆ; ನಿರ್ದಿಷ್ಟ ಅನುಪಾತದಲ್ಲಿ ಬೆರೆತಿರುತ್ತದೆ; ಮೂಲ ಲಕ್ಷಣ ಉಳಿಯದು; ಘಟಕಗಳನ್ನು ಸುಲಭವಾಗಿ ವಿಭಜಿಸಲಾಗದು.`],
[`ಮಿಶ್ರಣ`,`ವಸ್ತುಗಳು ಭೌತಿಕವಾಗಿ ಬೆರೆತು ಉಂಟಾಗುತ್ತದೆ; ಯಾವ ಪ್ರಮಾಣದಲ್ಲಾದರೂ ಬೆರೆಯಬಹುದು; ಮೂಲ ಲಕ್ಷಣ ಉಳಿಯುತ್ತದೆ; ಘಟಕಗಳನ್ನು ಸರಳವಾಗಿ ಬೇರ್ಪಡಿಸಬಹುದು.`]]]
],
qb:[
M(`ದ್ರವ್ಯದ ಮೂರು ವರ್ಗಗಳು:`,[`ಧಾತು, ಸಂಯುಕ್ತ, ಮಿಶ್ರಣ`,`ಘನ, ದ್ರವ, ಅನಿಲ`,`ಲೋಹ, ಅಲೋಹ, ಕಲ್ಲು`,`ಗಾಳಿ, ನೀರು, ಮಣ್ಣು`],0),
M(`ಧಾತುವಿನ ಅತ್ಯಂತ ಚಿಕ್ಕ ಘಟಕ:`,[`ಪರಮಾಣು`,`ಮಿಶ್ರಣ`,`ಸಂಯುಕ್ತ`,`ಅಣುಸೂತ್ರ`],0),
M(`ಧಾತುವಿಗೆ ಉದಾಹರಣೆ:`,[`ನೀರು`,`ಉಪ್ಪು`,`ಚಿನ್ನ`,`ಮಣ್ಣು`],2),
M(`ನೀರಿನ ಅಣುಸೂತ್ರ:`,[`H₂O`,`CO₂`,`NaCl`,`O₂`],0),
M(`ಸಂಯುಕ್ತಕ್ಕೆ ಉದಾಹರಣೆ:`,[`ಆಕ್ಸಿಜನ್`,`ಉಪ್ಪು (ಸೋಡಿಯಂ ಕ್ಲೋರೈಡ್)`,`ಮಣ್ಣು`,`ಹೈಡ್ರೋಜನ್`],1),
M(`ಮಿಶ್ರಣಕ್ಕೆ ಉದಾಹರಣೆ:`,[`ಮಣ್ಣು`,`ನೀರು`,`ಚಿನ್ನ`,`ಆಕ್ಸಿಜನ್`],0),
M(`ನೀರಿನಲ್ಲಿ ಹೈಡ್ರೋಜನ್:ಆಕ್ಸಿಜನ್ ಅನುಪಾತ:`,[`2:1`,`1:2`,`1:1`,`3:1`],0,'m'),
M(`ಕೃತಕವಾಗಿ ಸೃಷ್ಟಿಸಿದ ಧಾತುಗಳೂ ಇವೆ – ಇದು:`,[`ಸರಿ`,`ತಪ್ಪು`,`ಗೊತ್ತಿಲ್ಲ`,`ಅನ್ವಯಿಸುವುದಿಲ್ಲ`],0,'m'),
O(`ಧಾತು ಎಂದರೇನು?`,`ಒಂದೇ ಲಕ್ಷಣದ ಕಣಗಳಿಂದಾದ ವಸ್ತು; ರಾಸಾಯನಿಕವಾಗಿ ವಿಭಜಿಸಲಾಗದು.`),
O(`ಧಾತುಗಳನ್ನು ಎಷ್ಟು ಬಗೆಯಾಗಿ ವಿಂಗಡಿಸಲಾಗಿದೆ? ಹೆಸರಿಸಿ.`,`ಎರಡು: ಲೋಹಗಳು ಮತ್ತು ಅಲೋಹಗಳು.`),
O(`ಅಣುಸೂತ್ರ ಎಂದರೇನು?`,`ಅಣುವಿನ ಪರಮಾಣುಗಳ ಸಂಖ್ಯೆಯನ್ನು ರಾಸಾಯನಿಕ ಸಂಕೇತದಿಂದ ಸೂಚಿಸುವುದು.`),
O(`ಉಪ್ಪು ಯಾವ ಧಾತುಗಳಿಂದ ಆಗಿದೆ?`,`ಸೋಡಿಯಂ ಮತ್ತು ಕ್ಲೋರಿನ್.`),
O(`ಸಕ್ಕರೆ ಯಾವ ಧಾತುಗಳಿಂದ ಆಗಿದೆ?`,`ಕಾರ್ಬನ್, ಹೈಡ್ರೋಜನ್ ಮತ್ತು ಆಕ್ಸಿಜನ್.`),
O(`ಮಣ್ಣು ಏನೇನರ ಮಿಶ್ರಣ?`,`ಮರಳು, ಜೇಡಿಮಣ್ಣು, ಹಲವು ಲವಣಗಳು ಹಾಗೂ ಸಸ್ಯ–ಪ್ರಾಣಿಗಳ ಅವಶೇಷಗಳು.`,'m'),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ಧಾತುವಿನಲ್ಲಿ ಒಂದೇ ರೀತಿಯ ______ ಗಳ ಸಮೂಹವಿರುತ್ತದೆ.`,`ಪರಮಾಣು`),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ಸಂಯುಕ್ತದಲ್ಲಿ ವಿಭಿನ್ನ ______ ಪರಮಾಣುಗಳ ಸಮೂಹವಿರುತ್ತದೆ.`,`ಧಾತುಗಳ`),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ನೀರು ಒಂದು ______ ವಸ್ತು.`,`ಸಂಯುಕ್ತ`),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ಮಿಶ್ರಣದ ಘಟಕಗಳು ತಮ್ಮ ಮೂಲ ______ ಉಳಿಸಿಕೊಂಡಿರುತ್ತವೆ.`,`ಲಕ್ಷಣಗಳನ್ನು`),
G(`ಹೊಂದಿಸಿ: ಹೈಡ್ರೋಜನ್ –`,`ಧಾತು`),
G(`ಸರಿ/ತಪ್ಪು: ಸಂಯುಕ್ತದ ಘಟಕಗಳನ್ನು ಸುಲಭವಾಗಿ ವಿಭಜಿಸಬಹುದು.`,`ತಪ್ಪು`,'e'),
S(`ಸಂಯುಕ್ತ ವಸ್ತುವಿನ ಲಕ್ಷಣಗಳನ್ನು ಬರೆಯಿರಿ.`,`ಧಾತುಗಳು ನಿರ್ದಿಷ್ಟ ಅನುಪಾತದಲ್ಲಿ ರಾಸಾಯನಿಕವಾಗಿ ಬೆರೆತಿರುತ್ತವೆ; ಹೊಸ ಲಕ್ಷಣದ ವಸ್ತುವಾಗುತ್ತದೆ; ಮೂಲ ಧಾತುಗಳ ಲಕ್ಷಣ ಉಳಿಯದು; ಘಟಕಗಳನ್ನು ಸುಲಭವಾಗಿ ವಿಭಜಿಸಲಾಗದು.`),
S(`ಮಿಶ್ರಣದ ಲಕ್ಷಣಗಳನ್ನು ಬರೆಯಿರಿ.`,`ವಸ್ತುಗಳು ಭೌತಿಕವಾಗಿ ಬೆರೆತಿರುತ್ತವೆ; ಯಾವ ಪ್ರಮಾಣದಲ್ಲಾದರೂ ಬೆರೆಯಬಹುದು; ಮೂಲ ಲಕ್ಷಣ ಉಳಿಯುತ್ತದೆ; ಸರಳವಾಗಿ ಬೇರ್ಪಡಿಸಬಹುದು.`),
S(`ಉಪ್ಪು ವಿಷಯುಕ್ತವಲ್ಲ ಏಕೆ?`,`ಸೋಡಿಯಂ ಮತ್ತು ಕ್ಲೋರಿನ್ ವಿಷಯುಕ್ತವಾದರೂ ಅವು ಸಂಯೋಗಗೊಂಡಾಗ ಹೊಸ ಲಕ್ಷಣದ ಸಂಯುಕ್ತ (ಉಪ್ಪು) ಉಂಟಾಗುತ್ತದೆ; ಹಾಗಾಗಿ ಅದನ್ನು ನಿತ್ಯ ಜೀವನದಲ್ಲಿ ಬಳಸಬಹುದು.`),
S(`ಧಾತುಗಳನ್ನು ವಿಭಜಿಸಲು ಮತ್ತು ಸಂಶ್ಲೇಷಿಸಲು ಸಾಧ್ಯವೇ?`,`ಇಲ್ಲ. ಧಾತುಗಳನ್ನು ರಾಸಾಯನಿಕವಾಗಿ ವಿಭಜಿಸಲಾಗದು ಹಾಗೂ ಬೇರೆ ಧಾತುಗಳಿಂದ ಸಂಶ್ಲೇಷಿಸಲಾಗದು.`),
L(`ಸಂಯುಕ್ತ ಮತ್ತು ಮಿಶ್ರಣಗಳ ನಡುವಿನ ವ್ಯತ್ಯಾಸಗಳನ್ನು ಬರೆಯಿರಿ.`,`ಸಂಯುಕ್ತ: ಎರಡು ಅಥವಾ ಹೆಚ್ಚು ಧಾತುಗಳು ರಾಸಾಯನಿಕವಾಗಿ ಬೆರೆತಾಗ ಉಂಟಾಗುತ್ತದೆ; ನಿರ್ದಿಷ್ಟ ಅನುಪಾತದಲ್ಲಿ ಬೆರೆತಿರುತ್ತವೆ; ಮೂಲ ಲಕ್ಷಣ ಉಳಿಯುವುದಿಲ್ಲ; ವಿಭಜನೆ ಕಷ್ಟ. ಮಿಶ್ರಣ: ಹೆಚ್ಚಿನ ವಸ್ತುಗಳು ಭೌತಿಕವಾಗಿ ಬೆರೆತಾಗ ಉಂಟಾಗುತ್ತದೆ; ಯಾವ ಪ್ರಮಾಣದಲ್ಲಾದರೂ ಬೆರೆಯಬಹುದು; ಮೂಲ ಲಕ್ಷಣ ಉಳಿಯುತ್ತದೆ; ಸರಳವಾಗಿ ಬೇರ್ಪಡಿಸಬಹುದು.`),
L(`ಧಾತು, ಸಂಯುಕ್ತ, ಮಿಶ್ರಣಗಳನ್ನು ಉದಾಹರಣೆಗಳೊಂದಿಗೆ ವಿವರಿಸಿ.`,`ಧಾತು – ಒಂದೇ ಲಕ್ಷಣದ ಕಣಗಳಿಂದಾಗಿದ್ದು ವಿಭಜಿಸಲಾಗದು (ಆಕ್ಸಿಜನ್, ಹೈಡ್ರೋಜನ್, ಚಿನ್ನ). ಸಂಯುಕ್ತ – ಧಾತುಗಳು ನಿರ್ದಿಷ್ಟ ಅನುಪಾತದಲ್ಲಿ ರಾಸಾಯನಿಕವಾಗಿ ಸೇರಿ ಹೊಸ ಲಕ್ಷಣದ ವಸ್ತು (ನೀರು H₂O – ಹೈಡ್ರೋಜನ್ ಮತ್ತು ಆಕ್ಸಿಜನ್ 2:1; ಉಪ್ಪು – ಸೋಡಿಯಂ ಮತ್ತು ಕ್ಲೋರಿನ್). ಮಿಶ್ರಣ – ಹಲವು ವಸ್ತುಗಳು ತಮ್ಮ ಲಕ್ಷಣ ಉಳಿಸಿಕೊಂಡು ಬೆರೆತಿರುವುದು (ಮಣ್ಣು).`)
]});

LSV5.push({n:13,t:`ವಿಸ್ಮಯ ಶಕ್ತಿ`,au:`ಶಕ್ತಿ`,pg:50,
words:`ಬಲ – ವಸ್ತುವನ್ನು ತಳ್ಳುವ/ಎಳೆಯುವ ಪ್ರಯೋಗ; ಕೆಲಸ – ಬಲ ಪ್ರಯೋಗಿಸಿ ವಸ್ತುವನ್ನು ಚಲಿಸುವಂತೆ ಮಾಡುವುದು; ಸ್ಥಾನಪಲ್ಲಟ – ವಸ್ತುವಿನ ಸ್ಥಾನ ಬದಲಾಗುವುದು; ಶಕ್ತಿ – ಕೆಲಸ ಮಾಡುವ ಸಾಮರ್ಥ್ಯ; ಪ್ರಚ್ಛನ್ನ ಶಕ್ತಿ – ಸ್ಥಾನದಿಂದ ವಸ್ತು ಪಡೆಯುವ ಶಕ್ತಿ; ಚಲನ ಶಕ್ತಿ – ಚಲನೆಯಿಂದ ಪಡೆಯುವ ಶಕ್ತಿ; ಯಾಂತ್ರಿಕ ಶಕ್ತಿ – ಪ್ರಚ್ಛನ್ನ ಮತ್ತು ಚಲನ ಶಕ್ತಿಗಳ ಮೊತ್ತ; ಸೌರಶಕ್ತಿ – ಸೂರ್ಯನಿಂದ ಪಡೆಯುವ ಶಕ್ತಿ; ಪವನಶಕ್ತಿ – ಗಾಳಿಯ ಶಕ್ತಿ; ಜೈವಿಕ ಅನಿಲ – ಸಗಣಿ, ಕೃಷಿ ತ್ಯಾಜ್ಯ ಕೊಳೆತು ಆಗುವ ಅನಿಲ; ಇಂಧನ – ಉರಿದು ಉಷ್ಣ ನೀಡುವ ಸಂಪನ್ಮೂಲ; ದ್ಯುತಿಸಂಶ್ಲೇಷಣೆ – ಸಸ್ಯಗಳು ಬೆಳಕಿನಿಂದ ಆಹಾರ ತಯಾರಿಸುವುದು; ಭರತಶಕ್ತಿ – ಸಾಗರದ ಅಲೆಗಳಿಂದ ಉತ್ಪತ್ತಿಯಾಗುವ ಶಕ್ತಿ; ಟರ್ಬೈನ್ – ಶಕ್ತಿಯಿಂದ ತಿರುಗಿ ವಿದ್ಯುತ್ ಉತ್ಪಾದಿಸುವ ಯಂತ್ರ`,
notes:`ವಸ್ತುವಿನ ಮೇಲೆ ಬಲ ಪ್ರಯೋಗಿಸಿ ಅದನ್ನು ಅದೇ ದಿಕ್ಕಿನಲ್ಲಿ ಚಲಿಸುವಂತೆ ಮಾಡಿದರೆ ಕೆಲಸ ಆಗಿದೆ. ಕೆಲಸ ಮಾಡಲು ಶಕ್ತಿ ಬೇಕು; ನಾವು ಶಕ್ತಿಯನ್ನು ಆಹಾರದಿಂದ ಪಡೆಯುತ್ತೇವೆ. ಶಕ್ತಿಯ ರೂಪಗಳು: 1) ಸ್ನಾಯು ಶಕ್ತಿ, 2) ಯಾಂತ್ರಿಕ ಶಕ್ತಿ (ಪ್ರಚ್ಛನ್ನ + ಚಲನ), 3) ಉಷ್ಣ ಶಕ್ತಿ, 4) ಸೌರ ಶಕ್ತಿ, 5) ಪವನ ಶಕ್ತಿ, 6) ಜಲದ ಸಂಗ್ರಹಿತ ಶಕ್ತಿ (ಜಲವಿದ್ಯುತ್), 7) ವಿದ್ಯುತ್ ಶಕ್ತಿ, 8) ಜೈವಿಕ ಶಕ್ತಿ, 9) ರಾಸಾಯನಿಕ ಶಕ್ತಿ, 10) ಇಂಧನ ಶಕ್ತಿ. ಭೂಮಿಯ ಎಲ್ಲಾ ಶಕ್ತಿಗಳ ಮೂಲ ಸೂರ್ಯ. ಶಕ್ತಿಯನ್ನು ಉಂಟುಮಾಡಲು ಅಥವಾ ನಾಶ ಮಾಡಲು ಸಾಧ್ಯವಿಲ್ಲ; ಒಂದು ರೂಪದಿಂದ ಇನ್ನೊಂದಕ್ಕೆ ಬದಲಾಯಿಸಬಹುದು (ಶಕ್ತಿ ಸಂರಕ್ಷಣೆ). ವಿದ್ಯುತ್, ಇಂಧನ, ನೀರನ್ನು ಮಿತವಾಗಿ ಬಳಸಬೇಕು; ಸೌರಶಕ್ತಿಯಂತಹ ಪರ್ಯಾಯ ಶಕ್ತಿ ಬಳಸಬೇಕು.`,
ab:[
[`ಕೆಲಸ ಮತ್ತು ಶಕ್ತಿ`,[
[`ಕೆಲಸ ಎಂದರೇನು?`,`ವಸ್ತುವಿನ ಮೇಲೆ ಪ್ರಯೋಗಿಸಿದ ಬಲವು ಅದನ್ನು ಅದೇ ದಿಕ್ಕಿನಲ್ಲಿ ಚಲಿಸುವಂತೆ ಮಾಡಿದರೆ ಕೆಲಸ ಆಗಿದೆ ಎಂದರ್ಥ.`],
[`ರಶೀದಾ ಗೋಡೆಯನ್ನು ತಳ್ಳಿದರೂ ಕೆಲಸ ಆಗಲಿಲ್ಲ, ಏಕೆ?`,`ಗೋಡೆ ಚಲಿಸಲಿಲ್ಲ; ವಸ್ತು ಚಲಿಸದಿದ್ದರೆ (ಸ್ಥಾನಪಲ್ಲಟವಿಲ್ಲದಿದ್ದರೆ) ಕೆಲಸ ಆಗಿಲ್ಲ.`],
[`ನೀವು ಮಾಡುವ ಕೆಲವು ಕೆಲಸಗಳು`,`ನೀರು ತರುವುದು, ಪುಸ್ತಕದ ಬ್ಯಾಗ್ ಎತ್ತುವುದು, ಕಸ ಗುಡಿಸುವುದು, ಬೆಂಚು ಜೋಡಿಸುವುದು, ಗಿಡಗಳಿಗೆ ನೀರು ಹಾಕುವುದು.`],
[`ಕೆಲಸ ಮಾಡಲು ಅಗತ್ಯವಾದುದು ಯಾವುದು? ಅದನ್ನು ನಾವು ಹೇಗೆ ಪಡೆಯುತ್ತೇವೆ?`,`ಶಕ್ತಿ; ನಾವು ಆಹಾರ ಸೇವನೆಯಿಂದ ಪಡೆಯುತ್ತೇವೆ.`]]],
[`ಶಕ್ತಿಯ ರೂಪಗಳು`,[
[`ಸ್ನಾಯು ಶಕ್ತಿ ಎಂದರೇನು?`,`ನಮ್ಮ ಶರೀರದಲ್ಲಿ ಉಂಟಾಗುವ ರಾಸಾಯನಿಕ ಬದಲಾವಣೆಯಿಂದ ಉಂಟಾಗುವ ಶಕ್ತಿ; ಓಡಾಡುವುದು, ಏರುವುದು, ಎಳೆಯುವುದು, ನೂಕುವುದು ಇದರಿಂದ ಸಾಧ್ಯ.`],
[`ಪ್ರಚ್ಛನ್ನ ಶಕ್ತಿ, ಚಲನ ಶಕ್ತಿ, ಯಾಂತ್ರಿಕ ಶಕ್ತಿ ಎಂದರೇನು?`,`ಸ್ಥಾನದಿಂದ ವಸ್ತು ಪಡೆಯುವ ಶಕ್ತಿ – ಪ್ರಚ್ಛನ್ನ; ಚಲನೆಯಿಂದ ಪಡೆಯುವ ಶಕ್ತಿ – ಚಲನ; ಇವೆರಡರ ಮೊತ್ತ – ಯಾಂತ್ರಿಕ ಶಕ್ತಿ. ಉದಾ: ಅಣೆಕಟ್ಟಿನ ನೀರು ಪ್ರಚ್ಛನ್ನ; ಹರಿದು ಬಿಟ್ಟಾಗ ಚಲನ ಶಕ್ತಿ.`],
[`ಉಷ್ಣ ಶಕ್ತಿಯ ಬಳಕೆಗಳು`,`ಅಡುಗೆ ಮಾಡುವುದು, ನೀರು ಕಾಯಿಸುವುದು, ಉಷ್ಣ ವಿದ್ಯುತ್ ಸ್ಥಾವರದಲ್ಲಿ ವಿದ್ಯುತ್ ಉತ್ಪಾದನೆ (ರಾಯಚೂರು).`],
[`ಸೌರ ಶಕ್ತಿ ಎಂದರೇನು? ಉಪಯೋಗಗಳು`,`ಸೂರ್ಯನಿಂದ ಪಡೆಯುವ ಶಕ್ತಿ. ಸಸ್ಯಗಳ ದ್ಯುತಿಸಂಶ್ಲೇಷಣೆ, ಬಟ್ಟೆ ಒಣಗಿಸುವುದು, ಸೌರ ಜಲತಾಪಕ, ಸೌರ ಕುಕ್ಕರ್, ಸೋಲಾರ್ ವಿದ್ಯುತ್.`],
[`ಪವನ ಶಕ್ತಿಯ ಉಪಯೋಗಗಳು`,`ಗಾಳಿ ಗಿರಣಿಗಳಿಂದ ವಿದ್ಯುತ್ ಉತ್ಪಾದನೆ, ಹಡಗು/ದೋಣಿ ಚಲಿಸಲು, ಗಾಳಿಪಟ ಹಾರಿಸಲು.`],
[`ಜಲವಿದ್ಯುತ್ ಹೇಗೆ ಉತ್ಪಾದನೆಯಾಗುತ್ತದೆ?`,`ನದಿಗೆ ಅಣೆಕಟ್ಟು ಕಟ್ಟಿ ನೀರು ಸಂಗ್ರಹಿಸುತ್ತಾರೆ (ಪ್ರಚ್ಛನ್ನ ಶಕ್ತಿ). ಎತ್ತರದಿಂದ ನೀರು ರಭಸದಿಂದ ಟರ್ಬೈನ್ಗಳ ಮೇಲೆ ಬಿದ್ದು ವಿದ್ಯುತ್ ಉತ್ಪಾದನೆಯಾಗುತ್ತದೆ.`],
[`ಜೈವಿಕ ಅನಿಲ ಎಂದರೇನು?`,`ಕೃಷಿ ತ್ಯಾಜ್ಯ, ಸಸ್ಯ ಅವಶೇಷ, ಸಗಣಿ ಮುಂತಾದವನ್ನು ವಾಯುವಿನ ಸಂಪರ್ಕವಿಲ್ಲದೆ ಕೊಳೆಯಿಸಿದಾಗ ಉಂಟಾಗುವ ಅನಿಲ; ಅಡುಗೆಗೆ ಬಳಕೆ.`],
[`ರಾಸಾಯನಿಕ ಶಕ್ತಿ ಮತ್ತು ಇಂಧನ ಶಕ್ತಿ – ಉದಾಹರಣೆ`,`ವಿದ್ಯುತ್ ಕೋಶ (ಬ್ಯಾಟರಿ)ಯಲ್ಲಿ ರಾಸಾಯನಿಕ ಕ್ರಿಯೆಯಿಂದ ವಿದ್ಯುತ್. ಇಂಧನ: ಪೆಟ್ರೋಲ್, ಡೀಸೆಲ್, ಎಲ್ಪಿಜಿ, ಕಲ್ಲಿದ್ದಲು, ಸೌದೆ.`]]],
[`ಶಕ್ತಿ ಬದಲಾವಣೆ ಮತ್ತು ಸಂರಕ್ಷಣೆ`,[
[`ಶಕ್ತಿ ರೂಪಾಂತರದ ಉದಾಹರಣೆಗಳು`,`ಇಂಧನ → ಯಾಂತ್ರಿಕ (ವಾಹನ ಚಲನೆ); ಸೌದೆ → ಉಷ್ಣ (ಅಡುಗೆ); ಸ್ನಾಯು → ಉಷ್ಣ (ಅಂಗೈ ಉಜ್ಜಿದಾಗ); ಟರ್ಬೈನ್ ತಿರುಗುವುದು → ವಿದ್ಯುತ್ → ಬೆಳಕು (ಬಲ್ಬ್).`],
[`ಶಕ್ತಿ ಸಂರಕ್ಷಣೆ ತತ್ವ`,`ಶಕ್ತಿಯನ್ನು ಉಂಟುಮಾಡಲು ಅಥವಾ ನಾಶ ಮಾಡಲು ಸಾಧ್ಯವಿಲ್ಲ; ಒಂದು ರೂಪದಿಂದ ಇನ್ನೊಂದು ರೂಪಕ್ಕೆ ಬದಲಾಯಿಸಬಹುದು.`],
[`ಶಕ್ತಿ ಉಳಿಸಲು ಪರ್ಯಾಯ ಶಕ್ತಿ ಬಳಕೆ`,`ವಿದ್ಯುತ್/ಇಂಧನದ ಬದಲು: ಸೌರ ಜಲತಾಪಕ (ನೀರು ಕಾಯಿಸಲು), ಸೌರ ಕುಕ್ಕರ್ (ಅಡುಗೆ), ಗೋಬರ್ ಗ್ಯಾಸ್, ಸೋಲಾರ್ ದೀಪ.`]]]
],
qb:[
M(`ಭೂಮಿಯ ಮೇಲಿನ ಎಲ್ಲಾ ಶಕ್ತಿಗಳ ಮೂಲ ಆಕರ:`,[`ಸೂರ್ಯ`,`ಚಂದ್ರ`,`ಕಲ್ಲಿದ್ದಲು`,`ನೀರು`],0),
M(`ಸ್ಥಾನದಿಂದ ಪಡೆಯುವ ಶಕ್ತಿ:`,[`ಪ್ರಚ್ಛನ್ನ ಶಕ್ತಿ`,`ಚಲನ ಶಕ್ತಿ`,`ಉಷ್ಣ ಶಕ್ತಿ`,`ಬೆಳಕಿನ ಶಕ್ತಿ`],0),
M(`ಅಣೆಕಟ್ಟಿನ ನೀರಿನಿಂದ ಉತ್ಪಾದಿಸುವ ವಿದ್ಯುತ್:`,[`ಜಲವಿದ್ಯುತ್`,`ಉಷ್ಣ ವಿದ್ಯುತ್`,`ಸೌರ ವಿದ್ಯುತ್`,`ಪವನ ವಿದ್ಯುತ್`],0),
M(`ಗಾಳಿ ಗಿರಣಿ ಬಳಸುವ ಶಕ್ತಿ:`,[`ಪವನಶಕ್ತಿ`,`ಸೌರಶಕ್ತಿ`,`ಜೈವಿಕ ಶಕ್ತಿ`,`ಇಂಧನ ಶಕ್ತಿ`],0),
M(`ರಾಯಚೂರಿನಲ್ಲಿರುವ ವಿದ್ಯುತ್ ಸ್ಥಾವರ:`,[`ಉಷ್ಣ ವಿದ್ಯುತ್ ಸ್ಥಾವರ`,`ಜಲ ವಿದ್ಯುತ್ ಕೇಂದ್ರ`,`ಅಣು ವಿದ್ಯುತ್ ಕೇಂದ್ರ`,`ಪವನ ವಿದ್ಯುತ್`],0),
M(`ಜೈವಿಕ ಅನಿಲದ ಇನ್ನೊಂದು ಹೆಸರು:`,[`ಗೋಬರ್ ಗ್ಯಾಸ್`,`ಎಲ್ಪಿಜಿ`,`ಪೆಟ್ರೋಲ್`,`ಕಲ್ಲಿದ್ದಲು`],0),
M(`ಸಸ್ಯಗಳು ಬೆಳಕಿನಿಂದ ಆಹಾರ ತಯಾರಿಸುವ ಕ್ರಿಯೆ:`,[`ದ್ಯುತಿಸಂಶ್ಲೇಷಣೆ`,`ಉತ್ಪತನ`,`ವಿಲೀನತೆ`,`ವಿಭಜನೆ`],0),
M(`ಸಾಗರದ ಅಲೆಗಳಿಂದ ಉತ್ಪತ್ತಿಯಾಗುವ ಶಕ್ತಿ:`,[`ಭರತಶಕ್ತಿ`,`ಸೌರಶಕ್ತಿ`,`ಪವನಶಕ್ತಿ`,`ಉಷ್ಣಶಕ್ತಿ`],0,'m'),
O(`ಶಕ್ತಿ ಎಂದರೇನು?`,`ಕೆಲಸ ಮಾಡುವ ಸಾಮರ್ಥ್ಯ.`),
O(`ನಮಗೆ ಕೆಲಸ ಮಾಡಲು ಶಕ್ತಿ ಎಲ್ಲಿಂದ ಸಿಗುತ್ತದೆ?`,`ಆಹಾರದಿಂದ.`),
O(`ಯಾಂತ್ರಿಕ ಶಕ್ತಿ ಎಂದರೇನು?`,`ಪ್ರಚ್ಛನ್ನ ಶಕ್ತಿ ಮತ್ತು ಚಲನ ಶಕ್ತಿಗಳ ಒಟ್ಟು ಮೊತ್ತ.`),
O(`ಇಂಧನ ಎಂದರೇನು?`,`ಉರಿದು ಉಷ್ಣ ಮತ್ತು ಸಾಮಾನ್ಯವಾಗಿ ಬೆಳಕನ್ನು ಬಿಡುಗಡೆ ಮಾಡುವ ನೈಸರ್ಗಿಕ ಸಂಪನ್ಮೂಲ.`),
O(`ವಿದ್ಯುತ್ ಕೋಶದಲ್ಲಿ ಯಾವ ಶಕ್ತಿ ಇರುತ್ತದೆ?`,`ರಾಸಾಯನಿಕ ಶಕ್ತಿ.`),
O(`ಶಕ್ತಿಯ ರೂಪಾಂತರಕ್ಕೆ ಒಂದು ಉದಾಹರಣೆ ಕೊಡಿ.`,`ಸೌದೆ ಉಷ್ಣಶಕ್ತಿಯಾಗುವುದು / ಇಂಧನ ಯಾಂತ್ರಿಕ ಶಕ್ತಿಯಾಗುವುದು.`,'m'),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ಕೆಲಸ ಮಾಡಲು ______ ಅವಶ್ಯಕ.`,`ಶಕ್ತಿ`),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ಶಕ್ತಿಯನ್ನು ಉಂಟುಮಾಡಲು ಅಥವಾ ______ ಮಾಡಲು ಸಾಧ್ಯವಿಲ್ಲ.`,`ನಾಶ`),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ಸೌರಶಕ್ತಿ ಬಳಸಿದರೆ ವಿದ್ಯುತ್ ಬಳಕೆ ಕಡಿಮೆಯಾಗಿ ______ ಮಾಲಿನ್ಯ ತಡೆಯಬಹುದು.`,`ಪರಿಸರ`),
G(`ಹೊಂದಿಸಿ: ಅಂಗೈಗಳನ್ನು ಉಜ್ಜಿದಾಗ ಸ್ನಾಯು ಶಕ್ತಿ –`,`ಉಷ್ಣ ಶಕ್ತಿಯಾಗಿ ಬದಲಾಗುತ್ತದೆ`),
G(`ಹೊಂದಿಸಿ: ಅಡುಗೆ ಮಾಡಲು ಉಳಿತಾಯಕರ ಪರ್ಯಾಯ –`,`ಸೌರ ಕುಕ್ಕರ್ / ಗೋಬರ್ ಗ್ಯಾಸ್`),
G(`ಸರಿ/ತಪ್ಪು: ಇಂಧನಗಳು ಭೂಮಿಯಿಂದ ದೊರೆಯುತ್ತವೆ ಹಾಗೂ ಮರು ಉತ್ಪತ್ತಿಗೆ ಅನೇಕ ವರ್ಷ ಬೇಕು.`,`ಸರಿ`,'e'),
S(`ಶಕ್ತಿಯ ಯಾವುದಾದರೂ ನಾಲ್ಕು ರೂಪಗಳನ್ನು ಬರೆಯಿರಿ.`,`ಸ್ನಾಯು ಶಕ್ತಿ, ಯಾಂತ್ರಿಕ ಶಕ್ತಿ, ಉಷ್ಣ ಶಕ್ತಿ, ಸೌರ ಶಕ್ತಿ (ಪವನ, ವಿದ್ಯುತ್, ಜೈವಿಕ, ರಾಸಾಯನಿಕ, ಇಂಧನ).`),
S(`ಸೌರಶಕ್ತಿಯ ಉಪಯೋಗಗಳನ್ನು ಬರೆಯಿರಿ.`,`ಸಸ್ಯಗಳ ಆಹಾರ ತಯಾರಿಕೆ; ಬಟ್ಟೆ, ಧಾನ್ಯ ಒಣಗಿಸಲು; ಸೌರ ಜಲತಾಪಕ; ಸೌರ ಕುಕ್ಕರ್; ಸೋಲಾರ್ ದೀಪ ಮತ್ತು ವಿದ್ಯುತ್.`),
S(`ಜೈವಿಕ ಶಕ್ತಿಯಿಂದ ಆಗುವ ಪ್ರಯೋಜನಗಳನ್ನು ಬರೆಯಿರಿ.`,`ಅಡುಗೆಗೆ ಜೈವಿಕ ಅನಿಲ; ಅದನ್ನು ವಿದ್ಯುತ್ ಆಗಿ ಬದಲಿಸಿ ಬಳಸಬಹುದು; ಕೃಷಿ ತ್ಯಾಜ್ಯದ ಸದ್ಬಳಕೆ; ಆರೋಗ್ಯಕರ ಪರಿಸರ.`),
S(`ವಿದ್ಯುತ್ ಉಳಿಸುವ ಎರಡು ಸಂದರ್ಭಗಳನ್ನು ಬರೆಯಿರಿ.`,`ಬಳಕೆಯಿಲ್ಲದಾಗ ದೀಪ, ಫ್ಯಾನ್ ಆರಿಸುವುದು; ಹಗಲು ಸೂರ್ಯನ ಬೆಳಕನ್ನು ಬಳಸುವುದು (ಮಾದರಿ).`),
L(`ಶಕ್ತಿಯ ವಿವಿಧ ರೂಪಗಳನ್ನು ಉದಾಹರಣೆಗಳೊಂದಿಗೆ ವಿವರಿಸಿ.`,`ಸ್ನಾಯು ಶಕ್ತಿ – ಓಡಾಡಲು, ಎಳೆಯಲು. ಯಾಂತ್ರಿಕ ಶಕ್ತಿ – ಅಣೆಕಟ್ಟಿನ ನೀರು ಪ್ರಚ್ಛನ್ನ, ಹರಿದರೆ ಚಲನ. ಉಷ್ಣ ಶಕ್ತಿ – ಅಡುಗೆ, ನೀರು ಕಾಯಿಸಲು. ಸೌರ ಶಕ್ತಿ – ಸೂರ್ಯನಿಂದ; ದ್ಯುತಿಸಂಶ್ಲೇಷಣೆ. ಪವನ ಶಕ್ತಿ – ಗಾಳಿ ಗಿರಣಿ. ಜಲ ಶಕ್ತಿ – ಜಲವಿದ್ಯುತ್. ವಿದ್ಯುತ್ ಶಕ್ತಿ – ಮನೆ ಸಾಧನಗಳು. ಜೈವಿಕ ಶಕ್ತಿ – ಗೋಬರ್ ಗ್ಯಾಸ್. ರಾಸಾಯನಿಕ ಶಕ್ತಿ – ಬ್ಯಾಟರಿ. ಇಂಧನ ಶಕ್ತಿ – ಪೆಟ್ರೋಲ್, ಡೀಸೆಲ್.`),
L(`ಶಕ್ತಿ ಸಂರಕ್ಷಣೆಯ ಅಗತ್ಯ ಮತ್ತು ಮಾರ್ಗಗಳನ್ನು ವಿವರಿಸಿ.`,`ಶಕ್ತಿಯನ್ನು ಉಂಟುಮಾಡಲು ಅಥವಾ ನಾಶ ಮಾಡಲು ಸಾಧ್ಯವಿಲ್ಲ; ಒಂದು ರೂಪದಿಂದ ಇನ್ನೊಂದಕ್ಕೆ ಬದಲಾಗುತ್ತದೆ. ಸೂರ್ಯ, ಗಾಳಿ, ನೀರು, ಇಂಧನಗಳ ಶಕ್ತಿಯನ್ನು ಮಿತವಾಗಿ ಬಳಸಿ ಉಳಿತಾಯ ಮಾಡಬೇಕು. ಇಂಧನ ಮತ್ತು ವಿದ್ಯುತ್ ಬದಲು ಸೌರಜಲತಾಪಕ, ಸೌರಕುಕ್ಕರ್, ಗೋಬರ್ ಗ್ಯಾಸ್, ಸೋಲಾರ್ ಬಳಸಬೇಕು. ಇದರಿಂದ ಪರಿಸರ ಸಂರಕ್ಷಣೆಯೂ ಆಗುತ್ತದೆ.`)
]});

LSV5.push({n:14,t:`ಬಾನಂಗಳದ ವಿಸ್ಮಯ`,au:`ಖಗೋಳ – ಸೌರವ್ಯೂಹ`,pg:71,
words:`ಸೌರವ್ಯೂಹ – ಸೂರ್ಯ ಮತ್ತು ಅದರ ಪರಿವಾರ; ನಕ್ಷತ್ರ – ಸ್ವಯಂ ಪ್ರಕಾಶಿತ ಆಕಾಶಕಾಯ; ಗ್ರಹ – ಸೂರ್ಯನ ಸುತ್ತ ಸುತ್ತುವ ಆಕಾಶಕಾಯ; ಉಪಗ್ರಹ – ಗ್ರಹದ ಸುತ್ತ ಸುತ್ತುವ ಆಕಾಶಕಾಯ; ಕಕ್ಷೆ – ಆಕಾಶಕಾಯ ಸುತ್ತುವ ನಿರ್ದಿಷ್ಟ ಪಥ; ಭೂಪಥ – ಭೂಮಿ ಸೂರ್ಯನ ಸುತ್ತ ಸುತ್ತುವ ಮಾರ್ಗ; ದೈನಂದಿನ ಚಲನೆ – ಭೂಮಿ ತನ್ನ ಅಕ್ಷದಲ್ಲಿ ಸುತ್ತುವುದು; ವಾರ್ಷಿಕ ಚಲನೆ – ಭೂಮಿ ಸೂರ್ಯನ ಸುತ್ತ ಸುತ್ತುವುದು; ಉಲ್ಕೆ – ವಾಯುಗೋಳದಲ್ಲಿ ಉರಿಯುವ ದ್ರವ್ಯದ ಚೂರು; ಕ್ಷುದ್ರಗ್ರಹ – ಅನಿಯತ ಆಕಾರದ ಶಿಲಾಕಾಯ; ಧೂಮಕೇತು – ಬಾಲವುಳ್ಳ ಹಿಮಮಯ ಆಕಾಶಕಾಯ; ಅಕ್ಷಭ್ರಮಣ – ತನ್ನ ಅಕ್ಷದಲ್ಲಿ ಸುತ್ತುವುದು; ಪರಿಭ್ರಮಣ – ಇನ್ನೊಂದರ ಸುತ್ತ ಸುತ್ತುವುದು; ಅಮಾವಾಸ್ಯೆ – ಚಂದ್ರ ಕಾಣದ ದಿನ; ಹುಣ್ಣಿಮೆ – ಪೂರ್ಣಚಂದ್ರ ಕಾಣುವ ದಿನ; ಕುಬ್ಜಗ್ರಹ – ಪ್ಲೂಟೋ`,
notes:`ಸೂರ್ಯನ ಪರಿವಾರವೇ ಸೌರವ್ಯೂಹ: 8 ಗ್ರಹಗಳು, ಉಪಗ್ರಹಗಳು, ಕ್ಷುದ್ರಗ್ರಹಗಳು, ಉಲ್ಕೆಗಳು, ಧೂಮಕೇತುಗಳು. ಸೂರ್ಯ ಒಂದು ನಕ್ಷತ್ರ; ಸೌರವ್ಯೂಹದ ಕೇಂದ್ರ. ಸೂರ್ಯನಿಂದ ಅನುಕ್ರಮವಾಗಿ ಗ್ರಹಗಳು: ಬುಧ, ಶುಕ್ರ, ಭೂಮಿ, ಮಂಗಳ, ಗುರು, ಶನಿ, ಯುರೇನಸ್, ನೆಪ್ಚೂನ್. ಪ್ಲೂಟೋ ಈಗ ಕುಬ್ಜಗ್ರಹ. ಭೂಮಿ ಜೀವಿಗಳಿರುವ ಏಕೈಕ ಗ್ರಹ (ಸೂರ್ಯನಿಂದ 3ನೇ ಸ್ಥಾನ). ಭೂಮಿಯ ಆಕಾರ ಜಿಯಾಯ್ಡ್; ಸಮಭಾಜಕ ವ್ಯಾಸ ಸುಮಾರು 12,757 ಕಿ.ಮೀ. ದೈನಂದಿನ ಚಲನೆ (24 ಗಂಟೆ = 1 ದಿನ) – ಹಗಲು ರಾತ್ರಿ; ವಾರ್ಷಿಕ ಚಲನೆ (365¼ ದಿನ = 1 ವರ್ಷ). ಚಂದ್ರ ಭೂಮಿಯ ಏಕೈಕ ನೈಸರ್ಗಿಕ ಉಪಗ್ರಹ; ಸ್ವಂತ ಬೆಳಕಿಲ್ಲ. ಚಂದ್ರನ ಕಲೆಗಳು. ಆರ್ಯಭಟ ಸೂರ್ಯಕೇಂದ್ರಿತ ಮಾದರಿ ಪ್ರತಿಪಾದಿಸಿದ; ಭಾರತದ ಮೊದಲ ಉಪಗ್ರಹ ಆರ್ಯಭಟ.`,
ab:[
[`ಸೌರವ್ಯೂಹ`,[
[`ಸೌರವ್ಯೂಹ ಎಂದರೇನು?`,`ಸೂರ್ಯ ಮತ್ತು ಅದರ ಸುತ್ತಲೂ ಸುತ್ತುವ ಆಕಾಶಕಾಯಗಳ ಸಮೂಹ (ಗ್ರಹಗಳು, ಉಪಗ್ರಹಗಳು, ಕ್ಷುದ್ರಗ್ರಹಗಳು, ಉಲ್ಕೆಗಳು, ಧೂಮಕೇತುಗಳು).`],
[`ಸೌರವ್ಯೂಹದಲ್ಲಿ ಎಷ್ಟು ಗ್ರಹಗಳಿವೆ? ಅನುಕ್ರಮವಾಗಿ ಹೆಸರಿಸಿ`,`8 ಗ್ರಹಗಳು: ಬುಧ, ಶುಕ್ರ, ಭೂಮಿ, ಮಂಗಳ, ಗುರು, ಶನಿ, ಯುರೇನಸ್, ನೆಪ್ಚೂನ್.`],
[`ಸೂರ್ಯನಿಗೆ ಹತ್ತಿರದ ಗ್ರಹ / ಅತಿ ದೂರದ ಗ್ರಹ`,`ಬುಧ / ನೆಪ್ಚೂನ್.`],
[`ಅತಿ ದೊಡ್ಡ ಗ್ರಹ / ಅತಿ ಚಿಕ್ಕ ಗ್ರಹ`,`ಗುರು / ಬುಧ.`],
[`ಭೂಮಿ ಸೂರ್ಯನಿಂದ ಎಷ್ಟನೇ ಸ್ಥಾನದಲ್ಲಿದೆ?`,`ಮೂರನೆಯ ಸ್ಥಾನ.`],
[`ಗ್ರಹಗಳ ಲಕ್ಷಣಕ್ಕೆ ಹೆಸರು ಬರೆಯಿರಿ`,`ಕೆಂಪು ಗ್ರಹ – ಮಂಗಳ; ಪ್ರಕಾಶಮಾನ ಗ್ರಹ – ಶುಕ್ರ; ಅತಿ ದೊಡ್ಡ ಗ್ರಹ – ಗುರು; ನೀಲಿ–ಹಸಿರು ಬಣ್ಣದ ಗ್ರಹ – ಭೂಮಿ/ಯುರೇನಸ್ ⚠(ಚಿತ್ರ ನೋಡಿ ದೃಢಪಡಿಸಿ); ಜೀವಿಗಳಿರುವ ಏಕೈಕ ಗ್ರಹ – ಭೂಮಿ; ದಿನ ವರ್ಷಕ್ಕಿಂತ ಹೆಚ್ಚು ಅವಧಿಯದು – ಶುಕ್ರ.`],
[`ಪ್ಲೂಟೋವಿಗೆ ಏನಾಯಿತು?`,`2006ರ ತರುವಾಯ ಅರ್ಹ ಗ್ರಹ ಲಕ್ಷಣಗಳಿಲ್ಲದ ಕಾರಣ ಅದನ್ನು ಕುಬ್ಜಗ್ರಹ ಎಂದು ಪರಿಗಣಿಸಿ ಗ್ರಹಗಳ ಪಟ್ಟಿಯಿಂದ ತೆಗೆಯಲಾಯಿತು. ⚠ (ಪುಸ್ತಕದಲ್ಲಿ ವರ್ಷ ಓದಿ ದೃಢಪಡಿಸಿ)`]]],
[`ಭೂಮಿ ಮತ್ತು ಚಲನೆಗಳು`,[
[`ಭೂಮಿಯ ಆಕಾರ ಯಾವುದು?`,`ಜಿಯಾಯ್ಡ್ (ಭೂಮ್ಯಾಕಾರ) – ಧ್ರುವಗಳಲ್ಲಿ ಚಪ್ಪಟೆ, ಸಮಭಾಜಕ ವೃತ್ತದ ಬಳಿ ಉಬ್ಬಿದೆ.`],
[`ಭೂಮಿಯ ಎರಡು ಚಲನೆಗಳು`,`ದೈನಂದಿನ ಚಲನೆ (ತನ್ನ ಅಕ್ಷದಲ್ಲಿ ಪಶ್ಚಿಮದಿಂದ ಪೂರ್ವಕ್ಕೆ ತಿರುಗುವುದು) ಮತ್ತು ವಾರ್ಷಿಕ ಚಲನೆ (ಕಕ್ಷೆಯಲ್ಲಿ ಸೂರ್ಯನ ಸುತ್ತ ಸುತ್ತುವುದು).`],
[`ಹಗಲು–ರಾತ್ರಿ ಹೇಗೆ ಉಂಟಾಗುತ್ತವೆ?`,`ಭೂಮಿಯ ದೈನಂದಿನ ಚಲನೆಯಿಂದ ಸೂರ್ಯನಿಗೆ ಎದುರಾದ ಭಾಗದಲ್ಲಿ ಹಗಲು, ವಿರುದ್ಧ ಭಾಗದಲ್ಲಿ ರಾತ್ರಿ.`],
[`ಒಂದು ದಿನ ಮತ್ತು ಒಂದು ವರ್ಷ ಎಂದರೇನು?`,`ಭೂಮಿ ತನ್ನ ಅಕ್ಷದಲ್ಲಿ ಒಮ್ಮೆ ಸುತ್ತಲು ಬೇಕಾದ 24 ಗಂಟೆ = 1 ದಿನ; ಸೂರ್ಯನ ಸುತ್ತ ಒಮ್ಮೆ ಸುತ್ತಲು ಬೇಕಾದ ಸುಮಾರು 365 ದಿನಗಳು = 1 ವರ್ಷ.`],
[`ಭೂಮಿ ಒಂದು ವಿಸ್ಮಯ ಗ್ರಹ ಏಕೆ?`,`ಸೂರ್ಯನಿಂದ ಅನುಕೂಲಕರ ದೂರ, ಸೂಕ್ತ ವಾಯುಗುಣ, ನೀರು, ಉಸಿರಾಡಲು ಆಕ್ಸಿಜನ್, ಮಣ್ಣು, ಜೀವಾನಿಲಗಳಿರುವ ವಾಯುಗೋಳ – ಇವುಗಳಿಂದ ಜೀವಿಗಳು ಬದುಕಲು ಸಾಧ್ಯ.`],
[`ಭೂಮಿಯ ಮೇಲ್ಮೈನಲ್ಲಿ ನೀರು ಮತ್ತು ಭೂಭಾಗದ ಪ್ರಮಾಣ`,`ಸುಮಾರು ಶೇ.71 ನೀರು ಮತ್ತು ಶೇ.29 ಭೂಭಾಗ.`]]],
[`ಚಂದ್ರ, ಉಲ್ಕೆ, ಕ್ಷುದ್ರಗ್ರಹ, ಧೂಮಕೇತು`,[
[`ಚಂದ್ರ ಎಂದರೇನು?`,`ಭೂಮಿಯ ಏಕೈಕ ನೈಸರ್ಗಿಕ ಉಪಗ್ರಹ. ಸ್ವಂತ ಬೆಳಕಿಲ್ಲ; ಸೂರ್ಯನ ಬೆಳಕನ್ನು ಪ್ರತಿಫಲಿಸುತ್ತದೆ.`],
[`ಚಂದ್ರನ ಚಲನೆಗಳು`,`ಅಕ್ಷಭ್ರಮಣ (ತನ್ನ ಅಕ್ಷದಲ್ಲಿ ಸುತ್ತುವುದು) ಮತ್ತು ಪರಿಭ್ರಮಣ (ಭೂಮಿಯ ಸುತ್ತ ಸುತ್ತುವುದು).`],
[`ಉಲ್ಕೆಗಳನ್ನು ಬೀಳುವ ನಕ್ಷತ್ರಗಳು ಎನ್ನುವುದೇಕೆ?`,`ಭೂಮಿಯ ವಾಯುಗೋಳ ಪ್ರವೇಶಿಸುವಾಗ ಉರಿದು ಪ್ರಕಾಶಮಾನ ಬೆಳಕಿನ ಗೆರೆಗಳಂತೆ ಕಾಣುವುದರಿಂದ.`],
[`ಕ್ಷುದ್ರಗ್ರಹಗಳು ಎಲ್ಲಿವೆ?`,`ಮಂಗಳ ಮತ್ತು ಗುರು ಗ್ರಹಗಳ ಕಕ್ಷೆಗಳ ನಡುವೆ.`],
[`ಹ್ಯಾಲಿ ಧೂಮಕೇತು ಎಷ್ಟು ವರ್ಷಕ್ಕೊಮ್ಮೆ ಕಾಣುತ್ತದೆ? ಕೊನೆಯ ಬಾರಿ ಯಾವಾಗ?`,`76 ವರ್ಷಗಳಿಗೊಮ್ಮೆ; 1986ರಲ್ಲಿ ಕಾಣಿಸಿತ್ತು. ಮುಂದೆ 1986+76 = 2062ರಲ್ಲಿ.`],
[`ಹುಣ್ಣಿಮೆ ಮತ್ತು ಅಮಾವಾಸ್ಯೆ ಚಂದ್ರ`,`ಚಂದ್ರ ಪೂರ್ತಿ ಬೆಳಕಿನಲ್ಲಿದ್ದಾಗ ಹುಣ್ಣಿಮೆ; ಪೂರ್ತಿ ಕತ್ತಲೆಯಲ್ಲಿದ್ದಾಗ ಅಮಾವಾಸ್ಯೆ.`]]]
],
qb:[
M(`ಸೌರವ್ಯೂಹದ ಕೇಂದ್ರ:`,[`ಸೂರ್ಯ`,`ಭೂಮಿ`,`ಚಂದ್ರ`,`ಗುರು`],0),
M(`ಸೂರ್ಯನಿಗೆ ಅತಿ ಹತ್ತಿರದ ಗ್ರಹ:`,[`ಬುಧ`,`ಶುಕ್ರ`,`ಮಂಗಳ`,`ಶನಿ`],0),
M(`ಸೌರವ್ಯೂಹದ ಅತಿ ದೊಡ್ಡ ಗ್ರಹ:`,[`ಗುರು`,`ಭೂಮಿ`,`ಶನಿ`,`ಬುಧ`],0),
M(`ಭೂಮಿಯ ನೈಸರ್ಗಿಕ ಉಪಗ್ರಹ:`,[`ಚಂದ್ರ`,`ಆರ್ಯಭಟ`,`ಶುಕ್ರ`,`ಮಂಗಳ`],0),
M(`ಕೆಂಪು ಗ್ರಹ ಎಂದು ಕರೆಯುವುದು:`,[`ಮಂಗಳ`,`ಗುರು`,`ಬುಧ`,`ಶುಕ್ರ`],0),
M(`ಭಾರತ ನಿರ್ಮಿತ ಮೊದಲ ಕೃತಕ ಉಪಗ್ರಹ:`,[`ಆರ್ಯಭಟ`,`ಚಂದ್ರಯಾನ`,`ಇನ್ಸಾಟ್`,`ಮಂಗಳಯಾನ`],0),
M(`ಜೀವಿಗಳು ಇರುವ ಏಕೈಕ ಗ್ರಹ:`,[`ಭೂಮಿ`,`ಮಂಗಳ`,`ಶುಕ್ರ`,`ಗುರು`],0),
M(`ಹಗಲು ರಾತ್ರಿಗಳಿಗೆ ಕಾರಣ:`,[`ಭೂಮಿಯ ದೈನಂದಿನ ಚಲನೆ`,`ಭೂಮಿಯ ವಾರ್ಷಿಕ ಚಲನೆ`,`ಚಂದ್ರನ ಚಲನೆ`,`ಮೋಡಗಳು`],0,'m'),
M(`ಬೀಳುವ ನಕ್ಷತ್ರಗಳು ಎಂದರೆ:`,[`ಉಲ್ಕೆಗಳು`,`ಧೂಮಕೇತುಗಳು`,`ಗ್ರಹಗಳು`,`ಉಪಗ್ರಹಗಳು`],0,'m'),
O(`ಸೌರವ್ಯೂಹ ಎಂದರೇನು?`,`ಸೂರ್ಯ ಮತ್ತು ಅದರ ಸುತ್ತ ಸುತ್ತುವ ಆಕಾಶಕಾಯಗಳ ಸಮೂಹ.`),
O(`ಸ್ವಯಂ ಪ್ರಕಾಶಿತ ಆಕಾಶಕಾಯ ಯಾವುದು?`,`ನಕ್ಷತ್ರ (ಸೂರ್ಯ).`),
O(`ಉಪಗ್ರಹ ಎಂದರೇನು?`,`ಗ್ರಹದ ಸುತ್ತ ಸುತ್ತುವ ಆಕಾಶಕಾಯ.`),
O(`ಭೂಮಿಯ ಎರಡು ಚಲನೆಗಳನ್ನು ಹೆಸರಿಸಿ.`,`ದೈನಂದಿನ ಚಲನೆ ಮತ್ತು ವಾರ್ಷಿಕ ಚಲನೆ.`),
O(`ಸೂರ್ಯಕೇಂದ್ರಿತ ಮಾದರಿಯನ್ನು ಮೊದಲು ಪ್ರತಿಪಾದಿಸಿದ ಭಾರತೀಯ ವಿಜ್ಞಾನಿ ಯಾರು?`,`ಆರ್ಯಭಟ.`),
O(`ಚಂದ್ರನ ಮೇಲೆ ಮೊದಲು ಕಾಲಿಟ್ಟವರು ಯಾರು?`,`ನೀಲ್ ಆರ್ಮ್ಸ್ಟ್ರಾಂಗ್.`,'m'),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ಭೂಮಿ ತನ್ನ ಅಕ್ಷದಲ್ಲಿ ______ ದಿಂದ ಪೂರ್ವಕ್ಕೆ ತಿರುಗುತ್ತದೆ.`,`ಪಶ್ಚಿಮ`),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ಭೂಮಿ ಸೂರ್ಯನಿಂದ ______ ನೇ ಗ್ರಹ.`,`ಮೂರನೆಯ`),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ಭೂಮಿ ಒಮ್ಮೆ ಸುತ್ತಲು 24 ಗಂಟೆ; ಅದು ಒಂದು ______.`,`ದಿನ`),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ಶನಿ ಗ್ರಹದ ಸುತ್ತ ______ ಇವೆ.`,`ಉಂಗುರಗಳು`),
G(`ಹೊಂದಿಸಿ: ಬೃಹಸ್ಪತಿ –`,`ಗುರು ಗ್ರಹ`),
G(`ಹೊಂದಿಸಿ: ಅಂಗಾರಕ –`,`ಮಂಗಳ ಗ್ರಹ`),
G(`ಸರಿ/ತಪ್ಪು: ಚಂದ್ರನಿಗೆ ಸ್ವಂತ ಬೆಳಕಿದೆ.`,`ತಪ್ಪು (ಸೂರ್ಯನ ಬೆಳಕನ್ನು ಪ್ರತಿಫಲಿಸುತ್ತದೆ)`,'e'),
S(`ಹಗಲು ರಾತ್ರಿ ಹೇಗಾಗುತ್ತವೆ ಎಂಬುದನ್ನು ವಿವರಿಸಿ.`,`ಭೂಮಿ ತನ್ನ ಅಕ್ಷದಲ್ಲಿ ಪಶ್ಚಿಮದಿಂದ ಪೂರ್ವಕ್ಕೆ ತಿರುಗುತ್ತದೆ. ಸೂರ್ಯನಿಗೆ ಎದುರಾದ ಭಾಗದಲ್ಲಿ ಹಗಲು, ವಿರುದ್ಧ ಭಾಗದಲ್ಲಿ ರಾತ್ರಿ.`),
S(`ಉಲ್ಕೆಗಳು ಎಂದರೇನು?`,`ಆಕಾಶದಿಂದ ಭೂಮಿಯ ವಾಯುಗೋಳ ಪ್ರವೇಶಿಸುವ ದ್ರವ್ಯದ ಚೂರುಗಳು; ಉರಿದು ಬೆಳಕಿನ ಗೆರೆಗಳಂತೆ ಕಾಣುತ್ತವೆ.`),
S(`ಧೂಮಕೇತುಗಳ ಲಕ್ಷಣ ಬರೆಯಿರಿ.`,`ಹಿಮಮಯ ಆಕಾಶಕಾಯಗಳು; ಅನಿಲ, ಧೂಳನ್ನು ಬಿಡುಗಡೆ ಮಾಡುತ್ತವೆ; ಸೂರ್ಯನ ಬಳಿ ಬಂದಾಗ ಉದ್ದ ಬಾಲ ಪಡೆಯುತ್ತವೆ; ಹ್ಯಾಲಿ ಧೂಮಕೇತು 76 ವರ್ಷಕ್ಕೊಮ್ಮೆ ಕಾಣುತ್ತದೆ.`),

L(`ಸೌರವ್ಯೂಹದ ಗ್ರಹಗಳ ಬಗ್ಗೆ ಮಾಹಿತಿ ಬರೆಯಿರಿ.`,`ಸೂರ್ಯನ ಸುತ್ತ 8 ಗ್ರಹಗಳಿವೆ: ಬುಧ (ಅತಿ ಹತ್ತಿರ, ಬಿಸಿ), ಶುಕ್ರ (ಪ್ರಕಾಶಮಾನ, ಬೆಳ್ಳಿ ಚುಕ್ಕೆ), ಭೂಮಿ (ಜೀವಿಗಳಿರುವ ಗ್ರಹ), ಮಂಗಳ (ಕೆಂಪು ಗ್ರಹ), ಗುರು (ಅತಿ ದೊಡ್ಡ), ಶನಿ (ಉಂಗುರಗಳು), ಯುರೇನಸ್ (ನೀಲಿ–ಹಸಿರು, ಉಂಗುರಗಳು), ನೆಪ್ಚೂನ್ (ಅತಿ ದೂರ, ಅತಿ ಶೀತ). ಗ್ರಹಗಳಿಗೆ ಸ್ವಂತ ಬೆಳಕಿಲ್ಲ.`),
L(`ಭೂಮಿಯು ಒಂದು ವಿಸ್ಮಯ ಗ್ರಹ ಎಂಬುದನ್ನು ವಿವರಿಸಿ.`,`ಭೂಮಿ ಜೀವಿಗಳಿರುವ ಏಕೈಕ ಗ್ರಹ. ಸೂರ್ಯನಿಂದ ಅನುಕೂಲಕರ ದೂರದಲ್ಲಿದೆ. ಶೇ.71 ನೀರು, ವಾಯುಗೋಳದಲ್ಲಿ ಆಕ್ಸಿಜನ್, ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್, ನೈಟ್ರೋಜನ್ ಇವೆ. ಜಲಚಕ್ರದಿಂದ ನೀರು ಲಭ್ಯ. ಸೂಕ್ತ ವಾಯುಗುಣ, ಮಣ್ಣು ಇರುವುದರಿಂದ ಸಸ್ಯ, ಪ್ರಾಣಿಗಳು ಬದುಕಲು ಸಾಧ್ಯ.`)
]});

LSV5.push({n:15,t:`ನಮ್ಮ ಭಾರತ – ಪ್ರಾಕೃತಿಕ ವೈವಿಧ್ಯ`,au:`ಭಾರತದ ಭೂಗೋಳ`,pg:87,
words:`ಪ್ರಾಕೃತಿಕ ಲಕ್ಷಣ – ಭೂ ಮೇಲ್ಮೈನ ವಿಶೇಷತೆ; ಪರ್ವತ ಶ್ರೇಣಿ – ಸಾಲು ಸಾಲಾಗಿ ಹಬ್ಬಿರುವ ಪರ್ವತಗಳು; ಕಣಿವೆ – ಪರ್ವತಗಳ ನಡುವಿನ ತಗ್ಗು; ಹಿಮನದಿ – ಹಿಮದಿಂದಾದ ನದಿ; ಡೂನ್ – ಹಿಮಾಲಯದ ತಗ್ಗಿನ ಸಮತಟ್ಟಾದ ಭಾಗ; ಮೆಕ್ಕಲು ಮಣ್ಣು – ನದಿ ಹೊತ್ತು ತಂದು ಸಂಚಯಿಸಿದ ಫಲವತ್ತಾದ ಮಣ್ಣು; ಪ್ರಸ್ಥಭೂಮಿ – ಸುತ್ತಲಿನ ಪ್ರದೇಶಕ್ಕಿಂತ ಎತ್ತರದ, ಮೇಲ್ಭಾಗ ಸಮತಟ್ಟಾದ ಭೂಪ್ರದೇಶ; ಕರಾವಳಿ – ಸಮುದ್ರದ ಅಂಚಿನ ತಗ್ಗಾದ ಭೂಪ್ರದೇಶ; ಬಂದರು – ಹಡಗುಗಳು ನಿಲ್ಲುವ ಸ್ಥಳ; ಮರುಭೂಮಿ – ಮರಳುಮಯ ಶುಷ್ಕ ಪ್ರದೇಶ; ಓಯಸಿಸ್ – ಮರುಭೂಮಿಯ ನೀರಿರುವ ಸ್ಥಳ; ಮಾರುತ – ಗಾಳಿ; ಋತುಕಾಲಿಕ – ಕಾಲಕ್ಕೆ ತಕ್ಕಂತೆ; ಮಾನ್ಸೂನ್ – ಮೌಸಿಮ್ (ಋತುಕಾಲಿಕ) ಮಾರುತ; ಚಂಡಮಾರುತ – ಸೈಕ್ಲೋನ್; ಬರಗಾಲ – ಮಳೆ ಇಲ್ಲದ ಕಾಲ; ಪರ್ಣಪಾತಿ – ಎಲೆ ಉದುರಿಸುವ; ಮ್ಯಾಂಗ್ರೋವ್ – ಜವುಗು ಸಸ್ಯವರ್ಗ; ವನ್ಯಜೀವಿ – ಕಾಡು ಪ್ರಾಣಿ-ಪಕ್ಷಿ`,
notes:`ಭಾರತದ ಪ್ರಾಕೃತಿಕ ವಿಭಾಗಗಳು ಐದು: 1) ಉತ್ತರದ ಪರ್ವತಗಳು (ಹಿಮಾಲಯ – ವಿಶ್ವದ ಅತಿ ಎತ್ತರದ ಪರ್ವತಗಳು; ಶೀತ ಮಾರುತ ತಡೆ, ನದಿಗಳ ಉಗಮ, ಮಳೆ, ನೈಸರ್ಗಿಕ ಗಡಿ), 2) ಉತ್ತರದ ಮೈದಾನಗಳು (ಸಿಂಧೂ–ಗಂಗಾ–ಬ್ರಹ್ಮಪುತ್ರ; ಮೆಕ್ಕಲು ಮಣ್ಣು; ಭಾರತದ ಆಹಾರ ಕಣಜ), 3) ಪರ್ಯಾಯ ಪ್ರಸ್ಥಭೂಮಿ (ನರ್ಮದಾ ಕಣಿವೆಯ ಉತ್ತರ – ಮಾಳ್ವ, ದಕ್ಷಿಣ – ದಖನ್; ಖನಿಜ ಸಂಪತ್ತು), 4) ಕರಾವಳಿ ಮೈದಾನಗಳು (ಪಶ್ಚಿಮ ಮತ್ತು ಪೂರ್ವ; ಬಂದರುಗಳು), 5) ಮರುಭೂಮಿ (ಥಾರ್ – ರಾಜಸ್ತಾನ). ನದಿಗಳು: ಉತ್ತರ ಭಾರತದ ಜೀವನದಿಗಳು (ಸಿಂಧೂ, ಗಂಗಾ, ಬ್ರಹ್ಮಪುತ್ರ); ದಕ್ಷಿಣ ಭಾರತದ ಪೂರ್ವಕ್ಕೆ ಹರಿಯುವ (ಮಹಾನದಿ, ಗೋದಾವರಿ, ಕೃಷ್ಣಾ, ಕಾವೇರಿ…) ಮತ್ತು ಪಶ್ಚಿಮಕ್ಕೆ ಹರಿಯುವ (ನರ್ಮದಾ, ತಾಪಿ, ಶರಾವತಿ, ಕಾಳಿ, ನೇತ್ರಾವತಿ…). ಹವಾಗುಣ: ಉಷ್ಣವಲಯದ ಮಾನ್ಸೂನ್ ವಿಧ; ಋತುಗಳು – ಚಳಿಗಾಲ, ಬೇಸಿಗೆ, ನೈಋತ್ಯ ಮಾನ್ಸೂನ್ ಕಾಲ (ಜೂನ್–ಸೆಪ್ಟೆಂಬರ್), ನಿರ್ಗಮನ ಕಾಲ (ಅಕ್ಟೋಬರ್–ನವೆಂಬರ್). ಸಸ್ಯ–ಪ್ರಾಣಿ: ಪರ್ಣಪಾತಿ (ಮಾನ್ಸೂನ್) ಕಾಡುಗಳು ಹೆಚ್ಚು; ಆನೆ, ಹುಲಿ, ಸಿಂಹ, ಚಿರತೆ ಇತ್ಯಾದಿ. ನದಿ, ಅರಣ್ಯ, ವನ್ಯಜೀವಿ ಸಂರಕ್ಷಣೆ ನಮ್ಮ ಕರ್ತವ್ಯ.`,
ab:[
[`ಹಿಮಾಲಯ ಪರ್ವತಗಳು`,[
[`ಪ್ರಾಕೃತಿಕ ಲಕ್ಷಣ ಎಂದರೇನು?`,`ಭೂ ಮೇಲ್ಮೈನಲ್ಲಿ ಕಂಡುಬರುವ ಪರ್ವತ, ಕಣಿವೆ, ಮೈದಾನ, ಪ್ರಸ್ಥಭೂಮಿ ಮುಂತಾದ ವಿಶೇಷತೆಗಳು.`],
[`ಹಿಮಾಲಯ ಪರ್ವತಗಳ ಲಕ್ಷಣಗಳು`,`ಹಿಮದಿಂದ ಆವರಿಸಿರುತ್ತವೆ; ಅತಿ ಎತ್ತರದ ಶಿಖರಗಳು; ಆಳವಾದ ಕಣಿವೆ–ಕಂದರ; ಹಿಮನದಿ, ಘಾಟಿಗಳು; ಬಿಸಿನೀರಿನ ಬುಗ್ಗೆಗಳು; ವಿವಿಧ ಸಸ್ಯ–ಪ್ರಾಣಿ ಪ್ರಭೇದಗಳು.`],
[`ಹಿಮಾಲಯದ ಅನುಕೂಲಗಳು`,`ಮಧ್ಯ ಏಷ್ಯಾದ ಶೀತ ಮಾರುತ ತಡೆಯುವುದು; ಉತ್ತರ ಭಾರತದ ನದಿಗಳ ಉಗಮ ಸ್ಥಾನ; ಮಾನ್ಸೂನ್ ಮಾರುತ ತಡೆದು ಮಳೆ ತರುವುದು; ಉತ್ತರದ ನೈಸರ್ಗಿಕ ಗಡಿ.`],
[`ಭಾರತದ ಎತ್ತರದ ಶಿಖರಗಳು`,`ಮೌಂಟ್ ಎವರೆಸ್ಟ್ – ವಿಶ್ವದ ಅತಿ ಎತ್ತರ; ಮೌಂಟ್ ಗಾಡ್ವಿನ್ ಆಸ್ಟಿನ್ (ಕೆ2) – ಭಾರತದ ಅತಿ ಎತ್ತರ; ಮುಳ್ಳಯ್ಯನಗಿರಿ – ಕರ್ನಾಟಕದ ಅತಿ ಎತ್ತರ; ಆನೈಮುಡಿ – ದಕ್ಷಿಣ ಭಾರತದ ಅತಿ ಎತ್ತರ.`],
[`ಡೆಹ್ರಾಡೂನ್ಗೆ ಬೇಸಿಗೆಯಲ್ಲಿ ಪ್ರವಾಸಿಗಳು ಹೋಗುವುದೇಕೆ?`,`ಅದು ತಂಪಾದ, ಸುಂದರ ಪರ್ವತ ತಪ್ಪಲಿನ ಪ್ರದೇಶ; ಬೇಸಿಗೆಯ ಬಿಸಿಲಿನಿಂದ ತಪ್ಪಿಸಿಕೊಳ್ಳಲು (ಮಾದರಿ).`],
[`ಹಿಮಾಲಯದಲ್ಲಿ ಹುಟ್ಟುವ ನದಿಗಳು ಬೇಸಿಗೆಯಲ್ಲೂ ತುಂಬಿ ಹರಿಯುವುದೇಕೆ?`,`ಅವು ಹಿಮ ಕರಗಿದ ನೀರಿನಿಂದ ಪೋಷಿತವಾಗುತ್ತವೆ.`]]],
[`ಉತ್ತರದ ಮೈದಾನಗಳು ಮತ್ತು ಪರ್ಯಾಯ ಪ್ರಸ್ಥಭೂಮಿ`,[
[`ಉತ್ತರದ ಮೈದಾನಗಳು ಫಲವತ್ತಾಗಿರಲು ಕಾರಣ`,`ಹಿಮಾಲಯದಿಂದ ಹರಿಯುವ ನದಿಗಳು ಹೊತ್ತು ತಂದು ಸಂಚಯ ಮಾಡುವ ಮೆಕ್ಕಲು ಮಣ್ಣು.`],
[`ನದಿ ಬಯಲಿನಲ್ಲಿ ಜನರು ಹೆಚ್ಚಾಗಿ ವಾಸಿಸಲು ಬಯಸುವುದೇಕೆ?`,`ನೀರಿನ ಸೌಲಭ್ಯ ಸಿಗುತ್ತದೆ; ಕೃಷಿ, ಪಶುಸಾಕಣೆ, ವ್ಯಾಪಾರ, ಕೈಗಾರಿಕೆ ಅಭಿವೃದ್ಧಿಯಾಗುತ್ತದೆ; ಸಾರಿಗೆ ಸೌಲಭ್ಯ.`],
[`ಉತ್ತರದ ಮೈದಾನದ ಬೆಳೆಗಳು`,`ಗೋಧಿ, ಭತ್ತ, ಹತ್ತಿ, ಮೆಕ್ಕೆಜೋಳ, ಕಬ್ಬು ಇತ್ಯಾದಿ.`],
[`ಭಾರತದ ಆಹಾರ ಕಣಜ ಯಾವುದು?`,`ಉತ್ತರದ ಮೈದಾನಗಳು (ಸಿಂಧೂ–ಗಂಗಾ–ಬ್ರಹ್ಮಪುತ್ರ ನದಿಬಯಲು).`],
[`ಭಾರತದ ಎರಡು ಮುಖ್ಯ ಪ್ರಸ್ಥಭೂಮಿಗಳು`,`ಮಾಳ್ವ ಪ್ರಸ್ಥಭೂಮಿ (ನರ್ಮದಾ ಕಣಿವೆಯ ಉತ್ತರ) ಮತ್ತು ದಖನ್ ಪ್ರಸ್ಥಭೂಮಿ (ದಕ್ಷಿಣ).`],
[`ಪರ್ಯಾಯ ಪ್ರಸ್ಥಭೂಮಿಯ ಅನುಕೂಲಗಳು`,`ಸಮೃದ್ಧ ಖನಿಜ ಸಂಪತ್ತು; ನದಿಗಳಿಂದ ಕೃಷಿಗೆ ನೆರವು; ಜಲಪಾತಗಳಿಂದ ಜಲವಿದ್ಯುತ್; ಕೃಷಿ, ಪ್ರಾಣಿಸಾಕಣೆ, ಕೈಗಾರಿಕೆಗೆ ಅನುಕೂಲ.`],
[`ಪರ್ಯಾಯ ಪ್ರಸ್ಥಭೂಮಿಯಲ್ಲಿ ಆಳಿದ ಸಾಮ್ರಾಜ್ಯಗಳು`,`ರಾಷ್ಟ್ರಕೂಟ, ಚಾಲುಕ್ಯ, ಹೊಯ್ಸಳ, ವಿಜಯನಗರ, ಕದಂಬ, ಗಂಗರು, ಬಹಮನಿ ಸುಲ್ತಾನರು.`]]],
[`ಕರಾವಳಿ ಮತ್ತು ಮರುಭೂಮಿ`,[
[`ಕರಾವಳಿ ಮೈದಾನ ಎಂದರೇನು?`,`ಸಮುದ್ರದ ಅಂಚಿಗೆ ಚಾಚಿಕೊಂಡಿರುವ ತಗ್ಗಾದ ಭೂ ಪ್ರದೇಶ.`],
[`ಪಶ್ಚಿಮ ಮತ್ತು ಪೂರ್ವ ಕರಾವಳಿಗಳು ಯಾವ ಜಲಾಶಯ/ಘಟ್ಟಗಳ ನಡುವೆ ಇವೆ?`,`ಪಶ್ಚಿಮ ಕರಾವಳಿ – ಅರಬ್ಬೀ ಸಮುದ್ರ ಮತ್ತು ಪಶ್ಚಿಮ ಘಟ್ಟಗಳ ನಡುವೆ; ಪೂರ್ವ ಕರಾವಳಿ – ಬಂಗಾಳಕೊಲ್ಲಿ ಮತ್ತು ಪೂರ್ವ ಘಟ್ಟಗಳ ನಡುವೆ.`],
[`ಭಾರತದ ಪ್ರಮುಖ ಬಂದರುಗಳು`,`ಕಾಂಡ್ಲಾ, ಮುಂಬಯಿ, ನ್ಹವಾಶೇವಾ, ಮರ್ಮಗೋವಾ, ನವಮಂಗಳೂರು, ಕೊಚ್ಚಿ, ತೂತುಕುಡಿ, ಚೆನ್ನೈ, ಎನ್ನೂರ್, ವಿಶಾಖಪಟ್ಟಣ, ಪಾರಾದೀಪ, ಹಾಲ್ದಿಯಾ, ಕೋಲ್ಕತ್ತಾ.`],
[`ಕರ್ನಾಟಕದ ಹೆಬ್ಬಾಗಿಲು ಯಾವುದು?`,`ನವ ಮಂಗಳೂರು ಬಂದರು.`],
[`ಕರಾವಳಿಯ ಲಕ್ಷಣಗಳು`,`ಮೀನುಗಾರಿಕೆ ಪ್ರಮುಖ ಕಸಬು; ಮೀನು, ಸೀಗಡಿ ಆಹಾರ; ಭತ್ತ, ಅಡಿಕೆ, ಗೇರು, ಏಲಕ್ಕಿ, ತೆಂಗು ಬೆಳೆಗಳು; ಕುಚ್ಚಲಕ್ಕಿ ಜನಪ್ರಿಯ; ಅತಿಮಳೆಯಿಂದ ಇಳಿಜಾರು ಮೇಲ್ಛಾವಣಿ.`],
[`ಥಾರ್ ಮರುಭೂಮಿ ಎಲ್ಲಿದೆ?`,`ರಾಜಸ್ತಾನದಲ್ಲಿ (ಪಂಜಾಬ್, ಹರಿಯಾಣ, ಗುಜರಾತ್ನಲ್ಲಿ ಭಾಗಶಃ).`],
[`ಮರುಭೂಮಿಯ ಮೂರು ಲಕ್ಷಣಗಳು`,`ವಿಸ್ತಾರ ಶುಷ್ಕ ಮರಳುಮಯ ಪ್ರದೇಶ; ಬಿಸಿಲಿನ ತಾಪ, ಒಣ ಹವೆ; ನೀರಿನ ಕೊರತೆ; ಕುರುಚಲು ಸಸ್ಯ, ಪಾಪಾಸ್ ಕಳ್ಳಿ, ಜಾಲಿ.`],
[`ಒಂಟೆಯನ್ನು ಮರುಭೂಮಿಯ ಹಡಗು ಎನ್ನುವುದೇಕೆ?`,`ಚಪ್ಪಟೆ ಗೊರಸುಗಳು ಮರಳಿನಲ್ಲಿ ನಡೆಯಲು ಯೋಗ್ಯ; ಡುಬ್ಬದಲ್ಲಿ ಮೇದಸ್ಸು, ನೀರು ಸಂಗ್ರಹ; ಪ್ರಯಾಣ ಮತ್ತು ಸರಕು ಸಾಗಣೆಗೆ ಬಳಕೆ.`],
[`ಭಾರತದ ಅತಿ ವಿಸ್ತಾರವಾದ ಉಪ್ಪಿನ ಸರೋವರ`,`ಸಾಂಬಾರ್ ಸರೋವರ.`]]],
[`ನದಿಗಳು, ಹವಾಗುಣ, ಸಸ್ಯ–ಪ್ರಾಣಿ`,[
[`ಪೂರ್ವಕ್ಕೆ ಹರಿಯುವ ದಕ್ಷಿಣ ಭಾರತದ ನದಿಗಳು`,`ಮಹಾನದಿ, ಗೋದಾವರಿ, ಕೃಷ್ಣಾ, ಕಾವೇರಿ, ಪಾಲಾರ್, ಪೆನ್ನಾರ್ – ಬಂಗಾಳಕೊಲ್ಲಿಗೆ ಸೇರುತ್ತವೆ.`],
[`ಪಶ್ಚಿಮಕ್ಕೆ ಹರಿಯುವ ನದಿಗಳು`,`ನರ್ಮದಾ, ತಾಪಿ, ಶರಾವತಿ, ಕಾಳಿ, ನೇತ್ರಾವತಿ, ಜುವಾರಿ, ಪೆರಿಯಾರ್ – ಅರಬ್ಬೀ ಸಮುದ್ರ ಸೇರುತ್ತವೆ; ಜಲಪಾತ, ಜಲವಿದ್ಯುತ್.`],
[`ಭಾರತದ ವಾಯುಗುಣದ ವಿಧ ಯಾವುದು?`,`ಉಷ್ಣವಲಯದ ಮಾನ್ಸೂನ್ ವಿಧ (ಮೌಸಿಮ್ = ಋತುಕಾಲಿಕ).`],
[`ಭಾರತದ ಋತುಗಳು`,`ಚಳಿಗಾಲ, ಬೇಸಿಗೆಕಾಲ, ನೈಋತ್ಯ ಮಾನ್ಸೂನ್ ಮಾರುತಗಳ ಕಾಲ (ಜೂನ್–ಸೆಪ್ಟೆಂಬರ್, ಮುಂಗಾರು), ಮಾನ್ಸೂನ್ ನಿರ್ಗಮನ ಕಾಲ (ಅಕ್ಟೋಬರ್–ನವೆಂಬರ್, ಹಿಂಗಾರು).`],
[`ಭಾರತದಲ್ಲಿ ಅತಿ ಹೆಚ್ಚು ಮಳೆ ಬೀಳುವ ಸ್ಥಳ`,`ಮೇಘಾಲಯದ ಮಾಸಿನ್ರಾಮ್ (ಪಠ್ಯದ ಹೆಸರು ⚠ ದೃಢಪಡಿಸಿ).`],
[`ಬರಗಾಲದ ಪರಿಣಾಮಗಳು`,`ಬೆಳೆಗಳಿಗೆ ನೀರಿಲ್ಲ; ಜಾನುವಾರುಗಳು ನೀರಿಗಾಗಿ ಅಲೆದು ಸಾಯುತ್ತವೆ; ಕುಡಿಯಲು ನೀರಿಲ್ಲ; ಬಾವಿ ಒಣಗುತ್ತದೆ; ಜನರು ವಲಸೆ ಹೋಗುತ್ತಾರೆ.`],
[`ಭಾರತದ ಕಾಡುಗಳ ವಿಧಗಳು`,`ದಟ್ಟ ಅರಣ್ಯ, ಹುಲ್ಲುಗಾವಲು, ಮುಳ್ಳುಗಿಡ, ಕುರುಚಲು ಸಸ್ಯ, ಸದಾ ಹಸಿರು ಕಾಡು, ಪರ್ಣಪಾತಿ (ಮಾನ್ಸೂನ್) ಕಾಡು, ಮ್ಯಾಂಗ್ರೋವ್.`],
[`ಕರ್ನಾಟಕದ ರಾಷ್ಟ್ರೀಯ ಉದ್ಯಾನಗಳು`,`ನಾಗರಹೊಳೆ, ಭದ್ರಾ, ಬಂಡೀಪುರ.`],
[`ನದಿಗಳು ಕಲುಷಿತವಾಗುವ ವಿಧಾನಗಳು`,`ಪ್ಲಾಸ್ಟಿಕ್ ಮತ್ತು ವಿಷಕಾರಿ ತ್ಯಾಜ್ಯ, ಕಾರ್ಖಾನೆಯ ರಾಸಾಯನಿಕ ತ್ಯಾಜ್ಯ, ರಾಸಾಯನಿಕ ಬಣ್ಣದ ವಿಗ್ರಹ ವಿಸರ್ಜನೆ, ನಗರ ತ್ಯಾಜ್ಯ, ಗಣಿಗಾರಿಕೆ.`]]]
],
qb:[
M(`ಪ್ರಪಂಚದ ಅತ್ಯಂತ ಎತ್ತರದ ಪರ್ವತಗಳು:`,[`ಹಿಮಾಲಯ`,`ಪಶ್ಚಿಮ ಘಟ್ಟ`,`ವಿಂಧ್ಯ`,`ಅರಾವಳಿ`],0),
M(`ಭಾರತದ ಆಹಾರ ಕಣಜ:`,[`ಉತ್ತರದ ಮೈದಾನ`,`ಥಾರ್ ಮರುಭೂಮಿ`,`ಹಿಮಾಲಯ`,`ಕರಾವಳಿ`],0),
M(`ಥಾರ್ ಮರುಭೂಮಿ ಇರುವ ರಾಜ್ಯ:`,[`ರಾಜಸ್ತಾನ`,`ಕೇರಳ`,`ಕರ್ನಾಟಕ`,`ಅಸ್ಸಾಂ`],0),
M(`ಕರ್ನಾಟಕದ ಹೆಬ್ಬಾಗಿಲು:`,[`ನವ ಮಂಗಳೂರು ಬಂದರು`,`ಮುಂಬಯಿ`,`ಚೆನ್ನೈ`,`ವಿಶಾಖಪಟ್ಟಣ`],0),
M(`ಮರುಭೂಮಿಯ ಹಡಗು:`,[`ಒಂಟೆ`,`ಕುದುರೆ`,`ಆನೆ`,`ಎತ್ತು`],0),
M(`ಭಾರತದ ವಾಯುಗುಣ:`,[`ಉಷ್ಣವಲಯದ ಮಾನ್ಸೂನ್`,`ಧ್ರುವ`,`ಮರುಭೂಮಿ`,`ಮೆಡಿಟರೇನಿಯನ್`],0),
M(`ಕರ್ನಾಟಕದ ಅತಿ ಎತ್ತರದ ಶಿಖರ:`,[`ಮುಳ್ಳಯ್ಯನಗಿರಿ`,`ಆನೈಮುಡಿ`,`ಎವರೆಸ್ಟ್`,`ಕುದುರೆಮುಖ`],0),
M(`ಅರಬ್ಬೀ ಸಮುದ್ರವನ್ನು ಸೇರುವ ನದಿ:`,[`ಶರಾವತಿ`,`ಕಾವೇರಿ`,`ಗೋದಾವರಿ`,`ಕೃಷ್ಣಾ`],0,'m'),
M(`ಮಾನ್ಸೂನ್ ಪದ ಯಾವ ಭಾಷೆಯ ಮೌಸಿಮ್ ನಿಂದ ಬಂದಿದೆ?`,[`ಅರಬ್`,`ಲ್ಯಾಟಿನ್`,`ಇಂಗ್ಲಿಷ್`,`ಹಿಂದಿ`],0,'m'),
O(`ಪ್ರಾಕೃತಿಕ ಲಕ್ಷಣ ಎಂದರೇನು?`,`ಭೂ ಮೇಲ್ಮೈನ ವಿಶೇಷತೆಗಳು.`),
O(`ಭಾರತದ ಪ್ರಾಕೃತಿಕ ವಿಭಾಗಗಳನ್ನು ಹೆಸರಿಸಿ.`,`ಉತ್ತರದ ಪರ್ವತಗಳು, ಉತ್ತರದ ಮೈದಾನಗಳು, ಪರ್ಯಾಯ ಪ್ರಸ್ಥಭೂಮಿ, ಕರಾವಳಿ ಮೈದಾನಗಳು, ಮರುಭೂಮಿ.`),
O(`ಹಿಮಾಲಯದಲ್ಲಿ ಹುಟ್ಟುವ ಎರಡು ನದಿಗಳನ್ನು ಹೆಸರಿಸಿ.`,`ಗಂಗಾ, ಯಮುನಾ (ಸಿಂಧೂ, ಬ್ರಹ್ಮಪುತ್ರ).`),
O(`ಪ್ರಸ್ಥಭೂಮಿ ಎಂದರೇನು?`,`ಸುತ್ತಲಿನ ಪ್ರದೇಶಕ್ಕಿಂತ ಎತ್ತರವಾಗಿದ್ದು ಮೇಲ್ಭಾಗ ಸಮತಟ್ಟಾಗಿರುವ ಭೂಪ್ರದೇಶ.`),
O(`ಭಾರತದ ಅತಿ ದೊಡ್ಡ ಪ್ರಸ್ಥಭೂಮಿ ಯಾವುದು?`,`ದಖನ್ ಪ್ರಸ್ಥಭೂಮಿ.`),
O(`ಮಳೆ ಕಡಿಮೆ ಬಿದ್ದರೆ ಯಾವ ಪರಿಸ್ಥಿತಿ ಎದುರಾಗುತ್ತದೆ?`,`ಬರಗಾಲ.`,'m'),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ನರ್ಮದಾ ನದಿ ಕಣಿವೆ ಪ್ರಸ್ಥಭೂಮಿಯನ್ನು ______ ಭಾಗಗಳಾಗಿ ವಿಂಗಡಿಸುತ್ತದೆ.`,`ಎರಡು`),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ಭಾರತದ ಭತ್ತ, ಗೋಧಿ ಬೆಳೆಯುವ ಬಯಲು ______ ಮೈದಾನ.`,`ಉತ್ತರದ`),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ಎಲೆ ಉದುರಿಸುವ ಕಾಡುಗಳನ್ನು ______ ಕಾಡುಗಳು ಎನ್ನುತ್ತಾರೆ.`,`ಮಾನ್ಸೂನ್`),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ಜೂನ್–ಸೆಪ್ಟೆಂಬರ್ ಮಳೆ ______ ಮಾನ್ಸೂನ್.`,`ನೈಋತ್ಯ`),
G(`ಹೊಂದಿಸಿ: ಬಿಸಿನೀರಿನ ಬುಗ್ಗೆಗಳಿರುವ ಪರ್ವತ –`,`ಹಿಮಾಲಯ`),
G(`ಹೊಂದಿಸಿ: ಮೀನುಗಾರಿಕೆ ಪ್ರಮುಖ ಕಸುಬು –`,`ಕರಾವಳಿ ಪ್ರದೇಶ`),
G(`ಸರಿ/ತಪ್ಪು: ಪಶ್ಚಿಮ ಘಟ್ಟಗಳಲ್ಲಿ ದಕ್ಷಿಣ ಭಾರತದ ಹಲವು ನದಿಗಳು ಹುಟ್ಟುತ್ತವೆ.`,`ಸರಿ`,'e'),
S(`ಉತ್ತರದ ಮೈದಾನಗಳು ಫಲವತ್ತಾಗಿರುವುದೇಕೆ?`,`ಹಿಮಾಲಯದ ನದಿಗಳು ಹೊತ್ತು ತಂದು ಸಂಚಯ ಮಾಡಿದ ಮೆಕ್ಕಲು ಮಣ್ಣಿನಿಂದ ಈ ಮೈದಾನಗಳು ರೂಪುಗೊಂಡಿವೆ; ಹಾಗಾಗಿ ಫಲವತ್ತಾಗಿವೆ.`),
S(`ಹಿಮಾಲಯ ಪರ್ವತಗಳ ಯಾವುದಾದರೂ ಮೂರು ಉಪಯೋಗ ಬರೆಯಿರಿ.`,`ಶೀತ ಮಾರುತ ತಡೆಯುತ್ತವೆ; ನದಿಗಳ ಉಗಮ ಸ್ಥಾನ; ಮಳೆ ಬರಲು ಕಾರಣ; ನೈಸರ್ಗಿಕ ಗಡಿ.`),
S(`ಮರುಭೂಮಿಯ ಸಸ್ಯಗಳು ಯಾವುವು?`,`ಕುರುಚಲು ಸಸ್ಯ, ಪಾಪಾಸ್ ಕಳ್ಳಿ, ಕತ್ತಾಳೆ, ಜಾಲಿ ಗಿಡಗಳು.`),
S(`ಎರಡು ಬಗೆಯ ಮಳೆಗಾಲಗಳನ್ನು ಬರೆಯಿರಿ.`,`ಜೂನ್–ಸೆಪ್ಟೆಂಬರ್: ನೈಋತ್ಯ ಮಾನ್ಸೂನ್ (ಮುಂಗಾರು); ಅಕ್ಟೋಬರ್–ನವೆಂಬರ್: ಮಾನ್ಸೂನ್ ನಿರ್ಗಮನ ಕಾಲ (ಹಿಂಗಾರು).`),
S(`ನದಿಗಳನ್ನು ಶುದ್ಧವಾಗಿಡಲು ಏನು ಮಾಡಬೇಕು?`,`ಪ್ಲಾಸ್ಟಿಕ್, ತ್ಯಾಜ್ಯ ಹಾಕಬಾರದು; ಕಾರ್ಖಾನೆ ತ್ಯಾಜ್ಯ ಸಂಸ್ಕರಿಸಿ ಬಿಡಬೇಕು; ರಾಸಾಯನಿಕ ಬಣ್ಣದ ವಿಗ್ರಹ ವಿಸರ್ಜಿಸಬಾರದು.`),
L(`ಭಾರತದ ಪ್ರಾಕೃತಿಕ ವಿಭಾಗಗಳನ್ನು ಹೆಸರಿಸಿ, ಯಾವುದಾದರೂ ಎರಡನ್ನು ವಿವರಿಸಿ.`,`ಭಾರತದಲ್ಲಿ ಐದು ವಿಭಾಗಗಳಿವೆ: ಉತ್ತರದ ಪರ್ವತಗಳು, ಉತ್ತರದ ಮೈದಾನಗಳು, ಪರ್ಯಾಯ ಪ್ರಸ್ಥಭೂಮಿ, ಕರಾವಳಿ ಮೈದಾನಗಳು, ಮರುಭೂಮಿ. ಉತ್ತರದ ಪರ್ವತಗಳು: ಹಿಮಾಲಯ ಹಿಮದಿಂದ ಆವರಿಸಿ ಅತಿ ಎತ್ತರದ ಶಿಖರ, ಕಣಿವೆ, ಹಿಮನದಿ ಹೊಂದಿದೆ; ಶೀತ ಮಾರುತ ತಡೆಯುತ್ತದೆ; ನದಿಗಳಿಗೆ ಉಗಮ ಸ್ಥಾನ. ಉತ್ತರದ ಮೈದಾನ: ಸಿಂಧೂ–ಗಂಗಾ–ಬ್ರಹ್ಮಪುತ್ರ ನದಿಗಳು ತಂದ ಮೆಕ್ಕಲು ಮಣ್ಣಿನಿಂದ ಫಲವತ್ತು; ಗೋಧಿ, ಭತ್ತ, ಕಬ್ಬು ಬೆಳೆಯುತ್ತಾರೆ; ಆಹಾರ ಕಣಜ.`),
L(`ಭಾರತದ ವಾಯುಗುಣ ಮತ್ತು ಋತುಗಳನ್ನು ವಿವರಿಸಿ.`,`ಭಾರತದಲ್ಲಿ ಉಷ್ಣವಲಯದ ಮಾನ್ಸೂನ್ ವಾಯುಗುಣವಿದೆ. ಮಾನ್ಸೂನ್ ಅರಬ್ ಭಾಷೆಯ ಮೌಸಿಮ್ (ಋತುಕಾಲಿಕ) ಪದದಿಂದ ಬಂದಿದೆ. ಋತುಗಳು: ಚಳಿಗಾಲ, ಬೇಸಿಗೆ, ನೈಋತ್ಯ ಮಾನ್ಸೂನ್ ಕಾಲ (ಜೂನ್–ಸೆಪ್ಟೆಂಬರ್), ನಿರ್ಗಮನ ಕಾಲ (ಅಕ್ಟೋಬರ್–ನವೆಂಬರ್). ಪಶ್ಚಿಮ ಕರಾವಳಿ, ಪಶ್ಚಿಮ ಘಟ್ಟ ಮತ್ತು ಈಶಾನ್ಯ ರಾಜ್ಯಗಳಲ್ಲಿ ಹೆಚ್ಚು ಮಳೆ.`)
]});

LSV5.push({n:16,t:`ನಮ್ಮ ಭಾರತ – ರಾಜಕೀಯ ಮತ್ತು ಸಾಂಸ್ಕೃತಿಕ ವೈವಿಧ್ಯ`,au:`ಭಾರತದ ರಾಜಕೀಯ ಮತ್ತು ಸಂಸ್ಕೃತಿ`,pg:116,
words:`ಅಕ್ಷಾಂಶ – ಭೂಮಿಯ ಮೇಲೆ ಪೂರ್ವ–ಪಶ್ಚಿಮವಾಗಿ ಎಳೆಯುವ ಕಾಲ್ಪನಿಕ ರೇಖೆ; ರೇಖಾಂಶ – ಉತ್ತರ–ದಕ್ಷಿಣವಾಗಿ ಎಳೆಯುವ ಕಾಲ್ಪನಿಕ ರೇಖೆ; ಸಮಭಾಜಕ ವೃತ್ತ – ಭೂಮಧ್ಯರೇಖೆ (0°); ಪ್ರಧಾನ ರೇಖಾಂಶ – ಗ್ರೀನ್ವಿಚ್ ಮೂಲಕ ಹಾದುಹೋಗುವ 0° ರೇಖಾಂಶ; ಉತ್ತರ/ದಕ್ಷಿಣ ಗೋಳಾರ್ಧ – ಸಮಭಾಜಕದ ಉತ್ತರ/ದಕ್ಷಿಣ ಭಾಗ; ಕರ್ಕಾಟಕ ಸಂಕ್ರಾಂತಿ ವೃತ್ತ – 23½° ಉತ್ತರ ಅಕ್ಷಾಂಶ; ಪರ್ಯಾಯ ದ್ವೀಪ – ಮೂರು ಕಡೆ ನೀರು, ಒಂದು ಕಡೆ ಭೂಮಿ; ದ್ವೀಪ – ಸುತ್ತಲೂ ನೀರಿನಿಂದ ಆವೃತ ಭೂಭಾಗ; ಒಕ್ಕೂಟ ವ್ಯವಸ್ಥೆ – ರಾಜ್ಯಗಳು ಸೇರಿದ ದೇಶದ ವ್ಯವಸ್ಥೆ; ಕೇಂದ್ರಾಡಳಿತ ಪ್ರದೇಶ – ಕೇಂದ್ರ ಸರ್ಕಾರ ಆಳುವ ಪ್ರದೇಶ; ಭಾವೈಕ್ಯತೆ – ಎಲ್ಲರೂ ಒಂದೇ ಎಂಬ ಭಾವ; ತ್ರಿವರ್ಣ – ಮೂರು ಬಣ್ಣ; ಲಾಂಛನ – ಅಧಿಕೃತ ಚಿಹ್ನೆ; ಸಹಬಾಳ್ವೆ – ಒಟ್ಟಾಗಿ ಬಾಳುವುದು`,
notes:`ಭಾರತ ಏಷ್ಯಾ ಖಂಡದ ದಕ್ಷಿಣ ಭಾಗದಲ್ಲಿದೆ; ಉತ್ತರ ಮತ್ತು ಪೂರ್ವ ಗೋಳಾರ್ಧಗಳಲ್ಲಿದೆ; ಕರ್ಕಾಟಕ ಸಂಕ್ರಾಂತಿ ವೃತ್ತ ಮಧ್ಯದಲ್ಲಿ ಹಾದುಹೋಗುತ್ತದೆ. ವಿಸ್ತೀರ್ಣದಲ್ಲಿ ವಿಶ್ವದ 7ನೇ ದೊಡ್ಡ ದೇಶ. ನೆರೆಯ ದೇಶಗಳು: ಪಾಕಿಸ್ತಾನ, ಅಫ್ಘಾನಿಸ್ತಾನ (ವಾಯವ್ಯ), ನೇಪಾಳ, ಭೂತಾನ್, ಚೀನಾ (ಉತ್ತರ), ಬಾಂಗ್ಲಾದೇಶ, ಮ್ಯಾನ್ಮಾರ್ (ಪೂರ್ವ), ಶ್ರೀಲಂಕಾ (ಆಗ್ನೇಯ ದ್ವೀಪ). ಜಲರಾಶಿಗಳು: ಪೂರ್ವಕ್ಕೆ ಬಂಗಾಳಕೊಲ್ಲಿ, ಪಶ್ಚಿಮಕ್ಕೆ ಅರಬ್ಬೀ ಸಮುದ್ರ, ದಕ್ಷಿಣಕ್ಕೆ ಹಿಂದೂ ಮಹಾಸಾಗರ; ದ್ವೀಪಗಳು: ಲಕ್ಷದ್ವೀಪ, ಅಂಡಮಾನ್–ನಿಕೋಬಾರ್. ಸ್ವಾತಂತ್ರ್ಯ: 15 ಆಗಸ್ಟ್ 1947; ಭಾಷಾವಾರು ರಾಜ್ಯ ಪುನರ್ ರಚನೆ ಕಾಯ್ದೆ 1956. ಕೇಂದ್ರ ಸರ್ಕಾರದ ರಾಜಧಾನಿ ನವದೆಹಲಿ. ವೈವಿಧ್ಯದಲ್ಲಿ ಏಕತೆ: ಭಾಷೆ, ಧರ್ಮ, ಆಹಾರ, ಉಡುಪು, ಹಬ್ಬ ಬೇರೆಯಾದರೂ ನಾವೆಲ್ಲಾ ಭಾರತೀಯರು. ರಾಷ್ಟ್ರೀಯ ಚಿಹ್ನೆಗಳು: ರಾಷ್ಟ್ರಧ್ವಜ (ತ್ರಿವರ್ಣ, ಚಕ್ರ), ರಾಷ್ಟ್ರೀಯ ಲಾಂಛನ (ಸಾರನಾಥದ ಅಶೋಕ ಸ್ತಂಭದ ನಾಲ್ಕು ಸಿಂಹಗಳು), ರಾಷ್ಟ್ರಗೀತೆ (ರವೀಂದ್ರನಾಥ ಟ್ಯಾಗೋರ್). ಕಲೆ: ನೃತ್ಯಗಳು; ಕರ್ನಾಟಕದ ಯಕ್ಷಗಾನ.`,
ab:[
[`ಭಾರತದ ಸ್ಥಾನ ಮತ್ತು ವಿಸ್ತಾರ`,[
[`ಭಾರತ ಯಾವ ಖಂಡದಲ್ಲಿದೆ?`,`ವಿಶ್ವದ ಅತಿ ದೊಡ್ಡ ಖಂಡವಾದ ಏಷ್ಯಾ ಖಂಡದ ದಕ್ಷಿಣ ಭಾಗದಲ್ಲಿ.`],
[`ಭಾರತದ ಅಕ್ಷಾಂಶ ಮತ್ತು ರೇಖಾಂಶ ವಿಸ್ತರಣೆ`,`ಸುಮಾರು 8° ಉತ್ತರದಿಂದ 37° ಉತ್ತರ ಅಕ್ಷಾಂಶ; 68° ಪೂರ್ವದಿಂದ 97° ಪೂರ್ವ ರೇಖಾಂಶ.`],
[`ಭಾರತ ಯಾವ ಗೋಳಾರ್ಧಗಳಲ್ಲಿದೆ?`,`ಉತ್ತರ ಗೋಳಾರ್ಧ ಮತ್ತು ಪೂರ್ವ ಗೋಳಾರ್ಧದಲ್ಲಿ.`],
[`ಭಾರತದ ಮಧ್ಯಭಾಗದಲ್ಲಿ ಹಾದುಹೋಗುವ ವಿಶೇಷ ಅಕ್ಷಾಂಶ`,`ಕರ್ಕಾಟಕ ಸಂಕ್ರಾಂತಿ ವೃತ್ತ (23½° ಉತ್ತರ).`],
[`ಅಕ್ಷಾಂಶ ಮತ್ತು ರೇಖಾಂಶ ಎಂದರೇನು?`,`ಭೂಗೋಳದ ಮೇಲೆ ಪೂರ್ವ–ಪಶ್ಚಿಮವಾಗಿ ಎಳೆಯುವ ಕಾಲ್ಪನಿಕ ರೇಖೆಗಳು ಅಕ್ಷಾಂಶ; ಉತ್ತರ–ದಕ್ಷಿಣವಾಗಿ ಎಳೆಯುವ ಕಾಲ್ಪನಿಕ ರೇಖೆಗಳು ರೇಖಾಂಶ.`],
[`ಭಾರತದ ತುದಿಗಳು`,`ದಕ್ಷಿಣ – ಇಂದಿರಾ ಪಾಯಿಂಟ್; ಉತ್ತರ – ಇಂದಿರಾ ಕೋಲ್; ಪಶ್ಚಿಮ – ಗುಹಾರ್ ಮೋತಿ.`],
[`ಭಾರತದ ವಿಸ್ತೀರ್ಣ ಮತ್ತು ಜನಸಂಖ್ಯೆ`,`ವಿಸ್ತೀರ್ಣದಲ್ಲಿ ವಿಶ್ವದ 7ನೇ ಸ್ಥಾನ (ಸುಮಾರು 32.87 ಲಕ್ಷ ಚ.ಕಿ.ಮೀ ⚠ ಪಠ್ಯ ನೋಡಿ ದೃಢಪಡಿಸಿ); ಜನಸಂಖ್ಯೆ ಸುಮಾರು 121 ಕೋಟಿ (2011 ಜನಗಣತಿ).`]]],
[`ನೆರೆ ದೇಶಗಳು, ಜಲರಾಶಿಗಳು, ದ್ವೀಪಗಳು`,[
[`ಭಾರತದ ನೆರೆಯ ರಾಷ್ಟ್ರಗಳು`,`ಪಾಕಿಸ್ತಾನ, ಅಫ್ಘಾನಿಸ್ತಾನ, ನೇಪಾಳ, ಭೂತಾನ್, ಚೀನಾ, ಬಾಂಗ್ಲಾದೇಶ, ಮ್ಯಾನ್ಮಾರ್; ಆಗ್ನೇಯಕ್ಕೆ ಶ್ರೀಲಂಕಾ (ದ್ವೀಪ).`],
[`ಭಾರತವನ್ನು ಸುತ್ತುವರಿದ ಜಲರಾಶಿಗಳು`,`ಪೂರ್ವಕ್ಕೆ ಬಂಗಾಳಕೊಲ್ಲಿ; ಪಶ್ಚಿಮಕ್ಕೆ ಅರಬ್ಬೀ ಸಮುದ್ರ; ದಕ್ಷಿಣಕ್ಕೆ ಹಿಂದೂ ಮಹಾಸಾಗರ.`],
[`ಭಾರತದ ದ್ವೀಪಗಳು`,`ಅರಬ್ಬೀ ಸಮುದ್ರದಲ್ಲಿ ಲಕ್ಷದ್ವೀಪ; ಬಂಗಾಳಕೊಲ್ಲಿಯಲ್ಲಿ ಅಂಡಮಾನ್–ನಿಕೋಬಾರ್.`],
[`ಪರ್ಯಾಯ ದ್ವೀಪ ಮತ್ತು ದ್ವೀಪ – ವ್ಯತ್ಯಾಸ`,`ಮೂರು ಕಡೆ ನೀರು, ಒಂದು ಕಡೆ ಭೂಮಿ ಇರುವುದು ಪರ್ಯಾಯ ದ್ವೀಪ (ದಕ್ಷಿಣ ಭಾರತ); ಸುತ್ತಲೂ ನೀರು ಇರುವುದು ದ್ವೀಪ.`],
[`ಭಾರತದ ಸಮುದ್ರ ತೀರದ ಉದ್ದ ಮತ್ತು ಲಾಭ`,`ಸುಮಾರು 7,516 ಕಿ.ಮೀ. ವಿದೇಶಿ ವ್ಯಾಪಾರ, ಹಡಗು ಸಂಚಾರ, ಮೀನುಗಾರಿಕೆ, ಹಡಗು ನಿರ್ಮಾಣಕ್ಕೆ ನೆರವಾಗುತ್ತದೆ.`]]],
[`ಆಡಳಿತ ವಿಭಾಗಗಳು`,[
[`ಭಾರತ ಸ್ವತಂತ್ರವಾದ ದಿನ`,`15 ಆಗಸ್ಟ್ 1947 (ಬ್ರಿಟಿಷರು ಸುಮಾರು 200 ವರ್ಷ ಆಳಿದರು).`],
[`ರಾಜ್ಯಗಳನ್ನು ಯಾವ ಆಧಾರದಲ್ಲಿ ಪುನರ್ ರಚಿಸಲಾಯಿತು?`,`ಭಾಷೆಯ ಆಧಾರದಲ್ಲಿ – ಭಾಷಾವಾರು ರಾಜ್ಯಗಳ ಪುನರ್ ರಚನೆ ಕಾಯ್ದೆ 1956.`],
[`ಭಾರತದ ರಾಷ್ಟ್ರೀಯ ರಾಜಧಾನಿ`,`ನವದೆಹಲಿ (ಕೇಂದ್ರ ಸರ್ಕಾರದ ಪ್ರಧಾನ ಕಚೇರಿ).`],
[`ಕೇಂದ್ರ ಸರ್ಕಾರ ಮತ್ತು ರಾಜ್ಯ ಸರ್ಕಾರ – ವ್ಯತ್ಯಾಸ`,`ದೇಶದ ಆಡಳಿತ ನೋಡಿಕೊಳ್ಳುವುದು ಕೇಂದ್ರ ಸರ್ಕಾರ; ಆಯಾ ರಾಜ್ಯದ ಆಡಳಿತ ನೋಡಿಕೊಳ್ಳುವುದು ರಾಜ್ಯ ಸರ್ಕಾರ.`],
[`ಕೇಂದ್ರಾಡಳಿತ ಪ್ರದೇಶ ಎಂದರೇನು? (ಪಠ್ಯ ಪ್ರಕಾರ ಉದಾಹರಣೆ)`,`ಕೇಂದ್ರ ಸರ್ಕಾರದ ನೇರ ಆಳ್ವಿಕೆಗೆ ಒಳಪಡುವ ಪ್ರದೇಶ. ಉದಾ: ಜಮ್ಮು–ಕಾಶ್ಮೀರ, ಲಡಾಖ್, ದೆಹಲಿ, ಚಂಡೀಗಢ, ಲಕ್ಷದ್ವೀಪ, ಪುದುಚೇರಿ, ಅಂಡಮಾನ್–ನಿಕೋಬಾರ್ ಮುಂತಾದವು (ಸಂಖ್ಯೆಗಾಗಿ ⚠ ಪಠ್ಯ ನೋಡಿ).`],
[`ಚಂಡೀಗಢ ಯಾವ ರಾಜ್ಯಗಳ ರಾಜಧಾನಿ?`,`ಪಂಜಾಬ್ ಮತ್ತು ಹರಿಯಾಣ.`],
[`ಭಾರತದ ಅಧಿಕೃತ ಭಾಷೆಗಳು ಎಷ್ಟು?`,`22 ಅಧಿಕೃತ ಭಾಷೆಗಳು (ನೋಟಿನ ಹಿಂಬದಿಯಲ್ಲಿ 15 ಭಾಷೆಗಳು ಮುದ್ರಿತವಾಗಿವೆ).`]]],
[`ವೈವಿಧ್ಯದಲ್ಲಿ ಏಕತೆ ಮತ್ತು ರಾಷ್ಟ್ರೀಯ ಚಿಹ್ನೆಗಳು`,[
[`ವೈವಿಧ್ಯದಲ್ಲಿ ಏಕತೆ ಎಂದರೇನು?`,`ಭೂಸ್ವರೂಪ, ವಾಯುಗುಣ, ಭಾಷೆ, ಧರ್ಮ, ಉಡುಪು, ಆಹಾರ, ಆಚಾರ–ವಿಚಾರಗಳಲ್ಲಿ ವಿವಿಧತೆ ಇದ್ದರೂ ನಾವೆಲ್ಲರೂ ಒಂದೇ ದೇಶದ ಜನರಾಗಿ ಬದುಕುವುದು.`],
[`ಭಾವೈಕ್ಯತೆ ಎಂದರೇನು?`,`ಸರ್ವ ಧರ್ಮಗಳನ್ನು ಗೌರವಿಸುತ್ತಾ ಶಾಂತಿ, ಸಹಬಾಳ್ವೆಯಿಂದ ನಾವೆಲ್ಲರೂ ಭಾರತೀಯರು ಎಂದುಕೊಳ್ಳುವುದು.`],
[`ರಾಷ್ಟ್ರಧ್ವಜದ ಬಣ್ಣಗಳು ಮತ್ತು ಅರ್ಥ`,`ಕೇಸರಿ – ತ್ಯಾಗ; ಬಿಳಿ – ಶಾಂತಿ; ಹಸಿರು – ಸಮೃದ್ಧಿ; ಮಧ್ಯದ ಚಕ್ರ – ಪ್ರಗತಿ ಮತ್ತು ಚಲನೆ.`],
[`ರಾಷ್ಟ್ರಧ್ವಜ ತಯಾರಿಸುವ ಅಧಿಕೃತ ಸಂಸ್ಥೆ ಯಾವುದು?`,`ಹುಬ್ಬಳ್ಳಿಯ ಕರ್ನಾಟಕ ಖಾದಿ ಗ್ರಾಮೋದ್ಯೋಗ ಸಂಯುಕ್ತ ಸಂಘ (ಬೆಂಗೇರಿ).`],
[`ರಾಷ್ಟ್ರಧ್ವಜದ ಬಗ್ಗೆ ಎಚ್ಚರಿಕೆ`,`ಧ್ವಜ ಕೆಳಗೆ ಬೀಳದಂತೆ ಕಾಳಜಿ ವಹಿಸಬೇಕು; ಪ್ಲಾಸ್ಟಿಕ್ ಧ್ವಜ ಬಳಸುವುದು ಅಪರಾಧ; ಸೂರ್ಯೋದಯದಿಂದ ಸೂರ್ಯಾಸ್ತದವರೆಗೆ ಮಾತ್ರ ಹಾರಿಸಬೇಕು.`],
[`ರಾಷ್ಟ್ರೀಯ ಲಾಂಛನ ಯಾವುದು? ಅದು ಎಲ್ಲಿದೆ?`,`ಸಾರನಾಥದ ಅಶೋಕ ಸ್ತಂಭದ ಮೇಲಿನ ನಾಲ್ಕು ಸಿಂಹಗಳ ಸಿಂಹ ಬೋದಿಗೆ; ನಾಣ್ಯ, ನೋಟುಗಳಲ್ಲಿ ಇದೆ.`],
[`ರಾಷ್ಟ್ರಗೀತೆ ಬರೆದವರು ಯಾರು?`,`ರವೀಂದ್ರನಾಥ ಟ್ಯಾಗೋರ್.`],
[`ರಾಷ್ಟ್ರೀಯ ಚಿಹ್ನೆಗಳಿಗೆ ಉದಾಹರಣೆ`,`ರಾಷ್ಟ್ರಧ್ವಜ, ರಾಷ್ಟ್ರೀಯ ಲಾಂಛನ (ರಾಷ್ಟ್ರಮುದ್ರೆ), ರಾಷ್ಟ್ರಗೀತೆ.`],
[`ಕರ್ನಾಟಕದ ಪ್ರಮುಖ ನೃತ್ಯ ಕಲೆ`,`ಯಕ್ಷಗಾನ.`],
[`ಸಾಧಕರಿಗೆ ನೀಡುವ ಉನ್ನತ ಗೌರವಗಳು`,`ಪದ್ಮಶ್ರೀ, ಪದ್ಮಭೂಷಣ, ಪದ್ಮವಿಭೂಷಣ, ಭಾರತ ರತ್ನ.`]]],
[`ಪರಿಸರ ಸಂರಕ್ಷಣೆಯ ನೆನಪುಗಳು`,[
[`ಪರಿಸರ ಸಂರಕ್ಷಣೆಗೆ ನೆನಪಿಡಬೇಕಾದ ಕೆಲವು ಅಂಶಗಳು`,`ಹಸಿರು ಉಳಿಸಿ, ಬೆಳೆಸಿ; ಒಂದು ಮರ ಕಡಿದರೆ ಎರಡು ಸಸಿ ನೆಡಬೇಕು; ನೈಸರ್ಗಿಕ ಸಂಪನ್ಮೂಲ ಸಂರಕ್ಷಿಸಬೇಕು; ಮಾಲಿನ್ಯ ತಡೆಯಬೇಕು; ನೀರು ಜೀವರಕ್ಷಕ; ಅರಣ್ಯ ಸಂರಕ್ಷಣೆ ದೇಶದ ಅಭಿವೃದ್ಧಿಯ ಪ್ರಾರಂಭ.`]]]
],
qb:[
M(`ಭಾರತ ಇರುವ ಖಂಡ:`,[`ಏಷ್ಯಾ`,`ಆಫ್ರಿಕಾ`,`ಯುರೋಪ್`,`ಆಸ್ಟ್ರೇಲಿಯಾ`],0),
M(`ಭಾರತದ ಮಧ್ಯದಲ್ಲಿ ಹಾದುಹೋಗುವ ವೃತ್ತ:`,[`ಕರ್ಕಾಟಕ ಸಂಕ್ರಾಂತಿ ವೃತ್ತ`,`ಮಕರ ಸಂಕ್ರಾಂತಿ ವೃತ್ತ`,`ಆರ್ಕ್ಟಿಕ್ ವೃತ್ತ`,`ಅಂಟಾರ್ಕ್ಟಿಕ್ ವೃತ್ತ`],0),
M(`ಭಾರತದ ಪಶ್ಚಿಮಕ್ಕಿರುವ ಜಲರಾಶಿ:`,[`ಅರಬ್ಬೀ ಸಮುದ್ರ`,`ಬಂಗಾಳಕೊಲ್ಲಿ`,`ಹಿಂದೂ ಮಹಾಸಾಗರ`,`ಪೆಸಿಫಿಕ್`],0),
M(`ಲಕ್ಷದ್ವೀಪ ಇರುವುದು:`,[`ಅರಬ್ಬೀ ಸಮುದ್ರ`,`ಬಂಗಾಳಕೊಲ್ಲಿ`,`ಕೆಂಪು ಸಮುದ್ರ`,`ಕ್ಯಾಸ್ಪಿಯನ್`],0),
M(`ಭಾರತದ ನೆರೆಯ ದ್ವೀಪ ರಾಷ್ಟ್ರ:`,[`ಶ್ರೀಲಂಕಾ`,`ನೇಪಾಳ`,`ಭೂತಾನ್`,`ಚೀನಾ`],0),
M(`ಭಾರತದ ರಾಷ್ಟ್ರೀಯ ಲಾಂಛನ ಯಾವುದರ ಸಿಂಹ ಬೋದಿಗೆ?`,[`ಸಾರನಾಥದ ಅಶೋಕ ಸ್ತಂಭ`,`ಕುತುಬ್ ಮಿನಾರ್`,`ಚಾರ್ ಮಿನಾರ್`,`ತಾಜಮಹಲ್`],0),
M(`ರಾಷ್ಟ್ರಧ್ವಜದಲ್ಲಿ ಶಾಂತಿಯನ್ನು ಸೂಚಿಸುವ ಬಣ್ಣ:`,[`ಬಿಳಿ`,`ಕೇಸರಿ`,`ಹಸಿರು`,`ನೀಲಿ`],0),
M(`ಕರ್ನಾಟಕದ ಪ್ರಮುಖ ನೃತ್ಯ ಕಲೆ:`,[`ಯಕ್ಷಗಾನ`,`ಭರತನಾಟ್ಯ`,`ಕಥಕ್`,`ಗರ್ಬಾ`],0,'m'),
M(`ರಾಷ್ಟ್ರಗೀತೆ ಬರೆದವರು:`,[`ರವೀಂದ್ರನಾಥ ಟ್ಯಾಗೋರ್`,`ಬಂಕಿಮಚಂದ್ರ`,`ಕುವೆಂಪು`,`ಗಾಂಧೀಜಿ`],0,'m'),
O(`ಭಾರತಕ್ಕೆ ಸ್ವಾತಂತ್ರ್ಯ ದೊರೆತ ದಿನ ಯಾವುದು?`,`15 ಆಗಸ್ಟ್ 1947.`),
O(`ಭಾರತದ ರಾಜಧಾನಿ ಯಾವುದು?`,`ನವದೆಹಲಿ.`),
O(`ಭಾರತದ ದಕ್ಷಿಣದ ತುದಿ ಯಾವುದು?`,`ಇಂದಿರಾ ಪಾಯಿಂಟ್.`),
O(`ಭಾರತ ವಿಸ್ತೀರ್ಣದಲ್ಲಿ ವಿಶ್ವದ ಎಷ್ಟನೇ ದೊಡ್ಡ ದೇಶ?`,`7ನೇ.`),
O(`ಪರ್ಯಾಯ ದ್ವೀಪ ಎಂದರೇನು?`,`ಮೂರು ಕಡೆ ನೀರು ಮತ್ತು ಒಂದು ಕಡೆ ಭೂಮಿ ಇರುವ ಭೂಭಾಗ.`),
O(`ರಾಷ್ಟ್ರಧ್ವಜದ ಮಧ್ಯದ ಚಕ್ರ ಯಾವುದರ ಸಂಕೇತ?`,`ಪ್ರಗತಿ ಮತ್ತು ಚಲನೆಯ.`),
O(`ಭಾರತದ ಮೂರು ರಾಷ್ಟ್ರೀಯ ಚಿಹ್ನೆಗಳನ್ನು ಬರೆಯಿರಿ.`,`ರಾಷ್ಟ್ರಧ್ವಜ, ರಾಷ್ಟ್ರೀಯ ಲಾಂಛನ, ರಾಷ್ಟ್ರಗೀತೆ.`,'m'),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ಭಾರತದ ಪೂರ್ವಕ್ಕೆ ______ ಇದೆ.`,`ಬಂಗಾಳಕೊಲ್ಲಿ`),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ಭೂಮಧ್ಯ ರೇಖೆಯನ್ನು ______ ಅಕ್ಷಾಂಶ ಎನ್ನುತ್ತಾರೆ.`,`0° (ಸೊನ್ನೆ ಡಿಗ್ರಿ)`),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ______ ಪ್ರಧಾನ ರೇಖಾಂಶ ಗ್ರೀನ್ವಿಚ್ ಮೂಲಕ ಹಾದುಹೋಗುತ್ತದೆ.`,`0°`),
G(`ಖಾಲಿ ಜಾಗ ತುಂಬಿ: ಭಾರತದ ಆಡಳಿತ ನೋಡಿಕೊಳ್ಳುವ ಸರ್ಕಾರ ______ ಸರ್ಕಾರ.`,`ಕೇಂದ್ರ`),
G(`ಹೊಂದಿಸಿ: ಕೇಸರಿ ಬಣ್ಣ –`,`ತ್ಯಾಗ`),
G(`ಹೊಂದಿಸಿ: ಹಸಿರು ಬಣ್ಣ –`,`ಸಮೃದ್ಧಿ`),
G(`ಸರಿ/ತಪ್ಪು: ಪ್ಲಾಸ್ಟಿಕ್ ರಾಷ್ಟ್ರಧ್ವಜ ಬಳಸುವುದು ಅಪರಾಧ.`,`ಸರಿ`,'e'),
S(`ವೈವಿಧ್ಯದಲ್ಲಿ ಏಕತೆ ಎಂದರೇನು? ಒಂದು ಉದಾಹರಣೆ ಬರೆಯಿರಿ.`,`ಭಾಷೆ, ಧರ್ಮ, ಆಹಾರ, ಉಡುಪುಗಳಲ್ಲಿ ವೈವಿಧ್ಯವಿದ್ದರೂ ನಾವೆಲ್ಲಾ ಒಂದೇ ದೇಶದವರು. ಉದಾ: ಎಲ್ಲಾ ಧರ್ಮದವರು ಹಬ್ಬ, ಜಾತ್ರೆಗಳಲ್ಲಿ ಒಟ್ಟಾಗಿ ಭಾಗವಹಿಸುವುದು.`),
S(`ಭಾರತದ ನೆರೆಯ ರಾಷ್ಟ್ರಗಳನ್ನು ಬರೆಯಿರಿ.`,`ಪಾಕಿಸ್ತಾನ, ಅಫ್ಘಾನಿಸ್ತಾನ, ನೇಪಾಳ, ಭೂತಾನ್, ಚೀನಾ, ಬಾಂಗ್ಲಾದೇಶ, ಮ್ಯಾನ್ಮಾರ್, ಶ್ರೀಲಂಕಾ.`),
S(`ಭಾರತದ ಸಮುದ್ರ ತೀರದಿಂದಾಗುವ ಲಾಭಗಳೇನು?`,`ವಿದೇಶಿ ವ್ಯಾಪಾರ, ಹಡಗು ಸಂಚಾರ, ಮೀನುಗಾರಿಕೆ ಮತ್ತು ಹಡಗು ನಿರ್ಮಾಣಗಳ ಅಭಿವೃದ್ಧಿ.`),
S(`ರಾಷ್ಟ್ರಧ್ವಜದ ಬಣ್ಣಗಳ ಮಹತ್ವ ಬರೆಯಿರಿ.`,`ಕೇಸರಿ – ತ್ಯಾಗ; ಬಿಳಿ – ಶಾಂತಿ; ಹಸಿರು – ಸಮೃದ್ಧಿ; ಚಕ್ರ – ಪ್ರಗತಿ ಮತ್ತು ಚಲನೆ.`),
L(`ಭಾರತದ ಭೌಗೋಳಿಕ ಸ್ಥಾನ ಮತ್ತು ಸುತ್ತುವರಿದ ಜಲರಾಶಿಗಳನ್ನು ವಿವರಿಸಿ.`,`ಭಾರತ ಏಷ್ಯಾ ಖಂಡದ ದಕ್ಷಿಣ ಭಾಗದಲ್ಲಿದೆ. ಅಕ್ಷಾಂಶ ಸುಮಾರು 8° ಉ.ದಿಂದ 37° ಉ.; ರೇಖಾಂಶ 68° ಪೂ.ದಿಂದ 97° ಪೂ.; ಉತ್ತರ ಮತ್ತು ಪೂರ್ವ ಗೋಳಾರ್ಧಗಳಲ್ಲಿದೆ. ಕರ್ಕಾಟಕ ಸಂಕ್ರಾಂತಿ ವೃತ್ತ ಮಧ್ಯದಲ್ಲಿ ಹಾದುಹೋಗುತ್ತದೆ. ಪೂರ್ವಕ್ಕೆ ಬಂಗಾಳಕೊಲ್ಲಿ, ಪಶ್ಚಿಮಕ್ಕೆ ಅರಬ್ಬೀ ಸಮುದ್ರ, ದಕ್ಷಿಣಕ್ಕೆ ಹಿಂದೂ ಮಹಾಸಾಗರ. ಲಕ್ಷದ್ವೀಪ ಮತ್ತು ಅಂಡಮಾನ್–ನಿಕೋಬಾರ್ ದ್ವೀಪಗಳಿವೆ.`),
L(`ಭಾರತದ ರಾಷ್ಟ್ರೀಯ ಚಿಹ್ನೆಗಳ ಬಗ್ಗೆ ವಿವರಿಸಿ.`,`ರಾಷ್ಟ್ರಧ್ವಜ ತ್ರಿವರ್ಣ; ಕೇಸರಿ ತ್ಯಾಗ, ಬಿಳಿ ಶಾಂತಿ, ಹಸಿರು ಸಮೃದ್ಧಿ, ಮಧ್ಯದ ಚಕ್ರ ಪ್ರಗತಿ. ರಾಷ್ಟ್ರೀಯ ಲಾಂಛನ – ಸಾರನಾಥದ ಅಶೋಕ ಸ್ತಂಭದ ನಾಲ್ಕು ಸಿಂಹಗಳ ಸಿಂಹ ಬೋದಿಗೆ; ನಾಣ್ಯ, ನೋಟುಗಳಲ್ಲಿದೆ. ರಾಷ್ಟ್ರಗೀತೆ – ರವೀಂದ್ರನಾಥ ಟ್ಯಾಗೋರ್ ಅವರ ಕವನದ ಮೊದಲ ಚರಣ; ಭಾರತದ ವೈವಿಧ್ಯವನ್ನು ವಿವರಿಸುತ್ತದೆ. ಇವುಗಳನ್ನು ಗೌರವಿಸುವುದು ನಮ್ಮ ಕರ್ತವ್ಯ.`)
]});


/* ===== ಗಣಿತ ಪ್ರಕಾಶ (6ನೇ ತರಗತಿ ಭಾಗ–2) ===== */
const LSM6=[];
LSM6.push({n:6,t:`ಸುತ್ತಳತೆ ಮತ್ತು ವಿಸ್ತೀರ್ಣ`,au:`ಘಟಕ 6 (ಅಳತೆಗಳು)`,pg:1,
words:`ಸುತ್ತಳತೆ (ಪರಿಧಿ); ವಿಸ್ತೀರ್ಣ; ಆಯತ; ಚೌಕ; ತ್ರಿಭುಜ; ಸಮಬಾಹು ತ್ರಿಭುಜ; ನಿಯಮಿತ ಬಹುಭುಜಾಕೃತಿ; ಚದರ ಮೀಟರ್ (ಚ.ಮೀ.); ಚದರ ಸೆಂಟಿಮೀಟರ್ (ಚ.ಸೆಂ.ಮೀ.); ಆಯತದ ಸುತ್ತಳತೆ = 2 × (ಉದ್ದ + ಅಗಲ); ಚೌಕದ ಸುತ್ತಳತೆ = 4 × ಬಾಹು; ಸಮಬಾಹು ತ್ರಿಭುಜದ ಸುತ್ತಳತೆ = 3 × ಬಾಹು; ಆಯತದ ವಿಸ್ತೀರ್ಣ = ಉದ್ದ × ಅಗಲ; ಚೌಕದ ವಿಸ್ತೀರ್ಣ = ಬಾಹು × ಬಾಹು; ತ್ರಿಭುಜದ ವಿಸ್ತೀರ್ಣ = ½ × ಆಧಾರ × ಎತ್ತರ`,
notes:`ಸುತ್ತಳತೆ ಎಂದರೆ ಆಕೃತಿಯ ಎಲ್ಲಾ ಬಾಹುಗಳ ಉದ್ದಗಳ ಮೊತ್ತ. ಆಯತದ ಸುತ್ತಳತೆ = 2 × (ಉದ್ದ + ಅಗಲ); ಚೌಕದ ಸುತ್ತಳತೆ = 4 × ಒಂದು ಬಾಹುವಿನ ಉದ್ದ; ಸಮಬಾಹು ತ್ರಿಭುಜದ ಸುತ್ತಳತೆ = 3 × ಬಾಹು. ನಿಯಮಿತ ಬಹುಭುಜಾಕೃತಿಯಲ್ಲಿ ಎಲ್ಲಾ ಬಾಹುಗಳು ಮತ್ತು ಕೋನಗಳು ಸಮನಾಗಿರುತ್ತವೆ. ವಿಸ್ತೀರ್ಣ ಎಂದರೆ ಆಕೃತಿಯು ಆವರಿಸಿರುವ ಪ್ರದೇಶದ ಅಳತೆ; ಚದರ ಮಾನಗಳಲ್ಲಿ ಅಳೆಯುತ್ತೇವೆ (1 ಚದರ ಮಾನ = ಒಂದು ಏಕಮಾನ ಬಾಹುವಿನ ಚೌಕ). ಆಯತದ ವಿಸ್ತೀರ್ಣ = ಉದ್ದ × ಅಗಲ; ಚೌಕದ ವಿಸ್ತೀರ್ಣ = ಬಾಹು × ಬಾಹು. ಆಯತದ ಕರ್ಣವು ಅದನ್ನು ಎರಡು ಸರ್ವಸಮ ತ್ರಿಭುಜಗಳಾಗಿ ವಿಭಜಿಸುತ್ತದೆ; ಆದ್ದರಿಂದ ತ್ರಿಭುಜದ ವಿಸ್ತೀರ್ಣ ಆಯತದ ವಿಸ್ತೀರ್ಣದ ಅರ್ಧ. ಎರಡು ಆಕೃತಿಗಳು ಒಂದೇ ಸುತ್ತಳತೆ ಹೊಂದಿದ್ದರೂ ವಿಸ್ತೀರ್ಣ ಬೇರೆ ಬೇರೆ ಇರಬಹುದು; ಒಂದೇ ವಿಸ್ತೀರ್ಣವಿದ್ದರೂ ಸುತ್ತಳತೆ ಬೇರೆ ಇರಬಹುದು.`,
ab:[
[`ಉದಾಹರಣೆಗಳು – ಸುತ್ತಳತೆ (ಪುಟ 1–3)`,[
[`ಉದ್ದ 12 ಸೆಂ.ಮೀ. ಮತ್ತು ಅಗಲ 8 ಸೆಂ.ಮೀ. ಇರುವ ಆಯತದ ಸುತ್ತಳತೆ ಎಷ್ಟು?`,`2 × (12 + 8) = 2 × 20 = 40 ಸೆಂ.ಮೀ.`],
[`ಬಾಹುಗಳ ಉದ್ದ 4 ಸೆಂ.ಮೀ., 5 ಸೆಂ.ಮೀ. ಮತ್ತು 7 ಸೆಂ.ಮೀ. ಇರುವ ತ್ರಿಭುಜದ ಸುತ್ತಳತೆ?`,`4 + 5 + 7 = 16 ಸೆಂ.ಮೀ.`],
[`3 ಮೀ ಉದ್ದ, 2 ಮೀ ಅಗಲದ ಆಯತಾಕಾರದ ಮೇಜಿನ ಬಟ್ಟೆಯ ಸುತ್ತಲೂ ಲೇಸ್ ಹಾಕಲು ಬೇಕಾದ ಲೇಸ್‌ನ ಉದ್ದ?`,`2 × (3 + 2) = 2 × 5 = 10 ಮೀ`],
[`ಬದಿಯ ಉದ್ದ 75 ಮೀ ಇರುವ ಚೌಕಾಕಾರದ ಉದ್ಯಾನವನದ ಸುತ್ತ ಉಷಾ ಮೂರು ಬಾರಿ ಸುತ್ತಿದಳು. ಅವಳು ಕ್ರಮಿಸಿದ ದೂರ?`,`ಒಂದು ಸುತ್ತು = 4 × 75 = 300 ಮೀ; 3 ಸುತ್ತು = 3 × 300 = 900 ಮೀ`]]],
[`ಕಂಡುಹಿಡಿಯಿರಿ (ಪುಟ 4)`,[
[`ಆಯತದ ಸುತ್ತಳತೆ = 14 ಸೆಂ.ಮೀ.; ಅಗಲ = 2 ಸೆಂ.ಮೀ.; ಉದ್ದ = ?`,`ಉದ್ದ + ಅಗಲ = 14 ÷ 2 = 7; ಉದ್ದ = 7 − 2 = 5 ಸೆಂ.ಮೀ.`],
[`ಚೌಕದ ಸುತ್ತಳತೆ = 20 ಸೆಂ.ಮೀ.; ಬಾಹುವಿನ ಉದ್ದ = ?`,`20 ÷ 4 = 5 ಸೆಂ.ಮೀ.`],
[`ಆಯತದ ಸುತ್ತಳತೆ = 12 ಮೀ; ಉದ್ದ = 3 ಮೀ; ಅಗಲ = ?`,`ಉದ್ದ + ಅಗಲ = 6; ಅಗಲ = 6 − 3 = 3 ಮೀ`],
[`5 ಸೆಂ.ಮೀ. ಮತ್ತು 3 ಸೆಂ.ಮೀ. ಬಾಹುಗಳ ಆಯತವನ್ನು ತಂತಿಯ ತುಂಡಿನಿಂದ ಮಾಡಿ, ತಂತಿಯನ್ನು ನೇರಗೊಳಿಸಿ ಚೌಕದ ರೂಪಕ್ಕೆ ಬಾಗಿಸಿದರೆ ಚೌಕದ ಬಾಹುವಿನ ಉದ್ದ?`,`ತಂತಿಯ ಉದ್ದ = 2 × (5 + 3) = 16 ಸೆಂ.ಮೀ.; ಚೌಕದ ಬಾಹು = 16 ÷ 4 = 4 ಸೆಂ.ಮೀ.`],
[`ತ್ರಿಭುಜದ ಸುತ್ತಳತೆ 55 ಸೆಂ.ಮೀ.; ಎರಡು ಬಾಹುಗಳು 20 ಸೆಂ.ಮೀ. ಮತ್ತು 14 ಸೆಂ.ಮೀ. ಆದರೆ ಮೂರನೇ ಬಾಹು?`,`55 − (20 + 14) = 55 − 34 = 21 ಸೆಂ.ಮೀ.`],
[`150 ಮೀ × 120 ಮೀ ಉದ್ಯಾನಕ್ಕೆ ಬೇಲಿ ಹಾಕಲು ಪ್ರತಿ ಮೀಟರ್‌ಗೆ ₹40 ರಂತೆ ಎಷ್ಟು ವೆಚ್ಚ?`,`ಸುತ್ತಳತೆ = 2 × (150 + 120) = 540 ಮೀ; ವೆಚ್ಚ = 540 × 40 = ₹21,600`],
[`36 ಸೆಂ.ಮೀ. ದಾರದ ತುಂಡಿನಿಂದ (a) ಚೌಕ, (b) ಸಮಬಾಹು ತ್ರಿಭುಜ, (c) ನಿಯಮಿತ ಷಡ್ಭುಜ ಮಾಡಿದರೆ ಬಾಹುವಿನ ಉದ್ದ?`,`(a) 36 ÷ 4 = 9 ಸೆಂ.ಮೀ.; (b) 36 ÷ 3 = 12 ಸೆಂ.ಮೀ.; (c) 36 ÷ 6 = 6 ಸೆಂ.ಮೀ.`],
[`230 ಮೀ ಉದ್ದ, 160 ಮೀ ಅಗಲದ ಆಯತಾಕಾರದ ಜಮೀನಿಗೆ 3 ಸುತ್ತು ಬೇಲಿ ಹಾಕಲು ಬೇಕಾದ ಒಟ್ಟು ಉದ್ದ?`,`ಒಂದು ಸುತ್ತು = 2 × (230 + 160) = 780 ಮೀ; 3 ಸುತ್ತು = 2340 ಮೀ`]]],
[`ಮಾತಾ ಪಚ್ಚಿ! – ಓಟದ ಟ್ರ್ಯಾಕ್ (ಪುಟ 5) (ಅಕ್ಷಿಯ ಟ್ರ್ಯಾಕ್ ಒಂದು ಸುತ್ತು = 220 ಮೀ)`,[
[`ಟ್ರ್ಯಾಕ್ ಆಯತದ ಉದ್ದ 70 ಮೀ, ಅಗಲ 40 ಮೀ. ಒಂದು ಸುತ್ತಿನ ದೂರ?`,`2 × (70 + 40) = 220 ಮೀ`],
[`ಅಕ್ಷಿ 5 ಸುತ್ತು ಓಡಿದರೆ ಒಟ್ಟು ದೂರ?`,`5 × 220 = 1100 ಮೀ`],
[`ತೋಷಿ 7 ಸುತ್ತು ಓಡಿದರೆ ಒಟ್ಟು ದೂರ? ಯಾರು ಹೆಚ್ಚು ದೂರ ಓಡಿದರು?`,`7 × 220 = 1540 ಮೀ; ತೋಷಿ ಹೆಚ್ಚು ದೂರ ಓಡಿದಳು (1540 − 1100 = 440 ಮೀ ಹೆಚ್ಚು)`]]],
[`ವಿಸ್ತೀರ್ಣ – ಉದಾಹರಣೆಗಳು (ಪುಟ 9)`,[
[`5 ಮೀ × 4 ಮೀ ನೆಲದ ಮೇಲೆ 3 ಮೀ × 3 ಮೀ ಕಾರ್ಪೆಟ್ ಹಾಸಿದರೆ ಹಾಸದ ಭಾಗದ ವಿಸ್ತೀರ್ಣ?`,`ನೆಲ = 5 × 4 = 20 ಚ.ಮೀ.; ಕಾರ್ಪೆಟ್ = 3 × 3 = 9 ಚ.ಮೀ.; ಉಳಿದ = 20 − 9 = 11 ಚ.ಮೀ.`],
[`12 ಮೀ × 10 ಮೀ ಜಮೀನಿನ 4 ಮೂಲೆಗಳಲ್ಲಿ 4 ಮೀ ಬಾಹುವಿನ ಚೌಕ ಹೂವಿನ ಹಾಸುಗಳಿವೆ. ಉಳಿದ ಭಾಗದ ವಿಸ್ತೀರ್ಣ?`,`ಜಮೀನು = 120 ಚ.ಮೀ.; 4 ಹಾಸುಗಳು = 4 × 16 = 64 ಚ.ಮೀ.; ಉಳಿದ = 120 − 64 = 56 ಚ.ಮೀ.`]]],
[`ಕಂಡುಹಿಡಿಯಿರಿ (ಪುಟ 10)`,[
[`25 ಮೀ ಉದ್ದದ ಆಯತಾಕಾರದ ಉದ್ಯಾನವನದ ವಿಸ್ತೀರ್ಣ 300 ಚ.ಮೀ. ಅಗಲ ಎಷ್ಟು?`,`300 ÷ 25 = 12 ಮೀ`],
[`500 ಮೀ ಉದ್ದ, 200 ಮೀ ಅಗಲದ ಜಮೀನಿಗೆ ನೂರು ಚ.ಮೀ.ಗೆ ₹8 ರಂತೆ ನೆಲಹಾಸು ಹಾಕಲು ಎಷ್ಟು ವೆಚ್ಚ?`,`ವಿಸ್ತೀರ್ಣ = 500 × 200 = 1,00,000 ಚ.ಮೀ.; ನೂರರ ಗುಂಪು = 1000; ವೆಚ್ಚ = 1000 × 8 = ₹8000`],
[`100 ಮೀ × 50 ಮೀ ತೋಟದಲ್ಲಿ ಪ್ರತಿ ತೆಂಗಿನ ಮರಕ್ಕೆ 25 ಚ.ಮೀ. ಬೇಕು. ಗರಿಷ್ಠ ಮರಗಳು?`,`ವಿಸ್ತೀರ್ಣ = 5000 ಚ.ಮೀ.; ಮರಗಳು = 5000 ÷ 25 = 200`]]],
[`ಕಂಡುಹಿಡಿಯಿರಿ (ಪುಟ 20) ⚠`,[
[`5 ಮೀ × 10 ಮೀ ಮತ್ತು 2 ಮೀ × 7 ಮೀ ಆಯತಗಳ ವಿಸ್ತೀರ್ಣಗಳ ಮೊತ್ತಕ್ಕೆ ಸಮನಾದ ಆಯತ ಬೇಕಾದರೆ ವಿಸ್ತೀರ್ಣ?`,`50 + 14 = 64 ಚ.ಮೀ. (ಉದಾ: 8 ಮೀ × 8 ಮೀ ಅಥವಾ 16 ಮೀ × 4 ಮೀ)`],
[`50 ಮೀ ಉದ್ದದ ಆಯತಾಕಾರದ ಉದ್ಯಾನದ ವಿಸ್ತೀರ್ಣ 1000 ಚ.ಮೀ. ಅಗಲ?`,`1000 ÷ 50 = 20 ಮೀ`],
[`ಕೋಣೆಯ ನೆಲ 5 ಮೀ × 4 ಮೀ; 3 ಮೀ × 3 ಮೀ ಕಾರ್ಪೆಟ್ ಹಾಸಿದರೆ ಹಾಸದ ಭಾಗ?`,`20 − 9 = 11 ಚ.ಮೀ.`]]]
],
qb:[

M(`ಚೌಕದ ಸುತ್ತಳತೆಯ ಸೂತ್ರ:`,[`ಬಾಹು × ಬಾಹು`,`2 × ಬಾಹು`,`4 × ಬಾಹು`,`3 × ಬಾಹು`],2),
M(`ಸಮಬಾಹು ತ್ರಿಭುಜದ ಸುತ್ತಳತೆ:`,[`2 × ಬಾಹು`,`3 × ಬಾಹು`,`4 × ಬಾಹು`,`ಬಾಹು × ಬಾಹು`],1),
M(`ಆಯತದ ವಿಸ್ತೀರ್ಣದ ಸೂತ್ರ:`,[`ಉದ್ದ + ಅಗಲ`,`2 (ಉದ್ದ + ಅಗಲ)`,`ಉದ್ದ × ಅಗಲ`,`ಬಾಹು × 4`],2),
M(`ಚೌಕದ ವಿಸ್ತೀರ್ಣದ ಸೂತ್ರ:`,[`4 × ಬಾಹು`,`ಬಾಹು × ಬಾಹು`,`2 × ಬಾಹು`,`ಬಾಹು + ಬಾಹು`],1),
M(`ತ್ರಿಭುಜದ ವಿಸ್ತೀರ್ಣ =`,[`ಆಧಾರ × ಎತ್ತರ`,`½ × ಆಧಾರ × ಎತ್ತರ`,`2 × ಆಧಾರ × ಎತ್ತರ`,`ಆಧಾರ + ಎತ್ತರ`],1),
M(`ವಿಸ್ತೀರ್ಣವನ್ನು ಅಳೆಯುವ ಮಾನ:`,[`ಮೀಟರ್`,`ಚದರ ಮೀಟರ್`,`ಲೀಟರ್`,`ಕಿಲೋಗ್ರಾಂ`],1),
M(`12 ಸೆಂ.ಮೀ. × 8 ಸೆಂ.ಮೀ. ಆಯತದ ಸುತ್ತಳತೆ:`,[`20 ಸೆಂ.ಮೀ.`,`40 ಸೆಂ.ಮೀ.`,`96 ಸೆಂ.ಮೀ.`,`80 ಸೆಂ.ಮೀ.`],1),
M(`ಬಾಹು 4, 5, 7 ಸೆಂ.ಮೀ. ಇರುವ ತ್ರಿಭುಜದ ಸುತ್ತಳತೆ:`,[`16 ಸೆಂ.ಮೀ.`,`140 ಸೆಂ.ಮೀ.`,`12 ಸೆಂ.ಮೀ.`,`20 ಸೆಂ.ಮೀ.`],0),
M(`ಚೌಕದ ಸುತ್ತಳತೆ 20 ಸೆಂ.ಮೀ. ಆದರೆ ಬಾಹು:`,[`4`,`5`,`10`,`80`],1),
M(`ಬಾಹು 75 ಮೀ ಇರುವ ಚೌಕಾಕಾರದ ಉದ್ಯಾನದ ಒಂದು ಸುತ್ತಿನ ದೂರ:`,[`150 ಮೀ`,`225 ಮೀ`,`300 ಮೀ`,`5625 ಮೀ`],2),
M(`ಉದ್ದ 25 ಮೀ, ವಿಸ್ತೀರ್ಣ 300 ಚ.ಮೀ. ಇರುವ ಆಯತದ ಅಗಲ:`,[`10 ಮೀ`,`12 ಮೀ`,`15 ಮೀ`,`20 ಮೀ`],1,'m'),
M(`5 ಮೀ × 4 ಮೀ ನೆಲದ ವಿಸ್ತೀರ್ಣ:`,[`9 ಚ.ಮೀ.`,`18 ಚ.ಮೀ.`,`20 ಚ.ಮೀ.`,`40 ಚ.ಮೀ.`],2),
M(`ನಿಯಮಿತ ಷಡ್ಭುಜದ ಬಾಹುವಿನ ಉದ್ದ 6 ಸೆಂ.ಮೀ. ಆದರೆ ಸುತ್ತಳತೆ:`,[`12`,`24`,`36`,`42`],2),

notes:`ವೃತ್ತದ ಮೇಲಿನ ಎಲ್ಲಾ ಬಿಂದುಗಳು ಕೇಂದ್ರದಿಂದ ಒಂದೇ ದೂರದಲ್ಲಿರುತ್ತವೆ; ಈ ದೂರವೇ ತ್ರಿಜ್ಯ. ವೃತ್ತ ಮತ್ತು ಅದರ ಭಾಗಗಳನ್ನು ಕೈವಾರದಿಂದ ರಚಿಸಬಹುದು. ಆಯತ: R1) ಅಭಿಮುಖ ಬಾಹುಗಳು ಸಮ; R2) ಎಲ್ಲಾ ಕೋನಗಳೂ 90°. ಚೌಕ: S1) ಎಲ್ಲಾ ಬಾಹುಗಳೂ ಸಮ; S2) ಎಲ್ಲಾ ಕೋನಗಳೂ 90°. ಆಯತ ABCD ಯಲ್ಲಿ AB ಮತ್ತು CD, AD ಮತ್ತು BC ಅಭಿಮುಖ ಬಾಹುಗಳು. ಚೌಕ/ಆಯತ ರಚಿಸುವಾಗ ಬಾಹು ಉದ್ದವನ್ನು ಅಳೆದು, ಕೋನಮಾಪಕ ಅಥವಾ ಕೈವಾರದಿಂದ ಲಂಬರೇಖೆ ಎಳೆಯುತ್ತೇವೆ. ಎರಡು ಬಿಂದುಗಳಿಂದ ಸಮ ದೂರದಲ್ಲಿರುವ ಬಿಂದುವನ್ನು, ಎರಡು ಒಂದೇ ತ್ರಿಜ್ಯದ ವೃತ್ತಗಳು ಛೇದಿಸುವ ಬಿಂದುವಾಗಿ ಕಂಡುಹಿಡಿಯಬಹುದು. ಕರ್ಣಗಳು ಆಯತವನ್ನು ಎರಡು ಸರ್ವಸಮ ತ್ರಿಭುಜಗಳಾಗಿ ವಿಭಜಿಸುತ್ತವೆ.`,

[`ರಚಿಸಿ (ಪುಟ 66)`,[
[`ಬಾಹುಗಳು 4 ಸೆಂ.ಮೀ. ಮತ್ತು 6 ಸೆಂ.ಮೀ. ಇರುವಂತೆ ಆಯತ ರಚಿಸಿ. R1, R2 ಪರೀಕ್ಷೆ.`,`ಉದ್ದ 6 ಸೆಂ.ಮೀ., ಅಗಲ 4 ಸೆಂ.ಮೀ. ಆಯತ ರಚಿಸಿ ಅಳೆದರೆ ಅಭಿಮುಖ ಬಾಹುಗಳು ಸಮ (6, 6, 4, 4) ಮತ್ತು ಎಲ್ಲಾ ಕೋನ 90°; ಎರಡೂ ಗುಣಗಳು ಪಾಲಿಸಲ್ಪಡುತ್ತವೆ.`],
[`ಎಲ್ಲಾ ಕೋನಗಳು 90°, ಅಭಿಮುಖ ಬಾಹುಗಳು ಅಸಮ ಇರುವ 4-ಬಾಹುಗಳ ಆಕೃತಿ ರಚಿಸಲು ಸಾಧ್ಯವೇ?`,`ಇಲ್ಲ. ಎಲ್ಲಾ ಕೋನ 90° ಆದರೆ ಅಭಿಮುಖ ಬಾಹುಗಳು ಸಮವಾಗಿಯೇ ಇರುತ್ತವೆ (ಅದು ಆಯತ).`]]],
[`ಆಯತದಲ್ಲಿ ಅನ್ವೇಷಣೆ – X ಮತ್ತು Y ಬಿಂದುಗಳು (ಪುಟ 66–67)`,[
[`AB = 7 ಸೆಂ.ಮೀ., BC = 4 ಸೆಂ.ಮೀ. ಆಯತದಲ್ಲಿ AX = BY = 5 ಮಿ.ಮೀ. ಆದಾಗ XY ಉದ್ದ?`,`XY = 7 ಸೆಂ.ಮೀ. (AB ಗೆ ಸಮ ಮತ್ತು ಸಮಾನಾಂತರ)`],
[`AX = BY = 1 ಸೆಂ.ಮೀ. ಆದಾಗ XY?`,`7 ಸೆಂ.ಮೀ.`],
[`AX = 4 ಸೆಂ.ಮೀ. (A = X ಅಲ್ಲ, D = X ಆದಾಗ) XY ಹೆಚ್ಚು ಅಥವಾ ಕಡಿಮೆ ಯಾವಾಗ?`,`X ಮತ್ತು Y ಸಮದೂರದಲ್ಲಿದ್ದಾಗ XY = AB = 7 ಸೆಂ.ಮೀ.; ಅಸಮ ದೂರದಲ್ಲಿದ್ದಾಗ ಕರ್ಣದ ಕಡೆಗೆ ಉದ್ದ ಹೆಚ್ಚುತ್ತದೆ.`]]],
[`ಭಾಗ 8.3 – ವಿಭಜಿತ ಆಯತಗಳು (ಪುಟ 68–70)`,[
[`ಆಯತವನ್ನು ಎರಡು ತದ್ರೂಪ ಚೌಕಗಳಾಗಿ ವಿಭಜಿಸಲು ಯಾವ ಬಾಹು ಅಳತೆಗಳು ಬೇಕು?`,`ಉದ್ದ = 2 × ಅಗಲ (ಉದಾ: 8 ಸೆಂ.ಮೀ. × 4 ಸೆಂ.ಮೀ.).`],
[`ಆಯತವನ್ನು ಮೂರು ತದ್ರೂಪ ಚೌಕಗಳಾಗಿ ವಿಭಜಿಸಲು?`,`ಉದ್ದ = 3 × ಅಗಲ (ಉದಾ: 12 ಸೆಂ.ಮೀ. × 4 ಸೆಂ.ಮೀ.).`],
[`ಆಯತದೊಳಗೊಂದು ಚೌಕ – 8 ಸೆಂ.ಮೀ. × 4 ಸೆಂ.ಮೀ. ಆಯತದ ಮಧ್ಯದ ಚೌಕದ ಬಾಹು?`,`4 ಸೆಂ.ಮೀ. (ಆಯತದ ಅಗಲಕ್ಕೆ ಸಮ); ಎರಡೂ ಕೇಂದ್ರ ಒಂದೇ.`]]],
[`ಭಾಗ 8.5 – ಆಯತ ಮತ್ತು ಚೌಕಗಳ ಕರ್ಣಗಳು (ಪುಟ 72–76)`,[
[`ಆಯತದ ಕರ್ಣಗಳು ಅಭಿಮುಖ ಕೋನಗಳನ್ನು ಸಮವಾಗಿ ವಿಭಜಿಸುತ್ತವೆಯೇ?`,`ಚೌಕದಲ್ಲಿ ಮಾತ್ರ ಸಮವಾಗಿ (45°, 45°) ವಿಭಜಿಸುತ್ತವೆ; ಸಾಮಾನ್ಯ ಆಯತದಲ್ಲಿ ಇಲ್ಲ.`],
[`ಕರ್ಣವು ಅಭಿಮುಖ ಕೋನಗಳನ್ನು 60° ಮತ್ತು 30° ರಲ್ಲಿ ವಿಭಜಿಸುವ ಆಯತ ರಚಿಸುವ ವಿಧಾನ`,`AB ರೇಖೆ ಎಳೆದು B ನಲ್ಲಿ 90° ಲಂಬ ರೇಖೆ, A ನಲ್ಲಿ 60° ಕೋನ ಮಾಡಿ C ಗುರುತಿಸಿ; ನಂತರ D ಯನ್ನು A ಮತ್ತು C ಯ ಲಂಬಗಳ ಛೇದನದಿಂದ ಅಥವಾ AD = BC ಆಗಿ ಗುರುತಿಸಿ ಆಯತ ಪೂರ್ಣಗೊಳಿಸಿ.`],
[`ಒಂದು ಬಾಹು 5 ಸೆಂ.ಮೀ., ಕರ್ಣ 7 ಸೆಂ.ಮೀ. ಇರುವ ಆಯತವನ್ನು ಹೇಗೆ ರಚಿಸುವಿರಿ?`,`DC = 5 ಸೆಂ.ಮೀ. ಎಳೆಯಿರಿ; C ನಲ್ಲಿ 90° ಲಂಬ ರೇಖೆ l ಎಳೆಯಿರಿ; D ಕೇಂದ್ರ, 7 ಸೆಂ.ಮೀ. ತ್ರಿಜ್ಯದ ವೃತ್ತ l ರೇಖೆಯನ್ನು ಛೇದಿಸುವ ಬಿಂದು B; D ಮತ್ತು B ಗಳಲ್ಲಿ ಲಂಬಗಳನ್ನೆಳೆದು A ಪಡೆಯಿರಿ.`],
[`ಇತರ ರಚನೆಗಳು: ಕರ್ಣ ಅಭಿಮುಖ ಕೋನಗಳನ್ನು 50° ಮತ್ತು 40° ಆಗಿ ವಿಭಜಿಸುವ ಆಯತ`,`ಕರ್ಣದಿಂದ ಉಂಟಾಗುವ ತ್ರಿಭುಜದಲ್ಲಿ ಒಂದು ಕೋನ 50°, ಇನ್ನೊಂದು 40°, ಮೂರನೆಯದು 90° ಆಗಿರುತ್ತದೆ; ಆ ತ್ರಿಭುಜ ರಚಿಸಿ ಆಯತ ಪೂರ್ಣಗೊಳಿಸಿ.`]]],
[`ಭಾಗ 8.6 – ಎರಡು ದತ್ತ ಬಿಂದುಗಳಿಂದ ಸಮಾನ ದೂರದ ಬಿಂದು (ಮನೆ ರಚನೆ) (ಪುಟ 77–83)`,[
[`ಮನೆಯ ರಚನೆಯಲ್ಲಿ A ಬಿಂದುವನ್ನು ಹೇಗೆ ಗುರುತಿಸುತ್ತೀರಿ?`,`B ಮತ್ತು C ಗಳನ್ನು ಕೇಂದ್ರಗಳಾಗಿ 5 ಸೆಂ.ಮೀ. ತ್ರಿಜ್ಯದ ವೃತ್ತಗಳನ್ನು ಎಳೆದರೆ ಅವು ಛೇದಿಸುವ ಬಿಂದು A; ಅದು B ಮತ್ತು C ಗಳಿಂದ 5 ಸೆಂ.ಮೀ. ದೂರದಲ್ಲಿದೆ.`],
[`ವೃತ್ತದ ಮೇಲಿನ ಬಿಂದುಗಳು ಕೇಂದ್ರದಿಂದ ಯಾವ ದೂರದಲ್ಲಿರುತ್ತವೆ?`,`ಎಲ್ಲಾ ಬಿಂದುಗಳೂ ಕೇಂದ್ರದಿಂದ ಒಂದೇ ದೂರದಲ್ಲಿ (ತ್ರಿಜ್ಯದ ದೂರ) ಇರುತ್ತವೆ.`],
[`ಇಡೀ ವೃತ್ತ ಬೇಕೇ? ಕೇವಲ ಕಂಸ ಸಾಕೇ?`,`ಬಿಂದು ಗುರುತಿಸಲು ಛೇದಿಸುವ ಜಾಗದ ಕಂಸಗಳು ಮಾತ್ರ ಸಾಕು; ಪೂರ್ಣ ವೃತ್ತ ಅವಶ್ಯಕವಲ್ಲ.`]]]
],
qb:[
M(`ವೃತ್ತದ ಮೇಲಿನ ಎಲ್ಲಾ ಬಿಂದುಗಳು ಯಾವುದರಿಂದ ಸಮ ದೂರದಲ್ಲಿರುತ್ತವೆ?`,[`ವ್ಯಾಸ`,`ಕೇಂದ್ರ`,`ಜ್ಯಾ`,`ಕರ್ಣ`],1),
M(`ವೃತ್ತ ರಚಿಸಲು ಬಳಸುವ ಸಾಧನ:`,[`ಅಳತೆಪಟ್ಟಿ`,`ಕೈವಾರ`,`ಕೋನಮಾಪಕ`,`ಕತ್ತರಿ`],1),
M(`ವೃತ್ತದ ಕೇಂದ್ರದಿಂದ ಅದರ ಮೇಲಿನ ಬಿಂದುವಿಗಿರುವ ದೂರ:`,[`ವ್ಯಾಸ`,`ತ್ರಿಜ್ಯ`,`ಜ್ಯಾ`,`ಕರ್ಣ`],1),
M(`ಆಯತದ ಲಕ್ಷಣ R2:`,[`ಎಲ್ಲಾ ಬಾಹುಗಳು ಸಮ`,`ಎಲ್ಲಾ ಕೋನಗಳು 90°`,`ಕರ್ಣಗಳು ಸಮ ಇಲ್ಲ`,`3 ಬಾಹುಗಳು`],1),
M(`ಚೌಕದ ಲಕ್ಷಣ S1:`,[`ಎಲ್ಲಾ ಬಾಹುಗಳು ಸಮ`,`ಅಭಿಮುಖ ಬಾಹುಗಳು ಮಾತ್ರ ಸಮ`,`ಯಾವುದೂ ಅಲ್ಲ`,`ಕೋನಗಳು 60°`],0),
M(`ಚೌಕವು ಇದರ ವಿಶೇಷ ರೂಪ:`,[`ತ್ರಿಭುಜ`,`ಆಯತ`,`ವೃತ್ತ`,`ಷಡ್ಭುಜ`],1),
M(`ಆಯತ ABCD ಯಲ್ಲಿ AB ಗೆ ಅಭಿಮುಖ ಬಾಹು:`,[`BC`,`CD`,`AD`,`AC`],1),
M(`ಆಯತದ ಕರ್ಣಗಳ ಸಂಖ್ಯೆ:`,[`1`,`2`,`3`,`4`],1),
M(`ಲಂಬ ರೇಖೆ ಎಳೆಯಲು ಬಳಸುವ ಕೋನ:`,[`45°`,`60°`,`90°`,`180°`],2),
M(`8 ಸೆಂ.ಮೀ. × 4 ಸೆಂ.ಮೀ. ಆಯತವನ್ನು ಎರಡು ತದ್ರೂಪ ಚೌಕಗಳಾಗಿ ವಿಭಜಿಸಿದರೆ ಚೌಕದ ಬಾಹು:`,[`2`,`4`,`8`,`6`],1),
M(`ಕರ್ಣಗಳು ಆಯತವನ್ನು ವಿಭಜಿಸುವ ತ್ರಿಭುಜಗಳು:`,[`ಅಸಮ`,`ಸರ್ವಸಮ`,`ವೃತ್ತ`,`ಚೌಕ`],1),
M(`ಒಂದು ಬಿಂದುವಿನಿಂದ ಸಮ ದೂರದಲ್ಲಿರುವ ಎಲ್ಲಾ ಬಿಂದುಗಳು ರಚಿಸುವ ಆಕೃತಿ:`,[`ರೇಖೆ`,`ವೃತ್ತ`,`ತ್ರಿಭುಜ`,`ಆಯತ`],1),
M(`A ಮತ್ತು B ಬಿಂದುಗಳಿಂದ 5 ಸೆಂ.ಮೀ. ದೂರದ ಬಿಂದು ಸಿಗುವುದು:`,[`ಎರಡು ವೃತ್ತಗಳ ಛೇದನ ಬಿಂದು`,`ರೇಖೆಯ ಮಧ್ಯ`,`ಕೋನದ ಶೃಂಗ`,`ಯಾವುದೂ ಅಲ್ಲ`],0),
O(`ವೃತ್ತದ ಕೇಂದ್ರ ಮತ್ತು ವೃತ್ತದ ಮೇಲಿನ ಬಿಂದುವಿನ ನಡುವಿನ ದೂರಕ್ಕೆ ಏನೆನ್ನುತ್ತಾರೆ?`,`ತ್ರಿಜ್ಯ`),
O(`ಆಯತದ ಎರಡು ಲಕ್ಷಣಗಳು ಯಾವುವು?`,`ಅಭಿಮುಖ ಬಾಹುಗಳು ಸಮ; ಎಲ್ಲಾ ಕೋನಗಳು 90°.`),
O(`ಚೌಕದ ಎರಡು ಲಕ್ಷಣಗಳು ಯಾವುವು?`,`ಎಲ್ಲಾ ಬಾಹುಗಳು ಸಮ; ಎಲ್ಲಾ ಕೋನಗಳು 90°.`),
O(`ಆಯತ ABCD ಯ ಇನ್ನೊಂದು ಹೆಸರು ಬರೆಯಿರಿ.`,`BCDA (ಅಥವಾ CDAB, DABC, ADCB, BADC, DCBA) – ಮೂಲೆಗಳಿಂದ ಕ್ರಮವಾಗಿ ಹೆಸರಿಸಬೇಕು.`),
O(`ಕೈವಾರದಲ್ಲಿ 5 ಸೆಂ.ಮೀ. ತೆಗೆದು ಚಿತ್ರಿಸುವ ವೃತ್ತದ ತ್ರಿಜ್ಯ?`,`5 ಸೆಂ.ಮೀ.`),
O(`AB = 7 ಸೆಂ.ಮೀ. ಆಯತದಲ್ಲಿ AX = BY ಆದರೆ XY ಉದ್ದ?`,`7 ಸೆಂ.ಮೀ.`),
O(`ಆಯತದ ಒಂದು ಬಾಹು 5 ಸೆಂ.ಮೀ. ಮತ್ತು ಕರ್ಣ 7 ಸೆಂ.ಮೀ. ಆಗಿದ್ದರೆ ರಚನೆಯಲ್ಲಿ ಮೊದಲು ಯಾವ ಬಾಹು ರಚಿಸಬಹುದು?`,`5 ಸೆಂ.ಮೀ. ಉದ್ದದ ಬಾಹು DC`),
G(`ಸರಿ/ತಪ್ಪು: ಚೌಕವು ಆಯತದ ಎಲ್ಲಾ ಗುಣಲಕ್ಷಣಗಳನ್ನು ಪಾಲಿಸುತ್ತದೆ.`,`ಸರಿ`),
G(`ಸರಿ/ತಪ್ಪು: ಎಲ್ಲಾ ಕೋನ 90° ಇರುವ 4 ಬಾಹುಗಳ ಆಕೃತಿಯ ಅಭಿಮುಖ ಬಾಹುಗಳು ಅಸಮವಾಗಿರಲು ಸಾಧ್ಯ.`,`ತಪ್ಪು (ಅವು ಸಮ ಇರುತ್ತವೆ)`),
G(`ಸರಿ/ತಪ್ಪು: ಚೌಕವನ್ನು ತಿರುಗಿಸಿದರೆ ಅದು ಚೌಕ ಆಗುವುದಿಲ್ಲ.`,`ತಪ್ಪು (ಚೌಕವಾಗಿಯೇ ಉಳಿಯುತ್ತದೆ)`),
G(`ಸರಿ/ತಪ್ಪು: ಯಾವುದೇ ಆಯತದ ಕರ್ಣಗಳು ಅಭಿಮುಖ ಕೋನಗಳನ್ನು ಸಮವಾಗಿ ವಿಭಜಿಸುತ್ತವೆ.`,`ತಪ್ಪು (ಚೌಕದಲ್ಲಿ ಮಾತ್ರ)`),
S(`ಆಯತ ಮತ್ತು ಚೌಕಗಳ ನಡುವಿನ ವ್ಯತ್ಯಾಸ ಬರೆಯಿರಿ.`,`ಆಯತದಲ್ಲಿ ಅಭಿಮುಖ ಬಾಹುಗಳು ಮಾತ್ರ ಸಮ; ಚೌಕದಲ್ಲಿ ಎಲ್ಲಾ ಬಾಹುಗಳು ಸಮ. ಎರಡರಲ್ಲೂ ಎಲ್ಲಾ ಕೋನ 90°.`),
S(`6 ಸೆಂ.ಮೀ. ಬಾಹುವಿನ ಚೌಕ ರಚಿಸುವ ಹಂತಗಳನ್ನು ಬರೆಯಿರಿ.`,`PQ = 6 ಸೆಂ.ಮೀ. ಎಳೆಯಿರಿ; P ಮತ್ತು Q ಗಳಲ್ಲಿ 90° ಲಂಬಗಳನ್ನು ಎಳೆದು ಪ್ರತಿಯೊಂದರ ಮೇಲೂ 6 ಸೆಂ.ಮೀ. ಗುರುತಿಸಿ S ಮತ್ತು R ಪಡೆಯಿರಿ; S ಮತ್ತು R ಸೇರಿಸಿ.`),
S(`ಮನೆ ರಚನೆಯಲ್ಲಿ A ಬಿಂದುವನ್ನು ಹೇಗೆ ಗುರುತಿಸುತ್ತೀರಿ?`,`B ಮತ್ತು C ಕೇಂದ್ರಗಳಾಗಿ 5 ಸೆಂ.ಮೀ. ತ್ರಿಜ್ಯದ ಕಂಸಗಳನ್ನು ಎಳೆದರೆ ಅವು ಸಂಧಿಸುವ ಬಿಂದುವೇ A.`),
S(`ಕರ್ಣ 7 ಸೆಂ.ಮೀ. ಮತ್ತು ಒಂದು ಬಾಹು 5 ಸೆಂ.ಮೀ. ಇರುವ ಆಯತ ರಚಿಸುವ ವಿಧಾನ ಬರೆಯಿರಿ.`,`DC = 5 ಸೆಂ.ಮೀ.; C ನಲ್ಲಿ ಲಂಬ ರೇಖೆ l; D ಕೇಂದ್ರ 7 ಸೆಂ.ಮೀ. ತ್ರಿಜ್ಯದ ಕಂಸ l ಅನ್ನು ಛೇದಿಸುವ ಬಿಂದು B; B ಮತ್ತು D ಗಳಲ್ಲಿ ಲಂಬಗಳ ಛೇದನ ಬಿಂದು A.`),
L(`ಆಯತವನ್ನು ಎರಡು ತದ್ರೂಪ ಚೌಕಗಳಾಗಿ ಮತ್ತು ಮೂರು ತದ್ರೂಪ ಚೌಕಗಳಾಗಿ ವಿಭಜಿಸಲು ಆಯತದ ಅಳತೆಗಳು ಹೇಗಿರಬೇಕು? ಉದಾಹರಣೆ ಕೊಡಿ.`,`ಎರಡು ಚೌಕಗಳಿಗೆ ಉದ್ದ = 2 × ಅಗಲ (ಉದಾ: 8 ಸೆಂ.ಮೀ. × 4 ಸೆಂ.ಮೀ.); ಮೂರು ಚೌಕಗಳಿಗೆ ಉದ್ದ = 3 × ಅಗಲ (ಉದಾ: 12 ಸೆಂ.ಮೀ. × 4 ಸೆಂ.ಮೀ.). ಅಗಲವೇ ಚೌಕದ ಬಾಹು.`),
L(`ಕೈವಾರ ಬಳಸಿ 5 ಸೆಂ.ಮೀ. ಬಾಹುಗಳ "ಮನೆ" ಚಿತ್ರ ರಚಿಸುವ ಹಂತಗಳನ್ನು ವಿವರಿಸಿ.`,`ಹಂತ 1: D, E ಗಳನ್ನು 5 ಸೆಂ.ಮೀ. ಅಂತರದಲ್ಲಿ ಗುರುತಿಸಿ ಲಂಬಗಳನ್ನೆಳೆದು 5 ಸೆಂ.ಮೀ. ಬಾಹು ಮಾಡಿ B, C ಪಡೆಯಿರಿ. ಹಂತ 2: B, C ಕೇಂದ್ರ 5 ಸೆಂ.ಮೀ. ತ್ರಿಜ್ಯದ ವೃತ್ತ ಕಂಸಗಳ ಛೇದನ A. ಹಂತ 3: A ನಿಂದ B ಮತ್ತು C ಗೆ ರೇಖೆ ಎಳೆಯಿರಿ. ಹಂತ 4: ಕಂಸಗಳನ್ನು ಎಳೆದು ಮನೆ ಪೂರ್ಣಗೊಳಿಸಿ.`)
]});

LSM6.push({n:9,t:`ಸಮಮಿತಿ`,au:`ಘಟಕ 9 (ರೇಖಾಗಣಿತ)`,pg:85,
words:`ಸಮಮಿತಿ; ಸಮಮಿತಿ ರೇಖೆ (ಸಮಮಿತಿ ಅಕ್ಷ); ದರ್ಪಣಾರ್ಧಗಳು; ಪ್ರತಿಫಲನ ಸಮಮಿತಿ; ಭ್ರಮಣ ಸಮಮಿತಿ; ಭ್ರಮಣ ಕೇಂದ್ರ; ಭ್ರಮಣ ಸಮಮಿತಿ ಕೋನ; ಪುನರಾವರ್ತಿತ ವಿನ್ಯಾಸ; ನಿಯಮಿತ ಬಹುಭುಜಾಕೃತಿ; 360° ಪೂರ್ಣ ಸುತ್ತು; ತ್ರಿಜ್ಯೀಯ ಬಾಹು`,
notes:`ಒಂದು ಚಿತ್ರವನ್ನು ಒಂದು ರೇಖೆಯ ಉದ್ದಕ್ಕೆ ಮಡಚಿದಾಗ ಎರಡು ಭಾಗಗಳು ಸಂಪೂರ್ಣ ಐಕ್ಯವಾದರೆ ಆ ರೇಖೆಯೇ ಸಮಮಿತಿ ರೇಖೆ; ಎರಡು ಭಾಗಗಳು ದರ್ಪಣಾರ್ಧಗಳು. ಒಂದು ಆಕೃತಿಗೆ ಒಂದಕ್ಕಿಂತ ಹೆಚ್ಚು ಸಮಮಿತಿ ರೇಖೆಗಳಿರಬಹುದು: ಸಮಬಾಹು ತ್ರಿಭುಜಕ್ಕೆ 3, ಚೌಕಕ್ಕೆ 4, ಆಯತಕ್ಕೆ 2, ನಿಯಮಿತ ಷಡ್ಭುಜಕ್ಕೆ 6, ವೃತ್ತಕ್ಕೆ ಅಸಂಖ್ಯ. ಭ್ರಮಣ ಸಮಮಿತಿ: ಒಂದು ಬಿಂದು (ಭ್ರಮಣ ಕೇಂದ್ರ) ಸುತ್ತಲೂ ಆಕೃತಿಯನ್ನು ತಿರುಗಿಸಿದಾಗ ಅದು ಮೊದಲಿನಂತೆಯೇ ಕಾಣುವುದು. ಹೀಗೆ ಕಾಣುವ ಕೋನಗಳು ಸಮಮಿತಿ ಕೋನಗಳು (0° ಮತ್ತು 360° ನಡುವೆ). ಗಾಳಿಚಕ್ರದ ಸಮಮಿತಿ ಕೋನಗಳು 90°, 180°, 270°, 360°. ಒಂದು ಪೂರ್ಣ ಸುತ್ತು 360°. ಭ್ರಮಣ ಕೋನಗಳು ಸ್ವಾಭಾವಿಕ ಸಂಖ್ಯೆಯಾಗಿದ್ದರೆ 360 ರ ಅಪವರ್ತ್ಯಗಳಾಗಿರುತ್ತವೆ. 3 ತ್ರಿಜ್ಯೀಯ ಬಾಹುಗಳಿದ್ದರೆ ಕೋನಗಳು 120°, 240°, 360°. ವೃತ್ತಕ್ಕೆ ಪ್ರತಿ ಕೋನವೂ ಸಮಮಿತಿ ಕೋನ. ಕೆಲವು ಆಕೃತಿಗಳಲ್ಲಿ ರೇಖಾ ಸಮಮಿತಿ ಮಾತ್ರ, ಕೆಲವಕ್ಕೆ ಭ್ರಮಣ ಮಾತ್ರ, ಕೆಲವಕ್ಕೆ ಎರಡೂ ಇರುತ್ತವೆ.`,
ab:[
[`ಸಮಮಿತಿ ರೇಖೆಗಳ ಸಂಖ್ಯೆ (ಪುಟ 94, 105)`,[
[`ಚೌಕ`,`4 ಸಮಮಿತಿ ರೇಖೆಗಳು`],
[`ಸಮಬಾಹು ತ್ರಿಭುಜ (ಸಮ ಬಾಹು, ಸಮ ಕೋನ)`,`3`],
[`ನಿಯಮಿತ ಷಡ್ಭುಜ`,`6`],
[`ಎಂಟು ಮೊನೆಯ ನಕ್ಷತ್ರ ಆಕೃತಿ`,`8`],
[`ಆಯತ (ಚೌಕವಲ್ಲದ)`,`2`],
[`ವೃತ್ತ`,`ಅಸಂಖ್ಯ ಸಮಮಿತಿ ರೇಖೆಗಳು (ಪ್ರತಿ ವ್ಯಾಸವೂ)`]]],
[`ಪುಟ 95 – ತ್ರಿಭುಜ ರಚಿಸಿ`,[
[`ಒಂದೇ ಒಂದು ಸಮಮಿತಿ ರೇಖೆಯಿರುವ ತ್ರಿಭುಜ`,`ಸಮದ್ವಿಬಾಹು ತ್ರಿಭುಜ (ಎರಡು ಬಾಹುಗಳು ಸಮ, ಉದಾ: 5, 5, 6)`],
[`ಮೂರು ಸಮಮಿತಿ ರೇಖೆಗಳಿರುವ ತ್ರಿಭುಜ`,`ಸಮಬಾಹು ತ್ರಿಭುಜ`],
[`ಯಾವ ಸಮಮಿತಿ ರೇಖೆಯೂ ಇಲ್ಲದ ತ್ರಿಭುಜ`,`ವಿಷಮಬಾಹು ತ್ರಿಭುಜ (ಉದಾ: 3, 4, 6)`],
[`ಸರಿಯಾಗಿ ಎರಡು ಸಮಮಿತಿ ರೇಖೆಗಳಿರುವ ತ್ರಿಭುಜ ಸಾಧ್ಯವೇ?`,`ಇಲ್ಲ. ತ್ರಿಭುಜಕ್ಕೆ 0, 1 ಅಥವಾ 3 ಸಮಮಿತಿ ರೇಖೆಗಳು ಮಾತ್ರ ಸಾಧ್ಯ.`]]],
[`ಭ್ರಮಣ ಸಮಮಿತಿ ಕೋನಗಳು (ಪುಟ 97–104)`,[
[`ಗಾಳಿಚಕ್ರ (4 ಬಾಹು) ದ ಸಮಮಿತಿ ಕೋನಗಳು`,`90°, 180°, 270°, 360°`],
[`ಸರಿಯಾಗಿ ಎರಡು ಸಮಮಿತಿ ಕೋನಗಳಿರುವ ಚಿತ್ರ`,`180° ಮತ್ತು 360°`],
[`ಮೂರು ತ್ರಿಜ್ಯೀಯ ಬಾಹುಗಳ ಚಿತ್ರದ ಸಮಮಿತಿ ಕೋನಗಳು`,`120°, 240°, 360° (360° ÷ 3 = 120°)`],
[`ಸರಿಯಾಗಿ ನಾಲ್ಕು ಸಮಮಿತಿ ಕೋನಗಳಿರುವ ಚಿತ್ರ`,`90°, 180°, 270°, 360°`],
[`ಒಂದು ಪೂರ್ಣ ಸುತ್ತು ಎಷ್ಟು ಡಿಗ್ರಿ?`,`360°`],
[`ಭ್ರಮಣ ಕೇಂದ್ರ ಎಂದರೇನು?`,`ಆಕೃತಿಯನ್ನು ಯಾವ ಬಿಂದುವಿನ ಸುತ್ತ ತಿರುಗಿಸುತ್ತೇವೆಯೋ ಆ ಬಿಂದು.`]]],
[`ಕಂಡುಹಿಡಿಯಿರಿ (ಪುಟ 105)`,[
[`ಒಂದು ಚಿತ್ರದ ಅತ್ಯಂತ ಚಿಕ್ಕ ಸಮಮಿತಿ ಕೋನ 60°. ಇತರ ಸಮಮಿತಿ ಕೋನಗಳು?`,`120°, 180°, 240°, 300°, 360° (60° ನ ಗುಣಕಗಳು)`],
[`ಭ್ರಮಣ ಸಮಮಿತಿಯಿರುವ ಚಿತ್ರದ ಅತ್ಯಂತ ಚಿಕ್ಕ ಕೋನ 45° ಇರಬಹುದೇ?`,`ಹೌದು, 360 ÷ 45 = 8 (ಸ್ವಾಭಾವಿಕ ಸಂಖ್ಯೆ)`],
[`ಅತ್ಯಂತ ಚಿಕ್ಕ ಕೋನ 17° ಇರಬಹುದೇ?`,`ಇಲ್ಲ. 360 ÷ 17 ಸ್ವಾಭಾವಿಕ ಸಂಖ್ಯೆಯಲ್ಲ; 17 ಎಂಬುದು 360 ರ ಅಪವರ್ತ್ಯವಲ್ಲ.`],
[`ವೃತ್ತಕ್ಕೆ ಭ್ರಮಣ ಸಮಮಿತಿ ಕೋನಗಳು`,`0° ಮತ್ತು 360° ನಡುವಿನ ಪ್ರತಿ ಕೋನವೂ (ಅಸಂಖ್ಯ)`]]],
[`ನಿಯಮಿತ ಬಹುಭುಜಾಕೃತಿಗಳ ಸಮಮಿತಿ (ಪುಟ 106)`,[
[`ಅಧ್ಯಾಯ 1 ರ ನಿಯಮಿತ ಬಹುಭುಜಾಕೃತಿಗಳಿಗೆ ಸಮಮಿತಿ ರೇಖೆಗಳು ಮತ್ತು ಭ್ರಮಣ ಸಮಮಿತಿ ಕೋನಗಳು`,`ಸಮಬಾಹು ತ್ರಿಭುಜ: 3 ರೇಖೆ; 120°, 240°, 360°. ಚೌಕ: 4 ರೇಖೆ; 90°, 180°, 270°, 360°. ನಿಯಮಿತ ಷಡ್ಭುಜ: 6 ರೇಖೆ; 60°, 120°, 180°, 240°, 300°, 360°. (n ಬಾಹುಗಳ ನಿಯಮಿತ ಬಹುಭುಜಾಕೃತಿಗೆ n ರೇಖೆ, ಚಿಕ್ಕ ಕೋನ 360°/n.)`]]]
],
qb:[
M(`ಒಂದು ರೇಖೆಯ ಉದ್ದಕ್ಕೆ ಮಡಚಿದಾಗ ಎರಡು ಭಾಗಗಳು ಐಕ್ಯವಾದರೆ ಆ ರೇಖೆ:`,[`ಕರ್ಣ`,`ಸಮಮಿತಿ ರೇಖೆ`,`ವ್ಯಾಸ`,`ಜ್ಯಾ`],1),
M(`ಚೌಕದ ಸಮಮಿತಿ ರೇಖೆಗಳ ಸಂಖ್ಯೆ:`,[`2`,`3`,`4`,`8`],2),
M(`ಸಮಬಾಹು ತ್ರಿಭುಜದ ಸಮಮಿತಿ ರೇಖೆಗಳ ಸಂಖ್ಯೆ:`,[`1`,`2`,`3`,`6`],2),

M(`ವೃತ್ತಕ್ಕೆ ಸಮಮಿತಿ ರೇಖೆಗಳು:`,[`1`,`2`,`4`,`ಅಸಂಖ್ಯ`],3),

M(`ಮೂರು ತ್ರಿಜ್ಯೀಯ ಬಾಹುಗಳ ಚಿತ್ರದ ಚಿಕ್ಕ ಸಮಮಿತಿ ಕೋನ:`,[`60°`,`90°`,`120°`,`180°`],2),

M(`ಸ್ವಾಭಾವಿಕ ಸಂಖ್ಯೆಯ ಸಮಮಿತಿ ಕೋನ (ಡಿಗ್ರಿ) ಇದರ ಅಪವರ್ತ್ಯವಾಗಿರುತ್ತದೆ:`,[`180`,`360`,`90`,`100`],1),
M(`ಅತ್ಯಂತ ಚಿಕ್ಕ ಸಮಮಿತಿ ಕೋನ 45° ಆಗಲು ಸಾಧ್ಯವೇ?`,[`ಹೌದು, 360 ÷ 45 = 8`,`ಇಲ್ಲ`,`ಕೆಲವೊಮ್ಮೆ`,`ಗೊತ್ತಿಲ್ಲ`],0),

M(`ತ್ರಿಭುಜಕ್ಕೆ ಸಾಧ್ಯವಿರುವ ಸಮಮಿತಿ ರೇಖೆಗಳ ಸಂಖ್ಯೆ:`,[`0, 1 ಅಥವಾ 3`,`2 ಅಥವಾ 4`,`0 ಅಥವಾ 2`,`1 ಮಾತ್ರ`],0,'h'),
M(`ಆಯತಕ್ಕೆ (ಚೌಕವಲ್ಲದ) ಸಮಮಿತಿ ರೇಖೆಗಳ ಸಂಖ್ಯೆ:`,[`1`,`2`,`3`,`4`],1),
O(`ಸಮಮಿತಿ ರೇಖೆ ಎಂದರೇನು?`,`ಆಕೃತಿಯನ್ನು ಆ ರೇಖೆಯ ಉದ್ದಕ್ಕೆ ಮಡಚಿದಾಗ ಎರಡು ಭಾಗಗಳು ಸಂಪೂರ್ಣ ಐಕ್ಯವಾಗುವ ರೇಖೆ.`),
O(`ದರ್ಪಣಾರ್ಧಗಳು ಎಂದರೇನು?`,`ಸಮಮಿತಿ ರೇಖೆಯ ಎರಡು ಬದಿಯಲ್ಲಿರುವ ಒಂದಕ್ಕೊಂದು ಪ್ರತಿಬಿಂಬದಂತಿರುವ ಭಾಗಗಳು.`),
O(`ಭ್ರಮಣ ಸಮಮಿತಿ ಎಂದರೇನು?`,`ಆಕೃತಿಯನ್ನು ಒಂದು ಬಿಂದುವಿನ ಸುತ್ತ ತಿರುಗಿಸಿದಾಗ ಅದು ಮೊದಲಿನಂತೆಯೇ ಕಾಣುವುದು.`),
O(`ಗಾಳಿಚಕ್ರದ ಅತ್ಯಂತ ಚಿಕ್ಕ ಸಮಮಿತಿ ಕೋನ ಎಷ್ಟು?`,`90°`),
O(`ಸರಿಯಾಗಿ ಎರಡು ಸಮಮಿತಿ ಕೋನಗಳಿರುವ ಚಿತ್ರದ ಕೋನಗಳು?`,`180° ಮತ್ತು 360°`),
O(`ಸಮಬಾಹು ತ್ರಿಭುಜದ ಸಮಮಿತಿ ಕೋನಗಳನ್ನು ಬರೆ.`,`120°, 240°, 360°`),
O(`ಚೌಕದ ಸಮಮಿತಿ ಕೋನಗಳನ್ನು ಬರೆ.`,`90°, 180°, 270°, 360°`),
O(`ನಿಯಮಿತ ಷಡ್ಭುಜದ ಚಿಕ್ಕ ಸಮಮಿತಿ ಕೋನ?`,`60°`),
O(`ಅತ್ಯಂತ ಚಿಕ್ಕ ಸಮಮಿತಿ ಕೋನ 60° ಆದರೆ ಇತರ ಕೋನಗಳು?`,`120°, 180°, 240°, 300°, 360°`),
O(`ಒಂದು ವೃತ್ತದ ಎಲ್ಲಾ ಕೋನಗಳೂ ಸಮಮಿತಿ ಕೋನಗಳೇ?`,`ಹೌದು`),
G(`ಸರಿ/ತಪ್ಪು: ಪ್ರತಿ ಚಿತ್ರಕ್ಕೂ ಸಮಮಿತಿ ಕೋನ 360° ಇರುತ್ತದೆ.`,`ಸರಿ`),
G(`ಸರಿ/ತಪ್ಪು: ಸಮಮಿತಿ ರೇಖೆ ಇರುವ ಎಲ್ಲಾ ಚಿತ್ರಗಳಿಗೂ ಭ್ರಮಣ ಸಮಮಿತಿ ಇರುತ್ತದೆ.`,`ತಪ್ಪು (ಕೆಲವಕ್ಕೆ ರೇಖಾ ಸಮಮಿತಿ ಮಾತ್ರ ಇರುತ್ತದೆ)`),
