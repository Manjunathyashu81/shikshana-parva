LS5.push({n:1,t:`ಪಂಜರ ಶಾಲೆ (ನಾಟಕ)`,au:`ಬಿ. ವಿ. ಕಾರಂತ`,pg:1,
words:`ಖಗ – ಪಕ್ಷಿ; ತರ್ಕ – ಆರು ದರ್ಶನಗಳಲ್ಲಿ ಒಂದು; ಪುರಾಣ – ಹಿಂದಿನ ಕಾಲದಲ್ಲಿ ನಡೆದುಹೋದ ಕಥೆ; ಪ್ರಜ್ಞಾವಧಾನಿ – ತಿಳಿವಳಿಕೆ ಹಾಗೂ ಸ್ಮರಣ ಶಕ್ತಿಯುಳ್ಳವನು; ಮಧುಫಲ – ಸಿಹಿಯಾದ ಹಣ್ಣು; ಮೃಗ – ಪ್ರಾಣಿ; ರಕ್ಷಕರು – ಕಾಪಾಡುವವರು; ವಿದ್ಯಾವತಂಸ – ವಿದ್ಯಾವಂತ; ವಂದಿಮಾಗಧರು – ಸ್ತುತಿ ಪಾಠಕರು, ಹೊಗಳುಭಟ್ಟರು; ಶುಕ – ಗಿಳಿ`,
notes:`ಕೃತಿಕಾರರ ಪರಿಚಯ: ಬಿ. ವಿ. ಕಾರಂತರು (ಬಾಬುಕೋಡಿ ವೆಂಕಟರಮಣ ಕಾರಂತ) ಸಾ.ಶ. 1928ರಲ್ಲಿ ದಕ್ಷಿಣ ಕನ್ನಡ ಜಿಲ್ಲೆಯ ಬಂಟ್ವಾಳ ತಾಲ್ಲೂಕಿನ ಮಂಚಿ ಗ್ರಾಮದಲ್ಲಿ ಜನಿಸಿದರು. ತಂದೆ ಬಾಬುಕೋಡಿ ನಾರಾಯಣಪ್ಪಯ್ಯ, ತಾಯಿ ಲಕ್ಷ್ಮಮ್ಮ. ಗುಬ್ಬಿ ನಾಟಕ ಕಂಪನಿಗೆ ಸೇರಿದರು; ರಾಷ್ಟ್ರೀಯ ನಾಟಕ ಶಾಲೆಯ ನಿರ್ದೇಶಕರಾಗಿ ಸೇವೆ ಸಲ್ಲಿಸಿದರು. ಈಡಿಪಸ್, ಪಂಜರಶಾಲೆ, ಗೋಕುಲ ನಿರ್ಗಮನ, ಸತ್ತವರ ನೆರಳು, ಜೋಕುಮಾರಸ್ವಾಮಿ ಮೊದಲಾದ ನಾಟಕಗಳನ್ನು ನಿರ್ದೇಶಿಸಿದ್ದಾರೆ. ಪದ್ಮಶ್ರೀ ಪ್ರಶಸ್ತಿ, ಕಾಳಿದಾಸ ಸಮ್ಮಾನ್, ಸಂಗೀತ ನಾಟಕ ಅಕಾಡೆಮಿ ಪ್ರಶಸ್ತಿ, ಗುಬ್ಬಿ ವೀರಣ್ಣ ಪ್ರಶಸ್ತಿ ಪಡೆದಿದ್ದಾರೆ. ರವೀಂದ್ರನಾಥ ಟಾಗೋರ್ ಅವರ ಬಂಗಾಳಿ ನಾಟಕವನ್ನು 'ಪಂಜರಶಾಲೆ' ಎಂದು ಕನ್ನಡಕ್ಕೆ ಅನುವಾದಿಸಿದ್ದಾರೆ. ಪಾಠದ ಆಶಯ: ಯಾರನ್ನೇ ಆಗಲಿ ಪಂಜರದೊಳಗಿಟ್ಟು ಒತ್ತಡದಿಂದ ಏನನ್ನೂ ಕಲಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ. ಕೌಶಲ: ಮಾತನಾಡುವುದು; ಸಾಮರ್ಥ್ಯ: ನಾಟಕ ಮತ್ತು ಚರ್ಚಾಸ್ಪರ್ಧೆಗಳಲ್ಲಿ ಭಾಗವಹಿಸುವುದು.`,
ab:[
[`ಅ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ`,[
[`ಗಿಳಿಮರಿಯು ಏನನ್ನು ತಿನ್ನಲು ತನ್ನ ಬಳಗವನ್ನು ಕರೆಯಿತು?`,`ಮಧುಫಲ (ಸಿಹಿಯಾದ ಹಣ್ಣು) ತಿನ್ನಲು ತನ್ನ ಬಳಗವನ್ನು ಕರೆಯಿತು.`],
[`ಮಂತ್ರಿಯ ಪ್ರಕಾರ ಗಿಳಿಮರಿಗೆ ಏನೇನು ಬರುವುದಿಲ್ಲ ಎಂದು ಹೇಳಿದನು?`,`ಗಿಳಿಮರಿಗೆ ಮಾತು, ಹಾಡು, ಓದು, ನೃತ್ಯ, ತರ್ಕ, ಶಾಸ್ತ್ರ, ಪುರಾಣ, ವ್ಯಾಕರಣ – ಯಾವುದೂ ಬರುವುದಿಲ್ಲ ಎಂದು ಹೇಳಿದನು.`],
[`ರಾಜನು ಗಿಳಿಮರಿಯನ್ನು ಯಾವ ಶಾಲೆಗೆ ಸೇರಿಸಲು ಆದೇಶ ಮಾಡಿದನು?`,`ರಾಜಶಾಲೆಗೆ ಸೇರಿಸಲು ಆದೇಶ ಮಾಡಿದನು.`],
[`ರಾಜನು ಯಾರನ್ನು ಶುಕಶಿಕ್ಷಣ ಮಂತ್ರಿಯನ್ನಾಗಿ ನೇಮಿಸಿದನು?`,`ತನ್ನ ಅಳಿಯನಾದ ಅಳಿಯರಾಜನನ್ನು ಶುಕಶಿಕ್ಷಣ ಮಂತ್ರಿಯನ್ನಾಗಿ ನೇಮಿಸಿದನು.`],
[`ರಾಜನು ಗಿಳಿಮರಿಗೆ ಏನನ್ನು ಕಲಿಸಬೇಕು ಎಂದು ಹೇಳಿದನು?`,`ಸಭ್ಯತೆಯನ್ನು ಕಲಿಸಬೇಕು, ಕಾಡುತನ ಮರೆಸಬೇಕು, ಶಾಸ್ತ್ರ–ವ್ಯಾಕರಣ ಕಲಿಸಿ ಸುಶಿಕ್ಷಿತ ಹಾಗೂ ಸುಸಂಸ್ಕೃತನನ್ನಾಗಿ ಮಾಡಬೇಕು ಎಂದು ಹೇಳಿದನು.`]]],
[`ಆ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಎರಡು–ಮೂರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರಿಸಿ`,[
[`ಗಿಳಿಮರಿಯ ಬಗ್ಗೆ ಮಂತ್ರಿಯು ರಾಜನಿಗೆ ಏನು ಹೇಳಿದನು?`,`ಇದು ಕಾಡುಜಾತಿಯ ಅನಾಗರಿಕ ಗಿಳಿಮರಿ; ವಸಂತಕಾಲದಲ್ಲಿ ಮದ ಹತ್ತಿ ರಾಜತೋಟಕ್ಕೆ ನುಗ್ಗಿ ಹಣ್ಣುಹಂಪಲುಗಳನ್ನು ನಾಶಪಡಿಸಿದೆ ಎಂದು ಹೇಳಿದನು. ಇದು ಅರಣ್ಯವಾಸಿ, ನಿರಕ್ಷರಕುಕ್ಷಿ, ಅಸಂಸ್ಕೃತ; ಇದಕ್ಕೆ ಕೊಂಬೆ ಮುರಿದು ಹಣ್ಣು ತಿನ್ನುವುದೊಂದೇ ಗೊತ್ತು ಎಂದನು.`],
[`ರಾಜನು ಗಿಳಿಮರಿಗೆ ಏನು ಮಾಡುವಂತೆ ಮಂತ್ರಿಗೆ ಹೇಳಿದನು?`,`ಅಸಭ್ಯ ಪಕ್ಷಿಯನ್ನು ರಾಜಶಾಲೆಗೆ ಸೇರಿಸಿ, ರಾಜಾಧ್ಯಾಪಕರಿಂದ ಶಿಕ್ಷಣ ಕೊಡಿಸುವಂತೆಯೂ, ಅದರ ಆದಿಮ ಪ್ರವೃತ್ತಿಗಳನ್ನು ಸುಧಾರಿಸಿ ಆಧುನಿಕ ಮಾಡುವಂತೆಯೂ ಮಂತ್ರಿಗೆ ಹೇಳಿದನು.`],
[`ಗಿಳಿಮರಿಯು ಏನೇನು ಕಲಿಯಬೇಕು ಎಂದು ರಾಜನು ಹೇಳುತ್ತಾನೆ?`,`ಗಿಳಿಮರಿ ಸಭ್ಯತೆ ಕಲಿಯಲಿ, ಕಾಡುತನ ಮರೆಯಲಿ, ಶಾಸ್ತ್ರ–ವ್ಯಾಕರಣ ಕಲಿತು ಸುಶಿಕ್ಷಿತವಾಗಲಿ, ತಾನು ಸುಸಂಸ್ಕೃತನಾಗಿ ಕಾಡಿನ ಉಳಿದ ಶುಕಪಕ್ಷಿಗಳನ್ನು ಸಭ್ಯ ಮಾಡಲಿ ಎಂದು ರಾಜನು ಹೇಳುತ್ತಾನೆ.`],
[`ರಾಜನ ಅಳಿಯನು ಏನೆಂದು ನಿವೇದನೆ ಮಾಡಿದನು?`,`ಗಿಳಿಮರಿಯನ್ನು ರಾಜಶಾಲೆಗೆ ಸೇರಿಸುವ ಮೊದಲು ಅದರ ಅಸಭ್ಯತೆ ಮತ್ತು ಅವಿದ್ಯೆಗೆ ಮೂಲಕಾರಣವನ್ನು ಕಂಡುಹಿಡಿಯಬೇಕು. ಅದು ಏನು ತಿನ್ನುತ್ತದೆ, ಏನು ಕುಡಿಯುತ್ತದೆ, ಎಲ್ಲಿ ಇರುತ್ತದೆ, ಎಲ್ಲಿ ಹಾರುತ್ತದೆ, ರೆಕ್ಕೆ–ಪುಕ್ಕ–ಕೊಕ್ಕುಗಳ ಉದ್ದಗಲ, ಭಾರ ಎಷ್ಟು ಎಂಬ ಬಗ್ಗೆ ದೀರ್ಘ ಸಂಶೋಧನೆ ನಡೆಸಬೇಕು ಎಂದು ನಿವೇದನೆ ಮಾಡಿದನು.`],
[`ಮಂತ್ರಿಯು ರಾಜನ ಅಳಿಯನ ಬಗ್ಗೆ ಹೇಳಿದ ಮಾತುಗಳಾವುವು?`,`ಅಳಿಯರಾಜರು ಮಹಾ ಪ್ರತಿಭಾಶಾಲಿಗಳು; ದೇಶಕೋಶ ಸುತ್ತಿ ಬಂದವರು; ವಿದೇಶಗಳಿಂದ ಪದವಿಗಳನ್ನು ಹೊತ್ತು ತಂದವರು; ಕಾಂಭೋಜದೇಶದಲ್ಲಿ ಪ್ರಾಣಿಶಾಸ್ತ್ರ, ಪಕ್ಷಿಶಾಸ್ತ್ರಗಳಲ್ಲಿ ಪಾರಂಗತರು; ಸದ್ಯ ನಿರುದ್ಯೋಗಿಗಳು. ಆದ್ದರಿಂದ ಶುಕಶಿಕ್ಷಣದ ಭಾರವನ್ನು ಅವರಿಗೇ ವಹಿಸಬಹುದು ಎಂದು ಮಂತ್ರಿ ಹೇಳಿದನು.`]]],
[`ಇ. ಖಾಲಿ ಬಿಟ್ಟ ಸ್ಥಳಗಳನ್ನು ಸೂಕ್ತಪದಗಳಿಂದ ತುಂಬಿರಿ`,[
[`ಬನ್ನಿ ಬನ್ನಿ, ______ ತಿನ್ನಿ, ಬೇಗ, ಹಾರಿಬನ್ನಿ.`,`ಮಧುಫಲ`],
[`ಈ ಅಸಭ್ಯ ______ ಯನ್ನು ರಾಜಶಾಲೆಗೆ ಸೇರಿಸತಕ್ಕದ್ದು.`,`ಪಕ್ಷಿ`],
[`ತಾನು ಸುಸಂಸ್ಕೃತವಾಗಿ ಕಾಡಿನ ಉಳಿದ ______ ಗಳನ್ನು ಸಭ್ಯಮಾಡಲಿ.`,`ಶುಕಪಕ್ಷಿ`],
[`ಅಳಿಯ ರಾಜ, ಇಂದಿನಿಂದ ನೀನು ______ ದ ಮಂತ್ರಿ.`,`ಶುಕಶಿಕ್ಷಣ`],
[`ಒಂದು ಪಕ್ಷಿಯ ______ ದಲ್ಲೂ ರಾಜನ ಆಸಕ್ತಿ ಎಷ್ಟಿದೆ ಎನ್ನುವುದು.`,`ಶಿಕ್ಷಣ`]]],
[`ವ್ಯಾಕರಣ ಮಾಹಿತಿ – ಪ್ರತ್ಯಯಗಳು (ಭಾಷಾಭ್ಯಾಸ ಅ. ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರ)`,[
[`ಪ್ರತ್ಯಯಗಳು ಎಂದರೇನು?`,`ನಾಮಪ್ರಕೃತಿಗೆ (ಮೂಲ ಪದಕ್ಕೆ) ನಿರ್ದಿಷ್ಟ ಅರ್ಥ ಬರುವಂತೆ ಮಾಡುವ ಕಾರಕಗಳೇ ಪ್ರತ್ಯಯಗಳು. ಇವುಗಳನ್ನು ವಿಭಕ್ತಿ ಪ್ರತ್ಯಯಗಳೆಂದೂ ಕರೆಯುತ್ತಾರೆ. ಪ್ರತ್ಯಯಗಳನ್ನು ಸ್ವತಂತ್ರವಾಗಿ ಬಳಸಲು ಬರುವುದಿಲ್ಲ.`],
[`ಇಂದ, ನಾನು, ಅಲ್ಲಿ, ಬೇಗ, ಗೆ – ಇವುಗಳಲ್ಲಿ ಪ್ರತ್ಯಯಗಳನ್ನು ಆರಿಸಿ ಬರೆಯಿರಿ.`,`ಇಂದ, ಅಲ್ಲಿ, ಗೆ (ನಾನು ಮತ್ತು ಬೇಗ ಪ್ರತ್ಯಯಗಳಲ್ಲ).`],
[`ಮನೆ, ಕಲ್ಲನ್ನು, ನೆಲ, ಹೊಲ, ಶಾಲೆಯಲ್ಲಿ – ಇವುಗಳಲ್ಲಿ ನಾಮಪ್ರಕೃತಿಗಳನ್ನು ಆರಿಸಿ ಬರೆಯಿರಿ.`,`ಮನೆ, ನೆಲ, ಹೊಲ ನಾಮಪ್ರಕೃತಿಗಳು. ಕಲ್ಲನ್ನು = ಕಲ್ಲು + ಅನ್ನು (ನಾಮಪ್ರಕೃತಿ: ಕಲ್ಲು); ಶಾಲೆಯಲ್ಲಿ = ಶಾಲೆ + ಅಲ್ಲಿ (ನಾಮಪ್ರಕೃತಿ: ಶಾಲೆ).`],
[`ಶಾಲೆ ಪದಕ್ಕೆ ಉ, ಅನ್ನು, ಇಂದ, ಅಲ್ಲಿ ಪ್ರತ್ಯಯಗಳನ್ನು ಹಚ್ಚಿರಿ.`,`ಶಾಲೆ+ಉ = ಶಾಲೆಯು; ಶಾಲೆ+ಅನ್ನು = ಶಾಲೆಯನ್ನು; ಶಾಲೆ+ಇಂದ = ಶಾಲೆಯಿಂದ; ಶಾಲೆ+ಅಲ್ಲಿ = ಶಾಲೆಯಲ್ಲಿ`],
[`ಪುಸ್ತಕ ಪದಕ್ಕೆ ಉ, ಅನ್ನು, ಇಂದ, ಅಲ್ಲಿ ಪ್ರತ್ಯಯಗಳನ್ನು ಹಚ್ಚಿರಿ.`,`ಪುಸ್ತಕ+ಉ = ಪುಸ್ತಕವು; ಪುಸ್ತಕ+ಅನ್ನು = ಪುಸ್ತಕವನ್ನು; ಪುಸ್ತಕ+ಇಂದ = ಪುಸ್ತಕದಿಂದ; ಪುಸ್ತಕ+ಅಲ್ಲಿ = ಪುಸ್ತಕದಲ್ಲಿ`],
[`ಹುಡುಗ ಪದಕ್ಕೆ ಉ, ಅನ್ನು, ಇಂದ, ಅಲ್ಲಿ ಪ್ರತ್ಯಯಗಳನ್ನು ಹಚ್ಚಿರಿ.`,`ಹುಡುಗ+ಉ = ಹುಡುಗನು; ಹುಡುಗ+ಅನ್ನು = ಹುಡುಗನನ್ನು; ಹುಡುಗ+ಇಂದ = ಹುಡುಗನಿಂದ; ಹುಡುಗ+ಅಲ್ಲಿ = ಹುಡುಗನಲ್ಲಿ`],
[`ರೈತ ಪದಕ್ಕೆ ಉ, ಅನ್ನು, ಇಂದ, ಅಲ್ಲಿ ಪ್ರತ್ಯಯಗಳನ್ನು ಹಚ್ಚಿರಿ.`,`ರೈತ+ಉ = ರೈತನು; ರೈತ+ಅನ್ನು = ರೈತನನ್ನು; ರೈತ+ಇಂದ = ರೈತನಿಂದ; ರೈತ+ಅಲ್ಲಿ = ರೈತನಲ್ಲಿ`]]],
[`ಆ. ಯೋಜನೆ / ಇ. ಓದಿಗೆ ಮನ್ನಣೆ / ಈ. ಶುಭನುಡಿ (ಚಟುವಟಿಕೆ ಆಧಾರಿತ – ಮಾರ್ಗದರ್ಶನ)`,[
[`ಪಂಜರ ಶಾಲೆ ನಾಟಕವನ್ನು ಕಥಾರೂಪದಲ್ಲಿ ಬರೆಯಿರಿ.`,`ಮಾದರಿ ರೂಪರೇಷೆ: ಗಿಳಿಮರಿಯು ಮಧುಫಲ ತಿನ್ನಲು ಬಳಗವನ್ನು ಕರೆಯುವುದು → ರಕ್ಷಕರು ಬಲೆ ಬೀಸಿ ಹಿಡಿಯುವುದು → ರಾಜನ ಮುಂದೆ ತರುವುದು → ಮಂತ್ರಿಯು ಅದಕ್ಕೆ ಏನೂ ಬರುವುದಿಲ್ಲ ಎನ್ನುವುದು → ರಾಜನು ರಾಜಶಾಲೆಗೆ ಸೇರಿಸಲು ಆದೇಶಿಸುವುದು → ಅಳಿಯನನ್ನು ಶುಕಶಿಕ್ಷಣ ಮಂತ್ರಿಯನ್ನಾಗಿ ನೇಮಿಸುವುದು. ಸಂದೇಶ: ಪಂಜರದೊಳಗಿಟ್ಟು ಒತ್ತಡದಿಂದ ಕಲಿಸಲಾಗದು. (ಮಕ್ಕಳು ತಮ್ಮ ಭಾಷೆಯಲ್ಲಿ ಬರೆಯಲಿ.)`],
[`ಓದಿಗೆ ಮನ್ನಣೆ: 'ಪಂಜರ ಶಾಲೆ' ಪಾಠವನ್ನು ಧ್ವನಿಯ ಏರಿಳಿತದೊಂದಿಗೆ ಓದಿರಿ; ಪಂಚತಂತ್ರದ ಕಥೆಗಳನ್ನು ಓದಿರಿ.`,`ಚಟುವಟಿಕೆ: ಪಾತ್ರ ಹಂಚಿ (ಗಿಳಿಮರಿ, ರಕ್ಷಕರು, ರಾಜ, ಮಂತ್ರಿ, ಅಳಿಯ, ವಂದಿಮಾಗಧರು) ನಾಟಕವನ್ನು ಅಭಿನಯಿಸಿ ಓದಿಸಿ.`],
[`ಶುಭನುಡಿ`,`ಕಲಿಯಲು ಸ್ವತಂತ್ರ ಇರಬೇಕು, ಒತ್ತಡ ಇರಬಾರದು. ಆಡಿ ಕಲಿ, ಹಾಡಿ ಕಲಿ, ನೋಡಿ ಕಲಿ, ಮಾಡಿ ಕಲಿ.`]]]
],
qb:[
M(`'ಖಗ' ಪದದ ಅರ್ಥ:`,[`ಪ್ರಾಣಿ`,`ಪಕ್ಷಿ`,`ಮರ`,`ಹಣ್ಣು`],1),
M(`ರವೀಂದ್ರನಾಥ ಟಾಗೋರ್ ಅವರ ಬಂಗಾಳಿ ನಾಟಕವನ್ನು 'ಪಂಜರಶಾಲೆ' ಎಂದು ಕನ್ನಡಕ್ಕೆ ಅನುವಾದಿಸಿದವರು:`,[`ಬಿ. ವಿ. ಕಾರಂತ`,`ಕುವೆಂಪು`,`ದ. ರಾ. ಬೇಂದ್ರೆ`,`ಚಂದ್ರಶೇಖರ ಕಂಬಾರ`],0),
M(`ರಾಜನು ಗಿಳಿಮರಿಯನ್ನು ಸೇರಿಸಲು ಆದೇಶಿಸಿದ ಸ್ಥಳ:`,[`ರಾಜಶಾಲೆ`,`ಗುರುಕುಲ`,`ಅರಣ್ಯ`,`ಮಠ`],0),
M(`ಶುಕಶಿಕ್ಷಣ ಮಂತ್ರಿಯಾಗಿ ನೇಮಕಗೊಂಡವರು:`,[`ಮಂತ್ರಿ`,`ರಾಜನ ಅಳಿಯ`,`ರಕ್ಷಕ`,`ವಂದಿ`],1),
M(`'ಶುಕ' ಪದದ ಅರ್ಥ:`,[`ಗಿಳಿ`,`ಕಾಗೆ`,`ನವಿಲು`,`ಗೂಬೆ`],0),
M(`'ವಂದಿಮಾಗಧರು' ಎಂದರೆ:`,[`ಕಾಪಾಡುವವರು`,`ಹೊಗಳುಭಟ್ಟರು`,`ಶಿಕ್ಷಕರು`,`ಸೈನಿಕರು`],1),
O(`ಗಿಳಿಮರಿಯು ತನ್ನ ಬಳಗವನ್ನು ಏನು ತಿನ್ನಲು ಕರೆಯಿತು?`,`ಮಧುಫಲ (ಸಿಹಿಯಾದ ಹಣ್ಣು).`),
O(`ಗಿಳಿಮರಿ ಹಣ್ಣು ತಿನ್ನುತ್ತಿದ್ದುದು ಯಾರ ತೋಟದಲ್ಲಿ?`,`ರಾಜನ ತೋಟದಲ್ಲಿ.`),
O(`ರಕ್ಷಕರು ಗಿಳಿಮರಿಯನ್ನು ಹೇಗೆ ಹಿಡಿದರು?`,`ಬಲೆ ಬೀಸಿ ಹಿಡಿದರು.`),
O(`ಅಳಿಯರಾಜನು ಪ್ರಾಣಿಶಾಸ್ತ್ರ, ಪಕ್ಷಿಶಾಸ್ತ್ರದಲ್ಲಿ ಪಾರಂಗತನಾದ ದೇಶ ಯಾವುದು?`,`ಕಾಂಭೋಜದೇಶ.`),
O(`ಗಿಳಿಮರಿಯು ಹೇಳುತ್ತಿದ್ದ ಶಬ್ದ ಯಾವುದು?`,`ಟೇಂ ಟೇಂ.`,'m'),
G(`'ಖಗ' ಪದಕ್ಕೆ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಪಕ್ಷಿ`,'e'),
G(`'ಶುಕ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಗಿಳಿ`,'e'),
G(`'ಪ್ರಜ್ಞಾವಧಾನಿ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ತಿಳಿವಳಿಕೆ ಹಾಗೂ ಸ್ಮರಣ ಶಕ್ತಿಯುಳ್ಳವನು.`),
G(`ಪ್ರತ್ಯಯ ಸೇರಿಸಿ ಪದ ಬರೆಯಿರಿ: ಮನೆ + ಅಲ್ಲಿ`,`ಮನೆಯಲ್ಲಿ`),
G(`ಪ್ರತ್ಯಯ ಸೇರಿಸಿ ಪದ ಬರೆಯಿರಿ: ರಾಜ + ಅನ್ನು`,`ರಾಜನನ್ನು`),
G(`ದ್ವಿತೀಯಾ ವಿಭಕ್ತಿಯ ಪ್ರತ್ಯಯ ಯಾವುದು?`,`ಅನ್ನು`),
S(`ರಾಜನು ಗಿಳಿಮರಿಗೆ ಏನು ಮಾಡುವಂತೆ ಮಂತ್ರಿಗೆ ಹೇಳಿದನು?`,`ಅಸಭ್ಯ ಪಕ್ಷಿಯನ್ನು ರಾಜಶಾಲೆಗೆ ಸೇರಿಸಿ, ರಾಜಾಧ್ಯಾಪಕರಿಂದ ಶಿಕ್ಷಣ ಕೊಡಿಸುವಂತೆ ಮತ್ತು ಅದರ ಆದಿಮ ಪ್ರವೃತ್ತಿಗಳನ್ನು ಸುಧಾರಿಸಿ ಆಧುನಿಕ ಮಾಡುವಂತೆ ಹೇಳಿದನು.`),
S(`ಗಿಳಿಮರಿಯ ಬಗ್ಗೆ ಮಂತ್ರಿಯು ರಾಜನಿಗೆ ಏನು ಹೇಳಿದನು?`,`ಇದು ಕಾಡುಜಾತಿಯ ಅನಾಗರಿಕ ಗಿಳಿ; ವಸಂತಕಾಲದಲ್ಲಿ ರಾಜತೋಟಕ್ಕೆ ನುಗ್ಗಿ ಹಣ್ಣುಹಂಪಲು ನಾಶಪಡಿಸಿದೆ; ಮಾತು, ಹಾಡು, ಓದು, ನೃತ್ಯ ಯಾವುದೂ ಬರುವುದಿಲ್ಲ ಎಂದು ಹೇಳಿದನು.`),
S(`ಅಳಿಯನು ಗಿಳಿಮರಿಯ ಬಗ್ಗೆ ಯಾವ ಸಂಶೋಧನೆ ನಡೆಯಬೇಕೆಂದು ಹೇಳಿದನು?`,`ಅದು ಏನು ತಿನ್ನುತ್ತದೆ, ಕುಡಿಯುತ್ತದೆ, ಎಲ್ಲಿ ಇರುತ್ತದೆ, ಎಲ್ಲಿ ಹಾರುತ್ತದೆ, ರೆಕ್ಕೆ–ಪುಕ್ಕ–ಕೊಕ್ಕುಗಳ ಉದ್ದಗಲ ಮತ್ತು ಭಾರ ಎಷ್ಟು ಎಂಬ ಬಗ್ಗೆ ದೀರ್ಘ ಸಂಶೋಧನೆ ನಡೆಯಬೇಕೆಂದು ಹೇಳಿದನು.`),
L(`'ಪಂಜರಶಾಲೆ' ನಾಟಕದ ಕಥೆಯನ್ನು ನಿಮ್ಮ ಮಾತುಗಳಲ್ಲಿ ಬರೆಯಿರಿ.`,`ರಾಜನ ತೋಟದಲ್ಲಿ ಒಂದು ಗಿಳಿಮರಿ ಹಣ್ಣು ತಿನ್ನುತ್ತಾ ತನ್ನ ಬಳಗವನ್ನು ಕರೆಯಿತು. ರಕ್ಷಕರು ಬಲೆ ಬೀಸಿ ಅದನ್ನು ಹಿಡಿದರು. ವಂದಿಮಾಗಧರ ಘೋಷದೊಂದಿಗೆ ರಾಜ, ಮಂತ್ರಿ, ಅಳಿಯ ಬಂದರು. ಗಿಳಿಗೆ ಮಾತು, ಹಾಡು, ಓದು, ನೃತ್ಯ ಯಾವುದೂ ಬರುವುದಿಲ್ಲವೆಂದು ಮಂತ್ರಿ ಹೇಳಿದನು. ರಾಜನು ಅದನ್ನು ರಾಜಶಾಲೆಗೆ ಸೇರಿಸಿ ಸಭ್ಯ, ಸುಶಿಕ್ಷಿತವನ್ನಾಗಿ ಮಾಡಲು ಆದೇಶಿಸಿದನು ಮತ್ತು ಅಳಿಯನನ್ನು ಶುಕಶಿಕ್ಷಣ ಮಂತ್ರಿಯನ್ನಾಗಿ ನೇಮಿಸಿದನು. ಪಂಜರದೊಳಗಿಟ್ಟು ಒತ್ತಡದಿಂದ ಕಲಿಸಲಾಗದು ಎಂಬುದು ನಾಟಕದ ಆಶಯ.`),
L(`ನಿಜವಾದ ಕಲಿಕೆ ಹೇಗಿರಬೇಕು ಎಂಬುದನ್ನು 'ಪಂಜರ ಶಾಲೆ' ಪಾಠದ ಆಧಾರದಿಂದ ವಿವರಿಸಿ.`,`ಕಲಿಕೆಯು ಸ್ವತಂತ್ರ ವಾತಾವರಣದಲ್ಲಿ ನಡೆಯಬೇಕು. ಗಿಳಿಮರಿಯನ್ನು ಪಂಜರದಲ್ಲಿಟ್ಟು ಶಾಸ್ತ್ರ–ವ್ಯಾಕರಣ ಕಲಿಸಲು ಯತ್ನಿಸಿದರೆ ಅದರ ಸಹಜ ಜೀವನ, ಸಂತೋಷ ನಾಶವಾಗುತ್ತದೆ. ಆಡಿ, ಹಾಡಿ, ನೋಡಿ, ಮಾಡಿ ಕಲಿಯುವುದು ಅರ್ಥಪೂರ್ಣ. ಒತ್ತಡದ ಕಲಿಕೆ ಪರಿಣಾಮಕಾರಿಯಲ್ಲ ಎಂಬುದು ಪಾಠದ ಸಂದೇಶ.`)
]});

LS5.push({n:2,t:`ಮಲ್ಲಜ್ಜಿಯ ಮಳಿಗೆ`,au:`ಸಮಿತಿ ರಚನೆ`,pg:9,
words:`ಆಶೀರ್ವಾದ – ಹಾರೈಕೆ; ಕುಟುಂಬ – ಮನೆತನ, ಒಕ್ಕಲು; ಕೋರ್ಟ್ – ನ್ಯಾಯಕ್ಕಾಗಿ ವಿಚಾರಣೆ ನಡೆಸುವ ಸ್ಥಳ, ನ್ಯಾಯಾಲಯ; ಗೊತ್ತು – ಪರಿಚಯ, ತಿಳಿದಿರುವುದು; ಚಪ್ಪಡಿಕಲ್ಲು – ಚಪ್ಪಡಿ, ಹಾಸುಗಲ್ಲು; ಚಿರಪರಿಚಿತಳು – ದೀರ್ಘಕಾಲದ ಪರಿಚಯವುಳ್ಳವಳು; ಜನಪ್ರಿಯ – ಜನರ ಮೆಚ್ಚುಗೆಗೆ ಪಾತ್ರವಾದ; ಜಾತಕ ಸಮೇತ – ಸವಿವರವಾದ ಮಾಹಿತಿಯಿಂದ ಕೂಡಿದ, ಜನ್ಮಕುಂಡಲಿ ವಿವರಗಳಿಂದ ಕೂಡಿದ; ಜಾದೂ ಲೋಕ – ಇಂದ್ರಜಾಲ ನಡೆಯುವ ಸ್ಥಳ, ಮಾಯಾವಿದ್ಯೆಯ ಪ್ರಪಂಚ; ತಂಗುದಾಣ – ತಾತ್ಕಾಲಿಕವಾಗಿ ಉಳಿದುಕೊಳ್ಳುವ ಜಾಗ; ತಲುಪು – ಮುಟ್ಟು, ಸೇರು; ತೀರ್ಪು – ನಿರ್ಣಯ, ತೀರ್ಮಾನ; ತುರ್ತು – ಜರೂರು, ಕೂಡಲೆ; ದರ್ಶನ – ಭೇಟಿ, ಕಾಣುವಿಕೆ; ದುಡ್ಡು – ರೊಕ್ಕ, ಹಣ; ಪತ್ರ – ಓಲೆ, ಕಾಗದ; ಪಡೆ – ಗಳಿಸು, ದೊರಕಿಸು; ಪತ್ರಿಕೆ – ನಿಯತಕಾಲಿಕೆ, ಬರೆದ ಕಾಗದ; ಪ್ರಕರಣ – ಸಂಗತಿ, ಪ್ರಸಂಗ; ಪ್ರಸಿದ್ಧ – ಹೆಸರಾದ, ಕೀರ್ತಿಪಡೆದ; ಬಗೆಹರಿ – ನೆರವೇರು, ಕೈಗೂಡು; ಮಾಲ್ – ಮಳಿಗೆ, ಅಂಗಡಿಗಳ ಸಂಕೀರ್ಣ; ಯಥಾವತ್ತಾಗಿ – ಸರಿಯಾಗಿ, ಇದ್ದಹಾಗೆ; ಶುಲ್ಕ – ಸುಂಕ, ದಂಡ; ಸಮಸ್ಯೆ – ತೊಡಕು, ತೊಂದರೆ; ಸಮೇತ – ಕೂಡಿದ, ಸಹಿತವಾದ; ಸಂಪರ್ಕ ಕೇಂದ್ರ – ಸಂಪರ್ಕ ಕಲ್ಪಿಸುವ ಸ್ಥಳ, ಸೇರುವ ಮುಖ್ಯಸ್ಥಳ; ಸಹಕಾರ – ಪರಸ್ಪರ ಸಹಾಯ, ಒಗ್ಗಟ್ಟಿನಿಂದ ಕೆಲಸ ಮಾಡುವಿಕೆ; ಸಹೋದರಿ – ಅಕ್ಕ ಅಥವಾ ತಂಗಿ, ಒಡಹುಟ್ಟಿದವಳು; ಸಾಕ್ಷಿ – ಕಣ್ಣಾರೆ ಕಂಡವ, ಪುರಾವೆ; ಸೋಜಿಗ – ಆಶ್ಚರ್ಯ, ಕುತೂಹಲ; ವಿಶೇಷ – ಹೆಚ್ಚಿನ ಗುಣ, ಹೆಚ್ಚುಗಾರಿಕೆ; ಹಂಗಿಸು – ಕೆಣಕು, ಮೂದಲಿಸು; ಹೊಸಬರು – ಅಪರಿಚಿತರು, ಗುರುತಿಲ್ಲದವರು`,
notes:`ಪ್ರಕಾರ: ಪತ್ರ (ಅನೌಪಚಾರಿಕ/ವೈಯಕ್ತಿಕ ಪತ್ರ). ಕನಕನಹಳ್ಳಿಯಿಂದ ಸೃಜನ ತನ್ನ ತಂಗಿ ಸೌಜನ್ಯಳಿಗೆ ದಿ. 14-11-2024ರಂದು ಬರೆದ ಪತ್ರ. ಪಾಠದ ಆಶಯ: ಸಮಾಜದಲ್ಲಿ ಇತರರ ಸಹಾಯಕ್ಕಾಗಿಯೇ ಬದುಕುವ, ಸಾಮಾನ್ಯರಂತೆ ಬಾಳಿದರೂ ದಾರ್ಶನಿಕ ಗುಣಗಳುಳ್ಳ ವ್ಯಕ್ತಿಗಳನ್ನು ಗುರುತಿಸಿ ಮೆಚ್ಚಿ ಪ್ರಶಂಸಿಸಬೇಕು. ಕೌಶಲ: ಬರೆಯುವುದು; ಸಾಮರ್ಥ್ಯ: ಅನೌಪಚಾರಿಕ ಪತ್ರ ಮತ್ತು ಚಿಕ್ಕ ಪ್ರಬಂಧಗಳನ್ನು ಸ್ವತಂತ್ರವಾಗಿ ರಚಿಸುವುದು. ಪತ್ರದ ವಿಳಾಸ: ಕುಮಾರಿ ಸೌಜನ್ಯ, 5ನೆಯ ತರಗತಿ, ಹಿರಿಯ ಪ್ರಾಥಮಿಕ ಶಾಲೆ, ನಂ.10, ವಿದ್ಯಾನಗರ, ಉತ್ತರ ಕನ್ನಡ.`,
ab:[
[`ಅ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ`,[
[`ಸೃಜನ ಯಾರಿಗೆ ಪತ್ರವನ್ನು ಬರೆದನು?`,`ತನ್ನ ತಂಗಿ ಕುಮಾರಿ ಸೌಜನ್ಯಳಿಗೆ ಪತ್ರವನ್ನು ಬರೆದನು.`],
[`ಯಾರಿಗೆ ಮಿಠಾಯಿ ಎಂದರೆ ಇಷ್ಟ?`,`ಮಿಠಾಯಿ ಎಂದರೆ ಎಲ್ಲರಿಗೂ ಇಷ್ಟ; ಅದರಲ್ಲೂ ಮಕ್ಕಳಿಗೆ ಬಹಳ ಇಷ್ಟ.`],
[`ಮಲ್ಲಜ್ಜಿ ಎಲ್ಲರೊಂದಿಗೆ ಹೇಗೆ ಮಾತನಾಡುತ್ತಾಳೆ?`,`ಯಾರ ಮೇಲೂ ಸಿಟ್ಟು ಮಾಡಿಕೊಳ್ಳದೆ ನಗುನಗುತ್ತಾ ಮಾತನಾಡುತ್ತಾಳೆ.`],
[`ಮಲ್ಲಜ್ಜಿಯ ಕೋರ್ಟಿನಲ್ಲಿ ವಕೀಲರ ಶುಲ್ಕ ಎಷ್ಟು?`,`ಅಲ್ಲಿ ವಕೀಲರೂ ಇಲ್ಲ, ಶುಲ್ಕವೂ ಇಲ್ಲ; ಕೋರ್ಟು ಶುಲ್ಕ, ವಕೀಲರ ಫೀಜು ಯಾವುದೂ ಇಲ್ಲ.`],
[`ಸೃಜನನಿಗೆ ಮಲ್ಲಜ್ಜಿಯ ಮಳಿಗೆ ಯಾವ ಲೋಕದಂತೆ ತೋರಿದೆ?`,`ಜಾದೂ ಲೋಕದಂತೆ ತೋರಿದೆ.`]]],
[`ಆ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಎರಡು–ಮೂರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರಿಸಿ`,[
[`ಮಲ್ಲಜ್ಜಿಯ ಮಳಿಗೆಯಲ್ಲಿ ದೊರೆಯುವ ವಸ್ತುಗಳು ಯಾವುವು? ಪಟ್ಟಿಮಾಡಿರಿ.`,`ಕಡಲೆ, ಪುರಿ, ಕೊಬ್ಬರಿ ಮಿಠಾಯಿಗಳು ಮತ್ತು ಇತ್ತೀಚಿನ ತಿನಿಸುಗಳು; ಯಲ್ಲಿಗೆ ಬೇಕಾದ ಎಲೆ–ಅಡಿಕೆ; ಸಿಂಗಾರಪ್ಪನಿಗೆ ಸಕ್ಕರೆ–ಚಹಾಪುಡಿ; ಪೂಜಾರಪ್ಪನಿಗೆ ಊದುಕಡ್ಡಿ–ಕರ್ಪೂರ; ಬೀಗರಿಗೆ ಬಿಸ್ಕೀಟು–ಖಾರ; ಹೆಣ್ಣುಮಕ್ಕಳಿಗೆ ಸ್ನೋ–ಪೌಡರ್; ಚಿಕ್ಕಮಕ್ಕಳಿಗೆ ಚಾಕಲೇಟು–ಪೆಪ್ಪರಮೆಂಟು.`],
[`ಮಲ್ಲಜ್ಜಿಯ ನ್ಯಾಯಾಲಯದ ಕುರಿತು ವಿವರಿಸಿರಿ.`,`ಮಳಿಗೆಯ ಮುಂದಿರುವ ಚಪ್ಪಡಿಕಲ್ಲುಗಳೇ ಅಲ್ಲಿನ ಕಟಕಟೆ. ಅಲ್ಲಿ ವಕೀಲರು, ಸಾಕ್ಷಿಗಳು ಬೇಕಿಲ್ಲ; ಕೋರ್ಟು ಶುಲ್ಕ, ವಕೀಲರ ಫೀಜು ಇಲ್ಲ. ಎಷ್ಟೋ ಬಾರಿ ದೂರು ನ್ಯಾಯಾಲಯದಲ್ಲಿಯೂ ಬಗೆಹರಿಯದ ದೂರುಗಳನ್ನು ಮಲ್ಲಜ್ಜಿ ತನ್ನ ತೀರ್ಪಿನಿಂದ ಬಗೆಹರಿಸುತ್ತಾಳೆ. ಆದ್ದರಿಂದ ಅದು 'ಜನತಾ ನ್ಯಾಯಾಲಯ'ದಂತಿದೆ.`],
[`ಸೃಜನನಿಗೆ ಮಲ್ಲಜ್ಜಿಯ ಮಳಿಗೆ ಜಾದೂಲೋಕವೆನಿಸಿದ್ದು ಏಕೆ?`,`ಮಳಿಗೆಯ ಬಾಗಿಲು ಸದಾ ತೆರೆದಿರುತ್ತದೆ, ಮಲ್ಲಜ್ಜಿ ಅಂಗಡಿಯಲ್ಲೇ ಇರುತ್ತಾಳೆ. ಯಾವ ಹೊಸ ಬಗೆಯ ಮಿಠಾಯಿ–ಚಾಕಲೇಟ್ ಕೇಳಿದರೂ ಕೊಡುತ್ತಾಳೆ. ಅವಳು ಯಾವಾಗ ವ್ಯಾಪಾರ ಮಾಡುತ್ತಾಳೋ, ವಸ್ತುಗಳನ್ನು ಯಾವಾಗ ತರುತ್ತಾಳೋ ಎಂಬುದು ಸೃಜನನಿಗೆ ಸೋಜಿಗವಾಗಿದೆ. ಆದ್ದರಿಂದ ಜಾದೂಲೋಕವೆನಿಸಿದೆ.`]]],
[`ಇ. ಬಿಟ್ಟ ಸ್ಥಳಗಳನ್ನು ಸರಿಯಾದ ಪದಗಳಿಂದ ತುಂಬಿರಿ`,[
[`ಮಲ್ಲಜ್ಜಿ ನಗುತ್ತಾ ಪ್ರೀತಿಯಿಂದ ______ ಕೊಡುತ್ತಾಳೆ.`,`ಮಿಠಾಯಿ`],
[`ಅವರ ______ ಸಮೇತ ವಿವರಿಸಿ ಬಿಡುತ್ತಾಳೆ.`,`ಜಾತಕ`],
[`ಮಕ್ಕಳಿಂದ ಹಿಡಿದು ಮುದುಕರವರೆಗಿನ ______ ದೂರಮಾಡಿ ಬಿಡುತ್ತಾಳೆ.`,`ದೂರುಗಳನ್ನು`],
[`ಇದರ ಬಾಗಿಲು ಸದಾ ______ ಇರುತ್ತದೆ.`,`ತೆರೆದೇ`],
[`'ಮಲ್ಲಜ್ಜಿಯ ಮಳಿಗೆ' ನನಗೆ ಒಂದು ______ ಇದ್ದಂತೆ.`,`ಜಾದೂ ಲೋಕ`]]],
[`ಭಾಷಾಭ್ಯಾಸ – ಅ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ (ಪತ್ರಲೇಖನ)`,[
[`ಸಮಾನಾರ್ಥಕ ಪದಗಳನ್ನು ಬರೆಯಿರಿ: ಪತ್ರ, ಉಚಿತ, ತುರ್ತು, ಶುಲ್ಕ, ತೀರ್ಪು.`,`ಪತ್ರ – ಓಲೆ, ಕಾಗದ; ಉಚಿತ – ಸೂಕ್ತ, ಯೋಗ್ಯ; ತುರ್ತು – ಜರೂರು, ಕೂಡಲೆ; ಶುಲ್ಕ – ಸುಂಕ, ದಂಡ; ತೀರ್ಪು – ನಿರ್ಣಯ, ತೀರ್ಮಾನ.`],
[`ಯಾವುದಾದರೂ ನಾಲ್ಕು ವಿಧದ ಪತ್ರಗಳನ್ನು ಹೆಸರಿಸಿರಿ.`,`ವೈಯಕ್ತಿಕ ಪತ್ರಗಳು, ಮನವಿ ಪತ್ರಗಳು, ಆಡಳಿತ ವಿಷಯಗಳಿಗೆ ಸಂಬಂಧಿಸಿದ ಪತ್ರಗಳು, ಜಾಹೀರಾತು ಮತ್ತು ಪ್ರಕಟಣೆ ಪತ್ರಗಳು (ಅಥವಾ ವಿವಿಧ ಸಂಗ್ರಹಣೆ ಹಾಗೂ ಪತ್ರಿಕಾವರದಿ ಪತ್ರಗಳು).`]]],
[`ಪತ್ರ ಬರೆಯುವಾಗ ಅನುಸರಿಸಬೇಕಾದ ನಿಯಮಗಳು ಮತ್ತು ಸಂಬೋಧನೆಗಳು (ವ್ಯಾಕರಣ ಮಾಹಿತಿ)`,[
[`ಪತ್ರ ಬರೆಯುವಾಗ ಅನುಸರಿಸಬೇಕಾದ ಸಾಮಾನ್ಯ ನಿಯಮಗಳು ಯಾವುವು?`,`ಮೇಲ್ಭಾಗದಲ್ಲಿ ದಿನಾಂಕ, ಹೆಸರು, ವಿಳಾಸ ಇರಬೇಕು; ಸೂಕ್ತವಾದ ಸಂಬೋಧನೆ ಬರೆಯಬೇಕು; ವಿಷಯಗಳನ್ನು ಅರ್ಥವತ್ತಾಗಿ ಸರಳ ಶೈಲಿಯಲ್ಲಿ ಬರೆಯಬೇಕು; ಔಚಿತ್ಯಪೂರ್ಣ ಕೋರಿಕೆ, ಹಾರೈಕೆ (ಉದಾ: ಇತಿ ನಮಸ್ಕಾರ, ಇತಿ ಆಶೀರ್ವಾದ) ಇರಬೇಕು; ಕೊನೆಯಲ್ಲಿ ಸಹಿ ಹಾಕಬೇಕು; ಲಕೋಟೆ ಮತ್ತು ಪತ್ರದ ಮೇಲ್ಭಾಗದಲ್ಲಿ ಕಳುಹಿಸುವವರ ವಿಳಾಸ ಚಿಕ್ಕದಾಗಿ ಬರೆಯಬೇಕು; ಲಕೋಟೆಯ ಇನ್ನೊಂದು ಬದಿಯಲ್ಲಿ ಕಳುಹಿಸಬೇಕಾದ ವಿಳಾಸ ಚಿಕ್ಕದಾಗಿ ಬರೆಯಬೇಕು; ಬರವಣಿಗೆಯು ಅಂದವಾದ ಶೈಲಿಯಲ್ಲಿ, ಆಕರ್ಷಕವಾಗಿರಬೇಕು.`],
[`ಸಂಬೋಧನೆಗಳು: ತಂದೆ, ತಾಯಿ, ಗುರುಗಳು, ಗೆಳೆಯ/ಗೆಳತಿ, ಚಿಕ್ಕಪ್ಪ–ದೊಡ್ಡಪ್ಪ, ಚಿಕ್ಕಮ್ಮ–ದೊಡ್ಡಮ್ಮ, ಕಿರಿಯರು`,`ತಂದೆಗೆ – ತೀರ್ಥರೂಪ; ತಾಯಿಗೆ – ಮಾತೃಶ್ರೀ; ಗುರುಗಳಿಗೆ – ಪೂಜ್ಯ; ಗೆಳೆಯ/ಗೆಳತಿಗೆ – ಆತ್ಮೀಯ, ನಲ್ಮೆಯ, ಪ್ರೀತಿಯ; ಚಿಕ್ಕಪ್ಪ–ದೊಡ್ಡಪ್ಪನಿಗೆ – ತೀರ್ಥರೂಪ ಸಮಾನ; ಚಿಕ್ಕಮ್ಮ–ದೊಡ್ಡಮ್ಮನಿಗೆ – ಮಾತೃಶ್ರೀ ಸಮಾನ; ಕಿರಿಯರಿಗೆ – ಚಿರಂಜೀವಿ.`]]],
[`ಆ. ಓದಿಗೆ ಮನ್ನಣೆ / ಇ. ಶುಭನುಡಿ (ಚಟುವಟಿಕೆ ಆಧಾರಿತ – ಮಾರ್ಗದರ್ಶನ)`,[
[`ಸಮಾಜ ಸುಧಾರಕರ ಸಾಧನೆಗಳ ಕುರಿತು ಓದಿರಿ; ನಿಮ್ಮ ಊರಿನ ಸಮಾಜ ಸೇವಕರ ಕಾರ್ಯಗಳ ಬಗ್ಗೆ ತಿಳಿಯಿರಿ; ವಿವಿಧ ಪುಸ್ತಕ ಮಳಿಗೆಗಳ ಪರಿಚಯ ಮಾಡಿಕೊಳ್ಳಿರಿ; ಮಾಲ್‌ಗಳಲ್ಲಿ ದೊರೆಯುವ ವಸ್ತುಗಳ ಬಗ್ಗೆ ಅರಿತುಕೊಳ್ಳಿರಿ.`,`ಚಟುವಟಿಕೆ: ತಮ್ಮ ಊರಿನ ಅಂಗಡಿ/ಮಳಿಗೆಯಲ್ಲಿ ದೊರೆಯುವ ವಸ್ತುಗಳ ಪಟ್ಟಿ ಮಾಡಿಸಿ; ತಮ್ಮ ಸ್ನೇಹಿತರಿಗೆ ಅನೌಪಚಾರಿಕ ಪತ್ರ ಬರೆಯಿಸಿ.`],
[`ಶುಭನುಡಿಗಳು`,`ಜನಸೇವೆಯಿಂದ ಜನಮನ್ನಣೆ ದೊರಕುತ್ತದೆ. ವೃತ್ತಿಯೊಂದಿಗೆ ಸೇವೆಯೂ ಉತ್ತಮವಾದ ಪ್ರವೃತ್ತಿ. ಎಲ್ಲರೊಳಗೊಂದಾಗುವ ಬಾಳು ಆದರ್ಶದ ಬಾಳು. ಅನುಭವದ ನುಡಿಗಳು ಬದುಕಿಗೆ ದಾರಿದೀಪ.`]]]
],
qb:[
M(`'ಮಲ್ಲಜ್ಜಿಯ ಮಳಿಗೆ' ಪಾಠವು ಯಾವ ಪ್ರಕಾರದಲ್ಲಿದೆ?`,[`ನಾಟಕ`,`ಪತ್ರ`,`ಕವನ`,`ಕಥೆ`],1),
M(`ಸೃಜನ ಪತ್ರ ಬರೆದುದು ಯಾರಿಗೆ?`,[`ಸೌಜನ್ಯ`,`ಮಲ್ಲಜ್ಜಿ`,`ಚಿಕ್ಕಮ್ಮ`,`ಚಿಕ್ಕಪ್ಪ`],0),
M(`ಮಲ್ಲಜ್ಜಿಯ ಕೋರ್ಟಿನ ಕಟಕಟೆ ಯಾವುದು?`,[`ಮರದ ಕುರ್ಚಿ`,`ಮಳಿಗೆಯ ಮುಂದಿನ ಚಪ್ಪಡಿಕಲ್ಲುಗಳು`,`ಮೇಜು`,`ಅಂಗಡಿಯ ಒಳಗಿನ ಪೆಟ್ಟಿಗೆ`],1),
M(`'ತಂಗುದಾಣ' ಪದದ ಅರ್ಥ:`,[`ಉಳಿದುಕೊಳ್ಳುವ ಜಾಗ`,`ಅಂಗಡಿ`,`ದೇವಾಲಯ`,`ಶಾಲೆ`],0),
M(`ಮಲ್ಲಜ್ಜಿಯ ಮಳಿಗೆಯನ್ನು ಸೃಜನ ಯಾವ ಲೋಕಕ್ಕೆ ಹೋಲಿಸಿದ್ದಾನೆ?`,[`ದೇವಲೋಕ`,`ಜಾದೂ ಲೋಕ`,`ಪಾತಾಳ ಲೋಕ`,`ಮೃತ್ಯು ಲೋಕ`],1),
M(`ತಂದೆಗೆ ಪತ್ರ ಬರೆಯುವಾಗ ಬಳಸುವ ಸಂಬೋಧನೆ:`,[`ಮಾತೃಶ್ರೀ`,`ತೀರ್ಥರೂಪ`,`ಚಿರಂಜೀವಿ`,`ಪೂಜ್ಯ`],1),
O(`ಸೃಜನ ಪತ್ರವನ್ನು ಯಾವ ಊರಿನಿಂದ ಬರೆದನು?`,`ಕನಕನಹಳ್ಳಿಯಿಂದ.`),
O(`ಮಲ್ಲಜ್ಜಿಯ ನ್ಯಾಯಾಲಯವನ್ನು ಸೃಜನ ಹೇಗೆ ಕರೆದಿದ್ದಾನೆ?`,`'ಜನತಾ ನ್ಯಾಯಾಲಯ' ಎಂದು.`),
O(`ಮಲ್ಲಜ್ಜಿಯ ಮಳಿಗೆ ಎಲ್ಲರಿಗೂ ಒಂದು ರೀತಿಯ ಏನು?`,`ತಂಗುದಾಣ.`),
O(`ಚಿಕ್ಕಮಕ್ಕಳಿಗೆ ಮಲ್ಲಜ್ಜಿಯ ಮಳಿಗೆಯಲ್ಲಿ ಏನು ದೊರೆಯುತ್ತದೆ?`,`ಚಾಕಲೇಟು–ಪೆಪ್ಪರಮೆಂಟು.`),
O(`ಪತ್ರ ಬರೆಯುವಾಗ ಪತ್ರದ ಕೊನೆಯಲ್ಲಿ ಏನು ಹಾಕಬೇಕು?`,`ಸಹಿ.`,'m'),
G(`'ಪತ್ರ' ಪದಕ್ಕೆ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಓಲೆ, ಕಾಗದ`,'e'),
G(`'ತುರ್ತು' ಪದದ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಜರೂರು, ಕೂಡಲೆ`),
G(`'ತೀರ್ಪು' ಪದದ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ನಿರ್ಣಯ, ತೀರ್ಮಾನ`),
G(`'ದುಡ್ಡು' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ರೊಕ್ಕ, ಹಣ`,'e'),
G(`'ಸಹೋದರಿ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಅಕ್ಕ ಅಥವಾ ತಂಗಿ, ಒಡಹುಟ್ಟಿದವಳು`),
G(`ಯಾವುದಾದರೂ ಎರಡು ವಿಧದ ಪತ್ರಗಳನ್ನು ಹೆಸರಿಸಿ.`,`ವೈಯಕ್ತಿಕ ಪತ್ರ, ಮನವಿ ಪತ್ರ`),
S(`ಮಲ್ಲಜ್ಜಿ ಜನರ ಸಮಸ್ಯೆಗಳನ್ನು ಹೇಗೆ ಬಗೆಹರಿಸುತ್ತಾಳೆ?`,`ಮಲ್ಲಜ್ಜಿ ಯಾರ ಮೇಲೂ ಸಿಟ್ಟು ಮಾಡಿಕೊಳ್ಳದೆ ನಗುನಗುತ್ತಾ ಮಾತನಾಡುತ್ತಾಳೆ. ವಕೀಲ, ಸಾಕ್ಷಿ, ಶುಲ್ಕವಿಲ್ಲದೆ ಮಳಿಗೆಯ ಮುಂದಿನ ಚಪ್ಪಡಿಕಲ್ಲುಗಳ ಮೇಲೆ ಕುಳಿತು ಮಕ್ಕಳಿಂದ ಮುದುಕರವರೆಗಿನ ದೂರುಗಳನ್ನು ತೀರ್ಪು ನೀಡಿ ದೂರ ಮಾಡುತ್ತಾಳೆ.`),
S(`ಮಲ್ಲಜ್ಜಿಯ ಮಳಿಗೆ 'ಸಹಕಾರಿ ಬ್ಯಾಂಕ್' ಇದ್ದಂತೆ ಹೇಗೆ?`,`ದುಡ್ಡಿಲ್ಲದೆ ಬಂದ ಪುಟ್ಟ ಮಕ್ಕಳಿಗೂ ಮಲ್ಲಜ್ಜಿ ಮಿಠಾಯಿ ಕೊಡುತ್ತಾಳೆ. ದೊಡ್ಡವರು ಹಣವಿದ್ದಾಗ ವಸ್ತುಗಳ ಹಣ ತಂದುಕೊಡುತ್ತಾರೆ, ತುರ್ತಾಗಿ ಬೇಕಾದಾಗ ಸಾಲವಾಗಿ ಹಣವನ್ನೂ ಪಡೆದುಕೊಂಡು ಹೋಗುತ್ತಾರೆ. ಆದ್ದರಿಂದ ಅದು ಪ್ರೀತಿಯ ಸಹಕಾರಿ ಬ್ಯಾಂಕ್ ಇದ್ದಂತೆ.`),
S(`ಮಲ್ಲಜ್ಜಿಯ ಮಳಿಗೆ ಸಂಪರ್ಕ ಕೇಂದ್ರದಂತೆ ಹೇಗೆ?`,`ಊರಿಗೆ ಹೊಸಬರು ಬಂದರೆ ಮೊದಲು ಮಾತನಾಡುವುದು ಮಲ್ಲಜ್ಜಿಯನ್ನೇ. ಅವಳು ಯಾರ ಮನೆ ಬೇಕು ತೋರಿಸುತ್ತಾಳೆ, ಬೇಕಾದ ವಿಷಯ ತಿಳಿಸುತ್ತಾಳೆ, ಪತ್ರಗಳನ್ನು ತಲುಪಿಸುತ್ತಾಳೆ, ಬಸ್ಸುಗಳು ಬರುವ ಸಮಯದ ವಿವರವನ್ನೂ ಹೇಳುತ್ತಾಳೆ.`),
L(`ಮಲ್ಲಜ್ಜಿಯ ಮಳಿಗೆಯ ವಿಶೇಷತೆಗಳನ್ನು ನಿಮ್ಮ ಮಾತುಗಳಲ್ಲಿ ವಿವರಿಸಿ.`,`ಮಲ್ಲಜ್ಜಿಯ ಮಳಿಗೆ ನೋಡಲು ಚಿಕ್ಕದಾದರೂ ಕಡಲೆ, ಪುರಿ, ಮಿಠಾಯಿ, ಎಲೆ–ಅಡಿಕೆ, ಸಕ್ಕರೆ, ಊದುಕಡ್ಡಿ, ಬಿಸ್ಕೀಟು, ಸ್ನೋ–ಪೌಡರ್, ಚಾಕಲೇಟು ಎಲ್ಲವೂ ಸಿಗುತ್ತವೆ. ಅದು ಎಲ್ಲರಿಗೂ ತಂಗುದಾಣ, ಪ್ರೀತಿಯ ಸಹಕಾರಿ ಬ್ಯಾಂಕ್, ಉಚಿತ ಸಂಪರ್ಕ ಕೇಂದ್ರ, ಜನಪ್ರಿಯ ಜನತಾ ನ್ಯಾಯಾಲಯವೂ ಹೌದು. ಮಲ್ಲಜ್ಜಿ ಎಲ್ಲರೊಂದಿಗೆ ನಗುನಗುತ್ತಾ ಮಾತನಾಡುತ್ತಾ ಸಹಾಯ ಮಾಡುವ ಗುಣವುಳ್ಳವಳು. ಅದರ ಬಾಗಿಲು ಸದಾ ತೆರೆದಿರುವುದರಿಂದ ಸೃಜನನಿಗೆ ಅದು ಜಾದೂ ಲೋಕವೆನಿಸಿದೆ.`),
L(`ಸಮಾಜದಲ್ಲಿ ಮಲ್ಲಜ್ಜಿಯಂತಹ ವ್ಯಕ್ತಿಗಳನ್ನು ನಾವು ಏಕೆ ಮೆಚ್ಚಬೇಕು?`,`ಮಲ್ಲಜ್ಜಿಯಂತಹವರು ಇತರರ ಸಹಾಯಕ್ಕಾಗಿಯೇ ಬದುಕುತ್ತಾರೆ. ಅವರು ಸಾಮಾನ್ಯ ಜನರ ನಡುವೆ ಸಾಮಾನ್ಯರಂತೆ ಬಾಳುತ್ತಾ ದಾರ್ಶನಿಕ ಗುಣಗಳನ್ನು ಹೊಂದಿರುತ್ತಾರೆ. ಪ್ರೀತಿ, ಸಹಾಯ, ನ್ಯಾಯಪರತೆ, ಸಹಕಾರದ ಗುಣಗಳಿಂದ ಸಮಾಜಕ್ಕೆ ಮಾದರಿಯಾಗುತ್ತಾರೆ. ಅಂತಹವರನ್ನು ಗುರುತಿಸಿ ಮೆಚ್ಚಿ ಪ್ರಶಂಸಿಸುವುದರಿಂದ ಇತರರಿಗೂ ಪ್ರೇರಣೆ ದೊರೆಯುತ್ತದೆ.`)
]});

LS5.push({n:3,t:`ಧೀರ ಸೇನಾನಿ`,au:`ಬಸವರಾಜ ಹದ್ಲಿ`,pg:16,
words:`ಅಲಂಕೃತ – ಅಲಂಕಾರ ಮಾಡಿದ, ಸಿಂಗರಿಸಿದ; ಉತ್ತುಂಗ – ಶ್ರೇಷ್ಠ; ಕಾವಲಿರಿಸು – ರಕ್ಷಿಸು; ಕೃತಿ – ಕೆಲಸ; ಗಾಡಿ – ಚಕ್ಕಡಿ, ಬಂಡಿ; ಗಾಥೆ – ಕತೆ, ಘಟನೆ; ಗ್ರಾಮದ ಓಣಿ – ಹಳ್ಳಿಯ ಬೀದಿ; ಜನ್ಮತಾಳು – ಹುಟ್ಟು, ಜನಿಸು; ದುರ್ಗಮ – ಹೋಗಲು ಅಸಾಧ್ಯವಾದ; ಫೀಲ್ಡ್ – ಭೂಭಾಗ; ಫೀಲ್ಡ್ ಮಾರ್ಷಲ್ – ಭೂಸೇನೆಯಲ್ಲಿ ವಿಶೇಷ ಪರಿಣತಿಯನ್ನು ಪಡೆದವರಿಗೆ ಕೊಡುವ ಅತ್ಯುನ್ನತ ಪದವಿ; ಮಹಾದಂಡನಾಯಕರು – ಸೇನಾ ವರಿಷ್ಠ, ಸೈನ್ಯದ ಅತಿ ಹಿರಿಯ ಅಧಿಕಾರಿ; ನೇತೃತ್ವ – ಮುಂದಾಳತ್ವ, ಹಿರಿತನ; ಲೇಸು – ಒಪ್ಪಿತ, ಒಳ್ಳೆಯದು; ಸಜ್ಜನಿಕೆ – ಒಳ್ಳೆಯತನ`,
notes:`ಪಾಠದ ಆಶಯ: ನಮ್ಮ ದೇಶ ತ್ಯಾಗ, ಬಲಿದಾನಗಳಿಗೆ ಹೆಸರುವಾಸಿ; ದೇಶದ ರಕ್ಷಣೆಯ ಮಾತು ಬಂದಾಗ ಜೀವದ ಹಂಗು ತೊರೆದು ಹೋರಾಡಿದ ಮಹನೀಯರು ನಮಗೆ ಪ್ರಾತಃಸ್ಮರಣೀಯರು. ಕೃತಿಕಾರರ ಪರಿಚಯ: ಡಾ. ಬಸವರಾಜ ಹದ್ಲಿಯವರು 01-06-1955ರಂದು ಬಾಗಲಕೋಟೆ ಜಿಲ್ಲೆಯ ಬೇವೂರಿನಲ್ಲಿ ಜನಿಸಿದರು. ತಂದೆ ಚನ್ನಪ್ಪ, ತಾಯಿ ಚನ್ನವ್ವ. 1997ರಲ್ಲಿ ಮುಳಗುಂದದ ಬಾಲಲೀಲಾ ಮಹಾಂತ ಶಿವಯೋಗಿಗಳ ಕುರಿತ ಮಹಾಪ್ರಬಂಧಕ್ಕೆ ಡಾಕ್ಟರೇಟ್ ಪದವಿ ಪಡೆದರು. ಶ್ರೀ ತಮ್ಮಣ್ಣಪ್ಪ ಚಿಕ್ಕೋಡಿ ಕಲಾ ಮಹಾವಿದ್ಯಾಲಯದಲ್ಲಿ ಕಳೆದ 25 ವರ್ಷಗಳಿಂದ ಸೇವೆ ಸಲ್ಲಿಸಿದ್ದಾರೆ. ಕೃತಿಗಳು: ಬೇವೂರಿನ ಅಪರೂಪದವರು, ಅಕ್ಕನ ಬಳಗ ಮುಂತಾದವು. ಈ ಪಾಠವನ್ನು ಅವರ 'ವೀರ ಸೇನಾನಿ ಜನರಲ್ ಜಿ.ಜಿ.ಬೇವೂರ' ಪುಸ್ತಕದಿಂದ ಆಯ್ದುಕೊಳ್ಳಲಾಗಿದೆ. ಕೌಶಲ: ಬರೆಯುವುದು; ಸಾಮರ್ಥ್ಯ: ಸರಳ ಕ್ರಿಯಾತ್ಮಕ ಸಾಂದರ್ಭಿಕ ಭಾಷಾಂಶ ನಿಯಮಗಳನ್ನು ಅರ್ಥಮಾಡಿಕೊಂಡು ಅವುಗಳನ್ನು ಬರವಣಿಗೆಯಲ್ಲಿ ಬಳಸುವುದು.`,
ab:[
[`ಅ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ`,[
[`ಬೇವೂರರು ಯಾವಾಗ ಜನಿಸಿದರು?`,`ಬೇವೂರರು 11-08-1916 ರಂದು ಜನಿಸಿದರು.`],
[`ಬೇವೂರರ ತಂದೆ ತಾಯಿಯರ ಹೆಸರೇನು?`,`ತಂದೆ ಸರ್. ಗುರುನಾಥ ರಾವ್; ತಾಯಿ ರುಕ್ಮಿಣಿಬಾಯಿ.`],
[`ಗೋಪಾಲರಾಯರ ಸ್ವಂತ ಊರು ಯಾವುದು?`,`ಬಾಗಲಕೋಟೆ ಜಿಲ್ಲೆಯ ಬೇವೂರ.`],
[`ಬೇವೂರರನ್ನು ಬಿಗಿದಪ್ಪಿ ಪ್ರಶಂಸಿಸಿದವರು ಯಾರು?`,`ಭೂಸೇನೆಯ ಮಹಾದಂಡನಾಯಕರಾಗಿದ್ದ ಫೀಲ್ಡ್ ಮಾರ್ಷಲ್ ಮಾಣಿಕ್ ಷಾ ಅವರು.`],
[`ಭಾರತ ಸರ್ಕಾರವು ಬೇವೂರರನ್ನು ಎರಡು ವರ್ಷದ ಅವಧಿಗೆ ಯಾವ ಕಾರ್ಯಕ್ಕೆ ನೇಮಿಸಿತು?`,`ಡೆನ್ಮಾರ್ಕಿನ ರಾಯಭಾರಿಯಾಗಿ ನೇಮಿಸಿತು.`]]],
[`ಆ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಎರಡು–ಮೂರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರಿಸಿ`,[
[`ಗೋಪಾಲರಾಯರು ಎಲ್ಲಿ ಸೈನಿಕ ಶಿಕ್ಷಣ ಪಡೆದರು?`,`ರಾಯಲ್ ಇಂಡಿಯನ್ ಮಿಲಿಟರಿ ಕಾಲೇಜಿನಲ್ಲಿ ಮತ್ತು ಇಂಡಿಯನ್ ಮಿಲಿಟರಿ ಅಕಾಡೆಮಿಯಲ್ಲಿ ಸೈನಿಕ ಶಿಕ್ಷಣ ಪಡೆದರು.`],
[`ಬೇವೂರರ ನೇತೃತ್ವದ ಸೈನಿಕ ತುಕಡಿಯ ಸಾಹಸವನ್ನು ವಿವರಿಸಿರಿ.`,`1971ರ ಬಾಂಗ್ಲಾ ಯುದ್ಧದಲ್ಲಿ ಬೇವೂರರ ನೇತೃತ್ವದ ತುಕಡಿ ಪಶ್ಚಿಮ ಪಾಕಿಸ್ತಾನದ ಕಡೆಗೆ ನುಗ್ಗಿತು. ಸೇನಾ ತುಕಡಿಯ ಮುಖ್ಯಸ್ಥರಾಗಿ ರಾಜಸ್ಥಾನ ಮತ್ತು ಕಛ್‌ನ ದುರ್ಗಮ ಪ್ರದೇಶಗಳಲ್ಲಿ ಸಾವಿರಾರು ಚದರಮೈಲು ಪಾಕ್ ನೆಲವನ್ನು ಆಕ್ರಮಿಸಿಕೊಂಡರು.`],
[`ಬೇವೂರರ ಸಜ್ಜನಿಕೆಯನ್ನು ಉದಾಹರಣೆಯೊಂದಿಗೆ ತಿಳಿಸಿರಿ.`,`ಬೇವೂರಿನ ಆದರ್ಶ ವಿದ್ಯಾವರ್ಧಕ ಸಂಘಕ್ಕೆ ಅತಿಥಿಯಾಗಿ ಬಂದಾಗ ಅಧಿಕಾರಿಗಳು ಅಲಂಕೃತ ಜೀಪು, ಬಂದೂಕುಧಾರಿ ಪೊಲೀಸರ ಕಾವಲು ಏರ್ಪಡಿಸಿದ್ದರು. ಬೇವೂರರು 'ನಾನೊಬ್ಬ ಸೈನಿಕ. ನನಗೇಕೆ ರಕ್ಷಣೆ? ಇದು ನನ್ನ ಊರು, ಇವರೆಲ್ಲ ನನ್ನ ಜನ' ಎಂದು ಹೇಳಿ ಹೆಂಡತಿ ರಾಧಿಕಾಬಾಯಿಯೊಂದಿಗೆ ರೈತನ ಗಾಡಿಯಲ್ಲಿ ಕುಳಿತು, ಜನರೊಂದಿಗೆ ಮಾತನಾಡುತ್ತಾ ಗ್ರಾಮದ ಓಣಿಗಳಲ್ಲಿ ನಡೆದುಕೊಂಡು ಹೋದರು.`],
[`ನಿವೃತ್ತಿ ನಂತರವೂ ಬೇವೂರರ ಸೇವೆ ಭಾರತ ಸರ್ಕಾರಕ್ಕೆ ಆವಶ್ಯಕವೆನಿಸಿದ ಸಂದರ್ಭ ಯಾವುದು?`,`ಅವರ ಆಡಳಿತ ವೈಖರಿಯನ್ನು ಗುರುತಿಸಿ ಭಾರತ ಸರ್ಕಾರವು ಅವರನ್ನು ಡೆನ್ಮಾರ್ಕಿನ ರಾಯಭಾರಿಯನ್ನಾಗಿ ಎರಡು ವರ್ಷಗಳ ಅವಧಿಗೆ ನೇಮಿಸಿತು.`]]],
[`ಇ. ಬಿಟ್ಟ ಸ್ಥಳಗಳನ್ನು ತುಂಬಿರಿ`,[
[`ಗೋಪಾಲರಾಯರ ತಂದೆ ______ ತಾಯಿ ______`,`ಸರ್. ಗುರುನಾಥ ರಾವ್; ರುಕ್ಮಿಣಿಬಾಯಿ`],
[`ಗೋಪಾಲರಾಯರು ತಮ್ಮ ವಿದ್ಯಾರ್ಥಿ ಜೀವನದಲ್ಲಿಯೇ ______ ಖಡ್ಗ ಮತ್ತು ______ ಪದಕ ಪಡೆದಿದ್ದರು.`,`ಗೌರವ; ಚಿನ್ನದ`],
[`'ಯುವಜನರು ನಾಳೆಯ ______ ರಾಗಬೇಕು' ಎಂಬುದು ಅವರ ಬಯಕೆಯಾಗಿತ್ತು.`,`ದೇಶ ರಕ್ಷಕರು`],
[`ಡಾರ್ಜಿಲಿಂಗ್‌ನಲ್ಲಿ ಕಟ್ಟಿಸಿದ ______ ಭವನಕ್ಕೆ ಜಿ.ಜಿ. ಬೇವೂರರ ಹೆಸರಿಟ್ಟಿದ್ದಾರೆ.`,`ಯುದ್ಧ ಸ್ಮಾರಕ`],
[`'ನಾನೊಬ್ಬ ______ ನನಗೇಕೆ ರಕ್ಷಣೆ? ಇದು ನನ್ನ ಊರು. ಇವರೆಲ್ಲ ನನ್ನ ______' ಎಂದರು.`,`ಸೈನಿಕ; ಜನ`]]],
[`ವ್ಯಾಕರಣ ಮಾಹಿತಿ – ಲೇಖನ ಚಿಹ್ನೆಗಳು`,[
[`ಲೇಖನ ಚಿಹ್ನೆಗಳು ಎಂದರೇನು?`,`ನಾವು ಬರೆದ ವಿಚಾರಗಳು ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿ ಅರ್ಥವಾಗಲೆಂದು ಅಲ್ಲಲ್ಲಿ ಉಪಯೋಗಿಸುವ ಚಿಹ್ನೆಗಳಿಗೆ ಲೇಖನ ಚಿಹ್ನೆಗಳೆನ್ನುವರು.`],
[`ಲೇಖನ ಚಿಹ್ನೆಗಳು ಯಾವುವು? (10)`,`1. ಪೂರ್ಣವಿರಾಮ (.) 2. ಅರ್ಧವಿರಾಮ (;) 3. ಅಲ್ಪ ವಿರಾಮ (,) 4. ಪ್ರಶ್ನಾರ್ಥಕ (?) 5. ಭಾವಸೂಚಕ (!) 6. ಉದ್ಧರಣ (“ ”) 7. ಆವರಣ ( ) 8. ಸಮಾನಾರ್ಥಕ (=) 9. ವಿವರಣ (: / :–) 10. ವಾಕ್ಯವೇಷ್ಟನ (‘ ’)`]]],
[`ಭಾಷಾಭ್ಯಾಸ – ಅ. ಕಥೆ ನಕಲು ಮಾಡಿ ಸೂಕ್ತ ಲೇಖನ ಚಿಹ್ನೆಗಳನ್ನು ಬಳಸಿ (ಮಾದರಿ ಉತ್ತರ)`,[
[`ಸುಂದರವಾದ ಒಂದು ತೋಪು ... ಗೆಳೆಯನನ್ನು ಕರೆದುಕೊಂಡು ಹೋಯಿತು (ಗಿಳಿರಾಯನ ಕಥೆ – ಪಠ್ಯಪುಸ್ತಕದ ಅನುಚ್ಛೇದ)`,`ಮಾದರಿ ರೂಪ: ಸುಂದರವಾದ ಒಂದು ತೋಪು. ಅಲ್ಲಿ ತೆಂಗು, ತಾಳೆ, ಬಾಳೆ, ಮಾವು ಹಾಗೂ ರಸತುಂಬಿದ ನೇರಲ ಹಣ್ಣುಗಳಿದ್ದವು. ಗಿಳಿರಾಯ ಹಣ್ಣುಗಳನ್ನು ಕುಕ್ಕಿಕುಕ್ಕಿ ರುಚಿ ಹೀರುತ್ತ ತನ್ನ ಮಿತ್ರನಿಗೆ ಹೇಳಿತು, “ಆಹಾ! ಎಂಥ ಸಿಹಿ! ಸವಿಯುತ್ತೇನೆ. ಮಿತ್ರ, ಬಾ, ನೀನು ಈ ರುಚಿಯನ್ನು ಹೀರು” ಎಂದಿತು. ಆಗ ಗೆಳೆಯ ಗಿಳಿರಾಯ, “ನದಿಯ ದಡದಲ್ಲಿರುವ ವಿವಿಧ ಹಣ್ಣುಗಳ ಸಿಹಿಯನ್ನು ನೀನು ಸವಿದಿರುವೆಯಾ? ನನ್ನೊಡನೆ ಬಾ, ನದಿಯ ದಡದಲ್ಲಿರುವ ಮರಗಳಿಂದ ವಿಧವಿಧವಾದ ಹಣ್ಣುಗಳ ರುಚಿಯನ್ನು ಸವಿಯುವಂತೆ” ಎಂದು ಗೆಳೆಯನನ್ನು ಕರೆದುಕೊಂಡು ಹೋಯಿತು. (ಚಿಹ್ನೆಗಳ ಸ್ಥಾನವನ್ನು ಪಠ್ಯಪುಸ್ತಕದೊಂದಿಗೆ ಪರಿಶೀಲಿಸಿ.)`]]],
[`ಆ. ಯೋಜನೆ / ಇ. ಓದಿಗೆ ಮನ್ನಣೆ (ಚಟುವಟಿಕೆ ಆಧಾರಿತ – ಮಾರ್ಗದರ್ಶನ)`,[
[`ಗೋಪಾಲರಾಯರ ಜೀವನ ವಿವರಗಳನ್ನು ಕುರಿತು ಒಂದು ಪುಟ್ಟ ಪ್ರಬಂಧ ರಚಿಸಿ; ಸೈನಿಕರ ತ್ಯಾಗ–ಬಲಿದಾನದ ಕುರಿತು ಓದಿರಿ.`,`ಮಾರ್ಗದರ್ಶನ: ಜನನ, ವಿದ್ಯಾಭ್ಯಾಸ, ಸೇನೆ ಸೇರಿದ್ದು, ಬಾಂಗ್ಲಾ ಯುದ್ಧ, ಮಹಾದಂಡನಾಯಕ ಹುದ್ದೆ, ಪ್ರಶಸ್ತಿ, ಸಜ್ಜನಿಕೆ, ನಿಧನ (24 ಅಕ್ಟೋಬರ್ 1989) – ಈ ಕ್ರಮದಲ್ಲಿ ಬರೆಯಿಸಿ.`]]]
],
qb:[
M(`ಜನರಲ್ ಜಿ.ಜಿ. ಬೇವೂರರ ಊರು:`,[`ಬಾಗಲಕೋಟೆ ಜಿಲ್ಲೆಯ ಬೇವೂರ`,`ಮೈಸೂರು`,`ಧಾರವಾಡ`,`ಬೆಳಗಾವಿ`],0),
M(`ಬೇವೂರರ ಜನ್ಮ ದಿನಾಂಕ:`,[`11-08-1916`,`15-08-1947`,`26-01-1950`,`01-06-1955`],0),
M(`ಬೇವೂರರನ್ನು ಬಿಗಿದಪ್ಪಿ ಪ್ರಶಂಸಿಸಿದವರು:`,[`ಮಾಣಿಕ್ ಷಾ`,`ನೆಹರು`,`ಗಾಂಧೀಜಿ`,`ಇಂದಿರಾ ಗಾಂಧಿ`],0),
M(`ಬೇವೂರರು ಜನವರಿ 1973ರಲ್ಲಿ ಭಾರತದ ಭೂಸೇನೆಯ ಎಷ್ಟನೆಯ ಮಹಾದಂಡನಾಯಕರಾದರು?`,[`ಏಳನೆಯ`,`ಎಂಟನೆಯ`,`ಒಂಬತ್ತನೆಯ`,`ಹತ್ತನೆಯ`],2),
M(`ಬೇವೂರರ ಹೆಸರಿಟ್ಟ ಯುದ್ಧ ಸ್ಮಾರಕ ಭವನ ಯಾವ ಊರಿನಲ್ಲಿದೆ?`,[`ಡಾರ್ಜಿಲಿಂಗ್`,`ದೆಹಲಿ`,`ಮುಂಬೈ`,`ಬೆಂಗಳೂರು`],0),
M(`ಬೇವೂರರ ತತ್ವ ಯಾವುದು?`,[`ಮಾತಿಗಿಂತ ಕೃತಿ ಲೇಸು`,`ಕಾಯಕವೇ ಕೈಲಾಸ`,`ಜನಸೇವೆಯೇ ಜನಾರ್ದನ ಸೇವೆ`,`ವಿದ್ಯೆಯೇ ಧನ`],0),
O(`ಬೇವೂರರು ಭಾರತೀಯ ಸೇನಾಪಡೆ ಸೇರಿದ ವರ್ಷ ಯಾವುದು?`,`1937`),
O(`ಎನ್.ಸಿ.ಸಿ.ಯ ಮೊದಲ ನಿರ್ದೇಶಕರು ಯಾರು?`,`ಜನರಲ್ ಜಿ.ಜಿ. ಬೇವೂರರು.`),
O(`ಬೇವೂರರ ಪತ್ನಿಯ ಹೆಸರೇನು?`,`ರಾಧಿಕಾಬಾಯಿ.`),
O(`ಬೇವೂರರಿಗೆ ಭಾರತ ಸರ್ಕಾರ ನೀಡಿದ ಪ್ರಶಸ್ತಿ ಯಾವುದು?`,`ಪದ್ಮಭೂಷಣ ಪ್ರಶಸ್ತಿ ಹಾಗೂ ಪರಮ ವಿಶಿಷ್ಟ ಸೇವಾ ಪದಕ.`,'m'),
O(`ಬೇವೂರರು ಯಾವ ದಿನಾಂಕದಂದು ನಿಧನರಾದರು?`,`24 ಅಕ್ಟೋಬರ್ 1989.`,'m'),
G(`'ಸಜ್ಜನಿಕೆ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಒಳ್ಳೆಯತನ`,'e'),
G(`'ಮಹಾದಂಡನಾಯಕರು' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಸೇನಾ ವರಿಷ್ಠ, ಸೈನ್ಯದ ಅತಿ ಹಿರಿಯ ಅಧಿಕಾರಿ`),
G(`'ದುರ್ಗಮ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಹೋಗಲು ಅಸಾಧ್ಯವಾದ`),
G(`ಪೂರ್ಣವಿರಾಮ ಚಿಹ್ನೆಯನ್ನು ಬರೆಯಿರಿ.`,`(.)`,'e'),
G(`ಪ್ರಶ್ನಾರ್ಥಕ ಚಿಹ್ನೆಯನ್ನು ಬರೆಯಿರಿ.`,`(?)`,'e'),
G(`ಭಾವಸೂಚಕ ಚಿಹ್ನೆಯನ್ನು ಬರೆಯಿರಿ.`,`(!)`,'e'),
S(`ಬೇವೂರರ ನೇತೃತ್ವದ ಸೈನಿಕ ತುಕಡಿಯು ಬಾಂಗ್ಲಾ ಯುದ್ಧದಲ್ಲಿ ಏನು ಸಾಧಿಸಿತು?`,`ಪಶ್ಚಿಮ ಪಾಕಿಸ್ತಾನದ ಕಡೆಗೆ ನುಗ್ಗಿ ರಾಜಸ್ಥಾನ ಮತ್ತು ಕಛ್‌ನ ದುರ್ಗಮ ಪ್ರದೇಶಗಳಲ್ಲಿ ಸಾವಿರಾರು ಚದರಮೈಲು ಪಾಕ್ ನೆಲವನ್ನು ಆಕ್ರಮಿಸಿಕೊಂಡಿತು.`),
S(`ಯುವಜನರ ಬಗ್ಗೆ ಬೇವೂರರ ಬಯಕೆ ಏನಾಗಿತ್ತು?`,`'ಯುವಜನರು ನಾಳೆಯ ದೇಶ ರಕ್ಷಕರಾಗಬೇಕು' ಎಂಬುದು ಅವರ ಬಯಕೆಯಾಗಿತ್ತು. ಅದಕ್ಕಾಗಿ ಅವರು ಎನ್.ಸಿ.ಸಿ.ಯ ಮೊದಲ ನಿರ್ದೇಶಕರಾಗಿ ಹಗಲಿರುಳೆನ್ನದೆ ಶ್ರಮಿಸಿದರು.`),
S(`ಬೇವೂರರ ಸಜ್ಜನಿಕೆಯ ಒಂದು ಉದಾಹರಣೆ ಕೊಡಿ.`,`ಊರಿನಲ್ಲಿ ಮೆರವಣಿಗೆಗಾಗಿ ಅಲಂಕೃತ ಜೀಪು, ಪೊಲೀಸ್ ಕಾವಲು ಏರ್ಪಡಿಸಿದಾಗ 'ನಾನೊಬ್ಬ ಸೈನಿಕ, ಇವರೆಲ್ಲ ನನ್ನ ಜನ' ಎಂದು ಹೇಳಿ ರೈತನ ಗಾಡಿಯಲ್ಲಿ ಹೆಂಡತಿಯೊಂದಿಗೆ ಕುಳಿತು ಗ್ರಾಮದ ಓಣಿಗಳಲ್ಲಿ ಜನರೊಂದಿಗೆ ಮಾತನಾಡುತ್ತಾ ನಡೆದರು.`),
L(`ಜನರಲ್ ಜಿ.ಜಿ. ಬೇವೂರರ ಜೀವನ ಮತ್ತು ಸಾಧನೆಗಳನ್ನು ನಿಮ್ಮ ಮಾತುಗಳಲ್ಲಿ ಬರೆಯಿರಿ.`,`ಗೋಪಾಲರಾವ್ ಗುರುನಾಥರಾವ್ ಬೇವೂರರು ಬಾಗಲಕೋಟೆ ಜಿಲ್ಲೆಯ ಬೇವೂರಿನಲ್ಲಿ 11-08-1916 ರಂದು ಜನಿಸಿದರು. ಮಿಲಿಟರಿ ಕಾಲೇಜು ಮತ್ತು ಅಕಾಡೆಮಿಯಲ್ಲಿ ಶಿಕ್ಷಣ ಪಡೆದು ವಿದ್ಯಾರ್ಥಿ ಜೀವನದಲ್ಲೇ ಗೌರವಖಡ್ಗ ಮತ್ತು ಚಿನ್ನದ ಪದಕ ಪಡೆದರು. 1937ರಲ್ಲಿ ಸೇನೆ ಸೇರಿ 1971ರ ಬಾಂಗ್ಲಾ ಯುದ್ಧದಲ್ಲಿ ಅಪ್ರತಿಮ ಸಾಹಸ ತೋರಿದರು. ಎನ್.ಸಿ.ಸಿ.ಯ ಪ್ರಥಮ ನಿರ್ದೇಶಕರಾಗಿ ಯುವಜನರನ್ನು ದೇಶ ರಕ್ಷಣೆಗೆ ಸಿದ್ಧಗೊಳಿಸಿದರು. 15 ಜನವರಿ 1973ರಂದು ಭೂಸೇನೆಯ ಒಂಬತ್ತನೆಯ ಮಹಾದಂಡನಾಯಕರಾದರು. ಪದ್ಮಭೂಷಣ ಮತ್ತು ಪರಮ ವಿಶಿಷ್ಟ ಸೇವಾಪದಕ ಪಡೆದರು. ನಿವೃತ್ತಿಯ ನಂತರ ಡೆನ್ಮಾರ್ಕಿನ ರಾಯಭಾರಿಯಾಗಿ ಸೇವೆ ಸಲ್ಲಿಸಿದರು. 24 ಅಕ್ಟೋಬರ್ 1989ರಂದು ನಿಧನರಾದರು.`),
L(`ಬೇವೂರರ ಕರ್ತವ್ಯನಿಷ್ಠೆ ಮತ್ತು ಸಜ್ಜನಿಕೆಯನ್ನು ವಿವರಿಸಿ.`,`ಬೇವೂರರು ತಮ್ಮ ಕರ್ತವ್ಯವನ್ನು ದಕ್ಷತೆಯಿಂದ ನಿರ್ವಹಿಸಿದರು. 'ಮಾತಿಗಿಂತ ಕೃತಿ ಲೇಸು' ಎಂಬುದು ಅವರ ತತ್ವ. ಉನ್ನತ ಹುದ್ದೆಯಲ್ಲಿದ್ದರೂ ತಮ್ಮ ಊರಿನಲ್ಲಿ ರಕ್ಷಣೆ–ಮೆರವಣಿಗೆಯನ್ನು ನಿರಾಕರಿಸಿ ರೈತನ ಗಾಡಿಯಲ್ಲಿ ಜನರೊಂದಿಗೆ ಬೆರೆತರು. ಇದು ಅವರ ಸರಳತೆ, ವಿನಯ ಹಾಗೂ ಜನರ ಬಗೆಗಿನ ಪ್ರೀತಿಯನ್ನು ತೋರಿಸುತ್ತದೆ. ಅವರ ಆಡಳಿತ ವೈಖರಿಯನ್ನು ಗುರುತಿಸಿ ನಿವೃತ್ತಿಯ ನಂತರವೂ ಸರ್ಕಾರ ರಾಯಭಾರಿಯಾಗಿ ನೇಮಿಸಿತು.`)
]});

LS5.push({n:4,t:`ಸಂಗೊಳ್ಳಿ ರಾಯಣ್ಣ`,au:`ಎಚ್.ಎಸ್. ಸತ್ಯನಾರಾಯಣ`,pg:22,
words:`ಅಪ್ರತಿಮ – ಹೋಲಿಕೆಯಿಲ್ಲದ, ಸಾಟಿಯಿಲ್ಲದ; ಅಹೋರಾತ್ರಿ – ರಾತ್ರಿಪೂರ್ತಿ, ಇಡೀರಾತ್ರಿ; ಅಚಲವಾದ – ಸ್ಥಿರವಾದ, ಬದಲಾಗದ; ಆದ್ಯ – ಮೊದಲ ಕರ್ತವ್ಯ; ಸ್ಮೃತಿಪಟಲ – ನೆನಪಿನ ಸಂಗ್ರಹ; ಕಲಿ – ವೀರ; ಮುಂಚೂಣಿ – ಮೊದಲನೆಯ ಸಾಲಿನ; ಕ್ರೋಧ – ಕೋಪ, ಸಿಟ್ಟು; ಎರಗು – ಮೇಲೆ ಬೀಳು; ಕಕ್ಕಾಬಿಕ್ಕಿ – ದಿಕ್ಕುತೋಚದಾಗು; ಸಹಚರರು – ಜೊತೆಗಾರರು; ಖಜಾನೆ – ಹಣಸಂಗ್ರಹಿಸುವ ಪೆಟ್ಟಿಗೆ, ತಿಜೋರಿ; ಸಿಂಹಸ್ವಪ್ನ – ಕನಸಿನಲ್ಲೂ ಹೆದರಿಸುವವನು; ಚಳ್ಳೇಹಣ್ಣು ತಿನ್ನಿಸು – ಮೋಸಗೊಳಿಸು; ನುಣುಚಿಕೋ – ತಪ್ಪಿಸಿಕೋ; ನಿಪುಣ – ನುರಿತ, ಪ್ರವೀಣನಾದ; ವಧಾಸ್ಥಾನ – ಕೊಲ್ಲುವ ಸ್ಥಳ; ರಕ್ತಗತ – ಹುಟ್ಟಿನೊಡನೆ ಸ್ವಭಾವಕ್ಕೆ ಅಂಟಿಕೊಂಡ`,
notes:`ಪಾಠದ ಆಶಯ: ನಾಡಿನ ರಕ್ಷಣೆಯ ಸಂದರ್ಭ ಎದುರಾದಾಗ ಸಾಮಾನ್ಯರು ಯಾವ ಜವಾಬ್ದಾರಿಯನ್ನು ಹೊರಬೇಕೆಂಬುದಕ್ಕೆ ಸಂಗೊಳ್ಳಿ ರಾಯಣ್ಣನ ಕಥೆ ಪ್ರೇರಣೆ. ಕೃತಿಕಾರರ ಪರಿಚಯ: ಡಾ. ಎಚ್.ಎಸ್. ಸತ್ಯನಾರಾಯಣ ಅವರು ಚಿಕ್ಕಮಗಳೂರಿನಲ್ಲಿ ಜನಿಸಿದರು (ತಾಯಿ–ತಂದೆ: ಶ್ರೀಮತಿ ಇಂದಿರಮ್ಮ – ಶ್ರೀ ಎಚ್.ಕೆ. ಶ್ರೀನಿವಾಸ). ಬಿ.ಎ. ಪದವಿಯನ್ನು ತೀನಂಶ್ರೀ ಸ್ಮಾರಕ ಚಿನ್ನದ ಪದಕದೊಂದಿಗೆ ಪಡೆದರು; 'ಪೂರ್ಣಚಂದ್ರ ತೇಜಸ್ವಿಯವರ ಕಥನ ಸಾಹಿತ್ಯದ ಸಾಂಸ್ಕೃತಿಕ ನೆಲೆಗಳು' ಮಹಾಪ್ರಬಂಧಕ್ಕೆ ಡಾಕ್ಟರೇಟ್ ಪಡೆದರು. ಕೃತಿಗಳು: ಅಪೂರ್ವ ಒಡನಾಟ, ಕುವೆಂಪು: ಅಲಕ್ಷಿತರೆದೆಯ ದೀಪ, ಕಣ್ಣೋಟ, ನುಡಿಚಿತ್ರ, ಪನ್ನೇರಳೆ, ನಗೆಮೊಗದ ಅಜ್ಜ ಮಾಸ್ತಿ, ಬಿದಿರ ತಡಿಕೆ, ಗಿರೀಶ್ ಕಾರ್ನಾಡ್ ಬದುಕು–ಬರಹ. ಉದಯೋನ್ಮುಖ ವರ್ಧಮಾನ ಪ್ರಶಸ್ತಿ, ಹಿರೇಮಲ್ಲೂರು ಈಶ್ವರನ್ ರಾಜ್ಯ ಪ್ರಶಸ್ತಿ ಮುಂತಾದ ಗೌರವಗಳಿಗೆ ಪಾತ್ರರು; ಕರ್ನಾಟಕ ಸರ್ಕಾರವು 2017ರ ಸಾಲಿನ ಅತ್ಯುತ್ತಮ ಉಪನ್ಯಾಸಕ ರಾಜ್ಯ ಪ್ರಶಸ್ತಿ ನೀಡಿದೆ (ವರ್ಷವನ್ನು ಪಠ್ಯಪುಸ್ತಕದೊಂದಿಗೆ ಪರಿಶೀಲಿಸಿ). ಕೌಶಲ: ಬರೆಯುವುದು.`,
ab:[
[`ಅ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ`,[
[`ಸಂಗೊಳ್ಳಿ ರಾಯಣ್ಣ ಯಾವಾಗ, ಎಲ್ಲಿ ಜನಿಸಿದನು?`,`ರಾಯಣ್ಣ 15 ಆಗಸ್ಟ್ 1798ರಂದು ಬೆಳಗಾವಿ ಜಿಲ್ಲೆಯ ಸಂಪಗಾವಿ ತಾಲ್ಲೂಕಿನ ಸಂಗೊಳ್ಳಿಯಲ್ಲಿ ಜನಿಸಿದನು.`],
[`ಸಂಗೊಳ್ಳಿ ರಾಯಣ್ಣನ ತಂದೆ–ತಾಯಿಗಳು ಯಾರು?`,`ತಂದೆ ಭರಮಪ್ಪ, ತಾಯಿ ಶ್ರೀಮತಿ ಕೆಂಚವ್ವ.`],
[`ಸಂಗೊಳ್ಳಿ ರಾಯಣ್ಣನು ಯಾವ ಸಂಸ್ಥಾನದ ಬಿಡುಗಡೆಗಾಗಿ ಹೋರಾಡಿದನು?`,`ಕಿತ್ತೂರು ಸಂಸ್ಥಾನದ ಬಿಡುಗಡೆಗಾಗಿ ಹೋರಾಡಿದನು.`],
[`ಕಿತ್ತೂರಿನ ರಾಣಿ ಚೆನ್ನಮ್ಮನ ದತ್ತು ಪುತ್ರನ ಹೆಸರೇನು?`,`ಶಿವಲಿಂಗಪ್ಪ.`],
[`ಸಂಗೊಳ್ಳಿ ರಾಯಣ್ಣನನ್ನು ಯಾವಾಗ ಗಲ್ಲಿಗೇರಿಸಲಾಯಿತು?`,`26 ಜನವರಿ 1831ರಂದು ಗಲ್ಲಿಗೇರಿಸಲಾಯಿತು.`]]],
[`ಆ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಎರಡು–ಮೂರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರಿಸಿ`,[
[`ಯಾವುದು ಆದ್ಯ ಕರ್ತವ್ಯವೆಂಬುದನ್ನು ಸಂಗೊಳ್ಳಿ ರಾಯಣ್ಣ ತೋರಿಸಿಕೊಟ್ಟಿದ್ದಾನೆ?`,`ನಾಡ ಉಳಿವಿಗಾಗಿ ಹೋರಾಡುವುದು ಕೇವಲ ರಾಜರ ಕೆಲಸವಲ್ಲ, ಅದು ಸಾಮಾನ್ಯ ಜನತೆಯ ಆದ್ಯ ಕರ್ತವ್ಯವೂ ಹೌದು ಎಂಬುದನ್ನು ರಾಯಣ್ಣ ತೋರಿಸಿಕೊಟ್ಟಿದ್ದಾನೆ.`],
[`'ಸಾವಿರ ಒಂಟೆ ಸರದಾರ' ಎಂಬ ಬಿರುದು ಯಾರಿಗಿತ್ತು? ಏಕೆ?`,`ರಾಯಣ್ಣನ ತಾತ ರಾಗಪ್ಪನಿಗೆ ಈ ಬಿರುದು ಇತ್ತು. 'ಚಿಣಗಿ ಕೋವಾಡ' ಯುದ್ಧದಲ್ಲಿ ತೋರಿದ ಅಪ್ರತಿಮ ಶೌರ್ಯಕ್ಕಾಗಿ ಕಿತ್ತೂರು ದೊರೆ ವೀರಪ್ಪ ದೇಸಾಯಿ ಅವರು ಈ ಬಿರುದು ನೀಡಿದ್ದರು.`],
[`ಗೆರಿಲ್ಲಾ ಯುದ್ಧ ಎಂದರೇನು?`,`ಕಾಡಿನ ಮರಗಳ ಮೇಲೋ ಬಂಡೆಗಳ ಕೆಳಗೋ ಸಹಚರರೊಂದಿಗೆ ಅಡಗಿ ಕುಳಿತಿದ್ದು, ಅನಿರೀಕ್ಷಿತವಾಗಿ ಶತ್ರುಗಳ ಮೇಲೆ ಎರಗಿ ಅವರನ್ನು ಕಕ್ಕಾಬಿಕ್ಕಿಯಾಗಿಸಿ ಮಣಿಸುವುದೇ ಗೆರಿಲ್ಲಾ ಯುದ್ಧತಂತ್ರ.`],
[`ಸಂಗೊಳ್ಳಿ ರಾಯಣ್ಣನ ಅತ್ಯಂತ ದೊಡ್ಡ ಸಾಹಸ ಯಾವುದು?`,`ರಾಣಿ ಚೆನ್ನಮ್ಮನ ದತ್ತುಪುತ್ರನಾದ ಶಿವಲಿಂಗಪ್ಪನನ್ನು ಕಿತ್ತೂರಿನ ಸಿಂಹಾಸನದಲ್ಲಿ ಕುಳ್ಳಿರಿಸಿದ್ದು ಅವನ ಅತ್ಯಂತ ದೊಡ್ಡ ಮತ್ತು ಮುಖ್ಯ ಸಾಹಸ.`],
[`ಬ್ರಿಟಿಷ್ ಆಡಳಿತದ ವಿರುದ್ಧ ತನ್ನ ಪ್ರತಿಭಟನೆಯನ್ನು ರಾಯಣ್ಣ ದಾಖಲಿಸಿದ್ದು ಹೇಗೆ?`,`ಖಾನಾಪುರದಲ್ಲಿ ನೆಲೆಸಿದ್ದ ಮೇಜರ್ ಪಿಕ್ಕರಿಂಗ್‌ನ ಸೈನ್ಯದ ಮೇಲೆ ದಾಳಿ ನಡೆಸಿ, ಅಲ್ಲಿನ ಸರ್ಕಾರಿ ಕಚೇರಿಯನ್ನು ಸುಟ್ಟುಹಾಕುವ ಮೂಲಕ ಪ್ರತಿಭಟನೆ ದಾಖಲಿಸಿದನು.`],
[`ನ್ಯಾಯಾಲಯದಲ್ಲಿ ರಾಯಣ್ಣ ತನ್ನ ಕಾರ್ಯಗಳ ಬಗ್ಗೆ ಯಾವ ಸಮರ್ಥನೆ ನೀಡಿದನು?`,`ತಾನು ನಾಡಿನ ಹಿತಕ್ಕಾಗಿ ಈ ಎಲ್ಲಾ ಕಾರ್ಯಗಳನ್ನು ಮಾಡಬೇಕಾಯಿತೆಂದು ಒಪ್ಪಿಕೊಂಡನು.`]]],
[`ಇ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಐದು–ಆರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರಿಸಿ`,[
[`ಸಂಗೊಳ್ಳಿ ರಾಯಣ್ಣನ ನೆನಪು ನಾಡಿನ ಜನರಲ್ಲಿ ಉಳಿದಿರಲು ಕಾರಣಗಳನ್ನು ವಿವರಿಸಿ.`,`ರಾಯಣ್ಣನ ಧೀರ ಕ್ರಮಗಳು, ಶೌರ್ಯ ಸಾಧನೆಗಳು, ಚತುರ ಚಲನವಲನಗಳು, ವ್ಯೂಹಗಳು ಇವುಗಳಿಗಿಂತಲೂ ಮಿಗಿಲಾಗಿ ಕಿತ್ತೂರಿನ ಸ್ವಾತಂತ್ರ್ಯ ಸಾಧನೆಯ ಘನೋದ್ಧಾರಕ್ಕಾಗಿ ಎಡೆಬಿಡದೆ ನಡೆಸಿದ ಪ್ರಯತ್ನಗಳು ಇಂದಿಗೂ ನಾಡಿನ ಜನರ ಕಣ್ಣಲ್ಲಿ ನೀರೂರಿಸಿ ದೇಶಪ್ರೇಮವನ್ನು ಉಕ್ಕಿಸುತ್ತವೆ. ಅವನ ಸಮಾಧಿ ಭಕ್ತಿಗೌರವಗಳುಳ್ಳ ಜನರ ಪಾಲಿಗೆ ವೀರಗುಡಿಯಾಗಿದೆ. ಅವನ ನೆನಪು ಹಾಡುಗಳಲ್ಲಿ, ಲಾವಣಿಗಳಲ್ಲಿ ಹಸಿರಾಗಿ ಉಳಿದಿದೆ. ಅವನ ಜನ್ಮದಿನ (ಆಗಸ್ಟ್ 15 ಸ್ವಾತಂತ್ರ್ಯೋತ್ಸವ) ಮತ್ತು ಮರಣದಿನ (ಜನವರಿ 26 ಗಣರಾಜ್ಯೋತ್ಸವ) ಎರಡೂ ನಮ್ಮ ರಾಷ್ಟ್ರೀಯ ಹಬ್ಬಗಳಾಗಿರುವುದೂ ರಾಯಣ್ಣನ ನೆನಪನ್ನು ದೇಶಭಕ್ತಿಯೊಂದಿಗೆ ಸ್ಮರಣೀಯವಾಗಿಸಿದೆ.`],
[`ಸಂಗೊಳ್ಳಿ ರಾಯಣ್ಣನ ಯುದ್ಧತಂತ್ರಗಳನ್ನು ನಿಮ್ಮ ಮಾತುಗಳಲ್ಲಿ ವಿವರಿಸಿ.`,`ರಾಯಣ್ಣನಿಗೆ ಸೈನ್ಯದ ಬಲವಿರಲಿಲ್ಲ; ಮನೋಬಲವನ್ನೇ ನಂಬಿ ಶೂರ ಸಾಹಸಿಗಳ ಗುಂಪು ಕಟ್ಟಿದನು. ಗೆರಿಲ್ಲಾ ಯುದ್ಧತಂತ್ರ ಬಳಸಿ ಕಾಡಿನ ಮರಗಳ ಮೇಲೆ, ಬಂಡೆಗಳ ಕೆಳಗೆ ಅಡಗಿ ಶತ್ರುಗಳ ಮೇಲೆ ಅನಿರೀಕ್ಷಿತವಾಗಿ ಎರಗುತ್ತಿದ್ದನು. ಖಾನಾಪುರ, ಸಂಪಗಾವಿಗಳ ಮೇಲೆ ದಾಳಿ ಮಾಡಿ ಖಜಾನೆ ಸೂರೆಮಾಡಿ ಧನಸಂಗ್ರಹ ಮಾಡಿದನು. ಹಗಲು ಕಾಡಿನಲ್ಲಿ ಕಳೆದು ರಾತ್ರಿ ವೇಳೆ ಬ್ರಿಟಿಷರ ಮೇಲೆ ಎರಗುತ್ತಿದ್ದನು. ಸರ್ಕಾರಿ ಅಧಿಕಾರಿಗಳು ಹಿಡಿಯಲು ಯತ್ನಿಸಿದರೂ ಅವರಿಗೆ ಚಳ್ಳೇಹಣ್ಣು ತಿನ್ನಿಸಿ ನುಣುಚಿಕೊಳ್ಳುತ್ತಿದ್ದನು. ಪ್ರಜೆಗಳೆಲ್ಲ ಅವನ ಬೆಂಗಾವಲಿಗರಾಗಿದ್ದರು.`]]],
[`ಈ. ಕೊಟ್ಟಿರುವ ವಾಕ್ಯಗಳನ್ನು ಸಂದರ್ಭಸಹಿತ ವಿವರಿಸಿ`,[
[`ನಾಡ ಉಳಿವಿಗಾಗಿ ಹೋರಾಡುವುದು ಕೇವಲ ರಾಜರ ಕೆಲಸವಲ್ಲ.`,`ಸಂಗೊಳ್ಳಿ ರಾಯಣ್ಣನ ಬಗ್ಗೆ ಹೇಳುವಾಗ ಈ ಮಾತು ಬಂದಿದೆ. ನಾಡನ್ನು ಉಳಿಸಲು ಹೋರಾಡುವುದು ರಾಜ–ಮಹಾರಾಜರ ಕೆಲಸ ಮಾತ್ರವಲ್ಲ; ಸಾಮಾನ್ಯ ಜನರೂ ಅದನ್ನು ತಮ್ಮ ಮೊದಲ ಕರ್ತವ್ಯವೆಂದು ತಿಳಿಯಬೇಕು ಎಂಬ ಅರ್ಥ.`],
[`ಆಗಸ್ಟ್ ಹದಿನೈದು ನಮ್ಮ ದೇಶಕ್ಕೆ ಸ್ವಾತಂತ್ರ್ಯ ಬಂದ ಹಬ್ಬದ ದಿನ.`,`ರಾಯಣ್ಣ ಜನಿಸಿದ ದಿನ ಆಗಸ್ಟ್ 15 ಎಂದು ತಿಳಿಸುವಾಗ ಈ ಮಾತು ಬಂದಿದೆ. ಅದೇ ದಿನ ನಮ್ಮ ದೇಶಕ್ಕೆ ಸ್ವಾತಂತ್ರ್ಯ ಬಂದದ್ದರಿಂದ ಅದು ಹಬ್ಬದ ದಿನವೂ ರಾಯಣ್ಣನ ಜನ್ಮದಿನವೂ ಆಗಿದೆ.`],
[`ಈತನು ಗೆರಿಲ್ಲಾ ಯುದ್ಧ ತಂತ್ರದಲ್ಲಿ ಪಳಗಿದ್ದವನು.`,`ರಾಯಣ್ಣನ ಯುದ್ಧತಂತ್ರವನ್ನು ವಿವರಿಸುವಾಗ ಈ ಮಾತು ಬಂದಿದೆ. ಅವನು ಅಡಗಿಕೊಂಡು ಅನಿರೀಕ್ಷಿತವಾಗಿ ಶತ್ರುಗಳ ಮೇಲೆ ಎರಗಿ ಮಣಿಸುವ ಗೆರಿಲ್ಲಾ ತಂತ್ರದಲ್ಲಿ ನುರಿತವನಾಗಿದ್ದನು.`],
[`ಎಲ್ಲರಲ್ಲೂ ದೇಶಪ್ರೇಮವನ್ನು ಉಕ್ಕಿಸುತ್ತಲೇ ಇವೆ.`,`ರಾಯಣ್ಣನ ಕಥೆ ಮತ್ತು ಪ್ರಯತ್ನಗಳು ಇಂದಿಗೂ ಜನರ ಕಣ್ಣಲ್ಲಿ ನೀರೂರಿಸಿ ಎಲ್ಲರಲ್ಲೂ ದೇಶಪ್ರೇಮವನ್ನು ಜಾಗೃತಗೊಳಿಸುತ್ತಿವೆ ಎಂಬ ಅರ್ಥ.`]]],
[`ವ್ಯಾಕರಣ ಮಾಹಿತಿ ಮತ್ತು ಭಾಷಾಭ್ಯಾಸ – ಸಮಾನಾರ್ಥಕ, ವಿರುದ್ಧಾರ್ಥಕ, ನಾನಾರ್ಥಕ ಪದಗಳು`,[
[`ವಿರುದ್ಧಾರ್ಥಕ ಪದಗಳನ್ನು ಬರೆಯಿರಿ: ಸಮಾನತೆ, ವಿರುದ್ಧ, ಅಚಲ, ರಕ್ಷಕ.`,`ಸಮಾನತೆ × ಅಸಮಾನತೆ; ವಿರುದ್ಧ × ಪರ (ಅನುಕೂಲ); ಅಚಲ × ಚಲ (ಚಂಚಲ); ರಕ್ಷಕ × ಭಕ್ಷಕ`],
[`ಸಮಾನಾರ್ಥಕ ಪದಗಳನ್ನು ಬರೆಯಿರಿ: ಸ್ಮರಣೆ, ಸ್ಫೂರ್ತಿ, ಕ್ರೋಧ, ಯುದ್ಧ.`,`ಸ್ಮರಣೆ – ನೆನಪು; ಸ್ಫೂರ್ತಿ – ಪ್ರೇರಣೆ; ಕ್ರೋಧ – ಕೋಪ, ಸಿಟ್ಟು; ಯುದ್ಧ – ಕದನ, ಸಮರ`],
[`ನಾನಾರ್ಥಕ ಪದಗಳನ್ನು ಬರೆಯಿರಿ: ಕಲಿ, ಕರಿ, ಕಾಡು, ಮುನಿ.`,`ಕಲಿ = ವೀರ / ಕಲಿಯು; ಕರಿ = ಆನೆ / ಕಪ್ಪು; ಕಾಡು = ಅರಣ್ಯ / ಪೀಡಿಸು; ಮುನಿ = ಋಷಿ / ಕೋಪಗೊಳ್ಳು (ಮಾದರಿ ಉತ್ತರ)`],
[`ಸ್ವಂತ ವಾಕ್ಯಗಳಲ್ಲಿ ಬಳಸಿ ಬರೆಯಿರಿ: ಕಕ್ಕಾಬಿಕ್ಕಿ, ಸಿಂಹಸ್ವಪ್ನ, ಚಳ್ಳೇಹಣ್ಣು, ಬೆಚ್ಚಿಬೀಳಿಸು.`,`ಮಾದರಿ ವಾಕ್ಯಗಳು: ಅನಿರೀಕ್ಷಿತ ದಾಳಿಗೆ ಶತ್ರುಗಳು ಕಕ್ಕಾಬಿಕ್ಕಿಯಾದರು. ರಾಯಣ್ಣ ಬ್ರಿಟಿಷರಿಗೆ ಸಿಂಹಸ್ವಪ್ನವಾಗಿದ್ದನು. ಅವನು ಅಧಿಕಾರಿಗಳಿಗೆ ಚಳ್ಳೇಹಣ್ಣು ತಿನ್ನಿಸಿ ತಪ್ಪಿಸಿಕೊಂಡನು. ಅವನ ದಾಳಿ ಬ್ರಿಟಿಷರನ್ನು ಬೆಚ್ಚಿಬೀಳಿಸಿತು.`]]],
[`ಆ. ಯೋಜನೆ / ಇ. ಓದಿಗೆ ಮನ್ನಣೆ (ಚಟುವಟಿಕೆ ಆಧಾರಿತ – ಮಾರ್ಗದರ್ಶನ)`,[
[`ಸಂಗೊಳ್ಳಿ ರಾಯಣ್ಣನ ಜೀವನ ವಿವರಗಳನ್ನು ಕುರಿತು ಒಂದು ಪುಟ್ಟ ಪ್ರಬಂಧ ರಚಿಸಿ. ಕಿತ್ತೂರಿಗೆ ಭೇಟಿ ನೀಡಿ, ಅಲ್ಲಿನ ಐತಿಹಾಸಿಕ ಸ್ಮಾರಕಗಳನ್ನು ಸಂದರ್ಶಿಸಿ.`,`ಮಾರ್ಗದರ್ಶನ: ಜನನ (15-08-1798, ಸಂಗೊಳ್ಳಿ) → ಕಿತ್ತೂರಿನ ಸ್ವಾತಂತ್ರ್ಯಕ್ಕಾಗಿ ಹೋರಾಟ → ಶಿವಲಿಂಗಪ್ಪನನ್ನು ಸಿಂಹಾಸನದಲ್ಲಿ ಕೂರಿಸಿದ್ದು → ಗೆರಿಲ್ಲಾ ಯುದ್ಧ → ಸೆರೆ → ನಂದಗಡದಲ್ಲಿ ಗಲ್ಲು (26-01-1831) → ಸಮಾಧಿ ಮತ್ತು ವೀರಗುಡಿ.`],
[`ಸಂಗೊಳ್ಳಿ ರಾಯಣ್ಣನು ಕಿತ್ತೂರಿಗಾಗಿ ಹೋರಾಡಿದ ಕಥೆಯನ್ನು ಇತಿಹಾಸ ಪುಸ್ತಕಗಳಿಂದ ಸಂಗ್ರಹಿಸಿ, ಓದಿ. ಮೈಸೂರು ವಿಶ್ವವಿದ್ಯಾಲಯದ ವಿಷಯ ವಿಶ್ವಕೋಶದಲ್ಲಿ ರಾಯಣ್ಣನ ಬಗೆಗಿರುವ ಮಾಹಿತಿಯನ್ನು ಗಮನಿಸಿ.`,`ಚಟುವಟಿಕೆ: ಶಾಲಾ ಗ್ರಂಥಾಲಯದಲ್ಲಿ ಇತಿಹಾಸ ಪುಸ್ತಕ/ವಿಶ್ವಕೋಶ ನೋಡಿ ಮಾಹಿತಿ ಬರೆದುಕೊಳ್ಳಲು ಮಕ್ಕಳಿಗೆ ತಿಳಿಸಿ.`]]]
],
qb:[
M(`ಸಂಗೊಳ್ಳಿ ರಾಯಣ್ಣ ಜನಿಸಿದ ದಿನ:`,[`15 ಆಗಸ್ಟ್ 1798`,`26 ಜನವರಿ 1831`,`2 ಅಕ್ಟೋಬರ್ 1869`,`14 ನವೆಂಬರ್ 1889`],0),
M(`ರಾಯಣ್ಣನ ತಂದೆಯ ಹೆಸರು:`,[`ರಾಗಪ್ಪ`,`ಭರಮಪ್ಪ`,`ವೀರಪ್ಪ`,`ಬಾಳಪ್ಪ`],1),
M(`'ಸಾವಿರ ಒಂಟೆ ಸರದಾರ' ಬಿರುದು ಪಡೆದವರು:`,[`ರಾಯಣ್ಣನ ತಾತ ರಾಗಪ್ಪ`,`ರಾಯಣ್ಣನ ತಂದೆ`,`ಶಿವಲಿಂಗಪ್ಪ`,`ಬಾಳಪ್ಪ`],0),
M(`ರಾಯಣ್ಣನನ್ನು ಗಲ್ಲಿಗೇರಿಸಿದ ಸ್ಥಳ:`,[`ನಂದಗಡ`,`ಧಾರವಾಡ`,`ಖಾನಾಪುರ`,`ಸಂಪಗಾವಿ`],0),
M(`ರಾಯಣ್ಣ ಬಳಸಿದ ಯುದ್ಧತಂತ್ರ:`,[`ಗೆರಿಲ್ಲಾ ಯುದ್ಧ`,`ಕೂಟಯುದ್ಧ ಮಾತ್ರ`,`ವಾಯುದಾಳಿ`,`ನೌಕಾಯುದ್ಧ`],0),
M(`'ಅಪ್ರತಿಮ' ಪದದ ಅರ್ಥ:`,[`ಸಾಟಿಯಿಲ್ಲದ`,`ಸಣ್ಣ`,`ಕೆಟ್ಟ`,`ಹೊಸ`],0),
O(`ರಾಯಣ್ಣನ ಊರು ಯಾವುದು?`,`ಸಂಗೊಳ್ಳಿ (ಬೆಳಗಾವಿ ಜಿಲ್ಲೆಯ ಸಂಪಗಾವಿ ತಾಲ್ಲೂಕು).`),
O(`ರಾಯಣ್ಣನ ತಾಯಿಯ ಹೆಸರೇನು?`,`ಕೆಂಚವ್ವ.`),

O(`ರಾಯಣ್ಣ ದಾಳಿ ಮಾಡಿದ ಬ್ರಿಟಿಷ್ ಸೈನ್ಯಾಧಿಕಾರಿ ಯಾರು?`,`ಮೇಜರ್ ಪಿಕ್ಕರಿಂಗ್.`,'m'),
O(`ರಾಯಣ್ಣನ ಸಮಾಧಿಯ ಬಳಿ ಬೆಳೆದಿರುವ ಮರ ಯಾವುದು?`,`ಆಲದ ಮರ.`,'m'),
G(`'ಕಲಿ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ವೀರ`,'e'),
G(`'ಕ್ರೋಧ' ಪದದ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಕೋಪ, ಸಿಟ್ಟು`,'e'),
G(`'ಯುದ್ಧ' ಪದದ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಕದನ, ಸಮರ`),
G(`'ಅಚಲ' ಪದದ ವಿರುದ್ಧಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಚಲ (ಚಂಚಲ)`),
G(`'ಸಮಾನತೆ' ಪದದ ವಿರುದ್ಧಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಅಸಮಾನತೆ`),
G(`'ಕರಿ' ಪದದ ಎರಡು ಅರ್ಥಗಳನ್ನು ಬರೆಯಿರಿ.`,`ಆನೆ, ಕಪ್ಪು`),
S(`'ಸಾವಿರ ಒಂಟೆ ಸರದಾರ' ಬಿರುದಿನ ಹಿನ್ನೆಲೆ ತಿಳಿಸಿ.`,`'ಚಿಣಗಿ ಕೋವಾಡ' ಯುದ್ಧದಲ್ಲಿ ತೋರಿದ ಅಪ್ರತಿಮ ಶೌರ್ಯಕ್ಕಾಗಿ ಕಿತ್ತೂರು ದೊರೆ ವೀರಪ್ಪ ದೇಸಾಯಿ ರಾಯಣ್ಣನ ತಾತ ರಾಗಪ್ಪನಿಗೆ ಈ ಬಿರುದು ನೀಡಿದ್ದರು.`),
S(`ಗೆರಿಲ್ಲಾ ಯುದ್ಧ ಎಂದರೇನು?`,`ಅಡಗಿ ಕುಳಿತು ಅನಿರೀಕ್ಷಿತವಾಗಿ ಶತ್ರುಗಳ ಮೇಲೆ ಎರಗಿ ಅವರನ್ನು ಕಕ್ಕಾಬಿಕ್ಕಿಯಾಗಿಸಿ ಮಣಿಸುವ ಯುದ್ಧ ತಂತ್ರವೇ ಗೆರಿಲ್ಲಾ ಯುದ್ಧ.`),
S(`ರಾಯಣ್ಣ ಕಿತ್ತೂರಿನ ಸ್ವಾತಂತ್ರ್ಯಕ್ಕಾಗಿ ಹೋರಾಡಲು ಕಾರಣಗಳೇನು?`,`ಬ್ರಿಟಿಷರು ರಾಯಣ್ಣನ ಮನೆತನದ ಭೂಮಿಯನ್ನು ವಶಪಡಿಸಿಕೊಂಡರು; ಕಿತ್ತೂರಿನ ಸ್ವಾತಂತ್ರ್ಯವನ್ನು ಪುನಃ ಸ್ಥಾಪಿಸಬೇಕೆಂಬ ಉದಾತ್ತ ಧ್ಯೇಯ ಮತ್ತು ಅಚಲ ದೇಶಭಕ್ತಿ ಅವನಲ್ಲಿತ್ತು.`),
L(`ಸಂಗೊಳ್ಳಿ ರಾಯಣ್ಣನ ಸಾಹಸಗಳನ್ನು ಕುರಿತು ಬರೆಯಿರಿ.`,`ರಾಯಣ್ಣ ಕಿತ್ತೂರು ಸಂಸ್ಥಾನದ ಸಾಮಾನ್ಯ ಪ್ರಜೆಯಾದರೂ ಬ್ರಿಟಿಷರ ವಿರುದ್ಧ ಅಹೋರಾತ್ರಿ ಹೋರಾಡಿದನು. ಶಿವಲಿಂಗಪ್ಪನನ್ನು ಕಿತ್ತೂರಿನ ಸಿಂಹಾಸನದಲ್ಲಿ ಕುಳ್ಳಿರಿಸಿದ್ದು ಅವನ ಅತಿ ದೊಡ್ಡ ಸಾಹಸ. ಖಾನಾಪುರದಲ್ಲಿ ಮೇಜರ್ ಪಿಕ್ಕರಿಂಗ್‌ನ ಸೈನ್ಯದ ಮೇಲೆ ದಾಳಿ ಮಾಡಿ ಸರ್ಕಾರಿ ಕಚೇರಿಯನ್ನು ಸುಟ್ಟನು. ಸಂಪಗಾವಿಯ ಖಜಾನೆಯನ್ನು ಸೂರೆಮಾಡಿ ಹಣ ಸಂಗ್ರಹಿಸಿದನು. ಗೆರಿಲ್ಲಾ ಯುದ್ಧತಂತ್ರದಿಂದ ಬ್ರಿಟಿಷರಿಗೆ ಸಿಂಹಸ್ವಪ್ನನಾದನು.`),
L(`ರಾಯಣ್ಣನ ಬಂಧನ ಮತ್ತು ಮರಣದಂಡನೆಯ ಸಂದರ್ಭವನ್ನು ವಿವರಿಸಿ.`,`ನಾಲ್ಕು ತಿಂಗಳು ಸತತವಾಗಿ ಪ್ರತಿರೋಧ ತೋರಿದ ರಾಯಣ್ಣನನ್ನು ಯುದ್ಧದಲ್ಲಿ ಸೆರೆಹಿಡಿಯುವುದು ಅಸಾಧ್ಯವೆಂದು ತಿಳಿದ ಬ್ರಿಟಿಷ್ ಸರ್ಕಾರ ಕಪಟ ಜಾಲವೊಡ್ಡಿ, ದೇಶದ್ರೋಹಿಗಳ ಸಹಾಯದಿಂದ ಅವನನ್ನು ಸೆರೆಹಿಡಿದು ವಿಚಾರಣೆಗೊಳಪಡಿಸಿತು. ಅವನ ನಾಲ್ಕುನೂರು ಜನ ಸಹಚರರು ಶರಣಾಗತರಾದರು. ರಾಯಣ್ಣ ನಾಡ ಹಿತಕ್ಕಾಗಿ ಎಲ್ಲವನ್ನೂ ಮಾಡಿದೆನೆಂದು ಒಪ್ಪಿಕೊಂಡನು. ವಿಶೇಷ ನ್ಯಾಯಾಲಯ ಮರಣದಂಡನೆ ವಿಧಿಸಿತು. 26 ಜನವರಿ 1831ರಂದು ನಂದಗಡದಲ್ಲಿ ಗಲ್ಲಿಗೇರಿಸಿ ಅವನು ಬಯಸಿದ್ದಲ್ಲೇ ಸಮಾಧಿ ಮಾಡಲಾಯಿತು.`)
]});

LS5.push({n:5,t:`ಕರಡಿ ಕುಣಿತ (ಪದ್ಯ)`,au:`ದ. ರಾ. ಬೇಂದ್ರೆ`,pg:29,
words:`ಕುಣಿಕೋಲು – ಕುಣಿಸುವವನು ಹಿಡಿದುಕೊಳ್ಳುವ ಕೋಲು; ಕೈಕಡಗ – ಕೈಗೆ ಹಾಕಿಕೊಳ್ಳುವ ಬಳೆ; ಜಾಂಬವಂತ – ಕರಡಿ`,
notes:`ಪ್ರವೇಶ: 'ಕರಡಿ ಕುಣಿತ' ಕವನವು ಬೇಂದ್ರೆ ಅವರ ಸರಳ ಕವನಗಳಲ್ಲಿ ಒಂದು. ಇದರ ಒಡಲಿನಲ್ಲಿರುವ ಶೋಷಣೆಯ ಸಂಕೀರ್ಣತೆ ಅನುಭವವೇದ್ಯವಾಗುತ್ತದೆ. ಕೊನೆಯಲ್ಲಿ ಬೇಂದ್ರೆ ಅವರು ಮಾನವನ ಬುದ್ಧಿಯ ಕುಣಿತ ಎಲ್ಲ ಪ್ರಾಣಿಗಳ ಕುಣಿತಕ್ಕಿಂತ ಮಿಗಿಲಾದುದು ಎಂಬ ತತ್ತ್ವವನ್ನು ಸಾರುತ್ತಾರೆ. ಕೃತಿಕಾರರ ಪರಿಚಯ: ದ. ರಾ. ಬೇಂದ್ರೆ (ದತ್ತಾತ್ರೇಯ ರಾಮಚಂದ್ರ ಬೇಂದ್ರೆ) 'ಅಂಬಿಕಾತನಯದತ್ತ' ಎಂಬ ಕಾವ್ಯನಾಮದಿಂದ ಪ್ರಸಿದ್ಧರು. ಸಾ.ಶ. 1896ರಲ್ಲಿ ಧಾರವಾಡದ ಸಾಧನಕೇರಿಯಲ್ಲಿ ಜನಿಸಿದರು. ಪ್ರೌಢಶಾಲಾ ಅಧ್ಯಾಪಕರಾಗಿ, ಸೊಲ್ಲಾಪುರದ ರಾಜಾರಾಮ್ ಕಾಲೇಜಿನಲ್ಲಿ ಕನ್ನಡ ಪ್ರಾಧ್ಯಾಪಕರಾಗಿ, ಧಾರವಾಡದ ಬಾನುಲಿ ಕೇಂದ್ರದ ಸಲಹೆಗಾರರಾಗಿ ಸೇವೆ ಸಲ್ಲಿಸಿದ್ದಾರೆ. ಕನ್ನಡ ನವೋದಯ ಸಾಹಿತ್ಯದ ಪ್ರಮುಖ ಕವಿ. ಗರಿ, ನಾಕುತಂತಿ, ನಾದಲೀಲೆ, ಮೇಘದೂತ, ಗಂಗಾವತರಣ, ಸಖೀಗೀತ ಮೊದಲಾದ ಕೃತಿಗಳನ್ನು ರಚಿಸಿದ್ದಾರೆ. 'ನಾಕುತಂತಿ' ಕವನ ಸಂಕಲನಕ್ಕೆ ಭಾರತೀಯ ಜ್ಞಾನಪೀಠ ಪ್ರಶಸ್ತಿ ಲಭಿಸಿದೆ. ಪದ್ಮಶ್ರೀ ಪ್ರಶಸ್ತಿ, ಕೇಂದ್ರ ಮತ್ತು ರಾಜ್ಯ ಸಾಹಿತ್ಯ ಅಕಾಡೆಮಿ ಪ್ರಶಸ್ತಿಗೂ ಭಾಜನರಾಗಿದ್ದಾರೆ. ಕೌಶಲ: ಓದುವುದು; ಸಾಮರ್ಥ್ಯ: ಪದ್ಯವನ್ನು ಓದಿದ ಬಳಿಕ ಕೇಳಿದ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸುವುದು. (ಪದ್ಯದ ಸಾಲುಗಳನ್ನು ಪಠ್ಯಪುಸ್ತಕದಿಂದ ನೋಡಿ ಕಂಠಪಾಠ ಮಾಡಿಸಿ. ಈ ಪದ್ಯದಲ್ಲಿ 8 ಚರಣಗಳಿವೆ.)`,
ab:[
[`ಅ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ`,[
[`ಕರಡಿಯನ್ನು ಕುಣಿಸುವವನ ವೇಷಭೂಷಣ ಹೇಗಿತ್ತು?`,`ಅವನು ಕಬ್ಬಿಣದ ಕೈಕಡಗ ತೊಟ್ಟು, ಕುಣಿಕೋಲು ಹಿಡಿದು, ಕೂದಲು ಕಂಬಳಿ ಹೊದ್ದು ಬಂದಿದ್ದನು.`],
[`ಕರಡಿಯು ಕಾಡಿನಲ್ಲಿ ಏನುಂಡು ಬೆಳೆದಿದೆ?`,`ಕರಡಿಯು ಕಾಡಿನಲ್ಲಿ ಜೇನನ್ನುಂಡು ಬೆಳೆದಿದೆ.`],
[`ಕರಡಿಯು ಏನು ಮಾಡಿದರೆ ಧಣಿಯು ದಾನವನ್ನು ಕೊಡುತ್ತಾನೆ?`,`ಧಣಿಯರ ಮನೆಯ ಮುಂದೆ ನಿಂತು (ಕಾವಲು) ಕುಣಿದು ತೋರಿಸಿದರೆ ಧಣಿಯು ದಾನ ಕೊಡುತ್ತಾನೆ.`],
[`ಕರಡಿಯು ಕೈಮುಗಿದು ಏನೆಂದು ಹಾರೈಸುತ್ತದೆ?`,`'ಕುಣಿಸುವವರ ಹೊಟ್ಟೆ ತಣ್ಣಗಾಗಲಿ' ಎಂದು ಮುಗಿಲಿಗೆ ಕೈಮುಗಿದು ಹಾರೈಸುತ್ತದೆ.`],
[`ಕರಡಿಯ ಕುಣಿತಕ್ಕಿಂತ ಯಾರ ಬುದ್ಧಿಯ ಕುಣಿತ ಮಿಗಿಲಾದುದು?`,`ನರರ (ಮಾನವರ) ಬುದ್ಧಿಯ ಕುಣಿತ ಮಿಗಿಲಾದುದು.`]]],
[`ಆ. ಕೆಳಗಿನ ಪದ್ಯಭಾಗವನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ, ಕಂಠಪಾಠ ಮಾಡಿರಿ`,[
[`1. 'ಕಬ್ಬಿಣ ...' ಚರಣ (ಮೊದಲನೆಯ ಚರಣ)`,`ಚಟುವಟಿಕೆ: ಪಠ್ಯಪುಸ್ತಕದ ಮೊದಲನೆಯ ಚರಣದ ಸಾಲುಗಳನ್ನು (ಕೊನೆಯ ಪದ 'ನಿಂದಾನ!') ಪೂರ್ಣಗೊಳಿಸಿ ಕಂಠಪಾಠ ಮಾಡಿಸಿ.`],
[`2. 'ಈ ಮನಷಾ ...' ಚರಣ (ಎಂಟನೆಯ ಚರಣ)`,`ಚಟುವಟಿಕೆ: ಪಠ್ಯಪುಸ್ತಕದ ಎಂಟನೆಯ ಚರಣದ ಸಾಲುಗಳನ್ನು (ಕೊನೆಯ ಪದ 'ನುಡಿದಾನ') ಪೂರ್ಣಗೊಳಿಸಿ ಕಂಠಪಾಠ ಮಾಡಿಸಿ.`]]],
[`ವ್ಯಾಕರಣ ಮಾಹಿತಿ ಮತ್ತು ಭಾಷಾಭ್ಯಾಸ – ಪ್ರಕೃತಿಭಾವ, ವಿರುದ್ಧಾರ್ಥಕ ಪದಗಳು`,[
[`ಈ ಪದಗಳಿಗೆ ವಿರುದ್ಧಾರ್ಥಕ ಪದಗಳನ್ನು ಬಳಸಿ ಸ್ವಂತ ವಾಕ್ಯ ರಚಿಸಿರಿ (ಶುದ್ಧ, ಅನುಕೂಲ, ಆರೋಗ್ಯ, ಸಫಲ).`,`ಮಾದರಿ ಉತ್ತರ: ಶುದ್ಧ × ಅಶುದ್ಧ – ಶುದ್ಧ ನೀರನ್ನು ಕುಡಿಯಬೇಕು; ಅಶುದ್ಧ ನೀರು ಕುಡಿಯಬಾರದು. ಅನುಕೂಲ × ಪ್ರತಿಕೂಲ – ಮಳೆ ಬೆಳೆಗೆ ಅನುಕೂಲ; ಪ್ರತಿಕೂಲ ಹವಾಮಾನ ಬೆಳೆಗೆ ಹಾನಿ. ಆರೋಗ್ಯ × ಅನಾರೋಗ್ಯ – ನಿತ್ಯ ವ್ಯಾಯಾಮ ಆರೋಗ್ಯ ಕೊಡುತ್ತದೆ; ಅನಾರೋಗ್ಯದಿಂದ ಅವನು ಶಾಲೆಗೆ ಬರಲಿಲ್ಲ. ಸಫಲ × ವಿಫಲ – ಶ್ರಮಪಟ್ಟವನ ಪ್ರಯತ್ನ ಸಫಲವಾಯಿತು; ಸೋಮಾರಿಯ ಪ್ರಯತ್ನ ವಿಫಲವಾಯಿತು.`],
[`ಪ್ರಕೃತಿ ಭಾವ ಎಂದರೇನು?`,`ಕೆಲವು ಸಲ ಸ್ವರಕ್ಕೆ ಸ್ವರವು ಪರವಾದಾಗ ಯಾವುದೇ ರೀತಿಯ ಸಂಧಿ ಕಾರ್ಯ ನಡೆಯುವುದಿಲ್ಲ. ಇದನ್ನು ಪ್ರಕೃತಿಭಾವ ಎನ್ನುತ್ತೇವೆ. ಉದಾ: ಅಣ್ಣಾ + ಓಡಿ ಬಾ = ಅಣ್ಣಾ ಓಡಿ ಬಾ; ಕೃಷ್ಣ + ಎಲ್ಲಿದ್ದೀಯಾ = ಕೃಷ್ಣ ಎಲ್ಲಿದ್ದೀಯಾ?; ಆ + ಅಂಗಡಿ = ಆ ಅಂಗಡಿ; ಈ + ಮನೆ = ಈ ಮನೆ.`],
[`ಪ್ರಕೃತಿ ಭಾವಗಳನ್ನು ಹಾಗೂ ಸಂಧಿ ಪದಗಳನ್ನು ವಿಂಗಡಿಸಿ ಬರೆಯಿರಿ: ಓಹೋ, ನಿಧಿ ಸಿಕ್ಕಿತು! / ಅಣ್ಣಾ, ಅಲ್ಲಿ ನೋಡು / ಅಡಿಗಲ್ಲು / ಆ ಅರಸು / ಹಳ್ಳಿಯಲ್ಲಿ / ಈ ಮನೆ`,`ಪ್ರಕೃತಿಭಾವ: ಅಣ್ಣಾ ಅಲ್ಲಿ, ಆ ಅರಸು, ಈ ಮನೆ. ಸಂಧಿ ಪದಗಳು: ಅಡಿಗಲ್ಲು (ಅಡಿ + ಕಲ್ಲು), ಹಳ್ಳಿಯಲ್ಲಿ (ಹಳ್ಳಿ + ಅಲ್ಲಿ). 'ಓಹೋ, ನಿಧಿ ಸಿಕ್ಕಿತು!' ಉದ್ಗಾರವಾಕ್ಯ – ⚠ ಪಠ್ಯಪುಸ್ತಕದ ಉತ್ತರದೊಂದಿಗೆ ಪರಿಶೀಲಿಸಿ.`]]],
[`ಇ. ಓದಿಗೆ ಮನ್ನಣೆ / ಈ. ಶುಭನುಡಿ (ಚಟುವಟಿಕೆ ಆಧಾರಿತ – ಮಾರ್ಗದರ್ಶನ)`,[
[`ವಿವಿಧ ಪ್ರಾಣಿಗಳನ್ನು ಆಡಿಸುವವರ ಜೀವನದ ಬಗೆಗೆ ಮಾಹಿತಿ ಸಂಗ್ರಹಿಸಿ. ಪ್ರಾಣಿಗಳ ಬಗೆಗಿನ ಹಾಡುಗಳನ್ನು ಸಂಗ್ರಹಿಸಿ ಹಾಡಿರಿ.`,`ಚಟುವಟಿಕೆ: ಕರಡಿ, ಕೋತಿ, ಹಾವು, ಗೂಳಿ ಆಡಿಸುವವರ ಬಗ್ಗೆ ಮಾತುಕತೆ ನಡೆಸಿ; ಪ್ರಾಣಿಗಳ ಹಾಡುಗಳನ್ನು ಗುಂಪಿನಲ್ಲಿ ಹಾಡಿಸಿ.`],
[`ಶುಭನುಡಿ`,`ಪ್ರಾಣಿಗಳ ಸಂರಕ್ಷಣೆ ನಮ್ಮೆಲ್ಲರ ಹೊಣೆ. ಪ್ರಾಣಿಗಳನ್ನು ಹಿಂಸಿಸಬಾರದು.`]]]
],
qb:[
M(`'ಕರಡಿ ಕುಣಿತ' ಪದ್ಯದ ಕವಿ:`,[`ದ. ರಾ. ಬೇಂದ್ರೆ`,`ಕುವೆಂಪು`,`ಕಾವ್ಯಾನಂದ`,`ದಿನಕರ ದೇಸಾಯಿ`],0),
M(`ದ. ರಾ. ಬೇಂದ್ರೆ ಅವರ ಕಾವ್ಯನಾಮ:`,[`ಅಂಬಿಕಾತನಯದತ್ತ`,`ಸತ್ಯವಿಠಲ`,`ಕಾವ್ಯಾನಂದ`,`ಸರ್ವಜ್ಞ`],0),
M(`'ಜಾಂಬವಂತ' ಎಂದರೆ:`,[`ಕರಡಿ`,`ಕೋತಿ`,`ಹುಲಿ`,`ಆನೆ`],0),
M(`ಬೇಂದ್ರೆ ಅವರ 'ನಾಕುತಂತಿ' ಸಂಕಲನಕ್ಕೆ ದೊರೆತ ಪ್ರಶಸ್ತಿ:`,[`ಜ್ಞಾನಪೀಠ`,`ಪದ್ಮಭೂಷಣ`,`ಭಾರತ ರತ್ನ`,`ದಾದಾ ಸಾಹೇಬ್ ಫಾಲ್ಕೆ`],0),
M(`ಕರಡಿಯು ಕಾಡಿನಲ್ಲಿ ಉಂಡು ಬೆಳೆದದ್ದು:`,[`ಜೇನು`,`ಹಾಲು`,`ಬೆಣ್ಣೆ`,`ಮೊಸರು`],0),
M(`'ಕೈಕಡಗ' ಎಂದರೆ:`,[`ಕೈಗೆ ಹಾಕಿಕೊಳ್ಳುವ ಬಳೆ`,`ಕುಣಿಕೋಲು`,`ಕಂಬಳಿ`,`ಗೆಜ್ಜೆ`],0),
O(`ಈ ಪದ್ಯದಲ್ಲಿ ಎಷ್ಟು ಚರಣಗಳಿವೆ?`,`ಎಂಟು ಚರಣಗಳು.`),
O(`ಬೇಂದ್ರೆ ಅವರು ಜನಿಸಿದ ಊರು ಯಾವುದು?`,`ಧಾರವಾಡದ ಸಾಧನಕೇರಿ.`),
O(`ಕರಡಿಯು ಮುಗಿಲಿಗೆ ಕೈಮುಗಿದು ಏನೆಂದು ಹಾರೈಸುತ್ತದೆ?`,`'ಕುಣಿಸುವವರ ಹೊಟ್ಟೆ ತಣ್ಣಗಾಗಲಿ' ಎಂದು.`),
O(`ಬೇಂದ್ರೆ ಅವರು ಕನ್ನಡದ ಯಾವ ಕಾಲದ ಪ್ರಮುಖ ಕವಿ?`,`ನವೋದಯ ಸಾಹಿತ್ಯದ ಪ್ರಮುಖ ಕವಿ.`,'m'),
O(`ಮಾನವನ ಬುದ್ಧಿಯ ಕುಣಿತ ಯಾವುದಕ್ಕಿಂತ ಮಿಗಿಲಾದುದು?`,`ಕರಡಿಯ ಕುಣಿತಕ್ಕಿಂತ.`),
G(`'ಕುಣಿಕೋಲು' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಕುಣಿಸುವವನು ಹಿಡಿದುಕೊಳ್ಳುವ ಕೋಲು`),
G(`'ಶುದ್ಧ' ಪದದ ವಿರುದ್ಧಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಅಶುದ್ಧ`,'e'),
G(`'ಸಫಲ' ಪದದ ವಿರುದ್ಧಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ವಿಫಲ`,'e'),
G(`'ಅನುಕೂಲ' ಪದದ ವಿರುದ್ಧಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಪ್ರತಿಕೂಲ`),
G(`ಪ್ರಕೃತಿಭಾವ ಪದಕ್ಕೆ ಒಂದು ಉದಾಹರಣೆ ಕೊಡಿ.`,`ಆ + ಅಂಗಡಿ = ಆ ಅಂಗಡಿ`),
G(`'ಆರೋಗ್ಯ' ಪದದ ವಿರುದ್ಧಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಅನಾರೋಗ್ಯ`),
S(`ಕರಡಿಯನ್ನು ಕುಣಿಸುವವನ ವೇಷಭೂಷಣವನ್ನು ವಿವರಿಸಿ.`,`ಅವನು ಕಬ್ಬಿಣದ ಕೈಕಡಗ ಹಾಕಿಕೊಂಡು, ಕುಣಿಕೋಲು ಹಿಡಿದು, ಕೂದಲು ಕಂಬಳಿ ಹೊದ್ದು ಗುಣುಗುಣು ಎಂದು ಕಡಗವನ್ನು ಕುಟ್ಟುತ್ತಾ ಕರಡಿಯನ್ನು ಆಡಿಸುತ್ತಾ ನಿಂತಿದ್ದನು.`),
S(`ಪ್ರಕೃತಿ ಭಾವ ಎಂದರೇನು? ಉದಾಹರಣೆ ಕೊಡಿ.`,`ಸ್ವರಕ್ಕೆ ಸ್ವರವು ಪರವಾದಾಗ ಸಂಧಿಕಾರ್ಯ ನಡೆಯದೆ ಪದಗಳು ಹಾಗೆಯೇ ಉಳಿಯುವುದು ಪ್ರಕೃತಿಭಾವ. ಉದಾ: ಅಣ್ಣಾ + ಓಡಿ ಬಾ = ಅಣ್ಣಾ ಓಡಿ ಬಾ.`),
S(`ಕವಿ ಕಂಡಂತೆ ಕರಡಿಯ ಕುಣಿತಕ್ಕಿಂತ ಮಿಗಿಲಾದುದು ಯಾವುದು?`,`ಮಾನವನ ಬುದ್ಧಿಯ ಕುಣಿತ ಕರಡಿಯ ಕುಣಿತಕ್ಕಿಂತ ಮಿಗಿಲಾದುದು. ತನ್ನ ಲಾಭಕ್ಕಾಗಿ ಪ್ರಾಣಿಗಳನ್ನೂ ಇತರರನ್ನೂ ಕುಣಿಸುವ ಮನುಷ್ಯನ ಬುದ್ಧಿ ಇಲ್ಲಿ ಮಿಗಿಲೆಂದು ಕವಿ ಹೇಳುತ್ತಾರೆ.`),
L(`'ಕರಡಿ ಕುಣಿತ' ಪದ್ಯದ ಆಶಯವನ್ನು ನಿಮ್ಮ ಮಾತುಗಳಲ್ಲಿ ವಿವರಿಸಿ.`,`ಕಾಡಿನಲ್ಲಿ ಜೇನು ಉಂಡು ಬೆಳೆದ ಕರಡಿಯನ್ನು ಹಿಡಿದು ತಂದು ಕುಣಿಸುವವನು ಊರೂರು ಸುತ್ತಿ ಧಣಿಗಳ ಮನೆಯ ಮುಂದೆ ಕುಣಿಸಿ ದಾನ ಪಡೆಯುತ್ತಾನೆ. ಕರಡಿಗೆ ಅಪಾಯವಿಲ್ಲದಿದ್ದರೂ ಹೊಟ್ಟೆಗಿಲ್ಲದವರ ಹೊಟ್ಟೆ ತುಂಬಿಸಲು ಅದು ಕುಣಿದು ದಣಿಯುತ್ತದೆ; ಆದರೂ ಕುಣಿಸುವವರ ಹೊಟ್ಟೆ ತಣ್ಣಗಾಗಲಿ ಎಂದು ಕೈಮುಗಿದು ಹಾರೈಸುತ್ತದೆ. ಮಾನವ ತನ್ನ ಬುದ್ಧಿಯಿಂದ ಪ್ರಾಣಿಯನ್ನು ಕುಣಿಸುತ್ತಾನೆ; ಕರಡಿಯ ಕುಣಿತಕ್ಕಿಂತ ಮನುಷ್ಯನ ಬುದ್ಧಿಯ ಕುಣಿತ ಮಿಗಿಲು ಎಂಬುದು ಕವಿಯ ತತ್ತ್ವ.`),
L(`ಪ್ರಾಣಿಗಳನ್ನು ಹಿಂಸಿಸಬಾರದು ಏಕೆ? ನಿಮ್ಮ ಅಭಿಪ್ರಾಯ ಬರೆಯಿರಿ.`,`ಪ್ರಾಣಿಗಳಿಗೂ ನಮ್ಮಂತೆ ನೋವು, ಹಸಿವು, ಭಯ ಇರುತ್ತದೆ. ಅವುಗಳನ್ನು ಬಲವಂತವಾಗಿ ಕುಣಿಸುವುದು, ಬಂಧಿಸುವುದು ಅನ್ಯಾಯ. ಪ್ರಕೃತಿಯ ಸಮತೋಲನಕ್ಕೆ ಪ್ರಾಣಿಗಳು ಅಗತ್ಯ. ಅವುಗಳ ಸಂರಕ್ಷಣೆ ನಮ್ಮೆಲ್ಲರ ಹೊಣೆ ಎಂಬುದು ಈ ಪಾಠದ ಶುಭನುಡಿ.`)
]});

LS5.push({n:6,t:`ಮಗುವಿನ ಮೊರೆ (ಪದ್ಯ)`,au:`ಕಾವ್ಯಾನಂದ (ಸಿದ್ಧಯ್ಯ ಪುರಾಣಿಕ)`,pg:34,
words:`ಒರತೆ – ನೀರು ಜಿನುಗುವ ತಗ್ಗು; ತೆರ – ರೀತಿ; ನಾವೆ – ದೋಣಿ, ನೀರಿನ ಮೇಲೆ ಪ್ರಯಾಣ ಮಾಡಲು ಬಳಸುವ ಸಾಧನ; ವಿಭು – ದೇವರು, ಪರಮಾತ್ಮ, ಒಡೆಯ; ಹಣತೆ – ದೀಪ`,
notes:`ಪ್ರವೇಶ: ನಮ್ಮ ಬಾಳು 'ಆರಕ್ಕೆ ಏರಲಿಲ್ಲ ಮೂರಕ್ಕೆ ಇಳಿಯಲಿಲ್ಲ' ಎನ್ನುವಂತೆ ಆಗಬಾರದು. ಹುಟ್ಟಿದ ಮೇಲೆ ವ್ಯರ್ಥವಾಗಿ ಬದುಕದೆ ಏನಾದರೂ ಸಾಧಿಸಬೇಕು. ನಮ್ಮ ಇರುವಿಕೆಗೆ ಒಂದು ಗುರಿ ಇರಬೇಕು; ಬದುಕಿಗೆ ಒಂದು ಅರ್ಥ ಬರಬೇಕು ಎಂಬುದೇ ಪದ್ಯದ ಆಶಯ. ಕೃತಿಕಾರರ ಪರಿಚಯ: ಸಿದ್ಧಯ್ಯ ಪುರಾಣಿಕ ಅವರು ಸಾ.ಶ. 1918ರಲ್ಲಿ ಕೊಪ್ಪಳ ಜಿಲ್ಲೆಯ ಯಲಬುರ್ಗಾ ತಾಲ್ಲೂಕಿನ ದ್ಯಾಂಪುರ ಗ್ರಾಮದಲ್ಲಿ ಜನಿಸಿದರು. ತಂದೆ ಪಂಡಿತ ಕಲ್ಲಿನಾಥ ಶಾಸ್ತ್ರಿ ಪುರಾಣಿಕ, ತಾಯಿ ದಾನಮ್ಮ ಪುರಾಣಿಕ. 'ವಚನೋದ್ಯಾನದ ಅನುಭಾವಿ' ಬಿರುದಾಂಕಿತರು; 'ಕಾವ್ಯಾನಂದ' ಕಾವ್ಯನಾಮಾಂಕಿತರು; ಐ.ಎ.ಎಸ್. ಸ್ಥಾನಾಲಂಕೃತರು. ಜಲಪಾತ, ಕರುಣಾ ಶ್ರಾವಣ, ಮಾನಸ ಸರೋವರ, ಮೊದಲು ಮಾನವನಾಗು, ವಚನೋದ್ಯಾನ ಮೊದಲಾದ ಕೃತಿಗಳನ್ನು ರಚಿಸಿದ್ದಾರೆ. ಕರ್ನಾಟಕ ವಿಶ್ವವಿದ್ಯಾಲಯದ ಗೌರವ ಡಾಕ್ಟರೇಟ್ ಹಾಗೂ ಗುಲ್ಬರ್ಗದಲ್ಲಿ ನಡೆದ 58ನೆಯ ಅಖಿಲ ಭಾರತ ಕನ್ನಡ ಸಾಹಿತ್ಯ ಸಮ್ಮೇಳನದ ಅಧ್ಯಕ್ಷತೆಯ ಗೌರವ ದೊರೆತಿದೆ. ಕೌಶಲ: ಆಲಿಸುವುದು; ಸಾಮರ್ಥ್ಯ: ಆಲಿಸಿದ ವಿಷಯವನ್ನು ಗ್ರಹಿಸಿ, ಹಾಗಾದರೆ? ಹಾಗಾಗದಿದ್ದರೆ? ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸುವುದು. (ಪದ್ಯವನ್ನು ಪಠ್ಯಪುಸ್ತಕದಿಂದ ನೋಡಿ ಹಾಡಿಸಿ.)`,
ab:[
[`ಅ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ`,[
[`ಯಾವುದು ಉರಿಯಲಿಲ್ಲ ಆರಲಿಲ್ಲ?`,`ಬಾಳ ಹಣತೆ (ಬಾಳೆಂಬ ದೀಪ) ಉರಿಯಲಿಲ್ಲ, ಆರಲಿಲ್ಲ.`],
[`ಯಾವುದು ಮುಳುಗಲಿಲ್ಲ ತೇಲಲಿಲ್ಲ?`,`ಬಾಳ ನಾವೆ (ಬಾಳೆಂಬ ದೋಣಿ) ಮುಳುಗಲಿಲ್ಲ, ತೇಲಲಿಲ್ಲ.`],
[`ಯಾವುದನ್ನು ನಾವು ದೇವರಲ್ಲಿ ಬೇಡಿಕೊಳ್ಳಬೇಕು?`,`ಇರುವಿಕೆಗೆ (ಬದುಕಿಗೆ) ಒಂದು ಗುರಿಯ ತೋರು ಎಂದು ದೇವರಲ್ಲಿ ಬೇಡಿಕೊಳ್ಳಬೇಕು.`],
[`ನಾವು ಏನೆಂದು ಹಾಡಿಕೊಳ್ಳಬೇಕು?`,`'ಬದುಕಿಗೊಂದು ಅರ್ಥ ತೋರು' ಎಂದು ಹಾಡಿಕೊಳ್ಳಬೇಕು.`],
[`ಸಿದ್ಧಯ್ಯ ಪುರಾಣಿಕ ಅವರ ಕಾವ್ಯನಾಮ ಯಾವುದು?`,`ಕಾವ್ಯಾನಂದ.`]]],
[`ಆ. ಕೆಳಗಿನ ಪದ್ಯಭಾಗವನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ, ಕಂಠಪಾಠ ಮಾಡಿರಿ`,[
[`1. 'ಉರಿಯಲಿಲ್ಲ ...' (ಕೊನೆಯ ಪದ 'ಹೇ ವಿಭೋ!')`,`ಚಟುವಟಿಕೆ: ಪಠ್ಯಪುಸ್ತಕದ ಮೊದಲ ಚರಣದ ಸಾಲುಗಳನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ ಕಂಠಪಾಠ ಮಾಡಿಸಿ.`],
[`2. 'ಇರವಿಗೊಂದು ...' (ಕೊನೆಯ ಪದ 'ಹಾಡಿಕೊಳ್ಳುವೆ!')`,`ಚಟುವಟಿಕೆ: ಪಠ್ಯಪುಸ್ತಕದ ಕೊನೆಯ ಚರಣದ ಸಾಲುಗಳನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ ಕಂಠಪಾಠ ಮಾಡಿಸಿ.`]]],
[`ವ್ಯಾಕರಣ ಮಾಹಿತಿ ಮತ್ತು ಭಾಷಾಭ್ಯಾಸ – ಕ್ರಿಯಾಪದ`,[
[`ಕ್ರಿಯಾಪದ ಎಂದರೇನು? ಉದಾಹರಣೆಯೊಂದಿಗೆ ವಿವರಿಸಿರಿ.`,`ಕರ್ತೃವಿನ ಕ್ರಿಯೆಯನ್ನು ಹೇಳುವ ಪದವೇ ಕ್ರಿಯಾಪದ. ಇದು ಕರ್ತೃವು ಮಾಡುವ ಕೆಲಸವನ್ನು ತಿಳಿಸುವುದರಿಂದ ವಾಕ್ಯದಲ್ಲಿ ಪ್ರಧಾನ ಪಾತ್ರ ವಹಿಸುತ್ತದೆ. ಉದಾ: 'ರಾಮನು ನದಿಯಲ್ಲಿ ಈಜಿದನು' – ಇಲ್ಲಿ 'ಈಜಿದನು' ಕ್ರಿಯಾಪದ.`],
[`ತಿನ್ನು, ಓದು, ಆಡು – ಈ ಪದಗಳನ್ನು ಮಾದರಿಯಂತೆ ಬರೆಯಿರಿ (ಮಾದರಿ: ಕುಣಿ – ಕುಣಿಯುತ್ತಾನೆ – ಕುಣಿದನು).`,`ತಿನ್ನು – ತಿನ್ನುತ್ತಾನೆ – ತಿಂದನು; ಓದು – ಓದುತ್ತಾನೆ – ಓದಿದನು; ಆಡು – ಆಡುತ್ತಾನೆ – ಆಡಿದನು.`],
[`ಕೆಳಗಿನ ವಾಕ್ಯಗಳಲ್ಲಿ ಕಂಡುಬರುವ ಕ್ರಿಯಾಪದಗಳನ್ನು ಓದಿ ತಿಳಿಯಿರಿ: ರೈತನು ಗದ್ದೆಯಲ್ಲಿ ದುಡಿಯುವನು. ರೈತನು ಭತ್ತವನ್ನು ಚೀಲದಲ್ಲಿ ತುಂಬುವನು. ಎತ್ತುಗಳು ಗದ್ದೆಯಲ್ಲಿ ನೇಗಿಲನ್ನು ಎಳೆಯುವುವು.`,`ಕ್ರಿಯಾಪದಗಳು: ದುಡಿಯುವನು, ತುಂಬುವನು, ಎಳೆಯುವುವು.`]]],
[`ಇ. ಓದಿಗೆ ಮನ್ನಣೆ / ಈ. ಶುಭನುಡಿ (ಚಟುವಟಿಕೆ ಆಧಾರಿತ – ಮಾರ್ಗದರ್ಶನ)`,[
[`ಈ ಪದ್ಯವನ್ನು ಸಾಮೂಹಿಕವಾಗಿ ಹಾಡಿರಿ; ಅಭಿನಯದೊಂದಿಗೆ ರಾಗಬದ್ಧವಾಗಿ ಹಾಡಿರಿ.`,`ಚಟುವಟಿಕೆ: ಗುಂಪುಗಳನ್ನು ಮಾಡಿ ಸಾಮೂಹಿಕ ಗಾಯನ ಮತ್ತು ಅಭಿನಯ ಮಾಡಿಸಿ.`],
[`ಶುಭನುಡಿ`,`ಕಾಯಕವೇ ಕೈಲಾಸ. ದುಡಿಮೆಯೇ ಜೀವನದ ಬಹುಮುಖ್ಯ ಗುರಿ.`]]]
],
qb:[
M(`'ಮಗುವಿನ ಮೊರೆ' ಪದ್ಯದ ಕವಿ:`,[`ಕಾವ್ಯಾನಂದ`,`ಕುವೆಂಪು`,`ಬೇಂದ್ರೆ`,`ಕಂಬಾರ`],0),
M(`'ಹಣತೆ' ಪದದ ಅರ್ಥ:`,[`ದೀಪ`,`ನೀರು`,`ದೋಣಿ`,`ಹೂವು`],0),
M(`'ನಾವೆ' ಎಂದರೆ:`,[`ದೋಣಿ`,`ದೀಪ`,`ಹಕ್ಕಿ`,`ಮರ`],0),
M(`'ವಿಭು' ಎಂದರೆ:`,[`ದೇವರು`,`ರಾಜ`,`ಶಿಕ್ಷಕ`,`ಸೈನಿಕ`],0),
M(`ಸಿದ್ಧಯ್ಯ ಪುರಾಣಿಕ ಅವರ ಬಿರುದು:`,[`ವಚನೋದ್ಯಾನದ ಅನುಭಾವಿ`,`ಚುಟುಕ ಬ್ರಹ್ಮ`,`ಸತ್ಯವಿಠಲ`,`ವರಕವಿ`],0),
M(`ಸಿದ್ಧಯ್ಯ ಪುರಾಣಿಕ ಅವರ ಕೃತಿ:`,[`ಮೊದಲು ಮಾನವನಾಗು`,`ಗರಿ`,`ನಾಕುತಂತಿ`,`ಚಕೋರಿ`],0),
O(`ಸಿದ್ಧಯ್ಯ ಪುರಾಣಿಕ ಅವರು ಜನಿಸಿದ ಊರು ಯಾವುದು?`,`ಕೊಪ್ಪಳ ಜಿಲ್ಲೆ ಯಲಬುರ್ಗಾ ತಾಲ್ಲೂಕಿನ ದ್ಯಾಂಪುರ.`),
O(`ಈ ಪದ್ಯದಲ್ಲಿ 'ಬಾಳ' ಎಂದರೆ ಯಾವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ?`,`ಬದುಕು (ಜೀವನ).`),
O(`ಪದ್ಯದಲ್ಲಿ ದೇವರನ್ನು ಯಾವ ಪದದಿಂದ ಸಂಬೋಧಿಸಲಾಗಿದೆ?`,`ಪ್ರಭೋ / ವಿಭೋ.`),
O(`ಕವಿಯು ಬದುಕಿಗೆ ಏನನ್ನು ತೋರೆಂದು ಬೇಡುತ್ತಾನೆ?`,`ಒಂದು ಅರ್ಥವನ್ನು.`),
O(`ಕ್ರಿಯಾಪದ ಎಂದರೇನು?`,`ಕರ್ತೃವಿನ ಕ್ರಿಯೆಯನ್ನು ಹೇಳುವ ಪದ.`),
G(`'ಒರತೆ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ನೀರು ಜಿನುಗುವ ತಗ್ಗು`),
G(`'ತೆರ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ರೀತಿ`),
G(`'ಹಣತೆ' ಪದದ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ದೀಪ`,'e'),
G(`'ತಿನ್ನು' ಧಾತುವಿನ ವರ್ತಮಾನಕಾಲ ರೂಪ ಬರೆಯಿರಿ (ಅವನು).`,`ತಿನ್ನುತ್ತಾನೆ`),
G(`'ಓದು' ಧಾತುವಿನ ಭೂತಕಾಲ ರೂಪ ಬರೆಯಿರಿ (ಅವನು).`,`ಓದಿದನು`),
G(`ಈ ವಾಕ್ಯದಲ್ಲಿರುವ ಕ್ರಿಯಾಪದ ಗುರುತಿಸಿ: ರಾಮನು ನದಿಯಲ್ಲಿ ಈಜಿದನು.`,`ಈಜಿದನು`),
S(`ಕವಿ ದೇವರಲ್ಲಿ ಏನು ಬೇಡಿಕೊಳ್ಳುತ್ತಾರೆ?`,`ತಮ್ಮ ಇರುವಿಕೆಗೊಂದು ಗುರಿಯನ್ನು ತೋರಿಸು ಎಂದೂ, ಬದುಕಿಗೊಂದು ಅರ್ಥವನ್ನು ತೋರಿಸು ಎಂದೂ ಬೇಡಿಕೊಳ್ಳುತ್ತಾರೆ; ಅದನ್ನೇ ಹಾಡಿಕೊಳ್ಳುವುದಾಗಿ ಹೇಳುತ್ತಾರೆ.`),
S(`'ಬಾಳ ಹಣತೆ' ಉರಿಯಲಿಲ್ಲ ಎಂದರೆ ಏನರ್ಥ?`,`ನಮ್ಮ ಜೀವನವೆಂಬ ದೀಪ ಬೆಳಗದೆ ಇರುವುದು ಎಂದರ್ಥ. ಅಂದರೆ ಜೀವನದಲ್ಲಿ ಗುರಿಯಿಲ್ಲದೆ ಅರ್ಥಹೀನವಾಗಿ ಬದುಕುವುದು ಎಂದು ತಿಳಿಯಬಹುದು.`),
S(`ಕ್ರಿಯಾಪದ ಎಂದರೇನು? ಒಂದು ಉದಾಹರಣೆ ಕೊಡಿ.`,`ಕರ್ತೃವಿನ ಕ್ರಿಯೆಯನ್ನು ಹೇಳುವ ಪದವೇ ಕ್ರಿಯಾಪದ. ಉದಾ: ರೈತನು ಗದ್ದೆಯಲ್ಲಿ ದುಡಿಯುವನು – 'ದುಡಿಯುವನು' ಕ್ರಿಯಾಪದ.`),
L(`'ಮಗುವಿನ ಮೊರೆ' ಪದ್ಯದ ಆಶಯವನ್ನು ನಿಮ್ಮ ಮಾತುಗಳಲ್ಲಿ ಬರೆಯಿರಿ.`,`ನಮ್ಮ ಬಾಳು ಹಣತೆಯಂತೆ ಉರಿಯದೆ, ದೋಣಿಯಂತೆ ಸಾಗದೆ, ಹೂವಿನಂತೆ ಅರಳದೆ ಅರ್ಥವಿಲ್ಲದೆ ಹೋಗಬಾರದು. ನಾವು ಏಳದೇ ಬೀಳದೇ ಯಾಕೆ ಈ ರೀತಿ ಬದುಕುತ್ತೇವೆ ಎಂದು ಕವಿ ಕೇಳುತ್ತಾರೆ. ದೇವರಲ್ಲಿ ನಮ್ಮ ಇರುವಿಕೆಗೊಂದು ಗುರಿಯನ್ನು, ಬದುಕಿಗೊಂದು ಅರ್ಥವನ್ನು ತೋರಿಸೆಂದು ಮಗುವಿನಂತೆ ಮೊರೆಯಿಡುತ್ತಾರೆ. ಹುಟ್ಟಿದ ಮೇಲೆ ಗುರಿಯಿರಿಸಿಕೊಂಡು ಸಾಧಿಸಬೇಕು ಎಂಬುದು ಆಶಯ.`),
L(`ಗುರಿಯಿಲ್ಲದ ಬದುಕು ಏಕೆ ವ್ಯರ್ಥ? ನಿಮ್ಮ ಅಭಿಪ್ರಾಯ ಬರೆಯಿರಿ.`,`ಗುರಿಯಿಲ್ಲದ ಬದುಕು ದಿಕ್ಕಿಲ್ಲದ ದೋಣಿಯಂತೆ. ಗುರಿ ಇದ್ದರೆ ನಾವು ಶ್ರಮಪಟ್ಟು ಸಾಧನೆ ಮಾಡಬಹುದು, ಸಮಾಜಕ್ಕೆ ಉಪಯುಕ್ತರಾಗಬಹುದು. ಗುರಿ ಇಲ್ಲದಿದ್ದರೆ ಸಮಯ ವ್ಯರ್ಥವಾಗುತ್ತದೆ. ಆದ್ದರಿಂದ ಪ್ರತಿಯೊಬ್ಬರೂ ತಮ್ಮ ಬದುಕಿಗೆ ಒಂದು ಗುರಿಯನ್ನಿರಿಸಿಕೊಂಡು ದುಡಿಯಬೇಕು.`)
]});

LS5.push({n:7,t:`ಮೂಡಲ ಮನೆ (ಪದ್ಯ)`,au:`ಚಂದ್ರಶೇಖರ ಕಂಬಾರ`,pg:37,
words:`ಅಗಸಿ – ಊರಿನ ಪ್ರವೇಶದ್ವಾರ, ಊರ ಹೆಬ್ಬಾಗಿಲು; ಐತಿ – ಇದೆ, ಇರುವುದು; ಕರಗ – ಒಂದು ಉತ್ಸವದ ಹೆಸರು, ತಲೆಯ ಮೇಲೆ ಕಲಶ ಹೊತ್ತುಕೊಂಡ ಕುಣಿಯುವ ಒಂದು ನೃತ್ಯ; ಕರುಳಬಳ್ಳಿ – ಸಂಬಂಧವನ್ನು ಕುರಿತು ಹೇಳುವಾಗ ಬಳಸುವ ಪದ; ಗೂಡಿನ್ಯಾಗ – ಗೂಡಿನಲ್ಲಿ; ಜಡಿ – ಜಡೆ, ಉದ್ದವಾದ ಕೂದಲ ರಾಶಿ; ಜಡಿಮುನಿ – ವಿಶೇಷವಾಗಿ ಜಡೆಯನ್ನು ಬೆಳೆಸಿದ ಸನ್ಯಾಸಿ; ಜೋತ ಬಾವಲಿ – ರಾತ್ರಿಯ ಹೊತ್ತು ಸಂಚರಿಸುವ, ಮರದ ರೆಂಬೆಗಳಲ್ಲಿ ನೇತಾಡುವ ಪ್ರಾಣಿ; ತಪ – ತಪಸ್ಸು, ಧ್ಯಾನ; ತಳ – ಕೆಳಭಾಗ, ಸಮತಟ್ಟಾದ ಪ್ರದೇಶ; ತೊಗಲುಗೊಂಬೆಯಾಟ – ಚರ್ಮ ಬಳಸಿ ಸಿದ್ಧಪಡಿಸಿದ ಗೊಂಬೆಗಳನ್ನು ಬಳಸಿ ಆಡುವ ಆಟ; ನಾವೂನು – ನಾವೂ ಸಹ, ನಾವೆಲ್ಲರೂ; ನೆತ್ತಿ – ತಲೆಯ ಮಧ್ಯಭಾಗ; ಮ್ಯಾಲ – ಮೇಲೆ; ಮೊಳಕೆ ಒಡಿ – ಮೊಳಕೆ ಬರುವುದು, ಚಿಗುರುವುದು; ಬಲಿತ – ಬೆಳೆದ, ಶಕ್ತಿಯುತವಾದ; ಬಳಗ – ಗುಂಪು, ಬಂಧುಗಳ ಸಮೂಹ; ಬಿಳಲ – ಬಿಳಲು, ಮರದ ಕೊಂಬೆಗಳಿಂದ ನೇತಾಡುವ ಬಿಳಲು; ಭಾಗ – ಅಂಶ, ಒಂದು ಪಾಲು; ಭೂತ ಬೇತಾಳ – ದೆವ್ವ, ಪಿಶಾಚಿ; ವಲಸಿಗ – ಒಂದು ಪ್ರದೇಶದಿಂದ ಮತ್ತೊಂದು ಕಡೆಗೆ ಹೋಗಿ ನೆಲೆಸುವವನು; ಶಾಂತಚಿತ್ತ – ಶಾಂತಮನಸ್ಸು, ತೃಪ್ತ ಮನಸ್ಸು; ಹರವು – ಹರಡು, ವಿಸ್ತರಿಸು, ಕೆದರು; ಹಸರ – ಹಸಿರು`,
notes:`ಪ್ರವೇಶ: ನಾವು ವಿವಿಧ ಜಾತಿಗಳಿಂದ, ವಿವಿಧ ಮತಗಳಿಂದ ಬಂದಿರಬಹುದು; ಆದರೆ ಒಂದೇ ದೇಶದಲ್ಲಿ ಬಾಳಿ ಬದುಕುತ್ತೇವೆ. ಹಬ್ಬ ಹರಿದಿನಗಳನ್ನು ಆಚರಿಸುತ್ತಾ ಮೇಲು–ಕೀಳುಗಳನ್ನು ಮರೆಯುತ್ತಾ ಭಾರತಮಾತೆಯೆಂಬ ಒಂದೇ ತಾಯಿ ಮರದ ವಿಶಾಲ ಬಾಹುಗಳಡಿಯಲ್ಲಿ ಜೀವಿಸಬೇಕಾದ ಸತ್ಯವನ್ನು, ಅಗತ್ಯವನ್ನು ಈ ಕವನದಲ್ಲಿ ಕಂಡುಕೊಳ್ಳುತ್ತೇವೆ. ಕೃತಿಕಾರರ ಪರಿಚಯ: ಡಾ. ಚಂದ್ರಶೇಖರ ಕಂಬಾರರು 02-01-1937ರಂದು ಬೆಳಗಾವಿ ಜಿಲ್ಲೆಯ ಹುಕ್ಕೇರಿ ತಾಲ್ಲೂಕಿನ ಘೋಡಗೆರೆ ಗ್ರಾಮದಲ್ಲಿ ಜನಿಸಿದರು. ಪ್ರಸಿದ್ಧ ಜಾನಪದ ವಿದ್ವಾಂಸರಾದ ಇವರು 24 ನಾಟಕಗಳು, 10 ಕವನ ಸಂಕಲನಗಳು, 5 ಕಾದಂಬರಿಗಳು ಮತ್ತು ಹಲವು ಕೃತಿಗಳನ್ನು ರಚಿಸಿದ್ದಾರೆ. 'ಚಕೋರಿ' ಇವರ ಮಹಾಕಾವ್ಯ. ಸಂಗ್ಯಾಬಾಳ್ಯಾ, ಜೋಕುಮಾರಸ್ವಾಮಿ, ಸಿರಿಸಂಪಿಗೆ, ಶಿವರಾತ್ರಿ ಮುಂತಾದವು ನಾಟಕಗಳು; ಕರಿಮಾಯಿ, ಸಿಂಗಾರೆವ್ವ ಮತ್ತು ಅರಮನೆ, ಶಿಖರಸೂರ್ಯ ಮುಂತಾದವು ಕಾದಂಬರಿಗಳು. ಇವರು 2010ರ ಜ್ಞಾನಪೀಠ ಪ್ರಶಸ್ತಿಯನ್ನು ಪಡೆದಿದ್ದಾರೆ; ಕೇಂದ್ರ ಸಾಹಿತ್ಯ ಅಕಾಡೆಮಿ ಪ್ರಶಸ್ತಿ, ಕೇಂದ್ರ ಸಂಗೀತ ಮತ್ತು ನಾಟಕ ಅಕಾಡೆಮಿ ಪ್ರಶಸ್ತಿ ಮುಂತಾದ ಹಲವು ಪ್ರಶಸ್ತಿಗಳು ಲಭಿಸಿವೆ. ಪ್ರಸ್ತುತ 'ಮೂಡಲಮನೆ' ಕವನವನ್ನು ಅವರ 'ಎಲ್ಲಿದೆ ಶಿವಾಪುರ' ಕವನ ಸಂಕಲನದಿಂದ ಆಯ್ದುಕೊಳ್ಳಲಾಗಿದೆ. ಕೌಶಲ: ಮಾತನಾಡುವುದು; ಸಾಮರ್ಥ್ಯ: ಸನ್ನಿವೇಶಕ್ಕೆ ತಕ್ಕಂತೆ ಆಡುಭಾಷೆ ಮತ್ತು ಗ್ರಾಂಥಿಕ ಭಾಷೆಯನ್ನು ಬಳಸುವುದು. (ಪದ್ಯದ ಸಾಲುಗಳನ್ನು ಪಠ್ಯಪುಸ್ತಕದಿಂದ ನೋಡಿ ಹಾಡಿಸಿ.)`,
ab:[
[`ಅ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ`,[
[`ಆಲದ ಮರ ಎಲ್ಲಿ ಬೆಳೆದು ನಿಂತಿದೆ?`,`ಕವಿಯ ಊರಿನ ಅಗಸಿಯಲ್ಲಿ (ಊರ ಹೆಬ್ಬಾಗಿಲಿನಲ್ಲಿ) ಆಲದ ಮರ ಬೆಳೆದು ನಿಂತಿದೆ.`],
[`ರೆಂಬೆ ಕೊಂಬೆಯ ಮೇಲೆ ಯಾರು ಗೂಡು ಕಟ್ಟಿದ್ದಾರೆ?`,`ಹಕ್ಕಿಗಳು ಗೂಡು ಕಟ್ಟಿವೆ.`],
[`'ಬನ್ನಿರಿ, ನೀವು ನಮ್ಮ ಬಳಗ' ಎಂದು ಕವಿ ಯಾರಿಗೆ ಹೇಳುತ್ತಿದ್ದಾರೆ?`,`ದೂರದ ದೇಶದಿಂದ ವಲಸೆ ಬಂದ ಹಕ್ಕಿಗಳಿಗೆ ಹೇಳುತ್ತಿದ್ದಾರೆ.`],
[`ಮರದಲ್ಲಿ ಯಾರೆಲ್ಲಾ ಸೇರಿ ಕರಗ ಕುಣಿಯುತ್ತಾರೆ?`,`ಭೂತ–ಬೇತಾಳ ಮತ್ತು ಜೋತ ಬಾವಲಿಗಳು ಸೇರಿ ಕರಗ ಕುಣಿಯುತ್ತವೆ (ಎಂಬಂತೆ ಕವಿ ಹೇಳುತ್ತಾರೆ).`],
[`ಮರದ ಎಲೆಗಳ ನೆರಳಾಟ ಎಲ್ಲಿ ನಡೆಯುತ್ತಿದೆ?`,`ಮನೆಯ ಗೋಡೆಯ ಮೇಲೆ ನಡೆಯುತ್ತಿದೆ.`],
[`ಕವಿ ಇಲ್ಲಿ ದೇಶವನ್ನು ಯಾವುದಕ್ಕೆ ಹೋಲಿಸಿದ್ದಾರೆ?`,`ಆಲದ ಮರಕ್ಕೆ ಹೋಲಿಸಿದ್ದಾರೆ; ನಾವೆಲ್ಲರೂ ಅದರ ಭಾಗ ಮಾತ್ರ ಎಂದಿದ್ದಾರೆ.`]]],
[`ಆ. ಕೆಳಗಿನ ಪದ್ಯಭಾಗವನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ, ಕಂಠಪಾಠ ಮಾಡಿರಿ`,[
[`1. 'ನಮ್ಮೂರ ...' (ಕೊನೆಯ ಪದ 'ಹಾಂಗ ಬಿಳಲ')`,`ಚಟುವಟಿಕೆ: ಪಠ್ಯಪುಸ್ತಕದ ಮೊದಲ ಚರಣದ ಸಾಲುಗಳನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ ಕಂಠಪಾಠ ಮಾಡಿಸಿ.`],
[`2. 'ಮೂಡ್ಯಾವ ...' (ಕೊನೆಯ ಪದ 'ಭಾಗ ಮಾತ್ರ')`,`ಚಟುವಟಿಕೆ: ಪಠ್ಯಪುಸ್ತಕದ ಕೊನೆಯ ಚರಣದ ಸಾಲುಗಳನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ ಕಂಠಪಾಠ ಮಾಡಿಸಿ.`]]],
[`ವ್ಯಾಕರಣ ಮಾಹಿತಿ ಮತ್ತು ಭಾಷಾಭ್ಯಾಸ – ಕಾಲಗಳು`,[
[`ಕಾಲಗಳೆಂದರೇನು? ಅವು ಎಷ್ಟು ವಿಧ?`,`ನಡೆದ, ನಡೆಯುತ್ತಿರುವ ಮತ್ತು ನಡೆಯುವ ಕ್ರಿಯೆಗಳನ್ನು ಸೂಚಿಸುವುದೇ ಕಾಲಗಳು. ಇವು ಮೂರು ವಿಧ: 1) ಭೂತಕಾಲ (ನಡೆದ) 2) ವರ್ತಮಾನಕಾಲ (ನಡೆಯುತ್ತಿರುವ) 3) ಭವಿಷ್ಯತ್ಕಾಲ (ನಡೆಯುವ).`],
[`ಈ ವಾಕ್ಯಗಳಲ್ಲಿ ಅಡಿಗೆರೆ ಎಳೆದ ಶಬ್ದ ಯಾವ ಕಾಲವನ್ನು ಸೂಚಿಸುತ್ತದೆ ಬರೆಯಿರಿ: 1. ಅರ್ಚನ ಗೆಳತಿಯ ಮನೆಗೆ ಹೋಗುವಳು. 2. ಚಂದನ ಚೆಂಡಾಟ ಆಡುತ್ತಾನೆ. 3. ಧನುಶ್ರೀ ಗೀತೆ ಹಾಡಿದಳು.`,`1. ಹೋಗುವಳು – ಭವಿಷ್ಯತ್ಕಾಲ; 2. ಆಡುತ್ತಾನೆ – ವರ್ತಮಾನಕಾಲ; 3. ಹಾಡಿದಳು – ಭೂತಕಾಲ.`],
[`ಮಾದರಿಯಂತೆ ಸರಿಯಾದ ಶಬ್ದ ಬರೆಯಿರಿ (ಮಾದರಿ: ರಾಜ್ಯವನ್ನು ಆಳುವವಳು – ರಾಣಿ). 1. ಹಣ, ವಸ್ತುಗಳನ್ನು ಉಚಿತವಾಗಿ ನೀಡುವವ. 2. ಸೇನೆಯನ್ನು ಮುನ್ನಡೆಸುವವ. 3. ಕಾಯಿಲೆಯಿಂದ ಹಾಸಿಗೆಯಲ್ಲಿ ಮಲಗಿದವ.`,`1. ದಾನಿ; 2. ಸೇನಾನಿ (ದಂಡನಾಯಕ); 3. ರೋಗಿ (ಮಾದರಿ ಉತ್ತರ).`],
[`ಕಾಲಗಳ ಕೋಷ್ಠಕ: ಆಡು, ನೋಡು, ಬೇಡು, ಓಡು, ನಡೆ`,`ಭೂತ / ವರ್ತಮಾನ / ಭವಿಷ್ಯತ್: ಆಡಿದೆನು / ಆಡುತ್ತೇನೆ / ಆಡುವೆನು; ನೋಡಿದೆನು / ನೋಡುತ್ತೇನೆ / ನೋಡುವೆನು; ಬೇಡಿದಳು / ಬೇಡುತ್ತಾಳೆ / ಬೇಡುವಳು; ಓಡಿದನು / ಓಡುತ್ತಾನೆ / ಓಡುವನು; ನಡೆಯಿತು / ನಡೆಯುತ್ತದೆ / ನಡೆಯುವುದು.`]]],
[`ಇ. ಓದಿಗೆ ಮನ್ನಣೆ / ಈ. ಶುಭನುಡಿ (ಚಟುವಟಿಕೆ ಆಧಾರಿತ – ಮಾರ್ಗದರ್ಶನ)`,[
[`ಚಂದ್ರಶೇಖರ ಕಂಬಾರರ 'ಕಿಟ್ಟಿ ಕಥೆ' ನಾಟಕವನ್ನು ಸಂಪಾದಿಸಿ ಓದಿರಿ. ದೇಶದ ಬಗ್ಗೆ ದಿನಕರ ದೇಸಾಯಿಯವರ ಚೌಪದಿಗಳನ್ನು ಓದಿಸಿ. ವಿವಿಧ ದೇಶಭಕ್ತಿ ಗೀತೆಗಳನ್ನು ಸಂಗ್ರಹಿಸಿ ಗುಂಪಿನಲ್ಲಿ ಹಾಡಿರಿ.`,`ಚಟುವಟಿಕೆ: ಶಾಲಾ ಗ್ರಂಥಾಲಯದ ಪುಸ್ತಕಗಳನ್ನು ಬಳಸಿ ಮಕ್ಕಳಿಂದ ಓದಿಸಿ, ದೇಶಭಕ್ತಿ ಗೀತೆಗಳನ್ನು ಹಾಡಿಸಿ.`],
[`ಶುಭನುಡಿ`,`ಜೀವನ ಬಲು ಚಿಕ್ಕದು; ಅದನ್ನು ಆದಷ್ಟು ಚೊಕ್ಕವಾಗಿ ಕಳೆಯೋಣ. ನಿನ್ನ ದೇಶಕ್ಕಾಗಿ ನೀನು ಯಾವ ತ್ಯಾಗಕ್ಕಾದರೂ ಸಿದ್ಧನಾಗು.`]]]
],
qb:[
M(`'ಮೂಡಲ ಮನೆ' ಪದ್ಯದ ಕವಿ:`,[`ಚಂದ್ರಶೇಖರ ಕಂಬಾರ`,`ಬೇಂದ್ರೆ`,`ಕುವೆಂಪು`,`ದಿನಕರ ದೇಸಾಯಿ`],0),
M(`ಕಂಬಾರರಿಗೆ ದೊರೆತ ಪ್ರಶಸ್ತಿ (2010):`,[`ಜ್ಞಾನಪೀಠ`,`ಪದ್ಮವಿಭೂಷಣ`,`ಭಾರತರತ್ನ`,`ನೊಬೆಲ್`],0),
M(`ಕಂಬಾರರ ಮಹಾಕಾವ್ಯ:`,[`ಚಕೋರಿ`,`ಗರಿ`,`ಮೇಘದೂತ`,`ವಚನೋದ್ಯಾನ`],0),
M(`'ಅಗಸಿ' ಎಂದರೆ:`,[`ಊರಿನ ಪ್ರವೇಶದ್ವಾರ`,`ಶಾಲೆ`,`ಕೆರೆ`,`ದೇವಾಲಯ`],0),
M(`'ವಲಸಿಗ' ಎಂದರೆ:`,[`ಒಂದು ಪ್ರದೇಶದಿಂದ ಮತ್ತೊಂದು ಕಡೆ ಹೋಗಿ ನೆಲೆಸುವವನು`,`ಊರಿನವನು`,`ಶಿಕ್ಷಕ`,`ರೈತ`],0),
M(`'ಆಡಿದನು' ಎಂಬುದು ಯಾವ ಕಾಲದ ರೂಪ?`,[`ಭೂತಕಾಲ`,`ವರ್ತಮಾನಕಾಲ`,`ಭವಿಷ್ಯತ್ಕಾಲ`,`ಯಾವುದೂ ಅಲ್ಲ`],0),
O(`ಕಂಬಾರರು ಜನಿಸಿದ ಊರು ಯಾವುದು?`,`ಬೆಳಗಾವಿ ಜಿಲ್ಲೆ ಹುಕ್ಕೇರಿ ತಾಲ್ಲೂಕಿನ ಘೋಡಗೆರೆ.`),
O(`'ಮೂಡಲಮನೆ' ಕವನ ಕಂಬಾರರ ಯಾವ ಕವನ ಸಂಕಲನದಿಂದ ಆಯ್ದದ್ದು?`,`'ಎಲ್ಲಿದೆ ಶಿವಾಪುರ' ಕವನ ಸಂಕಲನದಿಂದ.`),
O(`ಹಕ್ಕಿಗಳು ಗೂಡು ಕಟ್ಟಿರುವುದು ಎಲ್ಲಿ?`,`ಆಲದ ಮರದ ರೆಂಬೆ ಕೊಂಬೆಗಳ ಮೇಲೆ.`),
O(`ಕಂಬಾರರ ಎರಡು ಕಾದಂಬರಿಗಳನ್ನು ಹೆಸರಿಸಿ.`,`ಕರಿಮಾಯಿ, ಸಿಂಗಾರೆವ್ವ ಮತ್ತು ಅರಮನೆ, ಶಿಖರಸೂರ್ಯ (ಯಾವುದಾದರೂ ಎರಡು).`,'m'),
O(`ಭೂತಕಾಲ ಎಂದರೇನು?`,`ನಡೆದುಹೋದ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುವ ಕಾಲ.`),
G(`'ಬಳಗ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಗುಂಪು, ಬಂಧುಗಳ ಸಮೂಹ`),
G(`'ಶಾಂತಚಿತ್ತ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಶಾಂತಮನಸ್ಸು, ತೃಪ್ತ ಮನಸ್ಸು`),
G(`'ನೋಡು' ಧಾತುವಿನ ಭವಿಷ್ಯತ್ಕಾಲ ರೂಪ (ಅವನು) ಬರೆಯಿರಿ.`,`ನೋಡುವನು`),
G(`'ಆಡುತ್ತಾನೆ' ಯಾವ ಕಾಲದ ರೂಪ?`,`ವರ್ತಮಾನಕಾಲ`,'e'),
G(`'ಸೇನೆಯನ್ನು ಮುನ್ನಡೆಸುವವ' – ಒಂದು ಪದದಲ್ಲಿ ಬರೆಯಿರಿ.`,`ಸೇನಾನಿ`),
G(`'ಹಸರ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಹಸಿರು`,'e'),
S(`ಕವಿ ವಲಸಿಗ ಹಕ್ಕಿಗಳನ್ನು ಹೇಗೆ ಸ್ವಾಗತಿಸುತ್ತಾರೆ?`,`ದೂರ ದೇಶದಿಂದ ವಲಸೆ ಬಂದ ಹಕ್ಕಿಗಳಿಗೂ ಮರದಲ್ಲಿ ಜಾಗ ಇದೆ ಎಂದು ಹೇಳಿ 'ಬನ್ನಿರಿ, ನೀವು ನಮ್ಮ ಬಳಗ' ಎಂದು ಆತ್ಮೀಯವಾಗಿ ಸ್ವಾಗತಿಸುತ್ತಾರೆ.`),
S(`ಮೂರು ಕಾಲಗಳನ್ನು ಉದಾಹರಣೆಯೊಂದಿಗೆ ಬರೆಯಿರಿ.`,`ಭೂತಕಾಲ – ಮಹೇಂದ್ರನು ಮನೆಗೆಲಸವನ್ನು ಮಾಡಿದನು; ವರ್ತಮಾನಕಾಲ – ರಾಜು ತೋಟದಲ್ಲಿ ಕೆಲಸ ಮಾಡುತ್ತಾನೆ; ಭವಿಷ್ಯತ್ಕಾಲ – ಪ್ರಸಾದ್ ಶಿಕ್ಷಕ ಆಗುವನು.`),
S(`ಕವಿ ಆಲದ ಮರವನ್ನು ಜಡಿಮುನಿಗೆ ಹೋಲಿಸಿರುವುದೇಕೆ?`,`ಆಲದ ಮರದ ಬಿಳಲುಗಳು ಜಡೆಯಂತೆ ಇಳಿಬಿದ್ದಿವೆ; ಅದು ತಪಸ್ಸು ಮಾಡುತ್ತಿರುವ ಜಡೆ ಬೆಳೆಸಿದ ಮುನಿಯಂತೆ ಕಾಣುವುದರಿಂದ ಹೋಲಿಸಿದ್ದಾರೆ.`),
L(`'ಮೂಡಲ ಮನೆ' ಪದ್ಯದ ಆಶಯವನ್ನು ನಿಮ್ಮ ಮಾತುಗಳಲ್ಲಿ ವಿವರಿಸಿ.`,`ಊರಿನ ಅಗಸಿಯಲ್ಲಿ ಬೆಳೆದ ದೊಡ್ಡ ಆಲದ ಮರದಲ್ಲಿ ಹಕ್ಕಿಗಳು ಗೂಡು ಕಟ್ಟಿವೆ; ದೂರದ ದೇಶದ ವಲಸೆ ಹಕ್ಕಿಗಳಿಗೂ ಅಲ್ಲಿ ಜಾಗವಿದೆ. ಮರದ ನೆರಳಿನಲ್ಲಿ ಎಲೆಗಳ ನೆರಳಾಟ, ಗೊಂಬೆಯಾಟ, ಕರಗ ಮುಂತಾದ ಜಾನಪದ ಚಿತ್ರಗಳಿವೆ. ಒಂದೇ ಮರದ ವಿಶಾಲ ಬಾಹುಗಳಡಿಯಲ್ಲಿ ಎಲ್ಲರೂ ಬಾಳುವಂತೆ ನಾವೆಲ್ಲರೂ ವಿವಿಧ ಜಾತಿ–ಮತಗಳವರಾದರೂ ಭಾರತಮಾತೆಯ ಭಾಗವೇ ಎಂಬ ಏಕತೆಯ ಸಂದೇಶ ಇಲ್ಲಿದೆ.`),
L(`ದೇಶವನ್ನು ಆಲದ ಮರಕ್ಕೆ ಹೋಲಿಸಿರುವುದು ಎಷ್ಟು ಸೂಕ್ತ? ವಿವರಿಸಿ.`,`ಆಲದ ಮರ ವಿಶಾಲವಾಗಿ ಹರಡಿ ಪಕ್ಷಿ, ಪ್ರಾಣಿ, ಮನುಷ್ಯರಿಗೆಲ್ಲ ನೆರಳು ಆಶ್ರಯ ನೀಡುತ್ತದೆ. ಅದೇ ರೀತಿ ನಮ್ಮ ದೇಶವೂ ಎಲ್ಲ ಜಾತಿ, ಮತ, ಭಾಷೆಯ ಜನರಿಗೆ ಆಶ್ರಯ ನೀಡುತ್ತದೆ. ಮರದ ಬೇರು, ರೆಂಬೆ, ಎಲೆಗಳು ಒಂದೇ ಮರದ ಭಾಗವಾದಂತೆ ನಾವೆಲ್ಲರೂ ದೇಶದ ಭಾಗ. ಆದ್ದರಿಂದ ಈ ಹೋಲಿಕೆ ಅತ್ಯಂತ ಸೂಕ್ತ.`)
]});

LS5.push({n:8,t:`ಭುವನೇಶ್ವರಿ (ಪದ್ಯ)`,au:`ಬಿ.ವಿ. ಸತ್ಯನಾರಾಯಣರಾವ್`,pg:43,
words:`ಪದ – ಪಾದ, ಕಾಲುಗಳು; ಚರಿತೆ – ಇತಿಹಾಸ; ಸೊಬಗು – ಚೆಲುವು, ಅಂದ; ಮೆರೆ – ಖ್ಯಾತಿಹೊಂದು; ವೀರತಾಣ – ವೀರರ ಸ್ಥಳ; ಹಿರಿಮೆ – ಹೆಚ್ಚುಗಾರಿಕೆ; ಸಿರಿ – ಶ್ರೀ, ಸಂಪತ್ತು, ಚೆಲುವು; ವೈಭವ – ಐಶ್ವರ್ಯ, ಡೌಲು; ಗರಿಮೆ – ಹಿರಿಮೆ; ಪತನ – ಅವನತಿ, ನಾಶ; ಶೀಘ್ರದಲಿ – ಬೇಗನೆ, ಅಲ್ಪಸಮಯದಲ್ಲೇ; ಬೆರಗಾಗು – ವಿಸ್ಮಯಪಡು; ಸಿರಿ ಸಂಪದ – ಸಂಪತ್ತು; ದ್ರೋಹ – ಕೇಡನ್ನೆಣಿಸು, ವಿಶ್ವಾಸಘಾತ; ಸೆರೆ – ಬಂಧನ; ಅಂತಃಕಲಹ – ಒಳಜಗಳ; ಅಮರಿದರು – ಆಕ್ರಮಿಸು; ಚಳುವಳಿ – ಹೋರಾಟ; ತತ್ತ್ವ – ಸಿದ್ಧಾಂತ, ಸಾರಸತ್ವ; ಅಸಹಕಾರ – ಸಹಕರಿಸದಿರುವುದು; ಮೊಳೆತವು – ಚಿಗುರಿದವು; ವಿಶಾಲ – ವಿಸ್ತಾರವಾದ; ಉದಯ – ಮೂಡು, ಹುಟ್ಟು; ಪರಿ – ರೀತಿ; ಪಂಥ – ಮಾರ್ಗ, ಸಂಪ್ರದಾಯ; ಚಿಮ್ಮು – ನೆಗೆ, ಬೀಸು; ಪೋಷಿಸು – ಕಾಪಾಡು, ಮೊರೆ`,
notes:`ಪ್ರವೇಶ: ಕನ್ನಡ ನಾಡು ಮತ್ತು ನುಡಿಯ ಬಗ್ಗೆ ಎಳೆಯರಲ್ಲಿ ಪ್ರೀತಿ ಮತ್ತು ಅಭಿಮಾನವನ್ನು ಮೂಡಿಸುವುದು ಪ್ರತಿಯೊಬ್ಬರ ಜವಾಬ್ದಾರಿ. ನಮ್ಮ ನಾಡಿನ ಇತಿಹಾಸ, ಆಳಿದ ಪರಾಕ್ರಮಿಗಳು, ನಾಡನ್ನು ಕಟ್ಟಲು ಶ್ರಮಿಸಿದ ನೇತಾರರು, ಇಲ್ಲಿನ ಶಿಲ್ಪಕಲೆ, ಸಂಸ್ಕೃತಿ ಮುಂತಾದ ಪರಂಪರೆಯನ್ನು ಮಕ್ಕಳಿಗೆ ಅರ್ಥಮಾಡಿಸುವ ಮೂಲಕ ಹೆಮ್ಮೆ ಮೂಡಿಸುವ ಆಶಯ ಈ ಪದ್ಯದಲ್ಲಿದೆ. ಪದ್ಯದ ಚಿತ್ರಣ: ಕದಂಬ ಮಯೂರ, ಚಾಲುಕ್ಯರ ಬಾದಾಮಿ, ಗಂಗ ಮನೆತನ, ರಾಷ್ಟ್ರಕೂಟ, ಹೊಯ್ಸಳ, ವಿಜಯನಗರ ಸಾಮ್ರಾಜ್ಯ, ಕಿತ್ತೂರು ಚನ್ನಮ್ಮ, ಮೈಸೂರಿನ ಹುಲಿ (ಟಿಪ್ಪು), ಸ್ವಾತಂತ್ರ್ಯ ಚಳುವಳಿ, 1956 ನವೆಂಬರ್ 1ರ ವಿಶಾಲ ಮೈಸೂರಿನ ಉದಯ, 1973ರಲ್ಲಿ 'ಕರ್ನಾಟಕ' ನಾಮಕರಣ, ಹಿಂದೂ–ಮುಸ್ಲಿಂ–ಕ್ರೈಸ್ತ–ಜೈನ–ಬಸವೇಶ್ವರರ ಪಂಥಗಳ ಸಂಸ್ಕೃತಿ, ಕೊಂಕಣಿ–ಉರ್ದು–ತುಳು ಭಾಷೆಗಳ ಸಂಸ್ಕೃತಿ. ಕೃತಿಕಾರರ ಪರಿಚಯ: 'ಸತ್ಯವಿಠಲ' ಅಂಕಿತದಿಂದ ಪ್ರಸಿದ್ಧರಾದ ಬಿ.ವಿ. ಸತ್ಯನಾರಾಯಣರಾವ್ ಅವರು (1948) ತುಮಕೂರು ಜಿಲ್ಲೆ ಶಿರಾ ತಾಲ್ಲೂಕಿನ ಬುಕ್ಕಾಪಟ್ಟಣದವರು. ಮೆಕಾನಿಕಲ್ ಇಂಜಿನಿಯರಿಂಗ್ ಪದವೀಧರರು; ಕರ್ನಾಟಕ ವಿದ್ಯುತ್ ಪ್ರಸರಣ ನಿಗಮದಲ್ಲಿ ಉಪಪ್ರಧಾನ ವ್ಯವಸ್ಥಾಪಕರಾಗಿ ನಿವೃತ್ತರು. ಗೀತ, ಸ್ತೋತ್ರ, ಕಾವ್ಯ, ಲಾವಣಿ, ಗದ್ಯ ಹೀಗೆ ವಿವಿಧ ಪ್ರಕಾರಗಳಲ್ಲಿ ಅರವತ್ತು ಕೃತಿಗಳನ್ನು ರಚಿಸಿದ್ದಾರೆ. ಬಾಹುಬಲಿಚರಿತಂ, ಗಾಯತ್ರೀರಾಮಾಯಣ, ಸಿರಿಗನ್ನಡ ವೈಜಂತಿ, ಕನ್ನಡನಾಡಚರಿತ್ರೆ, ತತ್ತ್ವಭಾರತಿ, ಭಾವಗೀತಗಳು, ಶ್ರೀಶಿವಕುಮಾರಸ್ವಾಮಿಗುರುಚರಿತಂ, ಗುರುದತ್ತಚರಿತಂ ಇವರ ಪ್ರಮುಖ ಕೃತಿಗಳು. ಕೌಶಲ: ಮಾತನಾಡಿ ಚರ್ಚಿಸುವುದು; ಸಾಮರ್ಥ್ಯ: ಪದ್ಯದ ವಿವರ–ಘಟನೆಗಳನ್ನು ವಿವರಿಸುವುದು. (ಪದ್ಯದ ಸಾಲುಗಳನ್ನು ಪಠ್ಯಪುಸ್ತಕದಿಂದ ನೋಡಿ ಹಾಡಿಸಿ; ಈ ಪದ್ಯದಲ್ಲಿ 11 ಚರಣಗಳಿವೆ.)`,
ab:[
[`ಅ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ`,[
[`ಪಲ್ಲವರನ್ನು ಗೆದ್ದು ಮೆರೆದವರು ಯಾರು?`,`ಕದಂಬರು (ಕದಂಬ ಮಯೂರ).`],
[`ಬಾದಾಮಿಯಲ್ಲಿ ಆಳ್ವಿಕೆ ನಡೆಸಿದವರಾರು?`,`ಚಾಲುಕ್ಯರು.`],
[`ಯಾರ ಪತನದ ನಂತರ ವಿಜಯನಗರ ಬೆಳೆಯಿತು?`,`ಹೊಯ್ಸಳರ ಪತನದ ನಂತರ ವಿಜಯನಗರ ಬೆಳೆಯಿತು.`],
[`ಯುದ್ಧದಲ್ಲಿ ಆಂಗ್ಲರನ್ನು ಎದುರಿಸಿ ಗೆದ್ದವರು ಯಾರು?`,`ಕಿತ್ತೂರಿನ ರಾಣಿ ಚೆನ್ನಮ್ಮ.`],
[`ಭಾರತ ಸ್ವಾತಂತ್ರ್ಯದ ಚಳವಳಿ ಯಾರ ತತ್ವದಲ್ಲಿ ಬೆಳೆಯಿತು?`,`ಗಾಂಧೀಜಿಯವರ ತತ್ವದಲ್ಲಿ ಬೆಳೆಯಿತು.`],
[`ವಿಶಾಲ ಮೈಸೂರಿನ ಉದಯವಾದುದು ಯಾವಾಗ?`,`1956ರ ನವೆಂಬರ್ 1ರಂದು.`],
[`ನಮ್ಮ ನಾಡಿನಲ್ಲಿ ಯಾವುದು ಗೆಲ್ಲಬೇಕು? ಯಾವುದು ಬಾಳಬೇಕು?`,`ನಮ್ಮ ನಾಡಿನಲ್ಲಿ ಕನ್ನಡ ಗೆಲ್ಲಬೇಕು; ಕನ್ನಡ ಬಾಳಬೇಕು.`]]],
[`ಆ. ಕೆಳಗಿನ ಪದ್ಯಭಾಗವನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ, ಕಂಠಪಾಠ ಮಾಡಿರಿ`,[
[`1. 'ಹೊಯ್ಸಳ ಪತನದ ...' (ನಾಲ್ಕನೆಯ ಚರಣ, ಕೊನೆಯ ಪದ 'ಸಾಮ್ರಾಜ್ಯದಲಿ')`,`ಚಟುವಟಿಕೆ: ಪಠ್ಯಪುಸ್ತಕದ ಚರಣವನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ ಕಂಠಪಾಠ ಮಾಡಿಸಿ.`],
[`2. 'ಯುದ್ಧದಿ ...' (ಐದನೆಯ ಚರಣ, ಕೊನೆಯ ಪದ 'ಜೈಲಿನಲಿ')`,`ಚಟುವಟಿಕೆ: ಪಠ್ಯಪುಸ್ತಕದ ಚರಣವನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ ಕಂಠಪಾಠ ಮಾಡಿಸಿ.`],
[`3. 'ಹಿಂದೂ ಮುಸ್ಲಿಂ ...' (ಹತ್ತನೆಯ ಚರಣ, ಕೊನೆಯ ಪದ 'ಚಿಮ್ಮುತಿದೆ')`,`ಚಟುವಟಿಕೆ: ಪಠ್ಯಪುಸ್ತಕದ ಚರಣವನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ ಕಂಠಪಾಠ ಮಾಡಿಸಿ.`],
[`4. '"ಕನ್ನಡಗೆಲ್ಲಲಿ ...' (ಹನ್ನೊಂದನೆಯ ಚರಣ, ಕೊನೆಯ ಪದ 'ಕನ್ನಡನಾಡಿನಲಿ')`,`ಚಟುವಟಿಕೆ: ಪಠ್ಯಪುಸ್ತಕದ ಕೊನೆಯ ಚರಣವನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ ಕಂಠಪಾಠ ಮಾಡಿಸಿ.`]]],
[`ವ್ಯಾಕರಣ ಮಾಹಿತಿ ಮತ್ತು ಭಾಷಾಭ್ಯಾಸ – ಧಾತು`,[
[`ಕ್ರಿಯಾಪದದ ಮೂಲ ರೂಪವನ್ನು ಏನೆಂದು ಕರೆಯುತ್ತಾರೆ?`,`ಕ್ರಿಯಾಪದದ ಮೂಲ ರೂಪವನ್ನು 'ಕ್ರಿಯಾಪ್ರಕೃತಿ' ಅಥವಾ 'ಧಾತು' ಎಂದು ಕರೆಯುತ್ತಾರೆ. ಉದಾ: ತಿನ್ನುತ್ತಾನೆ, ತಿಂದರು, ತಿನ್ನುವರು ಮುಂತಾದ ಕ್ರಿಯಾಪದಗಳ ಮೂಲರೂಪ 'ತಿನ್ನು'.`],
[`'ತಿನ್ನು' ಧಾತುವಿನ ರೂಪಗಳನ್ನು ಬರೆಯಿರಿ (ಪ್ರಥಮ, ಮಧ್ಯಮ, ಉತ್ತಮ ಪುರುಷ).`,`ವರ್ತಮಾನ: ಅವನು ತಿನ್ನುತ್ತಾನೆ, ಅವರು ತಿನ್ನುತ್ತಾರೆ; ನೀನು ತಿನ್ನುತ್ತೀಯೆ, ನೀವು ತಿನ್ನುತ್ತೀರಿ; ನಾನು ತಿನ್ನುತ್ತೇನೆ, ನಾವು ತಿನ್ನುತ್ತೇವೆ. ಭೂತ: ತಿಂದನು, ತಿಂದರು, ತಿಂದೆ, ತಿಂದಿರಿ, ತಿಂದೆನು, ತಿಂದೆವು. ಭವಿಷ್ಯತ್: ತಿನ್ನುವನು, ತಿನ್ನುವರು, ತಿನ್ನುವೆ, ತಿನ್ನುವಿರಿ, ತಿನ್ನುವೆನು, ತಿನ್ನುವೆವು.`],
[`ಕೊಟ್ಟಿರುವ ಪದಗಳನ್ನು ಸೂಚನೆಯಂತೆ ಬದಲಾಯಿಸಿ: 1. ಆಡಿದಳು – ವರ್ತಮಾನಕಾಲಕ್ಕೆ ಬದಲಿಸಿ. 2. ನೋಡುವರು – ಏಕವಚನಕ್ಕೆ ಬದಲಿಸಿ. 3. ತಿಂದಿತು – ಮೂಲರೂಪ ಬರೆಯಿರಿ. 4. ಬರುವುದು – ಭೂತಕಾಲಕ್ಕೆ ಬದಲಾಯಿಸಿ.`,`1. ಆಡುತ್ತಾಳೆ; 2. ನೋಡುವನು (ನೋಡುವಳು); 3. ತಿನ್ನು; 4. ಬಂದಿತು. (ಪಠ್ಯಪುಸ್ತಕದಲ್ಲಿ 'ನೋಡವರು' ಎಂದು ಮುದ್ರಣವಾಗಿದೆ – ⚠ ಪರಿಶೀಲಿಸಿ.)`],
[`ಇವುಗಳ 'ಧಾತು' ರೂಪ ಬರೆಯಿರಿ (ಮಾದರಿ: ಬಂದರು – ಬರು): 1. ಕುಣಿವಳು 2. ಕುಡಿಯಿತು 3. ಬರೆವಳು 4. ಬಂದನು 5. ಹೋಗುವರು`,`1. ಕುಣಿ; 2. ಕುಡಿ; 3. ಬರೆ; 4. ಬರು; 5. ಹೋಗು`]]],
[`ಇ. ಓದಿಗೆ ಮನ್ನಣೆ / ಈ. ಶುಭನುಡಿ (ಚಟುವಟಿಕೆ ಆಧಾರಿತ – ಮಾರ್ಗದರ್ಶನ)`,[
[`ಕನ್ನಡ ನಾಡು–ನುಡಿಯನ್ನು ವರ್ಣಿಸುವ ಕನ್ನಡ ಗೀತೆಗಳನ್ನು ಸಂಗ್ರಹಿಸಿ, ಕೇಳಿರಿ. ಕನ್ನಡಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಹಾಡುಗಳನ್ನು ಗುಂಪಾಗಿ ಹಾಡಿರಿ. ಕನ್ನಡಕ್ಕೆ ಹಿರಿಯರು ಸಲ್ಲಿಸಿದ ಸೇವೆಯನ್ನು ಪುಸ್ತಕಗಳಿಂದ ಓದಿ ತಿಳಿಯಿರಿ.`,`ಚಟುವಟಿಕೆ: ಕನ್ನಡ ರಾಜ್ಯೋತ್ಸವದ ಸಂದರ್ಭದಲ್ಲಿ ಶಾಲೆಯಲ್ಲಿ ಸಾಮೂಹಿಕ ಗಾಯನ ಮತ್ತು ಭಾಷಣ ಏರ್ಪಡಿಸಿ.`],
[`ಶುಭನುಡಿಗಳು`,`ತಾಯಿ–ತನ್ನೂರುಗಳು ಸ್ವರ್ಗಕ್ಕಿಂತಲೂ ಮಿಗಿಲು. ನಮ್ಮ ನಾಡು–ನುಡಿಗೆ ಗೌರವ ಸಲ್ಲಿಸಬೇಕಾದ್ದು ನಮ್ಮ ಪ್ರಥಮ ಕರ್ತವ್ಯ. ಕನ್ನಡ ನಾಡಿನಲ್ಲಿ ಕನ್ನಡವೇ ರಾಜ–ರಾಣಿ ಎಲ್ಲವೂ.`]]]
],
qb:[
M(`'ಭುವನೇಶ್ವರಿ' ಪದ್ಯದ ಕವಿ:`,[`ಬಿ.ವಿ. ಸತ್ಯನಾರಾಯಣರಾವ್`,`ಬೇಂದ್ರೆ`,`ಕುವೆಂಪು`,`ಕಂಬಾರ`],0),
M(`ಬಿ.ವಿ. ಸತ್ಯನಾರಾಯಣರಾವ್ ಅವರ ಅಂಕಿತನಾಮ:`,[`ಸತ್ಯವಿಠಲ`,`ಸರ್ವಜ್ಞ`,`ಅಂಬಿಕಾತನಯದತ್ತ`,`ಕಾವ್ಯಾನಂದ`],0),
M(`ಪಲ್ಲವರನ್ನು ಗೆದ್ದ ಮನೆತನ:`,[`ಕದಂಬ`,`ಹೊಯ್ಸಳ`,`ರಾಷ್ಟ್ರಕೂಟ`,`ಗಂಗ`],0),
M(`ಬಾದಾಮಿಯಲ್ಲಿ ಆಳ್ವಿಕೆ ನಡೆಸಿದವರು:`,[`ಚಾಲುಕ್ಯರು`,`ಕದಂಬರು`,`ಹೊಯ್ಸಳರು`,`ಗಂಗರು`],0),
M(`ವಿಶಾಲ ಮೈಸೂರು ಉದಯವಾದುದು:`,[`ನವೆಂಬರ್ 1, 1956`,`ಆಗಸ್ಟ್ 15, 1947`,`ಜನವರಿ 26, 1950`,`ಅಕ್ಟೋಬರ್ 2, 1869`],0),
M(`'ಅಂತಃಕಲಹ' ಎಂದರೆ:`,[`ಒಳಜಗಳ`,`ಯುದ್ಧ`,`ಹಬ್ಬ`,`ಸ್ನೇಹ`],0),
O(`ಆಂಗ್ಲರನ್ನು ಯುದ್ಧದಲ್ಲಿ ಎದುರಿಸಿ ಗೆದ್ದವಳು ಯಾರು?`,`ಕಿತ್ತೂರು ರಾಣಿ ಚೆನ್ನಮ್ಮ.`),
O(`ವಿಜಯನಗರ ಯಾರ ಪತನದ ನಂತರ ಬೆಳೆಯಿತು?`,`ಹೊಯ್ಸಳರ ಪತನದ ನಂತರ.`),
O(`ಸ್ವಾತಂತ್ರ್ಯ ಚಳುವಳಿ ಯಾರ ತತ್ವದಲ್ಲಿ ಬೆಳೆಯಿತು?`,`ಗಾಂಧೀಜಿಯವರ ತತ್ವದಲ್ಲಿ.`),
O(`ಈ ಪದ್ಯದ ಚರಣಗಳ ಸಂಖ್ಯೆ ಎಷ್ಟು?`,`11`,'m'),
O(`ಬಿ.ವಿ. ಸತ್ಯನಾರಾಯಣರಾವ್ ಜನಿಸಿದ ಊರು ಯಾವುದು?`,`ತುಮಕೂರು ಜಿಲ್ಲೆ ಶಿರಾ ತಾಲ್ಲೂಕಿನ ಬುಕ್ಕಾಪಟ್ಟಣ.`,'m'),
G(`'ಸೊಬಗು' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಚೆಲುವು, ಅಂದ`,'e'),
G(`'ಪತನ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಅವನತಿ, ನಾಶ`),
G(`'ಸೆರೆ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಬಂಧನ`,'e'),
G(`'ಬಂದನು' ಪದದ ಧಾತು ರೂಪ ಬರೆಯಿರಿ.`,`ಬರು`),
G(`'ಬರೆವಳು' ಪದದ ಧಾತು ರೂಪ ಬರೆಯಿರಿ.`,`ಬರೆ`),
G(`'ಕುಡಿಯಿತು' ಪದದ ಧಾತು ರೂಪ ಬರೆಯಿರಿ.`,`ಕುಡಿ`),
S(`ಸ್ವಾತಂತ್ರ್ಯ ಚಳುವಳಿಯ ಬಗ್ಗೆ ಕವಿ ಏನು ಹೇಳಿದ್ದಾರೆ?`,`ಭಾರತ ಸ್ವಾತಂತ್ರ್ಯ ಚಳುವಳಿ ದೇಶದಲ್ಲಿ ಗಾಂಧೀ ತತ್ವದಲ್ಲಿ ಬೆಳೆಯಿತು; ಸ್ವದೇಶಿ ಚಳುವಳಿ, ಅಸಹಕಾರಗಳು ಹಿರಿಯರ ಮಾರ್ಗದಲ್ಲಿ ಚಿಗುರಿದವು; 1947 ಆಗಸ್ಟ್ 14ರ ಮಧ್ಯರಾತ್ರಿಯಲ್ಲಿ ಸ್ವತಂತ್ರ ಭಾರತದ ಬಾವುಟ ಹಾರಿತು ಎಂದಿದ್ದಾರೆ.`),
S(`ಕನ್ನಡದ ಬಗ್ಗೆ ಕವಿಯ ಕಳಕಳಿ ಏನು?`,`ಈ ಕನ್ನಡ ನೆಲದಲ್ಲಿ ಕನ್ನಡ ಗೆಲ್ಲಲಿ, ಬಾಳಲಿ; ಕನ್ನಡ ಕಲಿಯಿರಿ, ಕನ್ನಡವನ್ನು ಪೋಷಿಸಿ ಎಂದು ಕವಿ ಕರೆ ನೀಡುತ್ತಾರೆ.`),
S(`ಧಾತು ಎಂದರೇನು? ಒಂದು ಉದಾಹರಣೆ ಕೊಡಿ.`,`ಕ್ರಿಯಾಪದದ ಮೂಲ ರೂಪವೇ ಧಾತು (ಕ್ರಿಯಾಪ್ರಕೃತಿ). ಉದಾ: ತಿನ್ನುತ್ತಾನೆ, ತಿಂದರು ಪದಗಳ ಧಾತು – ತಿನ್ನು.`),
L(`'ಭುವನೇಶ್ವರಿ' ಪದ್ಯದಲ್ಲಿ ವರ್ಣಿತವಾದ ಕನ್ನಡ ನಾಡಿನ ಇತಿಹಾಸವನ್ನು ನಿಮ್ಮ ಮಾತುಗಳಲ್ಲಿ ಬರೆಯಿರಿ.`,`ಕದಂಬರ ಮಯೂರ ವರ್ಮ ಪಲ್ಲವರನ್ನು ಗೆದ್ದು ವನವಾಸಿಯಲ್ಲಿ ಮೆರೆದನು. ಬಾದಾಮಿಯಲ್ಲಿ ಚಾಲುಕ್ಯರು ಆಳ್ವಿಕೆ ನಡೆಸಿದರು. ಗಂಗರು, ರಾಷ್ಟ್ರಕೂಟರು, ಹೊಯ್ಸಳರು ನಾಡಿನ ಹಿರಿಮೆ ಹೆಚ್ಚಿಸಿದರು. ಹೊಯ್ಸಳರ ಪತನದ ನಂತರ ವಿಜಯನಗರ ಸಾಮ್ರಾಜ್ಯ ಬೆಳೆದು ಲೋಕವೇ ಬೆರಗಾಗುವ ಸಂಪತ್ತು ಮೆರೆಯಿತು. ಕಿತ್ತೂರು ಚೆನ್ನಮ್ಮ ಆಂಗ್ಲರನ್ನು ಎದುರಿಸಿ ಗೆದ್ದಳು. ಮೈಸೂರಿನ ಹುಲಿ ಟಿಪ್ಪು ಬ್ರಿಟಿಷರ ವಿರುದ್ಧ ಹೋರಾಡಿದನು. ಸ್ವಾತಂತ್ರ್ಯ ಚಳುವಳಿಯ ನಂತರ ದೇಶಕ್ಕೆ ಸ್ವಾತಂತ್ರ್ಯ ಬಂತು; 1956ರಲ್ಲಿ ವಿಶಾಲ ಮೈಸೂರು ಉದಯವಾಗಿ ಕರ್ನಾಟಕವಾಯಿತು.`),
L(`ಕನ್ನಡ ನಾಡು–ನುಡಿಯನ್ನು ಉಳಿಸಲು ನಾವು ಏನು ಮಾಡಬೇಕು? ವಿವರಿಸಿ.`,`ನಾವು ಕನ್ನಡ ಕಲಿಯಬೇಕು, ಮಾತನಾಡಬೇಕು, ಬರೆಯಬೇಕು. ಕನ್ನಡ ಪುಸ್ತಕಗಳನ್ನು ಓದಿ, ಕನ್ನಡ ಗೀತೆಗಳನ್ನು ಹಾಡಬೇಕು. ಕನ್ನಡ ಸಂಸ್ಕೃತಿ, ಇತಿಹಾಸ, ಹಬ್ಬಗಳನ್ನು ಗೌರವಿಸಬೇಕು. ಕನ್ನಡಕ್ಕೆ ಹಿರಿಯರು ಸಲ್ಲಿಸಿದ ಸೇವೆಯನ್ನು ತಿಳಿದು ನಾಡು–ನುಡಿಗೆ ಗೌರವ ಸಲ್ಲಿಸುವುದು ನಮ್ಮ ಮೊದಲ ಕರ್ತವ್ಯ.`)
]});

LS5.push({n:9,t:`ನನ್ನ ರಟ್ಟೆಯ ಬಲ (ಪೂರಕ ಪದ್ಯ)`,au:`ಬುದ್ದಣ್ಣ ಹಿಂಗಮಿರೆ`,pg:49,
words:`(ಪಠ್ಯಪುಸ್ತಕದಲ್ಲಿ ಪದಗಳ ಅರ್ಥ ನೀಡಿಲ್ಲ. ಶಿಕ್ಷಕರ ಅನುಕೂಲಕ್ಕಾಗಿ ಸೂಚಿತ ಅರ್ಥಗಳು:) ರಟ್ಟೆ – ತೋಳು, ಬಾಹು; ಹಂಬಲ – ಆಸೆ; ಸತತ – ನಿರಂತರ; ಲೆಕ್ಕಿಸದೆ – ಗಣನೆಗೆ ತೆಗೆದುಕೊಳ್ಳದೆ; ಛಲ – ಹಟ; ಸಿರಿ – ಸಂಪತ್ತು; ಪ್ರಾಮಾಣಿಕತೆ – ಸತ್ಯನಿಷ್ಠೆ; ಬಾನು – ಆಕಾಶ`,
notes:`ಪೂರಕ ಪಾಠ. ಕೃತಿಕಾರರ ಪರಿಚಯ: ಡಾ. ಬುದ್ದಣ್ಣ ಹಿಂಗಮಿರೆ ಅವರು 1933ರಲ್ಲಿ ಬೆಳಗಾವಿ ಜಿಲ್ಲೆಯ ರಾಜಾಪೂರದ ಆರಗದಲ್ಲಿ ಜನಿಸಿದರು. ಇವರು ಅಧ್ಯಾಪಕರಾಗಿ, ರಶಿಯನ್ ಭಾಷೆಯ ಸಂದರ್ಶಕ ಪ್ರಾಧ್ಯಾಪಕರಾಗಿ ಸೇವೆ ಸಲ್ಲಿಸಿದ್ದಾರೆ. ಉದಯರಾಗ, ಗುಬ್ಬಿಯ ಹಾಡು, ಹುಲ್ಲುಗೆಜ್ಜೆ, ಶಬ್ದ ರಕ್ತ ಮತ್ತು ಮಾಂಸ, ಹದ್ದುಗಳ ಹಾಡು ಮೊದಲಾದ ಕೃತಿಗಳನ್ನು ರಚಿಸಿದ್ದಾರೆ. ಇವರಿಗೆ ಸೋವಿಯತ್ ಲ್ಯಾಂಡ್ ನೆಹರು ಪ್ರಶಸ್ತಿ, ಕರ್ನಾಟಕ ಸಾಹಿತ್ಯ ಅಕಾಡೆಮಿ ಬಹುಮಾನ, ಸಾಹಿತ್ಯ ಅಕಾಡೆಮಿ ಗೌರವ ಪ್ರಶಸ್ತಿಗಳು ಲಭಿಸಿವೆ. ಪದ್ಯದ ಭಾವ: ದುಡಿಮೆಯೊಂದೇ ರೈತನ ಹಂಬಲ; ತನ್ನ ದುಡಿಮೆಗೆ ನೆಲ–ಜಲ–ಬಾನು ತಕ್ಕ ಫಲ ನೀಡಲಿ ಎಂಬುದು ಅವನ ಆಶಯ.`,
ab:[
[`ಅ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ`,[
[`ರೈತನ ಹಂಬಲ ಯಾವುದು?`,`ನಿರಂತರವಾಗಿ ದುಡಿಯುವುದೇ ರೈತನ ಹಂಬಲ.`],
[`ರೈತನ ನಿರಂತರ ಛಲ ಯಾವುದು?`,`ದುಡಿಯುವುದೊಂದೇ ರೈತನ ನಿರಂತರ ಛಲ.`],
[`ರೈತನು ಯಾವುದಕ್ಕೆ ತಕ್ಕಫಲ ನೀಡಲೆಂದು ಆಶಿಸುತ್ತಾನೆ?`,`ತನ್ನ ಪ್ರಾಮಾಣಿಕತೆಗೆ ತಕ್ಕಂತೆ ನೆಲ–ಜಲ–ಬಾನು ಫಲ ನೀಡಲಿ ಎಂದು ಆಶಿಸುತ್ತಾನೆ.`],
[`ನಾಡನೆಲ ಏನಾಗಲೆಂದು ರೈತ ಹಂಬಲಿಸುತ್ತಾನೆ?`,`ತಾನು ದುಡಿಯುವ ನಾಡ ನೆಲ ಹಿರಿದಾಗಲಿ ಎಂದು ಹಂಬಲಿಸುತ್ತಾನೆ.`],
[`ರೈತನು ಯಾವುದು ಸಿರಿಯಾಗಲಿ ಎನ್ನುತ್ತಾನೆ?`,`ಮಣ್ಣಿನ ಕಣ ಕಣವೂ ತನ್ನ ಸಿರಿಯಾಗಲಿ ಎನ್ನುತ್ತಾನೆ.`]]]
],
qb:[
M(`'ನನ್ನ ರಟ್ಟೆಯ ಬಲ' ಪದ್ಯದ ಕವಿ:`,[`ಬುದ್ದಣ್ಣ ಹಿಂಗಮಿರೆ`,`ಬೇಂದ್ರೆ`,`ಕಂಬಾರ`,`ಕುವೆಂಪು`],0),
M(`ಬುದ್ದಣ್ಣ ಹಿಂಗಮಿರೆ ಅವರ ಕೃತಿ:`,[`ಹುಲ್ಲುಗೆಜ್ಜೆ`,`ಚಕೋರಿ`,`ಗರಿ`,`ಜಲಪಾತ`],0),
M(`ಈ ಪದ್ಯದಲ್ಲಿ 'ರಟ್ಟೆ' ಎಂದರೆ:`,[`ತೋಳು`,`ಕಾಲು`,`ತಲೆ`,`ಕಣ್ಣು`],0),
M(`ರೈತನ ಹಂಬಲ:`,[`ದುಡಿಯುವುದು`,`ಮಲಗುವುದು`,`ಆಡುವುದು`,`ಓದುವುದು`],0),
M(`ಬುದ್ದಣ್ಣ ಹಿಂಗಮಿರೆ ಅವರು ಸಂದರ್ಶಕ ಪ್ರಾಧ್ಯಾಪಕರಾಗಿದ್ದ ಭಾಷೆ:`,[`ರಶಿಯನ್`,`ಜರ್ಮನ್`,`ಫ್ರೆಂಚ್`,`ಚೈನೀಸ್`],0),
M(`ರೈತನು ಹೇಗೆ ದುಡಿಯುತ್ತಾನೆ ಎಂದು ಪದ್ಯ ಹೇಳುತ್ತದೆ?`,[`ದುಃಖವನ್ನು ಲೆಕ್ಕಿಸದೆ`,`ಸೋಮಾರಿತನದಿಂದ`,`ಕೋಪದಿಂದ`,`ನಿದ್ರೆಯಲ್ಲಿ`],0),
O(`ಬುದ್ದಣ್ಣ ಹಿಂಗಮಿರೆ ಜನಿಸಿದ ವರ್ಷ ಯಾವುದು?`,`1933`),
O(`ರೈತನ ನಿರಂತರ ಛಲ ಯಾವುದು?`,`ದುಡಿಯುವುದೊಂದೇ.`),
O(`ರೈತನ ದೇಹದ ಯಾವ ಭಾಗ ಎಲುಬು, ಕಬ್ಬಿಣದಂತೆ ಗಟ್ಟಿಯಾಗಲಿ ಎಂದು ಬಯಸುತ್ತಾನೆ?`,`ರಟ್ಟೆ (ದೇಹ) ಗಟ್ಟಿಯಾಗಲಿ ಎಂದು.`,'m'),
O(`ರೈತನ ಪ್ರಾಮಾಣಿಕತೆಗೆ ತಕ್ಕ ಫಲ ಯಾರು ನೀಡಲೆಂದು ಆಶಿಸುತ್ತಾನೆ?`,`ನೆಲ–ಜಲ–ಬಾನು.`),
O(`ಪದ್ಯದ ಹೆಸರೇನು?`,`ನನ್ನ ರಟ್ಟೆಯ ಬಲ`,'e'),
G(`'ಸತತ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ನಿರಂತರ`),
G(`'ಹಂಬಲ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಆಸೆ`),
G(`'ಸಿರಿ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಸಂಪತ್ತು`),
G(`'ಬಾನು' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಆಕಾಶ`,'e'),
G(`'ದುಡಿ' ಧಾತುವಿನ ವರ್ತಮಾನಕಾಲ ರೂಪ (ಅವನು) ಬರೆಯಿರಿ.`,`ದುಡಿಯುತ್ತಾನೆ`),
S(`ರೈತನು ತನ್ನ ದುಡಿಮೆಯ ಬಗ್ಗೆ ಏನೆಂದು ಹೇಳುತ್ತಾನೆ?`,`ದುಃಖವನ್ನು ಲೆಕ್ಕಿಸದೆ ನಿರಂತರವಾಗಿ ದುಡಿಯುವುದೇ ತನ್ನ ಹಂಬಲ ಎನ್ನುತ್ತಾನೆ. ಹಗಲು ಇನ್ನಷ್ಟು ಉದ್ದವಾಗಲಿ, ಮಣ್ಣಿನಲ್ಲಿ, ಗದ್ದೆಯಲ್ಲಿ ಬೆವರು ಹರಿಸುವೆನು ಎನ್ನುತ್ತಾನೆ.`),
S(`ರೈತನು ನೆಲ–ಜಲ–ಬಾನುಗಳಿಂದ ಏನನ್ನು ನಿರೀಕ್ಷಿಸುತ್ತಾನೆ?`,`ತನ್ನ ಪ್ರಾಮಾಣಿಕ ದುಡಿಮೆಗೆ ತಕ್ಕಂತೆ ಫಲ ನೀಡಲೆಂದು ನೆಲ, ಜಲ, ಬಾನುಗಳಿಂದ ನಿರೀಕ್ಷಿಸುತ್ತಾನೆ.`),
S(`'ನನ್ನ ರಟ್ಟೆಯ ಬಲ ಹಿಗ್ಗುತಿರಲಿ' ಎಂದರೇನು?`,`ತನ್ನ ದುಡಿಯುವ ತೋಳಿನ ಶಕ್ತಿ ಹೆಚ್ಚುತ್ತಲೇ ಇರಲಿ ಎಂದು ರೈತ ಹಾರೈಸುವುದು ಎಂಬ ಅರ್ಥ.`),
L(`'ನನ್ನ ರಟ್ಟೆಯ ಬಲ' ಪದ್ಯದ ಆಶಯವನ್ನು ನಿಮ್ಮ ಮಾತುಗಳಲ್ಲಿ ಬರೆಯಿರಿ.`,`ಈ ಪದ್ಯದಲ್ಲಿ ರೈತನ ದುಡಿಮೆಯ ಮಹತ್ವವಿದೆ. ದುಃಖವನ್ನು ಲೆಕ್ಕಿಸದೆ ನಿರಂತರ ದುಡಿಯುವುದೇ ಅವನ ಹಂಬಲ; ಬೆವರು ಹರಿಸಿ ನಾಡನೆಲವನ್ನು ಹಿರಿದಾಗಿಸಲು ಬಯಸುತ್ತಾನೆ. ದುಡಿಮೆ ಒಂದೇ ಅವನ ಛಲ, ಮಣ್ಣಿನ ಕಣ ಕಣವೂ ಅವನ ಸಿರಿ. ತನ್ನ ಪ್ರಾಮಾಣಿಕತೆಗೆ ತಕ್ಕ ಫಲ ನೆಲ–ಜಲ–ಬಾನು ನೀಡಲಿ, ತನ್ನ ರಟ್ಟೆಯ ಬಲ ಹಿಗ್ಗುತ್ತಿರಲಿ ಎಂದು ಆಶಿಸುತ್ತಾನೆ.`),
L(`ರೈತನ ಜೀವನ ನಮಗೆ ಯಾವ ಪಾಠ ಕಲಿಸುತ್ತದೆ?`,`ರೈತ ಬಿಸಿಲು ಮಳೆ ಲೆಕ್ಕಿಸದೆ ದುಡಿಯುತ್ತಾನೆ. ಅವನ ಶ್ರಮದಿಂದಲೇ ನಮಗೆ ಅನ್ನ ಸಿಗುತ್ತದೆ. ಅವನು ನಮಗೆ ಪರಿಶ್ರಮ, ಪ್ರಾಮಾಣಿಕತೆ, ಛಲ ಹಾಗೂ ಸಂತೃಪ್ತಿಯ ಪಾಠ ಕಲಿಸುತ್ತಾನೆ. ಆದ್ದರಿಂದ ನಾವು ರೈತರನ್ನು ಗೌರವಿಸಬೇಕು ಮತ್ತು ದುಡಿಮೆಯನ್ನು ಪ್ರೀತಿಸಬೇಕು.`)
]});

LS5.push({n:10,t:`ಮೆಚ್ಚಿನ ಗೊಂಬೆ (ಪೂರಕ ಗದ್ಯ)`,au:`ಸಮಿತಿ ರಚನೆ`,pg:51,
words:`(ಪಠ್ಯಪುಸ್ತಕದಲ್ಲಿ ಪದಗಳ ಅರ್ಥ ನೀಡಿಲ್ಲ. ಶಿಕ್ಷಕರ ಅನುಕೂಲಕ್ಕಾಗಿ ಸೂಚಿತ ಅರ್ಥಗಳು:) ಆಸ್ತಿ – ಸಂಪತ್ತು; ನಲಿ – ಸಂತೋಷಪಡು; ಹಠ – ಹಟ, ಮೊಂಡುತನ; ಜಗ್ಗು – ಹಿಂಜರಿ; ವೈವಿಧ್ಯ – ಹಲವು ಬಗೆ; ಪೋಷಣೆ – ಕಾಪಾಡುವುದು, ಸಾಕುವುದು; ಅಲಂಕಾರ – ಸಿಂಗಾರ; ಸಮಾಧಾನ – ಸಮಾಧಾನಪಡಿಸುವುದು`,
notes:`ಪೂರಕ ಪಾಠ (ಗದ್ಯ). ವಿಷಯ: ಮಕ್ಕಳಿಗೆ ಗೊಂಬೆಗಳೆಂದರೆ ಬಹಳ ಪ್ರೀತಿ; ಗೊಂಬೆಗಳು ಮಕ್ಕಳ ಕೈಯಲ್ಲಿ ಮಕ್ಕಳಾಗಿ ಬಿಡುತ್ತವೆ. ಗೊಂಬೆಗಳನ್ನು ಮರ, ಮಣ್ಣು, ಪ್ಲಾಸ್ಟಿಕ್, ರಬ್ಬರ್, ಪಿಂಗಾಣಿ, ಬಟ್ಟೆ, ಹತ್ತಿ, ಬಿದಿರು, ಕಾಗದಗಳಿಂದ ತಯಾರಿಸುತ್ತಾರೆ. ಜಾತ್ರೆ, ಉತ್ಸವಗಳಲ್ಲಿ ಗೊಂಬೆಗಳ ಆಕರ್ಷಣೆ; ನಾಡಹಬ್ಬ ದಸರೆಯಲ್ಲಿ ಮನೆ–ಮನೆಗಳಲ್ಲಿ ಗೊಂಬೆಗಳ ಅಲಂಕಾರ; ಸ್ಪ್ರಿಂಗ್, ಕೀ, ಕೀಲು, ಯಂತ್ರ ಗೊಂಬೆಗಳು; ಗೊಂಬೆಗಳು ಮನುಷ್ಯನಿಗೆ ಅನೇಕ ರೀತಿಯಲ್ಲಿ ಜೀವನ ಪಾಠವನ್ನೂ ಹೇಳುತ್ತವೆ ಎಂಬುದು ಪಾಠದ ತಿರುಳು.`,
ab:[
[`ಅ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ`,[
[`ಗೊಂಬೆಗಳನ್ನು ಯಾವ ಯಾವ ವಸ್ತುಗಳಿಂದ ತಯಾರಿಸುತ್ತಾರೆ?`,`ಮರ, ಮಣ್ಣು, ಪ್ಲಾಸ್ಟಿಕ್, ರಬ್ಬರ್, ಪಿಂಗಾಣಿ, ಬಟ್ಟೆ, ಹತ್ತಿ, ಬಿದಿರು, ಕಾಗದ ಮುಂತಾದವುಗಳಿಂದ ತಯಾರಿಸುತ್ತಾರೆ.`],
[`ಗೊಂಬೆಗೆ ನೋವಾದರೆ ಮಕ್ಕಳು ಏನು ಮಾಡುತ್ತಾರೆ?`,`ಗೊಂಬೆಗೆ ನೋವಾಯಿತೆಂದು ಎತ್ತಿ ಮುದ್ದಾಡಿ ಸಮಾಧಾನ ಮಾಡುತ್ತಾರೆ.`],
[`ಅಳುವ ಗೊಂಬೆಗೆ ಮಕ್ಕಳು ಏನೆಂದು ಹಾಡಿ ಸಮಾಧಾನ ಮಾಡುತ್ತಾರೆ?`,`'ಅಳಬೇಡ, ಗೊಂಬವ್ವ' ಎಂದು ಹೇಳಿ, ಜರತಾರಿ ಲಂಗ ಕೊಡಿಸುತ್ತೇನೆ ಎಂದು ಹಾಡಿ ಸಮಾಧಾನ ಮಾಡುತ್ತಾರೆ.`],
[`ಯಾವ ಹಬ್ಬದಂದು ಮನೆಗಳಲ್ಲಿ ಗೊಂಬೆಗಳನ್ನು ಅಲಂಕರಿಸುತ್ತಾರೆ?`,`ನಾಡಹಬ್ಬ ದಸರೆಯಂದು ಮನೆ–ಮನೆಗಳಲ್ಲಿ ಗೊಂಬೆಗಳನ್ನು ಅಲಂಕರಿಸುತ್ತಾರೆ.`],
[`ಗೊಂಬೆಗಳು ಯಾವ ಯಾವ ರೂಪಗಳಲ್ಲಿ ಜನ್ಮತಾಳಿವೆ?`,`ಮನುಷ್ಯ, ಪ್ರಾಣಿ, ಪಕ್ಷಿ, ಕೀಟ – ಎಲ್ಲ ರೂಪಗಳಲ್ಲಿಯೂ ಗೊಂಬೆಗಳು ಜನ್ಮತಾಳಿವೆ.`]]],
[`ಆ. ಚಟುವಟಿಕೆ (ಮಾರ್ಗದರ್ಶನ)`,[
[`ನಿಮಗೆ ಇಷ್ಟವಾದ ಗೊಂಬೆಯ ಬಗ್ಗೆ ಐದು ವಾಕ್ಯಗಳನ್ನು ಬರೆಯಿರಿ.`,`ಮಾದರಿ ಉತ್ತರ: ನನ್ನ ಮೆಚ್ಚಿನ ಗೊಂಬೆ ಮರದ ಕುದುರೆ. ಅದು ಕೆಂಪು ಬಣ್ಣದ್ದು. ನಾನು ಅದರೊಂದಿಗೆ ಆಡುತ್ತೇನೆ. ಅದನ್ನು ನನ್ನ ಅಜ್ಜ ಕೊಡಿಸಿದರು. ಅದು ನನ್ನ ಗೆಳೆಯನಂತೆ. (ಮಕ್ಕಳು ತಮ್ಮದೇ ಗೊಂಬೆಯ ಬಗ್ಗೆ ಬರೆಯಲಿ.)`]]]
],
qb:[
M(`ಗೊಂಬೆಗಳನ್ನು ತಯಾರಿಸಲು ಬಳಸದ ವಸ್ತು ಯಾವುದು?`,[`ಮರ`,`ಮಣ್ಣು`,`ಬಟ್ಟೆ`,`ಕಬ್ಬಿಣದ ಕಂಬಿ ಮಾತ್ರ`],3,'m'),
M(`ಗೊಂಬೆಗಳಿಗೆ ಹೆಚ್ಚು ಪ್ರೀತಿ ತೋರಿಸುವವರು:`,[`ಮಕ್ಕಳು`,`ರಾಜರು`,`ರೈತರು`,`ಸೈನಿಕರು`],0),
M(`ಮನೆಗಳಲ್ಲಿ ಗೊಂಬೆಗಳನ್ನು ಅಲಂಕರಿಸುವ ಹಬ್ಬ:`,[`ದಸರಾ`,`ಯುಗಾದಿ`,`ದೀಪಾವಳಿ`,`ಸಂಕ್ರಾಂತಿ`],0),
M(`ಜೋಕರ್ ಗೊಂಬೆಗಳು ಏನು ಮಾಡುತ್ತವೆ?`,[`ಎಲ್ಲರನ್ನೂ ನಗಿಸುತ್ತವೆ`,`ಅಳುತ್ತವೆ`,`ಭಯಪಡಿಸುತ್ತವೆ`,`ಓದುತ್ತವೆ`],0),
M(`ಗೊಂಬೆಗಳು ಮನುಷ್ಯನಿಗೆ ಏನನ್ನು ಹೇಳುತ್ತವೆ?`,[`ಜೀವನ ಪಾಠ`,`ಕಥೆ ಮಾತ್ರ`,`ಗಣಿತ`,`ವಿಜ್ಞಾನ`],0),
M(`ಜಾತ್ರೆ–ಉತ್ಸವಗಳಲ್ಲಿ ಆಕರ್ಷಣೆ:`,[`ಗೊಂಬೆಗಳು`,`ಪುಸ್ತಕ`,`ಕಲ್ಲು`,`ಕಬ್ಬಿಣ`],0),
O(`ಮೆಚ್ಚಿನ ಗೊಂಬೆ ಪಾಠದ ಲೇಖಕರು ಯಾರು?`,`ಸಮಿತಿ ರಚನೆ.`),
O(`ಗೊಂಬೆಗೆ ಕೀಟಲೆ ಮಾಡಿದರೆ ಮಕ್ಕಳು ಏನು ಮಾಡುತ್ತಾರೆ?`,`ಸುಮ್ಮನಿರುವುದಿಲ್ಲ.`),
O(`ಕೈಜಾರಿದ ಗೊಂಬೆ ಕೆಳಕ್ಕೆ ಬಿದ್ದರೆ ಮಕ್ಕಳು ಏನು ಮಾಡುತ್ತಾರೆ?`,`ಅತ್ತೇ ಬಿಡುತ್ತಾರೆ.`),
O(`ಗೊಂಬೆಯ ಪೆನ್ಸಿಲ್, ಗೊಂಬೆಯ ಪೆನ್ನು – ಇವು ಏನನ್ನು ತೋರಿಸುತ್ತವೆ?`,`ವಿವಿಧ ವಸ್ತುಗಳಲ್ಲೂ ಗೊಂಬೆಯ ರೂಪ ಇರುತ್ತದೆ ಎಂಬುದನ್ನು.`,'m'),
O(`ಗೊಂಬೆಗಳು ಯಾರ ಹೊಗಳಿಕೆಗೂ ತೆಗಳಿಕೆಗೂ ಏನು?`,`ಜಗ್ಗುವುದಿಲ್ಲ.`,'m'),
G(`'ಗೊಂಬೆ' ಪದಕ್ಕೆ ಇನ್ನೊಂದು ಪದ ಬರೆಯಿರಿ.`,`ಬೊಂಬೆ`,'e'),
G(`'ಆಸ್ತಿ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ (ಸೂಚಿತ).`,`ಸಂಪತ್ತು`,'e'),
G(`'ವೈವಿಧ್ಯ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ (ಸೂಚಿತ).`,`ಹಲವು ಬಗೆ`),
G(`ಗೊಂಬೆಗಳನ್ನು ತಯಾರಿಸುವ ಯಾವುದಾದರೂ ಮೂರು ವಸ್ತುಗಳನ್ನು ಬರೆಯಿರಿ.`,`ಮರ, ಮಣ್ಣು, ಬಟ್ಟೆ`),
G(`'ಮುದ್ದಾಡು' ಪದದ ಧಾತು ಬರೆಯಿರಿ.`,`ಮುದ್ದಾಡು`),
G(`'ನಲಿಯುತ್ತಾರೆ' ಪದದ ಧಾತು ಬರೆಯಿರಿ.`,`ನಲಿ`),
S(`ಮಕ್ಕಳು ಗೊಂಬೆಗಳನ್ನು ಹೇಗೆ ನೋಡಿಕೊಳ್ಳುತ್ತಾರೆ?`,`ತಾಯಿ ತಮ್ಮನ್ನೆಲ್ಲ ಹೇಗೆ ಪೋಷಣೆ ಮಾಡುತ್ತಾಳೋ ಹಾಗೆಯೇ ಮಕ್ಕಳು ಗೊಂಬೆಗಳನ್ನು ನೋಡಿಕೊಳ್ಳುತ್ತಾರೆ. ಅವುಗಳಿಗೆ ತಿಂಡಿ ತಿನ್ನಿಸುವುದು, ಸ್ನಾನ ಮಾಡಿಸುವುದು, ಮಲಗಿಸಿ ಲಾಲಿ ಹಾಡುವುದು, ಬಟ್ಟೆ ತೊಡಿಸುವುದು, ಶೃಂಗಾರ ಮಾಡುವುದು – ಎಲ್ಲವನ್ನೂ ಪ್ರೀತಿಯಿಂದ ಮಾಡುತ್ತಾರೆ.`),
S(`ದಸರೆಯಲ್ಲಿ ಗೊಂಬೆಗಳನ್ನು ಹೇಗೆ ಅಲಂಕರಿಸುತ್ತಾರೆ?`,`ನಾಡಹಬ್ಬ ದಸರೆಯಲ್ಲಿ ಮನೆ–ಮನೆಗಳಲ್ಲಿ ನೂರಾರು ಗೊಂಬೆಗಳನ್ನು ಅಲಂಕರಿಸಿ ಒಟ್ಟಿಗೆ ನೋಡುವುದೇ ಒಂದು ಹಬ್ಬ. ಅವುಗಳ ಶೃಂಗಾರ, ಜೋಡಣೆ, ಅಲಂಕಾರ ಬಹಳ ಸುಂದರವಾಗಿರುತ್ತದೆ.`),
S(`ಗೊಂಬೆಗಳ ವಿವಿಧ ಬಗೆಗಳನ್ನು ಹೆಸರಿಸಿ.`,`ಸ್ಪ್ರಿಂಗ್ ಗೊಂಬೆಗಳು, ಕೀ ಗೊಂಬೆಗಳು, ಕೀಲು ಗೊಂಬೆಗಳು, ಯಂತ್ರ ಗೊಂಬೆಗಳು, ಸಣ್ಣ ದೊಡ್ಡ ವಿವಿಧ ರಂಗಿನ ಗೊಂಬೆಗಳು.`),
L(`'ಮೆಚ್ಚಿನ ಗೊಂಬೆ' ಪಾಠದ ಸಾರಾಂಶವನ್ನು ಬರೆಯಿರಿ.`,`ಗೊಂಬೆಯೆಂದರೆ ಮಕ್ಕಳಿಗೆ ಬಹಳ ಪ್ರೀತಿ. ಗೊಂಬೆಗಳು ಮಕ್ಕಳ ಕೈಯಲ್ಲಿ ಮಕ್ಕಳಾಗಿಬಿಡುತ್ತವೆ. ಹಠ ಮಾಡಿ ಅಳುವ ಮಗುವಿಗೆ ಗೊಂಬೆ ಕೊಟ್ಟರೆ ಸಾಕು. ಮಕ್ಕಳು ತಾಯಿಯಂತೆ ಗೊಂಬೆಗಳನ್ನು ಪೋಷಿಸುತ್ತಾರೆ. ಗೊಂಬೆಗಳನ್ನು ಮರ, ಮಣ್ಣು, ಪ್ಲಾಸ್ಟಿಕ್, ಬಟ್ಟೆ ಮುಂತಾದ ವಸ್ತುಗಳಿಂದ ತಯಾರಿಸುತ್ತಾರೆ. ಜಾತ್ರೆ, ದಸರೆಯಲ್ಲಿ ಗೊಂಬೆಗಳ ವಿಶೇಷ ಆಕರ್ಷಣೆ ಇರುತ್ತದೆ. ಗೊಂಬೆಗಳು ಮನುಷ್ಯನಿಗೆ ಜೀವನ ಪಾಠವನ್ನೂ ಹೇಳುತ್ತವೆ – ಯಾರ ಹೊಗಳಿಕೆಗೂ ತೆಗಳಿಕೆಗೂ ಜಗ್ಗುವುದಿಲ್ಲ.`),
L(`ಗೊಂಬೆಗಳು ಜೀವನ ಪಾಠವನ್ನು ಹೇಗೆ ಹೇಳುತ್ತವೆ ಎಂಬುದನ್ನು ವಿವರಿಸಿ.`,`ಗೊಂಬೆಯನ್ನು ಆಡಿಸಿದರೂ, ಬೀಳಿಸಿದರೂ ಅದು ಉರುಳಿಹೋಗುವುದಿಲ್ಲ; ಏನೇ ಬಂದರೂ ತಲೆಬಾಗುವುದಿಲ್ಲ. ಅದರಂತೆ ನಾವು ಕಷ್ಟಗಳು ಬಂದರೂ ಧೈರ್ಯ ಕಳೆದುಕೊಳ್ಳಬಾರದು, ಯಾರ ಹೊಗಳಿಕೆ–ತೆಗಳಿಕೆಗೂ ಜಗ್ಗದೆ ಮುನ್ನಡೆಯಬೇಕು ಎಂಬ ಪಾಠವನ್ನು ಗೊಂಬೆಗಳು ಹೇಳುತ್ತವೆ.`)
]});

LS5.push({n:11,t:`ಹಿನ್ನುಡಿ (ಪೂರಕ ಪದ್ಯ)`,au:`ದಿನಕರ ದೇಸಾಯಿ`,pg:53,
words:`(ಪಠ್ಯಪುಸ್ತಕದಲ್ಲಿ ಪದಗಳ ಅರ್ಥ ನೀಡಿಲ್ಲ. ಶಿಕ್ಷಕರ ಅನುಕೂಲಕ್ಕಾಗಿ ಸೂಚಿತ ಅರ್ಥಗಳು:) ತನನ – ಸಂಗೀತದ ಸ್ವರ; ಜಂಬ – ಗರ್ವ; ಕೃಪೆ – ದಯೆ; ಇಂಚರ – ಇಂಪಾದ ದನಿ; ತೆರೆ – ಅಲೆ; ಪವನ – ಗಾಳಿ; ಪೊಡವಿ – ಭೂಮಿ; ನಾಲ್ದೆಸೆ – ನಾಲ್ಕು ದಿಕ್ಕು; ಬಿಂಬ – ಪ್ರತಿಬಿಂಬ`,
notes:`ಪೂರಕ ಪಾಠ. ಕೃತಿಕಾರರ ಪರಿಚಯ: ದಿನಕರ ದೇಸಾಯಿ (1909–1982) ಕನ್ನಡದ ಪ್ರಮುಖ ಸಾಹಿತಿಗಳಲ್ಲೊಬ್ಬರು; 'ಚುಟುಕ ಬ್ರಹ್ಮ' ಎಂದೇ ಖ್ಯಾತರು. ಉತ್ತರ ಕನ್ನಡ ಜಿಲ್ಲೆಯ ಅಂಕೋಲಾ ತಾಲ್ಲೂಕಿನ ಅಲಗೇರಿ ಎಂಬ ಪುಟ್ಟ ಹಳ್ಳಿಯಲ್ಲಿ ಜನಿಸಿದರು. ಪ್ರಾಥಮಿಕ, ಪ್ರೌಢಶಿಕ್ಷಣಗಳನ್ನು ಹಳ್ಳಿಯಲ್ಲೇ ಪೂರೈಸಿ ಮೆಟ್ರಿಕ್ ಓದಲು ಧಾರವಾಡಕ್ಕೆ ಹೋದಾಗ ಬಿಎಂಶ್ರೀ ಅವರ 'ಇಂಗ್ಲಿಷ್ ಗೀತಗಳು' ಕವನಸಂಕಲನವನ್ನು ಓದಿ ಬೆರಗಾದರು. ಅನಂತರ ಕಾವ್ಯಕ್ಷೇತ್ರಕ್ಕೆ ಪ್ರವೇಶಿಸಿದರು; ಕವಿತೆಗಳು ನೂರಾರು, ಚುಟುಕಗಳು ಸಾವಿರಾರು. ಶಿಕ್ಷಣ ಕ್ಷೇತ್ರದಲ್ಲಿ ಮಹತ್ತರ ಸಾಧನೆ ಮಾಡಿದರು; ಶಿಕ್ಷಣ ಸಂಸ್ಥೆಗಳನ್ನು ಸ್ಥಾಪಿಸಿದರು; ಸಂಸದರಾಗಿಯೂ ಚುನಾಯಿತರಾಗಿ ರಾಜಕಾರಣದಲ್ಲಿ ತಮ್ಮದೇ ಛಾಪನ್ನು ಮೂಡಿಸಿದರು.`,
ab:[
[`ಅ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ`,[
[`ಯಾವ ಜಂಬ ತನಗೆ ಬೇಡ ಎಂದು ಕವಿ ಹೇಳುತ್ತಾರೆ?`,`'ನನ್ನದು' ಎಂಬ ಜಂಬ (ಅಹಂಕಾರ) ತನಗೆ ಬೇಡ ಎಂದು ಕವಿ ಹೇಳುತ್ತಾರೆ.`],
[`"ನಿನ್ನ ಸೇವೆಗೆ ನೀನೆ ತಂದೆ ಹೂವ" – ಈ ಸಾಲಿನ ಅರ್ಥವನ್ನು ವಿವರಿಸಿ.`,`ದೇವರ ಕೃಪೆಯಿಂದಲೇ ಗಿಡ ಹೂ ಬಿಡುತ್ತದೆ; ಆ ಹೂವನ್ನು ನಿನ್ನ ಸೇವೆಗೆ ನೀನೇ (ದೇವರೇ) ತಂದುಕೊಟ್ಟೆ ಎಂದರ್ಥ. ಅಂದರೆ ಕವಿ ಮಾಡುವ ಕಾವ್ಯ–ಗಾನದ ಸೇವೆಗೆ ಬೇಕಾದ ಸ್ಫೂರ್ತಿಯನ್ನು ಕೊಟ್ಟವನು ದೇವರೇ.`],
[`ಪ್ರಕೃತಿಯ ಯಾವ್ಯಾವ ಸಂಗತಿಗಳು ದೇವರ ಸಂಗೀತವಾಗಿವೆ?`,`ಹಕ್ಕಿಗಳ ಇಂಚರ, ಚುಕ್ಕಿ (ನಕ್ಷತ್ರ) ಮಿಂಚುವ ತೆರ ಮತ್ತು ಉಕ್ಕಿ ಮೊರೆಯುವ ಸಮುದ್ರದ ತೆರೆ – ಇವು ದೇವರ ಸಂಗೀತವಾಗಿವೆ.`],
[`ಯಾವುದು ಕನ್ನಡಿಯ ಬಿಂಬ?`,`'ನನ್ನದೆಂಬುದು' (ತನ್ನದೆಂಬುದು) ಕನ್ನಡಿಯ ಬಿಂಬ.`],
[`"ಹಿನ್ನುಡಿ" ಕವಿತೆಯ ಒಟ್ಟು ಭಾವವೇನು ಎಂಬುದನ್ನು ವಿವರಿಸಿ.`,`ತನ್ನ ಕಾವ್ಯ, ಗಾನ, ನುಡಿ ಎಲ್ಲವೂ ದೇವರ ಕೃಪೆಯಿಂದಲೇ ಬಂದದ್ದು; ಅವನೇ ಪ್ರೇರಣೆ ಮತ್ತು ಹಿನ್ನುಡಿ (ಹಿಂದಿನ ಶಕ್ತಿ). ಹಾಗಾಗಿ 'ನನ್ನದು' ಎಂಬ ಅಹಂಕಾರ ಬೇಡ; ದೇವರ ಭಾವವೇ ನನ್ನ ನುಡಿ–ಗುಡಿಯ ಕಂಬ ಎಂಬುದು ಕವಿತೆಯ ಭಾವ.`]]]
],
qb:[
M(`'ಹಿನ್ನುಡಿ' ಕವಿತೆಯ ಕವಿ:`,[`ದಿನಕರ ದೇಸಾಯಿ`,`ಬೇಂದ್ರೆ`,`ಕುವೆಂಪು`,`ಕಂಬಾರ`],0),
M(`ದಿನಕರ ದೇಸಾಯಿ ಅವರು ಖ್ಯಾತರಾದ ಹೆಸರು:`,[`ಚುಟುಕ ಬ್ರಹ್ಮ`,`ವರಕವಿ`,`ರಾಷ್ಟ್ರಕವಿ`,`ಸತ್ಯವಿಠಲ`],0),
M(`ದಿನಕರ ದೇಸಾಯಿಯವರ ಊರು:`,[`ಅಲಗೇರಿ`,`ಧಾರವಾಡ`,`ಮೈಸೂರು`,`ಬೆಳಗಾವಿ`],0),
M(`ದಿನಕರರು ಓದಿ ಬೆರಗಾದ ಕೃತಿ:`,[`ಇಂಗ್ಲಿಷ್ ಗೀತಗಳು`,`ನಾಕುತಂತಿ`,`ಗರಿ`,`ಚಕೋರಿ`],0),
M(`ಕವಿ ದೇವರಿಗೆ ಬೇಡವೆಂದ ಜಂಬ:`,[`ನನ್ನದೆಂಬ ಜಂಬ`,`ದೇಶದ ಜಂಬ`,`ಭಾಷೆಯ ಜಂಬ`,`ಊರಿನ ಜಂಬ`],0),
M(`ಪ್ರಕೃತಿಯಲ್ಲಿ ದೇವರ ಸಂಗೀತ ಯಾವುದು?`,[`ಹಕ್ಕಿಗಳ ಇಂಚರ`,`ಯಂತ್ರದ ಶಬ್ದ`,`ವಾಹನದ ಹಾರ್ನ್`,`ಗದ್ದಲ`],0),
O(`ದಿನಕರ ದೇಸಾಯಿ ಯಾವ ಜಿಲ್ಲೆಯಲ್ಲಿ ಜನಿಸಿದರು?`,`ಉತ್ತರ ಕನ್ನಡ ಜಿಲ್ಲೆ (ಅಂಕೋಲಾ ತಾಲ್ಲೂಕು).`),
O(`ದಿನಕರ ದೇಸಾಯಿ ಅವರ ಜೀವಿತಾವಧಿ ಯಾವುದು?`,`1909–1982`),
O(`ದಿನಕರರು ಯಾವ ಕ್ಷೇತ್ರಗಳಲ್ಲಿ ಮಹತ್ತರ ಸಾಧನೆ ಮಾಡಿದರು?`,`ಶಿಕ್ಷಣ ಕ್ಷೇತ್ರದಲ್ಲಿ (ಶಿಕ್ಷಣ ಸಂಸ್ಥೆಗಳ ಸ್ಥಾಪನೆ) ಮತ್ತು ರಾಜಕಾರಣದಲ್ಲಿ.`,'m'),
O(`ದಿನಕರರು ಬರೆದ ಸಣ್ಣ ಪದ್ಯಗಳನ್ನು ಏನೆಂದು ಕರೆಯುತ್ತಾರೆ?`,`ಚುಟುಕಗಳು.`),
O(`ಕನ್ನಡಿಯ ಬಿಂಬ ಎಂದರೆ ಯಾವುದು?`,`ನನ್ನದೆಂಬುದು.`,'m'),
G(`'ಜಂಬ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ (ಸೂಚಿತ).`,`ಗರ್ವ`,'e'),
G(`'ಕೃಪೆ' ಪದದ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ದಯೆ`,'e'),
G(`'ಪವನ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ (ಸೂಚಿತ).`,`ಗಾಳಿ`,'e'),
G(`'ಪೊಡವಿ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ (ಸೂಚಿತ).`,`ಭೂಮಿ`),
G(`'ಇಂಚರ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ (ಸೂಚಿತ).`,`ಇಂಪಾದ ದನಿ`),
G(`'ತೆರೆ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ (ಸೂಚಿತ).`,`ಅಲೆ`),
S(`ಕವಿ ದೇವರಲ್ಲಿ ಏನು ಬೇಡಿಕೊಳ್ಳುತ್ತಾರೆ?`,`'ನನ್ನದು' ಎಂಬ ಜಂಬ ಸಾಕು ದೇವಾ ಎಂದು ಬೇಡಿಕೊಳ್ಳುತ್ತಾರೆ; ತಮ್ಮ ಭಾವದ ಕವನ, ಗಾನ ಎಲ್ಲವೂ ದೇವರ ಕೃಪೆಯಿಂದಲೇ ಬಂದವು ಎಂದು ಹೇಳುತ್ತಾರೆ.`),
S(`ದಿನಕರ ದೇಸಾಯಿ ಅವರ ಚುಟುಕದ ಆಶಯವೇನು?`,`ಷಷ್ಠ್ಯಬ್ದಿ (ಹುಟ್ಟುಹಬ್ಬ ಆಚರಣೆ) ಬೇಡ, ಬರವಣಿಗೆ ಸಾಕು; ಮೆರವಣಿಗೆ ಬೇಡ; ಮೂಲೆಯಲ್ಲಿ ಕುಳಿತು ಒಂದು ಪದ್ಯ ಬರೆದು ತಾಯಿನುಡಿಗೆ ನೈವೇದ್ಯದಂತೆ ಅರ್ಪಿಸುವುದೇ ತಮ್ಮ ಧ್ಯೇಯ ಎನ್ನುವುದು.`),
S(`ದೇವರ ಸಂಗೀತ ಯಾವುದು ಎಂಬುದನ್ನು ಬರೆಯಿರಿ.`,`ಹಕ್ಕಿಗಳ ಇಂಚರ, ನಕ್ಷತ್ರಗಳು ಮಿಂಚುವ ರೀತಿ, ಸಮುದ್ರದ ಅಲೆಗಳು ಉಕ್ಕಿ ಮೊರೆಯುವುದು – ಇವು ಪ್ರಕೃತಿಯಲ್ಲಿನ ದೇವರ ಸಂಗೀತ.`),

const DDREG={};
const CHV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
function dd(id,opts,val,fn){DDREG[id]={opts,fn};const c=opts.find(o=>!o.g&&String(o.v)===String(val));
 return `<div class="cs"><button class="csb" onclick="toggleDD('${id}',event)"><span>${esc(c?c.l:'')}</span>${CHV}</button>${ST.dd===id?`<div class="csl">${opts.map((o,i)=>o.g?`<div class="csg">${esc(o.g)}</div>`:`<button class="cso ${String(o.v)===String(val)?'on':''}" onclick="pickDD('${id}',${i},event)">${esc(o.l)}</button>`).join('')}</div>`:''}</div>`}
function toggleDD(id,e){e.stopPropagation();ST.dd=ST.dd===id?null:id;render()}
function pickDD(id,i,e){e.stopPropagation();const o=DDREG[id].opts[i];ST.dd=null;DDREG[id].fn(o.v);render()}
document.addEventListener('click',e=>{if(ST.dd&&!e.target.closest('.cs')){ST.dd=null;render()}});
/* ===== ಮುಖಪುಟ ===== */
function vHome(){return `<div class="fade fill"><div class="h2">ತರಗತಿ ಆರಿಸಿ</div><div class="sub">ನಿಮ್ಮ ತರಗತಿಯನ್ನು ಆಯ್ಕೆ ಮಾಡಿ ಕಲಿಕಾ ಸಂಪನ್ಮೂಲಗಳನ್ನು ತೆರೆಯಿರಿ</div><div class="hgrid">${CLASSES.map(c=>{const on=hasClass(c);return `<button class="tile glass neu ${on?'':'off'}" onclick="openClass(${c})"><div class="n">${c}</div><div class="l">${ORD[c-1]} ತರಗತಿ</div><div class="e">${ENG[c-1]} Standard</div><span class="badge ${on?'on':''}">${on?'ಲಭ್ಯ':'ಶೀಘ್ರದಲ್ಲೇ'}</span></button>`}).join('')}</div></div>`}
function vClass(){return `<div class="fade fill"><div class="h2">${ORD[ST.cls-1]} ತರಗತಿ – ವಿಷಯಗಳು</div><div class="sub">ವಿಷಯವನ್ನು ಆಯ್ಕೆ ಮಾಡಿ</div><div class="sgrid">${SUBJ_META.map(s=>{const on=!!DATA[ST.cls+'-'+s.id];return `<button class="tile sj glass neu ${on?'':'off'}" onclick="openSub('${s.id}')"><span class="ic">${s.ic}</span><span><div class="l">${s.name}</div><div class="e">${s.en}</div><span class="badge ${on?'on':''}">${on?'ಲಭ್ಯ':'ಶೀಘ್ರದಲ್ಲೇ'}</span></span></button>`}).join('')}</div></div>`}
/* ===== ವಿಷಯ ===== */
function vSubject(){const T=U().tabs;
 return `<div class="fade"${cur().lang==='en'?' lang="en"':''}><div class="h2">${ORD[ST.cls-1]} ತರಗತಿ · ${cur().title}</div><div class="sub">${cur().part}</div><div class="tabs">${T.map(t=>`<button class="tb ${ST.tab===t[0]?'on':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('')}</div>${ST.tab==='ab'?vAb():ST.tab==='qb'?vQb():vPaper()}</div>`}
function lessonOpts(){return lessons().map(l=>({v:l.n,l:`${U().les} ${l.n}: ${l.t}`}))}
function vAb(){const L=lessons(),l=L.find(x=>x.n==ST.abl)||L[0];
 let h=`<div class="card glass neu"><label class="fl" style="margin-top:0">${U().les}</label>${dd('abs',lessonOpts(),l.n,v=>{ST.abl=+v})}</div>
 <div class="card glass neu"><h3>${U().les} ${l.n}: ${esc(l.t)}</h3><div class="chn">${U().au}: ${esc(l.au)} · ${U().pgl} ${l.pg}</div><details><summary>${U().wd}</summary><p>${esc(l.words)}</p></details><details><summary>${U().nt}</summary><p>${esc(l.notes)}</p></details></div>
 <div class="note">${U().warn}</div>`;
 l.ab.forEach(s=>{h+=`<div class="card glass neu"><h3>${esc(s[0])}</h3>`+s[1].map((p,i)=>`<div class="qa"><div class="qt">${i+1}. ${esc(p[0])}</div><div class="ans"><b>${U().a}</b> ${esc(p[1])}</div></div>`).join('')+'</div>'});return h}
function qHtml(q,a){let h=`<div class="qt">${esc(q.q)}</div>`;
 if(q.t==='mcq')h+=q.o.map((o,i)=>`<div class="opt ${a&&i===q.a?'ok':''}"><span class="ol">${'ABCD'[i]}</span>${esc(o)}</div>`).join('');else if(a)h+=`<div class="ans"><b>${U().ans}</b> ${esc(q.a)}</div>`;return h}
function fq(){return allQ().filter(q=>(ST.ch==='all'||q.ch==ST.ch)&&(ST.type==='all'||q.t===ST.type)&&(ST.lv==='all'||q.lv===ST.lv)&&(!ST.q||(q.q+(q.t==='mcq'?q.o.join(' '):q.a)).includes(ST.q)))}
function vQb(){const list=fq();
 let h=`<div class="seg"><button class="${ST.mode==='browse'?'on':''}" onclick="ST.mode='browse';render()">Browse</button><button class="${ST.mode==='quiz'?'on':''}" onclick="startQuiz()">Quiz</button></div>
 <div class="card glass neu"><div class="row"><div><label class="fl">${U().chap}</label>${dd('qch',[{v:'all',l:U().allCh}].concat(lessons().map(l=>({v:l.n,l:l.n+'. '+l.t}))),ST.ch,v=>{ST.ch=v;ST.qo=[]})}</div>
 <div><label class="fl">${U().qty}</label>${dd('qty',[{v:'all',l:U().allT}].concat(Object.keys(U().TL).map(k=>({v:k,l:U().TL[k]}))),ST.type,v=>{ST.type=v;ST.qo=[]})}</div>
 <div><label class="fl">${U().srch}</label><input placeholder="${U().ph}" value="${esc(ST.q)}" onchange="ST.q=this.value;ST.qo=[];render()"></div></div>
 <div class="pills">${[['all','All levels'],['e','Easy'],['m','Medium'],['h','Hard']].map(p=>`<button class="pill ${ST.lv===p[0]?'on':''}" onclick="ST.lv='${p[0]}';ST.qo=[];render()">${p[1]}</button>`).join('')}</div></div><div class="cnt">${list.length} questions</div>`;
 if(ST.mode==='quiz')return h+quizHtml(list);
 return h+`<div class="qwrap">`+list.map(q=>`<div class="card glass neu"><div class="meta"><span class="tag">${U().TL[q.t]}</span><span>${q.mk} mark${q.mk>1?'s':''}</span><span><i class="dot ${q.lv}"></i>${LVN[q.lv]}</span></div><div class="chn">${esc(lessons().find(l=>l.n==q.ch).t)}</div>${qHtml(q,true)}</div>`).join('')+'</div>'}
function startQuiz(){ST.mode='quiz';ST.qi=0;ST.qs=0;ST.qa=null;ST.qo=[];render()}
function quizHtml(list){if(!list.length)return '<div class="card glass neu">'+U().none+'</div>';
 if(!ST.qo.length)ST.qo=shuffle(list.map(q=>q.id),rng(Date.now()%99999));const id=ST.qo[ST.qi];
 if(!id)return `<div class="card glass neu"><h3>${U().done}</h3><p>${U().sc} ${ST.qs}</p><button class="btn" onclick="startQuiz()">${U().retry}</button></div>`;
 const q=allQ().find(x=>x.id===id);let h=`<div class="card glass neu"><div class="meta"><span class="tag">${U().TL[q.t]}</span><span>${q.mk} mark</span><span>${ST.qi+1}/${ST.qo.length}</span></div><div class="qt">${esc(q.q)}</div>`;
 if(q.t==='mcq')h+=q.o.map((o,i)=>{let c='';if(ST.qa!==null){if(i===q.a)c='ok';else if(i===ST.qa)c='bad'}return `<div class="opt ${c}" onclick="ansQ(${i},${q.a})" style="cursor:pointer"><span class="ol">${'ABCD'[i]}</span>${esc(o)}</div>`}).join('');
 else h+=ST.qa!==null?`<div class="ans"><b>${U().ans}</b> ${esc(q.a)}</div>`:`<button class="btn" onclick="ST.qa=0;render()">${U().see}</button>`;
 if(ST.qa!==null)h+=`<button class="btn" onclick="ST.qi++;ST.qa=null;render()">${U().nx}</button>`;return h+'</div>'}
function ansQ(i,a){if(ST.qa!==null)return;ST.qa=i;if(i===a)ST.qs++;render()}
/* ===== ಪ್ರಶ್ನೆ ಪತ್ರಿಕೆಗಳು ===== */
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const PT={unit:{n:'ಘಟಕ ಪರೀಕ್ಷೆ',max:20,c:{mcq:5,one:4,lang:4,short:2,long:1},time:'45 ನಿಮಿಷ'},fa3:{n:'FA 3',max:15,c:{mcq:4,one:3,lang:3,short:1,long:1},time:'35 ನಿಮಿಷ'},fa4:{n:'FA 4',max:15,c:{mcq:4,one:3,lang:3,short:1,long:1},time:'35 ನಿಮಿಷ'},sa2:{n:'SA 2',max:40,c:{mcq:8,one:9,lang:6,short:4,long:3},time:'1 ಗಂಟೆ 45 ನಿಮಿಷ'}};
function selOpts(p){const CG=cur().grp&&cur().grp[p];if(CG)return {g:CG,s:p==='sa2'?[]:lessons().map(l=>[String(l.n),`${U().les} ${l.n}: ${l.t}`])};const L=lessons(),a=L[0].n,z=L[L.length-1].n,m=Math.floor((a+z)/2);
 if(p==='unit')return {g:[],s:L.map(l=>[String(l.n),`${U().les} ${l.n}: ${l.t}`])};
 const g=p==='sa2'?[[`${a}-${z}`,`${U().allCh} (${a}–${z})`],[`${a}-${m}`,`${U().les} ${a}–${m}`],[`${m+1}-${z}`,`${U().les} ${m+1}–${z}`]]:[[`${a}-${a+3}`,`${U().les} ${a}–${a+3}`],[`${a+4}-${a+7}`,`${U().les} ${a+4}–${a+7}`],[`${a}-${z}`,`${U().allCh} (${a}–${z})`]];
 return {g,s:p==='sa2'?[]:L.map(l=>[String(l.n),`${U().les} ${l.n}: ${l.t}`])}}
function parseSel(v){const p=String(v).split('-').map(Number);const a=p[0],b=p[1]||p[0];return lessons().map(l=>l.n).filter(n=>n>=a&&n<=b)}
function pOpts(o){const r=[];if(o.g.length){r.push({g:U().grpL});o.g.forEach(x=>r.push({v:x[0],l:x[1]}))}if(o.s.length){r.push({g:U().oneL});o.s.forEach(x=>r.push({v:x[0],l:x[1]}))}return r}
function vPaper(){const P=ST.ptype,cfg=PT[P],o=selOpts(P),v=ST.sel[P];
 const sub=['unit','fa3','fa4','sa2'].map(k=>`<button class="tb sm ${P===k?'on':''}" onclick="ST.ptype='${k}';render()">${U().names[k]+' ('+PT[k].max+')'}</button>`).join('');
 return `<div class="tabs">${sub}</div><div class="card glass neu"><label class="fl" style="margin-top:0">${U().pick}</label>${dd('psel',pOpts(o),v,x=>{ST.sel[ST.ptype]=x})}
 <div class="pills"><button class="btn" onclick="ST.seed[ST.ptype]++;render()">${U().newP}</button><button class="btn" onclick="ST.showAns=!ST.showAns;render()">${ST.showAns?U().hide:U().show}</button><button class="btn" onclick="window.print()">${U().prt}</button></div></div>${buildPaper()}`}
function buildPaper(){const P=ST.ptype,cfg=PT[P],ls=parseSel(ST.sel[P]);const pool=allQ().filter(q=>ls.includes(q.ch));const r=rng(ST.seed[P]*7919+ls.length*31+P.length);
 const secs=U().secs;
 let n=1,tot=0;const rg=ls.length>1?`${ls[0]}–${ls[ls.length-1]}`:ls[0];
 let h=`<div class="paper fade"><div class="ph"><b style="font-size:1.25em">${U().names[P]}${P==='unit'?'':U().assess}</b><br>${U().hdr(rg,cfg.max,P)}</div>`;
 secs.forEach(s=>{const qs=shuffle(pool.filter(q=>q.t===s[2]),r).slice(0,cfg.c[s[2]]);if(!qs.length)return;const m=MK[s[2]];tot+=qs.length*m;
  h+=`<div class="sec"><b>${s[0]}. ${s[1]}</b> <span class="mk">(${qs.length} × ${m} = ${qs.length*m})</span>`;
  qs.forEach(q=>{h+=`<div class="pq"><div>${n++}. ${esc(q.q)}</div>`;if(q.t==='mcq')h+='<div class="po">'+q.o.map((o,i)=>`(${U().ol[i]}) ${esc(o)}`).join(' &nbsp; ')+'</div>';
   if(ST.showAns)h+=`<div class="ans"><b>${U().a}</b> ${q.t==='mcq'?'('+U().ol[q.a]+') '+esc(q.o[q.a]):esc(q.a)}</div>`;h+='</div>'});h+='</div>'});
 return h+`<div class="ph" style="border:0;border-top:2px solid #232a45;padding-top:.6rem">${U().total} ${tot}</div></div>`}
/* ===== ರೆಂಡರ್ ===== */
function render(){
 const hero=$('hero');hero.classList.toggle('sm',ST.view!=='home');
 $('herop').textContent=ST.view==='home'?'Shikshana Parva · ಕಲಿಕೆಯ ಹಬ್ಬ':'ಶಿಕ್ಷಕರಿಗಾಗಿ ಕಲಿಕಾ ಸಂಪನ್ಮೂಲ ವೇದಿಕೆ';
 $('bk').disabled=ST.view==='home';
 let c='<b>ಮುಖಪುಟ</b>';if(ST.cls)c+=` › ${ORD[ST.cls-1]} ತರಗತಿ`;if(ST.sub&&ST.view==='subject')c+=` › <b>${cur().title}</b>`;$('crumb').innerHTML=c;
 $('main').innerHTML=ST.view==='home'?vHome():ST.view==='class'?vClass():vSubject();}
render();
</script>
