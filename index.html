.top{position:absolute;left:0;right:0;top:0;z-index:50;max-width:var(--wmax);margin:0 auto;padding:12px 13px;gap:9px;background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none}
.top .ib{width:38px;height:38px;position:relative;color:#fff;background:rgba(38,30,20,.55);border:1px solid rgba(255,230,190,.22);box-shadow:0 3px 10px rgba(0,0,0,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.top .ib svg{width:19px;height:19px}.top .ib:hover{transform:none}
.top #bk{width:42px;height:42px;margin-right:2px}
.top .ic-menu,.top .ic-user{display:none}
.top #bk[disabled]{opacity:1;pointer-events:none}.top #bk[disabled] .ic-back{display:none}.top #bk[disabled] .ic-menu{display:block}
.top:has(#bk[disabled]) .ic-home{display:none}.top:has(#bk[disabled]) .ic-user{display:block}
.top .deco{cursor:default}.top .rd{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:#ff4a4a;border:1px solid rgba(0,0,0,.35)}
.crumb{color:var(--gold);font-weight:700;font-size:13px;text-shadow:0 1px 6px rgba(0,0,0,.65);text-align:center}.crumb b{color:var(--gold)}
.hero{container-type:inline-size;max-width:var(--wmax);margin:0 auto;aspect-ratio:841/428;height:var(--banner-h,auto);max-height:30dvh;min-height:0;display:block;text-align:left;border:0;box-shadow:none;background:var(--hero-a) center/cover no-repeat #2a241a;border-bottom:1px solid rgba(255,230,190,.16)}
@media (min-width:900px) and (min-aspect-ratio:1/1){.hero{background-position:center 30%}}
.hero svg{display:none}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28),transparent 28%,transparent 62%,rgba(15,13,9,.55));pointer-events:none}
.hero .ht{position:absolute;z-index:2;left:27.7%;top:38%;padding:0;width:70%}
@media (min-width:900px) and (min-aspect-ratio:1/1){.hero .ht{top:22%}}
.hero h1{font-size:min(9.6cqw,7.4dvh);line-height:1.1;background:linear-gradient(180deg,#fff0d2,#f0c98f 60%,#d9a768);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));white-space:nowrap}
.hero .hsub{color:#f7e6c6;font-weight:600;font-size:min(3.1cqw,2.6dvh);margin-top:.5cqw;white-space:nowrap;text-shadow:0 1px 5px rgba(0,0,0,.6)}
.hero p{display:inline-block;margin-top:1.8cqw;padding:1.4cqw 0;border-top:1px solid rgba(255,230,190,.3);border-bottom:1px solid rgba(255,230,190,.3);font-size:2.2cqw;letter-spacing:.2em;color:#f2d49b;opacity:.95;white-space:nowrap}
.hero.sm{max-width:none;aspect-ratio:auto;min-height:150px;background:var(--hero-b) center 40%/cover no-repeat #2a241a}
.hero.sm .ht{position:relative;left:auto;top:auto;width:auto;padding:62px 16px 20px;text-align:center}
.hero.sm h1{font-size:34px}.hero.sm .hsub{display:none}.hero.sm p{border:0;font-size:11px;padding:0;margin-top:2px}
main:has(.hgrid){max-width:var(--wmax);padding:12px 13px 8px}
.feat{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;min-height:59px;padding:9px 14px;border-radius:18px;border:1px solid rgba(255,225,185,.25);background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04));box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-bottom:11px}
.fic{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--gold);background:rgba(20,17,12,.65);border:1px solid rgba(255,225,185,.25)}.fic svg{width:22px;height:22px}
.ft{position:relative;z-index:1;min-width:0}
.feat .h2{font-size:16px;margin:0;line-height:1.25;color:#fbf1dd}.feat .sub{font-size:11px;margin:1px 0 0;color:#d5c8b0;line-height:1.35}
.fleaf{position:absolute;right:0;top:0;height:100%;width:auto;mix-blend-mode:screen;opacity:.55;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 35%);mask-image:linear-gradient(90deg,transparent,#000 35%)}
.hgrid{flex:none;grid-template-columns:repeat(var(--hcols),minmax(0,1fr))!important;grid-auto-rows:auto;gap:clamp(8px,1.2vw,22px) clamp(6px,1.2vw,22px)}
.hgrid .tile.pc{container-type:inline-size;position:relative;display:flex;flex-direction:column;justify-content:center;text-align:left;aspect-ratio:390/190;padding:0;border-radius:18px;overflow:hidden;color:var(--t);background:linear-gradient(100deg,var(--a),var(--b));border:1px solid rgba(255,225,185,.4);box-shadow:0 6px 14px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.22);backdrop-filter:none;-webkit-backdrop-filter:none}
.hgrid .tile.pc:nth-child(n+9){aspect-ratio:390/204}
.hgrid .tile.pc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:56%;background:var(--ph) left center/cover no-repeat;-webkit-mask-image:linear-gradient(90deg,#000 62%,transparent);mask-image:linear-gradient(90deg,#000 62%,transparent)}
.hgrid .tile.pc::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 38%,rgba(0,0,0,.14))}
.hgrid .tile.pc .tx{position:absolute;z-index:2;left:47%;right:3%;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.hgrid .tile.pc .n{font-size:14cqw;line-height:1;font-weight:800;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--t);text-shadow:0 1px 4px rgba(0,0,0,.25)}
.hgrid .tile.pc .l{margin:1cqw 0 0;font-size:5.4cqw;font-weight:800;color:var(--t);line-height:1.3}

.top{padding:20px 9px 12px 13px;gap:6px}
.top #bk{width:34px;height:34px;margin-right:0}
.top .ib{width:30px;height:30px}
.top #bk svg,.top .ib svg{width:17px;height:17px}
.top .rd{top:3px;right:4px;width:7px;height:7px}
.crumb{padding-left:22px}
.hero p{margin-top:.25cqw;padding:.75cqw 0;line-height:1.5}
main:has(.hgrid){padding:10px 12px 8px}
.feat{min-height:50px;padding:6px 12px 6px 6px;gap:9px;margin-bottom:8px;border-radius:16px}
.fic{width:34px;height:34px;border-radius:10px}.fic svg{width:20px;height:20px}
.feat .h2{font-size:17px}
.hgrid{gap:8px 5px}
.hgrid .tile.pc{aspect-ratio:390/181}
.hgrid .tile.pc:nth-child(n+3){aspect-ratio:390/187}
.hgrid .tile.pc:nth-child(n+5){aspect-ratio:390/189}
.hgrid .tile.pc:nth-child(n+7){aspect-ratio:390/190}
.hgrid .tile.pc:nth-child(n+9){aspect-ratio:390/202}
.hgrid .tile.pc .tx{left:48.5%;right:3%}
.hgrid .tile.pc .n{font-size:16.5cqw}
.hgrid .tile.pc .l{margin-top:.4cqw;font-size:5.7cqw}
.hgrid .tile.pc .act{gap:3.3cqw;margin-top:2.8cqw}
.hgrid .tile.pc .badge{padding:2.5cqw 2cqw}
.hgrid .tile.pc .arw{width:11.3cqw;height:11.3cqw}
footer{margin:13px auto 26px;padding:12px 44px;border-radius:16px;white-space:nowrap;font-size:min(11px,2.9vw);display:flex;justify-content:center;align-items:center;gap:.4em}
footer b{font-size:min(12.5px,3.3vw)}

/* ===== v16: class screen (subject list) matched to target reference ===== */
body.vcls .top{padding:20px 13px 12px 13px;gap:8px}
body.vcls .top .deco{display:none}
body.vcls .top .ib,body.vcls .top #bk{width:36px;height:36px;margin:0}
body.vcls .top .ib svg,body.vcls .top #bk svg{width:18px;height:18px}
body.vcls .crumb b{color:var(--gold)}
body.vcls main{max-width:var(--wmax);padding:11px 12px 8px}
body.vcls .fade>.h2{font-size:clamp(18px,5.2vw,32px);line-height:1.3;margin:0 0 1px;color:#fbf1dd;text-shadow:0 2px 8px rgba(0,0,0,.6)}
body.vcls .fade>.sub{font-size:clamp(12px,3.7vw,20px);line-height:1.4;margin:0 0 10px;color:rgba(255,244,222,.9);text-shadow:0 1px 5px rgba(0,0,0,.6)}
body.vcls .sgrid{flex:none;display:grid;grid-template-columns:1fr;grid-auto-rows:auto;gap:clamp(6px,1.9vw,12px)}
body.vcls .sgrid .tile.sj{--c1:#34503a;--c2:#1b2f25;--tint:rgba(27,47,37,.3);--bd:rgba(255,236,190,.5);--ic:rgba(15,30,22,.78);--glow:rgba(255,230,160,.35);
 container-type:inline-size;position:relative;display:block;width:100%;aspect-ratio:782/193;min-height:0;padding:0;text-align:left;overflow:hidden;
 border-radius:min(3.7vw,24px);color:#fff4dc;background:var(--c2);border:1px solid var(--bd);
 box-shadow:0 8px 18px rgba(0,0,0,.42),0 2px 4px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.28);backdrop-filter:none;-webkit-backdrop-filter:none;transition:transform .2s,border-color .2s}
body.vcls .sgrid .tile.sj:hover{transform:translateY(-2px)}
body.vcls .sgrid .tile.sj:active{transform:scale(.99);box-shadow:0 5px 12px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.28)}
body.vcls .sgrid .tile.sj::before{content:"";position:absolute;top:0;bottom:0;right:0;width:66%;background:var(--ph) center 60%/cover no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent,#000 42%);mask-image:linear-gradient(90deg,transparent,#000 42%)}
body.vcls .sgrid .tile.sj::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,var(--c1) 0%,var(--c2) 36%,var(--tint) 74%,rgba(0,0,0,.04) 100%),linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,0) 36%,rgba(0,0,0,.22))}
body.vcls .sgrid .tile.sj.off{opacity:.8}
body.vcls .sj .ic{position:absolute;z-index:2;left:4.9cqw;top:50%;transform:translateY(-50%);width:15.6cqw;height:15.6cqw;border-radius:3.5cqw;display:grid;place-items:center;font-size:6.6cqw;font-weight:800;line-height:1;color:#f9e6bd;
 background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(0,0,0,.32)),var(--ic);border:1.5px solid var(--bd);box-shadow:0 0 3.2cqw var(--glow),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 6px rgba(0,0,0,.3)}
body.vcls .sj .ic svg{width:56%;height:56%}
body.vcls .sj .sjt{position:absolute;z-index:2;left:24.8cqw;top:0;bottom:0;right:14cqw;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
body.vcls .sj .sjt .l{display:block;margin:0;font-size:4.9cqw;font-weight:800;line-height:1.25;color:#fff4dc;text-shadow:0 2px 6px rgba(0,0,0,.55)}
body.vcls .sj .sjt .e{display:block;margin:.2cqw 0 0;font-size:3.6cqw;line-height:1.3;color:rgba(255,244,222,.92);text-shadow:0 1px 4px rgba(0,0,0,.55)}
body.vcls .sj .sjt .badge{display:inline-block;margin-top:1.9cqw;min-width:13.8cqw;padding:1.15cqw 3cqw;text-align:center;font-size:3.2cqw;line-height:1.2;font-weight:800;border-radius:99px;white-space:nowrap;color:#fbeed0;background:rgba(255,244,222,.2);border:1px solid rgba(255,240,215,.5);box-shadow:0 2px 5px rgba(0,0,0,.25);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
body.vcls .sj .sjt .badge.on{color:#4a3414;background:linear-gradient(180deg,#f8edcb,#e8d29e);border:0;box-shadow:0 2px 5px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6)}
body.vcls .sj .arw{position:absolute;z-index:2;right:3.5cqw;top:50%;transform:translateY(-50%);width:8.8cqw;height:8.8cqw;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(18,18,16,.58);border:1.5px solid rgba(255,255,255,.32);box-shadow:0 2px 8px rgba(0,0,0,.4)}
body.vcls .sj .arw svg{width:46%;height:46%}
body.vcls .sgrid .tile.sj.s-kn{--c1:#7c8a22;--c2:#1c4021;--tint:rgba(28,64,33,.28);--bd:rgba(226,232,120,.6);--ic:rgba(16,48,26,.8);--glow:rgba(190,222,90,.5);--ph:var(--q1)}
body.vcls .sgrid .tile.sj.s-ma{--c1:#a8742a;--c2:#4f3114;--tint:rgba(79,49,20,.3);--bd:rgba(246,200,120,.6);--ic:rgba(70,40,12,.8);--glow:rgba(245,180,90,.5);--ph:var(--q2)}
body.vcls .sgrid .tile.sj.s-en{--c1:#1f78a6;--c2:#123a52;--tint:rgba(18,58,82,.3);--bd:rgba(150,215,245,.6);--ic:rgba(10,42,66,.8);--glow:rgba(110,200,245,.5);--ph:var(--q3)}
body.vcls .sgrid .tile.sj.s-evs{--c1:#6e3f9c;--c2:#2d1b4d;--tint:rgba(45,27,77,.3);--bd:rgba(210,170,245,.6);--ic:rgba(40,22,70,.8);--glow:rgba(190,140,240,.5);--ph:var(--q4)}
body.vcls .sgrid .tile.sj.s-hi{--c1:#b04e5f;--c2:#5a2231;--tint:rgba(90,34,49,.3);--bd:rgba(250,175,190,.6);--ic:rgba(82,26,40,.8);--glow:rgba(245,140,160,.5);--ph:var(--q5)}
body.vcls .sgrid .tile.sj.s-ss{--c1:#1f7c64;--c2:#0f3d33;--tint:rgba(15,61,51,.3);--bd:rgba(150,235,205,.6);--ic:rgba(8,48,40,.8);--glow:rgba(110,225,185,.5);--ph:var(--q6)}


body.vcls .sgrid .tile.sj.s-sc{--c1:#3f7a52;--c2:#17402a;--tint:rgba(23,64,42,.3);--bd:rgba(170,235,190,.6);--ic:rgba(12,48,30,.8);--glow:rgba(120,220,160,.5);--ph:var(--q-sc)}
body.vcls .sgrid .tile.sj.s-sc{--pw:56%}

/* ===== v17: class screen — subject colours now win specificity; high-res photo crops from reference ===== */
body.vcls .sgrid .tile.sj{aspect-ratio:782/194}
body.vcls .sgrid .tile.sj::before{width:var(--pw,62%);background:var(--ph) 0 0/100% 100% no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.6) 16%,#000 40%);mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.6) 16%,#000 40%)}
body.vcls .sgrid .tile.sj::after{background:linear-gradient(90deg,var(--c1) 0%,var(--c2) 34%,var(--tint) 66%,rgba(0,0,0,0) 100%),linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 34%,rgba(0,0,0,.16))}
body.vcls .sj .arw{width:9.6cqw;height:9.6cqw;right:2.8cqw}
body.vcls .sgrid .tile.sj.s-kn{--pw:61.64%}
body.vcls .sgrid .tile.sj.s-ma{--pw:58.31%}
body.vcls .sgrid .tile.sj.s-en{--pw:60.36%}
body.vcls .sgrid .tile.sj.s-evs{--pw:41.69%}

/* ===== v18: subject screen (ಅಭ್ಯಾಸ ಉತ್ತರಗಳು / LBA / ಪತ್ರಿಕೆ / ರಸಪ್ರಶ್ನೆ) matched to reference — CSS only, scoped to body.vsub ===== */
body.vsub .top{padding:20px 13px 12px;gap:8px}
body.vsub .top .deco{display:none}
body.vsub .top .ib,body.vsub .top #bk{width:36px;height:36px;margin:0}
body.vsub .top .ib svg,body.vsub .top #bk svg{width:18px;height:18px}
body.vsub .crumb,body.vcls .crumb{position:absolute;z-index:5;top:clamp(12px,3vw,28px);right:clamp(12px,3vw,32px);left:auto;flex:none;width:max-content;max-width:min(38%,360px);box-sizing:border-box;padding:6px 12px;border-radius:14px;white-space:normal;overflow:visible;text-overflow:clip;text-align:right;line-height:1.35;font-size:clamp(11px,min(2.9vw,2.4dvh),15px);font-weight:700;color:#f6ebd2;background:rgba(38,30,20,.6);border:1px solid rgba(255,230,190,.22);box-shadow:0 3px 10px rgba(0,0,0,.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
body.vsub .crumb b{color:var(--gold)}
body.vsub .hero p{display:none}
body.vsub .hero::after{background:linear-gradient(180deg,rgba(0,0,0,.22),transparent 26%,transparent 66%,rgba(15,13,9,.38))}
body.vsub main{width:100%;max-width:var(--wmax);padding:10px 12px 8px}
body.vsub main>.fade{display:flex;flex-direction:column;width:100%}
body.vsub main>.fade>*{min-width:0}

body.vsub .tabs.t4 .tb::before{content:"";flex:none;width:min(6.2cqw,26px);height:min(6.2cqw,26px);background:var(--gold);-webkit-mask:var(--ti) center/contain no-repeat;mask:var(--ti) center/contain no-repeat}
body.vsub .tabs.t4 .tb[data-t=ab]{--ti:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22black%22 stroke-width=%221.8%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M7 3h7l4 4v14H7z%22/%3E%3Cpath d=%22M14 3v4h4M10 12h5M10 16h5%22/%3E%3C/svg%3E")}
body.vsub .tabs.t4 .tb[data-t=qb]{--ti:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22black%22 stroke-width=%221.8%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M2 9l10-5 10 5-10 5z%22/%3E%3Cpath d=%22M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5%22/%3E%3Cpath d=%22M22 9v6%22/%3E%3C/svg%3E")}
body.vsub .tabs.t4 .tb[data-t=paper]{--ti:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22black%22 stroke-width=%221.8%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M12 4H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2v-6%22/%3E%3Cpath d=%22M17.5 3.5l3 3L12 15l-4 1 1-4z%22/%3E%3C/svg%3E")}

body.vsub .tabs.t4 .tb:hover{color:#fff4dc}

/* secondary (exam) tabs + pills */
body.vsub .tabs:not(.t4){gap:8px;margin:0 0 12px}

body.vsub main .card{width:100%;border-radius:16px;padding:14px;margin:0 0 12px;background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.03)),rgba(20,18,12,.40);border:1px solid rgba(255,225,185,.28);box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

body.vsub .chn{font-size:13px;color:rgba(255,244,222,.8);margin:2px 0 6px}

body.vsub .qa{border-bottom-color:rgba(255,225,185,.12)}
body.vsub .ans{padding:9px 12px;border-radius:12px;border-left:4px solid var(--gold);background:rgba(255,255,255,.10);color:#fff4dc;font-size:14px;line-height:1.5;margin:.4rem 0}

body.vsub .opt{background:rgba(12,16,10,.45);border-color:rgba(255,225,185,.2);box-shadow:none}
body.vsub .tag{background:rgba(242,212,155,.16);color:var(--gold)}

/* ===== v19: LBA ಪ್ರಶ್ನೆ ಬಂಡಾರ visual refinement — CSS only, scoped to body.vsub =====
   tabs / filter panel / filter pills = glass ; question cards / options = soft neumorphic ;
   "ಎಲ್ಲಾ ಹಂತ" (selected filter) = gold ; correct answer = green */

/* 1. four main tabs: equal columns, pure glass, warm-gold selected state (no green) */
body.vsub .tabs.t4{grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(5px,1.6vw,10px)}
body.vsub .tabs.t4 .tb{flex:none;height:min(18cqw,86px);background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(255,235,200,.28);box-shadow:0 4px 14px rgba(0,0,0,.26),inset 0 1px 0 rgba(255,255,255,.2);backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1)}
body.vsub .tabs.t4 .tb.on{color:#fff4d8;background:linear-gradient(160deg,rgba(255,238,196,.26),rgba(255,224,168,.08));border:1.5px solid rgba(242,212,155,.88);box-shadow:0 0 0 1px rgba(242,212,155,.16),0 0 18px rgba(242,200,120,.3),0 5px 14px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.32)}
body.vsub .tabs.t4 .tb.on::before{background:var(--gold)}

/* 2. filter panel (the .ddz card only): translucent dark glass, not neumorphic */
body.vsub main .card.ddz{background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.02)),rgba(18,16,11,.46);border:1px solid rgba(255,225,185,.26);border-radius:20px;padding:clamp(14px,4.2vw,22px);box-shadow:0 6px 18px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
body.vsub .card.ddz .row{grid-template-columns:1fr;gap:12px}
body.vsub .card.ddz .ddb{background:rgba(10,10,7,.55);border:1px solid rgba(255,225,185,.2);box-shadow:inset 0 2px 7px rgba(0,0,0,.45);border-radius:999px;padding:13px 18px;min-height:48px}

/* 3. level pills: equal size glass, gold when selected */
body.vsub .pills{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
body.vsub .pill{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:600;line-height:1.2;white-space:nowrap;color:#f2e6cc;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));border:1px solid rgba(255,225,185,.3);box-shadow:0 3px 9px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
body.vsub .pill.on{color:#3a2a0c;font-weight:800;background:linear-gradient(180deg,#f8e3a6,#e2b75f);border:1px solid rgba(255,236,176,.95);box-shadow:0 0 14px rgba(242,200,110,.4),0 3px 9px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.55)}

/* 4. question cards: one consistent soft neumorphic style */
body.vsub .qwrap{gap:16px}
body.vsub .qwrap .card{background:linear-gradient(145deg,rgba(52,46,34,.62),rgba(26,23,16,.7));border:1px solid rgba(255,225,185,.12);border-radius:22px;padding:clamp(14px,4vw,20px);box-shadow:8px 8px 18px rgba(0,0,0,.42),-5px -5px 14px rgba(255,236,200,.05),inset 1px 1px 0 rgba(255,236,200,.08);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
body.vsub .qwrap .qt{font-size:clamp(16px,4.4vw,20px);color:#f6ebd2}
body.vsub .qwrap .cnt,body.vsub .cnt{color:rgba(255,244,222,.85)}
body.vsub .qwrap .tag{background:rgba(242,212,155,.18);color:var(--gold);border-radius:12px;padding:6px 14px}

/* 5. answer options: inset neumorphic rows */
body.vsub .qwrap .opt{min-height:54px;padding:8px 14px;margin:10px 0;border-radius:16px;color:#f6ebd2;background:rgba(12,11,8,.5);border:1px solid rgba(255,225,185,.1);box-shadow:inset 3px 3px 7px rgba(0,0,0,.5),inset -2px -2px 5px rgba(255,236,200,.05)}
body.vsub .qwrap .ol{width:38px;height:38px;background:#2a2f48;color:var(--gold)}

/* 6. correct / selected answer: green (not gold) */
body.vsub .qwrap .opt.ok{color:#fbf5e4;background:linear-gradient(135deg,rgba(56,116,66,.94),rgba(22,64,36,.96));border:1px solid rgba(132,208,128,.75);box-shadow:0 0 14px rgba(90,190,100,.32),inset 0 1px 0 rgba(255,255,255,.2),inset 0 -2px 6px rgba(0,0,0,.25)}
body.vsub .qwrap .opt.ok .ol{background:#f2d49b;color:#23311f}

/* ===== v20: single visual patch to match master target (CSS only; overrides v19 where needed) ===== */

/* TOP TABS — fixed equal cells; glow is box-shadow only, so layout never shifts */
body.vsub .tabs.t4{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:min(18cqw,86px);align-items:stretch;gap:clamp(5px,1.6vw,10px);padding:2px 0 4px;overflow:visible}

 background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.02)),rgba(18,16,11,.5);
 border:1px solid rgba(255,225,185,.26);

body.vsub .tabs.t4 .tb.on{color:#fff8e4;
 background:linear-gradient(165deg,rgba(255,255,255,.16),rgba(255,255,255,0) 45%),linear-gradient(165deg,rgba(104,168,72,.62),rgba(30,82,42,.78));
 border:1.5px solid rgba(218,228,120,.95);
 box-shadow:0 0 0 1px rgba(218,228,120,.25),0 0 16px rgba(150,222,84,.55),0 0 32px rgba(150,212,72,.26),0 6px 14px rgba(0,0,0,.4),inset 0 0 14px rgba(176,232,104,.3),inset 0 1px 0 rgba(255,255,255,.38);

/* DROPDOWNS — dark glass, soft rounded rectangle */
body.vsub .card.ddz .ddb{border-radius:16px;background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,.14)),rgba(14,13,9,.55);border:1px solid rgba(255,225,185,.22);box-shadow:inset 0 2px 7px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.06)}

/* DIFFICULTY FILTERS — inactive dark glass, selected golden */
body.vsub .pill{background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02)),rgba(16,14,10,.5);border:1px solid rgba(255,225,185,.26);box-shadow:0 3px 9px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12)}
body.vsub .pill.on{background:linear-gradient(180deg,#f9e5ab,#e0b45a);color:#3a2a0c;border:1px solid rgba(255,238,184,.95);box-shadow:0 0 16px rgba(244,204,108,.5),0 3px 9px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -3px 6px rgba(150,100,20,.25)}

/* QUESTION CARDS — dark glass + soft neumorphic depth */
body.vsub .qwrap .card{background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.01)),linear-gradient(145deg,rgba(48,43,31,.62),rgba(22,20,14,.72));border:1px solid rgba(255,225,185,.16);box-shadow:8px 8px 18px rgba(0,0,0,.42),-4px -4px 12px rgba(255,236,200,.05),inset 1px 1px 0 rgba(255,236,200,.1),inset -1px -1px 8px rgba(0,0,0,.2)}

body.vsub .qwrap .opt{background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.08)),rgba(14,13,9,.5);border:1px solid rgba(255,225,185,.12);box-shadow:0 3px 8px rgba(0,0,0,.3),inset 2px 2px 6px rgba(0,0,0,.4),inset -1px -1px 4px rgba(255,236,200,.05)}

  font-weight:700;break-after:avoid;page-break-after:avoid}
 .paper .sh>span{padding:0!important;margin:0!important;background:none!important;border:0!important;border-radius:0!important}
 .paper .sh>span:last-child{flex:none;white-space:nowrap;text-align:right}
 .paper .sec>b{break-after:avoid;page-break-after:avoid}
 .paper .pq{margin:.35rem 0 .35rem .2rem!important;padding:0!important;break-inside:avoid;page-break-inside:avoid;orphans:3;widows:3}
 .paper .sh+.pq{break-before:avoid;page-break-before:avoid}
 .paper .mt,.paper table,.paper tr,.paper .qpic,.paper .ans,.paper .wh{break-inside:avoid;page-break-inside:avoid}
 .paper .wl{height:1.65rem;margin:0 0 0 1.4rem;border-bottom:.75pt solid #000}
 .paper .ln,.paper .mt td.ma{border-bottom:.75pt solid #000}
 .paper .qpic{margin:.3rem 0;text-align:center}
 .paper .ans{margin:.3rem 0 .2rem!important;padding:.3rem .6rem!important;background:#f2f2f2!important;border-left:2.5pt solid #555!important;border-radius:0!important;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
 img,svg{-webkit-print-color-adjust:exact;print-color-adjust:exact;filter:none!important;max-width:100%}

 /* 11. blueprint */
 .bpwrap{display:none!important}
 body.pr-bp .bpwrap{display:block!important;margin:0!important;padding:0!important;background:#fff!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow:visible!important}
 body.pr-bp .bpwrap .bpbar{display:block!important;margin:0 0 .5rem}

  font-size:1rem;font-weight:800;break-after:avoid;page-break-after:avoid}

 body.pr-bp .bpwrap .bpt{width:100%!important;min-width:0!important;border-collapse:collapse;font-size:.88rem}

body:not(.vcls):not(.vsub) .top .deco{display:grid!important}
body.vmed .crumb{flex:none;margin:0 auto;width:max-content;max-width:60%;padding:6px 18px;border-radius:99px;background:rgba(38,30,20,.55);border:1px solid rgba(255,230,190,.22);box-shadow:0 3px 10px rgba(0,0,0,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:clamp(14px,3.6vw,17px);color:#f3dcc2}
body.vmed .crumb b{color:#f3dcc2}
.mv{position:relative;width:100%;max-width:var(--wmax);margin:0 auto;display:flex;flex-direction:column;gap:clamp(12px,2.4vw,22px);padding-top:clamp(8px,1.6vw,14px)}
.mpanel{border-radius:24px;padding:clamp(14px,3.2vw,26px) clamp(10px,2.4vw,22px);background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.03)),rgba(18,16,11,.46);border:1px solid rgba(255,225,185,.26);box-shadow:0 10px 26px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.mlogos{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:start}
.mlg{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;padding:0 clamp(4px,1.4vw,14px)}
.mlg+.mlg{border-left:1px solid rgba(255,225,185,.24)}
.mlg img{display:block;height:clamp(64px,13.5vw,124px);width:auto;max-width:100%;object-fit:contain}
.mlg .lt{margin-top:clamp(6px,1.4vw,12px);font-weight:800;line-height:1.2}
.mlg .dsert{color:#e7312d;letter-spacing:.32em;font-size:clamp(14px,3.2vw,30px)}
.mlg .diet{color:#f6ead3;letter-spacing:.3em;font-size:clamp(14px,3.2vw,28px)}
.mlg .ktbs{color:#f6ead3;font-size:clamp(10px,1.9vw,17px);text-transform:uppercase;max-width:14em}
.mlg p{margin-top:.25em;font-size:clamp(9.5px,1.6vw,15px);line-height:1.3;color:#e8dcc8}
.mlist{display:flex;flex-direction:column;gap:clamp(12px,2.4vw,22px)}
.mcard{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;gap:clamp(12px,2.6vw,24px);width:100%;min-height:clamp(96px,18vw,156px);padding:clamp(12px,2.4vw,22px) clamp(14px,3.2vw,28px);border-radius:26px;border:1px solid rgba(255,225,185,.26);background:linear-gradient(100deg,var(--c1) 0%,var(--c2) 52%,rgba(10,8,5,.35) 100%);box-shadow:0 12px 26px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.16);color:#fbf1dd;text-align:left;transition:transform .2s,box-shadow .2s}
.mcard::before{content:"";position:absolute;top:0;bottom:0;right:0;width:62%;z-index:-1;background:var(--ph) center/cover no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent,#000 42%);mask-image:linear-gradient(90deg,transparent,#000 42%);pointer-events:none}
.mcard:hover{transform:translateY(-2px)}.mcard:active{transform:scale(.99)}
.mci{flex:none;width:clamp(52px,10vw,80px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fbeed0;border:1.5px solid rgba(255,235,200,.62);background:rgba(16,13,8,.42);box-shadow:0 4px 12px rgba(0,0,0,.35)}
.mci svg{width:50%;height:50%}
.mct{flex:1;min-width:0;display:flex;flex-direction:column;gap:.2em;position:relative}
.mct .k{font-size:clamp(17px,3.6vw,32px);font-weight:800;line-height:1.2;text-shadow:0 2px 6px rgba(0,0,0,.55);overflow-wrap:anywhere}
.mct .e{font-size:clamp(13px,2.6vw,24px);color:rgba(255,244,222,.92);text-shadow:0 1px 5px rgba(0,0,0,.6)}
.marr{flex:none;width:clamp(44px,8vw,64px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--ac);border:1px solid rgba(255,235,200,.45);box-shadow:0 6px 14px rgba(0,0,0,.4)}
.marr svg{width:45%;height:45%}

body.vmed .hero{min-height:clamp(200px,56vw,420px);background:var(--hero-a) center 40%/cover no-repeat}
body.vmed .hero svg>rect,body.vmed .hero svg>circle,body.vmed .hero svg>path,body.vmed .hero svg>g:not([transform]){display:none}
body.vmed .hero h1{font-size:clamp(40px,12.6vw,72px)}
body.vmed .hero .hsub{display:block;font-size:clamp(14px,4.1vw,20px)}
body.vmed .hero p{font-size:clamp(11px,3.3vw,15px)}
body.vmed .crumb:empty{display:none}
body.vmed .crumb:empty+.deco{margin-left:auto}
.mpanel{background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.02)),rgba(18,16,11,.30)}
.mlg img{height:clamp(64px,19vw,130px)}
.mlg .dsert{font-size:clamp(16px,4.4vw,32px)}
.mlg .diet{font-size:clamp(15px,4.2vw,30px)}
.mcard{min-height:24vw;background:linear-gradient(100deg,var(--c1) 0%,var(--c2) 40%,rgba(10,8,5,0) 74%)}
.mcard::before{width:60%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 32%);mask-image:linear-gradient(90deg,transparent,#000 32%)}
.mci{width:clamp(56px,13.5vw,80px)}
.mct .k{font-size:clamp(20px,6vw,34px)}
.mct .e{font-size:clamp(14px,3.8vw,22px)}
.mlist.sem .mcard{min-height:29vw}

/* ===== ಮಾಧ್ಯಮ/ಸೆಮಿಸ್ಟರ್ ಪರದೆ: ಬೆಳಕು ಮತ್ತು ಕೆಳಭಾಗ ===== */
body.vmed .hero::after{background:linear-gradient(180deg,rgba(0,0,0,.06),transparent 30%,transparent 70%,rgba(15,13,9,.20))}

/* ===== ಸ್ಕ್ರೋಲ್ ಇಲ್ಲದೆ ಪರದೆಗೆ ಹೊಂದುವಂತೆ + ಶೀರ್ಷಿಕೆ ಒತ್ತಕ್ಷರ ಸರಿಪಡಿಸುವಿಕೆ ===== */
body.vmed{height:100dvh;overflow:hidden}
body.vmed main{overflow:hidden}
body.vmed .hero{min-height:clamp(170px,min(56vw,30dvh),420px)}
body.vmed .hero h1{line-height:1.5;padding:.12em 0 .16em;background-clip:text;-webkit-background-clip:text}
.mv{gap:clamp(8px,1.6dvh,16px)}
.mcard{min-height:min(24vw,13dvh)}
.mlist.sem .mcard{min-height:min(29vw,17dvh)}
.mlist{gap:clamp(8px,1.6dvh,16px)}

/* ===== ಕಡಿಮೆ ಎತ್ತರದ ಫೋನ್ಗಳಿಗೆ ಹೊಂದಾಣಿಕೆ ===== */
body.vmed .hero{min-height:clamp(150px,min(56vw,25dvh),420px)}
.mcard{min-height:min(24vw,11.5dvh);padding-top:clamp(8px,1.4dvh,22px);padding-bottom:clamp(8px,1.4dvh,22px)}
.mlist.sem .mcard{min-height:min(29vw,15.5dvh)}
.mpanel{padding-top:clamp(8px,1.6dvh,26px);padding-bottom:clamp(8px,1.6dvh,26px)}
.mlg img{height:clamp(56px,min(19vw,12.5dvh),130px)}

/* ===== ಎಲ್ಲಾ ಪರದೆಗಳಲ್ಲಿ ಶಿಕ್ಷಣ ಪರ್ವ ಶೀರ್ಷಿಕೆ: ಒತ್ತಕ್ಷರ ಕತ್ತರಿಸದಂತೆ ===== */
.hero h1{line-height:1.5;padding:.12em 0 .16em;background-clip:text;-webkit-background-clip:text}
/* ===== v15: ಮಾಧ್ಯಮ / ಸೆಮಿಸ್ಟರ್ ಪರದೆ – ಎಲ್ಲಾ ಪರದೆಗಳಲ್ಲಿ ಕತ್ತರಿಸದಂತೆ ರೆಸ್ಪಾನ್ಸಿವ್ ===== */
body.vmed{height:auto;min-height:100dvh;overflow:visible}
body.vmed main{overflow:visible}
body.vmed .hero{min-height:clamp(150px,min(56vw,30vh),340px)}
.mv{gap:clamp(10px,1.8vw,20px);padding-top:clamp(6px,1.2vw,14px);padding-bottom:clamp(10px,2vw,24px)}
.mlist{gap:clamp(10px,1.8vw,20px)}
.mlg img{height:clamp(60px,min(16vw,14vh),124px)}
.mcard,.mlist.sem .mcard{min-height:clamp(92px,min(24vw,16vh),170px);padding-top:clamp(10px,1.6vw,20px);padding-bottom:clamp(10px,1.6vw,20px)}
.mci{width:clamp(48px,min(11vw,9vh),80px)}
.marr{width:clamp(38px,min(7vw,6vh),60px)}
.mct .k{font-size:clamp(17px,min(4.6vw,3.4vh),34px)}
.mct .e{font-size:clamp(12px,min(3.2vw,2.4vh),24px)}
.mct .mq{display:inline-block;align-self:flex-start;max-width:100%;margin-top:.2em;padding:.2em .8em;border-radius:99px;font-size:clamp(11px,min(2.8vw,2.1vh),19px);font-weight:700;line-height:1.3;color:#fbeed0;background:rgba(16,13,8,.5);border:1px solid rgba(255,235,200,.45);overflow-wrap:anywhere}
@media (min-width:900px){.mv{max-width:min(1100px,100%)}}

/* ===== v15: ತರಗತಿ ಲೇಔಟ್ – ಪ್ರಶ್ನೋತ್ತರ ಲೇಬಲ್ ಪೂರ್ತಿ ಕಾಣುವಂತೆ ===== */

function sel(key,opts,val,code){DDC[key]=code;const hit=opts.find(o=>o[0]!==null&&o[0]==val)||opts.find(o=>o[0]!==null);

function ddT(k,e){if(e)e.stopPropagation();const d=document.getElementById('dd-'+k);const l=d.querySelector('.ddl');const open=l.style.display!=='none';document.querySelectorAll('.ddl').forEach(x=>x.style.display='none');document.querySelectorAll('.ddz').forEach(x=>x.style.zIndex='');l.style.display=open?'none':'block';if(!open){const c=d.closest('.card');if(c){c.classList.add('ddz');c.style.zIndex=200}}}

function colHtml(txt,L1='ರೂ.',L2='ಪೈ'){const lines=txt.split('\n');let i=0;
 const cell=(c,cls)=>`<span class="${cls||''}">${c}</span>`;
 let rows=cell('')+cell(L1,'h r')+cell('')+cell(L2,'h');
 while(i<lines.length&&lines[i].trim()!==''){const t=lines[i].trim();
   if(/^[-—]+$/.test(t))rows+=cell('','rule');
   else{const m=t.match(/^([+−-]?)\s*(\d+)\.(\d+)$/);
     if(m)rows+=cell(m[1]||'','op')+cell(m[2],'r')+cell('.','dot')+cell(m[3],'l');
     else rows+=cell(esc(t),'rule')}
   i++}
 const rest=lines.slice(i).join('\n').trim();
 return `<div class="ans"><b>${T('ans')}</b><div class="vsum">${rows}</div>${esc(rest)}</div>`}
function gridHtml(txt){const lines=txt.split('\n');let html='',rest=[],inG=true;
 lines.forEach(ln=>{if(inG&&ln.includes('|')){html+='<tr>'+ln.split('|').map(c=>{c=c.trim();const num=/^[\d.,₹\-]+$/.test(c)||/^\d/.test(c);return `<td class="${num?'n':''}">${esc(c)}</td>`}).join('')+'</tr>'}else{inG=false;rest.push(ln)}});
 return `<div class="ans"><b>${T('ans')}</b><div class="gridwrap"><table class="gtbl"><tbody>${html}</tbody></table></div>${esc(rest.join('\n').trim())}</div>`}
function ansHtml(a){a=String(a);
 if(a.startsWith('[COL]'))return colHtml(a.slice(5));
 if(a.startsWith('[COLM]'))return colHtml(a.slice(6),'ಮೀ','ಸೆಂ.ಮೀ');
 if(a.startsWith('[COLKG]'))return colHtml(a.slice(7),'kg','g');
 if(a.startsWith('[COLLM]'))return colHtml(a.slice(7),'ಲೀ','ಮಿಲೀ');
 if(a.startsWith('[GRID]'))return gridHtml(a.slice(6));
 if(a.startsWith('[TAB]')){let rows='',rest=[];a.slice(5).split('\n').forEach(ln=>{const i=ln.indexOf('|');if(i>0&&!rest.length){rows+=`<div class="trow"><span>${esc(ln.slice(0,i))}</span><span>${esc(ln.slice(i+1))}</span></div>`}else rest.push(ln)});return `<div class="ans"><b>${T('ans')}</b><div class="tbl">${rows}</div>${esc(rest.join('\n'))}</div>`}
 return `<div class="ans"><b>${T('ans')}</b> ${esc(a)}</div>`}

function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function lessonNums(){return lessons().filter(l=>l.qb&&l.qb.length).map(l=>l.n)}
function halves(){const nums=lessonNums(),h=Math.ceil(nums.length/2);return {all:nums,f:nums.slice(0,h),s:nums.slice(h)}}

function selOpts(p){const H=halves(),L=lessons().filter(l=>H.all.includes(l.n));
 if(p==='unit')return {g:[],s:L.map(l=>[String(l.n),lessonLabel(l)])};
 const lb=x=>T('lessons')(x[0],x[x.length-1]);
 if(p==='fa3')return {g:[[rr(H.f),lb(H.f)]],s:[]};
 if(p==='fa4')return {g:[[rr(H.s),lb(H.s)]],s:[]};

 return `<div class="fgrid nopr"><div class="card glass neu nopr ddz fc"><label class="fl" style="margin-top:0">${T('chapter')}</label>${sel('qzc',lo,ST.qzc,'ST.qzc=value;startQuiz()')}</div><div class="card glass neu nopr ddz fc"><label class="fl" style="margin-top:0">${T('qtype')}</label>${sel('qzt',to,ST.qzt,'ST.qzt=value;startQuiz()')}</div></div><div class="pills lvp nopr">${[['all',T('allLv')],['e',T('lv').e],['m',T('lv').m],['h',T('lv').h]].map(p=>`<button class="pill ${(ST.qzl||'all')===p[0]?'on':''}" onclick="ST.qzl='${p[0]}';startQuiz()">${p[1]}</button>`).join('')}</div>`+quizHtml(list)}
function startQuiz(){ST.qi=0;ST.qs=0;ST.qa=null;ST.qo=[];render()}
function quizHtml(list){if(!list.length)return `<div class="card glass neu">${T('noQ')}</div>`;
 if(!ST.qo.length)ST.qo=shuffle(list.map(q=>q.id),rng(Date.now()%99999));const id=ST.qo[ST.qi];
 if(!id)return `<div class="card glass neu"><h3>${T('done')}</h3><p>${T('doneTxt')(ST.qo.length,ST.qs)}</p><button class="btn" onclick="startQuiz()">${T('again')}</button></div>`;
 const q=allQ().find(x=>x.id===id);const ans=ST.qa!==null;
 let h=`<div class="card glass neu qzcard qzb${ST.qi%7}${ans?' qzans':''}"><div class="qzbody"><div class="meta"><span class="tag">${T('types')[q.t]}</span><span>${markTxt(q.mk)}</span><span>${ST.qi+1}/${ST.qo.length}</span></div><div class="qt">${esc(q.q)}</div>${q.img?`<div class="qpic"><img loading="lazy" src="${q.img}" alt=""></div>`:''}`;
 if(q.t==='mcq')h+='<div class="opts'+(q.o.some(o=>String(o).length>45)?' lg':'')+'">'+q.o.map((o,i)=>{let c='';if(ans){if(i===q.a)c='ok';else if(i===ST.qa)c='bad'}return `<div class="opt ${c}" onclick="ansQ(${i},${q.a})" style="cursor:pointer"><span class="ol">${'ABCD'[i]}</span><span class="ot">${esc(o)}</span></div>`}).join('')+'</div>';
 else if(ans)h+=ansHtml(q.a);
 h+='</div><div class="qzact">';
 if(q.t!=='mcq'&&!ans)h+=`<button class="btn" onclick="ST.qa=0;render()">${T('showAns')}</button>`;
 if(ans)h+=`<button class="btn" onclick="ST.qi++;ST.qa=null;render()">${T('next')}</button>`;
 return h+'</div></div>'}
function ansQ(i,a){if(ST.qa!==null)return;ST.qa=i;if(i===a)ST.qs++;render()}

function mcardHtml(c,click,icon){return `<button class="mcard" style="--ph:${c.ph};--c1:${c.c1};--c2:${c.c2};--ac:${c.ac}" onclick="${click}"><span class="mci">${icon}</span><span class="mct"><span class="k">${c.k}</span><span class="e">${c.e}</span>${c.q?`<span class="mq">${c.q}</span>`:''}</span><span class="marr">${ARW}</span></button>`}
function vMedium(){return `<div class="fade mv">${MED_LOGOS}<div class="mlist">${MED.map(m=>mcardHtml(m,`openMed('${m.id}')`,MED_ICON)).join('')}</div></div>`}
function vSem(){return `<div class="fade mv">${MED_LOGOS}<div class="mlist sem">${SEMS.map(x=>mcardHtml(Object.assign({},x,{q:qaLabel(semCount(x.n))}),`openSem(${x.n})`,CAP_ICON)).join('')}</div></div>`}
function openMed(id){ST.med=id;nav('sem',{med:id})}
function openSem(n){nav('home',{sem:n});const has=Object.keys(AVAIL).some(k=>(n===1)===k.startsWith('s1-'));if(ST.med!=='kn'||!has){setTimeout(()=>toast('ಈ ವಿಷಯ ಶೀಘ್ರದಲ್ಲೇ ಸೇರಿಸಲಾಗುವುದು'),250)}}
function render(){
 const hero=$('hero');hero.classList.toggle('sm',ST.view!=='medium'&&ST.view!=='sem'&&ST.view!=='home'&&ST.view!=='class'&&ST.view!=='subject');document.body.classList.toggle('vmed',ST.view==='medium'||ST.view==='sem');document.body.classList.toggle('vcls',ST.view==='class');document.body.classList.toggle('vsub',ST.view==='subject');{const qz=ST.view==='subject'&&ST.tab==='quiz';document.body.classList.toggle('vquiz',qz);document.documentElement.classList.toggle('vquiz',qz)}
 $('herop').textContent=(ST.view!=='subject')?'Shikshana Parva · ಕಲಿಕೆಯ ಹಬ್ಬ':'ಶಿಕ್ಷಕರಿಗಾಗಿ ಕಲಿಕಾ ಸಂಪನ್ಮೂಲ ವೇದಿಕೆ';
 $('bk').disabled=ST.view==='medium';
 let c=ST.view==='sem'?'':'<b>ಮುಖಪುಟ</b>';if(ST.cls)c+=` › ${ORD[ST.cls-1]} ತರಗತಿ`;if(ST.sub&&ST.view==='subject'&&cur())c+=` › <b>${cur().title}</b>`;$('crumb').innerHTML=c;
