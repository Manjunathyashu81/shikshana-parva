function ddT(k,e){if(e)e.stopPropagation();const d=document.getElementById('dd-'+k);const l=d.querySelector('.ddl');const open=l.style.display!=='none';document.querySelectorAll('.ddl').forEach(x=>x.style.display='none');document.querySelectorAll('.ddz').forEach(x=>x.style.zIndex='');l.style.display=open?'none':'block';if(!open){const c=d.closest('.card');if(c){c.classList.add('ddz');c.style.zIndex=200}}}

function colHtml(txt,L1='ರೂ.',L2='ಪೈ'){const lines=txt.split('\n');let i=0;
 const cell=(c,cls)=>`<span class="${cls||''}">${c}</span>`;
 let rows=cell('')+cell(L1,'h r')+cell('')+cell(L2,'h');
 while(i<lines.length&&lines[i].trim()!==''){const t=lines[i].trim();
   if(/^[-—]+$/.test(t))rows+=cell('','rule');
   else{const m=t.match(/^([+−-]?)\s*(\d+)\.(\d+)$/);
     if(m)rows+=cell(m[1]||'','op')+cell(m[2],'r')+cell('.','dot')+cell(m[3],'l');
     else rows+=cell(esc(t),'rule')}
   i++}
 const rest=lines.slice(i).join('\n').trim();
 return `<div class="ans"><b>${T('ans')}</b><div class="vsum">${rows}</div>${esc(rest)}</div>`}
function gridHtml(txt){const lines=txt.split('\n');let html='',rest=[],inG=true;
 lines.forEach(ln=>{if(inG&&ln.includes('|')){html+='<tr>'+ln.split('|').map(c=>{c=c.trim();const num=/^[\d.,₹\-]+$/.test(c)||/^\d/.test(c);return `<td class="${num?'n':''}">${esc(c)}</td>`}).join('')+'</tr>'}else{inG=false;rest.push(ln)}});
 return `<div class="ans"><b>${T('ans')}</b><div class="gridwrap"><table class="gtbl"><tbody>${html}</tbody></table></div>${esc(rest.join('\n').trim())}</div>`}
function ansHtml(a){a=String(a);
 if(a.startsWith('[COL]'))return colHtml(a.slice(5));
 if(a.startsWith('[COLM]'))return colHtml(a.slice(6),'ಮೀ','ಸೆಂ.ಮೀ');
 if(a.startsWith('[COLKG]'))return colHtml(a.slice(7),'kg','g');
 if(a.startsWith('[COLLM]'))return colHtml(a.slice(7),'ಲೀ','ಮಿಲೀ');
 if(a.startsWith('[GRID]'))return gridHtml(a.slice(6));
 if(a.startsWith('[TAB]')){let rows='',rest=[];a.slice(5).split('\n').forEach(ln=>{const i=ln.indexOf('|');if(i>0&&!rest.length){rows+=`<div class="trow"><span>${esc(ln.slice(0,i))}</span><span>${esc(ln.slice(i+1))}</span></div>`}else rest.push(ln)});return `<div class="ans"><b>${T('ans')}</b><div class="tbl">${rows}</div>${esc(rest.join('\n'))}</div>`}
 return `<div class="ans"><b>${T('ans')}</b> ${esc(a)}</div>`}

/* ===== ಪ್ರಶ್ನೆ ಪತ್ರಿಕೆಗಳು ===== */
const PT={unit:{max:20},fa3:{max:15},fa4:{max:15},sa2:{max:40}};
const QUOTA_KN={unit:{mcq:6,half:10,lang:2,short:2,long:1},fa3:{mcq:4,half:8,lang:2,short:1,long:1},fa4:{mcq:4,half:8,lang:2,short:1,long:1},sa2:{mcq:10,half:16,lang:4,short:6,long:2}};
const QUOTA_EN={unit:{mcq:8,half:14,short:1,long:1},fa3:{mcq:5,half:10,short:1,long:1},fa4:{mcq:5,half:10,short:1,long:1},sa2:{mcq:12,half:20,short:6,long:2}};
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function lessonNums(){return lessons().filter(l=>l.qb&&l.qb.length).map(l=>l.n)}
function halves(){const nums=lessonNums(),h=Math.ceil(nums.length/2);return {all:nums,f:nums.slice(0,h),s:nums.slice(h)}}
const rr=x=>x.length?`${x[0]}-${x[x.length-1]}`:'';
function selOpts(p){const H=halves(),L=lessons().filter(l=>H.all.includes(l.n));
 if(p==='unit')return {g:[],s:L.map(l=>[String(l.n),lessonLabel(l)])};
 const lb=x=>T('lessons')(x[0],x[x.length-1]);
 if(p==='fa3')return {g:[[rr(H.f),lb(H.f)]],s:[]};
 if(p==='fa4')return {g:[[rr(H.s),lb(H.s)]],s:[]};
 return {g:[[rr(H.all),T('allL')(H.all[0],H.all[H.all.length-1])],[rr(H.f),lb(H.f)],[rr(H.s),lb(H.s)]],s:[]}}
function ensureSel(p){const o=selOpts(p),ok=[...o.g.map(x=>x[0]),...o.s.map(x=>x[0])];if(!ok.includes(ST.sel[p]))ST.sel[p]=(o.g[0]||o.s[0])[0]}
function parseSel(v){const p=String(v).split('-').map(Number);const a=p[0],b=p[1]||p[0];return lessonNums().filter(n=>n>=a&&n<=b)}
function objOf(q){if(q.ob){const i=OBJ_K.indexOf(q.ob);if(i>=0)return i}return (q.t==='mcq'||q.t==='one')?0:(q.t==='long'?2:1)}
function buildPaper(){const P=ST.ptype,EN=ST.sub==='en',max=PT[P].max,quota=(EN?QUOTA_EN:QUOTA_KN)[P],ls=parseSel(ST.sel[P]);
 const pool=allQ().filter(q=>ls.includes(q.ch));
 const r=rng(ST.seed[P]*7919+ls.length*31+P.length);
 const types=['mcq','half','lang','short','long'];
 const MKt=t=>t==='half'?0.5:MK[t];
 const by={mcq:pool.filter(q=>q.t==='mcq'),half:pool.filter(q=>q.mk===0.5&&q.t!=='mcq'),lang:pool.filter(q=>q.t==='lang'),short:pool.filter(q=>q.t==='short'),long:pool.filter(q=>q.t==='long')};
 /* ಚಿತ್ರ ಪ್ರಶ್ನೆಗಳು ಮೊದಲು (ಗರಿಷ್ಠ 3) */
 Object.keys(by).forEach(k=>{const s=shuffle(by[k],r);by[k]=[...s.filter(q=>q.img),...s.filter(q=>!q.img)]});
 const pick={mcq:[],half:[],lang:[],short:[],long:[]},used=new Set();let imgN=0;
 const take=(t,n)=>{for(const q of by[t]){if(pick[t].length>=n)break;if(used.has(q.id))continue;if(q.img&&imgN>=3)continue;pick[t].push(q);used.add(q.id);if(q.img)imgN++}};
 types.forEach(t=>take(t,quota[t]||0));
 const sumMk=()=>types.reduce((s,t)=>s+pick[t].reduce((a,q)=>a+q.mk,0),0);
 let tot=sumMk(),k=0,guard=0;
 while(tot<max&&guard++<2000){const d=max-tot;let added=false;
  for(let i=0;i<types.length&&!added;i++){const t=types[(k+i)%types.length];if(MKt(t)>d)continue;const nx=by[t].find(q=>!used.has(q.id)&&!(q.img&&imgN>=3));if(nx){pick[t].push(nx);used.add(nx.id);if(nx.img)imgN++;tot+=MKt(t);added=true}}
  k++;if(!added)break}
 const secs=types.filter(t=>pick[t].length);
 const all=[];let n=1,body='';
 secs.forEach((t,si)=>{const qs=pick[t],m=MKt(t);all.push(...qs);
  body+=`<div class="sec"><b>${T('letters')[si]}. ${T('ins')[t]}</b> <span class="mk">(${qs.length} × ${fmt(m)} = ${fmt(qs.length*m)})</span>`;
  qs.forEach(q=>{body+=`<div class="pq"><div>${n++}. ${esc(q.q)}</div>${q.img?`<div class="qpic"><img loading="lazy" src="${q.img}" alt=""></div>`:''}`;
   if(q.t==='mcq')body+='<div class="po">'+q.o.map((o,i)=>`(${T('optL')[i]}) ${esc(o)}`).join(' &nbsp; ')+'</div>';
   if(ST.showAns)body+=`<div class="ans"><b>${T('ans')}</b> ${q.t==='mcq'?'('+T('optL')[q.a]+') '+esc(q.o[q.a]):esc(q.a)}</div>`;body+='</div>'});body+='</div>'});
 const tm=all.reduce((s,q)=>s+q.mk,0);
 ST.lastPicked=all;ST.lastLs=ls;
 return `<div class="paper fade" id="pp"><div class="ph"><div class="sch">${T('school')(ST.cls)} ${EN?'':'………………………………………………'}</div><b style="font-size:1.25em">${T('exam')[P]}</b><br>${T('cls')}: ${EN?ENG[ST.cls-1]:ORD[ST.cls-1]} | ${T('subj')}: ${cur().title} ${cur().part}<br>${T('time')}: ${T('times')[P]} | ${T('maxm')}: ${max}<br>${T('stu')}: ______________________ ${T('roll')}: ____</div>${body}<div class="ph" style="border:0;border-top:2px solid #232a45;padding-top:.6rem">${T('totalM')}: ${fmt(tm)}</div></div>`}

/* ===== ಬ್ಲೂಪ್ರಿಂಟ್ (ಮಾದರಿ ಪ್ರಶ್ನೆ ಪತ್ರಿಕೆಯಂತೆ) ===== */

 const t1=`<div class="tw"><table class="bpt"><thead><tr><th>${B.objs}</th>${o.map(x=>`<th>${x.n}${x.calc?'<br><small>'+T('calc')+'</small>':''}</th>`).join('')}<th>${B.total}</th></tr></thead><tbody><tr><td>${B.nq}</td>${o.map(x=>`<td>${x.q}</td>`).join('')}<td>${tq}</td></tr><tr class="tot"><td>${B.marks}</td>${o.map(x=>`<td>${fmt(x.m)}</td>`).join('')}<td>${fmt(max)}</td></tr><tr><td>${B.pct}</td>${o.map(x=>`<td>${pc(x.m)}</td>`).join('')}<td>100%</td></tr></tbody></table></div>`;

 const tbl=(rows,head)=>`<div class="tw"><table class="bpt"><thead><tr><th>${B.sl}</th><th>${head}</th><th>${B.nq}</th><th>${B.marks}</th><th>${B.pct}</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td class="l">${esc(r.n)}</td><td>${r.q}</td><td>${fmt(r.m)}</td><td>${pc(r.m)}</td></tr>`).join('')}<tr class="tot"><td colspan="2">${B.total}</td><td>${tq}</td><td>${fmt(tm)}</td><td>100%</td></tr></tbody></table></div>`;

 const drow=B.diffs.map((n,i)=>{const c='emh'[i];const f=qs.filter(q=>q.lv===c);return {n,q:f.length,m:f.reduce((s,q)=>s+q.mk,0)}});

 const colQ=Array(12).fill(0),colM=Array(12).fill(0);

  g+=`<td><b>${f.length}</b></td><td><b>${fmt(f.reduce((s,q)=>s+q.mk,0))}</b></td></tr>`});
 g+=`<tr class="tot"><td colspan="2">${B.totQ}</td>${colQ.map(x=>`<td>${x||''}</td>`).join('')}<td>${tq}</td><td></td></tr><tr class="tot"><td colspan="2">${B.totM}</td>${colM.map(x=>`<td>${x?fmt(x):''}</td>`).join('')}<td></td><td>${fmt(tm)}</td></tr></tbody></table></div><div class="chn">${B.note}</div>`;

 const lo=[['all',T('allCh')],...lessons().filter(l=>l.qb.length).map(l=>[String(l.n),lessonLabel(l)])];
 const to=[['all',T('allTypes')],...Object.keys(T('types')).map(k=>[k,T('types')[k]])];
 return `<div class="card glass neu nopr ddz"><div class="row"><div><label class="fl" style="margin-top:0">${T('chapter')}</label>${sel('qzc',lo,ST.qzc,'ST.qzc=value;startQuiz()')}</div><div><label class="fl" style="margin-top:0">${T('qtype')}</label>${sel('qzt',to,ST.qzt,'ST.qzt=value;startQuiz()')}</div></div></div>`+quizHtml(list)}
function startQuiz(){ST.qi=0;ST.qs=0;ST.qa=null;ST.qo=[];render()}
function quizHtml(list){if(!list.length)return `<div class="card glass neu">${T('noQ')}</div>`;
 if(!ST.qo.length)ST.qo=shuffle(list.map(q=>q.id),rng(Date.now()%99999));const id=ST.qo[ST.qi];
 if(!id)return `<div class="card glass neu"><h3>${T('done')}</h3><p>${T('doneTxt')(ST.qo.length,ST.qs)}</p><button class="btn" onclick="startQuiz()">${T('again')}</button></div>`;
 const q=allQ().find(x=>x.id===id);let h=`<div class="card glass neu"><div class="meta"><span class="tag">${T('types')[q.t]}</span><span>${markTxt(q.mk)}</span><span>${ST.qi+1}/${ST.qo.length}</span></div><div class="qt">${esc(q.q)}</div>${q.img?`<div class="qpic"><img loading="lazy" src="${q.img}" alt=""></div>`:''}`;
 if(q.t==='mcq')h+=q.o.map((o,i)=>{let c='';if(ST.qa!==null){if(i===q.a)c='ok';else if(i===ST.qa)c='bad'}return `<div class="opt ${c}" onclick="ansQ(${i},${q.a})" style="cursor:pointer"><span class="ol">${'ABCD'[i]}</span>${esc(o)}</div>`}).join('');
 else h+=ST.qa!==null?`<div class="ans"><b>${T('ans')}</b> ${esc(q.a)}</div>`:`<button class="btn" onclick="ST.qa=0;render()">${T('showAns')}</button>`;
 if(ST.qa!==null)h+=`<button class="btn" onclick="ST.qi++;ST.qa=null;render()">${T('next')}</button>`;return h+'</div>'}
function ansQ(i,a){if(ST.qa!==null)return;ST.qa=i;if(i===a)ST.qs++;render()}
/* ===== ರೆಂಡರ್ ===== */
function render(){
 const hero=$('hero');hero.classList.toggle('sm',ST.view!=='home');
 $('herop').textContent=ST.view==='home'?'Shikshana Parva · ಕಲಿಕೆಯ ಹಬ್ಬ':'ಶಿಕ್ಷಕರಿಗಾಗಿ ಕಲಿಕಾ ಸಂಪನ್ಮೂಲ ವೇದಿಕೆ';
 $('bk').disabled=ST.view==='home';
 let c='<b>ಮುಖಪುಟ</b>';if(ST.cls)c+=` › ${ORD[ST.cls-1]} ತರಗತಿ`;if(ST.sub&&ST.view==='subject'&&cur())c+=` › <b>${cur().title}</b>`;$('crumb').innerHTML=c;
 $('main').innerHTML=ST.view==='home'?vHome():ST.view==='class'?vClass():vSubject();}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
