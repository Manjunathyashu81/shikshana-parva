LSV.push({n:13,t:`ಅದ್ಭುತ ಯಂತ್ರ – ನಮ್ಮ ದೇಹ`,au:`ಸಮಿತಿ ರಚನೆ`,pg:1,
words:`ಉಸಿರಾಟ – ಗಾಳಿಯನ್ನು ಒಳಗೆ ತೆಗೆದುಕೊಂಡು ಹೊರಬಿಡುವ ಕ್ರಿಯೆ; ರಕ್ತ ಪರಿಚಲನೆ – ರಕ್ತವು ದೇಹದ ಎಲ್ಲ ಭಾಗಗಳಿಗೆ ಹರಿಯುವುದು; ಜೀರ್ಣಕ್ರಿಯೆ – ಆಹಾರ ಜೀರ್ಣವಾಗಿ ರಕ್ತವನ್ನು ಸೇರುವ ಕ್ರಿಯೆ; ವಿಸರ್ಜನೆ – ದೇಹದ ಕಶ್ಮಲಗಳನ್ನು ಹೊರಹಾಕುವುದು; ಕಶ್ಮಲ – ದೇಹಕ್ಕೆ ಬೇಡವಾದ ತ್ಯಾಜ್ಯ ವಸ್ತು; ಶ್ವಾಸಕೋಶ – ಉಸಿರಾಟದ ಅಂಗ; ಹೃದಯ – ರಕ್ತವನ್ನು ಪಂಪ್ ಮಾಡುವ ಅಂಗ; ಜಠರ – ಹೊಟ್ಟೆ; ಮೂತ್ರಪಿಂಡ – ರಕ್ತವನ್ನು ಶೋಧಿಸಿ ಮೂತ್ರ ಮಾಡುವ ಅಂಗ; ಬೆವರು – ಚರ್ಮದಿಂದ ಹೊರಬರುವ ನೀರು`,
notes:`ಉಸಿರಾಟ: ಮೂಗು → ಶ್ವಾಸನಾಳ → ಶ್ವಾಸಕೋಶ. ಆಕ್ಸಿಜನ್ ಒಳಗೆ, ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್ ಹೊರಗೆ. ರಕ್ತ ಪರಿಚಲನೆ: ಹೃದಯವು ಪಂಪ್‌ನಂತೆ ಕೆಲಸ ಮಾಡಿ ರಕ್ತನಾಳಗಳ ಮೂಲಕ ರಕ್ತವನ್ನು ತಲುಪಿಸುತ್ತದೆ; ಹೃದಯದ ಬಡಿತವನ್ನು ಸ್ಟೆತೋಸ್ಕೋಪ್‌ನಿಂದ ಕೇಳಬಹುದು. ಜೀರ್ಣಕ್ರಿಯೆ: ಬಾಯಿ → ಅನ್ನನಾಳ → ಜಠರ → ಸಣ್ಣ ಕರುಳು → ದೊಡ್ಡ ಕರುಳು → ಮಲದ್ವಾರ. ವಿಸರ್ಜನೆ: ಚರ್ಮ (ಬೆವರು), ಶ್ವಾಸಕೋಶ, ಮೂತ್ರಪಿಂಡ (ಮೂತ್ರ). ನಿನಗಿದು ಗೊತ್ತೆ?: 206 ಮೂಳೆಗಳು, 600ಕ್ಕೂ ಹೆಚ್ಚು ಕೀಲುಗಳು, ಸಣ್ಣ ಕರುಳು 21 ಅಡಿ, ಹೃದಯ ನಿಮಿಷಕ್ಕೆ ಸುಮಾರು 70 ಬಾರಿ ಮತ್ತು ದಿನಕ್ಕೆ ಒಂದು ಲಕ್ಷ ಬಾರಿ ಬಡಿಯುತ್ತದೆ, ಶ್ವಾಸಕೋಶದಲ್ಲಿ ಸುಮಾರು 3 ಲೀಟರ್ ಗಾಳಿ, ದೇಹದಲ್ಲಿ ಸುಮಾರು 5.5 ಲೀಟರ್ ರಕ್ತ, ರಕ್ತದಾನದ ನಂತರ 4–5 ವಾರಗಳಲ್ಲಿ ರಕ್ತ ಮತ್ತೆ ಉತ್ಪತ್ತಿಯಾಗುತ್ತದೆ.`,
ab:[
[`ಉಸಿರಾಟ`,[
[`ಗಾಳಿ ಒಳಗೆ–ಹೊರಗೆ ಹೋಗುವ ಅಂಗಗಳನ್ನು ಕ್ರಮವಾಗಿ ಬರೆ.`,`1. ಮೂಗು  2. ಶ್ವಾಸನಾಳ  3. ಶ್ವಾಸಕೋಶಗಳು`],
[`ಮೂಗಿನ ಮೂಲಕ ಒಳಗೆ ತೆಗೆದುಕೊಂಡ ಗಾಳಿಯಲ್ಲಿರುವ ಯಾವ ಅನಿಲ ದೇಹಕ್ಕೆ ಬೇಕು?`,`ಆಕ್ಸಿಜನ್.`],
[`ದೇಹಕ್ಕೆ ಬೇಡವಾದ ಯಾವ ಅನಿಲ ಉಸಿರಾಟದಲ್ಲಿ ಹೊರಹೋಗುತ್ತದೆ?`,`ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್.`],
[`ಉಸಿರಾಟ ಎಂದರೇನು?`,`ಆಕ್ಸಿಜನ್ ಅನ್ನು ಒಳಗೆ ತೆಗೆದುಕೊಂಡು ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್ ಅನ್ನು ಹೊರಬಿಡುವ ಕ್ರಿಯೆಗೆ ಉಸಿರಾಟ ಎನ್ನುವರು.`]]],
[`ರಕ್ತ ಪರಿಚಲನೆ`,[
[`ರಕ್ತ ಪರಿಚಲನೆಯ ಚಿತ್ರದ ಹೆಸರೇನು?`,`ಹೃದಯ.`],
[`ರಕ್ತದ ಬಣ್ಣವೇನು?`,`ಕೆಂಪು.`],
[`ವೈದ್ಯರು ಹೃದಯದ ಬಡಿತ ತಿಳಿಯಲು ಬಳಸುವ ಉಪಕರಣದ ಹೆಸರೇನು?`,`ಸ್ಟೆತೋಸ್ಕೋಪ್.`],
[`ಹೃದಯದ ಗಾತ್ರ ಎಷ್ಟಿರುತ್ತದೆ?`,`ನಮ್ಮ ಎಡಗೈ ಮುಷ್ಟಿಯಷ್ಟು.`],
[`ಹೃದಯವು ಎಲ್ಲಿದೆ? ಅದನ್ನು ಯಾವುದು ರಕ್ಷಿಸುತ್ತದೆ?`,`ಎರಡು ಶ್ವಾಸಕೋಶಗಳ ನಡುವೆ ಸ್ವಲ್ಪ ಎಡಭಾಗದಲ್ಲಿದೆ. ಎದೆಯ ಗೂಡು ಅದನ್ನು ರಕ್ಷಿಸುತ್ತದೆ.`],
[`ರಕ್ತ ಪರಿಚಲನೆ ಹೇಗೆ ನಡೆಯುತ್ತದೆ?`,`ಅಶುದ್ಧ ರಕ್ತ ರಕ್ತನಾಳಗಳ ಮೂಲಕ ಹೃದಯಕ್ಕೆ → ಹೃದಯದಿಂದ ಶ್ವಾಸಕೋಶಕ್ಕೆ (ಅಲ್ಲಿ ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್ ಬಿಟ್ಟು ಆಕ್ಸಿಜನ್ ಪಡೆದು ಶುದ್ಧವಾಗುತ್ತದೆ) → ಮತ್ತೆ ಹೃದಯಕ್ಕೆ → ಹೃದಯದಿಂದ ಶುದ್ಧ ರಕ್ತ ದೇಹದ ಎಲ್ಲ ಭಾಗಗಳಿಗೆ.`]]],
[`ಜೀರ್ಣಕ್ರಿಯೆ`,[
[`ಚಿತ್ರದಲ್ಲಿರುವ ಅಂಗಗಳ ಹೆಸರು ಬರೆ.`,`1. ಬಾಯಿ  2. ಗಂಟಲು  3. ಅನ್ನನಾಳ  4. ಜಠರ  5. ಸಣ್ಣ ಕರುಳು  6. ದೊಡ್ಡ ಕರುಳು  7. ಮಲದ್ವಾರ`],
[`ಆಹಾರವನ್ನು ಅಗಿಯಲು ಬಾಯಿಯ ಯಾವ ಭಾಗ ಸಹಾಯ ಮಾಡುತ್ತದೆ?`,`ಹಲ್ಲುಗಳು.`],
[`ನಾಲಿಗೆಯ ಕೆಲಸವೇನು?`,`ಆಹಾರದ ರುಚಿ ಸವಿಯುವುದು. (ಆಹಾರವನ್ನು ಬಾಯಿಯಲ್ಲಿ ಹೊರಳಿಸಲೂ ನೆರವಾಗುತ್ತದೆ.)`],
[`ಆಹಾರವು ಜಠರದಲ್ಲಿ ಎಷ್ಟು ಹೊತ್ತು ಇರುತ್ತದೆ?`,`ಸುಮಾರು ಮೂರು ಗಂಟೆಗಳವರೆಗೆ.`],
[`ಜೀರ್ಣಕ್ರಿಯೆ ಎಂದರೇನು?`,`ಆಹಾರವು ಜೀರ್ಣವಾಗಿ ರಕ್ತವನ್ನು ಸೇರುವ ಕ್ರಿಯೆಗೆ ಜೀರ್ಣಕ್ರಿಯೆ ಎನ್ನುವರು.`]]],
[`ವಿಸರ್ಜನಾ ಕ್ರಿಯೆ`,[
[`ಮೂತ್ರಾಂಗದ ಭಾಗಗಳನ್ನು ಬರೆ.`,`1. ಮೂತ್ರ ಪಿಂಡ  2. ಮೂತ್ರ ನಾಳ  3. ಮೂತ್ರ ಕೋಶ  4. ಮೂತ್ರ ದ್ವಾರ`],
[`ದೇಹದಿಂದ ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್ ಅನ್ನು ಹೊರಹಾಕುವ ಅಂಗ ಯಾವುದು?`,`ಶ್ವಾಸಕೋಶಗಳು.`],
[`ಕಶ್ಮಲಗಳನ್ನು ಬೆವರಿನ ರೂಪದಲ್ಲಿ ಹೊರಹಾಕುವ ಅಂಗ ಯಾವುದು?`,`ಚರ್ಮ.`],
[`ಕಶ್ಮಲಗಳನ್ನು ಮೂತ್ರವಾಗಿ ಹೊರಹಾಕುವ ಅಂಗ ಯಾವುದು?`,`ಮೂತ್ರ ಪಿಂಡಗಳು.`]]],
[`ಚಟುವಟಿಕೆ (ಮಾದರಿ ಉತ್ತರ)`,[
[`ಒಂದು ನಿಮಿಷಕ್ಕೆ ಎಷ್ಟು ಬಾರಿ ಉಸಿರಾಡುವೆ? ಎಣಿಸು.`,`ಮಾದರಿ ಉತ್ತರ: ಸುಮಾರು 15–20 ಬಾರಿ (ಮಕ್ಕಳು ತಮ್ಮದೇ ಎಣಿಕೆ ಬರೆಯಬೇಕು).`],
[`ಒಂದು ನಿಮಿಷಕ್ಕೆ ಹೃದಯ ಎಷ್ಟು ಸಲ ಬಡಿಯುತ್ತದೆ? ಎಣಿಸು.`,`ಮಾದರಿ ಉತ್ತರ: ಸುಮಾರು 70–90 ಬಾರಿ (ಮಕ್ಕಳು ತಮ್ಮದೇ ಎಣಿಕೆ ಬರೆಯಬೇಕು).`]]]
],
qb:[
M(`ಗಾಳಿಯಲ್ಲಿರುವ ಯಾವ ಅನಿಲ ನಮ್ಮ ದೇಹಕ್ಕೆ ಬೇಕು?`,[`ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್`,`ಆಕ್ಸಿಜನ್`,`ಸಾರಜನಕ`,`ಹೈಡ್ರೋಜನ್`],1),
M(`ಉಸಿರಾಟದ ಅಂಗಗಳು:`,[`ಹೃದಯ`,`ಮೂತ್ರ ಪಿಂಡ`,`ಶ್ವಾಸಕೋಶಗಳು`,`ಜಠರ`],2),
M(`ಹೃದಯದ ಗಾತ್ರ ಸುಮಾರು:`,[`ಎಡಗೈ ಮುಷ್ಟಿಯಷ್ಟು`,`ಕಲ್ಲಂಗಡಿಯಷ್ಟು`,`ಅಂಗೈಗಿಂತ ದೊಡ್ಡದು`,`ಬೆರಳಿನಷ್ಟು`],0),
M(`ಹೃದಯದ ಬಡಿತ ತಿಳಿಯಲು ವೈದ್ಯರು ಬಳಸುವ ಉಪಕರಣ:`,[`ಥರ್ಮಾಮೀಟರ್`,`ಸ್ಟೆತೋಸ್ಕೋಪ್`,`ಮೈಕ್ರೋಸ್ಕೋಪ್`,`ಟೆಲಿಸ್ಕೋಪ್`],1),
M(`ಆಹಾರ ಜಠರದಲ್ಲಿ ಸುಮಾರು ಎಷ್ಟು ಗಂಟೆ ಇರುತ್ತದೆ?`,[`ಒಂದು`,`ಎರಡು`,`ಮೂರು`,`ಹತ್ತು`],2),
M(`ಮೂತ್ರಾಂಗದ ಮುಖ್ಯ ಅಂಗ:`,[`ಮೂತ್ರ ಪಿಂಡ`,`ಶ್ವಾಸಕೋಶ`,`ಹೃದಯ`,`ಅನ್ನನಾಳ`],0),
M(`ದೇಹದಲ್ಲಿರುವ ಮೂಳೆಗಳ ಸಂಖ್ಯೆ:`,[`106`,`206`,`306`,`600`],1,'m'),
M(`ಮಾನವನ ದೇಹದಲ್ಲಿ ಸುಮಾರು ಎಷ್ಟು ಲೀಟರ್ ರಕ್ತವಿರುತ್ತದೆ?`,[`2.5`,`3`,`5.5`,`10`],2,'m'),
O(`ಉಸಿರಾಟ ಕ್ರಿಯೆಯಲ್ಲಿ ಹೊರಹೋಗುವ ಅನಿಲ ಯಾವುದು?`,`ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್.`),
O(`ಹೃದಯವನ್ನು ಯಾವುದು ರಕ್ಷಿಸುತ್ತದೆ?`,`ಎದೆಯ ಗೂಡು.`),
O(`ಆಹಾರವನ್ನು ಅಗಿಯಲು ಸಹಾಯ ಮಾಡುವ ಅಂಗ ಯಾವುದು?`,`ಹಲ್ಲುಗಳು.`),
O(`ದೇಹದ ಪ್ರಮುಖ ವಿಸರ್ಜನಾಂಗ ಯಾವುದು?`,`ಮೂತ್ರ ಪಿಂಡಗಳು.`),
O(`ಸಣ್ಣ ಕರುಳು ಎಷ್ಟು ಅಡಿ ಉದ್ದವಿರುತ್ತದೆ?`,`ಸುಮಾರು 21 ಅಡಿ.`),
O(`ದಿನಕ್ಕೆ ಎಷ್ಟು ಲೀಟರ್ ನೀರು ಕುಡಿಯಬೇಕು?`,`ಸುಮಾರು 2 ಲೀಟರ್.`),
G(`ಖಾಲಿ ಬಿಟ್ಟ ಸ್ಥಳ ತುಂಬಿ: ಹೃದಯವು ______ ನಂತೆ ಕೆಲಸ ಮಾಡಿ ರಕ್ತವನ್ನು ದೇಹದ ಎಲ್ಲ ಭಾಗಗಳಿಗೆ ತಲುಪಿಸುತ್ತದೆ.`,`ಪಂಪ್`),
G(`ಖಾಲಿ ಬಿಟ್ಟ ಸ್ಥಳ ತುಂಬಿ: ಆಹಾರವು ಬಾಯಿಯಿಂದ ______ ಮೂಲಕ ಜಠರಕ್ಕೆ ಹೋಗುತ್ತದೆ.`,`ಅನ್ನನಾಳ`),
G(`ಸರಿ/ತಪ್ಪು ಬರೆ: ಶ್ವಾಸಕೋಶಗಳ ಮೂಲಕ ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್ ದೇಹದಿಂದ ಹೊರಹೋಗುತ್ತದೆ.`,`ಸರಿ`),
G(`ಸರಿ/ತಪ್ಪು ಬರೆ: ಬಾಯಿಯ ಮೂಲಕ ಉಸಿರಾಡುವುದು ಒಳ್ಳೆಯ ಅಭ್ಯಾಸ.`,`ತಪ್ಪು. ಮೂಗಿನ ಮೂಲಕ ಉಸಿರಾಡಬೇಕು.`),
G(`ಜೀರ್ಣಕ್ರಿಯೆಯ ಅಂಗಗಳನ್ನು ಕ್ರಮವಾಗಿ ಬರೆ: ಜಠರ, ಬಾಯಿ, ದೊಡ್ಡ ಕರುಳು, ಅನ್ನನಾಳ, ಸಣ್ಣ ಕರುಳು.`,`ಬಾಯಿ → ಅನ್ನನಾಳ → ಜಠರ → ಸಣ್ಣ ಕರುಳು → ದೊಡ್ಡ ಕರುಳು`,'m'),
G(`ಹೊಂದಿಸಿ ಬರೆ: ಚರ್ಮ, ಶ್ವಾಸಕೋಶ, ಮೂತ್ರ ಪಿಂಡ – ಕಶ್ಮಲ ಹೊರಹಾಕುವ ರೂಪ (ಬೆವರು, ಮೂತ್ರ, ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್).`,`ಚರ್ಮ – ಬೆವರು; ಶ್ವಾಸಕೋಶ – ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್; ಮೂತ್ರ ಪಿಂಡ – ಮೂತ್ರ`,'m'),
S(`ಉಸಿರಾಟ ಕ್ರಿಯೆಗೆ ತೊಂದರೆಯಾಗದಂತೆ ಯಾವ ಆರೋಗ್ಯಕರ ಅಭ್ಯಾಸಗಳನ್ನು ಬೆಳೆಸಿಕೊಳ್ಳಬೇಕು? (ಯಾವುದಾದರೂ ಮೂರು)`,`ಸ್ನಾನ ಮಾಡುವಾಗ ಮೂಗನ್ನು ಸ್ವಚ್ಛಗೊಳಿಸಬೇಕು; ಮುಸುಕು ಹಾಕಿ ಮಲಗಬಾರದು; ದಟ್ಟ ಹೊಗೆ ಇರುವ ಕಡೆ ಹೋಗಬಾರದು; ಮೂಗಿಗೆ ಕಡ್ಡಿ, ಪೆನ್ನು ಹಾಕಬಾರದು; ಬಾಯಿಯ ಮೂಲಕ ಉಸಿರಾಡಬಾರದು.`),
S(`ಕೆಮ್ಮುವಾಗ ಅಥವಾ ಸೀನುವಾಗ ಕರವಸ್ತ್ರವನ್ನು ಬಾಯಿಗೆ ಅಡ್ಡವಾಗಿ ಹಿಡಿಯಬೇಕು ಏಕೆ?`,`ಬಾಯಿಯ ಮೂಲಕ ಕ್ರಿಮಿಗಳು ಗಾಳಿಯನ್ನು ಸೇರದಂತೆ ತಡೆಯಲು. ಇದರಿಂದ ಕೆಮ್ಮು ಅಥವಾ ನೆಗಡಿ ಇತರರಿಗೆ ಹರಡುವುದನ್ನು ತಪ್ಪಿಸಬಹುದು.`),
S(`ದೇಹವು ಕಶ್ಮಲಗಳನ್ನು ಯಾವ ಯಾವ ಅಂಗಗಳ ಮೂಲಕ ಹೊರಹಾಕುತ್ತದೆ?`,`ಚರ್ಮ (ಬೆವರು), ಶ್ವಾಸಕೋಶಗಳು (ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್) ಮತ್ತು ಮೂತ್ರ ಪಿಂಡಗಳು (ಮೂತ್ರ).`),
L(`ರಕ್ತ ಪರಿಚಲನೆ ಹೇಗೆ ನಡೆಯುತ್ತದೆ ಎಂಬುದನ್ನು ವಿವರಿಸು.`,`ಹೃದಯವು ಪಂಪ್‌ನಂತೆ ಕೆಲಸ ಮಾಡುತ್ತದೆ. ದೇಹದ ಭಾಗಗಳಿಂದ ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್ ಪಡೆದ ಅಶುದ್ಧ ರಕ್ತ ರಕ್ತನಾಳಗಳ ಮೂಲಕ ಹೃದಯವನ್ನು ಸೇರುತ್ತದೆ. ಹೃದಯದಿಂದ ಅದು ಶ್ವಾಸಕೋಶಗಳಿಗೆ ಹೋಗಿ ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್ ಬಿಟ್ಟು ಆಕ್ಸಿಜನ್ ಪಡೆದು ಶುದ್ಧವಾಗುತ್ತದೆ. ಶುದ್ಧ ರಕ್ತ ಮತ್ತೆ ಹೃದಯಕ್ಕೆ ಬಂದು, ಅಲ್ಲಿಂದ ರಕ್ತನಾಳಗಳ ಮೂಲಕ ದೇಹದ ಎಲ್ಲ ಭಾಗಗಳಿಗೆ ತಲುಪುತ್ತದೆ. ಇದೇ ರಕ್ತ ಪರಿಚಲನೆ.`),
L(`ಆಹಾರವು ಬಾಯಿಯಿಂದ ಮಲದ್ವಾರದವರೆಗೆ ಸಾಗುವ ದಾರಿಯನ್ನು ವಿವರಿಸು.`,`ಬಾಯಿಯಲ್ಲಿ ಹಲ್ಲುಗಳು ಆಹಾರವನ್ನು ಅಗಿದು ಸಣ್ಣ ಕಣಗಳನ್ನಾಗಿ ಮಾಡುತ್ತವೆ. ಮೆತ್ತಗಾದ ಆಹಾರ ಅನ್ನನಾಳದ ಮೂಲಕ ಜಠರವನ್ನು ಸೇರಿ ಅಲ್ಲಿ ಸುಮಾರು ಮೂರು ಗಂಟೆ ಇದ್ದು ಬಹಳಷ್ಟು ಜೀರ್ಣವಾಗುತ್ತದೆ. ನಂತರ ಸಣ್ಣ ಕರುಳಿನಲ್ಲಿ ಇನ್ನಷ್ಟು ಜೀರ್ಣವಾಗಿ ರಕ್ತವನ್ನು ಸೇರಿ ದೇಹದ ಎಲ್ಲ ಭಾಗಗಳಿಗೆ ತಲುಪುತ್ತದೆ. ಜೀರ್ಣವಾಗದ ಆಹಾರ ದೊಡ್ಡ ಕರುಳನ್ನು ಸೇರಿ ಮಲದ ರೂಪದಲ್ಲಿ ಮಲದ್ವಾರದ ಮೂಲಕ ಹೊರಹೋಗುತ್ತದೆ.`)
]});

LSV.push({n:14,t:`ಸಂಚಾರ ನಿಯಮಗಳು`,au:`ಸಮಿತಿ ರಚನೆ`,pg:12,
words:`ಸಂಚಾರ – ಓಡಾಟ; ಚೌಕ (ವೃತ್ತ) – ನಾಲ್ಕು ರಸ್ತೆಗಳು ಸೇರುವ ಸ್ಥಳ; ಝೀಬ್ರಾ ಪಟ್ಟಿ – ಪಾದಚಾರಿಗಳು ರಸ್ತೆ ದಾಟುವ ಬಿಳಿ ಪಟ್ಟಿಗಳು; ಸಂಕೇತ ದೀಪ – ಸಂಚಾರ ನಿಯಂತ್ರಣದ ದೀಪ; ಪಾದಚಾರಿ – ನಡೆದು ಹೋಗುವವನು; ಅಪಘಾತ – ಅವಘಡ; ಸೂಚನಾ ಫಲಕ – ಮಾಹಿತಿ ನೀಡುವ ಬೋರ್ಡ್; ಎಚ್ಚರಿಕೆ – ಜಾಗ್ರತೆ`,
notes:`ಸಂಚಾರ ಪೊಲೀಸರು ಚೌಕಗಳಲ್ಲಿ ವಾಹನ ಮತ್ತು ಜನರ ಸಂಚಾರವನ್ನು ನಿಯಂತ್ರಿಸುತ್ತಾರೆ. ಸಂಕೇತ ದೀಪ: ಕೆಂಪು – ನಿಲ್ಲಿ; ಹಳದಿ – ಸಿದ್ಧರಾಗಿ; ಹಸಿರು – ಹೋಗಿ. ಪಾದಚಾರಿಗಳಿಗೆ ಬೇರೆ ಸಂಕೇತ ದೀಪವಿದ್ದು ಅದರಲ್ಲಿ ಹಸಿರು ಬಂದಾಗ ಝೀಬ್ರಾ ಪಟ್ಟಿಯ ಮೂಲಕ ರಸ್ತೆ ದಾಟಬೇಕು. ನಿನಗಿದು ಗೊತ್ತೆ?: ಬೆಂಗಳೂರಿನಲ್ಲಿ ಬಸ್ ದಿನ ಆಚರಿಸಲಾಗುತ್ತದೆ; ಪ್ರತಿ ವರ್ಷ ಜನವರಿಯಲ್ಲಿ ರಸ್ತೆ ಸುರಕ್ಷತಾ ಸಪ್ತಾಹ; ತುರ್ತು ಚಿಕಿತ್ಸೆಗೆ 108 ಆಂಬುಲೆನ್ಸ್.`,
ab:[
[`ಚಿತ್ರಕಥೆ ಆಧಾರಿತ ಪ್ರಶ್ನೆಗಳು`,[
[`ಪಾದಚಾರಿಗಳು ರಸ್ತೆಯನ್ನು ಎಲ್ಲಿ ದಾಟಬೇಕು?`,`ಝೀಬ್ರಾ ಪಟ್ಟಿ ಹಾಕಿರುವ ಸ್ಥಳದಲ್ಲಿ.`],
[`ಸಂಕೇತ ದೀಪದಲ್ಲಿ ಯಾವ ಬಣ್ಣದ ದೀಪಗಳಿವೆ?`,`ಕೆಂಪು, ಹಳದಿ ಮತ್ತು ಹಸಿರು.`],
[`ಸಂಕೇತ ದೀಪಗಳಿಂದಾಗುವ ಒಂದು ಅನುಕೂಲವನ್ನು ಬರೆ.`,`ವಾಹನ–ವಾಹನಗಳ ನಡುವೆ ಅಥವಾ ವಾಹನ–ಪಾದಚಾರಿಗಳ ನಡುವೆ ಉಂಟಾಗುವ ಅಪಘಾತಗಳನ್ನು ತಡೆದು ಸುರಕ್ಷಿತ ಸಂಚಾರಕ್ಕೆ ಸಹಾಯ ಮಾಡುತ್ತವೆ.`],
[`ನೀನು ಶಾಲೆಗೆ ಬರುವ ದಾರಿಯಲ್ಲಿ ಸಂಕೇತ ದೀಪಗಳಿವೆಯೇ?`,`ಮಾದರಿ ಉತ್ತರ: ಹೌದು/ಇಲ್ಲ (ಮಕ್ಕಳು ತಮ್ಮ ಊರಿಗೆ ತಕ್ಕಂತೆ ಬರೆಯಬೇಕು).`],
[`ನೀನು ರಸ್ತೆ ದಾಟುವಾಗ ತೆಗೆದುಕೊಳ್ಳುವ ಎಚ್ಚರಿಕೆಗಳು ಯಾವುವು? ಏಕೆ?`,`ಮಾದರಿ ಉತ್ತರ: ಝೀಬ್ರಾ ಪಟ್ಟಿಯಲ್ಲಿ ದಾಟುತ್ತೇನೆ; ಎರಡೂ ಕಡೆ ನೋಡಿ ವಾಹನ ಬರುತ್ತಿಲ್ಲವೆಂದು ಖಚಿತಪಡಿಸಿಕೊಳ್ಳುತ್ತೇನೆ; ಪಾದಚಾರಿ ದೀಪ ಹಸಿರಾದಾಗ ದಾಟುತ್ತೇನೆ. ಏಕೆಂದರೆ ಅಪಘಾತ ತಪ್ಪಿಸಲು.`]]],
[`ಸಂಕೇತ ಮತ್ತು ಸೂಚನೆ ಹೊಂದಿಸು`,[
[`ರೈಲು ಹಳಿಯ ಚಿಹ್ನೆ`,`ಲೆವೆಲ್ ಕ್ರಾಸಿಂಗ್ ಗೇಟ್. ತೆಗೆದಿದೆಯೋ ಮುಚ್ಚಿದೆಯೋ ಎಂಬುದನ್ನು ಖಚಿತಪಡಿಸಿಕೊಂಡು ಚಲಿಸಬೇಕು.`],
[`ಆಸ್ಪತ್ರೆಯ ಚಿಹ್ನೆ (ಹಾಸಿಗೆ ಮತ್ತು +)`,`ಮುಂದೆ ಆಸ್ಪತ್ರೆ ಇದೆ. ವಾಹನದ ವೇಗವನ್ನು ಕಡಿಮೆಗೊಳಿಸಬೇಕು.`],
[`ರಸ್ತೆ ಉಬ್ಬಿನ ಚಿಹ್ನೆ`,`ರಸ್ತೆಯಲ್ಲಿ ಉಬ್ಬು ಇದೆ. ನಿಮ್ಮ ವಾಹನದ ವೇಗ ಕಡಿಮೆ ಮಾಡಬೇಕು.`],
[`ಎಡಕ್ಕೆ ತಿರುಗುವ ಬಾಣದ ಚಿಹ್ನೆ`,`ಎಡಕ್ಕೆ ಚಲಿಸಬೇಕು.`],
[`ಹಾರ್ನ್ ಮೇಲೆ ಅಡ್ಡ ಗೆರೆಯ ಚಿಹ್ನೆ`,`ಜೋರಾಗಿ ಶಬ್ದ ಮಾಡಬಾರದು.`],
[`P ಚಿಹ್ನೆ`,`ವಾಹನಗಳನ್ನು ನಿಲ್ಲಿಸಬಹುದು.`],
[`ಓಡುತ್ತಿರುವ ಮಕ್ಕಳ ಚಿಹ್ನೆ`,`ನಿಧಾನವಾಗಿ ಚಲಿಸಿ. (ಶಾಲೆ ಇದೆ.) ⚠ ಪಠ್ಯಪುಸ್ತಕದೊಂದಿಗೆ ಪರಿಶೀಲಿಸಿ.`]]],
[`ಸಂಚಾರ ನಿಯಮ – ಸರಿ/ತಪ್ಪು`,[
[`ರಸ್ತೆ ದಾಟಲು ಝೀಬ್ರಾ ಪಟ್ಟಿಯನ್ನು ಬಳಸಬೇಕು.`,`ಸರಿ.`],
[`ಸಂಕೇತ ದೀಪಗಳಿಲ್ಲದ ಕಡೆಗೆ ರಸ್ತೆಯ ಎಡಬಲಗಳಲ್ಲಿ ವಾಹನ ಬರುತ್ತಿದ್ದರೂ ರಸ್ತೆ ದಾಟಬಹುದು.`,`ತಪ್ಪು. ಸರಿ: ಎಡಬಲ ನೋಡಿ ವಾಹನ ಬರುತ್ತಿಲ್ಲವೆಂದು ಖಚಿತಪಡಿಸಿಕೊಂಡು ದಾಟಬೇಕು.`],
[`ರೈಲು ಬರುವಾಗ ರೈಲ್ವೆ ಲೆವೆಲ್ ಕ್ರಾಸಿಂಗ್ ದಾಟಬಹುದು.`,`ತಪ್ಪು. ಸರಿ: ರೈಲು ಬರುವಾಗ ಲೆವೆಲ್ ಕ್ರಾಸಿಂಗ್ ದಾಟಬಾರದು.`],
[`ರಸ್ತೆಯ ಮಧ್ಯೆ ಆಟ ಆಡಬಾರದು.`,`ಸರಿ.`],
[`ವಾಹನ ಚಲಿಸುತ್ತಿರುವಾಗ ಹತ್ತಬಹುದು ಅಥವಾ ಇಳಿಯಬಹುದು.`,`ತಪ್ಪು. ಸರಿ: ವಾಹನ ಚಲಿಸುತ್ತಿರುವಾಗ ಹತ್ತಬಾರದು, ಇಳಿಯಬಾರದು.`],
[`ಸರದಿ ಸಾಲಿನಲ್ಲಿ ನಿಂತು ವಾಹನವನ್ನು ಹತ್ತಬೇಕು.`,`ಸರಿ.`],
[`ಪಾದಚಾರಿಗಳು ರಸ್ತೆ ಬಲಬದಿಯಲ್ಲಿ ನಡೆಯಬೇಕು.`,`ಸರಿ. ⚠ ಪಠ್ಯಪುಸ್ತಕದೊಂದಿಗೆ ಪರಿಶೀಲಿಸಿ.`]]],
[`ಅಪಘಾತ ಸನ್ನಿವೇಶ – ಎಚ್ಚರಿಕೆ (ಮಾದರಿ)`,[
[`ವಿದ್ಯುತ್ ಉಪಕರಣಗಳನ್ನು ಬಳಸುವಾಗ`,`ಒದ್ದೆ ಕೈಯಲ್ಲಿ ಮುಟ್ಟಬಾರದು; ಸ್ವಿಚ್ ಆಫ್ ಮಾಡಿ ಪ್ಲಗ್ ತೆಗೆಯಬೇಕು.`],
[`ಗ್ಯಾಸ್ ಒಲೆ`,`ಉಪಯೋಗದ ನಂತರ ರೆಗ್ಯುಲೇಟರ್ ಆಫ್ ಮಾಡಬೇಕು; ಹಿರಿಯರ ಸಮ್ಮುಖದಲ್ಲಿ ಮಾತ್ರ ಬಳಸಬೇಕು.`],
[`ಚಾಕು, ಬ್ಲೇಡು`,`ಹಿರಿಯರ ಸಹಾಯದಿಂದ ಜಾಗರೂಕತೆಯಿಂದ ಬಳಸಬೇಕು; ಉಪಯೋಗಿಸಿದ ನಂತರ ಸುರಕ್ಷಿತವಾಗಿ ಇಡಬೇಕು.`]]]
],
qb:[
M(`ಸಂಕೇತ ದೀಪದಲ್ಲಿ ಕೆಂಪು ದೀಪ ಹತ್ತಿದಾಗ ವಾಹನಗಳು:`,[`ಹೋಗಬೇಕು`,`ನಿಲ್ಲಬೇಕು`,`ವೇಗವಾಗಿ ಹೋಗಬೇಕು`,`ತಿರುಗಬೇಕು`],1),
M(`ಹಸಿರು ದೀಪ ಏನನ್ನು ಸೂಚಿಸುತ್ತದೆ?`,[`ನಿಲ್ಲಿ`,`ಸಿದ್ಧರಾಗಿ`,`ಹೋಗಿ`,`ಹಿಂದೆ ಹೋಗಿ`],2),
M(`ಹಳದಿ ದೀಪ ಏನನ್ನು ಸೂಚಿಸುತ್ತದೆ?`,[`ನಿಲ್ಲಿ`,`ಸಿದ್ಧರಾಗಿ`,`ಹೋಗಿ`,`ವೇಗ ಹೆಚ್ಚಿಸಿ`],1),
M(`ಪಾದಚಾರಿಗಳು ರಸ್ತೆ ದಾಟುವ ಜಾಗ:`,[`ರಸ್ತೆಯ ಮಧ್ಯ`,`ಝೀಬ್ರಾ ಪಟ್ಟಿ`,`ಯಾವುದೇ ಜಾಗ`,`ತಿರುವು`],1),
M(`ಝೀಬ್ರಾ ಪಟ್ಟಿಯನ್ನು ಹೋಲುವ ಪ್ರಾಣಿ:`,[`ಹುಲಿ`,`ಜೀಬ್ರಾ`,`ಚಿರತೆ`,`ಕುದುರೆ`],1),
M(`ತುರ್ತು ಚಿಕಿತ್ಸೆಗೆ ನಮ್ಮ ರಾಜ್ಯದಲ್ಲಿರುವ ಆಂಬುಲೆನ್ಸ್ ಸಂಖ್ಯೆ:`,[`100`,`101`,`108`,`112`],2),
M(`ಸಂಚಾರ ಪೊಲೀಸರು ವಾಹನಗಳ ಸಂಚಾರವನ್ನು ನಿಯಂತ್ರಿಸುವ ಸ್ಥಳ:`,[`ಮನೆ`,`ಚೌಕ (ವೃತ್ತ)`,`ಶಾಲೆ`,`ಅಂಗಡಿ`],1),
M(`'ಮುಂದೆ ಆಸ್ಪತ್ರೆ ಇದೆ' ಎಂದಾಗ ನಾವು:`,[`ವೇಗ ಹೆಚ್ಚಿಸಬೇಕು`,`ವೇಗ ಕಡಿಮೆ ಮಾಡಬೇಕು`,`ಹಾರ್ನ್ ಮಾಡಬೇಕು`,`ವಾಹನ ನಿಲ್ಲಿಸಬೇಕು`],1,'m'),
O(`ನಾಲ್ಕು ರಸ್ತೆಗಳು ಸೇರುವ ಸ್ಥಳವನ್ನು ಏನೆನ್ನುವರು?`,`ಚೌಕ (ವೃತ್ತ).`),
O(`ಝೀಬ್ರಾ ಪಟ್ಟಿಯ ಬಣ್ಣ ಯಾವುದು?`,`ಬಿಳಿ.`),
O(`ಸಂಕೇತ ದೀಪವನ್ನು ಸಾಮಾನ್ಯವಾಗಿ ಎಲ್ಲಿ ಹಾಕುತ್ತಾರೆ?`,`ರಸ್ತೆಗಳು ಸೇರುವ ಚೌಕ ಅಥವಾ ವೃತ್ತದಲ್ಲಿ.`),
O(`ಬೆಂಗಳೂರಿನಲ್ಲಿ ಯಾವ ದಿನವನ್ನು ಆಚರಿಸಲಾಗುತ್ತದೆ?`,`ಬಸ್ ದಿನ.`),
O(`ರಸ್ತೆ ಸುರಕ್ಷತಾ ಸಪ್ತಾಹವನ್ನು ವರ್ಷದ ಯಾವ ತಿಂಗಳಲ್ಲಿ ಆಚರಿಸುತ್ತಾರೆ?`,`ಜನವರಿ ತಿಂಗಳಲ್ಲಿ.`),
O(`ಪಾದಚಾರಿಗಳಿಗೆ ಯಾವ ಬಣ್ಣದ ಸಂಕೇತ ಬಂದಾಗ ರಸ್ತೆ ದಾಟಬಹುದು?`,`ಹಸಿರು.`),
G(`ಖಾಲಿ ಬಿಟ್ಟ ಸ್ಥಳ ತುಂಬಿ: ಕೆಂಪು ದೀಪವು ______ ಎಂಬ ಸೂಚನೆ ನೀಡುತ್ತದೆ.`,`ನಿಲ್ಲಿ`),
G(`ಖಾಲಿ ಬಿಟ್ಟ ಸ್ಥಳ ತುಂಬಿ: ಸಂಚಾರ ನಿಯಮಗಳನ್ನು ಸರಿಯಾಗಿ ಅನುಸರಿಸಿದರೆ ರಸ್ತೆ ______ ತಪ್ಪಿಸಬಹುದು.`,`ಅಪಘಾತಗಳನ್ನು`),
G(`ಸರಿ/ತಪ್ಪು ಬರೆ: ರೈಲು ಬರುವಾಗ ಲೆವೆಲ್ ಕ್ರಾಸಿಂಗ್ ದಾಟಬಹುದು.`,`ತಪ್ಪು`),
G(`ಸರಿ/ತಪ್ಪು ಬರೆ: ರಸ್ತೆಯ ಮಧ್ಯದಲ್ಲಿ ಆಟ ಆಡಬಾರದು.`,`ಸರಿ`),
G(`ಹೊಂದಿಸಿ ಬರೆ: ಕೆಂಪು, ಹಳದಿ, ಹಸಿರು – (ಹೋಗಿ, ನಿಲ್ಲಿ, ಸಿದ್ಧರಾಗಿ).`,`ಕೆಂಪು – ನಿಲ್ಲಿ; ಹಳದಿ – ಸಿದ್ಧರಾಗಿ; ಹಸಿರು – ಹೋಗಿ`,'m'),
G(`ರಸ್ತೆ ಅಪಘಾತ ತಪ್ಪಿಸಲು ಒಂದು ಎಚ್ಚರಿಕೆಯನ್ನು ಬರೆ.`,`ಝೀಬ್ರಾ ಪಟ್ಟಿಯಲ್ಲಿ ಮಾತ್ರ ರಸ್ತೆ ದಾಟಬೇಕು. (ಮಾದರಿ ಉತ್ತರ)`,'m'),
S(`ಸಂಕೇತ ದೀಪಗಳು ಏಕೆ ಬೇಕು?`,`ವೃತ್ತ/ಚೌಕಗಳ ಬಳಿ ವಾಹನ–ವಾಹನಗಳ ನಡುವೆ ಅಥವಾ ವಾಹನ–ಪಾದಚಾರಿಗಳ ನಡುವೆ ಉಂಟಾಗುವ ಅಪಘಾತಗಳನ್ನು ತಡೆದು, ಸುರಕ್ಷಿತ ಸಂಚಾರಕ್ಕಾಗಿ ಸಂಕೇತ ದೀಪಗಳನ್ನು ಹಾಕುತ್ತಾರೆ.`),
S(`ಝೀಬ್ರಾ ಪಟ್ಟಿ ಎಂದರೇನು? ಅದನ್ನು ಹಾಗೆ ಏಕೆ ಕರೆಯುತ್ತಾರೆ?`,`ರಸ್ತೆಯ ಮಧ್ಯದಲ್ಲಿ ಹಾಕಿರುವ ಬಿಳಿ ಪಟ್ಟಿಗಳು; ಪಾದಚಾರಿಗಳು ರಸ್ತೆ ದಾಟುವ ಜಾಗ. ಝೀಬ್ರಾ ಪ್ರಾಣಿಯ ಮೈಮೇಲಿನ ಪಟ್ಟಿಯನ್ನು ಹೋಲುವುದರಿಂದ ಈ ಹೆಸರು.`),
S(`ಸಂಚಾರ ನಿಯಮಗಳ ಪಾಲನೆಯಿಂದಾಗುವ ಎರಡು ಅನುಕೂಲಗಳನ್ನು ಬರೆ.`,`ರಸ್ತೆ ಅಪಘಾತಗಳನ್ನು ತಪ್ಪಿಸಬಹುದು; ನಮ್ಮ ಮತ್ತು ವಾಹನಗಳ ಸುರಕ್ಷತೆ ಹೆಚ್ಚುತ್ತದೆ; ಸಂಚಾರ ಸುಗಮವಾಗುತ್ತದೆ.`),
L(`ಸಂಕೇತ ದೀಪದ ಮೂರು ಬಣ್ಣಗಳು ಮತ್ತು ಅವುಗಳ ಸೂಚನೆಗಳನ್ನು ವಿವರಿಸು.`,`ಸಂಕೇತ ದೀಪದಲ್ಲಿ ಕೆಂಪು, ಹಳದಿ ಮತ್ತು ಹಸಿರು ದೀಪಗಳಿವೆ. ಕೆಂಪು ದೀಪವು 'ನಿಲ್ಲಿ' ಎಂದು ಸೂಚಿಸುತ್ತದೆ, ಹಳದಿ ದೀಪವು 'ಸಿದ್ಧರಾಗಿ' ಎಂದು ಸೂಚಿಸುತ್ತದೆ, ಹಸಿರು ದೀಪವು 'ಹೋಗಿ' ಎಂದು ಸೂಚಿಸುತ್ತದೆ. ಪಾದಚಾರಿಗಳಿಗೆ ಬೇರೆಯೇ ಸಂಕೇತ ದೀಪವಿದ್ದು, ಅದರಲ್ಲಿ ಹಸಿರು ಬಂದಾಗ ಮಾತ್ರ ಝೀಬ್ರಾ ಪಟ್ಟಿಯ ಮೂಲಕ ರಸ್ತೆ ದಾಟಬೇಕು.`),
L(`ರಸ್ತೆ ದಾಟುವಾಗ ಮತ್ತು ವಾಹನದಲ್ಲಿ ಪ್ರಯಾಣಿಸುವಾಗ ಪಾಲಿಸಬೇಕಾದ ಸಂಚಾರ ನಿಯಮಗಳನ್ನು ಬರೆ.`,`ರಸ್ತೆ ದಾಟಲು ಝೀಬ್ರಾ ಪಟ್ಟಿಯನ್ನು ಬಳಸಬೇಕು. ಸಂಕೇತ ದೀಪಗಳಿಲ್ಲದ ಕಡೆ ಎಡಬಲ ನೋಡಿ ವಾಹನ ಬರುತ್ತಿಲ್ಲವೆಂದು ಖಚಿತಪಡಿಸಿಕೊಂಡು ದಾಟಬೇಕು. ರೈಲು ಬರುವಾಗ ಲೆವೆಲ್ ಕ್ರಾಸಿಂಗ್ ದಾಟಬಾರದು. ರಸ್ತೆಯ ಮಧ್ಯದಲ್ಲಿ ಆಟ ಆಡಬಾರದು. ವಾಹನ ಚಲಿಸುತ್ತಿರುವಾಗ ಹತ್ತಬಾರದು, ಇಳಿಯಬಾರದು; ಸರದಿ ಸಾಲಿನಲ್ಲಿ ನಿಂತು ಹತ್ತಬೇಕು.`)
]});

LSV.push({n:15,t:`ಸಾರಿಗೆ ಮತ್ತು ಸಂಪರ್ಕ`,au:`ಸಮಿತಿ ರಚನೆ`,pg:21,
words:`ಸಾರಿಗೆ – ಒಂದು ಸ್ಥಳದಿಂದ ಇನ್ನೊಂದು ಸ್ಥಳಕ್ಕೆ ಹೋಗುವ/ಸಾಗಿಸುವ ವ್ಯವಸ್ಥೆ; ಸಾಗಾಣಿಕೆ – ವಸ್ತುಗಳನ್ನು ಸಾಗಿಸುವುದು; ಸಂಪರ್ಕ – ಒಬ್ಬರಿಗೊಬ್ಬರು ಮಾಹಿತಿ ಹಂಚಿಕೊಳ್ಳುವುದು; ಅಂಚೆ ಕಚೇರಿ – ಪತ್ರ, ಪಾರ್ಸೆಲ್ ಕಳುಹಿಸುವ ಕಚೇರಿ; ಅಂಚೆಯಣ್ಣ – ಪತ್ರ ಹಂಚುವವನು; ಸಂವೇದನಾಶೀಲತೆ – ಇತರರ ನೋವು–ನಲಿವಿಗೆ ಸ್ಪಂದಿಸುವ ಗುಣ; ದೂರವಾಣಿ – ಟೆಲಿಫೋನ್; ದೂರದರ್ಶನ – ಟಿ.ವಿ.; ಗಣಕಯಂತ್ರ – ಕಂಪ್ಯೂಟರ್`,
notes:`ಹಿಂದಿನ ಕಾಲದಲ್ಲಿ ಎತ್ತು, ಕುದುರೆ, ಒಂಟೆ, ಆನೆ, ಕತ್ತೆ ಮುಂತಾದ ಪ್ರಾಣಿಗಳನ್ನು ಸಾರಿಗೆಗೆ ಬಳಸುತ್ತಿದ್ದರು. ನಂತರ ಸೈಕಲ್, ಕಾರು, ರೈಲು, ಹಡಗು, ವಿಮಾನ ಬಂದವು. ಸಂಪರ್ಕ ಸಾಧನಗಳು: ಪತ್ರ (ಅಂಚೆ), ದೂರವಾಣಿ, ವೃತ್ತಪತ್ರಿಕೆ, ರೇಡಿಯೋ, ದೂರದರ್ಶನ, ಗಣಕಯಂತ್ರ (ಇಂಟರ್ನೆಟ್). ಅಂಚೆ ಕಚೇರಿ ಸೇವೆಗಳು: ಅಂಚೆ ಚೀಟಿ, ಅಂಚೆ ಪತ್ರ, ಪಾರ್ಸೆಲ್, ಸ್ಪೀಡ್ ಪೋಸ್ಟ್. ಕಂಡುಹಿಡಿದವರು: ರೈಟ್ ಸಹೋದರರು – ವಿಮಾನ; ಗ್ರಹಾಂ ಬೆಲ್ – ದೂರವಾಣಿ; ಚಾರ್ಲ್ಸ್ ಬ್ಯಾಬೇಜ್ – ಗಣಕ ಯಂತ್ರ; ಜಾನ್ ಬೈಯರ್ಡ್ – ದೂರದರ್ಶನ; ಮಾರ್ಕೋನಿ – ರೇಡಿಯೋ.`,
ab:[
[`ಪ್ರಾಣಿಗಳು ಮತ್ತು ಸಾರಿಗೆ`,[
[`ಚಿತ್ರಗಳಲ್ಲಿ ಸಾರಿಗೆಗೆ ಬಳಸುವ ಯಾವ ಪ್ರಾಣಿಗಳಿವೆ?`,`ಎತ್ತು (ಎತ್ತಿನ ಬಂಡಿ), ಕುದುರೆ (ಕುದುರೆ ಗಾಡಿ), ಒಂಟೆ, ಆನೆ ಮತ್ತು ಭಾರ ಹೊರುವ ಪ್ರಾಣಿ. ⚠ ಕೊನೆಯ ಚಿತ್ರವನ್ನು ಪಠ್ಯಪುಸ್ತಕದೊಂದಿಗೆ ಪರಿಶೀಲಿಸಿ.`],
[`ನಿನ್ನ ಊರಿನಲ್ಲಿ ಪ್ರಾಣಿಗಳನ್ನು ಸಾರಿಗೆಗೆ ಬಳಸುತ್ತಾರೆಯೇ? ಯಾವ ಯಾವ ಪ್ರಾಣಿಗಳು? ಯಾವ ಕೆಲಸಕ್ಕೆ?`,`ಮಾದರಿ ಉತ್ತರ: ಹೌದು, ಎತ್ತುಗಳನ್ನು ಬಂಡಿ ಎಳೆಯಲು, ಹೊಲದ ಕೆಲಸಕ್ಕೆ ಮತ್ತು ಸರಕು ಸಾಗಿಸಲು ಬಳಸುತ್ತಾರೆ.`],
[`ಸಾರಿಗೆಯಲ್ಲಾದ ಬದಲಾವಣೆಯನ್ನು ಅನುಕ್ರಮವಾಗಿ ಬರೆ.`,`ತಲೆಯ ಮೇಲೆ/ಹೆಗಲ ಮೇಲೆ ಹೊರುವುದು → ಪ್ರಾಣಿಗಳು (ಎತ್ತಿನ ಬಂಡಿ, ಕುದುರೆ ಗಾಡಿ) → ಸೈಕಲ್ → ಕಾರು → ರೈಲು → ಹಡಗು → ವಿಮಾನ. ⚠ ಪಠ್ಯಪುಸ್ತಕದ ಚಿತ್ರಗಳ ಕ್ರಮ ಪರಿಶೀಲಿಸಿ.`],
[`ಸಾರಿಗೆಗಾಗಿ ಬಳಸುವ ಪ್ರಾಣಿಗಳ ಮೇಲೆ ನಮಗೆ ಯಾವ ಭಾವನೆ ಇರಬೇಕು?`,`ಪ್ರೀತಿ ಹಾಗೂ ಸಂವೇದನಾಶೀಲತೆ ಇರಬೇಕು.`]]],
[`ಅಂಚೆ ಕಚೇರಿ ಮತ್ತು ಸಂಪರ್ಕ ಸಾಧನಗಳು`,[
[`ಅಂಚೆ ಕಚೇರಿಯಲ್ಲಿ ದೊರೆಯುವ/ಕಳುಹಿಸುವ ಯಾವುವು?`,`ಅಂಚೆ ಚೀಟಿ, ಅಂಚೆ ಪತ್ರ, ಪಾರ್ಸೆಲ್ ಮತ್ತು ಸ್ಪೀಡ್ ಪೋಸ್ಟ್.`],
[`ಅತಿ ದೂರದಲ್ಲಿರುವವರೊಂದಿಗೆ ನೇರವಾಗಿ ಮಾತನಾಡಲು ಬಳಸುವ ಸಾಧನ ಯಾವುದು?`,`ದೂರವಾಣಿ (ಟೆಲಿಫೋನ್).`],
[`ಪ್ರಪಂಚದ ಯಾವುದೇ ಮಾಹಿತಿಯನ್ನು ಅತಿ ವೇಗವಾಗಿ ಪಡೆಯಲು ಅಥವಾ ಕಳುಹಿಸಲು ಸಹಾಯ ಮಾಡುವ ಅದ್ಭುತ ಸಂಪರ್ಕ ಸಾಧನ ಯಾವುದು?`,`ಗಣಕಯಂತ್ರ (ಕಂಪ್ಯೂಟರ್/ಇಂಟರ್ನೆಟ್).`],
[`ದೇಶ–ವಿದೇಶಗಳ ಪ್ರತಿದಿನದ ಸುದ್ದಿ ತಿಳಿಸುವ ಸಂಪರ್ಕ ಸಾಧನ ಯಾವುದು?`,`ವೃತ್ತಪತ್ರಿಕೆ.`],
[`ಮನರಂಜನೆಯೊಂದಿಗೆ ಸುದ್ದಿಯನ್ನು ಕೇಳಿ ತಿಳಿಯುವ ಸಾಧನ ಯಾವುದು?`,`ರೇಡಿಯೋ.`],
[`ನೋಡಿ, ಕೇಳಿ ತಿಳಿಯಲು ಸಾಧ್ಯವಾಗುವ ಆಕರ್ಷಣೀಯ ಸಾಧನ ಯಾವುದು?`,`ದೂರದರ್ಶನ (ಟಿ.ವಿ.).`]]],
[`ಕಂಡು ಹಿಡಿದವರು`,[
[`ವಿಮಾನವನ್ನು ಕಂಡುಹಿಡಿದವರು ಯಾರು?`,`ರೈಟ್ ಸಹೋದರರು.`],
[`ದೂರವಾಣಿಯನ್ನು ಕಂಡುಹಿಡಿದವರು ಯಾರು?`,`ಗ್ರಹಾಂ ಬೆಲ್.`],
[`ಗಣಕ ಯಂತ್ರವನ್ನು ಕಂಡುಹಿಡಿದವರು ಯಾರು?`,`ಚಾರ್ಲ್ಸ್ ಬ್ಯಾಬೇಜ್.`],
[`ದೂರದರ್ಶನವನ್ನು ಕಂಡುಹಿಡಿದವರು ಯಾರು?`,`ಜಾನ್ ಬೈಯರ್ಡ್.`],
[`ರೇಡಿಯೋವನ್ನು ಕಂಡುಹಿಡಿದವರು ಯಾರು?`,`ಮಾರ್ಕೋನಿ.`]]]
],
qb:[
M(`ಸಾರಿಗೆಗೆ ಬಳಸಲಾದ ಮೊಟ್ಟ ಮೊದಲ ಪ್ರಾಣಿ:`,[`ಕುದುರೆ`,`ನಾಯಿ`,`ಎತ್ತು`,`ಆನೆ`],1),
M(`ಮರುಭೂಮಿಯ ಹಡಗು ಎಂದು ಕರೆಯುವ ಪ್ರಾಣಿ:`,[`ಒಂಟೆ`,`ಕುದುರೆ`,`ಆನೆ`,`ಕತ್ತೆ`],0),
M(`ವಿಮಾನವನ್ನು ಕಂಡುಹಿಡಿದವರು:`,[`ಮಾರ್ಕೋನಿ`,`ರೈಟ್ ಸಹೋದರರು`,`ಗ್ರಹಾಂ ಬೆಲ್`,`ಬ್ಯಾಬೇಜ್`],1),
M(`ದೂರವಾಣಿಯನ್ನು ಕಂಡುಹಿಡಿದವರು:`,[`ಜಾನ್ ಬೈಯರ್ಡ್`,`ಮಾರ್ಕೋನಿ`,`ಗ್ರಹಾಂ ಬೆಲ್`,`ರೈಟ್ ಸಹೋದರರು`],2),
M(`ರೇಡಿಯೋ ಕಂಡುಹಿಡಿದವರು:`,[`ಮಾರ್ಕೋನಿ`,`ಬ್ಯಾಬೇಜ್`,`ಬೈಯರ್ಡ್`,`ಬೆಲ್`],0),
M(`ಭಾರತದ ಪ್ರಧಾನ ಸಾರಿಗೆ ಸಾಧನ:`,[`ವಿಮಾನ`,`ರೈಲು`,`ಹಡಗು`,`ಸೈಕಲ್`],1),
M(`ನೀರಿನ ಆಳದಲ್ಲಿ ಸಂಚರಿಸುವ ನೌಕೆ:`,[`ಸ್ಟೀಮರ್`,`ದೋಣಿ`,`ಸಬ್‌ಮರಿನ್`,`ಹಡಗು`],2),

O(`ಅಂಚೆ ಪತ್ರಗಳನ್ನು ಹಾಕುವ ಡಬ್ಬಿಯ ಬಣ್ಣ ಯಾವುದು?`,`ಕೆಂಪು.`),

G(`ಖಾಲಿ ಬಿಟ್ಟ ಸ್ಥಳ ತುಂಬಿ: ______ ಪತ್ರಿಕೆ ಹದಿನೈದು ದಿನಕ್ಕೊಮ್ಮೆ ಬರುತ್ತದೆ.`,`ಪಾಕ್ಷಿಕ`),

G(`ಹೊಂದಿಸಿ ಬರೆ: ಬೆಲ್, ಮಾರ್ಕೋನಿ, ಬ್ಯಾಬೇಜ್ – (ದೂರವಾಣಿ, ರೇಡಿಯೋ, ಗಣಕ ಯಂತ್ರ).`,`ಬೆಲ್ – ದೂರವಾಣಿ; ಮಾರ್ಕೋನಿ – ರೇಡಿಯೋ; ಬ್ಯಾಬೇಜ್ – ಗಣಕ ಯಂತ್ರ`,'m'),
G(`ಸರಿ/ತಪ್ಪು ಬರೆ: ದೂರದರ್ಶನದಲ್ಲಿ ನೋಡಿ ಮತ್ತು ಕೇಳಿ ತಿಳಿಯಬಹುದು.`,`ಸರಿ`),

S(`ಹಿಂದಿನ ಕಾಲದಲ್ಲಿ ಸಾರಿಗೆಗೆ ಬಳಸುತ್ತಿದ್ದ ಪ್ರಾಣಿಗಳ ಹೆಸರು ಬರೆ.`,`ಎತ್ತು, ಕುದುರೆ, ಒಂಟೆ, ಆನೆ, ಕತ್ತೆ ಮುಂತಾದ ಪ್ರಾಣಿಗಳು.`),

S(`ಕಂಡುಹಿಡಿದವರು ಯಾರು: ವಿಮಾನ ಮತ್ತು ದೂರದರ್ಶನ?`,`ವಿಮಾನ – ರೈಟ್ ಸಹೋದರರು; ದೂರದರ್ಶನ – ಜಾನ್ ಬೈಯರ್ಡ್.`),
L(`ಸಾರಿಗೆಯಲ್ಲಾದ ಬದಲಾವಣೆಗಳನ್ನು ವಿವರಿಸು.`,`ಹಿಂದಿನ ಕಾಲದಲ್ಲಿ ಜನರು ನಡೆದು ಹೋಗುತ್ತಿದ್ದರು ಅಥವಾ ಎತ್ತು, ಕುದುರೆ, ಒಂಟೆ, ಆನೆಗಳಂತಹ ಪ್ರಾಣಿಗಳನ್ನು ಸಾರಿಗೆಗೆ ಬಳಸುತ್ತಿದ್ದರು. ನಂತರ ಸೈಕಲ್, ಕಾರು, ಬಸ್, ರೈಲು ಬಂದವು. ಸಮುದ್ರದಲ್ಲಿ ಸಂಚರಿಸಲು ಹಡಗು, ಸಬ್‌ಮರಿನ್ ಮತ್ತು ಆಕಾಶದಲ್ಲಿ ಸಂಚರಿಸಲು ವಿಮಾನ, ಆಕಾಶನೌಕೆಗಳು ಬಂದವು. ಇಂದಿನ ವಾಹನಗಳು ಹೆಚ್ಚು ವೇಗವಾಗಿ ಮತ್ತು ದೂರದವರೆಗೆ ಸಂಚರಿಸಬಲ್ಲವು.`),
L(`ಸಂಪರ್ಕ ಸಾಧನಗಳು ಎಂದರೇನು? ನಿನಗೆ ತಿಳಿದ ನಾಲ್ಕು ಸಂಪರ್ಕ ಸಾಧನಗಳ ಉಪಯೋಗಗಳನ್ನು ಬರೆ.`,`ಒಬ್ಬರಿಗೊಬ್ಬರು ಮಾಹಿತಿ, ಸುದ್ದಿ ಹಂಚಿಕೊಳ್ಳಲು ಬಳಸುವ ಸಾಧನಗಳೇ ಸಂಪರ್ಕ ಸಾಧನಗಳು. ಅಂಚೆ ಪತ್ರ – ಬರವಣಿಗೆಯ ಮೂಲಕ ಸಂದೇಶ ಕಳುಹಿಸಲು; ದೂರವಾಣಿ – ದೂರದಲ್ಲಿರುವವರೊಂದಿಗೆ ನೇರವಾಗಿ ಮಾತನಾಡಲು; ವೃತ್ತಪತ್ರಿಕೆ – ಪ್ರತಿದಿನದ ಸುದ್ದಿ ತಿಳಿಯಲು; ಗಣಕಯಂತ್ರ – ಪ್ರಪಂಚದ ಯಾವುದೇ ಮಾಹಿತಿಯನ್ನು ವೇಗವಾಗಿ ಪಡೆಯಲು ಅಥವಾ ಕಳುಹಿಸಲು.`)
]});
LSV.push({n:16,t:`ಬದಲಾಗುತ್ತಿರುವ ಕುಟುಂಬಗಳು`,au:`ಸಮಿತಿ ರಚನೆ`,pg:31,
words:`ಕುಟುಂಬ – ಜೊತೆಯಾಗಿ ವಾಸಿಸುವ ಸಂಬಂಧಿಕರ ಗುಂಪು; ವಂಶವೃಕ್ಷ – ಕುಟುಂಬದ ಸದಸ್ಯರ ಸಂಬಂಧವನ್ನು ತೋರಿಸುವ ಮರದ ಚಿತ್ರ; ಸದಸ್ಯ – ಕುಟುಂಬದ ವ್ಯಕ್ತಿ; ತಲೆಮಾರು – ಪೀಳಿಗೆ; ನೆಲೆಸು – ವಾಸಿಸು; ದೊಡ್ಡ ಕುಟುಂಬ – ಹೆಚ್ಚು ಸದಸ್ಯರಿರುವ ಕುಟುಂಬ; ಚಿಕ್ಕ ಕುಟುಂಬ – ಕಡಿಮೆ ಸದಸ್ಯರಿರುವ ಕುಟುಂಬ; ಅಸಹಕಾರ – ಸಹಕರಿಸದಿರುವುದು`,
notes:`ರಾಮಯ್ಯನ ಕುಟುಂಬ: ರಾಮಯ್ಯ–ರಾಜಮ್ಮ ದಂಪತಿಗೆ ಗೋಪಿ, ಸುರೇಶ, ರಮೇಶ, ದಿಲೀಪ (ಮಕ್ಕಳು), ಪಿಂಕಿ (ಮಗಳು). ಗೋಪಿಯ ಹೆಂಡತಿ ದೀಪಿಕಾ, ಮಕ್ಕಳು ಸುಹಾಸ ಮತ್ತು ಸುರಭಿ; ಸುರೇಶನ ಹೆಂಡತಿ ರಾಧಿಕಾ. ಹಿಂದಿನ ವರ್ಷ ಸದಸ್ಯರು 11. ಈ ವರ್ಷ: ಗೋಪಿ ಕುಟುಂಬ ಉದ್ಯೋಗಕ್ಕಾಗಿ ಬೇರೆ ಊರಿಗೆ; ಪಿಂಕಿ ಉನ್ನತ ಶಿಕ್ಷಣಕ್ಕಾಗಿ ಪಟ್ಟಣಕ್ಕೆ; ಶೀಲಾ ರಮೇಶನನ್ನು ಮದುವೆಯಾಗಿ ಬಂದಳು; ಸುರೇಶನ ಕುಟುಂಬಕ್ಕೆ ಪಾಪು ಹೊಸ ಸದಸ್ಯ. ವಂಶವೃಕ್ಷದಲ್ಲಿ: ಕುಟುಂಬದಿಂದ ಹೊರಗೆ ಹೋದವರಿಗೆ ವೃತ್ತ ○, ಬಂದವರಿಗೆ ತ್ರಿಕೋನ △. ನಿನಗಿದು ಗೊತ್ತೆ?: ಧಾರವಾಡದಿಂದ 25 km ದೂರದ ಲೋಕೂರು ಗ್ರಾಮದಲ್ಲಿ 7 ತಲೆಮಾರುಗಳ ಜನರು ಒಂದೇ ಕುಟುಂಬದಲ್ಲಿ ವಾಸಿಸುತ್ತಿದ್ದು ಸದಸ್ಯರ ಸಂಖ್ಯೆ 180; ಎಂ.ಎಂ. ಕೈಗಾರಿಕಾ ಕುಟುಂಬದಲ್ಲಿ 40 ಜನ (ಕೃಷ್ಣಮೂರ್ತಿಯವರ ಕುಟುಂಬ).`,
ab:[
[`ರಾಮಯ್ಯನ ಕುಟುಂಬ`,[
[`ಹಿಂದಿನ ವರ್ಷ ಈ ಕುಟುಂಬದಲ್ಲಿ ಎಷ್ಟು ಜನರಿದ್ದಾರೆ?`,`11 ಜನ (ರಾಮಯ್ಯ, ರಾಜಮ್ಮ, ಗೋಪಿ, ದೀಪಿಕಾ, ಸುಹಾಸ, ಸುರಭಿ, ಸುರೇಶ, ರಾಧಿಕಾ, ರಮೇಶ, ದಿಲೀಪ, ಪಿಂಕಿ).`],
[`ರಾಮಯ್ಯನಿಗೆ ಎಷ್ಟು ಮಕ್ಕಳು? ಯಾರು ಯಾರು?`,`5 ಮಕ್ಕಳು – ಗೋಪಿ, ಸುರೇಶ, ರಮೇಶ, ದಿಲೀಪ (ಗಂಡು ಮಕ್ಕಳು) ಮತ್ತು ಪಿಂಕಿ (ಮಗಳು).`],
[`ಗೋಪಿಗೆ ಎಷ್ಟು ಮಕ್ಕಳು? ಯಾರು ಯಾರು?`,`2 ಮಕ್ಕಳು – ಸುಹಾಸ ಮತ್ತು ಸುರಭಿ.`],
[`ಗೋಪಿ ಕುಟುಂಬವು ಬೇರೆ ಊರಿಗೆ ಹೋಗಲು ಕಾರಣವೇನು?`,`ಗೋಪಿಗೆ ಬೇರೆ ಊರಿನಲ್ಲಿ ಕೆಲಸ ಸಿಕ್ಕಿತು.`],

[`ವಂಶವೃಕ್ಷದಲ್ಲಿ ತ್ರಿಕೋನ △ ಏನನ್ನು ಸೂಚಿಸುತ್ತದೆ?`,`ಕುಟುಂಬಕ್ಕೆ ಬಂದು ಸೇರಿದವರನ್ನು.`],
[`ರಾಜುವಿನ ವಂಶವೃಕ್ಷ: ರಾಜು, ಸರ್ವೇಶ್ (ಚೌಕ), ರಾಣಿ (△), ಸುನೀತಾ (○). ಈಗ ಕುಟುಂಬದಲ್ಲಿ ಎಷ್ಟು ಜನರಿದ್ದಾರೆ?`,`3 ಜನ (ರಾಜು, ಸರ್ವೇಶ್, ರಾಣಿ). ಸುನೀತಾ ಹೊರಹೋಗಿದ್ದಾಳೆ; ರಾಣಿ ಬಂದು ಸೇರಿದ್ದಾಳೆ.`],
[`ಹೊಸ ಸದಸ್ಯರು ಕುಟುಂಬಕ್ಕೆ ಹೇಗೆ ಸೇರುತ್ತಾರೆ?`,`ಮದುವೆ ಮತ್ತು ಮಗುವಿನ ಜನನದಿಂದ ಹೊಸ ಸದಸ್ಯರು ಕುಟುಂಬಕ್ಕೆ ಸೇರುತ್ತಾರೆ.`]]],
[`ದೊಡ್ಡ ಮತ್ತು ಚಿಕ್ಕ ಕುಟುಂಬ`,[
[`ದೊಡ್ಡ ಕುಟುಂಬಗಳು ಚಿಕ್ಕ ಕುಟುಂಬಗಳಾಗಿ ಬದಲಾಗಲು ಕಾರಣಗಳು.`,`ಪರಸ್ಪರ ಅಸಹಕಾರ, ಹೊಂದಾಣಿಕೆಯ ಕೊರತೆ, ಕೆಲಸದ ಹಂಚಿಕೆಯಲ್ಲಿ ಅಸಮಾನತೆ, ಹೊಸ ಹೊಸ ಅಗತ್ಯಗಳು ಮುಂತಾದವು.`],
[`ಕುಟುಂಬದ ಸದಸ್ಯರು ಬೇರೆ ಕಡೆಗೆ ಹೋಗಿ ನೆಲೆಸಲು ಇರುವ ಕಾರಣಗಳನ್ನು ಪಟ್ಟಿ ಮಾಡು.`,`ಉದ್ಯೋಗ, ಉನ್ನತ ಶಿಕ್ಷಣ, ಮದುವೆ, ವ್ಯಾಪಾರ, ಉತ್ತಮ ಸೌಲಭ್ಯಗಳು ಇತ್ಯಾದಿ. (ಮಾದರಿ ಉತ್ತರ)`],

S(`ದೊಡ್ಡ ಕುಟುಂಬಗಳು ಚಿಕ್ಕ ಕುಟುಂಬಗಳಾಗಲು ಎರಡು ಕಾರಣ ಬರೆ.`,`ಪರಸ್ಪರ ಅಸಹಕಾರ, ಹೊಂದಾಣಿಕೆಯ ಕೊರತೆ, ಕೆಲಸದ ಹಂಚಿಕೆಯಲ್ಲಿ ಅಸಮಾನತೆ.`),
S(`ವಂಶವೃಕ್ಷ ಎಂದರೇನು? ಅದರ ಉಪಯೋಗವೇನು?`,`ಕುಟುಂಬದ ಸದಸ್ಯರ ಸಂಬಂಧಗಳನ್ನು ತೋರಿಸುವ ಮರದಂತಹ ರಚನೆ. ಇದನ್ನು ವ್ಯವಹಾರಗಳಲ್ಲಿ ಹಾಗೂ ಧಾರ್ಮಿಕ ವಿಧಿಗಳಲ್ಲಿ ಬಳಸುತ್ತಾರೆ.`),
L(`ಈ ವರ್ಷ ರಾಮಯ್ಯನ ಕುಟುಂಬದಲ್ಲಾದ ಬದಲಾವಣೆಗಳನ್ನು ವಿವರಿಸು.`,`ಹಿಂದಿನ ವರ್ಷ ಕುಟುಂಬದಲ್ಲಿ 11 ಜನರಿದ್ದರು. ಈ ವರ್ಷ ಗೋಪಿಗೆ ಬೇರೆ ಊರಿನಲ್ಲಿ ಕೆಲಸ ಸಿಕ್ಕಿದ್ದರಿಂದ ಅವನ ಕುಟುಂಬದ ನಾಲ್ಕು ಜನ ಹೊರಹೋದರು. ಪಿಂಕಿ ಉನ್ನತ ಶಿಕ್ಷಣಕ್ಕಾಗಿ ಪಟ್ಟಣಕ್ಕೆ ಹೋದಳು. ರಮೇಶನನ್ನು ಮದುವೆಯಾಗಿ ಶೀಲಾ ಬಂದಳು. ಸುರೇಶನ ಕುಟುಂಬಕ್ಕೆ ಪಾಪು ಹುಟ್ಟಿತು. ಈಗ ಕುಟುಂಬದಲ್ಲಿ 8 ಜನರಿದ್ದಾರೆ.`),
L(`ಕುಟುಂಬಗಳು ಏಕೆ ಬದಲಾಗುತ್ತಿವೆ? ಕಾರಣಗಳನ್ನು ಬರೆ.`,`ಕುಟುಂಬದ ಸದಸ್ಯರು ಉದ್ಯೋಗ, ಉನ್ನತ ಶಿಕ್ಷಣ, ಮದುವೆ ಮುಂತಾದ ಕಾರಣಗಳಿಂದ ಬೇರೆಡೆ ಹೋಗುತ್ತಾರೆ ಮತ್ತು ಹೊಸ ಸದಸ್ಯರು ಬಂದು ಸೇರುತ್ತಾರೆ. ಪರಸ್ಪರ ಅಸಹಕಾರ, ಹೊಂದಾಣಿಕೆಯ ಕೊರತೆ, ಕೆಲಸದ ಹಂಚಿಕೆಯಲ್ಲಿ ಅಸಮಾನತೆ ಮತ್ತು ಹೊಸ ಅಗತ್ಯಗಳಿಂದ ದೊಡ್ಡ ಕುಟುಂಬಗಳು ಚಿಕ್ಕ ಕುಟುಂಬಗಳಾಗುತ್ತಿವೆ.`)
]});

LSV.push({n:17,t:`ಮನೆಯೇ ಮೊದಲ ಪಾಠಶಾಲೆ`,au:`ಸಮಿತಿ ರಚನೆ`,pg:40,
words:`ಧರ್ಮ – ನಂಬಿಕೆ ಮತ್ತು ಆಚರಣೆಗಳ ಮಾರ್ಗ; ಮೌಲ್ಯಗಳು – ಒಳ್ಳೆಯ ಗುಣಗಳು; ಸಾಂಸ್ಕೃತಿಕ ಆಚರಣೆ – ಸಂಸ್ಕೃತಿಗೆ ಸೇರಿದ ಪದ್ಧತಿ; ಗೌರವ – ಮರ್ಯಾದೆ; ವೃದ್ಧಾಶ್ರಮ – ವೃದ್ಧರು ವಾಸಿಸುವ ಆಶ್ರಮ; ಉನ್ನತ ಶಿಕ್ಷಣ – ಉನ್ನತ ಮಟ್ಟದ ವಿದ್ಯಾಭ್ಯಾಸ; ಸೇವೆ – ಇತರರಿಗೆ ಸಹಾಯ; ಪ್ರೇರಣೆ – ಹುರಿದುಂಬಿಸುವುದು; ಅಹಿಂಸೆ – ಹಿಂಸೆ ಮಾಡದಿರುವುದು`,
notes:`ಕುಟುಂಬವು ಧರ್ಮ, ಮೌಲ್ಯಗಳು, ಸಾಂಸ್ಕೃತಿಕ ಆಚರಣೆಗಳಿಂದ ಕೂಡಿರುವ ಒಂದು ಸಣ್ಣ ಘಟಕ. ಪವಿತ್ರ (ದೇವರ ಪೂಜೆ, ಒಟ್ಟಾಗಿ ಊಟ, ಜಾತ್ರೆ), ರಜಿಯಾ (ನಮಾಜು, ರಂಜಾನ್, ಶುಕ್ರವಾರ ವಿಶೇಷ, ಅರಾಬಿಕ್ ಭಾಷೆ), ಜಾನ್ (ಭಾನುವಾರ ಚರ್ಚ್, ಪ್ರಾರ್ಥನೆ, ಬೈಬಲ್). ಎಲ್ಲ ಧರ್ಮಗಳೂ ಹಿರಿಯರಿಗೆ ಗೌರವ, ಕೈಲಾಗದವರಿಗೆ ಸಹಾಯ, ಎಲ್ಲರಿಗೂ ಸ್ನೇಹ–ಪ್ರೀತಿ ತೋರಿಸುವುದನ್ನು ಹೇಳುತ್ತವೆ. ಕುಟುಂಬದ ಮೌಲ್ಯಗಳು ಬದಲಾದಂತೆ ಸಮಾಜದಲ್ಲೂ ಬದಲಾವಣೆಗಳಾಗುತ್ತವೆ: ಮಹಿಳೆಯರು ಎಲ್ಲ ಕ್ಷೇತ್ರಗಳಲ್ಲಿ ಕಾರ್ಯನಿರ್ವಹಿಸುತ್ತಿರುವುದು, ಬಾಲ್ಯ ವಿವಾಹ ಕಡಿಮೆಯಾಗಿರುವುದು, ಶಿಕ್ಷಣ ಮಕ್ಕಳ ಮೂಲಭೂತ ಹಕ್ಕಾಗಿರುವುದು. ನಿನಗಿದು ಗೊತ್ತೆ?: ಜೈನಮತದಲ್ಲಿ ಅಹಿಂಸೆ; ಕೊಡಗಿನ ಕಾರಿಯಪ್ಪ ಭಾರತದ ಮೊದಲ ಸೇನಾ ಮುಖ್ಯಸ್ಥರು; ಬಿ.ಜಿ.ಎಲ್. ಸ್ವಾಮಿಯವರ 'ಹಸಿರುಹೊನ್ನು' ಗ್ರಂಥ.`,
ab:[
[`ಪವಿತ್ರ, ರಜಿಯಾ, ಜಾನ್ ಕುಟುಂಬಗಳು`,[
[`ಈ ಮೂವರ ಕುಟುಂಬಗಳಲ್ಲಿ ಇರುವ ಸಾಮಾನ್ಯ ಒಳ್ಳೆಯ ಗುಣಗಳು ಯಾವುವು?`,`ಹಿರಿಯರಿಗೆ ಗೌರವ, ಕೈಲಾಗದವರಿಗೆ ಸಹಾಯ, ಎಲ್ಲರನ್ನೂ ಒಂದೇ ರೀತಿ ನೋಡುವುದು, ಸ್ನೇಹ–ಪ್ರೀತಿ ತೋರಿಸುವುದು, ಜಗಳವಾಡದಿರುವುದು.`],
[`ರಜಿಯಾಳಿಗೆ ಶುಕ್ರವಾರ ಏಕೆ ವಿಶೇಷ ದಿನ?`,`ಆ ದಿನ ಅಪ್ಪ ಮಸೀದಿಗೆ ಹೋಗಿ ನಮಾಜು ಮಾಡುತ್ತಾರೆ ಮತ್ತು ಅಜ್ಜಿ ಎಲ್ಲರನ್ನೂ ಒಂದೇ ರೀತಿ ನೋಡಿ ಗೌರವಿಸಬೇಕೆಂದು ಹೇಳುತ್ತಾರೆ; ಅದು ವಿಶೇಷ ದಿನ.`],
[`ಜಾನ್ ಕುಟುಂಬ ಭಾನುವಾರ ಏನು ಮಾಡುತ್ತಾರೆ?`,`ಚರ್ಚಿಗೆ ಹೋಗಿ ಪ್ರಾರ್ಥನೆ ಸಲ್ಲಿಸುತ್ತಾರೆ; ಒಟ್ಟಿಗೆ ಊಟ ಮಾಡುತ್ತಾರೆ; ಮನೆ ಅಲಂಕರಿಸುತ್ತಾರೆ; ಬೈಬಲ್ ಓದುತ್ತಾರೆ; ಕಥೆ ಹೇಳುತ್ತಾರೆ.`],
[`ನಿನ್ನ ಮನೆಯಲ್ಲಿ ಪ್ರತಿನಿತ್ಯ ಮಾಡುವ ಆಚರಣೆಗಳು ಯಾವುವು?`,`ಮಾದರಿ ಉತ್ತರ: ದೇವರ ಪ್ರಾರ್ಥನೆ, ಒಟ್ಟಿಗೆ ಊಟ ಮಾಡುವುದು, ಹಿರಿಯರಿಗೆ ನಮಸ್ಕರಿಸುವುದು.`]]],
[`ಚಿತ್ರ ಸಂಭಾಷಣೆ – ಮೌಲ್ಯ ಮತ್ತು ಸಮಾಜ`,[
[`ಕುಟುಂಬದವರು ಉನ್ನತ ಶಿಕ್ಷಣ ಕೊಡಿಸಿದ್ದರಿಂದ ಸಮಾಜಕ್ಕೆ ಆದ ಉಪಯೋಗವೇನು?`,`ಅವರು ವೈದ್ಯೆಯಾಗಿ ರೋಗಿಗಳಿಗೆ ಚಿಕಿತ್ಸೆ ನೀಡಿ ಸಮಾಜಕ್ಕೆ ಸೇವೆ ಸಲ್ಲಿಸುತ್ತಾರೆ.`],
[`ಸಮಾಜಕ್ಕೆ ಉಪಯೋಗವಾದ ವೃದ್ಧಾಶ್ರಮ ನಡೆಸಲು ಪ್ರೇರಣೆ ಎಲ್ಲಿಂದ ಬಂತು?`,`ಅವನ ಕುಟುಂಬದವರು ಹಿರಿಯರಿಗೆ ಮಾಡುವ ಸೇವೆಯನ್ನು ನೋಡಿ ಬೆಳೆದಿದ್ದರಿಂದ ಪ್ರೇರಣೆ ಬಂತು.`],
[`ಅಮ್ಮನ ಗುಣ ಅನುಸರಿಸಿದ್ದರಿಂದ ಪರಿಸರಕ್ಕೆ, ಸಮಾಜಕ್ಕೆ ಆದ ಸಹಾಯವೇನು?`,`ಅಮ್ಮನಂತೆ ಗಿಡ–ಮರಗಳನ್ನು ಪ್ರೀತಿಸಿ ಖಾಲಿ ಜಾಗದಲ್ಲಿ ಸಸಿಗಳನ್ನು ನೆಟ್ಟು ನೀರು ಹಾಕುತ್ತಾರೆ; ಪರಿಸರ ಹಸಿರಾಗುತ್ತದೆ ಮತ್ತು ಸಮಾಜಕ್ಕೆ ಶುದ್ಧ ಗಾಳಿ ಸಿಗುತ್ತದೆ.`]]],
[`ಎರಡು ಮಕ್ಕಳ ಕಥೆ`,[
[`ಚಂದ್ರಣ್ಣ ಕಂಡ ಮೊದಲ ಬಾಲಕ 'ಹಿಡಿಯಿರಿ, ಕಿತ್ತುಕೊಳ್ಳಿ' ಎಂದು ಹೇಳಲು ಕಾರಣವೇನು?`,`ಮಾದರಿ ಉತ್ತರ: ಅವನ ಮನೆಯಲ್ಲಿ ಅಪರಿಚಿತರನ್ನು ಗೌರವಿಸುವ ಮತ್ತು ಸಹಾಯ ಮಾಡುವ ಗುಣ ಕಲಿಸಿರಲಿಲ್ಲ; ಅಥವಾ ಹಾಗೆ ಹೇಳಿ ಹೆದರಿಸುವ ಸ್ವಭಾವ ಬೆಳೆದಿತ್ತು.`],
[`ಚಂದ್ರಣ್ಣ ತಾನು ಕಂಡ ಇಬ್ಬರು ಬಾಲಕರಲ್ಲಿ ಯಾರನ್ನು ಮೆಚ್ಚಬಹುದು? ಏಕೆ?`,`ಎರಡನೇ ಬಾಲಕನನ್ನು; ಏಕೆಂದರೆ ಅವನು ಆಯಾಸಗೊಂಡ ಚಂದ್ರಣ್ಣನನ್ನು ಉಪಚರಿಸಿ ಕುಳಿತುಕೊಳ್ಳಲು ಹೇಳಿ ನೀರು ಕೊಟ್ಟನು.`],
[`ಇಬ್ಬರು ಬಾಲಕರು ಬೇರೆ ಬೇರೆ ರೀತಿ ವರ್ತಿಸಲು ಕಾರಣವೇನು?`,`ಅವರ ಕುಟುಂಬಗಳಲ್ಲಿ ಕಲಿತ ಗುಣ ಮತ್ತು ಮೌಲ್ಯಗಳು ಬೇರೆ ಬೇರೆ ಇದ್ದುದು.`]]]
],
qb:[
M(`ಕುಟುಂಬವು ಯಾವುದರಿಂದ ಕೂಡಿರುವ ಒಂದು ಸಣ್ಣ ಘಟಕ?`,[`ಧರ್ಮ, ಮೌಲ್ಯ, ಸಾಂಸ್ಕೃತಿಕ ಆಚರಣೆ`,`ಹಣ ಮತ್ತು ಆಸ್ತಿ`,`ಶಾಲೆ ಮತ್ತು ಕಚೇರಿ`,`ಆಟ ಮತ್ತು ಪಾಠ`],0),
M(`ಕುಟುಂಬದಲ್ಲಿ ಮಕ್ಕಳಿಗೆ ಮೊದಲ ಪಾಠಶಾಲೆ ಯಾವುದು?`,[`ಶಾಲೆ`,`ಮನೆ`,`ದೇವಸ್ಥಾನ`,`ಗ್ರಂಥಾಲಯ`],1),
M(`ರಂಜಾನ್ ಹಬ್ಬದಲ್ಲಿ ರಜಿಯಾಳ ಕುಟುಂಬ ಏನು ಮಾಡುತ್ತದೆ?`,[`ಬಡವರಿಗೆ ಸಹಾಯ`,`ಪಟಾಕಿ ಹೊಡೆಯುವುದು`,`ಚರ್ಚಿಗೆ ಹೋಗುವುದು`,`ಜಾತ್ರೆಗೆ ಹೋಗುವುದು`],0),
M(`ಜಾನ್ ಕುಟುಂಬಕ್ಕೆ ಸಂಭ್ರಮದ ದಿನ:`,[`ಶುಕ್ರವಾರ`,`ಸೋಮವಾರ`,`ಭಾನುವಾರ`,`ಗುರುವಾರ`],2),
M(`ಜೈನ ಮತದ ಬಹು ಮುಖ್ಯ ತತ್ವ:`,[`ಅಹಿಂಸೆ`,`ಕೋಪ`,`ಸ್ಪರ್ಧೆ`,`ಯುದ್ಧ`],0),
M(`ಭಾರತದ ಮೊದಲ ಸೇನಾ ಮುಖ್ಯಸ್ಥರಾದ ಕರ್ನಾಟಕದವರು:`,[`ಕಾರಿಯಪ್ಪ`,`ವಿಶ್ವೇಶ್ವರಯ್ಯ`,`ಕುವೆಂಪು`,`ರಾಜ್‌ಕುಮಾರ್`],0),
M(`'ಹಸಿರುಹೊನ್ನು' ಗ್ರಂಥ ಬರೆದವರು:`,[`ಕುವೆಂಪು`,`ಬಿ.ಜಿ.ಎಲ್. ಸ್ವಾಮಿ`,`ಡಿ.ವಿ.ಜಿ.`,`ಬೇಂದ್ರೆ`],1,'m'),
M(`ಕುಟುಂಬದ ಮೌಲ್ಯಗಳು ಬದಲಾದಂತೆ ಸಮಾಜದಲ್ಲಿ ಆಗುವ ಬದಲಾವಣೆ:`,[`ಬಾಲ್ಯವಿವಾಹ ಹೆಚ್ಚುವುದು`,`ಶಿಕ್ಷಣ ಮೂಲಭೂತ ಹಕ್ಕಾಗುವುದು`,`ಮಹಿಳೆಯರು ಮನೆಯಲ್ಲೇ ಇರುವುದು`,`ಯಾವುದೂ ಅಲ್ಲ`],1,'m'),
O(`ಪವಿತ್ರಳ ಅಪ್ಪ ದಿನಾ ಬೆಳಗ್ಗೆ ಏನು ಮಾಡುತ್ತಾರೆ?`,`ದೇವರ ಪೂಜೆ ಮಾಡುತ್ತಾರೆ.`),
O(`ರಜಿಯಾಳ ಅಮ್ಮ ದಿನವೂ ಅವಳಿಗೆ ಯಾವ ಭಾಷೆ ಹೇಳಿಕೊಡುತ್ತಾರೆ?`,`ಅರಾಬಿಕ್ ಭಾಷೆ.`),
O(`ಜಾನ್ ಕುಟುಂಬದವರು ಯಾವ ಪುಸ್ತಕ ಓದುತ್ತಾರೆ?`,`ಬೈಬಲ್.`),
O(`ಮಹಾತ್ಮ ಗಾಂಧೀಜಿಯವರ ಬಗ್ಗೆ ತಿಳಿಯಲು ಯಾವ ಪುಸ್ತಕ ಓದಬೇಕು?`,`ಗ್ರಂಥಾಲಯದಲ್ಲಿರುವ ಅವರ ಜೀವನ ಚರಿತ್ರೆಯ ಪುಸ್ತಕ.`),
O(`ಎಲ್ಲ ಧರ್ಮಗಳು ಹಿರಿಯರಿಗೆ ಏನು ಕೊಡಬೇಕೆಂದು ಹೇಳುತ್ತವೆ?`,`ಗೌರವ.`),
O(`ಪವಿತ್ರಳ ಕುಟುಂಬ ಪ್ರತಿ ವರ್ಷ ಎಲ್ಲಿಗೆ ಹೋಗುತ್ತದೆ?`,`ಊರಿನ ಜಾತ್ರೆಗೆ.`),
G(`ಖಾಲಿ ಬಿಟ್ಟ ಸ್ಥಳ ತುಂಬಿ: ಧರ್ಮ, ಮೌಲ್ಯಗಳು, ಸಾಂಸ್ಕೃತಿಕ ಆಚರಣೆಗಳಿಂದ ಕೂಡಿರುವ ಒಂದು ಸಣ್ಣ ಘಟಕವೇ ______.`,`ಕುಟುಂಬ`),
G(`ಖಾಲಿ ಬಿಟ್ಟ ಸ್ಥಳ ತುಂಬಿ: ಎಲ್ಲ ಧರ್ಮಗಳೂ ಎಲ್ಲರಿಗೂ ______ ಮತ್ತು ಪ್ರೀತಿ ತೋರಿಸಬೇಕೆಂದು ಹೇಳುತ್ತವೆ.`,`ಸ್ನೇಹ`),
G(`ಸರಿ/ತಪ್ಪು ಬರೆ: ಎಲ್ಲ ಧರ್ಮದವರ ಆಚರಣೆಗಳು ಒಂದೇ ರೀತಿ ಇರುತ್ತವೆ.`,`ತಪ್ಪು. ಆಚರಣೆಗಳು ವಿಭಿನ್ನ; ಆದರೆ ಒಳ್ಳೆಯ ಗುಣಗಳ ಬೋಧನೆ ಒಂದೇ.`),
G(`ಸರಿ/ತಪ್ಪು ಬರೆ: ಬಾಲ್ಯ ವಿವಾಹ ಹೆಚ್ಚಾಗಿರುವುದು ಸಮಾಜದ ಒಳ್ಳೆಯ ಬದಲಾವಣೆ.`,`ತಪ್ಪು. ಬಾಲ್ಯ ವಿವಾಹ ಕಡಿಮೆಯಾಗಿರುವುದು ಒಳ್ಳೆಯ ಬದಲಾವಣೆ.`),
G(`ಹೊಂದಿಸಿ ಬರೆ: ಪವಿತ್ರ, ರಜಿಯಾ, ಜಾನ್ – (ಬೈಬಲ್, ನಮಾಜು, ದೇವರ ಪೂಜೆ).`,`ಪವಿತ್ರ – ದೇವರ ಪೂಜೆ; ರಜಿಯಾ – ನಮಾಜು; ಜಾನ್ – ಬೈಬಲ್`,'m'),
S(`ಕುಟುಂಬದಲ್ಲಿ ಹಿರಿಯರು ಮಕ್ಕಳಿಗೆ ಯಾವ ಒಳ್ಳೆಯ ಗುಣಗಳನ್ನು ಹೇಳಿಕೊಡುತ್ತಾರೆ? (ಎರಡು)`,`ಎಲ್ಲರನ್ನೂ ಗೌರವಿಸುವುದು; ಕೈಲಾಗದವರಿಗೆ ಸಹಾಯ ಮಾಡುವುದು; ಸ್ನೇಹದಿಂದ ಇರುವುದು.`),
S(`ಕುಟುಂಬದ ಮೌಲ್ಯಗಳು ಬದಲಾದಂತೆ ಸಮಾಜದಲ್ಲಾಗುವ ಎರಡು ಬದಲಾವಣೆ ಬರೆ.`,`ಮಹಿಳೆಯರು ಎಲ್ಲ ಕ್ಷೇತ್ರಗಳಲ್ಲಿ ಕಾರ್ಯನಿರ್ವಹಿಸುತ್ತಿರುವುದು; ಬಾಲ್ಯ ವಿವಾಹ ಕಡಿಮೆಯಾಗಿರುವುದು.`),
S(`ಜೈನ ಮತದವರು ಗೆಡ್ಡೆಗೆಣಸುಗಳನ್ನು ಏಕೆ ಬಳಸುವುದಿಲ್ಲ?`,`ಗೆಡ್ಡೆಗೆಣಸುಗಳನ್ನು ಪಡೆಯಲು ಬೇರನ್ನು ಕೀಳಬೇಕಾಗಿ ಸಸ್ಯಗಳು ಸಾಯುತ್ತವೆ; ಅಹಿಂಸೆ ತತ್ವದಿಂದ ಅವರು ಅವುಗಳನ್ನು ಬಳಸುವುದಿಲ್ಲ.`),
L(`'ಮನೆಯೇ ಮೊದಲ ಪಾಠಶಾಲೆ' – ವಿವರಿಸು.`,`ಮಕ್ಕಳು ಮೊದಲು ಒಳ್ಳೆಯ ಗುಣ, ಮೌಲ್ಯ ಮತ್ತು ಆಚರಣೆಗಳನ್ನು ಕಲಿಯುವುದು ತಮ್ಮ ಮನೆಯಲ್ಲಿಯೇ. ಹಿರಿಯರಿಗೆ ಗೌರವ ಕೊಡುವುದು, ಕೈಲಾಗದವರಿಗೆ ಸಹಾಯ ಮಾಡುವುದು, ಎಲ್ಲರಿಗೂ ಸ್ನೇಹ–ಪ್ರೀತಿ ತೋರಿಸುವುದನ್ನು ಅವರು ತಂದೆ–ತಾಯಿ ಮತ್ತು ಹಿರಿಯರಿಂದ ಕಲಿಯುತ್ತಾರೆ. ಈ ಮೌಲ್ಯಗಳು ಮುಂದೆ ಅವರನ್ನು ಸಮಾಜಕ್ಕೆ ಉಪಯೋಗವಾಗುವ ವ್ಯಕ್ತಿಗಳನ್ನಾಗಿ ಮಾಡುತ್ತವೆ. ಆದ್ದರಿಂದ ಮನೆಯೇ ಮೊದಲ ಪಾಠಶಾಲೆ.`),
L(`ಚಂದ್ರಣ್ಣ ಕಂಡ ಇಬ್ಬರು ಬಾಲಕರ ಕಥೆಯನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಬರೆ. ಅದರಿಂದ ನೀನು ಕಲಿತ ಪಾಠವೇನು?`,`ದಾರಿ ತಪ್ಪಿದ ಚಂದ್ರಣ್ಣ ವಿಶ್ರಾಂತಿಗಾಗಿ ಒಂದು ಮನೆಯ ಬಳಿ ಬಂದಾಗ ಅಲ್ಲಿನ ಬಾಲಕ 'ಹಿಡಿಯಿರಿ, ಕಿತ್ತುಕೊಳ್ಳಿ' ಎಂದು ಕೂಗಿದನು. ಭಯದಿಂದ ಓಡಿ ಹೋಗಿ ರಸ್ತೆಯ ಕೊನೆಯ ಮನೆಗೆ ಬಂದಾಗ ಅಲ್ಲಿನ ಬಾಲಕ ಅವನನ್ನು ಉಪಚರಿಸಿ ಕುಳಿತುಕೊಳ್ಳಲು ಹೇಳಿ ನೀರು ಕೊಟ್ಟನು. ಕುಟುಂಬದಲ್ಲಿ ಕಲಿತ ಮೌಲ್ಯಗಳು ನಮ್ಮ ವರ್ತನೆಯನ್ನು ರೂಪಿಸುತ್ತವೆ; ನಾವು ಇತರರೊಂದಿಗೆ ಪ್ರೀತಿ ಮತ್ತು ಗೌರವದಿಂದ ವರ್ತಿಸಬೇಕು ಎಂಬುದು ಪಾಠ.`)
]});

LSV.push({n:18,t:`ಪ್ರತಿಯೊಬ್ಬರೂ ವಿಶಿಷ್ಟ`,au:`ಸಮಿತಿ ರಚನೆ`,pg:46,
words:`ವಿಶಿಷ್ಟ – ವಿಶೇಷವಾದ; ಕೌಶಲ – ನೈಪುಣ್ಯ; ಸ್ಪರ್ಧೆ – ಪೈಪೋಟಿ; ಪ್ರತಿಭಾ ಕಾರಂಜಿ – ಮಕ್ಕಳ ಪ್ರತಿಭೆಯನ್ನು ತೋರಿಸುವ ಕಾರ್ಯಕ್ರಮ; ವಿಕಲಚೇತನ – ದೈಹಿಕ ನ್ಯೂನತೆಯುಳ್ಳವರು; ಸಂವಹನ – ಸಂಪರ್ಕ; ಸನ್ನೆ – ಕೈ ಸಂಕೇತ; ಬ್ರೈಲ್ ಲಿಪಿ – ಅಂಧರು ಮುಟ್ಟಿ ಓದುವ ಲಿಪಿ; ರಾಷ್ಟ್ರಕವಿ – ದೇಶ/ರಾಜ್ಯದ ಪ್ರಸಿದ್ಧ ಕವಿ`,
notes:`ಪ್ರತಿಯೊಬ್ಬರಲ್ಲೂ ವಿಶೇಷ ಗುಣ ಮತ್ತು ಕೌಶಲ ಇರುತ್ತದೆ (ಲತಾ – ಹಾಡು, ರಾಜು – ಚಿತ್ರಕಲೆ, ಮಹಮದ್ – ನಾಟಕ, ರೀಟಾ – ಮಣ್ಣಿನ ಮಾದರಿ). ಬಾಲ್ಯದಲ್ಲೇ ಕೌಶಲ ಗುರುತಿಸಿ ಅವಕಾಶ–ಪ್ರೋತ್ಸಾಹ ನೀಡಬೇಕು. ಪ್ರಸಿದ್ಧರು: ಡಾ|| ರಾಜ್‌ಕುಮಾರ್ (ನಟ–ಗಾಯಕ, ದಾದಾ ಸಾಹೇಬ್ ಫಾಲ್ಕೆ ಪ್ರಶಸ್ತಿ), ಕುವೆಂಪು (ರಾಷ್ಟ್ರಕವಿ, ಜ್ಞಾನಪೀಠ), ಕಿತ್ತೂರು ರಾಣಿ ಚೆನ್ನಮ್ಮ (ವೀರ ಮಹಿಳೆ), ಗಂಗೂಬಾಯಿ ಹಾನಗಲ್ (ಹಿಂದೂಸ್ತಾನಿ ಸಂಗೀತ). ಥಾಮಸ್ ಆಲ್ವಾ ಎಡಿಸನ್: ಕಿವುಡನಾದರೂ ತಾಯಿಯ ಶಿಕ್ಷಣದಿಂದ ಬಲ್ಬ್ ಮುಂತಾದವನ್ನು ಕಂಡುಹಿಡಿದ. ದೃಷ್ಟಿ ವಿಕಲಚೇತನರು ಬ್ರೈಲ್ ಲಿಪಿ, ವಾಕ್–ಶ್ರವಣ ವಿಕಲಚೇತನರು ಸಂಕೇತಾಕ್ಷರ ಬಳಸುತ್ತಾರೆ. ಸರ್. ಎಂ. ವಿಶ್ವೇಶ್ವರಯ್ಯ – 1955ರಲ್ಲಿ ಭಾರತರತ್ನ; ಮದರ್ ಥೆರೆಸಾ – ನೊಬೆಲ್ ಪ್ರಶಸ್ತಿ.`,
ab:[
[`ಪ್ರತಿಭಾ ಕಾರಂಜಿ ಚರ್ಚೆ`,[
[`ಲತಾ ಮತ್ತು ರಾಜು ಯಾವ ಸ್ಪರ್ಧೆಗಳಿಗೆ ಸೇರಬೇಕೆಂದು ಯೋಚಿಸಿದರು?`,`ಲತಾ – ಹಾಡುವ ಸ್ಪರ್ಧೆ; ರಾಜು – ಚಿತ್ರಕಲಾ ಸ್ಪರ್ಧೆ.`],
[`ಮಹಮದ್ ಯಾವ ಸ್ಪರ್ಧೆಗೆ ಸೇರಿದರೆ ಒಳ್ಳೆಯದು ಎಂದು ರೀಟಾ ಹೇಳಿದಳು?`,`ನಾಟಕ ಸ್ಪರ್ಧೆ.`],
[`ರೀಟಾ ಮಣ್ಣಿನ ಮಾದರಿ ಸ್ಪರ್ಧೆಗೆ ಏಕೆ ಸೇರಬೇಕೆಂದು ಮಹಮದ್ ಹೇಳಿದನು?`,`ರೀಟಾ ಮಣ್ಣಿನಿಂದ ಗೊಂಬೆಗಳನ್ನು ಚೆನ್ನಾಗಿ ಮಾಡುತ್ತಾಳೆ ಮತ್ತು ಜೇಡಿಮಣ್ಣಿನ ಮಾದರಿ ತಯಾರಿಕೆಗೆ ಅವಳೇ ಸರಿ.`],
[`ನಿನ್ನ ಶಾಲೆಯಲ್ಲಿ ಪ್ರತಿಭಾ ಕಾರಂಜಿ ನಡೆದರೆ ನೀನು ಯಾವ ಸ್ಪರ್ಧೆಯಲ್ಲಿ ಭಾಗವಹಿಸುವೆ? ಏಕೆ?`,`ಮಾದರಿ ಉತ್ತರ: ಹಾಡುವ ಸ್ಪರ್ಧೆ; ಏಕೆಂದರೆ ನನಗೆ ಹಾಡುವುದು ಇಷ್ಟ.`]]],
[`ಪ್ರಸಿದ್ಧ ವ್ಯಕ್ತಿಗಳು`,[
[`ಡಾ|| ರಾಜ್‌ಕುಮಾರ್ ಯಾವ ಕೌಶಲದಿಂದ ಪ್ರಸಿದ್ಧರಾದರು?`,`ಅಭಿನಯ ಮತ್ತು ಗಾಯನ ಕೌಶಲದಿಂದ. ದಾದಾ ಸಾಹೇಬ್ ಫಾಲ್ಕೆ ಪ್ರಶಸ್ತಿ ಪಡೆದ ಮೊದಲ ಕನ್ನಡಿಗ.`],
[`ಕುವೆಂಪು ಬರೆದ ನಾಡಗೀತೆ ಯಾವುದು?`,`ಜಯ್ ಭಾರತ ಜನನಿಯ ತನುಜಾತೆ.`],
[`ಕಿತ್ತೂರು ರಾಣಿ ಚೆನ್ನಮ್ಮ ಯಾರೊಂದಿಗೆ ಹೋರಾಡಿದರು?`,`ಬ್ರಿಟಿಷರೊಡನೆ.`],
[`ಗಂಗೂಬಾಯಿ ಹಾನಗಲ್ ಯಾವ ಕಲೆಯಲ್ಲಿ ಪ್ರಸಿದ್ಧರು?`,`ಹಿಂದೂಸ್ತಾನಿ ಸಂಗೀತ (ಗಾಯನ).`],
[`ಎಡಿಸನ್‌ನ ಜೀವನದಿಂದ ನೀನು ಏನನ್ನು ತಿಳಿದೆ?`,`ದೈಹಿಕ ತೊಂದರೆ ಇದ್ದರೂ ಛಲ ಮತ್ತು ಒಳ್ಳೆಯ ಶಿಕ್ಷಣದಿಂದ ಸಾಧನೆ ಮಾಡಬಹುದು. (ಮಾದರಿ ಉತ್ತರ)`]]],
[`ವಿಕಲಚೇತನರ ಸಂವಹನ`,[
[`ದೃಷ್ಟಿ ವಿಕಲಚೇತನರು ಬಳಸುವ ಲಿಪಿ ಯಾವುದು?`,`ಬ್ರೈಲ್ ಲಿಪಿ.`],
[`ವಾಕ್ ಮತ್ತು ಶ್ರವಣ ವಿಕಲಚೇತನರು ಯಾವುದನ್ನು ಬಳಸುತ್ತಾರೆ?`,`ಸಂಕೇತಾಕ್ಷರ (ಸನ್ನೆಗಳು).`],
[`ವಿಕಲಚೇತನರ ಬಗ್ಗೆ ನಮ್ಮ ಭಾವನೆ ಹೇಗಿರಬೇಕು?`,`ಇವರೂ ನಮ್ಮಂತೆಯೇ ಎಂದು ಭಾವಿಸಿ ಸಂವೇದನಾಶೀಲತೆಯಿಂದ ನಡೆದುಕೊಳ್ಳಬೇಕು.`]]]
],
qb:[
M(`ಲತಾ ಯಾವ ಸ್ಪರ್ಧೆಗೆ ಸೂಕ್ತ?`,[`ಚಿತ್ರಕಲೆ`,`ನಾಟಕ`,`ಹಾಡುವ ಸ್ಪರ್ಧೆ`,`ಮಣ್ಣಿನ ಮಾದರಿ`],2),
M(`ಜೇಡಿಮಣ್ಣಿನ ಮಾದರಿ ತಯಾರಿಕೆಗೆ ಸೂಕ್ತರಾದವರು:`,[`ರಾಜು`,`ಲತಾ`,`ರೀಟಾ`,`ಮಹಮದ್`],2),
M(`ಕನ್ನಡದ ಮೊದಲ ಜ್ಞಾನಪೀಠ ಪ್ರಶಸ್ತಿ ವಿಜೇತ ಕವಿ:`,[`ಕುವೆಂಪು`,`ಬೇಂದ್ರೆ`,`ಡಿ.ವಿ.ಜಿ.`,`ಕಾರಂತ`],0),
M(`ಕಿತ್ತೂರು ರಾಣಿ ಚೆನ್ನಮ್ಮ ಜನಿಸಿದ ಊರು:`,[`ಕಿತ್ತೂರು`,`ಕಾಕತಿ`,`ಧಾರವಾಡ`,`ಹಂಪಿ`],1),
M(`ಗಂಗೂಬಾಯಿ ಹಾನಗಲ್ ಜನಿಸಿದ ಜಿಲ್ಲೆ:`,[`ಬೆಳಗಾವಿ`,`ಧಾರವಾಡ`,`ಮೈಸೂರು`,`ಮಂಡ್ಯ`],1),
M(`ಬ್ರೈಲ್ ಲಿಪಿಯನ್ನು ಬಳಸುವವರು:`,[`ಶ್ರವಣ ವಿಕಲಚೇತನರು`,`ದೃಷ್ಟಿ ವಿಕಲಚೇತನರು`,`ವಾಕ್ ವಿಕಲಚೇತನರು`,`ಎಲ್ಲರೂ`],1),
M(`ಭಾರತರತ್ನ ಪಡೆದ ಇಂಜಿನಿಯರ್:`,[`ಸರ್. ಎಂ. ವಿಶ್ವೇಶ್ವರಯ್ಯ`,`ಕುವೆಂಪು`,`ಎಡಿಸನ್`,`ರಾಜ್‌ಕುಮಾರ್`],0),
M(`ಸರ್. ಎಂ. ವಿಶ್ವೇಶ್ವರಯ್ಯನವರಿಗೆ ಭಾರತರತ್ನ ದೊರೆತ ವರ್ಷ:`,[`1947`,`1950`,`1955`,`1960`],2,'m'),
O(`ನಾಡಗೀತೆಯನ್ನು ಬರೆದವರು ಯಾರು?`,`ಕುವೆಂಪು.`),
O(`ಡಾ|| ರಾಜ್‌ಕುಮಾರ್ ತಮ್ಮ ಎಷ್ಟನೇ ವಯಸ್ಸಿನಲ್ಲಿ ಬಾಲನಟನಾಗಿ ಅಭಿನಯಿಸಿದರು?`,`8ನೇ ವಯಸ್ಸಿನಲ್ಲಿ.`),
O(`ಕಿತ್ತೂರಿನ ದೇಸಾಯಿ ಯಾರು?`,`ಮಲ್ಲಸರ್ಜ.`),
O(`ಮದರ್ ಥೆರೆಸಾ ಅವರಿಗೆ ದೊರೆತ ಪ್ರಶಸ್ತಿ ಯಾವುದು?`,`ನೊಬೆಲ್ ಪ್ರಶಸ್ತಿ.`),
O(`ಎಡಿಸನ್ ಕಂಡುಹಿಡಿದ ಮುಖ್ಯ ಸಾಧನ ಯಾವುದು?`,`ವಿದ್ಯುತ್ ಬಲ್ಬ್.`),
O(`ಕಿವಿ ಕೇಳದಿದ್ದರೂ ಅದ್ಭುತವಾಗಿ ನಟಿಸುತ್ತಿದ್ದ ಕನ್ನಡ ಚಿತ್ರನಟ ಯಾರು?`,`ಬಾಲಕೃಷ್ಣ.`),
G(`ಖಾಲಿ ಬಿಟ್ಟ ಸ್ಥಳ ತುಂಬಿ: ಕುವೆಂಪು ಅವರು ______ ಎಂದೇ ಪ್ರಖ್ಯಾತರು.`,`ರಾಷ್ಟ್ರಕವಿ`),
G(`ಖಾಲಿ ಬಿಟ್ಟ ಸ್ಥಳ ತುಂಬಿ: ಎಡಿಸನ್‌ಗೆ ಶಾಲೆಯಲ್ಲಿ ______ ತುಂಬಾ ಹಿಂದೆ ಇದ್ದ.`,`ಗಣಿತದಲ್ಲಿ`),
G(`ಸರಿ/ತಪ್ಪು ಬರೆ: ಪ್ರತಿಯೊಬ್ಬ ವ್ಯಕ್ತಿಯೂ ವಿಶಿಷ್ಟ.`,`ಸರಿ`),
G(`ಸರಿ/ತಪ್ಪು ಬರೆ: ವಿಕಲಚೇತನರು ನಮ್ಮಂತೆ ಅಲ್ಲ.`,`ತಪ್ಪು. ಇವರೂ ನಮ್ಮಂತೆಯೇ.`),
G(`ಹೊಂದಿಸಿ ಬರೆ: ಕುವೆಂಪು, ಚೆನ್ನಮ್ಮ, ಗಂಗೂಬಾಯಿ – (ಸಂಗೀತ, ಕವಿತೆ, ಹೋರಾಟ).`,`ಕುವೆಂಪು – ಕವಿತೆ; ಚೆನ್ನಮ್ಮ – ಹೋರಾಟ; ಗಂಗೂಬಾಯಿ – ಸಂಗೀತ`,'m'),
G(`ಹೊಂದಿಸಿ ಬರೆ: ವಿಶ್ವೇಶ್ವರಯ್ಯ, ಮದರ್ ಥೆರೆಸಾ – (ಸೇವೆ, ಇಂಜಿನಿಯರಿಂಗ್).`,`ವಿಶ್ವೇಶ್ವರಯ್ಯ – ಇಂಜಿನಿಯರಿಂಗ್ (ಅಣೆಕಟ್ಟುಗಳು, ಕೈಗಾರಿಕೆಗಳು); ಮದರ್ ಥೆರೆಸಾ – ಸೇವೆ`,'m'),
S(`ಕೌಶಲ ಮತ್ತು ಪ್ರೋತ್ಸಾಹ ಏಕೆ ಮುಖ್ಯ?`,`ಬಾಲ್ಯದಲ್ಲೇ ಕೌಶಲವನ್ನು ಗುರುತಿಸಿ ಸರಿಯಾದ ಅವಕಾಶ ಮತ್ತು ಪ್ರೋತ್ಸಾಹ ನೀಡಿದರೆ ಮಕ್ಕಳು ಆಯಾ ಕ್ಷೇತ್ರದಲ್ಲಿ ಹೆಸರು ಮಾಡಬಹುದು.`),
S(`ಎಡಿಸನ್ ಶಾಲೆಗೆ ಹೋಗುವುದು ನಿಂತಿದ್ದು ಏಕೆ? ಅವನಿಗೆ ಶಿಕ್ಷಣ ನೀಡಿದವರು ಯಾರು?`,`ಜ್ವರ ಬಂದು ಕಿವಿಯ ಸೋಂಕಿನಿಂದ ಕೇಳುವ ಸಾಮರ್ಥ್ಯ ಕಳೆದುಕೊಂಡು ಕಿವುಡನಾದ್ದರಿಂದ. ಅವನ ತಾಯಿ ಮನೆಯಲ್ಲಿಯೇ ಶಿಕ್ಷಣ ನೀಡಿದರು.`),
S(`ನಿನ್ನ ಗೆಳೆಯ/ಗೆಳತಿಯಲ್ಲಿ ನೀನು ಮೆಚ್ಚುವ ಒಂದು ವಿಶೇಷ ಗುಣ ಬರೆ.`,`ಮಾದರಿ ಉತ್ತರ: ರಾಮು ಚೆನ್ನಾಗಿ ಅಭಿನಯಿಸುತ್ತಾನೆ.`),
L(`ಕಿತ್ತೂರು ರಾಣಿ ಚೆನ್ನಮ್ಮನ ಬಗ್ಗೆ ಬರೆ.`,`ಚೆನ್ನಮ್ಮ ಬೆಳಗಾವಿಯ ಕಾಕತಿಯಲ್ಲಿ ಜನಿಸಿದಳು. ಬಾಲ್ಯದಲ್ಲಿಯೇ ತುಂಬಾ ಧೈರ್ಯಶಾಲಿ. ಎಳೆ ವಯಸ್ಸಿನಲ್ಲೇ ಕುದುರೆ ಸವಾರಿ, ಕತ್ತಿವರಸೆ ಮತ್ತು ಬಿಲ್ಲು ವಿದ್ಯೆಗಳಲ್ಲಿ ಆಸಕ್ತಿ ತೋರಿ ಯುದ್ಧ ಕೌಶಲ ರೂಢಿಸಿಕೊಂಡಳು. ಕಿತ್ತೂರಿನ ದೇಸಾಯಿ ಮಲ್ಲಸರ್ಜನನ್ನು ಮದುವೆಯಾಗಿ ರಾಣಿಯಾದಳು. ಮಲ್ಲಸರ್ಜನ ಕಾಲಾನಂತರ ಬ್ರಿಟಿಷರೊಡನೆ ಸಾಹಸದಿಂದ ಹೋರಾಡಿ ವೀರ ಮಹಿಳೆ ಎನಿಸಿಕೊಂಡಳು.`),
L(`ಥಾಮಸ್ ಆಲ್ವಾ ಎಡಿಸನ್ ಬಗ್ಗೆ ಬರೆ.`,`ಬಾಲಕ ಎಡಿಸನ್ ಶಾಲೆಯಲ್ಲಿ ಗಣಿತದಲ್ಲಿ ಹಿಂದಿದ್ದನು ಮತ್ತು ಪದಗಳನ್ನು ಉಚ್ಚರಿಸಲು ಕಷ್ಟಪಡುತ್ತಿದ್ದನು. ಶಾಲೆಗೆ ಸೇರಿದ ಮೂರು ತಿಂಗಳಲ್ಲಿ ಜ್ವರ ಬಂದು ಕಿವಿಯ ಸೋಂಕಿನಿಂದ ಕಿವುಡನಾದನು, ಶಾಲೆಗೆ ಹೋಗುವುದು ನಿಂತಿತು. ತಾಯಿ ಮನೆಯಲ್ಲೇ ಶಿಕ್ಷಣ ನೀಡಿದರು. ಮುಂದೆ ದೊಡ್ಡವನಾಗಿ ನಮ್ಮ ಮನೆಯಲ್ಲಿ ಉರಿಯುವ ಬಲ್ಬ್ ಸೇರಿದಂತೆ ಅನೇಕ ಮಹತ್ವಪೂರ್ಣ ಸಾಧನಗಳನ್ನು ಕಂಡುಹಿಡಿದನು.`)
]});

LSV.push({n:19,t:`ವೃತ್ತಿ ವಿಶೇಷ`,au:`ಸಮಿತಿ ರಚನೆ`,pg:54,
words:`ವೃತ್ತಿ (ಕಸುಬು) – ಜೀವನೋಪಾಯಕ್ಕಾಗಿ ಮಾಡುವ ಕೆಲಸ; ಕಸುಬುದಾರ – ಕಸುಬು ಮಾಡುವವ; ಕಮ್ಮಾರ – ಕಬ್ಬಿಣದ ವಸ್ತು ತಯಾರಿಸುವವ; ಕುಂಬಾರ – ಮಣ್ಣಿನ ಪಾತ್ರೆ ಮಾಡುವವ; ಬಡಗಿ – ಮರದ ವಸ್ತು ತಯಾರಿಸುವವ; ನೇಕಾರ – ಬಟ್ಟೆ ನೇಯುವವ; ದರ್ಜಿ – ಬಟ್ಟೆ ಹೊಲಿಯುವವ; ದುಡಿಮೆ – ಕೆಲಸ ಮಾಡಿ ಸಂಪಾದಿಸುವುದು; ಅವಲಂಬನೆ – ಅವಲಂಬಿಸುವುದು`,
notes:`ದಿನನಿತ್ಯ ಬಳಸುವ ವಸ್ತುಗಳ ತಯಾರಿಕೆಯ ಹಿಂದೆ ಅನೇಕ ಕಸುಬುದಾರರ ಶ್ರಮವಿದೆ. ಒಂದು ಕಸುಬಿನವರು ಮತ್ತೊಂದು ಕಸುಬಿನವರನ್ನು ಅವಲಂಬಿಸುತ್ತಾರೆ (ಆನೆಯ ಚಿತ್ರಕಥೆ: ಮಿಠಾಯಿಯವನು → ಬಡಗಿ → ಕಮ್ಮಾರ → ಕುಂಬಾರ). ಕೃಷಿ → ಹತ್ತಿ → ನೂಲು → ನೇಯ್ಗೆ → ದರ್ಜಿ: ಬಟ್ಟೆ ಸಿದ್ಧವಾಗುವ ಹಂತಗಳು. ಕರ್ನಾಟಕದಲ್ಲಿ ಚನ್ನಪಟ್ಟಣದ ಗೊಂಬೆ ಪ್ರಸಿದ್ಧ; ಗಂಧದ ಮರದ ಕೆತ್ತನೆ ಸುಪ್ರಸಿದ್ಧ. 14 ವರ್ಷದೊಳಗಿನ ಮಕ್ಕಳನ್ನು ದುಡಿಮೆಯಲ್ಲಿ ತೊಡಗಿಸುವುದು ಶಿಕ್ಷಾರ್ಹ ಅಪರಾಧ; 6–14 ವರ್ಷದ ಮಕ್ಕಳಿಗೆ ಶಿಕ್ಷಣ ಕಡ್ಡಾಯ. ಸರ್ಕಾರವು ವಿಶೇಷ ವಸತಿ ಶಾಲೆಗಳು ಹಾಗೂ ಪುನರ್ವಸತಿ ಕೇಂದ್ರಗಳನ್ನು ತೆರೆದಿದೆ.`,
ab:[
[`ಆನೆಯ ಚಿತ್ರಕಥೆ`,[
[`ಆನೆ ಯಾವ ಯಾವ ಕಸುಬಿನವರ ಬಳಿ ಹೋಯಿತು?`,`ಮಿಠಾಯಿ ಮಾರುವವನು, ಬಡಗಿ, ಕಮ್ಮಾರ ಮತ್ತು ಕುಂಬಾರನ ಬಳಿ.`],
[`ಆನೆ ಯಾವ ಯಾವ ವಸ್ತುಗಳನ್ನು ಪಡೆಯಿತು?`,`ಮಡಕೆ (ಕುಂಬಾರನಿಂದ), ಗರಗಸ (ಕಮ್ಮಾರನಿಂದ), ಮೇಜು (ಬಡಗಿಯಿಂದ), ಮಿಠಾಯಿ (ಮಿಠಾಯಿಯವನಿಂದ).`],
[`ಕುಂಬಾರನಿಗೆ ಆನೆ ಹೇಗೆ ನೆರವಾಯಿತು?`,`ಹದವಾಗಿರದ ಮಣ್ಣನ್ನು ತುಳಿದು ಹದ ಮಾಡಿಕೊಟ್ಟಿತು.`],
[`ಆನೆಗೆ ಕೊನೆಯಲ್ಲಿ ಏನು ಸಿಕ್ಕಿತು?`,`ಮಿಠಾಯಿ; ಅದನ್ನು ತಿಂದು ಖಾರ ಹೋಯಿತು.`],
[`ಈ ಕಥೆ ನಮಗೆ ಏನನ್ನು ತಿಳಿಸುತ್ತದೆ?`,`ಒಂದು ಕಸುಬಿನವರು ಮತ್ತೊಂದು ಕಸುಬಿನವರನ್ನು ಅವಲಂಬಿಸಿದ್ದಾರೆ.`]]],
[`ಬಟ್ಟೆ ಸಿದ್ಧವಾಗುವ ಹಂತ`,[
[`ನಾವು ಹಾಕುವ ಬಟ್ಟೆ ಸಿದ್ಧವಾಗಲು ಯಾರ ಸಹಕಾರ ಬೇಕು?`,`ಹತ್ತಿ ಬೆಳೆಯುವ ರೈತ → ನೂಲು ತೆಗೆಯುವವರು → ನೇಕಾರ → ದರ್ಜಿ (ಹೊಲಿಯುವವರು).`],
[`ದುಡಿಯುವ ಮಕ್ಕಳು ಎದುರಿಸುವ ಯಾವುದಾದರೂ ಸಮಸ್ಯೆಗಳು?`,`ಶಿಕ್ಷಣ ಸಿಗದಿರುವುದು, ಆರೋಗ್ಯ ಹಾನಿ, ಆಟ–ಪಾಠಗಳಿಂದ ವಂಚಿತರಾಗುವುದು, ಬಾಲ್ಯ ಕಳೆದುಕೊಳ್ಳುವುದು. (ಮಾದರಿ ಉತ್ತರ)`]]],
[`ವೃತ್ತಿಗಳು ಮತ್ತು ಕೆಲಸಗಳು`,[
[`ಹೊಂದಿಸಿ: ರೈತ`,`ಬೆಳೆ ಬೆಳೆಯುತ್ತಾನೆ.`],
[`ಹೊಂದಿಸಿ: ಬಡಗಿ`,`ಮರದ ಮೇಜು, ಕುರ್ಚಿ ತಯಾರಿಸುತ್ತಾನೆ.`],
[`ಹೊಂದಿಸಿ: ಕುಂಬಾರ`,`ಮಣ್ಣಿನ ಮಡಕೆ ಮಾಡುತ್ತಾನೆ.`],
[`ಹೊಂದಿಸಿ: ಕಮ್ಮಾರ`,`ಕಬ್ಬಿಣದ ಉಪಕರಣಗಳನ್ನು ತಯಾರಿಸುತ್ತಾನೆ.`],
[`ಹೊಂದಿಸಿ: ದರ್ಜಿ`,`ಬಟ್ಟೆ ಹೊಲಿಯುತ್ತಾನೆ.`],
[`ಹೊಂದಿಸಿ: ಬೆಸ್ತ`,`ಮೀನು ಹಿಡಿಯುತ್ತಾನೆ.`]]]
],
qb:[
M(`ಕಬ್ಬಿಣದ ವಸ್ತುಗಳನ್ನು ತಯಾರಿಸುವ ಕಸುಬುದಾರ:`,[`ಬಡಗಿ`,`ಕಮ್ಮಾರ`,`ಕುಂಬಾರ`,`ನೇಕಾರ`],1),
M(`ಮಣ್ಣಿನ ಪಾತ್ರೆ ಮಾಡುವವನು:`,[`ಕುಂಬಾರ`,`ಕಮ್ಮಾರ`,`ದರ್ಜಿ`,`ಬಡಗಿ`],0),
M(`ಮರದ ಮೇಜು ಮಾಡುವವನು:`,[`ಕುಂಬಾರ`,`ಬಡಗಿ`,`ದರ್ಜಿ`,`ಬೆಸ್ತ`],1),
M(`ಬಟ್ಟೆ ನೇಯುವವನು:`,[`ನೇಕಾರ`,`ಕಮ್ಮಾರ`,`ರೈತ`,`ಕುಂಬಾರ`],0),
M(`ಬಟ್ಟೆ ಹೊಲಿಯುವವನು:`,[`ಬಡಗಿ`,`ದರ್ಜಿ`,`ಕುಂಬಾರ`,`ವೈದ್ಯ`],1),
M(`ದುಡಿಮೆಯಲ್ಲಿ ತೊಡಗಿಸಲು ನಿಷೇಧಿಸಲಾದ ವಯೋಮಿತಿ:`,[`14 ವರ್ಷದೊಳಗಿನವರು`,`18 ವರ್ಷದ ಮೇಲಿನವರು`,`30 ವರ್ಷದವರು`,`60 ವರ್ಷದ ಮೇಲಿನವರು`],0),
M(`ಗೊಂಬೆಗಳ ತಯಾರಿಕೆಗೆ ಪ್ರಸಿದ್ಧ ಊರು:`,[`ಚನ್ನಪಟ್ಟಣ`,`ಬಾದಾಮಿ`,`ಹಂಪಿ`,`ಹಾಸನ`],0),
M(`ಕಡ್ಡಾಯ ಶಿಕ್ಷಣದ ವಯೋಮಿತಿ:`,[`6–14 ವರ್ಷ`,`3–5 ವರ್ಷ`,`15–18 ವರ್ಷ`,`20 ವರ್ಷ ಮೇಲ್ಪಟ್ಟು`],0,'m'),
O(`ಆನೆಯ ಚಿತ್ರಕಥೆಯಲ್ಲಿ ಕೊನೆಗೆ ಮಿಠಾಯಿ ಕೊಟ್ಟವನು ಯಾರು?`,`ಮಿಠಾಯಿ ಮಾರುವವನು.`),
O(`ಕರ್ನಾಟಕದ ಯಾವ ಮರದ ಕೆತ್ತನೆ ಸುಪ್ರಸಿದ್ಧ?`,`ಗಂಧದ ಮರದ ಕೆತ್ತನೆ.`),
O(`ಹತ್ತಿಯಿಂದ ಬಟ್ಟೆ ತಯಾರಿಸಲು ಮೊದಲು ಏನು ತಯಾರಿಸುತ್ತಾರೆ?`,`ನೂಲು.`),
O(`ದುಡಿಯುವ ಮಕ್ಕಳ ಶಿಕ್ಷಣಕ್ಕಾಗಿ ಸರ್ಕಾರ ಏನು ಪ್ರಾರಂಭಿಸಿದೆ?`,`ವಿಶೇಷ ವಸತಿ ಶಾಲೆಗಳು ಮತ್ತು ಪುನರ್ವಸತಿ ಕೇಂದ್ರಗಳು.`),
O(`ಕೈ ಬೆರಳುಗಳಿಂದ ಹೂ ಕಟ್ಟಿ ಮಾರುವವರಿಗೆ ಏನೆನ್ನುತ್ತಾರೆ?`,`ಹೂ ಮಾರುವವರು (ಹೂವಾಡಿಗ/ಹೂವಾಡಗಿತ್ತಿ).`),
O(`ನೀರು ಹಾಕಿ ಬೆಳೆ ಬೆಳೆಸುವವನು ಯಾರು?`,`ರೈತ.`),
G(`ಖಾಲಿ ಬಿಟ್ಟ ಸ್ಥಳ ತುಂಬಿ: ಆನೆಯು ಹದವಿಲ್ಲದ ಮಣ್ಣನ್ನು ______ ಹದ ಮಾಡಿತು.`,`ತುಳಿದು`),
G(`ಖಾಲಿ ಬಿಟ್ಟ ಸ್ಥಳ ತುಂಬಿ: ಒಂದು ಕಸುಬಿನವರು ಮತ್ತೊಂದು ಕಸುಬಿನವರನ್ನು ______.`,`ಅವಲಂಬಿಸುತ್ತಾರೆ`),
G(`ಸರಿ/ತಪ್ಪು ಬರೆ: 14 ವರ್ಷದೊಳಗಿನ ಮಕ್ಕಳನ್ನು ದುಡಿಮೆಗೆ ಹಚ್ಚುವುದು ಅಪರಾಧ.`,`ಸರಿ`),
G(`ಸರಿ/ತಪ್ಪು ಬರೆ: ಬಟ್ಟೆ ತಯಾರಿಕೆಯ ಹಿಂದೆ ಒಬ್ಬನೇ ಕಸುಬುದಾರನ ಶ್ರಮ ಇರುತ್ತದೆ.`,`ತಪ್ಪು. ಅನೇಕ ಕಸುಬುದಾರರ ಶ್ರಮವಿರುತ್ತದೆ.`),
G(`ಹೊಂದಿಸಿ ಬರೆ: ಕುಂಬಾರ, ಕಮ್ಮಾರ, ಬಡಗಿ – (ಮಡಕೆ, ಗರಗಸ, ಮೇಜು).`,`ಕುಂಬಾರ – ಮಡಕೆ; ಕಮ್ಮಾರ – ಗರಗಸ; ಬಡಗಿ – ಮೇಜು`,'m'),
S(`ದುಡಿಯುವ ಮಕ್ಕಳು ಎದುರಿಸುವ ಯಾವುದಾದರೂ ಎರಡು ಸಮಸ್ಯೆ ಬರೆ.`,`ಶಿಕ್ಷಣ ಸಿಗದಿರುವುದು; ಆರೋಗ್ಯ ಹಾಳಾಗುವುದು; ಆಟ–ಬಾಲ್ಯ ಕಳೆದುಕೊಳ್ಳುವುದು.`),
S(`ಕರ್ನಾಟಕದ ಯಾವುದಾದರೂ ಎರಡು ಪ್ರಸಿದ್ಧ ಕರಕುಶಲ ವಸ್ತುಗಳ ಹೆಸರು ಬರೆ.`,`ಚನ್ನಪಟ್ಟಣದ ಗೊಂಬೆಗಳು; ಗಂಧದ ಮರದ ಕೆತ್ತನೆ.`),
S(`ಹತ್ತಿಯಿಂದ ಬಟ್ಟೆ ತಯಾರಾಗುವ ಹಂತಗಳನ್ನು ಬರೆ.`,`ಹತ್ತಿ ಬೆಳೆಯುವುದು → ನೂಲು ತೆಗೆಯುವುದು → ನೇಯ್ಗೆ → ಬಟ್ಟೆ → ಹೊಲಿಗೆ.`),
L(`ಒಂದು ಕಸುಬಿನವರು ಮತ್ತೊಂದು ಕಸುಬಿನವರನ್ನು ಹೇಗೆ ಅವಲಂಬಿಸುತ್ತಾರೆ ಎಂಬುದನ್ನು ಆನೆಯ ಕಥೆಯ ಮೂಲಕ ವಿವರಿಸು.`,`ಖಾರ ತಿಂದ ಆನೆ ಮಿಠಾಯಿಯವನ ಬಳಿ ಹೋದಾಗ ಅವನು ಇಡಲು ಮೇಜು ಬೇಕೆಂದನು. ಬಡಗಿ ಮೇಜಿಗೆ ಮರ ಕೊಯ್ಯಲು ಗರಗಸ ಬೇಕೆಂದನು. ಕಮ್ಮಾರ ಕಬ್ಬಿಣವನ್ನು ತಂಪು ಮಾಡಲು ನೀರು ಇಡುವ ಮಡಕೆ ಬೇಕೆಂದನು. ಕುಂಬಾರ ಮಣ್ಣನ್ನು ತುಳಿದು ಹದ ಮಾಡಿದರೆ ಮಡಕೆ ಕೊಡುವೆನೆಂದನು. ಆನೆ ಮಣ್ಣು ತುಳಿದು ಹದ ಮಾಡಿ ಮಡಕೆ ಪಡೆದು ಕಮ್ಮಾರನಿಗೆ ಕೊಟ್ಟು ಗರಗಸ ಪಡೆದು ಬಡಗಿಗೆ ಕೊಟ್ಟು ಮೇಜು ಪಡೆದು ಮಿಠಾಯಿಯವನಿಗೆ ಕೊಟ್ಟು ಮಿಠಾಯಿ ಪಡೆದು ತಿಂದಿತು. ಹೀಗೆ ಕಸುಬುದಾರರು ಪರಸ್ಪರ ಅವಲಂಬಿತರು.`),
L(`ದುಡಿಯುವ ಮಕ್ಕಳ ಸಮಸ್ಯೆಗಳೇನು? ಅವರ ಶಿಕ್ಷಣಕ್ಕಾಗಿ ಏನು ಮಾಡಬೇಕು?`,`14 ವರ್ಷದೊಳಗಿನ ಮಕ್ಕಳನ್ನು ದುಡಿಮೆಯಲ್ಲಿ ತೊಡಗಿಸುವುದು ಶಿಕ್ಷಾರ್ಹ ಅಪರಾಧ. ದುಡಿಯುವ ಮಕ್ಕಳಿಗೆ ಶಿಕ್ಷಣ ಸಿಗುವುದಿಲ್ಲ, ಆರೋಗ್ಯ ಹಾಳಾಗುತ್ತದೆ, ಬಾಲ್ಯದ ಆಟ–ಪಾಠ ಕಳೆದುಕೊಳ್ಳುತ್ತಾರೆ. 6–14 ವರ್ಷದ ಮಕ್ಕಳು ಕಡ್ಡಾಯವಾಗಿ ಶಿಕ್ಷಣ ಪಡೆಯುವಂತೆ ಮಾಡುವುದು ಎಲ್ಲರ ಜವಾಬ್ದಾರಿ. ಕರ್ನಾಟಕ ಸರ್ಕಾರ ವಿಶೇಷ ವಸತಿ ಶಾಲೆಗಳು ಹಾಗೂ ಪುನರ್ವಸತಿ ಕೇಂದ್ರಗಳನ್ನು ಎಲ್ಲ ಜಿಲ್ಲೆಗಳಲ್ಲಿ ಪ್ರಾರಂಭಿಸಿದೆ.`)
]});
LSV.push({n:20,t:`ಹಬ್ಬ–ಹರುಷ`,au:`ಸಮಿತಿ ರಚನೆ`,pg:60,
words:`ರಾಷ್ಟ್ರೀಯ ಹಬ್ಬ – ದೇಶದ ಜನರೆಲ್ಲ ಆಚರಿಸುವ ಹಬ್ಬ; ಸ್ವಾತಂತ್ರ್ಯ – ಸ್ವತಂತ್ರ; ಗಣರಾಜ್ಯ – ಜನರೇ ಆಳುವ ರಾಜ್ಯ; ರಾಷ್ಟ್ರಧ್ವಜ – ದೇಶದ ಬಾವುಟ; ರಾಷ್ಟ್ರಗೀತೆ – ದೇಶದ ಗೀತೆ; ನಾಡಗೀತೆ – ರಾಜ್ಯದ ಗೀತೆ; ರಾಷ್ಟ್ರಮುದ್ರೆ – ದೇಶದ ಲಾಂಛನ; ಏಕತೆ – ಒಗ್ಗಟ್ಟು; ಭಾವೈಕ್ಯತೆ – ಭಾವನೆಗಳ ಐಕ್ಯತೆ; ಗೌರವ – ಮರ್ಯಾದೆ`,
notes:`ಆಗಸ್ಟ್ 15 – ಸ್ವಾತಂತ್ರ್ಯ ದಿನಾಚರಣೆ; ಜನವರಿ 26 – ಗಣರಾಜ್ಯೋತ್ಸವ; ಅಕ್ಟೋಬರ್ 2 – ಗಾಂಧಿ ಜಯಂತಿ (ರಾಷ್ಟ್ರೀಯ ಹಬ್ಬಗಳು). ನವೆಂಬರ್ 1 – ಕನ್ನಡ ರಾಜ್ಯೋತ್ಸವ; ದಸರಾ – ನಾಡಹಬ್ಬ. ರಾಷ್ಟ್ರಧ್ವಜ: ಮೂರು ಬಣ್ಣಗಳು (ಕೇಸರಿ, ಬಿಳಿ, ಹಸಿರು); ಮಧ್ಯದಲ್ಲಿ ಅಶೋಕ ಚಕ್ರ. ರಾಷ್ಟ್ರಮುದ್ರೆ: ಸಿಂಹ ಬೋದಿಗೆ – ನಾಲ್ಕು ಸಿಂಹಗಳು (ಮೂರು ಕಾಣುತ್ತವೆ); ಕೆಳಗೆ ಕುದುರೆ, ಚಕ್ರ, ಬಸವ; 'ಸತ್ಯಮೇವ ಜಯತೇ'. ನಾಡಗೀತೆ: ಜಯ್ ಭಾರತ ಜನನಿಯ ತನುಜಾತೆ. ರಾಷ್ಟ್ರಗೀತೆ: ಜನ ಗಣ ಮನ. ರಾಷ್ಟ್ರಗೀತೆ ಹಾಡುವಾಗ ನೇರವಾಗಿ ನಿಂತು ಗೌರವ ತೋರಿಸಬೇಕು. ನಿನಗಿದು ಗೊತ್ತೆ?: ಕರ್ನಾಟಕ – ಧ್ವಜ ಹಳದಿ–ಕೆಂಪು, ಪ್ರಾಣಿ ಆನೆ, ಹೂ ಕಮಲ, ವೃಕ್ಷ ಶ್ರೀಗಂಧ, ಪಕ್ಷಿ ನೀಲಕಂಠ. ಭಾರತ – ಪ್ರಾಣಿ ಹುಲಿ, ಹೂ ಕಮಲ, ಪಕ್ಷಿ ನವಿಲು, ಮರ ಆಲದ ಮರ, ಹಣ್ಣು ಮಾವು.`,
ab:[
[`ರಾಷ್ಟ್ರೀಯ ಹಬ್ಬಗಳು`,[
[`ಆಗಸ್ಟ್ 15ರಂದು ನಾವು ಯಾವ ದಿನವನ್ನು ಆಚರಿಸುತ್ತೇವೆ?`,`ಸ್ವಾತಂತ್ರ್ಯ ದಿನಾಚರಣೆ.`],
[`ಭಾರತ ಗಣರಾಜ್ಯವಾದ ನೆನಪಿಗಾಗಿ ಯಾವ ದಿನ ಗಣರಾಜ್ಯೋತ್ಸವ ಆಚರಿಸುತ್ತಾರೆ?`,`ಜನವರಿ 26.`],
[`ಗಾಂಧೀಜಯಂತಿ ಯಾವ ದಿನ?`,`ಅಕ್ಟೋಬರ್ 2.`],
[`ಕನ್ನಡ ರಾಜ್ಯೋತ್ಸವ ಯಾವಾಗ ಆಚರಿಸುತ್ತಾರೆ? ಏಕೆ?`,`ನವೆಂಬರ್ 1ರಂದು. ಅದು ನಮ್ಮ ರಾಜ್ಯ ರಚನೆಯಾದ ದಿನ.`],
[`ನಾಡಹಬ್ಬವೆಂದು ಆಚರಿಸುವ ಹಬ್ಬ ಯಾವುದು?`,`ದಸರಾ.`],
[`ದೇಶ ಮತ್ತು ರಾಷ್ಟ್ರ ಪದಗಳ ಅರ್ಥವೇನು?`,`ನಿರ್ದಿಷ್ಟ ಭೌಗೋಳಿಕ ಮೇರೆ ಇರುವ ಒಂದು ಆಡಳಿತಕ್ಕೊಳಪಟ್ಟ ಪ್ರದೇಶವೇ ದೇಶ. ಒಂದೇ ಇತಿಹಾಸ, ಸಂಸ್ಕೃತಿ, ಆಶೋತ್ತರಗಳುಳ್ಳ ಹಾಗೂ ತಾವು ಒಂದೇ ಎಂಬ ಭಾವನೆಯಿಂದ ಬದುಕುವ ಜನತೆಯನ್ನು ಒಳಗೊಂಡ ದೇಶವೇ ರಾಷ್ಟ್ರ.`]]],
[`ರಾಷ್ಟ್ರಧ್ವಜ, ರಾಷ್ಟ್ರಗೀತೆ, ರಾಷ್ಟ್ರಮುದ್ರೆ`,[
[`ರಾಷ್ಟ್ರಧ್ವಜದಲ್ಲಿ ಎಷ್ಟು ಬಣ್ಣಗಳಿವೆ? ಮಧ್ಯದಲ್ಲಿ ಏನಿದೆ?`,`ಮೂರು ಬಣ್ಣಗಳು (ಕೇಸರಿ, ಬಿಳಿ, ಹಸಿರು). ಮಧ್ಯದಲ್ಲಿ ಅಶೋಕ ಚಕ್ರವಿದೆ.`],
[`ರಾಷ್ಟ್ರಗೀತೆ, ನಾಡಗೀತೆ ಹಾಡುವಾಗ ನೀನು ಏಕೆ ನಿಲ್ಲುವೆ?`,`ಗೌರವ ತೋರಿಸಲು.`],
[`ನಾಡಗೀತೆ ಮತ್ತು ರಾಷ್ಟ್ರಗೀತೆ ಯಾವುವು?`,`ನಾಡಗೀತೆ – ಜಯ್ ಭಾರತ ಜನನಿಯ ತನುಜಾತೆ; ರಾಷ್ಟ್ರಗೀತೆ – ಜನ ಗಣ ಮನ.`],
[`ರಾಷ್ಟ್ರಮುದ್ರೆಗೆ ಯಾವ ಹೆಸರಿದೆ?`,`ಸಿಂಹ ಬೋದಿಗೆ.`],
[`ರಾಷ್ಟ್ರಮುದ್ರೆಯಲ್ಲಿ ಎಷ್ಟು ಸಿಂಹಗಳಿವೆ? ಎಷ್ಟು ಕಾಣುತ್ತವೆ?`,`ನಾಲ್ಕು ಸಿಂಹಗಳಿವೆ; ಮೂರು ಮಾತ್ರ ಕಾಣುತ್ತವೆ.`],
[`ಸಿಂಹದ ಕೆಳಗೆ ಇರುವ ನುಡಿ ಯಾವುದು?`,`ಸತ್ಯಮೇವ ಜಯತೇ.`],
[`ರಾಷ್ಟ್ರ ಲಾಂಛನಗಳಿಂದ ನಾವು ಕಲಿಯುವ ಗುಣಗಳೇನು?`,`ದೇಶಾಭಿಮಾನ, ಭಾವೈಕ್ಯತೆ ಮತ್ತು ಒಗ್ಗಟ್ಟು.`]]],
[`ಪ್ರಾಣಿ, ಪಕ್ಷಿ, ಹೂ`,[
[`ಕರ್ನಾಟಕದ ಪ್ರಾಣಿ, ಹೂ, ವೃಕ್ಷ, ಪಕ್ಷಿ`,`ಆನೆ, ಕಮಲ, ಶ್ರೀಗಂಧದ ಮರ, ನೀಲಕಂಠ.`],
[`ಭಾರತದ ರಾಷ್ಟ್ರೀಯ ಪ್ರಾಣಿ, ಹೂ, ಪಕ್ಷಿ, ಮರ, ಹಣ್ಣು`,`ಹುಲಿ, ಕಮಲ, ನವಿಲು, ಆಲದ ಮರ, ಮಾವು.`],
[`ಕರ್ನಾಟಕದ ಧ್ವಜದ ಬಣ್ಣ`,`ಹಳದಿ ಮತ್ತು ಕೆಂಪು.`]]]
],
qb:[
M(`ಸ್ವಾತಂತ್ರ್ಯ ದಿನಾಚರಣೆ ಯಾವಾಗ?`,[`ಜನವರಿ 26`,`ಆಗಸ್ಟ್ 15`,`ಅಕ್ಟೋಬರ್ 2`,`ನವೆಂಬರ್ 1`],1),
M(`ಗಣರಾಜ್ಯೋತ್ಸವ ಯಾವಾಗ?`,[`ಜನವರಿ 26`,`ಆಗಸ್ಟ್ 15`,`ಅಕ್ಟೋಬರ್ 2`,`ನವೆಂಬರ್ 1`],0),
M(`ಗಾಂಧೀ ಜಯಂತಿ ಆಚರಿಸುವ ದಿನ:`,[`ಜನವರಿ 26`,`ಆಗಸ್ಟ್ 15`,`ಅಕ್ಟೋಬರ್ 2`,`ನವೆಂಬರ್ 1`],2),
M(`ಕನ್ನಡ ರಾಜ್ಯೋತ್ಸವ ಯಾವ ದಿನ?`,[`ಜನವರಿ 26`,`ಆಗಸ್ಟ್ 15`,`ಅಕ್ಟೋಬರ್ 2`,`ನವೆಂಬರ್ 1`],3),
M(`ರಾಷ್ಟ್ರಧ್ವಜದ ಮಧ್ಯದಲ್ಲಿರುವುದು:`,[`ಸಿಂಹ`,`ಅಶೋಕ ಚಕ್ರ`,`ಕಮಲ`,`ನಕ್ಷತ್ರ`],1),
M(`ರಾಷ್ಟ್ರಮುದ್ರೆಯಲ್ಲಿ ಕಾಣುವ ಸಿಂಹಗಳ ಸಂಖ್ಯೆ:`,[`ಎರಡು`,`ಮೂರು`,`ನಾಲ್ಕು`,`ಐದು`],1),
M(`ನಮ್ಮ ರಾಷ್ಟ್ರಗೀತೆ:`,[`ಜನ ಗಣ ಮನ`,`ವಂದೇ ಮಾತರಂ`,`ಜಯ್ ಭಾರತ ಜನನಿಯ ತನುಜಾತೆ`,`ಹಚ್ಚೇವು ಕನ್ನಡದ ದೀಪ`],0),
M(`ನಮ್ಮ ರಾಜ್ಯದ ಪಕ್ಷಿ:`,[`ನವಿಲು`,`ನೀಲಕಂಠ`,`ಗಿಳಿ`,`ಕೋಗಿಲೆ`],1,'m'),
O(`ನಾಡಗೀತೆಯನ್ನು ಬರೆದವರು ಯಾರು?`,`ಕುವೆಂಪು.`),
O(`ಭಾರತದ ರಾಷ್ಟ್ರೀಯ ಪ್ರಾಣಿ ಯಾವುದು?`,`ಹುಲಿ.`),
O(`ಭಾರತದ ರಾಷ್ಟ್ರೀಯ ಹಣ್ಣು ಯಾವುದು?`,`ಮಾವು.`),
O(`ಕರ್ನಾಟಕದ ವೃಕ್ಷ ಯಾವುದು?`,`ಶ್ರೀಗಂಧದ ಮರ.`),
O(`ಭಾರತದ ರಾಷ್ಟ್ರೀಯ ಪಕ್ಷಿ ಯಾವುದು?`,`ನವಿಲು.`),
O(`ಕರ್ನಾಟಕದ ಪ್ರಾಣಿ ಯಾವುದು?`,`ಆನೆ.`),
G(`ಖಾಲಿ ಬಿಟ್ಟ ಸ್ಥಳ ತುಂಬಿ: ಭಾರತ ದೇಶವು ಗಣರಾಜ್ಯವಾದ ನೆನಪಿಗಾಗಿ ______ ರಂದು ಗಣರಾಜ್ಯೋತ್ಸವ ಆಚರಿಸುತ್ತಾರೆ.`,`ಜನವರಿ 26`),
G(`ಖಾಲಿ ಬಿಟ್ಟ ಸ್ಥಳ ತುಂಬಿ: ಗಾಂಧೀಜಿ ಹುಟ್ಟಿದ ದಿನವಾದ ______ ರಂದು ಗಾಂಧೀ ಜಯಂತಿ ಆಚರಿಸುತ್ತಾರೆ.`,`ಅಕ್ಟೋಬರ್ 2`),
G(`ಖಾಲಿ ಬಿಟ್ಟ ಸ್ಥಳ ತುಂಬಿ: ರಾಷ್ಟ್ರಮುದ್ರೆಯ ಕೆಳಗೆ ______ ಎಂಬ ನುಡಿ ಇದೆ.`,`ಸತ್ಯಮೇವ ಜಯತೇ`),
G(`ಸರಿ/ತಪ್ಪು ಬರೆ: ಸ್ವಾತಂತ್ರ್ಯ ದಿನಾಚರಣೆ ಮಾತ್ರ ರಾಷ್ಟ್ರೀಯ ಹಬ್ಬ.`,`ತಪ್ಪು. ಗಣರಾಜ್ಯೋತ್ಸವ ಮತ್ತು ಗಾಂಧಿ ಜಯಂತಿಯೂ ರಾಷ್ಟ್ರೀಯ ಹಬ್ಬಗಳು.`),
G(`ಸರಿ/ತಪ್ಪು ಬರೆ: ರಾಷ್ಟ್ರಗೀತೆ ಹಾಡುವಾಗ ನಿಂತು ಗೌರವ ತೋರಿಸಬೇಕು.`,`ಸರಿ`),
G(`ಹೊಂದಿಸಿ ಬರೆ: ಕರ್ನಾಟಕದ ಹೂ, ಭಾರತದ ಪಕ್ಷಿ, ಭಾರತದ ಮರ – (ಕಮಲ, ನವಿಲು, ಆಲದ ಮರ).`,`ಕರ್ನಾಟಕದ ಹೂ – ಕಮಲ; ಭಾರತದ ಪಕ್ಷಿ – ನವಿಲು; ಭಾರತದ ಮರ – ಆಲದ ಮರ`,'m'),
S(`ರಾಷ್ಟ್ರೀಯ ಹಬ್ಬ ಎಂದರೇನು? ಉದಾಹರಣೆ ಕೊಡು.`,`ದೇಶದ ಜನರೆಲ್ಲ ಎಲ್ಲಾ ಕಡೆಯಲ್ಲೂ ಹಬ್ಬದಂತೆ ಆಚರಿಸುವ ಐತಿಹಾಸಿಕ ಮಹತ್ವದ ದಿನ. ಉದಾ: ಸ್ವಾತಂತ್ರ್ಯ ದಿನಾಚರಣೆ, ಗಣರಾಜ್ಯೋತ್ಸವ, ಗಾಂಧಿ ಜಯಂತಿ.`),
S(`ಸಿಂಹ ಬೋದಿಗೆ ಎಂದರೇನು?`,`ರಾಷ್ಟ್ರಮುದ್ರೆಗೆ ಇರುವ ಹೆಸರು. ಕಂಬದ ಮೇಲೆ ನಾಲ್ಕು ಸಿಂಹಗಳು ಬೆನ್ನು ಹಾಕಿ ನಿಂತಿದ್ದು, ಕೆಳಗೆ ಕುದುರೆ, ಚಕ್ರ ಮತ್ತು ಬಸವ ಇವೆ.`),
S(`ನಾಡಹಬ್ಬ ಎಂದರೇನು? ಕರ್ನಾಟಕದಲ್ಲಿ ಯಾವ ಹಬ್ಬವನ್ನು ನಾಡಹಬ್ಬವಾಗಿ ಆಚರಿಸುತ್ತಾರೆ?`,`ಪರಂಪರೆಯಿಂದ ಬಂದ ಸಾಂಸ್ಕೃತಿಕ ಐಕ್ಯತೆಯನ್ನುಂಟು ಮಾಡುವ ಹಬ್ಬ. ದಸರಾ.`),
L(`ರಾಷ್ಟ್ರಧ್ವಜ ಮತ್ತು ರಾಷ್ಟ್ರಮುದ್ರೆಯ ಬಗ್ಗೆ ಬರೆ.`,`ರಾಷ್ಟ್ರಧ್ವಜದಲ್ಲಿ ಕೇಸರಿ, ಬಿಳಿ ಮತ್ತು ಹಸಿರು ಎಂಬ ಮೂರು ಬಣ್ಣಗಳಿವೆ; ಮಧ್ಯದಲ್ಲಿ ಅಶೋಕ ಚಕ್ರವಿದೆ. ರಾಷ್ಟ್ರಮುದ್ರೆಗೆ ಸಿಂಹ ಬೋದಿಗೆ ಎಂದು ಹೆಸರು. ಇಲ್ಲಿ ನಾಲ್ಕು ಸಿಂಹಗಳು ಒಂದಕ್ಕೊಂದು ಬೆನ್ನು ಹಾಕಿ ನಿಂತಿವೆ; ಮೂರು ಮಾತ್ರ ಕಾಣುತ್ತವೆ. ಸಿಂಹದ ಕೆಳಗೆ ಓಡುತ್ತಿರುವ ಕುದುರೆ, ಚಕ್ರ ಮತ್ತು ಬಸವ ಇವೆ ಹಾಗೂ 'ಸತ್ಯಮೇವ ಜಯತೇ' ಎಂಬ ನುಡಿ ಇದೆ. ಇವು ದೇಶಾಭಿಮಾನ, ಭಾವೈಕ್ಯತೆ ಮತ್ತು ಒಗ್ಗಟ್ಟಿನ ಗುಣಗಳನ್ನು ಬೆಳೆಸಲು ಸಹಕಾರಿ.`),
L(`ನಿನ್ನ ಶಾಲೆಯಲ್ಲಿ ಸ್ವಾತಂತ್ರ್ಯ ದಿನಾಚರಣೆಯನ್ನು ಹೇಗೆ ಆಚರಿಸುತ್ತಾರೆ ಎಂದು ಬರೆ.`,`ಮಾದರಿ ಉತ್ತರ: ಆಗಸ್ಟ್ 15ರಂದು ಶಾಲೆಯಲ್ಲಿ ಧ್ವಜಾರೋಹಣ ಮಾಡುತ್ತಾರೆ. ಮಕ್ಕಳೆಲ್ಲ ನೇರವಾಗಿ ನಿಂತು ರಾಷ್ಟ್ರಗೀತೆ ಹಾಡಿ ಗೌರವ ಸಲ್ಲಿಸುತ್ತಾರೆ. ಭಾಷಣ, ನೃತ್ಯ, ಹಾಡುಗಳ ಕಾರ್ಯಕ್ರಮ ನಡೆಯುತ್ತದೆ. ಮಕ್ಕಳಿಗೆ ಸಿಹಿ ಹಂಚುತ್ತಾರೆ. ಅಂದು ನಾನು ಭಾಷಣ ಮಾಡುತ್ತೇನೆ ಮತ್ತು ಕಾರ್ಯಕ್ರಮದಲ್ಲಿ ಭಾಗವಹಿಸುತ್ತೇನೆ.`)
]});

LSV.push({n:21,t:`ಖೋ . . . . .`,au:`ಸಮಿತಿ ರಚನೆ`,pg:68,
words:`ಹೊರಾಂಗಣ ಆಟ – ಬಯಲಿನಲ್ಲಿ ಆಡುವ ಆಟ; ಒಳಾಂಗಣ ಆಟ – ಕೋಣೆಯೊಳಗೆ ಆಡುವ ಆಟ; ಇನ್ನಿಂಗ್ಸ್ – ಆಟದ ಒಂದು ಸರದಿ; ಫೌಲ್ – ನಿಯಮ ಉಲ್ಲಂಘನೆ; ಔಟ್ – ಆಟದಿಂದ ಹೊರಗೆ; ಸರ್ಕಸ್ – ಪ್ರಾಣಿ, ಕಲಾವಿದರ ಪ್ರದರ್ಶನ; ಜಾತ್ರೆ – ಉತ್ಸವ; ಪ್ರದರ್ಶನ – ತೋರಿಸುವುದು; ಕ್ರೀಡೆ – ಆಟ; ಕಂಬ – ಆಟದ ಮೈದಾನದ ಕಂಬಗಳು`,
notes:`ಖೋ ಖೋ ಆಟ: ಒಂದು ತಂಡದಲ್ಲಿ ಒಟ್ಟು 12 ಆಟಗಾರರು; ಆಡುವವರು 9, ಬದಲಿ ಆಟಗಾರರು 3. ಒಂದು ತಂಡ ಓಡುವ ತಂಡ, ಇನ್ನೊಂದು ಮುಟ್ಟುವ ತಂಡ. ಆಟದಲ್ಲಿ ಎರಡು ಸರದಿ (ಇನ್ನಿಂಗ್ಸ್); ಪ್ರತಿ ಇನ್ನಿಂಗ್ಸ್‌ನಲ್ಲಿ ಓಡುವ ಮತ್ತು ಮುಟ್ಟುವ ಸುತ್ತುಗಳು; ಒಂದು ಸುತ್ತಿನ ಕಾಲಾವಧಿ 7 ನಿಮಿಷಗಳು. ನಿಯಮ ಮೀರಿದರೆ ಫೌಲ್. ಓಟಗಾರರು ಮುಟ್ಟಿಸಿಕೊಂಡರೆ ಔಟ್. ಗುಂಪು ಆಟಗಳಿಂದ ಸಹಕಾರ, ಹೊಂದಾಣಿಕೆ, ತಂಡದ ಸ್ಫೂರ್ತಿ, ನಿಯಮ ಪಾಲನೆ, ಗೆಳೆತನ ಬೆಳೆಯುತ್ತವೆ. ಜಾತ್ರೆ, ಸರ್ಕಸ್‌ಗಳಿಂದ ಮನರಂಜನೆ ದೊರೆಯುತ್ತದೆ. ಸರ್ಕಸ್ ಕಡಿಮೆಯಾಗಲು ಕಾರಣ: ಪ್ರಾಣಿ ಹಿಂಸೆ ವಿರೋಧ, ಟಿ.ವಿ./ಮೊಬೈಲ್ ಮನರಂಜನೆ, ಕಲಾವಿದರಿಗೆ ಪ್ರೋತ್ಸಾಹದ ಕೊರತೆ, ನಿರ್ವಹಣೆಯ ದುಬಾರಿ ವೆಚ್ಚ. ನಿನಗಿದು ಗೊತ್ತೆ?: ಪ್ರಕಾಶ್ ಪಡುಕೋಣೆ ರಾಷ್ಟ್ರೀಯ ಚಾಂಪಿಯನ್‌ಶಿಪ್ ಗೆದ್ದ ಅತ್ಯಂತ ಕಿರಿಯ ಬ್ಯಾಡ್ಮಿಂಟನ್ ಆಟಗಾರರು; ಖೋ ಖೋ ಆಟಕ್ಕೆ ರಾಣಿ ಲಕ್ಷ್ಮೀ ಪ್ರಶಸ್ತಿ ಪಡೆದ ಮೊದಲ ಮಹಿಳೆ ಕರ್ನಾಟಕದ ಉಷಾ ಅನಂತರಾಮನ್; 1981ರಲ್ಲಿ ಬೆಂಗಳೂರಿನ ವೀನಸ್ ಸರ್ಕಸ್‌ಗೆ ಬೆಂಕಿ ಬಿದ್ದು 92 ಜನ ಮೃತರಾದರು.`,
ab:[
[`ಆಟಗಳ ಪರಿಚಯ`,[
[`ಹಾಕಿ ಆಟಕ್ಕೆ ಬೇಕಾದ ಸಾಮಗ್ರಿ`,`ಹಾಕಿ ಸ್ಟಿಕ್ ಮತ್ತು ಚೆಂಡು.`],
[`ಕ್ರಿಕೆಟ್ ಆಟಕ್ಕೆ ಬೇಕಾದ ಸಾಮಗ್ರಿ`,`ಬ್ಯಾಟ್, ಬಾಲ್ ಮತ್ತು ವಿಕೆಟ್.`],
[`ಬ್ಯಾಡ್ಮಿಂಟನ್ ಆಟಕ್ಕೆ ಬೇಕಾದ ಸಾಮಗ್ರಿ`,`ರಾಕೆಟ್ ಮತ್ತು ಶಟಲ್ ಕಾಕ್.`],
[`ಬಿಲ್ಲುಗಾರಿಕೆಗೆ ಬೇಕಾದ ಸಾಮಗ್ರಿ`,`ಬಿಲ್ಲು ಮತ್ತು ಬಾಣ.`],
[`ಕೇರಂ ಆಟಕ್ಕೆ ಬೇಕಾದ ಸಾಮಗ್ರಿ`,`ಕೇರಂ ಬೋರ್ಡ್ ಮತ್ತು ಕಾಯಿನ್‌ಗಳು.`],
[`ಚೆಸ್ ಆಟಕ್ಕೆ ಬೇಕಾದ ಸಾಮಗ್ರಿ`,`ಚೆಸ್ ಬೋರ್ಡ್ ಮತ್ತು ಕಾಯಿಗಳು.`]]],
[`ಆಟದಲ್ಲಿ ನಿಪುಣರು`,[
[`ರಾಹುಲ್ ದ್ರಾವಿಡ್ ಮತ್ತು ಸಚಿನ್ ತೆಂಡೂಲ್ಕರ್`,`ಕ್ರಿಕೆಟ್.`],
[`ಪ್ರಕಾಶ್ ಪಡುಕೋಣೆ ಮತ್ತು ಸೈನಾ ನೆಹ್ವಾಲ್`,`ಬ್ಯಾಡ್ಮಿಂಟನ್.`],
[`ಪಿ. ಟಿ. ಉಷಾ ಮತ್ತು ಮಾಲತಿ ಹೊಳ್ಳ`,`ಅಥ್ಲೆಟಿಕ್ಸ್ (ಓಟ).`],
[`ಅಭಿನವ್ ಬಿಂದ್ರಾ`,`ಶೂಟಿಂಗ್.`],
[`ಧನರಾಜ್ ಪಿಳ್ಳೆ`,`ಹಾಕಿ.`],
[`ವಿಶ್ವನಾಥನ್ ಆನಂದ್`,`ಚೆಸ್.`],
[`ಸಾನಿಯಾ ಮಿರ್ಜಾ`,`ಟೆನಿಸ್.`],
[`ಮಮತಾ ಪೂಜಾರಿ`,`ಕಬಡ್ಡಿ.`]]],
[`ಖೋ ಖೋ ಆಟ`,[
[`ಖೋ ಖೋ ತಂಡದಲ್ಲಿ ಒಟ್ಟು ಎಷ್ಟು ಆಟಗಾರರು? ಎಷ್ಟು ಜನ ಆಡುತ್ತಾರೆ?`,`ಒಟ್ಟು 12 ಆಟಗಾರರು; ಆಡುವವರು 9 ಮತ್ತು ಬದಲಿ ಆಟಗಾರರು 3.`],
[`ಒಂದು ಸುತ್ತಿನ ಕಾಲಾವಧಿ ಎಷ್ಟು?`,`7 ನಿಮಿಷಗಳು.`],
[`ಆಟದಲ್ಲಿ ಎಷ್ಟು ಸರದಿ (ಇನ್ನಿಂಗ್ಸ್) ಇರುತ್ತವೆ?`,`ಎರಡು.`],
[`ಎರಡು ತಂಡಗಳ ಹೆಸರೇನು?`,`ಓಡುವ ತಂಡ ಮತ್ತು ಮುಟ್ಟುವ ತಂಡ.`],
[`ಶಿಕ್ಷಕಿ 'ಔಟ್' ಎಂದು ಏಕೆ ಹೇಳಿದರು?`,`ಓಡುತ್ತಿದ್ದ ಆಟಗಾರನನ್ನು ಮುಟ್ಟುವ ತಂಡದ ಆಟಗಾರ ಮುಟ್ಟಿದ್ದರಿಂದ. (ಮಾದರಿ ಉತ್ತರ)`],
[`ನಿಯಮ ಮೀರಿದರೆ ಏನೆನ್ನುವರು?`,`ಫೌಲ್ (ತಪ್ಪು).`],
[`ಖೋ ಖೋ ಮೈದಾನದ ಚಿತ್ರದಲ್ಲಿ ಕಂಬಗಳು ಮತ್ತು ಸಾಲುಗಳ ಸಂಖ್ಯೆ`,`⚠ ಪಠ್ಯಪುಸ್ತಕದ ಚಿತ್ರ ನೋಡಿ ಎಣಿಸಿ ಬರೆಯಬೇಕು (ಮಾದರಿ ಉತ್ತರ ನೀಡಿಲ್ಲ).`]]],
[`ಜಾತ್ರೆ ಮತ್ತು ಸರ್ಕಸ್`,[
[`ಸರ್ಕಸ್‌ನ ಸಂಖ್ಯೆ ಕಡಿಮೆಯಾಗಲು ಎರಡು ಕಾರಣ ಬರೆ.`,`ಸರ್ಕಸ್‌ನಲ್ಲಿ ಪ್ರಾಣಿಗಳಿಗೆ ಹಿಂಸೆ ನೀಡಿ ತರಬೇತು ಮಾಡುವುದಕ್ಕೆ ವಿರೋಧ; ಟಿ.ವಿ., ಕಂಪ್ಯೂಟರ್, ಮೊಬೈಲ್‌ಗಳಲ್ಲಿ ಸುಲಭವಾಗಿ ಮನರಂಜನೆ ಸಿಗುವುದು.`],
[`ನಿನ್ನ ಜಿಲ್ಲೆಯ ಪ್ರಸಿದ್ಧ ಜಾತ್ರೆ`,`ಮಾದರಿ ಉತ್ತರ: ಮಕ್ಕಳು ತಮ್ಮ ಜಿಲ್ಲೆಯ ಜಾತ್ರೆಯ ಬಗ್ಗೆ ಹಿರಿಯರಿಂದ ತಿಳಿದು ಬರೆಯಬೇಕು.`]]]
],
qb:[
M(`ಖೋ ಖೋ ತಂಡದಲ್ಲಿರುವ ಒಟ್ಟು ಆಟಗಾರರು:`,[`9`,`11`,`12`,`15`],2),
M(`ಖೋ ಖೋ ತಂಡದಲ್ಲಿ ಆಟ ಆಡುವ ಆಟಗಾರರ ಸಂಖ್ಯೆ:`,[`7`,`9`,`11`,`12`],1),
M(`ಖೋ ಖೋ ತಂಡದಲ್ಲಿ ಬದಲಿ ಆಟಗಾರರು:`,[`1`,`2`,`3`,`4`],2),
M(`ಒಂದು ಸುತ್ತಿನ ಕಾಲಾವಧಿ:`,[`5 ನಿಮಿಷ`,`7 ನಿಮಿಷ`,`10 ನಿಮಿಷ`,`15 ನಿಮಿಷ`],1),
M(`ಹಾಕಿ ಆಡಲು ಬೇಕಾದದ್ದು:`,[`ರಾಕೆಟ್`,`ಹಾಕಿ ಸ್ಟಿಕ್`,`ಬಿಲ್ಲು`,`ಬೋರ್ಡ್`],1),
M(`ರಾಹುಲ್ ದ್ರಾವಿಡ್ ನಿಪುಣರಾದ ಆಟ:`,[`ಹಾಕಿ`,`ಚೆಸ್`,`ಕ್ರಿಕೆಟ್`,`ಟೆನಿಸ್`],2),
M(`ವಿಶ್ವನಾಥನ್ ಆನಂದ್ ನಿಪುಣರಾದ ಆಟ:`,[`ಚೆಸ್`,`ಕ್ರಿಕೆಟ್`,`ಹಾಕಿ`,`ಕಬಡ್ಡಿ`],0),
M(`ಖೋ ಖೋ ಆಟಕ್ಕೆ ರಾಣಿ ಲಕ್ಷ್ಮೀ ಪ್ರಶಸ್ತಿ ಪಡೆದ ಮೊದಲ ಮಹಿಳೆ:`,[`ಉಷಾ ಅನಂತರಾಮನ್`,`ಪಿ.ಟಿ. ಉಷಾ`,`ಮಮತಾ ಪೂಜಾರಿ`,`ಸಾನಿಯಾ ಮಿರ್ಜಾ`],0,'m'),
O(`ಪ್ರಕಾಶ್ ಪಡುಕೋಣೆ ಯಾವ ಆಟದ ಆಟಗಾರರು?`,`ಬ್ಯಾಡ್ಮಿಂಟನ್.`),
O(`ಆಟದಲ್ಲಿ ನಿಯಮ ಮೀರಿದರೆ ಏನೆನ್ನುವರು?`,`ಫೌಲ್.`),
O(`ಧನರಾಜ್ ಪಿಳ್ಳೆ ಯಾವ ಆಟದ ಆಟಗಾರ?`,`ಹಾಕಿ.`),
O(`ಬೆಂಗಳೂರಿನ ಯಾವ ಸರ್ಕಸ್‌ಗೆ 1981ರಲ್ಲಿ ಬೆಂಕಿ ಬಿದ್ದಿತು?`,`ವೀನಸ್ ಸರ್ಕಸ್.`),
O(`ಅಭಿನವ್ ಬಿಂದ್ರಾ ಯಾವ ಆಟದ ನಿಪುಣರು?`,`ಶೂಟಿಂಗ್.`),
O(`ಸೈನಾ ನೆಹ್ವಾಲ್ ಯಾವ ಆಟದಲ್ಲಿ ಪದಕ ಗೆದ್ದರು?`,`ಬ್ಯಾಡ್ಮಿಂಟನ್.`),
G(`ಖಾಲಿ ಬಿಟ್ಟ ಸ್ಥಳ ತುಂಬಿ: ಖೋ ಖೋ ತಂಡದಲ್ಲಿ ಒಟ್ಟು ______ ಆಟಗಾರರಿರುತ್ತಾರೆ.`,`12`),
G(`ಖಾಲಿ ಬಿಟ್ಟ ಸ್ಥಳ ತುಂಬಿ: ಗುಂಪು ಆಟಗಳಿಂದ ______ ಬೆಳೆಯುತ್ತದೆ.`,`ಸಹಕಾರ / ಗೆಳೆತನ`),
G(`ಸರಿ/ತಪ್ಪು ಬರೆ: ಖೋ ಖೋ ಆಟದಲ್ಲಿ 9 ಆಟಗಾರರು ಆಡುತ್ತಾರೆ.`,`ಸರಿ`),
G(`ಸರಿ/ತಪ್ಪು ಬರೆ: ಚೆಸ್ ಒಂದು ಹೊರಾಂಗಣ ಆಟ.`,`ತಪ್ಪು. ಚೆಸ್ ಒಳಾಂಗಣ ಆಟ.`),
G(`ಹೊಂದಿಸಿ ಬರೆ: ಹಾಕಿ, ಬಿಲ್ಲುಗಾರಿಕೆ, ಕೇರಂ – (ಬಿಲ್ಲು–ಬಾಣ, ಹಾಕಿ ಸ್ಟಿಕ್, ಕೇರಂ ಬೋರ್ಡ್).`,`ಹಾಕಿ – ಹಾಕಿ ಸ್ಟಿಕ್; ಬಿಲ್ಲುಗಾರಿಕೆ – ಬಿಲ್ಲು–ಬಾಣ; ಕೇರಂ – ಕೇರಂ ಬೋರ್ಡ್`,'m'),
G(`ಹೊಂದಿಸಿ ಬರೆ: ಸಚಿನ್, ಸಾನಿಯಾ, ಆನಂದ್ – (ಟೆನಿಸ್, ಕ್ರಿಕೆಟ್, ಚೆಸ್).`,`ಸಚಿನ್ – ಕ್ರಿಕೆಟ್; ಸಾನಿಯಾ – ಟೆನಿಸ್; ಆನಂದ್ – ಚೆಸ್`,'m'),
S(`ಗುಂಪು ಆಟಗಳಿಂದ ಆಗುವ ಎರಡು ಪ್ರಯೋಜನಗಳನ್ನು ಬರೆ.`,`ಸಹಕಾರ, ಹೊಂದಾಣಿಕೆ, ತಂಡದ ಸ್ಫೂರ್ತಿ, ನಿಯಮ ಪಾಲನೆ, ಗೆಳೆತನ ಬೆಳೆಯುತ್ತವೆ.`),
S(`ಸರ್ಕಸ್‌ಗಳ ಸಂಖ್ಯೆ ಇಂದು ಕಡಿಮೆಯಾಗಲು ಎರಡು ಕಾರಣ ಬರೆ.`,`ಪ್ರಾಣಿ ಹಿಂಸೆಗೆ ವಿರೋಧ; ಟಿ.ವಿ., ಮೊಬೈಲ್ ಮೂಲಕ ಸುಲಭ ಮನರಂಜನೆ; ನಿರ್ವಹಣೆ ದುಬಾರಿ.`),
S(`ಖೋ ಖೋ ಆಟದ ಎರಡು ನಿಯಮಗಳನ್ನು ಬರೆ.`,`ಆಟದಲ್ಲಿ ಎರಡು ಸರದಿ (ಇನ್ನಿಂಗ್ಸ್) ಇರುತ್ತವೆ; ಒಂದು ಸುತ್ತಿಗೆ 7 ನಿಮಿಷ; ಒಂದು ತಂಡದಲ್ಲಿ 12 ಆಟಗಾರರು (9 ಆಡುವವರು, 3 ಬದಲಿ).`),
L(`ಖೋ ಖೋ ಆಟವನ್ನು ಹೇಗೆ ಆಡುತ್ತಾರೆ ಎಂದು ವಿವರಿಸು.`,`ಖೋ ಖೋ ಒಂದು ಹೊರಾಂಗಣ ಗುಂಪು ಆಟ. ಒಂದು ತಂಡದಲ್ಲಿ 12 ಆಟಗಾರರಿದ್ದು 9 ಜನ ಆಡುತ್ತಾರೆ, 3 ಜನ ಬದಲಿ ಆಟಗಾರರು. ಒಂದು ತಂಡ ಓಡುವ ತಂಡ, ಇನ್ನೊಂದು ಮುಟ್ಟುವ ತಂಡ. ಆಟದಲ್ಲಿ ಎರಡು ಸರದಿಗಳಿರುತ್ತವೆ; ಒಂದು ಸುತ್ತಿನ ಕಾಲಾವಧಿ 7 ನಿಮಿಷ. ಮುಟ್ಟುವ ತಂಡದ ಆಟಗಾರರು ಮೈದಾನದ ಸಾಲಿನಲ್ಲಿ ಕುಳಿತಿರುತ್ತಾರೆ; ಓಟಗಾರರನ್ನು ಮುಟ್ಟಿದರೆ ಓಟಗಾರ ಔಟ್. ನಿಯಮ ಮೀರಿದರೆ ಫೌಲ್ ಎನ್ನುವರು. ಹೆಚ್ಚು ಓಟಗಾರರನ್ನು ಔಟ್ ಮಾಡಿದ ತಂಡ ಗೆಲ್ಲುತ್ತದೆ.`),
L(`ಸರ್ಕಸ್‌ಗಳ ಸಂಖ್ಯೆ ಕಡಿಮೆಯಾಗಲು ಕಾರಣಗಳನ್ನು ಬರೆ.`,`ಸರ್ಕಸ್‌ಗಳಲ್ಲಿ ಪ್ರಾಣಿಗಳನ್ನು ಬಳಸಿ ಮನರಂಜನೆ ನೀಡುವುದು ಮತ್ತು ಪ್ರಾಣಿಗಳಿಗೆ ಹಿಂಸೆ ನೀಡಿ ತರಬೇತು ಮಾಡುವುದು ಪ್ರಾಣಿ ದಯಾ ಸಂಘಗಳ ವಿರೋಧಕ್ಕೆ ಕಾರಣವಾಗಿದೆ. ಜನರಿಗೆ ಟಿ.ವಿ., ಕಂಪ್ಯೂಟರ್, ಮೊಬೈಲ್‌ಗಳಿಂದ ಸುಲಭವಾಗಿ ಮನರಂಜನೆ ದೊರೆಯುತ್ತಿದೆ. ನಿಪುಣ ಕಲಾವಿದರ ಕೊರತೆ ಇದೆ ಮತ್ತು ಅವರ ಕಲೆಗೆ ತಕ್ಕ ಪ್ರೋತ್ಸಾಹ ಕಡಿಮೆಯಾಗುತ್ತಿದೆ. ಸರ್ಕಸ್ ಕಲಾವಿದರಿಗೆ ಬೇಕಾದ ಸೌಲಭ್ಯಗಳ ನಿರ್ವಹಣೆ ಹೆಚ್ಚು ದುಬಾರಿಯಾಗಿದೆ.`)
]});

LSV.push({n:22,t:`ಸೌಲಭ್ಯಗಳು – ಸುಧಾರಣೆ`,au:`ಸಮಿತಿ ರಚನೆ`,pg:80,
words:`ಸೌಲಭ್ಯ – ಅನುಕೂಲ; ಸುಧಾರಣೆ – ಉತ್ತಮಗೊಳಿಸುವುದು; ಸ್ವಾಭಾವಿಕ ಸಂಪನ್ಮೂಲ – ಪ್ರಕೃತಿಯಿಂದ ಸಿಗುವ ವಸ್ತುಗಳು; ಸೃಜನಶೀಲತೆ – ಹೊಸದನ್ನು ಸೃಷ್ಟಿಸುವ ಸಾಮರ್ಥ್ಯ; ಮಾದರಿ – ನಮೂನೆ; ಲೋಹ – ಕಬ್ಬಿಣ, ತಾಮ್ರದಂತಹ ವಸ್ತು; ತಂತ್ರಜ್ಞಾನ – ಯಂತ್ರ ಮತ್ತು ವಿಜ್ಞಾನದ ಬಳಕೆ; ಗಣಕ ಪಿತಾಮಹ – ಕಂಪ್ಯೂಟರ್ ಪಿತಾಮಹ; ಮಡಕೆ – ಮಣ್ಣಿನ ಪಾತ್ರೆ`,
notes:`ಮಾನವನು ವಿಜ್ಞಾನ, ತಂತ್ರಜ್ಞಾನಗಳ ನೆರವಿನಿಂದ ಸ್ವಾಭಾವಿಕ ಸಂಪನ್ಮೂಲಗಳನ್ನು ಬಳಸಲು ಕಲಿತಿದ್ದಾನೆ: ಲೋಹಗಳಿಂದ ಯಂತ್ರ, ಪಾತ್ರೆ, ಮನೆಕಟ್ಟಲು; ಪೆಟ್ರೋಲ್, ಡೀಸೆಲ್ – ವಾಹನಗಳಿಗೆ; ಮರದಿಂದ ಕಾಗದ. ಜೊತೆಗೆ ಸೃಜನಶೀಲತೆಯಿಂದ ವಿವಿಧ ಮಾದರಿಯ ಯಂತ್ರ, ಬಟ್ಟೆ, ಪಾತ್ರೆ, ಕಾಗದ ತಯಾರಿಸಲು ಕಲಿತಿದ್ದಾನೆ. ಹಳೆಯ ಮತ್ತು ಹೊಸ ವಸ್ತುಗಳು: ಕಟ್ಟಿಗೆ ಒಲೆ → ಗ್ಯಾಸ್ ಒಲೆ; ಮಣ್ಣಿನ ಮಡಕೆ → ನೀರಿನ ಟ್ಯಾಂಕ್; ಒರಳು ಕಲ್ಲು → ಮಿಕ್ಸಿ; ಕಪಿಲೆ ಬಾವಿ → ಪಂಪ್ ಸೆಟ್; ಬೀಸಣಿಗೆ → ಫ್ಯಾನ್. ನಿನಗಿದು ಗೊತ್ತೆ?: ಚಾರ್ಲ್ಸ್ ಬ್ಯಾಬೇಜ್ 1837ರಲ್ಲಿ ಮೊದಲ ಗಣಕಯಂತ್ರ ತಯಾರಿಸಿದರು – ಗಣಕ ಪಿತಾಮಹ; ಲೋಹಗಳನ್ನು ಆಕಾರ ಕೊಡಬಹುದು, ಸ್ವಚ್ಛಗೊಳಿಸಬಹುದು; ಅಮೆರಿಕಾದ ಆಬರ್ಟಿ ಪ್ರತಿಮೆ ಸುಮಾರು 3,50,000 kg ತಾಮ್ರದಿಂದ ಮಾಡಲಾಗಿದೆ; ಮಣ್ಣಿನ ಮಡಕೆಯಲ್ಲಿ ಅಡುಗೆ ಮಾಡುವ ಅಭ್ಯಾಸ ಕಡಿಮೆ, ಆದರೆ ಹೂದಾನಿ, ಹೂಜಿ ಮುಂತಾದ ಅಲಂಕಾರಿಕ ವಸ್ತುಗಳು ಮನೆಯನ್ನು ಸಿಂಗರಿಸಿವೆ.`,
ab:[
[`ಅಂದು–ಇಂದು ಬಳಸುವ ವಸ್ತುಗಳು`,[
[`ಕಟ್ಟಿಗೆ ಒಲೆಗೆ ಬದಲಾಗಿ ಈಗ ಬಳಸುವ ವಸ್ತು`,`ಗ್ಯಾಸ್ ಒಲೆ.`],
[`ಮಣ್ಣಿನ ಕೊಡ/ಮಡಕೆಗೆ ಬದಲಾಗಿ ನೀರು ಸಂಗ್ರಹಿಸಲು ಈಗ ಬಳಸುವುದು`,`ನೀರಿನ ಟ್ಯಾಂಕ್.`],
[`ರುಬ್ಬುವ ಕಲ್ಲಿಗೆ ಬದಲಾಗಿ ಈಗ ಬಳಸುವುದು`,`ಮಿಕ್ಸಿ (ಗ್ರೈಂಡರ್).`],
[`ಕಪಿಲೆ ಬಾವಿಗೆ ಬದಲಾಗಿ ಈಗ ಬಳಸುವುದು`,`ಮೋಟಾರ್ ಪಂಪ್.`],
[`ಬೀಸಣಿಗೆಗೆ ಬದಲಾಗಿ ಈಗ ಬಳಸುವುದು`,`ಸೀಲಿಂಗ್ ಫ್ಯಾನ್.`],
[`ಮೇಲೆ ಕೊಟ್ಟಿರುವ ಬದಲಾವಣೆಗೆ ಏನು ಕಾರಣ?`,`ವಿಜ್ಞಾನ ಮತ್ತು ತಂತ್ರಜ್ಞಾನದ ಬೆಳವಣಿಗೆ ಹಾಗೂ ಮಾನವನ ಸೃಜನಶೀಲತೆ.`]]],
[`ಗೆರೆ ಎಳೆದು ಹೊಂದಿಸು (ಮಾದರಿ)`,[
[`ಎತ್ತಿನ ಬಂಡಿ`,`ಲಾರಿ/ಟ್ರಕ್ ⚠ ಪಠ್ಯಪುಸ್ತಕದ ಚಿತ್ರಗಳೊಂದಿಗೆ ಪರಿಶೀಲಿಸಿ.`],
[`ನೇಗಿಲು ಹೂಡಿದ ಎತ್ತುಗಳು`,`ಟ್ರ್ಯಾಕ್ಟರ್.`],
[`ಅಂಚೆ ಕಾರ್ಡ್`,`ಕಂಪ್ಯೂಟರ್ (ಇ–ಮೇಲ್).`],
[`ಮರಳು ಗಡಿಯಾರ`,`ಗೋಡೆ/ಕೈ ಗಡಿಯಾರ.`],
[`ಹುಲ್ಲಿನ ಗುಡಿಸಲು`,`ಕಾಂಕ್ರೀಟ್ ಕಟ್ಟಡ.`],
[`ಕೈ ಮಗ್ಗ`,`ಬಟ್ಟೆ ಗಿರಣಿ (ಯಂತ್ರ).`]]],
[`ಮಣ್ಣಿನ ಮಾದರಿ`,[
[`ಮಣ್ಣಿನಿಂದ ನಾವು ಯಾವ ಯಾವ ಮಾದರಿಗಳನ್ನು ತಯಾರಿಸಬಹುದು?`,`ಬದನೆ, ಬಟ್ಟಲು, ಮಾವಿನ ಹಣ್ಣು, ದಾಳಿಂಬೆ, ಬಾಳೆಹಣ್ಣು, ಚಿಟ್ಟೆ, ಹಾವು, ಹೂ, ಹೂದಾನಿ ಮುಂತಾದವು.`],
[`ಮಡಕೆಗಳನ್ನು ಯಾವ ಕೆಲಸಗಳಿಗೆ ಬಳಸಬಹುದು?`,`ನೀರು ಸಂಗ್ರಹಿಸಲು, ಅಡುಗೆ ಮಾಡಲು, ಅಲಂಕಾರಕ್ಕೆ (ಹೂದಾನಿ).`]]]
],
qb:[
M(`ಗಣಕ ಪಿತಾಮಹ ಎಂದು ಕರೆಯುವವರು:`,[`ಚಾರ್ಲ್ಸ್ ಬ್ಯಾಬೇಜ್`,`ಮಾರ್ಕೋನಿ`,`ಗ್ರಹಾಂ ಬೆಲ್`,`ಎಡಿಸನ್`],0),
M(`ಚಾರ್ಲ್ಸ್ ಬ್ಯಾಬೇಜ್ ಮೊದಲ ಗಣಕಯಂತ್ರ ತಯಾರಿಸಿದ ವರ್ಷ:`,[`1737`,`1837`,`1937`,`1953`],1),
M(`ಅಮೆರಿಕಾದ ಆಬರ್ಟಿ ಪ್ರತಿಮೆ ಯಾವ ಲೋಹದಿಂದ ಮಾಡಲಾಗಿದೆ?`,[`ಕಬ್ಬಿಣ`,`ತಾಮ್ರ`,`ಬೆಳ್ಳಿ`,`ಚಿನ್ನ`],1),
M(`ಒಲೆಗೆ ಬದಲಾಗಿ ಈಗ ಬಳಸುವುದು:`,[`ಗ್ಯಾಸ್ ಒಲೆ`,`ಮಿಕ್ಸಿ`,`ಫ್ಯಾನ್`,`ಟ್ಯಾಂಕ್`],0),
M(`ಬೀಸಣಿಗೆಗೆ ಬದಲಾಗಿ ಈಗ ಬಳಸುವುದು:`,[`ಮಿಕ್ಸಿ`,`ಫ್ಯಾನ್`,`ಪಂಪ್`,`ಟ್ರ್ಯಾಕ್ಟರ್`],1),
M(`ವಾಹನಗಳಿಗೆ ಬಳಸುವ ಇಂಧನ:`,[`ಪೆಟ್ರೋಲ್`,`ನೀರು`,`ಮಣ್ಣು`,`ಕಾಗದ`],0),
M(`ಕಾಗದ ತಯಾರಿಕೆಗೆ ಬಳಸುವ ಸ್ವಾಭಾವಿಕ ಸಂಪನ್ಮೂಲ:`,[`ಮರ`,`ಕಬ್ಬಿಣ`,`ಪೆಟ್ರೋಲ್`,`ನೀರು`],0),
M(`ಮಣ್ಣಿನ ಮಡಕೆಯಿಂದ ಈಗ ಹೆಚ್ಚಾಗಿ ತಯಾರಾಗುವ ವಸ್ತುಗಳು:`,[`ಅಡುಗೆ ಪಾತ್ರೆ`,`ಅಲಂಕಾರಿಕ ವಸ್ತುಗಳು`,`ಯಂತ್ರಗಳು`,`ಬಟ್ಟೆ`],1,'m'),
O(`ಲೋಹಗಳ ಮೂರು ಉಪಯೋಗ ತಿಳಿಸು.`,`ಯಂತ್ರಗಳು, ಪಾತ್ರೆಗಳು, ಮನೆ ಕಟ್ಟಲು.`),
O(`ಸೃಜನಶೀಲತೆ ಎಂದರೇನು?`,`ಹೊಸ ವಸ್ತುಗಳನ್ನು ಸೃಷ್ಟಿಸುವ ಸಾಮರ್ಥ್ಯ.`),
O(`ರುಬ್ಬುವ ಕಲ್ಲಿಗೆ ಬದಲಾಗಿ ಬಂದ ಯಂತ್ರ ಯಾವುದು?`,`ಮಿಕ್ಸಿ.`),
O(`ನೀರೆತ್ತುವ ಪಂಪ್‌ಗೆ ಬದಲಾಗಿ ಹಿಂದೆ ಬಳಸುತ್ತಿದ್ದ ಸಾಧನ ಯಾವುದು?`,`ಕಪಿಲೆ (ಏತ).`),
O(`ಕಂಪ್ಯೂಟರ್ ಕಂಡುಹಿಡಿದವರನ್ನು ಏನೆಂದು ಕರೆಯುತ್ತಾರೆ?`,`ಗಣಕ ಪಿತಾಮಹ.`),
O(`ಲೋಹಗಳನ್ನು ಏನು ಮಾಡಬಹುದು?`,`ಆಕಾರ ಕೊಡಬಹುದು, ಚೆನ್ನಾಗಿ ಸ್ವಚ್ಛಗೊಳಿಸಬಹುದು.`),
G(`ಖಾಲಿ ಬಿಟ್ಟ ಸ್ಥಳ ತುಂಬಿ: ಮಾನವನು ಸ್ವಾಭಾವಿಕ ಸಂಪನ್ಮೂಲಗಳು ಮತ್ತು ______ ಯಿಂದ ತನ್ನ ಬದುಕನ್ನು ಅನುಕೂಲಕರವಾಗಿ ಬದಲಾಯಿಸಿಕೊಂಡಿದ್ದಾನೆ.`,`ಸೃಜನಶೀಲತೆ`),
G(`ಖಾಲಿ ಬಿಟ್ಟ ಸ್ಥಳ ತುಂಬಿ: ಕಟ್ಟಿಗೆ ಒಲೆಗೆ ಬದಲಾಗಿ ಈಗ ______ ಒಲೆ ಬಳಸುತ್ತಾರೆ.`,`ಗ್ಯಾಸ್`),
G(`ಸರಿ/ತಪ್ಪು ಬರೆ: ಹಳೆಯ ವಸ್ತುಗಳಿಂದ ಹೊಸ ವಸ್ತುಗಳು ಬರಲು ಮಾನವನ ಸೃಜನಶೀಲತೆ ಕಾರಣ.`,`ಸರಿ`),
G(`ಸರಿ/ತಪ್ಪು ಬರೆ: ಲೋಹಗಳ ಉಪಯೋಗವಿಲ್ಲದ ಕೆಲಸವೇ ಇಲ್ಲ.`,`ಸರಿ`),
G(`ಹೊಂದಿಸಿ ಬರೆ: ಒರಳು ಕಲ್ಲು, ಬೀಸಣಿಗೆ, ಕಪಿಲೆ – (ಫ್ಯಾನ್, ಮಿಕ್ಸಿ, ಪಂಪ್).`,`ಒರಳು ಕಲ್ಲು – ಮಿಕ್ಸಿ; ಬೀಸಣಿಗೆ – ಫ್ಯಾನ್; ಕಪಿಲೆ – ಪಂಪ್`,'m'),
G(`ಹೊಂದಿಸಿ ಬರೆ: ಪೆಟ್ರೋಲ್, ಲೋಹ, ಮರ – (ವಾಹನ, ಪಾತ್ರೆ, ಕಾಗದ).`,`ಪೆಟ್ರೋಲ್ – ವಾಹನ; ಲೋಹ – ಪಾತ್ರೆ; ಮರ – ಕಾಗದ`,'m'),
S(`ಹಳೆಯ ಮತ್ತು ಹೊಸ ವಸ್ತುಗಳ ಎರಡು ಜೋಡಿ ಬರೆ.`,`ಕಟ್ಟಿಗೆ ಒಲೆ – ಗ್ಯಾಸ್ ಒಲೆ; ಬೀಸಣಿಗೆ – ಫ್ಯಾನ್.`),
S(`ಮಾನವನು ಸ್ವಾಭಾವಿಕ ಸಂಪನ್ಮೂಲಗಳನ್ನು ಹೇಗೆ ಬಳಸುತ್ತಿದ್ದಾನೆ?`,`ಲೋಹಗಳಿಂದ ಯಂತ್ರ, ಪಾತ್ರೆ ಮಾಡುತ್ತಾನೆ; ಪೆಟ್ರೋಲ್, ಡೀಸೆಲ್ ವಾಹನಗಳಿಗೆ ಬಳಸುತ್ತಾನೆ; ಮರದಿಂದ ಕಾಗದ ತಯಾರಿಸುತ್ತಾನೆ.`),
S(`ಚಾರ್ಲ್ಸ್ ಬ್ಯಾಬೇಜ್ ಬಗ್ಗೆ ಎರಡು ಸಾಲು ಬರೆ.`,`ಬ್ರಿಟಿಷ್ ಗಣಿತ ವಿಜ್ಞಾನಿ; 1837ರಲ್ಲಿ ಮೊದಲ ಗಣಕಯಂತ್ರ ತಯಾರಿಸಿದರು; ಗಣಕ ಪಿತಾಮಹ ಎಂದು ಪ್ರಸಿದ್ಧರು.`),
L(`ಹಿಂದಿನ ಮತ್ತು ಈಗಿನ ಜನರು ಬಳಸುವ ವಸ್ತುಗಳಲ್ಲಿರುವ ವ್ಯತ್ಯಾಸವನ್ನು ಉದಾಹರಣೆಗಳೊಂದಿಗೆ ವಿವರಿಸು.`,`ಹಿಂದೆ ಜನರು ಕಟ್ಟಿಗೆ ಒಲೆ, ಮಣ್ಣಿನ ಕೊಡ, ರುಬ್ಬುವ ಕಲ್ಲು, ಕಪಿಲೆ ಬಾವಿ ಮತ್ತು ಬೀಸಣಿಗೆಗಳನ್ನು ಬಳಸುತ್ತಿದ್ದರು. ಈಗ ಗ್ಯಾಸ್ ಒಲೆ, ನೀರಿನ ಟ್ಯಾಂಕ್, ಮಿಕ್ಸಿ, ಮೋಟಾರ್ ಪಂಪ್ ಮತ್ತು ಫ್ಯಾನ್ ಬಳಸುತ್ತಾರೆ. ವಿಜ್ಞಾನ, ತಂತ್ರಜ್ಞಾನ ಮತ್ತು ಮಾನವನ ಸೃಜನಶೀಲತೆಯಿಂದ ಕೆಲಸಗಳು ಸುಲಭ ಮತ್ತು ವೇಗವಾಗಿವೆ.`),
L(`ಮಣ್ಣಿನ ಮಡಕೆ ತಯಾರಿಕೆಯಲ್ಲಿ ಸೃಜನಶೀಲತೆ ಹೇಗೆ ತೋರಿಸಲಾಗಿದೆ?`,`ಮಣ್ಣಿನ ಮಡಕೆಗಳಲ್ಲಿ ಅಡುಗೆ ಮಾಡುವ ಅಭ್ಯಾಸ ಕಡಿಮೆಯಾಗಿದೆ. ಆದರೆ ಮಡಕೆ ತಯಾರಿಕೆಯಲ್ಲಿನ ಸೃಜನಶೀಲತೆಯಿಂದ ಹೂದಾನಿಗಳು, ಹೂಜಿಗಳು ಮುಂತಾದ ಅಲಂಕಾರಿಕ ವಸ್ತುಗಳು ಮನೆಯನ್ನು ಸಿಂಗರಿಸಿವೆ. ಇವುಗಳನ್ನು ತಯಾರಿಸುವ ವಿಧಾನಗಳಲ್ಲೂ ಸುಧಾರಣೆಗಳಾಗಿವೆ.`)
]});

LSV.push({n:23,t:`ಉಡುಪು – ವಿನ್ಯಾಸ`,au:`ಸಮಿತಿ ರಚನೆ`,pg:86,
words:`ಉಡುಪು – ಬಟ್ಟೆ; ವಿನ್ಯಾಸ – ಆಕಾರ, ಮಾದರಿ; ನೂಲು – ದಾರ; ನೇಯ್ಗೆ – ಬಟ್ಟೆ ನೇಯುವುದು; ಹತ್ತಿ – ಬಟ್ಟೆಗೆ ಬಳಸುವ ಬಿಳಿ ನಾರು; ಉಣ್ಣೆ – ಕುರಿಯ ತುಪ್ಪಳ; ರೇಷ್ಮೆ – ರೇಷ್ಮೆ ಹುಳುವಿನಿಂದ ಬರುವ ನೂಲು; ನೈಲಾನ್ – ಕೃತಕ ನೂಲು; ಬಂಧನ ಬಣ್ಣ – ಕಟ್ಟಿ ಹಾಕುವ ಬಣ್ಣ; ಸಾಂಪ್ರದಾಯಿಕ ಉಡುಗೆ – ಪರಂಪರೆಯ ಉಡುಪು`,
notes:`ಬೇಸಿಗೆ ಕಾಲಕ್ಕೆ ತೆಳು ಉಡುಪು, ಮಳೆಗಾಲಕ್ಕೆ ನೀರು ತಡೆಯುವ ಉಡುಪು, ಚಳಿಗಾಲಕ್ಕೆ ಬೆಚ್ಚನೆ ಉಡುಪು. ಬಟ್ಟೆ ತಯಾರಾಗುವ ಹಂತ: ಹತ್ತಿ → ನೂಲು → ನೇಯ್ಗೆ → ಬಣ್ಣ → ಬಟ್ಟೆ → ಉಡುಪು (ಹೊಲಿಗೆ). ಕುರಿಯ ತುಪ್ಪಳದಿಂದ ಉಣ್ಣೆ; ಹತ್ತಿಯನ್ನು ರೈತರು ಬೆಳೆಯುತ್ತಾರೆ. ಬಟ್ಟೆಗೆ ಬಣ್ಣ ಹಾಕಲು ಎಲೆ, ಹೂ, ಕಾಯಿಗಳು (ದಾಸವಾಳ, ಬೀಟ್‌ರೂಟ್, ಅರಿಶಿನ) ಬಳಸಬಹುದು. ಬಟ್ಟೆಯ ಮೇಲೆ ವಿನ್ಯಾಸಕ್ಕೆ ಬೆಂಡೆಕಾಯಿ, ಮೂಲಂಗಿ, ಹೂ ಕೋಸಿನ ತುಂಡು ಬಳಸಬಹುದು. ನಿನಗಿದು ಗೊತ್ತೆ?: ಮೊತ್ತಮೊದಲ ಬಟ್ಟೆಗಳು ಚರ್ಮ, ತುಪ್ಪಳ, ಎಲೆ, ಹುಲ್ಲುಗಳಿಂದ ಮಾಡಲ್ಪಟ್ಟಿದ್ದವು; ಸಸ್ಯ ನಾರಿನಿಂದ ರೇಷ್ಮೆ, ನೈಲಾನ್‌ವರೆಗೆ ಅನೇಕ ನೂಲುಗಳಿವೆ; ಕರ್ನಾಟಕ ಭಾರತದಲ್ಲಿ ಅತ್ಯಂತ ಹೆಚ್ಚು ರೇಷ್ಮೆ ಉತ್ಪಾದಿಸುವ ರಾಜ್ಯ (ಶೇ. 70) – ಬೆಂಗಳೂರು ಗ್ರಾಮಾಂತರ, ರಾಮನಗರ, ಮೈಸೂರು ಜಿಲ್ಲೆಗಳಲ್ಲಿ ಹೆಚ್ಚು; ರೇಷ್ಮೆ ಹುಳುಗಳ ಸ್ರಾವವೇ ರೇಷ್ಮೆ; ಬಾಗಲಕೋಟೆಯ ಇಳಕಲ್ ಸೀರೆಗಳು ಜಗತ್ಪ್ರಸಿದ್ಧ. ಸಾಂಪ್ರದಾಯಿಕ ಉಡುಗೆ: ಪುರುಷರು – ಪಂಚೆ, ಷರಟು, ಅಂಗವಸ್ತ್ರ; ಸ್ತ್ರೀಯರು – ಸೀರೆ, ಕುಪ್ಪಸ ಅಥವಾ ಲಂಗ, ದಾವಣಿ, ಕುಪ್ಪಸ.`,
ab:[
[`ಬಟ್ಟೆ ಮತ್ತು ಉಡುಪು`,[
[`ನೂಲಿನ ಹೊಸ ಬಗೆಗಳು ಮತ್ತು ಬಟ್ಟೆ ತಯಾರಿಕೆಯ ಹಂತಗಳನ್ನು ಕ್ರಮವಾಗಿ ಬರೆ.`,`ಹತ್ತಿ → ನೂಲು → ನೇಯ್ಗೆ → ಬಣ್ಣ → ಬಟ್ಟೆ → ಉಡುಪು.`],
[`ಒಗಟು ಬಿಡಿಸು: ನನ್ನನ್ನು ಕುರಿಯ ತುಪ್ಪಳದಿಂದ ತಯಾರಿಸುತ್ತಾರೆ, ಚಳಿಗಾಲದಲ್ಲಿ ನನ್ನನ್ನು ಧರಿಸುತ್ತಾರೆ. ನಾನ್ಯಾರು?`,`ಉಣ್ಣೆ (ಉಣ್ಣೆಯ ಬಟ್ಟೆ).`],
[`ಒಗಟು ಬಿಡಿಸು: ಬೇಸಿಗೆ ಕಾಲದಲ್ಲಿ ನನ್ನ ಬಟ್ಟೆಯನ್ನೇ ಬಯಸುತ್ತಾರೆ. ರೈತರು ನನ್ನನ್ನು ಬೆಳೆಯುತ್ತಾರೆ. ನಾನ್ಯಾರು?`,`ಹತ್ತಿ (ಹತ್ತಿಯ ಬಟ್ಟೆ).`],
[`ಬೇರೆ ಬೇರೆ ಕಾಲಗಳಲ್ಲಿ ಧರಿಸುವ ಉಡುಪುಗಳು`,`ಮಳೆಗಾಲ – ರೇನ್‌ಕೋಟ್, ಛತ್ರಿ; ಚಳಿಗಾಲ – ಸ್ವೆಟರ್, ಶಾಲು; ಬೇಸಿಗೆ ಕಾಲ – ಹತ್ತಿಯ ತೆಳು ಬಟ್ಟೆ. (ಮಾದರಿ ಉತ್ತರ)`]]],
[`ಹೊಲಿದು ಮತ್ತು ಹೊಲಿಯದೆ ಬಳಸುವ ಉಡುಪುಗಳು`,[
[`ಹೊಲಿದು ಬಳಸುವ ಉಡುಪುಗಳಿಗೆ ಮೂರು ಉದಾಹರಣೆ`,`ಷರಟು, ಪ್ಯಾಂಟ್, ಲಂಗ.`],
[`ಹೊಲಿಯದೆ ಬಳಸುವ ಉಡುಪುಗಳಿಗೆ ಮೂರು ಉದಾಹರಣೆ`,`ಸೀರೆ, ಪಂಚೆ, ಧೋತಿ, ಶಾಲು (ಯಾವುದಾದರೂ ಮೂರು).`],
[`ಕರ್ನಾಟಕದ ಸಾಂಪ್ರದಾಯಿಕ ಉಡುಗೆಗಳು`,`ಪುರುಷರು – ಪಂಚೆ, ಷರಟು, ಅಂಗವಸ್ತ್ರ; ಸ್ತ್ರೀಯರು – ಸೀರೆ, ಕುಪ್ಪಸ ಅಥವಾ ಲಂಗ, ದಾವಣಿ.`]]],
[`ಬಣ್ಣ ಮತ್ತು ವಿನ್ಯಾಸ ಚಟುವಟಿಕೆಗಳು`,[
[`ಬಟ್ಟೆಗೆ ಬಣ್ಣ ತಯಾರಿಸಲು ಯಾವುದನ್ನು ಬಳಸಬಹುದು?`,`ದಾಸವಾಳ, ಬೀಟ್‌ರೂಟ್, ಅರಿಶಿನ ಮುಂತಾದ ಎಲೆ, ಹೂ, ಕಾಯಿಗಳನ್ನು.`],
[`ಬಟ್ಟೆಯ ಮೇಲೆ ವಿನ್ಯಾಸಕ್ಕೆ ಯಾವ ತರಕಾರಿ ತುಂಡುಗಳನ್ನು ಬಳಸಬಹುದು?`,`ಬೆಂಡೆಕಾಯಿ, ಮೂಲಂಗಿ, ಹೂ ಕೋಸು ತುಂಡುಗಳು.`],
[`ಬಟ್ಟೆಯಲ್ಲಿ ನಾಣ್ಯ ಕಟ್ಟಿ ಬಣ್ಣದ ನೀರಿಗೆ ಮುಳುಗಿಸಿ ಒಣಗಿದ ನಂತರ ಬಿಡಿಸಿದರೆ ಏನಾಗುತ್ತದೆ?`,`ಕಟ್ಟಿದ ಜಾಗದಲ್ಲಿ ಬಣ್ಣ ಹತ್ತದೆ ಒಂದು ಚಿತ್ರ/ವಿನ್ಯಾಸ ಮೂಡುತ್ತದೆ (ಟೈ ಅಂಡ್ ಡೈ).`]]]
],
qb:[
M(`ಕುರಿಯ ತುಪ್ಪಳದಿಂದ ತಯಾರಿಸುವುದು:`,[`ಹತ್ತಿ`,`ಉಣ್ಣೆ`,`ರೇಷ್ಮೆ`,`ನೈಲಾನ್`],1),
M(`ಚಳಿಗಾಲದಲ್ಲಿ ಧರಿಸುವ ಬಟ್ಟೆ:`,[`ತೆಳು ಹತ್ತಿ`,`ಉಣ್ಣೆಯ ಬಟ್ಟೆ`,`ರೇನ್‌ಕೋಟ್`,`ಯಾವುದೂ ಅಲ್ಲ`],1),
M(`ಹತ್ತಿಯನ್ನು ಬೆಳೆಯುವವರು:`,[`ಬಡಗಿ`,`ರೈತರು`,`ಕುಂಬಾರ`,`ದರ್ಜಿ`],1),
M(`ಭಾರತದಲ್ಲಿ ಅತಿ ಹೆಚ್ಚು ರೇಷ್ಮೆ ಉತ್ಪಾದಿಸುವ ರಾಜ್ಯ:`,[`ತಮಿಳುನಾಡು`,`ಕೇರಳ`,`ಕರ್ನಾಟಕ`,`ಗೋವಾ`],2),
M(`ಜಗತ್ಪ್ರಸಿದ್ಧ ಸೀರೆಗಳು ತಯಾರಾಗುವ ಊರು:`,[`ಇಳಕಲ್`,`ಹಾಸನ`,`ಬಳ್ಳಾರಿ`,`ಮಂಡ್ಯ`],0),
M(`ರೇಷ್ಮೆ ಯಾವುದರ ಸ್ರಾವ?`,[`ರೇಷ್ಮೆ ಹುಳು`,`ಕುರಿ`,`ಹತ್ತಿ ಗಿಡ`,`ಜೇನುಹುಳು`],0),
M(`ಪುರುಷರ ಸಾಂಪ್ರದಾಯಿಕ ಉಡುಗೆ:`,[`ಪಂಚೆ`,`ದಾವಣಿ`,`ಲಂಗ`,`ಸೀರೆ`],0),
M(`ಬಟ್ಟೆ ಸಿದ್ಧಪಡಿಸುವ ಸರಿಯಾದ ಕ್ರಮ:`,[`ಬಟ್ಟೆ → ನೂಲು → ಹತ್ತಿ`,`ಹತ್ತಿ → ನೂಲು → ನೇಯ್ಗೆ → ಬಟ್ಟೆ`,`ನೂಲು → ಹತ್ತಿ → ಬಟ್ಟೆ`,`ನೇಯ್ಗೆ → ಹತ್ತಿ → ನೂಲು`],1,'m'),
O(`ಮೊತ್ತಮೊದಲ ಬಟ್ಟೆಗಳನ್ನು ಯಾವುದರಿಂದ ಮಾಡಲಾಗಿತ್ತು?`,`ಚರ್ಮ, ತುಪ್ಪಳ, ಎಲೆ, ಹುಲ್ಲುಗಳಿಂದ.`),
O(`ಇಳಕಲ್ ಸೀರೆ ಯಾವ ಜಿಲ್ಲೆಯಲ್ಲಿ ತಯಾರಾಗುತ್ತದೆ?`,`ಬಾಗಲಕೋಟೆ ಜಿಲ್ಲೆ.`),
O(`ಸ್ತ್ರೀಯರ ಸಾಂಪ್ರದಾಯಿಕ ಉಡುಗೆಗಳಲ್ಲಿ ಎರಡನ್ನು ಬರೆ.`,`ಸೀರೆ, ದಾವಣಿ (ಲಂಗ, ಕುಪ್ಪಸ).`),
O(`ಬಣ್ಣ ತಯಾರಿಸಲು ಸುಲಭವಾಗಿ ಸಿಗುವ ಒಂದು ಹೂ ಹೆಸರಿಸು.`,`ದಾಸವಾಳ.`),
O(`ಮಳೆಗಾಲದಲ್ಲಿ ಬಳಸುವ ಉಡುಪು ಯಾವುದು?`,`ರೇನ್‌ಕೋಟ್.`),
O(`ರೇಷ್ಮೆ ಹೆಚ್ಚು ಉತ್ಪಾದಿಸುವ ಮೂರು ಜಿಲ್ಲೆಗಳಲ್ಲಿ ಎರಡನ್ನು ಹೇಳು.`,`ಬೆಂಗಳೂರು ಗ್ರಾಮಾಂತರ, ರಾಮನಗರ, ಮೈಸೂರು (ಯಾವುದಾದರೂ ಎರಡು).`),
G(`ಖಾಲಿ ಬಿಟ್ಟ ಸ್ಥಳ ತುಂಬಿ: ಬಟ್ಟೆ ಹತ್ತಿಯಿಂದ ಮೊದಲು ______ ಆಗುತ್ತದೆ.`,`ನೂಲು`),
G(`ಖಾಲಿ ಬಿಟ್ಟ ಸ್ಥಳ ತುಂಬಿ: ಬೇಸಿಗೆಯಲ್ಲಿ ______ ಉಡುಪು ಧರಿಸುತ್ತಾರೆ.`,`ತೆಳು`),
G(`ಸರಿ/ತಪ್ಪು ಬರೆ: ಉಣ್ಣೆಯನ್ನು ಬೇಸಿಗೆಯಲ್ಲಿ ಧರಿಸುತ್ತಾರೆ.`,`ತಪ್ಪು. ಚಳಿಗಾಲದಲ್ಲಿ ಧರಿಸುತ್ತಾರೆ.`),
G(`ಸರಿ/ತಪ್ಪು ಬರೆ: ಸೀರೆ ಹೊಲಿಯದೆ ಉಡುವ ಉಡುಪು.`,`ಸರಿ`),
G(`ಹೊಂದಿಸಿ ಬರೆ: ಹತ್ತಿ, ಉಣ್ಣೆ, ರೇಷ್ಮೆ – (ಕುರಿ, ರೈತ, ರೇಷ್ಮೆ ಹುಳು).`,`ಹತ್ತಿ – ರೈತ; ಉಣ್ಣೆ – ಕುರಿ; ರೇಷ್ಮೆ – ರೇಷ್ಮೆ ಹುಳು`,'m'),
G(`ಉಡುಪು ಸಿದ್ಧವಾಗುವ ಹಂತಗಳನ್ನು ಕ್ರಮವಾಗಿ ಬರೆ: ಬಣ್ಣ, ಹತ್ತಿ, ನೇಯ್ಗೆ, ನೂಲು, ಬಟ್ಟೆ, ಉಡುಪು.`,`ಹತ್ತಿ → ನೂಲು → ನೇಯ್ಗೆ → ಬಣ್ಣ → ಬಟ್ಟೆ → ಉಡುಪು`,'m'),
S(`ಬೇರೆ ಬೇರೆ ಕಾಲಗಳಲ್ಲಿ ನಾವು ಧರಿಸುವ ಉಡುಪುಗಳ ವ್ಯತ್ಯಾಸ ಬರೆ.`,`ಬೇಸಿಗೆ – ತೆಳು ಹತ್ತಿ ಬಟ್ಟೆ; ಮಳೆಗಾಲ – ನೀರು ತಡೆಯುವ ಉಡುಪು; ಚಳಿಗಾಲ – ಬೆಚ್ಚನೆ ಉಣ್ಣೆಯ ಉಡುಪು.`),
S(`ರೇಷ್ಮೆಯ ಬಗ್ಗೆ ಎರಡು ವಾಕ್ಯ ಬರೆ.`,`ರೇಷ್ಮೆ ಹುಳುಗಳ ಸ್ರಾವವೇ ರೇಷ್ಮೆ. ಕರ್ನಾಟಕವು ಭಾರತದಲ್ಲಿ ಅತಿ ಹೆಚ್ಚು ರೇಷ್ಮೆ ಉತ್ಪಾದಿಸುವ ರಾಜ್ಯ.`),
S(`ಬಟ್ಟೆಯ ಮೇಲೆ ವಿನ್ಯಾಸ ಮಾಡಲು ಯಾವ ವಸ್ತುಗಳನ್ನು ಬಳಸಬಹುದು?`,`ಬೆಂಡೆಕಾಯಿ, ಮೂಲಂಗಿ, ಹೂ ಕೋಸಿನ ತುಂಡುಗಳು ಮತ್ತು ಬಣ್ಣ.`),
L(`ಹತ್ತಿಯಿಂದ ಉಡುಪು ತಯಾರಾಗುವ ಹಂತಗಳನ್ನು ವಿವರಿಸು.`,`ರೈತರು ಹತ್ತಿಯನ್ನು ಬೆಳೆಯುತ್ತಾರೆ. ಹತ್ತಿಯಿಂದ ನೂಲನ್ನು ತಯಾರಿಸುತ್ತಾರೆ. ನೇಕಾರರು ನೂಲನ್ನು ನೇಯ್ದು ಬಟ್ಟೆ ತಯಾರಿಸುತ್ತಾರೆ. ಬಟ್ಟೆಗೆ ಬಣ್ಣ ಹಾಕಿ ವಿನ್ಯಾಸ ಮಾಡುತ್ತಾರೆ. ನಂತರ ದರ್ಜಿ ಬಟ್ಟೆಯನ್ನು ಹೊಲಿದು ಉಡುಪು ಸಿದ್ಧಪಡಿಸುತ್ತಾರೆ.`),
L(`ಕರ್ನಾಟಕದ ಸಾಂಪ್ರದಾಯಿಕ ಉಡುಗೆಗಳು ಮತ್ತು ರೇಷ್ಮೆಯ ಬಗ್ಗೆ ಬರೆ.`,`ಪುರುಷರ ಸಾಂಪ್ರದಾಯಿಕ ಉಡುಗೆ ಪಂಚೆ, ಷರಟು ಮತ್ತು ಅಂಗವಸ್ತ್ರ; ಸ್ತ್ರೀಯರದು ಸೀರೆ, ಕುಪ್ಪಸ ಅಥವಾ ಲಂಗ, ದಾವಣಿ. ಕರ್ನಾಟಕವು ಭಾರತದಲ್ಲಿ ಅತಿ ಹೆಚ್ಚು ರೇಷ್ಮೆ ಉತ್ಪಾದಿಸುವ ರಾಜ್ಯ. ರೇಷ್ಮೆ ಹುಳುಗಳ ಸ್ರಾವವೇ ರೇಷ್ಮೆ. ಬೆಂಗಳೂರು ಗ್ರಾಮಾಂತರ, ರಾಮನಗರ ಮತ್ತು ಮೈಸೂರು ಜಿಲ್ಲೆಗಳಲ್ಲಿ ಹೆಚ್ಚು ರೇಷ್ಮೆ ಉತ್ಪಾದನೆಯಾಗುತ್ತದೆ. ಬಾಗಲಕೋಟೆಯ ಇಳಕಲ್ ಸೀರೆಗಳು ಜಗತ್ಪ್ರಸಿದ್ಧ.`)
]});

LSV.push({n:24,t:`ಮೋಡಣ್ಣನ ಪಯಣ`,au:`ಸಮಿತಿ ರಚನೆ`,pg:93,
words:`ಭೂಸ್ವರೂಪ – ಭೂಮಿಯ ಆಕಾರ; ಮರುಭೂಮಿ – ಮರಳಿನ ಪ್ರದೇಶ; ಮೈದಾನ – ಸಮತಟ್ಟಾದ ಪ್ರದೇಶ; ಪ್ರಸ್ಥಭೂಮಿ – ಸಮತಟ್ಟಾದ ಎತ್ತರದ ಪ್ರದೇಶ; ಬೆಟ್ಟ – ಎತ್ತರದ ಭೂಭಾಗ; ಪರ್ವತ – ಅತಿ ಎತ್ತರದ ಬೆಟ್ಟ; ಕಣಿವೆ – ಎರಡು ಬೆಟ್ಟಗಳ ನಡುವಿನ ತಗ್ಗು; ಜಲಪಾತ – ಎತ್ತರದಿಂದ ಧುಮುಕುವ ನೀರು; ಹವಾಮಾನ – ದಿನದ ವಾತಾವರಣ; ವಾಯುಗುಣ – ದೀರ್ಘಕಾಲದ ಹವಾಮಾನದ ಸರಾಸರಿ; ಮಲಿನ – ಕಲುಷಿತ`,
notes:`ಮೋಡಣ್ಣ ಸಮುದ್ರ ತೀರ → ಮರುಭೂಮಿ → ಮೈದಾನ → ಪ್ರಸ್ಥಭೂಮಿ → ಬೆಟ್ಟಗಳ ಸಾಲು → ಕಣಿವೆ → ಜಲಪಾತ → ಪರ್ವತ ಹೀಗೆ ಪಯಣಿಸಿ ಮಳೆಯಾಗಿ ಸುರಿಯಿತು. ಪರ್ವತ ಬೆಟ್ಟಕ್ಕಿಂತ ಎತ್ತರ (ಸುಮಾರು 1000 m ಗಿಂತ ಹೆಚ್ಚು), ಹಿಮ ಆವರಿಸಿರಬಹುದು; ಹಿಮಾಲಯ ಭಾರತದ ಉತ್ತರದಲ್ಲಿದೆ. ಜೀವಿಗಳ ಬದುಕಿಗೆ ಗಾಳಿ, ನೀರು, ಮಣ್ಣು ಅತಿ ಮುಖ್ಯ. ಮಾಲಿನ್ಯ ತಡೆಯಲು ಎಚ್ಚರ ವಹಿಸಬೇಕು. ಹವಾಮಾನ (ದಿನ ದಿನಕ್ಕೆ ಬದಲಾಗುವ ವಾತಾವರಣ) ಮತ್ತು ವಾಯುಗುಣ (30–35 ವರ್ಷಗಳ ಸರಾಸರಿ ಹವಾಮಾನ). ಮೂರು ಕಾಲಗಳು: ಬೇಸಿಗೆ, ಮಳೆಗಾಲ, ಚಳಿಗಾಲ. ಕಾಮನಬಿಲ್ಲಿನ ಏಳು ಬಣ್ಣಗಳು: VIBGYOR (ನೇರಳೆ, ಬೂದು, ನೀಲಿ, ಹಸಿರು, ಹಳದಿ, ಕಿತ್ತಳೆ, ಕೆಂಪು). ನಿನಗಿದು ಗೊತ್ತೆ?: ಹಿಮಾಲಯ 2400 km ಉದ್ದ; ಕಣಿವೆಗಳು V ಅಥವಾ U ಆಕಾರ; ಟಿಬೆಟ್ ಪ್ರಸ್ಥಭೂಮಿಯನ್ನು ಜಗತ್ತಿನ ಮೇಲ್ಛಾವಣಿ ಎನ್ನುತ್ತಾರೆ; ನದಿಗಳು ತರುವ ಮಣ್ಣು ಮೆಕ್ಕಲು ಮಣ್ಣು; ಭಾರತದ ಪಶ್ಚಿಮಕ್ಕೆ ಥಾರ್ ಮರುಭೂಮಿ; ಮುಳ್ಳಯ್ಯನ ಗಿರಿ ಕರ್ನಾಟಕದ ಅತಿ ಎತ್ತರದ ಶಿಖರ (ಸುಮಾರು 1925 m).`,
ab:[
[`ಮೋಡಣ್ಣನ ಪಯಣದ ಭೂಸ್ವರೂಪಗಳು`,[
[`ಮೋಡಣ್ಣ ಮೊದಲು ಯಾವ ಪ್ರದೇಶದಲ್ಲಿ ಸಂಚರಿಸಿತು?`,`ಸಮುದ್ರ ತೀರ (ತೆಂಗಿನ ಮರಗಳ ಸಾಲು, ಅಲೆಗಳು, ತಂಪು ಗಾಳಿ).`],
[`ಮರುಭೂಮಿ ಹೇಗಿತ್ತು?`,`ಅತಿ ಬಿಸಿಲು, ಮರಳಿನ ರಾಶಿ, ಬಲವಾದ ಗಾಳಿ; ಮರಗಳೇ ಕಾಣಲಿಲ್ಲ.`],
[`ಮೈದಾನ ಪ್ರದೇಶದ ವಿಶೇಷವೇನು?`,`ವಿಶಾಲ ಮತ್ತು ಸಮತಟ್ಟು; ನದಿಗಳು ಮಣ್ಣನ್ನು ಹೊತ್ತು ತಂದು ಫಲವತ್ತಾಗಿಸಿವೆ; ಹಸಿರಿನಿಂದ ಕೂಡಿ ಬೇಸಾಯಕ್ಕೆ ಉತ್ತಮ.`],
[`ಪ್ರಸ್ಥಭೂಮಿ ಎಂದರೇನು?`,`ಸಮುದ್ರ ಮಟ್ಟಕ್ಕಿಂತ ಎತ್ತರವಾದ ವಿಶಾಲ ಸಮತಟ್ಟಾದ ಪ್ರದೇಶ.`],
[`ಕಣಿವೆ ಎಂದರೇನು?`,`ಎರಡು ಬೆಟ್ಟಗಳ ನಡುವಿನ ಕಿರಿದಾದ ತಗ್ಗು ಪ್ರದೇಶ; ಕೆಲವೊಮ್ಮೆ ಇಲ್ಲಿ ನದಿಗಳು ಹರಿಯುತ್ತವೆ.`],
[`ಜಲಪಾತ ಹೇಗೆ ಸೃಷ್ಟಿಯಾಗುತ್ತದೆ?`,`ಬೆಟ್ಟಗಳ ತುದಿಗಳ ಮೇಲಿಂದ ನೀರು ಧುಮುಕುವಾಗ.`],
[`ಪರ್ವತ ಎಂದರೇನು?`,`ಸಮುದ್ರ ಮಟ್ಟದಿಂದ ಸಾವಿರ ಮೀಟರ್‌ಗಳಿಗಿಂತಲೂ ಎತ್ತರವಾದ ಅತಿ ದೊಡ್ಡ ಬೆಟ್ಟ; ಕೆಲವೆಡೆ ಹಿಮ ಆವರಿಸಿರುತ್ತದೆ.`]]],
[`ಮೇಲೆ ಕೊಟ್ಟ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸು (ಮೋಡಣ್ಣನ ಸಹಾಯ)`,[
[`ಬೆಟ್ಟಗಳು ಸಮುದ್ರ ಮಟ್ಟದಿಂದ ಎಷ್ಟು ಎತ್ತರದಲ್ಲಿರುತ್ತವೆ?`,`ಸುಮಾರು 600 ಮೀಟರ್ ಎತ್ತರ (ಪಠ್ಯದಲ್ಲಿ 'ಆರುನೂರು ಮೀಟರ್').`],
[`ಬೆಟ್ಟಗಳ ಮಧ್ಯೆ ಕಂಡುಬರುವ ಆಳವಾದ ಪ್ರದೇಶವನ್ನು ಏನೆನ್ನುತ್ತಾರೆ?`,`ಕಣಿವೆ.`],
[`ನಮ್ಮ ರಾಜ್ಯದ ಮೂರು ಪ್ರಸಿದ್ಧ ಜಲಪಾತಗಳು`,`ಜೋಗ ಜಲಪಾತ, ಗೋಕಾಕ್ ಜಲಪಾತ, ಶಿವನಸಮುದ್ರ (ಯಾವುದಾದರೂ ಮೂರು).`],
[`ಫಲವತ್ತಾದ ಮಣ್ಣು ಎಲ್ಲಿ ಕಂಡುಬರುತ್ತದೆ?`,`ನದಿ ಹರಿಯುವ ಮೈದಾನ ಪ್ರದೇಶಗಳಲ್ಲಿ.`]]],
[`ಗಾಳಿ, ನೀರು, ಮಣ್ಣು`,[
[`ಗಾಳಿ ಮಲಿನವಾಗದಂತೆ ತಡೆಯುವುದು ಹೇಗೆ?`,`ವಾಹನ ಮತ್ತು ಕಾರ್ಖಾನೆ ಹೊಗೆ ಕಡಿಮೆ ಮಾಡುವುದು; ಹೆಚ್ಚು ಗಿಡ ಮರ ಬೆಳೆಸುವುದು; ಕಸ ಸುಡದಿರುವುದು. (ಮಾದರಿ ಉತ್ತರ)`],
[`ನೀರು ಮಲಿನವಾಗದಂತೆ ತೆಗೆದುಕೊಳ್ಳುವ ಕ್ರಮಗಳು`,`ನದಿ, ಕೆರೆಯಲ್ಲಿ ಬಟ್ಟೆ, ಪಾತ್ರೆ ತೊಳೆಯದಿರುವುದು, ವಾಹನ ತೊಳೆಯದಿರುವುದು, ಕಾರ್ಖಾನೆಯ ತ್ಯಾಜ್ಯ ಬಿಡದಿರುವುದು.`],
[`ಮಣ್ಣಿನ ಮಲಿನತೆಯನ್ನು ಹೇಗೆ ತಡೆಯುವೆ?`,`ಪ್ಲಾಸ್ಟಿಕ್ ಬಳಕೆ ಕಡಿಮೆ ಮಾಡುವುದು; ರಾಸಾಯನಿಕ ಗೊಬ್ಬರ ಕಡಿಮೆ ಮಾಡುವುದು; ಕಸವನ್ನು ಎಲ್ಲೆಂದರಲ್ಲಿ ಬಿಸಾಡದಿರುವುದು.`]]],
[`ಹವಾಮಾನ ಮತ್ತು ವಾಯುಗುಣ`,[
[`ಹವಾಮಾನ ಎಂದರೇನು?`,`ಒಂದೇ ದಿನದಲ್ಲಿ ಅಥವಾ ದಿನದಿಂದ ದಿನಕ್ಕೆ ಬದಲಾಗುವ ವಾತಾವರಣದ ಸ್ಥಿತಿ.`],
[`ವಾಯುಗುಣ ಎಂದರೇನು?`,`ಒಂದು ಪ್ರದೇಶದ ಹವಾಮಾನವನ್ನು ಸುಮಾರು 30–35 ವರ್ಷಗಳವರೆಗೆ ಪರಿಶೀಲಿಸಿ ತೆಗೆದ ದೀರ್ಘಕಾಲೀನ ಸರಾಸರಿ.`],
[`ಮೂರು ಕಾಲಗಳು ಯಾವುವು?`,`ಬೇಸಿಗೆ ಕಾಲ, ಮಳೆಗಾಲ, ಚಳಿಗಾಲ.`],
[`ತಣ್ಣೀರಿನಲ್ಲಿ ಸ್ನಾನ ಮಾಡುವುದು – ಯಾವ ಕಾಲ?`,`ಬೇಸಿಗೆ ಕಾಲ.`],
[`ಉಣ್ಣೆ ಉಡುಪು ಧರಿಸಿ ಬೆಚ್ಚನೆ ಅನುಭವ ಪಡೆಯುವುದು – ಯಾವ ಕಾಲ?`,`ಚಳಿಗಾಲ.`],
[`ಫ್ಯಾನ್ ಗಾಳಿಗೆ ಕುಳಿತುಕೊಳ್ಳಲು ಬಯಸುವುದು – ಯಾವ ಕಾಲ?`,`ಬೇಸಿಗೆ ಕಾಲ.`],
[`ರೇನ್‌ಕೋಟ್ ಧರಿಸಿ ಓಡಾಡುವುದು – ಯಾವ ಕಾಲ?`,`ಮಳೆಗಾಲ.`],
[`ಮರಗಳು ಎಲೆಗಳನ್ನು ಉದುರಿಸುವುದು – ಯಾವ ಕಾಲ?`,`ಚಳಿಗಾಲ. ⚠ ಪಠ್ಯಪುಸ್ತಕದೊಂದಿಗೆ ಪರಿಶೀಲಿಸಿ.`],
[`ಛತ್ರಿಯನ್ನು ಬಳಸುವುದು – ಯಾವ ಕಾಲ?`,`ಮಳೆಗಾಲ.`],
[`ಕಾಮನಬಿಲ್ಲು ಯಾವಾಗ ಕಾಣಿಸುತ್ತದೆ?`,`ಮಳೆ ಬರುವಾಗ ಅಥವಾ ಮಳೆ ನಿಂತ ನಂತರ ಸೂರ್ಯನ ಬೆಳಕು ಇದ್ದಾಗ.`],
[`ಕಾಮನಬಿಲ್ಲಿನಲ್ಲಿ ಎಷ್ಟು ಬಣ್ಣಗಳಿವೆ?`,`ಏಳು (ನೇರಳೆ, ಬೂದು, ನೀಲಿ, ಹಸಿರು, ಹಳದಿ, ಕಿತ್ತಳೆ, ಕೆಂಪು).`]]]
],
qb:[

M(`ಬಿಸಿಲು ಹೆಚ್ಚು, ಮರಳಿನ ರಾಶಿಯ ಪ್ರದೇಶ:`,[`ಕಣಿವೆ`,`ಮೈದಾನ`,`ಮರುಭೂಮಿ`,`ತೀರ`],2),

O(`ಕಾಮನಬಿಲ್ಲಿನ ಬಣ್ಣಗಳನ್ನು ನೆನಪಿಡಲು ಬಳಸುವ ಪದ ಯಾವುದು?`,`VIBGYOR.`),

G(`ಖಾಲಿ ಬಿಟ್ಟ ಸ್ಥಳ ತುಂಬಿ: ಎತ್ತರದ ಬೆಟ್ಟದ ತುದಿಯಿಂದ ನೀರು ಧುಮುಕಿದರೆ ______ ಸೃಷ್ಟಿಯಾಗುತ್ತದೆ.`,`ಜಲಪಾತ`),
G(`ಸರಿ/ತಪ್ಪು ಬರೆ: ಮರುಭೂಮಿಯಲ್ಲಿ ಮರಗಳು ಹೇರಳವಾಗಿ ಕಾಣುತ್ತವೆ.`,`ತಪ್ಪು. ಮರಗಳು ಕಾಣುವುದಿಲ್ಲ.`),
G(`ಸರಿ/ತಪ್ಪು ಬರೆ: ಭೂಮಿಯ ನೆಲಭಾಗದ ಅರ್ಧಕ್ಕಿಂತ ಹೆಚ್ಚು ಭಾಗ ಮೈದಾನ.`,`ಸರಿ`),

G(`ಹೊಂದಿಸಿ ಬರೆ: ರೇನ್‌ಕೋಟ್, ಸ್ವೆಟರ್, ಫ್ಯಾನ್ – (ಮಳೆಗಾಲ, ಚಳಿಗಾಲ, ಬೇಸಿಗೆ).`,`ರೇನ್‌ಕೋಟ್ – ಮಳೆಗಾಲ; ಸ್ವೆಟರ್ – ಚಳಿಗಾಲ; ಫ್ಯಾನ್ – ಬೇಸಿಗೆ`,'m'),

S(`ಬೆಟ್ಟ ಮತ್ತು ಪರ್ವತಗಳ ವ್ಯತ್ಯಾಸ ಬರೆ.`,`ಬೆಟ್ಟಗಳು ಸಮುದ್ರ ಮಟ್ಟದಿಂದ ಸುಮಾರು 600 ಮೀಟರ್ ಎತ್ತರ; ಪರ್ವತಗಳು ಸಾವಿರ ಮೀಟರ್‌ಗಳಿಗಿಂತಲೂ ಹೆಚ್ಚು ಎತ್ತರ ಮತ್ತು ಹಿಮದಿಂದ ಆವೃತವಾಗಿರಬಹುದು.`),
L(`ಮೋಡಣ್ಣನ ಪಯಣದಲ್ಲಿ ಕಂಡು ಬಂದ ಭೂಸ್ವರೂಪಗಳನ್ನು ವಿವರಿಸು.`,`ಮೋಡಣ್ಣ ಮೊದಲು ಸಮುದ್ರ ತೀರದಲ್ಲಿ ತೆಂಗಿನ ಮರಗಳು ಮತ್ತು ಅಲೆಗಳನ್ನು ಕಂಡಿತು. ನಂತರ ಮರುಭೂಮಿಯಲ್ಲಿ ಅತಿ ಬಿಸಿಲು, ಮರಳಿನ ರಾಶಿ ಕಂಡಿತು. ಮುಂದೆ ನದಿಗಳಿಂದ ಫಲವತ್ತಾದ ವಿಶಾಲ ಮೈದಾನ, ಅಲ್ಲಿಂದ ಸ್ವಲ್ಪ ಎತ್ತರದ ಪ್ರಸ್ಥಭೂಮಿ ಕಂಡಿತು. ಅನಂತರ ಬೆಟ್ಟಗಳ ಸಾಲು, ಎರಡು ಬೆಟ್ಟಗಳ ನಡುವಿನ ಕಣಿವೆ, ಬೆಟ್ಟದ ತುದಿಯಿಂದ ಧುಮುಕುವ ಜಲಪಾತ ಕಂಡಿತು. ಕೊನೆಗೆ ಅತಿ ಎತ್ತರದ ಹಿಮಾವೃತ ಪರ್ವತವನ್ನು ತಲುಪಿ ತಂಪಾದ ಗಾಳಿಯಿಂದ ಮಳೆಯಾಗಿ ಸುರಿಯಿತು.`),
L(`ಗಾಳಿ, ನೀರು ಮತ್ತು ಮಣ್ಣಿನ ಮಲಿನತೆಯನ್ನು ತಡೆಯುವ ಕ್ರಮಗಳನ್ನು ಬರೆ.`,`ಗಾಳಿ: ಕಾರ್ಖಾನೆ, ವಾಹನಗಳ ಹೊಗೆ ಕಡಿಮೆ ಮಾಡಬೇಕು ಮತ್ತು ಗಿಡ–ಮರ ಬೆಳೆಸಬೇಕು. ನೀರು: ಕಾರ್ಖಾನೆ ತ್ಯಾಜ್ಯ ಬಿಡಬಾರದು, ನದಿ–ಕೆರೆಯಲ್ಲಿ ಬಟ್ಟೆ, ಪಾತ್ರೆ ಮತ್ತು ವಾಹನ ತೊಳೆಯಬಾರದು. ಮಣ್ಣು: ಪ್ಲಾಸ್ಟಿಕ್ ವಸ್ತುಗಳ ಬಳಕೆ ಕಡಿಮೆ ಮಾಡಬೇಕು, ರಾಸಾಯನಿಕ ಗೊಬ್ಬರ ಹೆಚ್ಚು ಬಳಸಬಾರದು. ಇವು ನಮ್ಮ ಬದುಕಿಗೆ ಅತಿ ಅವಶ್ಯಕವಾದ ಸಂಪನ್ಮೂಲಗಳು.`)
]});

LSV.push({n:25,t:`ನಮ್ಮ ರಾಜ್ಯ – ನಮ್ಮ ಹೆಮ್ಮೆ`,au:`ಸಮಿತಿ ರಚನೆ`,pg:105,
words:`ರಾಜ್ಯ – ಭಾರತದ ಒಂದು ಆಡಳಿತ ವಿಭಾಗ; ಜಿಲ್ಲೆ – ರಾಜ್ಯದ ಆಡಳಿತ ವಿಭಾಗ; ರಾಜಧಾನಿ – ಆಡಳಿತ ಕೇಂದ್ರ ನಗರ; ನೈಸರ್ಗಿಕ ವಿಭಾಗ – ಭೂಲಕ್ಷಣಗಳ ಆಧಾರದ ವಿಭಾಗ; ಕರಾವಳಿ – ಸಮುದ್ರ ತೀರ; ಮಲೆನಾಡು – ಬೆಟ್ಟ–ಕಾಡುಗಳ ಪ್ರದೇಶ; ಪ್ರೇಕ್ಷಣೀಯ ಸ್ಥಳ – ನೋಡಲು ಯೋಗ್ಯ ಸ್ಥಳ; ಐತಿಹಾಸಿಕ ಸ್ಥಳ – ಇತಿಹಾಸದ ಮಹತ್ವದ ಸ್ಥಳ; ನಿಸರ್ಗಧಾಮ – ನೈಸರ್ಗಿಕ ಸೌಂದರ್ಯದ ತಾಣ`,
notes:`ಕರ್ನಾಟಕ ದಕ್ಷಿಣ ಭಾರತದಲ್ಲಿದೆ; ರಾಜಧಾನಿ ಬೆಂಗಳೂರು. ನೆರೆಯ ರಾಜ್ಯಗಳು: ಉತ್ತರಕ್ಕೆ ಮಹಾರಾಷ್ಟ್ರ; ಪಶ್ಚಿಮಕ್ಕೆ ಗೋವ ಮತ್ತು ಅರಬ್ಬೀ ಸಮುದ್ರ; ಪೂರ್ವಕ್ಕೆ ಆಂಧ್ರ ಪ್ರದೇಶ ಮತ್ತು ತೆಲಂಗಾಣ; ದಕ್ಷಿಣಕ್ಕೆ ಕೇರಳ ಮತ್ತು ತಮಿಳುನಾಡು. ಕರ್ನಾಟಕದ ನಾಲ್ಕು ಸ್ವಾಭಾವಿಕ ವಿಭಾಗಗಳು: 1) ಪಶ್ಚಿಮದ ತೀರಪ್ರದೇಶ (ಕರಾವಳಿ) – ಕಾರವಾರ, ಮಂಗಳೂರು, ಉಡುಪಿ; ಮೀನುಗಾರಿಕೆ ಮುಖ್ಯ ಕಸುಬು; ಭತ್ತ, ತೆಂಗು, ಅಡಿಕೆ, ಗೇರು; ಕಬ್ಬಿಣ, ಮ್ಯಾಂಗನೀಸ್. 2) ಮಲೆನಾಡು (ಸಹ್ಯಾದ್ರಿ/ಪಶ್ಚಿಮ ಘಟ್ಟ) – ಮಡಿಕೇರಿ, ಚಿಕ್ಕಮಗಳೂರು, ಶಿವಮೊಗ್ಗ, ಹಾಸನ, ಬೆಳಗಾವಿ; ಭತ್ತ, ತೆಂಗು, ಅಡಿಕೆ, ಕಾಫಿ, ಏಲಕ್ಕಿ, ಕಾಳು ಮೆಣಸು; ಕಾಡುಪಾಪ ಅಪರೂಪದ ಪ್ರಾಣಿ; ಕಬ್ಬಿಣದ ಅದಿರು, ಮ್ಯಾಂಗನೀಸ್. 3) ಉತ್ತರದ ಮೈದಾನ ಪ್ರದೇಶ – ಸಮುದ್ರ ಮಟ್ಟದಿಂದ 350–600 m ಎತ್ತರ; ಬೀದರ್, ಕಲಬುರಗಿ, ರಾಯಚೂರು, ಕೊಪ್ಪಳ, ಬಳ್ಳಾರಿ, ವಿಜಯಪುರ, ಬಾಗಲಕೋಟೆ, ಗದಗ, ಧಾರವಾಡ, ಹುಬ್ಬಳ್ಳಿ; ಕೃಷಿ ಮುಖ್ಯ ಕಸುಬು (ಗೋಧಿ, ಜೋಳ, ತಂಬಾಕು, ಹತ್ತಿ, ಕಬ್ಬು); ತಾಮ್ರ, ಸುಣ್ಣದ ಶಿಲೆ, ಕಬ್ಬಿಣ, ಚಿನ್ನ. 4) ದಕ್ಷಿಣದ ಮೈದಾನ ಪ್ರದೇಶ – 600–1000 m ಎತ್ತರ, ಏರುತಗ್ಗುಗಳಿಂದ ಕೂಡಿದೆ; ದಾವಣಗೆರೆ, ತುಮಕೂರು, ಚಿತ್ರದುರ್ಗ, ಬೆಂಗಳೂರು, ಕೋಲಾರ, ಮೈಸೂರು, ಮಂಡ್ಯ, ಚಾಮರಾಜನಗರ; ಕೃಷಿ ಮತ್ತು ಪಶುಪಾಲನೆ (ರಾಗಿ, ಭತ್ತ, ಹತ್ತಿ, ಎಣ್ಣೆ ಬೀಜಗಳು, ದ್ವಿದಳ ಧಾನ್ಯ); ಅಭ್ರಕ (ಕಾಗೆಬಂಗಾರ), ಕಣಶಿಲೆ, ಸುಣ್ಣದ ಕಲ್ಲು, ಬಳಪದ ಕಲ್ಲು; ತೋಳ, ಕರಡಿ, ಕೋತಿ, ಹಾವು, ನವಿಲು, ಕೃಷ್ಣಮೃಗ. ನದಿಗಳು: ಪಶ್ಚಿಮಾಭಿಮುಖ – ಶರಾವತಿ, ಕಾಳಿ, ಅಘನಾಶಿನಿ, ನೇತ್ರಾವತಿ; ಪೂರ್ವಾಭಿಮುಖ – ಕೃಷ್ಣಾ, ಘಟಪ್ರಭಾ, ಮಲಪ್ರಭಾ, ಭೀಮಾ, ತುಂಗಭದ್ರಾ, ಕಾವೇರಿ, ಹೇಮಾವತಿ, ಕಪಿಲಾ. ನಿನಗಿದು ಗೊತ್ತೆ?: 2014ರಲ್ಲಿ ಆಂಧ್ರಪ್ರದೇಶ ವಿಭಜನೆ (ತೆಲಂಗಾಣ); 2019ರಲ್ಲಿ ಜಮ್ಮು–ಕಾಶ್ಮೀರ ಮತ್ತು ಲಡಾಖ್ ಕೇಂದ್ರಾಡಳಿತ ಪ್ರದೇಶಗಳು; ಕಾವೇರಿ ಕೊಡಗಿನ ಬ್ರಹ್ಮಗಿರಿ ಬೆಟ್ಟದ ತಲಕಾವೇರಿಯಲ್ಲಿ ಹುಟ್ಟುತ್ತದೆ; ಬೆಂಗಳೂರು ಮಾಹಿತಿ ತಂತ್ರಜ್ಞಾನಕ್ಕೆ ಹೆಸರುವಾಸಿ (ಸಿಲಿಕಾನ್ ಸಿಟಿ); 1902ರಲ್ಲಿ ಶಿವನಸಮುದ್ರದಲ್ಲಿ ಜಲ ವಿದ್ಯುತ್ ತಯಾರಿಕೆ ಪ್ರಾರಂಭ; ಜೋಗ ಜಲಪಾತ ಭಾರತದ ಅತಿ ಎತ್ತರದ ಜಲಪಾತಗಳಲ್ಲಿ ಒಂದು (ಶಿವಮೊಗ್ಗ); ಸೇಂಟ್ ಮೇರೀಸ್ ದ್ವೀಪ (ತೋನ್ಸೆಪಾರ್); ಹಂಪೆ, ಪಟ್ಟದಕಲ್ಲು ವಿಶ್ವ ಪರಂಪರೆ ತಾಣಗಳು.`,
ab:[
[`ಭಾರತದ ನಕ್ಷೆ ಮತ್ತು ಕರ್ನಾಟಕ`,[
[`ಭಾರತದ ನಕ್ಷೆಯಲ್ಲಿ ಕರ್ನಾಟಕವಿರುವ ದಿಕ್ಕು`,`ದಕ್ಷಿಣ.`],
[`ರಮೇಶ ಬರೆದ ನೆರೆಯ ರಾಜ್ಯಗಳ ದಿಕ್ಕುಗಳಲ್ಲಿ ತಪ್ಪುಗಳನ್ನು ಸರಿಪಡಿಸು: ಪೂರ್ವ – ಮಹಾರಾಷ್ಟ್ರ`,`ಪೂರ್ವ – ಆಂಧ್ರ ಪ್ರದೇಶ ಮತ್ತು ತೆಲಂಗಾಣ. (ಮಹಾರಾಷ್ಟ್ರ ಉತ್ತರಕ್ಕಿದೆ.)`],
[`ಪಶ್ಚಿಮ – ಆಂಧ್ರ ಪ್ರದೇಶ ಮತ್ತು ತೆಲಂಗಾಣ`,`ಪಶ್ಚಿಮ – ಗೋವ ಮತ್ತು ಅರಬ್ಬೀ ಸಮುದ್ರ. (ಆಂಧ್ರ ಪ್ರದೇಶ–ತೆಲಂಗಾಣ ಪೂರ್ವಕ್ಕಿವೆ.)`],
[`ದಕ್ಷಿಣ – ಕೇರಳ ಮತ್ತು ತಮಿಳುನಾಡು`,`ಸರಿಯಾಗಿದೆ.`],
[`ಉತ್ತರ – ಗೋವ`,`ಉತ್ತರ – ಮಹಾರಾಷ್ಟ್ರ. (ಗೋವ ಪಶ್ಚಿಮಕ್ಕಿದೆ.)`],
[`ಕರ್ನಾಟಕದಲ್ಲಿ ಒಟ್ಟು ಎಷ್ಟು ಜಿಲ್ಲೆಗಳಿವೆ?`,`31 ಜಿಲ್ಲೆಗಳು. ⚠ ಪಠ್ಯಪುಸ್ತಕದಲ್ಲಿ 'ಮೂವತ್ತೊಂದು' ಎಂದಿದೆ.`]]],
[`ಸ್ವಾಭಾವಿಕ ವಿಭಾಗಗಳು`,[
[`ಕರ್ನಾಟಕದ ನಾಲ್ಕು ಸ್ವಾಭಾವಿಕ ವಿಭಾಗಗಳು`,`ಪಶ್ಚಿಮದ ತೀರಪ್ರದೇಶ (ಕರಾವಳಿ), ಮಲೆನಾಡು ಪ್ರದೇಶ, ಉತ್ತರದ ಮೈದಾನ ಪ್ರದೇಶ, ದಕ್ಷಿಣದ ಮೈದಾನ ಪ್ರದೇಶ.`],
[`ಪಶ್ಚಿಮ ತೀರಪ್ರದೇಶದ ಇನ್ನೊಂದು ಹೆಸರೇನು?`,`ಕರಾವಳಿ (ಕೊಂಕಣ ತೀರ). ⚠ ಪಠ್ಯಪುಸ್ತಕದ ಚಿತ್ರ ಪರಿಶೀಲಿಸಿ.`],
[`ಪಶ್ಚಿಮ ತೀರಪ್ರದೇಶದ ಜನರ ಪ್ರಮುಖ ಕಸುಬು`,`ಮೀನುಗಾರಿಕೆ.`],
[`ಹೊಂದಿಸು: ಕಾಡುಕೋಳಿ, ಶಾರ್ಕ್, ಅಡಿಕೆ, ಕಬ್ಬಿಣ, ಕಾರವಾರ`,`ಕಾಡುಕೋಳಿ – ಪಕ್ಷಿ; ಶಾರ್ಕ್ – ಸಮುದ್ರಜೀವಿ; ಅಡಿಕೆ – ಬೆಳೆ; ಕಬ್ಬಿಣ – ಖನಿಜ; ಕಾರವಾರ – ಮುಖ್ಯ ನಗರ.`],
[`ಹೊಂದಿಸು: ಸಹ್ಯಾದ್ರಿ, ಮ್ಯಾಂಗನೀಸ್, ಶ್ರೀಗಂಧ, ಕಾಡುಪಾಪ`,`ಸಹ್ಯಾದ್ರಿ – ಬೆಟ್ಟಗಳ ಸಾಲು; ಮ್ಯಾಂಗನೀಸ್ – ಖನಿಜ; ಶ್ರೀಗಂಧ – ರಾಜ್ಯ ವೃಕ್ಷ; ಕಾಡುಪಾಪ – ಅಪರೂಪದ ಪ್ರಾಣಿ.`],
[`ಉತ್ತರ ಮೈದಾನ ಪ್ರದೇಶದ ಜನರ ಮುಖ್ಯ ಕಸುಬು`,`ಕೃಷಿ.`],
[`ಉತ್ತರ ಮೈದಾನ ಪ್ರದೇಶದ ಮುಖ್ಯ ಖನಿಜಗಳು`,`ತಾಮ್ರ, ಸುಣ್ಣದ ಶಿಲೆ, ಕಬ್ಬಿಣ, ಚಿನ್ನ.`],
[`ಉತ್ತರ ಮೈದಾನ ಪ್ರದೇಶದ ಮುಖ್ಯ ಬೆಳೆಗಳು`,`ಗೋಧಿ, ಜೋಳ, ತಂಬಾಕು, ಹತ್ತಿ, ಕಬ್ಬು.`],
[`ದಕ್ಷಿಣ ಮೈದಾನ ಪ್ರದೇಶ – ತಪ್ಪಾದ ಹೇಳಿಕೆ ಸರಿಪಡಿಸು: 'ದಕ್ಷಿಣದ ಬಯಲು ಪ್ರದೇಶವು ಸಮತಟ್ಟಾಗಿದೆ.'`,`ತಪ್ಪು. ಸರಿ: ದಕ್ಷಿಣದ ಮೈದಾನ ಪ್ರದೇಶವು ಏರುತಗ್ಗುಗಳಿಂದ ಕೂಡಿದೆ. ⚠ ಪಠ್ಯಪುಸ್ತಕದೊಂದಿಗೆ ಪರಿಶೀಲಿಸಿ.`],
[`'ಇಲ್ಲಿನ ಪ್ರಮುಖ ಪ್ರಾಣಿ ತೋಳ.'`,`ಸರಿ.`],
[`'ಮೀನುಗಾರಿಕೆ ಇಲ್ಲಿಯ ಜನರ ಮುಖ್ಯ ಕಸುಬು.'`,`ತಪ್ಪು. ಸರಿ: ಕೃಷಿ ಮತ್ತು ಪಶುಪಾಲನೆ.`],
[`'ಅಭ್ರಕ ಈ ಪ್ರದೇಶದಲ್ಲಿ ದೊರೆಯುವ ಒಂದು ಮುಖ್ಯ ಖನಿಜ.'`,`ಸರಿ.`]]],
[`ನದಿಗಳು ಮತ್ತು ಪ್ರೇಕ್ಷಣೀಯ ಸ್ಥಳಗಳು`,[
[`ಪಶ್ಚಿಮಾಭಿಮುಖವಾಗಿ ಹರಿಯುವ ನದಿಗಳು`,`ಶರಾವತಿ, ಕಾಳಿ, ಅಘನಾಶಿನಿ, ನೇತ್ರಾವತಿ.`],
[`ಪೂರ್ವಾಭಿಮುಖವಾಗಿ ಹರಿಯುವ ನದಿಗಳು`,`ಕೃಷ್ಣಾ, ಘಟಪ್ರಭಾ, ಮಲಪ್ರಭಾ, ಭೀಮಾ, ತುಂಗಭದ್ರಾ, ಕಾವೇರಿ, ಹೇಮಾವತಿ, ಕಪಿಲಾ.`],
[`ಕರ್ನಾಟಕದ ರಾಜಧಾನಿ ಯಾವುದು? ಅದರ ಪ್ರಮುಖ ಆಕರ್ಷಣೆಗಳು`,`ಬೆಂಗಳೂರು – ವಿಧಾನಸೌಧ, ವಿಕಾಸಸೌಧ, ಹೈಕೋರ್ಟ್, ವಿಶ್ವೇಶ್ವರಯ್ಯ ಕೈಗಾರಿಕಾ ಮತ್ತು ತಾಂತ್ರಿಕ ಸಂಗ್ರಹಾಲಯ, ವೆಂಕಟಪ್ಪ ಕಲಾ ಶಾಲೆ, ಟಿಪ್ಪುವಿನ ಬೇಸಿಗೆ ಅರಮನೆ, ಜವಾಹರಲಾಲ್ ನೆಹರೂ ತಾರಾಲಯ, ಲಾಲ್‌ಬಾಗ್, ಕಬ್ಬನ್‌ಪಾರ್ಕ್.`],
[`ಮೈಸೂರಿನ ಪ್ರಸಿದ್ಧ ಸ್ಥಳಗಳು`,`ಅರಮನೆ, ಚಾಮುಂಡಿ ಬೆಟ್ಟ, ಮೃಗಾಲಯ; ದಸರಾ ಉತ್ಸವ ಜಗದ್ವಿಖ್ಯಾತ.`],
[`ಹಂಪೆ ಯಾವ ಜಿಲ್ಲೆಯಲ್ಲಿದೆ? ಅದರ ವಿಶೇಷವೇನು?`,`ವಿಜಯನಗರ ಜಿಲ್ಲೆ (ಹಿಂದಿನ ವಿಜಯನಗರ ಸಾಮ್ರಾಜ್ಯದ ರಾಜಧಾನಿ). ಕಲ್ಲಿನ ರಥ, ವಿರೂಪಾಕ್ಷ ದೇವಾಲಯ, ಕಮಲ ಮಹಲ್, ಹಜಾರ ರಾಮಸ್ವಾಮಿ ದೇವಾಲಯ; ಶಿಲ್ಪಕಲೆ ವಿಶ್ವ ಪ್ರಸಿದ್ಧ.`],
[`ಹೊಂದಿಸು: ಹಳೇಬೀಡು, ಬಾದಾಮಿ, ಗೋಲಗುಂಬಜ್, ಕಲ್ಲಿನಕೋಟೆ, ಸುಲ್ತಾನ ಬತ್ತೇರಿ`,`ಹಳೇಬೀಡು – ಹಾಸನ; ಬಾದಾಮಿ – ಬಾಗಲಕೋಟೆ; ಗೋಲಗುಂಬಜ್ – ವಿಜಯಪುರ; ಕಲ್ಲಿನಕೋಟೆ – ಚಿತ್ರದುರ್ಗ; ಸುಲ್ತಾನ ಬತ್ತೇರಿ – ದಕ್ಷಿಣ ಕನ್ನಡ.`],
[`ನಿಸರ್ಗಧಾಮಗಳ ಉದಾಹರಣೆ`,`ಜಲಪಾತಗಳು – ಜೋಗ, ಗೋಕಾಕ್, ಶಿವನಸಮುದ್ರ; ಪಕ್ಷಿಧಾಮಗಳು – ರಂಗನತಿಟ್ಟು, ಕೊಕ್ಕರೆ ಬೆಳ್ಳೂರು; ಅಭಯಾರಣ್ಯಗಳು – ಬಂಡೀಪುರ, ನಾಗರಹೊಳೆ; ಕಡಲತೀರಗಳು – ಉಳ್ಳಾಲ, ಮಂಗಳೂರು, ಮಲ್ಪೆ, ಕಾರವಾರ; ಗಿರಿಧಾಮಗಳು – ನಂದಿಬೆಟ್ಟ, ಬಾಬಾಬುಡನ್ ಗಿರಿ, ಮುಳ್ಳಯ್ಯನ ಗಿರಿ, ಕೆಮ್ಮಣ್ಣುಗುಂಡಿ, ಕುದುರೆಮುಖ, ಕೊಡಚಾದ್ರಿ.`],
[`ಸರಿ/ತಪ್ಪು: ಐತಿಹಾಸಿಕ ಸ್ಮಾರಕಗಳ ಮೇಲೆ ಕಲ್ಲಿನಿಂದ ಕೆತ್ತಿ ಹೆಸರು ಬರೆಯುವುದು.`,`ತಪ್ಪು.`],
[`ಸರಿ/ತಪ್ಪು: ಪಕ್ಷಿಧಾಮಗಳಲ್ಲಿ ನಿಶ್ಯಬ್ದವಾಗಿರುವುದು.`,`ಸರಿ.`],

G(`ಹೊಂದಿಸಿ ಬರೆ: ಜೋಗ, ಬಂಡೀಪುರ, ರಂಗನತಿಟ್ಟು – (ಜಲಪಾತ, ಅಭಯಾರಣ್ಯ, ಪಕ್ಷಿಧಾಮ).`,`ಜೋಗ – ಜಲಪಾತ; ಬಂಡೀಪುರ – ಅಭಯಾರಣ್ಯ; ರಂಗನತಿಟ್ಟು – ಪಕ್ಷಿಧಾಮ`,'m'),

L(`ಕರ್ನಾಟಕದ ಮಲೆನಾಡು ಪ್ರದೇಶದ ಬಗ್ಗೆ ಬರೆ.`,`ಮಲೆನಾಡು ಪ್ರದೇಶವು ಪಶ್ಚಿಮ ಘಟ್ಟ (ಸಹ್ಯಾದ್ರಿ) ಗಳಿಂದ ಕೂಡಿದ್ದು ಹೆಚ್ಚು ಮಳೆ ಬೀಳುತ್ತದೆ. ಮಡಿಕೇರಿ, ಚಿಕ್ಕಮಗಳೂರು, ಶಿವಮೊಗ್ಗ, ಹಾಸನ, ಬೆಳಗಾವಿ ಇಲ್ಲಿನ ಪ್ರಮುಖ ನಗರಗಳು. ಭತ್ತ, ತೆಂಗು, ಅಡಿಕೆ, ಕಾಫಿ, ಏಲಕ್ಕಿ, ಕಾಳುಮೆಣಸು ಇಲ್ಲಿಯ ಮುಖ್ಯ ಬೆಳೆಗಳು. ಹುಲಿ, ಆನೆ, ಕಾಡೆಮ್ಮೆ, ಜಿಂಕೆ ಹಾಗೂ ಅಪರೂಪದ ಕಾಡುಪಾಪ ಇಲ್ಲಿ ಕಂಡುಬರುತ್ತವೆ. ಕಬ್ಬಿಣದ ಅದಿರು ಮತ್ತು ಮ್ಯಾಂಗನೀಸ್ ಪ್ರಮುಖ ಖನಿಜಗಳು.`),
