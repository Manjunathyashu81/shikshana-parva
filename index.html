[`ಹರಿಯು ಕೊಠಡಿಯೊಳಗೆ ಹೋದಾಗ ಉಂಟಾದ ಆಶ್ಚರ್ಯವೇನು?`,`ಕೊಠಡಿಯೊಳಗೆ ಹುಡುಗಿ ಇರಲಿಲ್ಲ. ಬದಲಿಗೆ ಚಿನ್ನ ಬೆಳ್ಳಿ ದಾರಗಳನ್ನು ಕೂಡಿಸಿ ಕೊಕ್ಕರೆಯೊಂದು ಪೀತಾಂಬರವನ್ನು ನೇಯುತ್ತಿತ್ತು. ಅದು ತಾನು ಕಾಪಾಡಿದ ಹಕ್ಕಿ ಎಂಬುದರಲ್ಲಿ ಹರಿಗೆ ಸಂಶಯವಿರಲಿಲ್ಲ.`]]],
[`ಇ. ಈ ಮಾತುಗಳ ಸಂದರ್ಭವನ್ನು ವಿವರಿಸಿರಿ`,[
[`"ನಮ್ಮ ಮಗಳ ಹಾಗೆ ನೋಡ್ಕೋತೇವೆ."`,`ತಂದೆ–ತಾಯಿ ಇಲ್ಲದ ಹುಡುಗಿಯೊಬ್ಬಳು ಚಿಕ್ಕಪ್ಪನನ್ನು ಹುಡುಕಿಕೊಂಡು ಬಂದು ರಾತ್ರಿ ಉಳಿಯಲು ಜಾಗ ಕೇಳಿದಳು. ಅವಳು ಮನೆ ಗುಡಿಸಿ, ಸಾರಿಸಿ, ಅಡುಗೆ ಮಾಡಿದಳು. ಇದರಿಂದ ಸಂತೋಷಗೊಂಡ ಹರಿಯ ವೃದ್ಧ ತಂದೆ–ತಾಯಿಗಳು ಮರುದಿನ ಅವಳಿಗೆ ಹೇಳಿದ ಮಾತು ಇದು.`],
[`"ಶ್ರೀಮಂತ ವರ್ತಕರಿಗೆ ಮಾರಿ ಬನ್ನಿ."`,`ಮೂರು ದಿನಗಳ ನಂತರ ಹುಡುಗಿ ಕೊಠಡಿಯಿಂದ ಹೊರಬಂದಾಗ ಅವಳ ಕೈಯಲ್ಲಿ ಪೀತಾಂಬರವಿತ್ತು. ಅದನ್ನು ಹರಿಗೆ ಕೊಟ್ಟು ಶ್ರೀಮಂತ ವರ್ತಕರಿಗೆ ಮಾರಿ ಬರಲು ಹೇಳಿದಳು.`],
[`"ನಾನು ನೀನು ಕಾಪಾಡಿದ ಕೊಕ್ಕರೆಯೇ!"`,`ಹರಿ ಕೊಠಡಿಯೊಳಗೆ ಇಣುಕಿದಾಗ ಕೊಕ್ಕರೆ ಪೀತಾಂಬರ ನೇಯುತ್ತಿತ್ತು. "ನಾನು ಬೇಡ ಎಂದರೂ ನೀನ್ಯಾಕೆ ಒಳಗೆ ಬಂದೆ?" ಎಂದು ಅದು ಕೇಳಿತು. ಆಗ ಹರಿಗೆ ತಲೆತಗ್ಗಿಸಿ ನಿಂತಾಗ ಕೊಕ್ಕರೆ ತಾನೇ ಹುಡುಗಿಯಾಗಿ ಬಂದಿದ್ದೆನೆಂದು ಹೇಳಿದ ಮಾತು.`]]],
[`ವ್ಯಾಕರಣ ಮಾಹಿತಿ – ಸರ್ವನಾಮಗಳು`,[
[`ಸರ್ವನಾಮ ಎಂದರೇನು?`,`ನಾಮಪದಗಳ ಬದಲಾಗಿ ಬಳಸುವ ಪದಗಳನ್ನು ಸರ್ವನಾಮಗಳು ಎನ್ನುತ್ತಾರೆ. ಉದಾ: ಅವಳು, ಆತನು, ಅದು, ಇವರು.`],
[`ಸರ್ವನಾಮಗಳಿಗೆ ಉದಾಹರಣೆ ಕೊಡಿ`,`ಅದು, ಇದು, ಅವಳು, ಇವನು, ನಾನು, ನೀನು, ನೀವು, ನಾವು, ತಾವು, ಅವರು, ಇವರು.`],
[`"ಪುಟ್ಟಿಗೆ ರೆಕ್ಕೆಗಳು ಬಂದವು; ಅವಳು ಮೇಲಕ್ಕೆ ಹಾರಿದಳು." – ಸರ್ವನಾಮ ಯಾವುದು?`,`ಅವಳು (ಇದು 'ಪುಟ್ಟಿ' ಎಂಬ ನಾಮಪದದ ಬದಲಾಗಿ ಬಂದಿದೆ).`]]],
[`ವ್ಯಾಕರಣ ಮಾಹಿತಿ – ತತ್ಸಮ–ತದ್ಭವ`,[
[`ತತ್ಸಮ ಎಂದರೇನು?`,`ಸಂಸ್ಕೃತ ಶಬ್ದಗಳನ್ನು ಕನ್ನಡದಲ್ಲಿ ಯಥಾವತ್ತಾಗಿ ಬಳಸುವ ಶಬ್ದಗಳು. (ತತ್ + ಸಮ = ಅದಕ್ಕೆ ಸಮಾನವಾದುದು.) ಉದಾ: ಶ್ರೀ, ಸೂರ್ಯ, ತ್ಯಾಗ, ವಿಜ್ಞಾನ, ಪುಸ್ತಕ, ಸರಸ್ವತಿ.`],
[`ತದ್ಭವ ಎಂದರೇನು?`,`ಸಂಸ್ಕೃತದಿಂದ ಕನ್ನಡಕ್ಕೆ ಬರುವಾಗ ಅಲ್ಪಸ್ವಲ್ಪ ಅಥವಾ ಪೂರ್ಣವಾಗಿ ಬದಲಾವಣೆ ಹೊಂದಿ ಬರುವ ಪದಗಳು. ಉದಾ: ಸಜ್ಜೆ, ಲಕುಮಿ, ಹದಿಬದೆ, ಸಿರಿ, ಚಾಗ, ಹೊತ್ತಗೆ.`],
[`ತತ್ಸಮ–ತದ್ಭವ ಜೋಡಿಗಳನ್ನು ಬರೆಯಿರಿ`,`ಆರ್ಯ – ಅಜ್ಜ; ಕಾರ್ಯ – ಕಜ್ಜ; ಚಂದ್ರ – ಚಂದಿರ; ವಿಜ್ಞಾನ – ಬಿನ್ನಣ; ನಿತ್ಯ – ನಿಚ್ಚ; ಪದ್ಮ – ಪದುಮ; ಭಕ್ತಿ – ಬಕುತಿ; ವೀಥಿ – ಬೀದಿ.`]]]
],
qb:[
M(`ಹರಿಯ ಸ್ವಭಾವ ಹೇಗಿತ್ತು?`,[`ಕೋಪಿಷ್ಠ`,`ಸದ್ಗುಣವುಳ್ಳ ಕರುಣಾಳು`,`ಸೋಮಾರಿ`,`ದುರಾಸೆ`],1),
M(`ಹರಿ ಕೊಕ್ಕರೆಯ ಮೈಯಿಂದ ಹೊರತೆಗೆದದ್ದು:`,[`ಮುಳ್ಳು`,`ಬಾಣ`,`ಕಲ್ಲು`,`ದಾರ`],1),
M(`ಹರಿ ಕೊಕ್ಕರೆಯ ಗಾಯಕ್ಕೆ ಹಾಕಿದ್ದು:`,[`ರಸಮೂಲಿಕೆ`,`ಎಣ್ಣೆ`,`ನೀರು`,`ಮಣ್ಣು`],0),
M(`'ಪೀತಾಂಬರ' ಪದದ ಅರ್ಥ:`,[`ರೇಷ್ಮೆಬಟ್ಟೆ`,`ಕಂಬಳಿ`,`ಕತ್ತಿ`,`ಹಣ`],0),
M(`'ಕ್ಷಾಮ' ಪದದ ಅರ್ಥ:`,[`ಮಳೆ`,`ಬರಗಾಲ`,`ಹಬ್ಬ`,`ಬೆಳೆ`],1),
M(`ಇವುಗಳಲ್ಲಿ ತತ್ಸಮ ಪದ ಯಾವುದು?`,[`ಸಿರಿ`,`ಚಾಗ`,`ಸೂರ್ಯ`,`ಲಕುಮಿ`],2,'m'),
O(`ಹರಿಯ ಮನೆಯಲ್ಲಿ ಯಾರು ಯಾರಿದ್ದರು?`,`ಬಡ ರೈತ ದಂಪತಿಗಳು (ಹರಿಯ ವೃದ್ಧ ತಂದೆ–ತಾಯಿ).`),
O(`ಕೊಕ್ಕರೆ ಎಲ್ಲಿ ಬಿದ್ದಿತ್ತು?`,`ಕೊಳದ ಬಳಿ ಹುಲ್ಲಿನ ಮೇಲೆ.`),
O(`ಹುಡುಗಿ ಯಾರನ್ನು ಹುಡುಕಿಕೊಂಡು ಹೊರಟಿದ್ದೇನೆ ಎಂದು ಹೇಳಿದಳು?`,`ತನ್ನ ಚಿಕ್ಕಪ್ಪನನ್ನು.`),
O(`ಪೀತಾಂಬರಕ್ಕೆ ಹರಿಗೆ ಎಷ್ಟು ವರಹಗಳು ಸಿಕ್ಕಿದವು?`,`ನೂರಾರು ವರಹಗಳು.`),
O(`ಹುಡುಗಿ ಮೊದಲ ಬಾರಿ ಎಷ್ಟು ದಿನ ಕೊಠಡಿಯಲ್ಲಿ ಬಾಗಿಲು ಹಾಕಿಕೊಂಡಿದ್ದಳು?`,`ಮೂರು ದಿನ.`),
O(`ಈ ಪಾಠದ ಲೇಖಕರು ಯಾರು?`,`ಡಾ. ಅನುಪಮಾ ನಿರಂಜನ.`),
G(`'ಕ್ಷಾಮ' ಪದಕ್ಕೆ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಬರಗಾಲ`,'e'),
G(`'ನೆರವು' ಪದದ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಸಹಾಯ`,'e'),
G(`'ಭಕ್ತಿ' ಪದದ ತದ್ಭವ ರೂಪ ಬರೆಯಿರಿ.`,`ಬಕುತಿ`),
G(`'ಬೀದಿ' ಪದದ ತತ್ಸಮ ರೂಪ ಬರೆಯಿರಿ.`,`ವೀಥಿ`),
G(`ಸರ್ವನಾಮ ಗುರುತಿಸಿ: "ಶಂತನು ಒಬ್ಬ ರಾಜ; ಆತನು ಬೇಟೆಗೆ ಹೋಗುತ್ತಿದ್ದನು."`,`ಆತನು`),
G(`ಗುಂಪಿಗೆ ಸೇರದ ಪದ ಗುರುತಿಸಿ: ನಾನು, ನೀನು, ಅವಳು, ರೈತ`,`ರೈತ (ಉಳಿದವು ಸರ್ವನಾಮಗಳು)`),
S(`ಹರಿಯು ಕೊಕ್ಕರೆಯನ್ನು ಹೇಗೆ ಉಪಚರಿಸಿದನು?`,`ಹರಿಯು ಕೊಳದ ಬಳಿ ಬಿದ್ದಿದ್ದ ಕೊಕ್ಕರೆಯ ಮೈಯೊಳಗೆ ಚುಚ್ಚಿದ್ದ ಬಾಣವನ್ನು ಮೆಲ್ಲನೆ ಹೊರತೆಗೆದನು. ಗಾಯಕ್ಕೆ ತನಗೆ ತಿಳಿದ ರಸಮೂಲಿಕೆಯನ್ನು ಹಾಕಿದನು. ಕೊಕ್ಕರೆಯ ನೋವು ಕಡಿಮೆಯಾಗಿ ಅದು ಮೂರು ಬಾರಿ ತಲೆಬಾಗಿ ನಮಸ್ಕರಿಸಿ ಹೊರಟುಹೋಯಿತು.`),
S(`ವೃದ್ಧ ದಂಪತಿಗಳು ಹುಡುಗಿಗೆ ಏನು ಹೇಳಿದರು? ಏಕೆ?`,`ಹುಡುಗಿ ಮನೆ ಗುಡಿಸಿ, ಸಾರಿಸಿ ಚೊಕ್ಕಟ ಮಾಡಿ, ರಾತ್ರಿಯ ಅಡುಗೆಯನ್ನೂ ಮಾಡಿದಳು. ಇದರಿಂದ ಸಂತೋಷಗೊಂಡ ವೃದ್ಧ ದಂಪತಿಗಳು "ಹುಡುಗಿ, ನೀನು ನಮ್ಮಲ್ಲೇ ಇದ್ದುಬಿಡು, ನಮ್ಮ ಮಗಳ ಹಾಗೆ ನೋಡ್ಕೋತೇವೆ" ಎಂದು ಹೇಳಿದರು.`),
S(`ಸರ್ವನಾಮ ಎಂದರೇನು? ಉದಾಹರಣೆ ಕೊಡಿ.`,`ನಾಮಪದಗಳನ್ನು ಪದೇಪದೇ ಬಳಸುವುದರ ಬದಲು ಅವುಗಳ ಸ್ಥಾನದಲ್ಲಿ ಬಳಸುವ ಪದಗಳು ಸರ್ವನಾಮಗಳು. ಉದಾ: ಅದು, ಇದು, ಅವಳು, ಇವನು, ನಾನು, ನೀನು, ಅವರು, ಇವರು. "ಗುರುಗಳು ಶಾಲೆಗೆ ಹೊರಟರು. ಅವರು ಕೈಯಲ್ಲಿ ಪುಸ್ತಕ ಹಿಡಿದಿದ್ದರು" – ಇಲ್ಲಿ 'ಅವರು' ಸರ್ವನಾಮ.`),
S(`ತತ್ಸಮ ಮತ್ತು ತದ್ಭವ ಪದಗಳ ವ್ಯತ್ಯಾಸವನ್ನು ಬರೆಯಿರಿ.`,`ಸಂಸ್ಕೃತ ಶಬ್ದಗಳನ್ನು ಕನ್ನಡದಲ್ಲಿ ಯಥಾವತ್ತಾಗಿ ಬಳಸಿದರೆ ಅವು ತತ್ಸಮಗಳು (ಉದಾ: ಸೂರ್ಯ, ಪುಸ್ತಕ). ಸಂಸ್ಕೃತದಿಂದ ಕನ್ನಡಕ್ಕೆ ಬರುವಾಗ ಅಲ್ಪಸ್ವಲ್ಪ ಅಥವಾ ಪೂರ್ಣ ಬದಲಾವಣೆ ಹೊಂದಿದರೆ ಅವು ತದ್ಭವಗಳು (ಉದಾ: ಸಿರಿ, ಲಕುಮಿ).`),
L(`ಹರಿಯು ಕೊಕ್ಕರೆಯನ್ನು ಕಾಪಾಡಿದ ಮತ್ತು ಕೊಕ್ಕರೆ ಕೃತಜ್ಞತೆ ತೋರಿದ ಕಥೆಯನ್ನು ನಿಮ್ಮ ಮಾತುಗಳಲ್ಲಿ ಬರೆಯಿರಿ.`,`ಹರಿ ಎಂಬ ಕರುಣಾಳು ಹುಡುಗನು ಕೊಳದ ಬಳಿ ಗಾಯಗೊಂಡು ಬಿದ್ದಿದ್ದ ಕೊಕ್ಕರೆಯ ಮೈಯಿಂದ ಬಾಣ ತೆಗೆದು ರಸಮೂಲಿಕೆ ಹಾಕಿ ಉಪಚರಿಸಿದನು. ಕೆಲವು ದಿನಗಳ ನಂತರ ಸುಂದರ ಹುಡುಗಿಯೊಬ್ಬಳು ಬಂದು ಹರಿಯ ಮನೆಯಲ್ಲಿ ಆಶ್ರಯ ಪಡೆದಳು. ಬರಗಾಲ ಬಂದಾಗ ಅವಳು ಮೂರು ದಿನ ಕೊಠಡಿಯಲ್ಲಿದ್ದು ಪೀತಾಂಬರ ನೇಯ್ದು ಕೊಟ್ಟಳು. ಅದನ್ನು ಮಾರಿ ಹರಿಗೆ ನೂರಾರು ವರಹಗಳು ಸಿಕ್ಕವು. ಮರುವರ್ಷ ಮತ್ತೆ ನೇಯುವಾಗ ಹರಿ ಕದ್ದು ನೋಡಿದನು. ಒಳಗಿದ್ದದ್ದು ಕೊಕ್ಕರೆ! ಅದು "ನಿನಗೆ ಉಪಕಾರ ಮಾಡಲು ಹುಡುಗಿಯಾಗಿ ಬಂದೆ; ನೀನು ಮಾತಿಗೆ ತಪ್ಪಿದ್ದರಿಂದ ಇನ್ನು ಹುಡುಗಿಯಾಗಲಾರೆ" ಎಂದು ಹೇಳಿ ಹಾರಿಹೋಯಿತು. ಹರಿ ತಲೆತಗ್ಗಿಸಿ ನಿಂತನು.`),
L(`ಈ ಕಥೆಯಿಂದ ನಾವು ಕಲಿಯುವ ನೀತಿಯನ್ನು ವಿವರಿಸಿ.`,`ಪರೋಪಕಾರ, ಕರುಣೆ, ಪ್ರೀತಿ, ಸಹಕಾರದಿಂದ ಬದುಕಿದರೆ ಬದುಕು ಅರ್ಥಪೂರ್ಣವಾಗುತ್ತದೆ. ನಿಸ್ವಾರ್ಥತೆಯಿಂದ ಬದುಕಿದರೆ ನಮ್ಮ ಬದುಕು ಹಸನಾಗುತ್ತದೆ; ನಮ್ಮ ಒಳ್ಳೆಯತನ ನಮ್ಮನ್ನು ಕಾಪಾಡುತ್ತದೆ. ಹರಿಯು ಕೊಕ್ಕರೆಗೆ ಸಹಾಯ ಮಾಡಿದ್ದರಿಂದ ಕೊಕ್ಕರೆಯೂ ಅವನಿಗೆ ನೆರವಾಯಿತು. ಆದರೆ ಕೊಟ್ಟ ಮಾತಿಗೆ ತಪ್ಪಬಾರದು, ಕುತೂಹಲ/ದುರಾಸೆ ಬೇಡ ಎಂಬ ಪಾಠವೂ ಇದರಲ್ಲಿದೆ.`)
]});

LS6.push({n:2,t:`ಸಿದ್ಧಾರೂಢರ ಜಾತ್ರೆ (ಗದ್ಯ 6)`,au:`ಸಮಿತಿ ರಚನೆ`,pg:6,
words:`ಐಹಿಕ – ಪ್ರಾಪಂಚಿಕ; ಸಂನ್ಯಾಸ – ಸಾಂಸಾರಿಕ ಬಂಧಗಳನ್ನು ಕಳಚಿಕೊಂಡ ಸ್ಥಿತಿ; ದೀಪಸ್ತಂಭ – ಸಮುದ್ರದಂಡೆಯಲ್ಲಿ ಕಟ್ಟಿದ ದೀಪ ಗೋಪುರ (ಹಡಗುಗಳಿಗೆ ಸೂಚನೆ ಕೊಡಲು ಸಹಕಾರಿ); ಉತ್ತತ್ತಿ – ಒಣ ಖರ್ಜೂರ; ಆವಾರ – ಆವರಣ; ತೇರು – ರಥ; ಜಮಾಯಿಸು – ಸೇರು; ಅರಿವೆ – ಬಟ್ಟೆ, ವಸ್ತ್ರ`,
notes:`ಧಾರವಾಡ ಜಿಲ್ಲೆಯ ಹುಬ್ಬಳ್ಳಿಯಲ್ಲಿರುವ ಸಿದ್ಧಾರೂಢ ಮಠದ ಜಾತ್ರೆ ಪ್ರತಿ ವರ್ಷ ಶಿವರಾತ್ರಿಯ ದಿನ ನಡೆಯುತ್ತದೆ. ಸಿದ್ಧಾರೂಢರು ಬೀದರ್ ಜಿಲ್ಲೆಯ ಚಳಕಾಪುರದವರು; 1836ರಲ್ಲಿ ಜನಿಸಿದರು; 41ನೆಯ ವಯಸ್ಸಿನಲ್ಲಿ ಹುಬ್ಬಳ್ಳಿಯಲ್ಲಿ ನೆಲೆ ನಿಂತರು; "ಓಂ ನಮಃ ಶಿವಾಯ" ಪಂಚಾಕ್ಷರಿ ಮಂತ್ರವನ್ನು ಜಾತಿಭೇದವಿಲ್ಲದೆ ಬೋಧಿಸಿದರು. ಮಠವು ಸ್ವಾತಂತ್ರ್ಯ ಹೋರಾಟದ ಸಮಯದಲ್ಲಿ ಸಕ್ರಿಯವಾಗಿತ್ತು; ಗಾಂಧೀಜಿ, ತಿಲಕರಂತಹ ರಾಷ್ಟ್ರನಾಯಕರಿಗೆ ಸ್ಫೂರ್ತಿ ನೀಡಿತು. ಕೌಶಲ: ಆಲಿಸುವುದು. ವ್ಯಾಕರಣ: ಕರ್ತೃ, ಕರ್ಮ, ಕ್ರಿಯಾಪದ.`,
ab:[
[`ಅ. ಪದಗಳ ಅರ್ಥ ಬರೆಯಿರಿ`,[
[`ಹಿರೇಮಣಿ`,`ಮುಖ್ಯಸ್ಥ / ತರಗತಿಯ ನಾಯಕ (ಪಾಠದಲ್ಲಿ ಸದಾನಂದನು ತರಗತಿಯ ಹಿರೇಮಣಿ). ⚠ ಸೂಚಿತ`],
[`ಕರ್ಮಭೂಮಿ`,`ಕೆಲಸ ಮಾಡುವ ಸ್ಥಳ, ಕಾರ್ಯಕ್ಷೇತ್ರ (ಸಿದ್ಧಾರೂಢರು ಹುಬ್ಬಳ್ಳಿಯನ್ನು ತಮ್ಮ ಕರ್ಮಭೂಮಿಯನ್ನಾಗಿ ಆರಿಸಿಕೊಂಡರು). ⚠ ಸೂಚಿತ`],
[`ಪತಾಕೆ`,`ಧ್ವಜ, ಬಾವುಟ`],
[`ಜನಸ್ತೋಮ`,`ಜನರ ಗುಂಪು, ಜನಸಮೂಹ`]]],
[`ಆ. ವಾಕ್ಯಗಳನ್ನು ಸರಿಪಡಿಸಿ ಬರೆಯಿರಿ`,[
[`ಅಲ್ಲಿ ಜಾತ್ರೆ ದಿನ ಶಿವರಾತ್ರಿಯ ಕೂಡುತ್ತದೆ.`,`ಅಲ್ಲಿ ಶಿವರಾತ್ರಿಯ ದಿನ ಜಾತ್ರೆ ಕೂಡುತ್ತದೆ.`],
[`ಮಠದ ಮಂಟಪ ಮುಂದೆ ಹಾಕಿದ್ದರು ದೊಡ್ಡ.`,`ಮಠದ ಮುಂದೆ ದೊಡ್ಡ ಮಂಟಪ ಹಾಕಿದ್ದರು.`],
[`ಮಿಠಾಯಿಗಳನ್ನು ಶಾಲೆಯ ಕೊಂಡರು ಮಕ್ಕಳು.`,`ಶಾಲೆಯ ಮಕ್ಕಳು ಮಿಠಾಯಿಗಳನ್ನು ಕೊಂಡರು.`],
[`ಹೋರಾಟದ ಸಕ್ರಿಯವಾಗಿದ್ದ ಸ್ವಾತಂತ್ರ್ಯ ಮಠವಿದು ಸಮಯದಲ್ಲಿ.`,`ಸ್ವಾತಂತ್ರ್ಯ ಹೋರಾಟದ ಸಮಯದಲ್ಲಿ ಸಕ್ರಿಯವಾಗಿದ್ದ ಮಠವಿದು.`]]],
[`ಇ. ಪದಗಳನ್ನು ಬಳಸಿ ಸ್ವಂತ ವಾಕ್ಯ ರಚಿಸಿರಿ`,[
[`ಪ್ರೇರಣೆ`,`ಮಾದರಿ: ಗುರುಗಳ ಮಾತು ನನಗೆ ಓದಲು ಪ್ರೇರಣೆ ನೀಡಿತು.`],
[`ಕಷ್ಟಕಾರ್ಪಣ್ಯ`,`ಮಾದರಿ: ಬಡವರು ಅನೇಕ ಕಷ್ಟಕಾರ್ಪಣ್ಯಗಳನ್ನು ಎದುರಿಸುತ್ತಾರೆ.`],
[`ಹುರುಪು`,`ಮಾದರಿ: ಮಕ್ಕಳು ಹುರುಪಿನಿಂದ ಆಟವಾಡಿದರು.`],
[`ಸ್ವಯಂಸೇವಕ`,`ಮಾದರಿ: ಸ್ವಯಂಸೇವಕರು ಜಾತ್ರೆಯಲ್ಲಿ ಜನರಿಗೆ ಊಟ ಬಡಿಸಿದರು.`]]],
[`ಈ. ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರಿಸಿರಿ`,[
[`ಸಿದ್ಧಾರೂಢರ ಮಠವು ಯಾವ ಜಿಲ್ಲೆಯಲ್ಲಿ ಇದೆ?`,`ಸಿದ್ಧಾರೂಢರ ಮಠವು ಧಾರವಾಡ ಜಿಲ್ಲೆಯ ಹುಬ್ಬಳ್ಳಿಯಲ್ಲಿದೆ.`],
[`ಶಾಲೆಯ ಮಕ್ಕಳಿಗೆ ದಾರಿಯ ದಣಿವು ಏಕೆ ಆಗಲಿಲ್ಲ?`,`ಮಕ್ಕಳು ದಾರಿಯುದ್ದಕ್ಕೂ ಗುರುಗಳೊಂದಿಗೆ ಚರ್ಚೆ, ಸಂವಾದ ನಡೆಸುತ್ತಾ ಬಂದುದರಿಂದ ದಣಿವು ಆಗಲಿಲ್ಲ.`],
[`ಸಿದ್ಧಾರೂಢ ಸ್ವಾಮಿಗಳು ಮೂಲತಃ ಯಾವ ಊರಿನವರು?`,`ಬೀದರ್ ಜಿಲ್ಲೆಯ ಚಳಕಾಪುರದವರು.`],
[`ಸ್ವಾಮಿಗಳು ಯಾವ ಮಂತ್ರವನ್ನು ಜಾತಿಭೇದವಿಲ್ಲದೆ ಎಲ್ಲರಿಗೂ ಬೋಧಿಸಿದರು?`,`"ಓಂ ನಮಃ ಶಿವಾಯ" ಎಂಬ ಪಂಚಾಕ್ಷರಿ ಮಂತ್ರವನ್ನು.`],
[`ಮಠದಲ್ಲಿ ಶಾಲೆಯ ಮಕ್ಕಳು ಯಾವ ಕೆಲಸಗಳನ್ನು ಮಾಡಿದರು?`,`ಸ್ವಯಂಸೇವಕರಾಗಿ ನೀರು ತಂದುಕೊಟ್ಟರು, ಬಂದ ಜನರಿಗೆ ಊಟ ಬಡಿಸಿದರು.`],
[`ಶಾಲಾ ಮಕ್ಕಳು ಯಾವ ಆಟಗಳನ್ನು ಆಡಿದರು?`,`ತೊಟ್ಟಿಲ ಜೀಕ, ಕುದುರೆ, ಆನೆ, ಒಂಟೆ ಮೊದಲಾದ ತಿರುಗು ಯಂತ್ರಗಳಲ್ಲಿ ಕುಳಿತು ಆಟ ಆಡಿದರು.`],
[`ಸಿದ್ಧಾರೂಢರ ಮಠದಿಂದ ಸ್ಫೂರ್ತಿಯನ್ನು ಪಡೆದ ರಾಷ್ಟ್ರನಾಯಕರು ಯಾರು?`,`ಗಾಂಧೀಜಿ, ತಿಲಕ್ ಅಂತಹ ರಾಷ್ಟ್ರನಾಯಕರು.`]]],
[`ಉ. ಮೂರು–ನಾಲ್ಕು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರಿಸಿರಿ`,[
[`ಸಿದ್ಧಾರೂಢ ಸ್ವಾಮಿಗಳ ಜೀವನದ ಬಗ್ಗೆ ತಿಳಿಸಿ.`,`ಸಿದ್ಧಾರೂಢರು ಮಹಾನ್ ಸಂತರು. ಅವರು ಬೀದರ್ ಜಿಲ್ಲೆಯ ಚಳಕಾಪುರದಲ್ಲಿ 1836ರಲ್ಲಿ ಹುಟ್ಟಿದರು. ಚಿಕ್ಕಂದಿನಲ್ಲೇ ಐಹಿಕ ಸುಖಭೋಗಗಳಲ್ಲಿ ವಿರಕ್ತಿ ಬಂದು ಸಂನ್ಯಾಸ ಸ್ವೀಕರಿಸಿ ಲೋಕಸಂಚಾರಿಯಾದರು. 41ನೆಯ ವಯಸ್ಸಿನಲ್ಲಿ ಹುಬ್ಬಳ್ಳಿಯಲ್ಲಿ ನೆಲೆ ನಿಂತು ಅದನ್ನೇ ಕರ್ಮಭೂಮಿಯನ್ನಾಗಿ ಆರಿಸಿಕೊಂಡರು. ನಂಬಿ ಬಂದವರಿಗೆ ಅಭಯ ನೀಡಿ, "ಓಂ ನಮಃ ಶಿವಾಯ" ಮಂತ್ರವನ್ನು ಎಲ್ಲರಿಗೂ ಸಮಾನವಾಗಿ ಬೋಧಿಸಿದರು.`],
[`ಮಠವು ಸಮಾಜದಲ್ಲಿ ಹೇಗೆ ದಾರಿದೀಪವಾಗಿದೆ?`,`ಕಷ್ಟಕಾಲದಲ್ಲಿ ಜನರಿಗೆ ಭದ್ರತೆ, ಭರವಸೆ ಮೂಡಿಸುವ ಕೆಲಸವನ್ನು ಮಠಗಳು ಮಾಡುತ್ತವೆ. ಬಡವರಿಗೆ ಧನಸಹಾಯ, ವಿದ್ಯಾರ್ಥಿಗಳಿಗೆ ಊಟ–ವಸತಿ, ದಿಕ್ಕುತೋಚದವರಿಗೆ ಮಾನಸಿಕ ನೆಮ್ಮದಿ ನೀಡುವ ಉಪದೇಶ, ಧಾರ್ಮಿಕ ಕಾರ್ಯಕ್ರಮಗಳು, ಮಹಾಕಾವ್ಯ–ಪುರಾಣಗಳ ಪ್ರವಚನ ಇವುಗಳನ್ನು ನಡೆಸುತ್ತವೆ. ಹೀಗಾಗಿ ಮಠವು ಸಮಾಜವೆಂಬ ಸಮುದ್ರದ ಕಿನಾರೆಯಲ್ಲಿ ನಿಂತ ದೀಪಸ್ತಂಭದಂತಿದೆ.`],
[`ಸಿದ್ಧಾರೂಢ ಜಾತ್ರೆಯ ತೇರೆಳೆಯುವ ಸಂದರ್ಭವನ್ನು ವರ್ಣಿಸಿ.`,`ಮಠದ ಮುಂದೆ ದೊಡ್ಡ ಮಂಟಪ ಹಾಕಿ ತಳಿರುತೋರಣಗಳಿಂದ ಸಿಂಗರಿಸಿದ್ದರು. ಬಣ್ಣಬಣ್ಣದ ಅರಿವೆ ಸುತ್ತಿ, ಪತಾಕೆಗಳನ್ನು ಹಚ್ಚಿ ಸಿಂಗರಿಸಿದ ದೊಡ್ಡ ತೇರು ನಿಂತಿತ್ತು. ನಾಲ್ಕು ಗಂಟೆಗೆ ಜನರೆಲ್ಲ ತೇರು ನೋಡಲು ಸೇರಿದರು. ಎಲ್ಲರೂ "ಹರ ಹರ ಮಹಾದೇವ!" ಎಂದು ಭಕ್ತಿಯಿಂದ ಕೂಗುತ್ತ ತೇರನ್ನು ಎಳೆಯತೊಡಗಿದರು. ತೇರಿನ ಮೇಲೆ ಜನರು ಉತ್ತತ್ತಿ, ಬಾಳೆಹಣ್ಣುಗಳನ್ನು ಎಸೆಯುತ್ತಿದ್ದರು.`]]],
[`ಊ. ಜೋಡುನುಡಿಗಳನ್ನು ಗುರುತಿಸಿ ಬರೆಯಿರಿ`,[
[`ನಮ್ಮ ನೆರೆಹೊರೆಯವರು ಬಹಳ ಒಳ್ಳೆಯವರು.`,`ನೆರೆಹೊರೆ`],
[`ಅಮ್ಮ ರಾತ್ರಿಹಗಲು ಕೆಲಸ ಮಾಡುತ್ತಾಳೆ.`,`ರಾತ್ರಿಹಗಲು`],
[`ನಾಟಕದಲ್ಲಿ ವಿಧವಿಧವಾದ ಉಡುಗೆತೊಡುಗೆ ಧರಿಸುತ್ತಾರೆ.`,`ಉಡುಗೆತೊಡುಗೆ`]]],
[`ಋ. ಸರಿಹೊಂದುವ ಬಿಡಿ ಪದಗಳನ್ನು ಸೇರಿಸಿ ಜೋಡಿನುಡಿಗಳನ್ನು ರಚಿಸಿರಿ`,[
[`ಆಟ, ತಿಂಡಿ, ಹೊರಗೆ, ದಿಕ್ಕು, ತೀರ್ಥ, ಪಕ್ಕ, ದೆಸೆ, ಒಳಗೆ, ಅಕ್ಕ, ಕೊಳ್ಳ, ಪಾಠ, ಹಳ್ಳ`,`ಆಟ–ಪಾಠ, ತಿಂಡಿ–ತೀರ್ಥ, ಹೊರಗೆ–ಒಳಗೆ, ದಿಕ್ಕು–ದೆಸೆ, ಅಕ್ಕ–ಪಕ್ಕ, ಕೊಳ್ಳ–ಹಳ್ಳ`]]],
[`ವ್ಯಾಕರಣ ಮಾಹಿತಿ – ಕರ್ತೃ, ಕರ್ಮ, ಕ್ರಿಯಾಪದ (ಅ. ಪಟ್ಟಿ ಮಾಡಿ)`,[
[`ಸರಸ್ವತಿ ಶಾಲೆಗೆ ಹೋಗುತ್ತಾಳೆ.`,`ಕರ್ತೃಪದ: ಸರಸ್ವತಿ; ಕರ್ಮಪದ: ಶಾಲೆಗೆ; ಕ್ರಿಯಾಪದ: ಹೋಗುತ್ತಾಳೆ. ⚠ ಪಠ್ಯದ ಮಟ್ಟಿಗೆ 'ಶಾಲೆಗೆ' ಎಂಬುದನ್ನು ಕರ್ಮಪದವಾಗಿ ಪರಿಗಣಿಸಿ.`],
[`ಮಹಮ್ಮದನು ಮನೆಗೆ ಬರುತ್ತಾನೆ.`,`ಕರ್ತೃಪದ: ಮಹಮ್ಮದನು; ಕರ್ಮಪದ: ಮನೆಗೆ; ಕ್ರಿಯಾಪದ: ಬರುತ್ತಾನೆ.`],
[`ಗಿಳಿಗಳು ಆಕಾಶದಲ್ಲಿ ಹಾರಾಡುತ್ತವೆ.`,`ಕರ್ತೃಪದ: ಗಿಳಿಗಳು; ಕರ್ಮಪದ: ಆಕಾಶದಲ್ಲಿ; ಕ್ರಿಯಾಪದ: ಹಾರಾಡುತ್ತವೆ.`]]],
[`ವ್ಯಾಕರಣ ಮಾಹಿತಿ – (ಆ. ಕರ್ತೃ/ಕರ್ಮ/ಕ್ರಿಯಾಪದಗಳನ್ನು ಸರಿಯಾಗಿ ಜೋಡಿಸಿ ವಾಕ್ಯ ಬರೆಯಿರಿ)`,[
[`ಬೀಳುತ್ತದೆ ಕಾಯಿ ಮರದಿಂದ`,`ಕಾಯಿ ಮರದಿಂದ ಬೀಳುತ್ತದೆ.`],
[`ಅಹಿಂಸೆಯನ್ನು ಪ್ರತಿಪಾದಿಸಿದರು ಗಾಂಧೀಜಿ`,`ಗಾಂಧೀಜಿ ಅಹಿಂಸೆಯನ್ನು ಪ್ರತಿಪಾದಿಸಿದರು.`],
[`ಉದಯಿಸುತ್ತಾನೆ ಸೂರ್ಯನು ಮುಂಜಾನೆ`,`ಸೂರ್ಯನು ಮುಂಜಾನೆ ಉದಯಿಸುತ್ತಾನೆ.`]]],
[`ಚಟುವಟಿಕೆ (ಮಾರ್ಗದರ್ಶನ)`,[
[`ನಿಮ್ಮ ಊರಿನ ಜಾತ್ರೆಯ ವಿಶೇಷತೆಯನ್ನು ಕುರಿತು ಒಂದು ಪ್ರಬಂಧ ಬರೆಯಿರಿ; ಜಾತ್ರೆಯ ಚಿತ್ರಗಳನ್ನು ಸಂಗ್ರಹಿಸಿ.`,`ಮಕ್ಕಳು ತಮ್ಮ ಅನುಭವದ ಆಧಾರದಿಂದ ಬರೆಯುವ ಚಟುವಟಿಕೆ. ಪ್ರಬಂಧದಲ್ಲಿ ಪ್ರಸ್ತಾವನೆ → ಜಾತ್ರೆಯ ವಿವರ (ದಿನ, ಸ್ಥಳ, ಕಾರ್ಯಕ್ರಮ, ಅಂಗಡಿಗಳು, ಆಟಗಳು) → ಉಪಸಂಹಾರ ಎಂಬ ಕ್ರಮ ಅನುಸರಿಸಲು ಹೇಳಿ.`],
[`ಭಾಷಾ ಆಟ – ಕನ್ನಡ ವರ್ಣಮಾಲೆ ಚಾರ್ಟ್ ತಯಾರಿಕೆ`,`ಗುಂಪುಗಳಲ್ಲಿ 21×20 ಸೆಂ.ಮೀ. (A2–A3) ಬಿಳಿ ಹಾಳೆ ತೆಗೆದು, ಸುತ್ತ 1 ಸೆಂ.ಮೀ. ಗೆರೆ ಹಾಕಿ ಐದು ಭಾಗ ಮಾಡಿ (2, 6, 4, 14, 2 ಸೆಂ.ಮೀ.): ಭಾಗ 1 – 'ಕನ್ನಡ ವರ್ಣಮಾಲೆ'; ಭಾಗ 2 – ಸ್ವರಗಳು (13); ಭಾಗ 3 – ಯೋಗವಾಹಗಳು (2); ಭಾಗ 4 – ವ್ಯಂಜನಗಳು (ವರ್ಗೀಯ, ನಂತರ ಅವರ್ಗೀಯ); ಭಾಗ 5 – ಗುಂಪಿನ ಸದಸ್ಯರ ಹೆಸರು. ಪ್ರತಿ ಭಾಗದಲ್ಲಿ ಬೇರೆ ಬಣ್ಣದ ಪೆನ್ನು ಬಳಸಿ; ತರಗತಿಯಲ್ಲಿ ನೇತು ಹಾಕಿ ಪ್ರದರ್ಶಿಸಿ.`]]]
],
qb:[
M(`ಸಿದ್ಧಾರೂಢರ ಮಠ ಇರುವ ಊರು:`,[`ಹುಬ್ಬಳ್ಳಿ`,`ಬೆಂಗಳೂರು`,`ಮೈಸೂರು`,`ಬೀದರ್`],0),
M(`ಜಾತ್ರೆ ಕೂಡುವ ದಿನ:`,[`ಯುಗಾದಿ`,`ಶಿವರಾತ್ರಿ`,`ದೀಪಾವಳಿ`,`ಸಂಕ್ರಾಂತಿ`],1),
M(`ಸಿದ್ಧಾರೂಢರು ಮೂಲತಃ ಯಾವ ಜಿಲ್ಲೆಯ ಚಳಕಾಪುರದವರು?`,[`ಧಾರವಾಡ`,`ಬೀದರ್`,`ಬೆಳಗಾವಿ`,`ಮೈಸೂರು`],1),
M(`'ತೇರು' ಪದದ ಅರ್ಥ:`,[`ರಥ`,`ಬಟ್ಟೆ`,`ಧ್ವಜ`,`ಮಂಟಪ`],0),
M(`'ಅರಿವೆ' ಪದದ ಅರ್ಥ:`,[`ಹಣ್ಣು`,`ಬಟ್ಟೆ`,`ದೀಪ`,`ಮನೆ`],1),
M(`'ಉತ್ತತ್ತಿ' ಎಂದರೆ:`,[`ಒಣ ಖರ್ಜೂರ`,`ಬಾಳೆಹಣ್ಣು`,`ತೆಂಗಿನಕಾಯಿ`,`ಮಿಠಾಯಿ`],0,'m'),
O(`ಸಿದ್ಧಾರೂಢರ ಮಠವು ಯಾವ ಜಿಲ್ಲೆಯಲ್ಲಿದೆ?`,`ಧಾರವಾಡ ಜಿಲ್ಲೆ (ಹುಬ್ಬಳ್ಳಿ).`),
O(`ಸ್ವಾಮಿಗಳು ಬೋಧಿಸಿದ ಮಂತ್ರ ಯಾವುದು?`,`"ಓಂ ನಮಃ ಶಿವಾಯ" ಪಂಚಾಕ್ಷರಿ ಮಂತ್ರ.`),
O(`ಸಿದ್ಧಾರೂಢರು ಹುಟ್ಟಿದ ವರ್ಷ ಯಾವುದು?`,`1836.`),
O(`ಶಾಲೆಯ ಮಕ್ಕಳು ಜಾತ್ರೆಗೆ ಯಾರೊಂದಿಗೆ ಹೊರಟರು?`,`ಗುರುಗಳೊಂದಿಗೆ.`),
O(`ತರಗತಿಯ ಹಿರೇಮಣಿ ಯಾರು?`,`ಸದಾನಂದ.`),
O(`ಜಾತ್ರೆಯಲ್ಲಿ ಜನರು ಬಾಳೆಹಣ್ಣಿನ ಜೊತೆ ಏನನ್ನು ಎಸೆಯುತ್ತಿದ್ದರು?`,`ಉತ್ತತ್ತಿಗಳನ್ನು.`),
G(`'ತೇರು' ಪದದ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ರಥ`,'e'),
G(`'ಅರಿವೆ' ಪದದ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಬಟ್ಟೆ / ವಸ್ತ್ರ`,'e'),
G(`ಜೋಡುನುಡಿ ಗುರುತಿಸಿ: "ನಮ್ಮ ನೆರೆಹೊರೆಯವರು ಬಹಳ ಒಳ್ಳೆಯವರು."`,`ನೆರೆಹೊರೆ`),
G(`ಜೋಡುನುಡಿ ರಚಿಸಿ: ಆಟ – ?`,`ಆಟ–ಪಾಠ`),
G(`ಕರ್ತೃಪದ ಗುರುತಿಸಿ: "ಗಿಳಿಯು ಹಣ್ಣನ್ನು ತಿಂದಿತು."`,`ಗಿಳಿ`),
G(`ಕ್ರಿಯಾಪದ ಗುರುತಿಸಿ: "ಅಬ್ದುಲ್ಲನು ಪಾತ್ರೆಗಳನ್ನು ಮಾರಿದನು."`,`ಮಾರಿದನು`),
S(`ಸಿದ್ಧಾರೂಢರ ಜೀವನದ ಬಗ್ಗೆ ತಿಳಿಸಿ.`,`ಸಿದ್ಧಾರೂಢರು ಬೀದರ್ ಜಿಲ್ಲೆಯ ಚಳಕಾಪುರದಲ್ಲಿ 1836ರಲ್ಲಿ ಹುಟ್ಟಿದರು. ಚಿಕ್ಕಂದಿನಲ್ಲೇ ಸಂನ್ಯಾಸ ಸ್ವೀಕರಿಸಿ ಲೋಕಸಂಚಾರಿಯಾದರು. 41ನೆಯ ವಯಸ್ಸಿನಲ್ಲಿ ಹುಬ್ಬಳ್ಳಿಯಲ್ಲಿ ನೆಲೆ ನಿಂತು ಅದನ್ನೇ ಕರ್ಮಭೂಮಿ ಮಾಡಿಕೊಂಡರು. ಜಾತಿಭೇದವಿಲ್ಲದೆ ಎಲ್ಲರಿಗೂ "ಓಂ ನಮಃ ಶಿವಾಯ" ಮಂತ್ರ ಬೋಧಿಸಿದರು.`),
S(`ಮಠವು ಸಮಾಜದಲ್ಲಿ ಹೇಗೆ ದಾರಿದೀಪವಾಗಿದೆ?`,`ಮಠಗಳು ಬಡವರಿಗೆ ಧನಸಹಾಯ, ವಿದ್ಯಾರ್ಥಿಗಳಿಗೆ ಊಟ–ವಸತಿ, ದಿಕ್ಕುತೋಚದವರಿಗೆ ಮಾನಸಿಕ ನೆಮ್ಮದಿ ನೀಡುವ ಉಪದೇಶ, ಧಾರ್ಮಿಕ ಕಾರ್ಯಕ್ರಮ, ಪ್ರವಚನಗಳನ್ನು ನಡೆಸುತ್ತವೆ. ಜನರಿಗೆ ಭದ್ರತೆ, ಭರವಸೆ ಮೂಡಿಸುವುದರಿಂದ ಸಮಾಜವೆಂಬ ಸಮುದ್ರದ ದೀಪಸ್ತಂಭದಂತಿವೆ.`),
S(`ಜಾತ್ರೆಯಲ್ಲಿ ಶಾಲೆಯ ಮಕ್ಕಳು ಮಠದಲ್ಲಿ ಮಾಡಿದ ಕೆಲಸಗಳನ್ನು ಬರೆಯಿರಿ.`,`ಮಕ್ಕಳು ಮಠದಲ್ಲಿ ಸ್ವಯಂಸೇವಕರಾಗಿ ಕೆಲಸ ಮಾಡಿದರು. ಕೆಲವರು ನೀರು ತಂದುಕೊಟ್ಟರು; ಕೆಲವರು ಬಂದ ಜನರಿಗೆ ಊಟ ಬಡಿಸಿದರು. ಬಳಿಕ ತಾವೂ ಮಠದಲ್ಲಿ ಊಟ ಮಾಡಿ ತುಸು ಹೊತ್ತು ಆವಾರದಲ್ಲಿ ವಿಶ್ರಮಿಸಿದರು.`),
S(`ಕರ್ತೃಪದ, ಕರ್ಮಪದ, ಕ್ರಿಯಾಪದ ಎಂದರೇನು?`,`ಕೆಲಸ ಮಾಡುವವರು 'ಯಾರು' ಎಂಬುದನ್ನು ಸೂಚಿಸುವ ಪದ ಕರ್ತೃಪದ. ಕ್ರಿಯೆಗೆ ಸಂಬಂಧಿಸಿದಂತೆ 'ಏನನ್ನು?/ಯಾರನ್ನು?' ಎಂಬುದನ್ನು ಸೂಚಿಸುವ ಪದ ಕರ್ಮಪದ. ಕೆಲಸವನ್ನು ತಿಳಿಸುವ ಪದ ಕ್ರಿಯಾಪದ. ಉದಾ: ರೋಜಾಳು (ಕರ್ತೃ) ಗೆಳತಿಯನ್ನು (ಕರ್ಮ) ಮೆಚ್ಚಿದಳು (ಕ್ರಿಯಾಪದ).`),
L(`ಸಿದ್ಧಾರೂಢ ಜಾತ್ರೆಯಲ್ಲಿ ಮಕ್ಕಳು ಕಂಡ ದೃಶ್ಯಗಳನ್ನು ವರ್ಣಿಸಿ.`,`ಮಕ್ಕಳು ಜಾತ್ರೆಯಲ್ಲಿ ಅಂಗಡಿಗಳ ಸಾಲು ಕಂಡರು. ಬಾಳೆಹಣ್ಣು, ತೆಂಗಿನಕಾಯಿಗಳ ಅಂಗಡಿಗಳಿಗಂತೂ ಎಣಿಕೆಯಿರಲಿಲ್ಲ. ಬಳೆಗಳ ಅಂಗಡಿಗಳಲ್ಲಿ ಹೆಣ್ಣುಮಕ್ಕಳು ಕಿಕ್ಕಿರಿದು ಸೇರಿದ್ದರು. ಮಿಠಾಯಿ ಕೊಳ್ಳಲು ಜನರು ಗುಂಪು ಗುಂಪಾಗಿ ನಿಂತಿದ್ದರು; ಮಕ್ಕಳು ಮಿಠಾಯಿ ಕೊಂಡರು. ಮುಂದೆ ತೊಟ್ಟಿಲ ಜೀಕ, ಕುದುರೆ, ಆನೆ, ಒಂಟೆಗಳ ತಿರುಗು ಯಂತ್ರಗಳಿದ್ದವು; ಮಕ್ಕಳು ಹುರುಪಿನಿಂದ ಅವುಗಳಲ್ಲಿ ಕುಳಿತು ಆಟವಾಡಿದರು. ನಂತರ ಮರದ ಕೆಳಗೆ ಕುಳಿತಾಗ ಸದಾನಂದನು ಎಲ್ಲರಿಗೂ ಮಿಠಾಯಿ ಹಂಚಿದನು.`),
L(`ಸ್ವಾತಂತ್ರ್ಯ ಹೋರಾಟಕ್ಕೂ ಸಿದ್ಧಾರೂಢ ಮಠಕ್ಕೂ ಇರುವ ಸಂಬಂಧವನ್ನು ವಿವರಿಸಿ.`,`ಸಿದ್ಧಾರೂಢ ಮಠವು ದೇಶದ ಸ್ವಾತಂತ್ರ್ಯ ಹೋರಾಟದ ಸಮಯದಲ್ಲಿ ಸಕ್ರಿಯವಾಗಿತ್ತು. ಗಾಂಧೀಜಿ, ತಿಲಕರಂತಹ ರಾಷ್ಟ್ರನಾಯಕರಿಗೆ ಈ ಮಠ ಸ್ಫೂರ್ತಿ ನೀಡಿತು. ಇದು ಹೋರಾಟಗಾರರಿಗೆ ಧೈರ್ಯ ಮತ್ತು ಪ್ರೇರಣೆಯ ಕೇಂದ್ರವಾಗಿತ್ತು. ಇಂದಿಗೂ "ಸಿದ್ಧಾರೂಢರ ಜೋಳಿಗೆ, ನಾಡಿಗೆಲ್ಲ ಹೋಳಿಗೆ" ಎಂಬ ಜಯಘೋಷಗಳು ಜಾತ್ರೆಯಲ್ಲಿ ಕೇಳಿಬರುತ್ತವೆ.`)
]});

LS6.push({n:3,t:`ಯಾಣ ಕುರಿತೊಂದು ಪತ್ರ (ಗದ್ಯ 7)`,au:`ಸಮಿತಿ ರಚನೆ`,pg:14,
words:`ಸಂದೇಶ – ಸುದ್ದಿ; ವಿನಿಮಯ – ಒಂದಕ್ಕೆ ಬದಲಾಗಿ ಮತ್ತೊಂದನ್ನು ಕೊಡುವಿಕೆ; ಚೂಟಿ – ಚುರುಕು; ವಿಶೇಷ – ಪ್ರತ್ಯೇಕವಾದ, ವಿಶಿಷ್ಟವಾದ; ಗಗನಚುಂಬಿ – ಆಕಾಶವನ್ನು ಮುಟ್ಟುವಂತಹದು, ಬಹಳ ಎತ್ತರವಾದುದು; ಹೆಬ್ಬಂಡೆ – ದೊಡ್ಡದಾದ ಕಲ್ಲು; ಇಕ್ಕಟ್ಟು – ಸಂದಿಗ್ಧ, ಕಿರಿದಾದ; ಶಿಖರ – ಮರ, ಬೆಟ್ಟಗಳ ತುದಿ, ದೇವಾಲಯಗಳ ಗೋಪುರ; ಉತ್ಪತ್ತಿ – ಸೃಷ್ಟಿ, ಉಂಟಾಗು, ಹುಟ್ಟು`,
notes:`ಕಂಪ್ಯೂಟರ್ – ಸಂಗಣಕ / ಗಣಕಯಂತ್ರ. ಭೂಗರ್ಭ ಶಾಸ್ತ್ರ – ಭೂಮಿಯ ಪದರಗಳು ಮತ್ತು ಭೂಮಿಯ ಒಳಗಿರುವ ವಸ್ತುಗಳ ವಿಷಯವನ್ನು ಅಧ್ಯಯನ ಮಾಡುವ ಶಾಸ್ತ್ರ. ಗುಪ್ತ ಸಂಕೇತ – ಇ–ಮೇಲ್ ಬಳಸುವ ಪ್ರತಿಯೊಬ್ಬರಿಗೂ ಅವರದ್ದೇ ಗುಪ್ತ ಸಂಕೇತ (ಪಾಸ್‌ವರ್ಡ್) ಇರುತ್ತದೆ. ಚಾರಣ – ಬೆಟ್ಟ ಗುಡ್ಡಗಳ ಕಡೆಗೆ ಸಾಹಸದ ನಡಿಗೆ. ದಂತಕಥೆ – ಬಾಯಿಯಿಂದ ಬಾಯಿಗೆ ಹರಡುವ ಕಲ್ಪಿತ ಕಥೆ. ಯಾಣ: ಉತ್ತರ ಕನ್ನಡ ಜಿಲ್ಲೆ, ಕುಮಟಾ ತಾಲ್ಲೂಕಿನಿಂದ 25 ಕಿ.ಮೀ.; ಭೈರವೇಶ್ವರ ಶಿಖರ ಸುಮಾರು 390 ಅಡಿ ಎತ್ತರ, ಮೋಹಿನಿ ಶಿಖರ ಸುಮಾರು 300 ಅಡಿ; ಶಿವರಾತ್ರಿಯಂದು ಭೈರವೇಶ್ವರ ಸ್ವಾಮಿಯ ಉತ್ಸವ. ಕೌಶಲ: ಬರೆಯುವುದು.`,
ab:[
[`ಅ. ಇಲ್ಲಿರುವ ಪದಗಳನ್ನು ಬಳಸಿ ಸೂಕ್ತವಾದುದನ್ನು ಬಿಟ್ಟ ಸ್ಥಳದಲ್ಲಿ ತುಂಬಿರಿ`,[
[`ಅದೊಂದು ಭಾನುವಾರ ಎಲ್ಲರೂ ______ ವಿನ ಮನೆಗೆ ಬಂದರು.`,`ರಾಜು`],
[`'ಇ–ಮೇಲ್' ತೆರೆಯಲು ______ ಸಂಕೇತದ ಅಗತ್ಯವಿದೆ.`,`ಗುಪ್ತ`],
[`ವಿಶೇಷ ಪತ್ರ ತಯಾರಿಸಲು ಹೇಳಿದ್ದು ______ ಮೇಡಂ.`,`ಪದ್ಮಿನಿ`],
[`ಯಾಣದ ಕುರಿತಾಗಿ ಒಂದು ______ ಕಥೆಯಿದೆ.`,`ದಂತ (ದಂತಕಥೆ)`],
[`ಯಾಣದ ಚಿತ್ರಗಳನ್ನು ಅದರ ವಿವರಗಳನ್ನು ______ ಓದಿದರು.`,`ರಾಗಿಣಿ ಮತ್ತು ಜೆನಿಫರ್`]]],
[`ಆ. ಗುಂಪಿಗೆ ಸೇರದ ಪದ ಗುರುತಿಸಿ ಬರೆಯಿರಿ`,[
[`ಕಾಗದ, ಪತ್ರ, ದೂರವಾಣಿ, ಓಲೆ`,`ದೂರವಾಣಿ (ಉಳಿದವು ಪತ್ರವನ್ನು ಸೂಚಿಸುವ ಪದಗಳು)`],
[`ಹೆಬ್ಬಂಡೆ, ಹಿರಿದು ಬಂಡೆ, ಕಿರಿದು ಬಂಡೆ, ದೊಡ್ಡ ಬಂಡೆ`,`ಕಿರಿದು ಬಂಡೆ (ಉಳಿದವು ದೊಡ್ಡ ಬಂಡೆ ಎಂಬ ಅರ್ಥದವು)`],
[`ಸಂತೋಷ, ದುಃಖ, ಆನಂದ, ಸಂತಸ`,`ದುಃಖ (ಉಳಿದವು ಸಂತೋಷದ ಅರ್ಥದವು)`],
[`ಸಂಪತ್ತು, ಆಪತ್ತು, ಧನ, ಐಶ್ವರ್ಯ`,`ಆಪತ್ತು (ಉಳಿದವು ಸಿರಿ–ಸಂಪತ್ತಿನ ಅರ್ಥದವು)`]]],
[`ಇ. ಒಂದು ಪದ ಅಥವಾ ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರಿಸಿ`,[
[`ರಾಜುವಿನ ಮನೆಗೆ ಯಾರು ಯಾರು ಬಂದರು?`,`ಸಲೀಂ, ರಾಗಿಣಿ, ಜೆನಿಫರ್ ಮತ್ತು ಶಂಕರ.`],
[`ಇ–ಅಂಚೆ ಎಂದರೇನು?`,`ಕಂಪ್ಯೂಟರ್ ಮೂಲಕ ಪತ್ರ, ಸಂದೇಶಗಳನ್ನು ವಿನಿಮಯ ಮಾಡಿಕೊಳ್ಳುವ ವಿಧಾನ (ಇ = ಎಲೆಕ್ಟ್ರಾನಿಕ್, ಮೇಲ್ = ಅಂಚೆ; ಎಲೆಕ್ಟ್ರಾನಿಕ್ ಮೇಲ್).`],
[`ಯಾಣದ ಯಾವ ಶಿಖರ ಉಕ್ಕಿನಕೋಟೆಯಂತಿದೆ?`,`ಭೈರವೇಶ್ವರ ಶಿಖರ.`],
[`ಯಾಣದ ಕಲ್ಲು ಯಾವುದರಿಂದ ಉತ್ಪತ್ತಿಯಾಗಿದೆ?`,`ಖನಿಜ ಸಂಪತ್ತು ಮತ್ತು ಸುಣ್ಣದ ಕಲ್ಲಿನಿಂದ (ಭೂಗರ್ಭ ಶಾಸ್ತ್ರದ ಸಂಶೋಧನೆಯ ಪ್ರಕಾರ).`],
[`ಯಾಣದಲ್ಲಿ ಯಾವ ದೇವರ ಉತ್ಸವ ನಡೆಯುತ್ತದೆ?`,`ಶಿವರಾತ್ರಿಯ ದಿನ ಭೈರವೇಶ್ವರ ಸ್ವಾಮಿಯ ಉತ್ಸವ ನಡೆಯುತ್ತದೆ.`]]],
[`ಈ. ಎರಡು–ಮೂರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರಿಸಿ`,[
[`ಸುಂದರ್ ಗುಪ್ತ ಸಂಕೇತವನ್ನು ರಾಜುವಿಗೆ ಮಾತ್ರ ಏಕೆ ಹೇಳಿದರು?`,`ಒಬ್ಬರ ಗುಪ್ತ ಸಂಕೇತ ಇನ್ನೊಬ್ಬರಿಗೆ ಗೊತ್ತಾಗಬಾರದು. ಗೊತ್ತಾದರೆ ಯಾರು ಬೇಕಾದರೂ ಪತ್ರ ಓದಬಹುದು; ಬೇರೆಯವರ ಪತ್ರವನ್ನು ನಾವು ಓದಬಾರದು. ಆದ್ದರಿಂದ ಗುಪ್ತ ಸಂಕೇತವನ್ನು ರಾಜುವಿಗೆ ಮಾತ್ರ ಹೇಳಿದರು.`],
[`ಯಾಣದ ಕುರಿತಾಗಿ ಇರುವ ಒಂದು ದಂತಕಥೆಯನ್ನು ಬರೆಯಿರಿ.`,`ಪುರಾಣ ಕಾಲದಲ್ಲಿ ಯಾಣದಲ್ಲಿ ಭಸ್ಮಾಸುರನೆಂಬ ರಾಕ್ಷಸ ವಾಸವಾಗಿದ್ದ. ಅವನ ಉಪಟಳ ಸಹಿಸಲು ಅಸಾಧ್ಯವಾದಾಗ ಶಿವನು ಅವನನ್ನು ಸುಟ್ಟು ಬೂದಿ ಮಾಡಿದನು. ಈ ಬೂದಿಯಿಂದ ದೊಡ್ಡದಾದ ಶಿಖರ ಬೆಳೆಯಿತು ಎಂಬುದೇ ಆ ದಂತಕಥೆ.`],
[`ಯಾವ ದೃಶ್ಯಗಳು ನೋಡುಗರನ್ನು ಚಕಿತಗೊಳಿಸುತ್ತವೆ?`,`ಪ್ರಕೃತಿ ಮಾತೆಯೇ ಶಿಲ್ಪಿಯ ರೂಪ ತಾಳಿ ಇಲ್ಲಿನ ಆಕೃತಿಗಳನ್ನು ಕೆತ್ತಿದಳೇ ಎಂಬಷ್ಟರ ಮಟ್ಟಿಗೆ ಯಾಣದ ಕಲ್ಲಿನ ಶಿಖರಗಳ ದೃಶ್ಯಗಳು ನೋಡುಗರನ್ನು ಚಕಿತಗೊಳಿಸುತ್ತವೆ.`]]],
[`ಉ. ಸಂಧಿ ಬಿಡಿಸಿ. ಸಂಧಿಯನ್ನು ಹೆಸರಿಸಿ`,[
[`ಭಸ್ಮಾಸುರ`,`ಭಸ್ಮ + ಅಸುರ (ಅ + ಅ = ಆ) – ಸವರ್ಣದೀರ್ಘ ಸಂಧಿ`],
[`ಭೈರವೇಶ್ವರ`,`ಭೈರವ + ಈಶ್ವರ (ಅ + ಈ = ಏ) – ಗುಣಸಂಧಿ`],
[`ಏಕೈಕ`,`ಏಕ + ಏಕ (ಅ + ಏ = ಐ) – ವೃದ್ಧಿಸಂಧಿ`],
[`ಇತ್ಯಾದಿ`,`ಇತಿ + ಆದಿ (ಇ + ಆ = ಯಾ) – ಯಣ್ ಸಂಧಿ`],
[`ಸೂರ್ಯೋದಯ`,`ಸೂರ್ಯ + ಉದಯ (ಅ + ಉ = ಓ) – ಗುಣಸಂಧಿ`]]],
[`ಊ. ನಿಮ್ಮೂರಿನ ರಸ್ತೆಗೆ ಬೀದಿ ದೀಪವನ್ನು ಅಳವಡಿಸುವಂತೆ ಕೋರಿ ಸಂಬಂಧಿಸಿದ ಕಛೇರಿಗೆ ಪತ್ರ ಬರೆಯಿರಿ`,[
[`ವ್ಯಾವಹಾರಿಕ ಪತ್ರ (ಮಾದರಿ)`,`ಇವರಿಂದ: (ನಿಮ್ಮ ಹೆಸರು, ವಿಳಾಸ) · ದಿನಾಂಕ: ___ · ಇವರಿಗೆ: ಅಧ್ಯಕ್ಷರು, ಗ್ರಾಮ ಪಂಚಾಯಿತಿ, (ಊರು) · ಮಾನ್ಯರೇ, · ವಿಷಯ: ರಸ್ತೆಗೆ ಬೀದಿ ದೀಪ ಅಳವಡಿಸುವ ಬಗ್ಗೆ. · ನಮ್ಮ ಊರಿನ ರಸ್ತೆಯಲ್ಲಿ ಬೀದಿ ದೀಪವಿಲ್ಲದೆ ರಾತ್ರಿಯಲ್ಲಿ ನಡೆದಾಡಲು ತೊಂದರೆಯಾಗುತ್ತಿದೆ (ವಿವರ). ದಯವಿಟ್ಟು ಬೀದಿ ದೀಪ ಅಳವಡಿಸಲು ಕ್ರಮ ಕೈಗೊಳ್ಳಬೇಕೆಂದು ಕೋರುತ್ತೇನೆ. · ವಂದನೆಗಳೊಂದಿಗೆ, ತಮ್ಮ ವಿಶ್ವಾಸಿ, ಸಹಿ (ಹೆಸರು). ಲಕೋಟೆಯ ಮೇಲೆಯೂ ವಿಳಾಸ ಬರೆಯಬೇಕು.`]]],
[`ವ್ಯಾಕರಣ ಮಾಹಿತಿ – ಸಂಸ್ಕೃತ ಸಂಧಿ`,[
[`ಸಂಸ್ಕೃತ ಸಂಧಿ ಎಂದರೇನು?`,`ಎರಡು ಸಂಸ್ಕೃತ ಶಬ್ದಗಳು ಸೇರಿದಾಗ ಪರಸ್ಪರ ಎದುರಾದ ಅಕ್ಷರಗಳ ನಡುವೆ ಸಂಧಿಯಾದರೆ ಅದು ಸಂಸ್ಕೃತ ಸಂಧಿ.`],
[`ಸವರ್ಣದೀರ್ಘ ಸಂಧಿ ಎಂದರೇನು? ಉದಾಹರಣೆ ಕೊಡಿ.`,`ಒಂದೇ ಜಾತಿಯ ಸ್ವರಾಕ್ಷರಗಳು ಪರಸ್ಪರ ಸೇರಿ ದೀರ್ಘರೂಪ ಪಡೆಯುವುದು. ಉದಾ: ದೇವ + ಅಸುರ = ದೇವಾಸುರ; ರವಿ + ಇಂದ್ರ = ರವೀಂದ್ರ; ಗುರು + ಉಪದೇಶ = ಗುರೂಪದೇಶ.`],
[`ಗುಣಸಂಧಿ ಎಂದರೇನು? ಉದಾಹರಣೆ ಕೊಡಿ.`,`'ಅ', 'ಆ' ಕಾರಗಳ ಮುಂದೆ 'ಇ','ಈ' ಬಂದಾಗ 'ಏ'; 'ಉ','ಊ' ಬಂದಾಗ 'ಓ'; 'ಋ' ಬಂದಾಗ 'ಅರ್' ಸೇರಿದರೆ ಗುಣಸಂಧಿ. ಉದಾ: ಸುರ + ಇಂದ್ರ = ಸುರೇಂದ್ರ; ಚಂದ್ರ + ಉದಯ = ಚಂದ್ರೋದಯ; ಮಹಾ + ಋಷಿ = ಮಹರ್ಷಿ.`],
[`ವೃದ್ಧಿಸಂಧಿ ಎಂದರೇನು? ಉದಾಹರಣೆ ಕೊಡಿ.`,`'ಅ','ಆ' ಕಾರಗಳ ಮುಂದೆ 'ಏ','ಐ' ಪರವಾದರೆ ಅವೆರಡರ ಸ್ಥಾನದಲ್ಲಿ 'ಐ'; 'ಓ','ಔ' ಪರವಾದರೆ 'ಔ' ಆದೇಶವಾಗಿ ಬರುವುದು. ಉದಾ: ಏಕ + ಏಕ = ಏಕೈಕ; ಶಿವ + ಐಕ್ಯ = ಶಿವೈಕ್ಯ; ವನ + ಓಷಧ = ವನೌಷಧ; ಮಹಾ + ಔದಾರ್ಯ = ಮಹೌದಾರ್ಯ.`],
[`ಯಣ್ ಸಂಧಿ ಎಂದರೇನು? ಉದಾಹರಣೆ ಕೊಡಿ.`,`ಇ, ಈ, ಉ, ಊ, ಋ ಕಾರಗಳಿಗೆ ಸವರ್ಣವಲ್ಲದ ಸ್ವರ ಪರವಾದರೆ ಇ,ಈ ಗಳಿಗೆ 'ಯ್', ಉ,ಊ ಗಳಿಗೆ 'ವ್', 'ಋ'ಕ್ಕೆ 'ರ್' ಆದೇಶವಾಗಿ ಬಂದರೆ ಅದು ಯಣ್ ಸಂಧಿ. ಉದಾ: ಇತಿ + ಆದಿ = ಇತ್ಯಾದಿ; ಜಾತಿ + ಅತೀತ = ಜಾತ್ಯತೀತ; ಪ್ರತಿ + ಉಪಕಾರ = ಪ್ರತ್ಯುಪಕಾರ; ಮನು + ಅಂತರ = ಮನ್ವಂತರ; ಪಿತೃ + ಆರ್ಜಿತ = ಪಿತ್ರಾರ್ಜಿತ.`]]],
[`ಭಾಷಾ ಆಟ – ಚೆಲ್ಲಾಪಿಲ್ಲಿಯಾಗಿ ಹರಡಿರುವ ಅಕ್ಷರಗಳನ್ನು ಜೋಡಿಸಿ`,[
[`ಪ್ರ ರ್ಯ ಕೃ ದ ತಿ ಸೌಂ –`,`ಪ್ರಕೃತಿ ಸೌಂದರ್ಯ`],
[`ಇತರ ಪದಗಳು (ಚಟುವಟಿಕೆ)`,`ಉಳಿದ ಅಕ್ಷರ ಗುಂಪುಗಳನ್ನು ಮಕ್ಕಳು ಜೋಡಿಸಿ ಅರ್ಥಪೂರ್ಣ ಪದ ಮಾಡುವ ಚಟುವಟಿಕೆ. ⚠ ಪಠ್ಯಪುಸ್ತಕದ ಅಕ್ಷರಗಳನ್ನು ನೋಡಿ ಶಿಕ್ಷಕರು ಪರಿಶೀಲಿಸಿ.`]]]
],
qb:[
M(`ಯಾಣ ಯಾವ ಜಿಲ್ಲೆಯಲ್ಲಿದೆ?`,[`ಉತ್ತರ ಕನ್ನಡ`,`ಮೈಸೂರು`,`ಬಳ್ಳಾರಿ`,`ಕೊಡಗು`],0),
M(`ಯಾಣದ ಶಿಖರ ಉಕ್ಕಿನ ಕೋಟೆಯಂತೆ ಕಾಣುವುದು:`,[`ಮೋಹಿನಿ ಶಿಖರ`,`ಭೈರವೇಶ್ವರ ಶಿಖರ`,`ಚಾಮುಂಡಿ ಬೆಟ್ಟ`,`ನಂದಿ ಬೆಟ್ಟ`],1),
M(`'ಇ–ಅಂಚೆ' ಎಂದರೆ:`,[`ಎಲೆಕ್ಟ್ರಾನಿಕ್ ಮೇಲ್`,`ಪೋಸ್ಟ್ ಕಾರ್ಡ್`,`ದೂರವಾಣಿ`,`ಟೆಲಿಗ್ರಾಂ`],0),
M(`ಪಾಸ್‌ವರ್ಡ್ ಎಂದರೆ ಕನ್ನಡದಲ್ಲಿ:`,[`ಗುಪ್ತ ಸಂಕೇತ`,`ವಿಳಾಸ`,`ಹೆಸರು`,`ಸಹಿ`],0),
M(`'ಗಗನಚುಂಬಿ' ಪದದ ಅರ್ಥ:`,[`ಬಹಳ ಎತ್ತರವಾದುದು`,`ಬಹಳ ಆಳವಾದುದು`,`ಬಹಳ ಚಿಕ್ಕದು`,`ಬಹಳ ದೂರ`],0),
M(`ಭೈರವೇಶ್ವರ ಸ್ವಾಮಿಯ ಉತ್ಸವ ನಡೆಯುವ ದಿನ:`,[`ಯುಗಾದಿ`,`ಶಿವರಾತ್ರಿ`,`ದಸರಾ`,`ಸಂಕ್ರಾಂತಿ`],1,'m'),
O(`ಪದ್ಮಿನಿ ಮೇಡಂ ಮಕ್ಕಳಿಗೆ ಏನು ಬರೆದುಕೊಂಡು ಬರಲು ಹೇಳಿದರು?`,`ವಿಶೇಷ ಪತ್ರವನ್ನು.`),
O(`ರಾಜುವಿನ ತಂದೆಯ ಹೆಸರೇನು?`,`ಸುಂದರ್.`),
O(`ರಾಜುವಿನ ಇ–ಮೇಲ್ ವಿಳಾಸ ಯಾವುದು?`,`rajusundar@gmail.com`),
O(`ಯಾಣದಲ್ಲಿ ವಾಸವಾಗಿದ್ದ ರಾಕ್ಷಸನ ಹೆಸರೇನು?`,`ಭಸ್ಮಾಸುರ.`),
O(`ಭೈರವೇಶ್ವರ ಶಿಖರದ ಎತ್ತರ ಎಷ್ಟು?`,`ಸುಮಾರು 390 ಅಡಿ.`),
O(`ಯಾಣ ಯಾವ ತಾಲ್ಲೂಕಿಗೆ ಹೊಂದಿಕೊಂಡಿದೆ?`,`ಕುಮಟ ತಾಲ್ಲೂಕಿಗೆ.`),
G(`'ಸಂದೇಶ' ಪದದ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಸುದ್ದಿ`,'e'),
G(`'ಚೂಟಿ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಚುರುಕು`,'e'),
G(`ಸಂಧಿ ಬಿಡಿಸಿ ಹೆಸರಿಸಿ: ಭಸ್ಮಾಸುರ`,`ಭಸ್ಮ + ಅಸುರ – ಸವರ್ಣದೀರ್ಘ ಸಂಧಿ`),
G(`ಸಂಧಿ ಬಿಡಿಸಿ ಹೆಸರಿಸಿ: ಇತ್ಯಾದಿ`,`ಇತಿ + ಆದಿ – ಯಣ್ ಸಂಧಿ`),
G(`ಸಂಧಿ ಬಿಡಿಸಿ ಹೆಸರಿಸಿ: ಸೂರ್ಯೋದಯ`,`ಸೂರ್ಯ + ಉದಯ – ಗುಣಸಂಧಿ`),
G(`ಗುಂಪಿಗೆ ಸೇರದ ಪದ: ಕಾಗದ, ಪತ್ರ, ದೂರವಾಣಿ, ಓಲೆ`,`ದೂರವಾಣಿ`),
S(`ಇ–ಮೇಲ್ ಎಂದರೇನು? ಇದನ್ನು ಹೇಗೆ ತೆರೆಯುತ್ತಾರೆ?`,`ಕಂಪ್ಯೂಟರ್ ಮೂಲಕ ಪತ್ರ, ಸಂದೇಶಗಳನ್ನು ವಿನಿಮಯ ಮಾಡಿಕೊಳ್ಳುವ ಜನಪ್ರಿಯ ವಿಧಾನ. ಇದಕ್ಕೆ ಇ–ಮೇಲ್ ವಿಳಾಸ ಬೇಕು. ಪ್ರತಿಯೊಬ್ಬರಿಗೂ ಅವರದ್ದೇ ಆದ ಗುಪ್ತ ಸಂಕೇತ (ಪಾಸ್‌ವರ್ಡ್) ಇರುತ್ತದೆ; ಅದನ್ನು ಬಳಸಿ ಮಾತ್ರ ಇ–ಪತ್ರವನ್ನು ತೆರೆದು ಓದಬಹುದು.`),
S(`ಗುಪ್ತ ಸಂಕೇತವನ್ನು ಇನ್ನೊಬ್ಬರಿಗೆ ಹೇಳಬಾರದು ಏಕೆ?`,`ಗುಪ್ತ ಸಂಕೇತ ಗೊತ್ತಾದರೆ ಯಾರು ಬೇಕಾದರೂ ಬೇರೆಯವರ ಪತ್ರ ಓದಬಹುದು. ಬೇರೆಯವರ ಪತ್ರವನ್ನು ನಾವು ಓದಬಾರದು. ಆದ್ದರಿಂದ ಗುಪ್ತ ಸಂಕೇತವನ್ನು ಅವರವರಿಗೆ ಮಾತ್ರ ತಿಳಿಸಬೇಕು.`),
S(`ಯಾಣದ ದಂತಕಥೆಯನ್ನು ಬರೆಯಿರಿ.`,`ಯಾಣದಲ್ಲಿ ಭಸ್ಮಾಸುರನೆಂಬ ರಾಕ್ಷಸ ವಾಸವಾಗಿದ್ದನು. ಅವನ ಉಪಟಳ ಸಹಿಸಲಾಗದಾಗ ಶಿವನು ಅವನನ್ನು ಸುಟ್ಟು ಬೂದಿ ಮಾಡಿದನು. ಆ ಬೂದಿಯಿಂದ ದೊಡ್ಡ ಶಿಖರ ಬೆಳೆಯಿತೆಂಬುದು ದಂತಕಥೆ. ಆದರೆ ಭೂಗರ್ಭ ಶಾಸ್ತ್ರದ ಪ್ರಕಾರ ಇದು ಖನಿಜ ಸಂಪತ್ತು ಮತ್ತು ಸುಣ್ಣದ ಕಲ್ಲಿನಿಂದ ಕೂಡಿದ ಜಾಗ.`),
S(`ಗುಣಸಂಧಿಗೆ ಎರಡು ಉದಾಹರಣೆ ಕೊಡಿ.`,`'ಅ','ಆ' ಕಾರಗಳ ಮುಂದೆ 'ಇ,ಈ' ಬಂದರೆ 'ಏ'; 'ಉ,ಊ' ಬಂದರೆ 'ಓ'. ಉದಾ: ಸುರ + ಇಂದ್ರ = ಸುರೇಂದ್ರ; ಚಂದ್ರ + ಉದಯ = ಚಂದ್ರೋದಯ; ದೇವ + ಈಶ = ದೇವೇಶ.`),
L(`ಯಾಣದ ಸೌಂದರ್ಯವನ್ನು ರಾಜು ತನ್ನ ಪತ್ರದಲ್ಲಿ ಹೇಗೆ ವರ್ಣಿಸಿದ್ದಾನೆ?`,`ಯಾಣವು ಮಲೆನಾಡಿನ ಪ್ರವಾಸಿ ತಾಣಗಳಲ್ಲಿ ಗಗನಚುಂಬಿ ಹೆಬ್ಬಂಡೆಗಳ ತಾಣ. ಶಿರಸಿಯಿಂದ ಯಾಣ ಎಂಬ ಹಳ್ಳಿ ತಲುಪಿ ಅಲ್ಲಿಂದ 2 ಕಿ.ಮೀ. ಕಾಲುದಾರಿಯಲ್ಲಿ ಪ್ರಯಾಣಿಸಬೇಕು. ಇಕ್ಕಟ್ಟಾದ ಕಾಡಿನ ದಾರಿಯಲ್ಲಿ ಸಾಗುವಾಗ ತಂಪು ಗಾಳಿಯ ಅನುಭವ ಹಿತ ನೀಡುತ್ತದೆ. ಮುಂದೆ ಸಾಗಿದರೆ ಮೋಹಿನಿ ಶಿಖರ (ಸುಮಾರು 300 ಅಡಿ) ಎದುರಾಗುತ್ತದೆ. ಮತ್ತೆ ಮುಂದೆ 390 ಅಡಿ ಎತ್ತರದ ಭೈರವೇಶ್ವರ ಶಿಖರ ಕಾಣುತ್ತದೆ; ಇದು ಕಪ್ಪುಕಲ್ಲಿನ ಉಕ್ಕಿನ ಕೋಟೆಯಂತಿದೆ. ಪ್ರಕೃತಿ ಮಾತೆಯೇ ಶಿಲ್ಪಿಯ ರೂಪ ತಾಳಿ ಆಕೃತಿಗಳನ್ನು ಕೆತ್ತಿದಳೇ ಎಂಬಂತೆ ದೃಶ್ಯಗಳು ಚಕಿತಗೊಳಿಸುತ್ತವೆ. ಕಲ್ಲಿನ ಗುಹೆಯೊಳಗೆ ಪ್ರವೇಶಿಸುವುದು ಸುಂದರ ಅನುಭವ.`),
L(`ಇ–ಮೇಲ್ ಅನ್ನು ಸಾಮಾನ್ಯ ಅಂಚೆಯೊಂದಿಗೆ ಹೋಲಿಸಿ ವಿವರಿಸಿ.`,`ಸಾಮಾನ್ಯ ಅಂಚೆ ವ್ಯವಸ್ಥೆಯಂತೆ ಇಲ್ಲಿಯೂ ಪತ್ರ ತಲುಪಬೇಕಾದ ವಿಳಾಸ ಬೇಕು; ಇದಕ್ಕೆ ಇ–ಮೇಲ್ ವಿಳಾಸ ಎನ್ನುತ್ತಾರೆ. ಕಂಪ್ಯೂಟರ್ ಮೂಲಕ ಪತ್ರಗಳು, ಸಂದೇಶಗಳು, ಚಿತ್ರಗಳನ್ನು ತಕ್ಷಣ ಕಳುಹಿಸಬಹುದು. ಅಂಚೆಯ ಪತ್ರವನ್ನು ಯಾರು ಬೇಕಾದರೂ ತೆರೆಯಬಹುದಾದರೆ ಇ–ಮೇಲ್ ತೆರೆಯಲು ಅವರವರದೇ ಆದ ಗುಪ್ತ ಸಂಕೇತ (ಪಾಸ್‌ವರ್ಡ್) ಬೇಕು. ಇದರಿಂದ ಪತ್ರದ ಗೋಪ್ಯತೆ ಕಾಪಾಡಲ್ಪಡುತ್ತದೆ.`)
]});

LS6.push({n:4,t:`ಕರ್ನಾಟಕ ಏಕೀಕರಣ (ಗದ್ಯ 8)`,au:`ಸಮಿತಿ ರಚನೆ`,pg:23,
words:`ಉದಯ – ಹುಟ್ಟು, ಮೂಡು; ಆಕಾಶವಾಣಿ – ರೇಡಿಯೋ, ಬಾನುಲಿ; ಪ್ರಸ್ತುತಪಡಿಸು – ಪ್ರಕಟಿಸು, ಸಾದರಪಡಿಸು; ಆಲಿಸು – ಕೇಳು; ಹೊರತುಪಡಿಸಿ – ಬಿಟ್ಟು; ಕುತೂಹಲ – ಅಚ್ಚರಿ, ವಿಸ್ಮಯ; ಸಂಸ್ಥಾನ – ರಾಜ್ಯ, ದೇಶದ ಒಂದು ಭಾಗ; ಪರಕೀಯ – ಬೇರೆಯ, ಹೊರಗಿನ, ಅನ್ಯ; ಅಸಹನೀಯ – ಸಹಿಸಲು ಸಾಧ್ಯವಿಲ್ಲದ; ಅಸ್ತಿತ್ವ – ಇರುವಿಕೆ; ಅಗ್ರಗಣ್ಯ – ಮೊಟ್ಟಮೊದಲಿನ, ಸರ್ವಶ್ರೇಷ್ಠ; ಪ್ರೇರಣೆ – ಪ್ರಚೋದನೆ; ವಿಭಜನೆ – ವಿಂಗಡಣೆ, ಬೇರ್ಪಡಿಸುವಿಕೆ; ಸಮಾನ ಮನಸ್ಕ – ಒಂದೇ ಬಗೆಯಲ್ಲಿ ಯೋಚನೆ ಮಾಡುವವನು; ಕಾರ್ಯಪ್ರವೃತ್ತ – ಕೆಲಸ ಮಾಡಲು ಮೊದಲಾಗು; ಧ್ಯೇಯೋದ್ದೇಶ – ಗುರಿ; ನಿಘಂಟು – ಶಬ್ದಕೋಶ; ನೆಲೆಕಲ್ಪಿಸು – ವೇದಿಕೆ ಒದಗಿಸು; ಆಯೋಜಿಸು – ಏರ್ಪಾಡು ಮಾಡು; ಆಂದೋಲನ – ಚಳುವಳಿ, ಕ್ರಾಂತಿ; ವ್ಯಾಪ್ತಿ – ವಿಸ್ತಾರ, ಮಿತಿ; ಎಡವಟ್ಟು – ರೂಢಿಗೆ ವಿರೋಧವಾದುದು, ಉಚಿತವಲ್ಲದ್ದು; ಅಖಂಡ – ಅವಿಚ್ಛಿನ್ನ, ಪೂರ್ಣ`,
notes:`ಒಡೆದು ಆಳುವ ನೀತಿ: ಒಂದಾಗಿದ್ದ ರಾಜ್ಯವನ್ನು ಎರಡು ಭಾಗ ಮಾಡಿ ಆಳುವುದು. ವಂಗ ಭಂಗ ಚಳುವಳಿ: ವಂಗ = ಬಂಗಾಳ; ಬಂಗಾಳದಲ್ಲಿ ಏಕತೆಗೆ ಭಂಗವಾದಾಗ ಮಾಡಿದ ಹೋರಾಟ. ಕಬಂಧಬಾಹು: ರಾಮಾಯಣದಲ್ಲಿ ಬರುವ ಶಾಪಗ್ರಸ್ತ ಗಂಧರ್ವನ ತೋಳು; ನೀಳವಾದ ತೋಳುಗಳು, ಬಂಧಿಸುವ ಸಂಕೋಲೆ. ಮುಖ್ಯ ವರ್ಷಗಳು: 1890 – ಕರ್ನಾಟಕ ವಿದ್ಯಾವರ್ಧಕ ಸಂಘ (ಧಾರವಾಡ); 1915 – ಕರ್ನಾಟಕ ಸಾಹಿತ್ಯ ಪರಿಷತ್ತು (ಬೆಂಗಳೂರು; 1939ರಲ್ಲಿ 'ಕನ್ನಡ ಸಾಹಿತ್ಯ ಪರಿಷತ್ತು'); 1916 – ಕರ್ನಾಟಕ ಸಭೆ; 1956 ನವೆಂಬರ್ 1 – ಮೈಸೂರು ರಾಜ್ಯ; 1973 ನವೆಂಬರ್ 1 – 'ಕರ್ನಾಟಕ ರಾಜ್ಯ' ಎಂಬ ಹೆಸರು. ಕೌಶಲ: ಬರೆಯುವುದು. ವ್ಯಾಕರಣ ಮಾಹಿತಿ: ಪತ್ರ ಲೇಖನ (ವ್ಯಾವಹಾರಿಕ ಪತ್ರ), ಪ್ರಬಂಧ ರಚನೆ.`,
ab:[
[`ಅ. ಹೊಂದಿಸಿ ಬರೆಯಿರಿ`,[
[`1890`,`ಇ. ಕರ್ನಾಟಕ ವಿದ್ಯಾವರ್ಧಕ ಸಂಘ ಸ್ಥಾಪನೆ`],
[`1916`,`ಈ. ಕರ್ನಾಟಕ ಸಭೆ ಸಂಸ್ಥೆ ಪ್ರಾರಂಭ`],
[`1915`,`ಆ. ಕರ್ನಾಟಕ ಸಾಹಿತ್ಯ ಪರಿಷತ್ತು ಸ್ಥಾಪನೆ`],
[`1956`,`ಉ. ಮೈಸೂರು ರಾಜ್ಯ ಉದಯ`],
[`1973`,`ಅ. ಕರ್ನಾಟಕ ರಾಜ್ಯ ಎಂಬ ಹೆಸರು ಬಂದಿದ್ದು`]]],
[`ಆ. ಕೆಳಗಿನ ಪದಗಳನ್ನು ಬಳಸಿ ಸ್ವಂತ ವಾಕ್ಯ ರಚಿಸಿರಿ`,[
[`ಹೋರಾಟ`,`ಮಾದರಿ: ನಮ್ಮ ಹಿರಿಯರು ಸ್ವಾತಂತ್ರ್ಯಕ್ಕಾಗಿ ಹೋರಾಟ ಮಾಡಿದರು.`],
[`ಸವಾಲು`,`ಮಾದರಿ: ಪರೀಕ್ಷೆಯ ಸವಾಲನ್ನು ಧೈರ್ಯದಿಂದ ಎದುರಿಸಬೇಕು.`],
[`ಕಲ್ಪಿಸು`,`ಮಾದರಿ: ಸರ್ಕಾರ ಬಡ ಮಕ್ಕಳಿಗೆ ಶಿಕ್ಷಣದ ಸೌಲಭ್ಯ ಕಲ್ಪಿಸಿದೆ.`],
[`ಅಗ್ರಗಣ್ಯ`,`ಮಾದರಿ: ಆಲೂರು ವೆಂಕಟರಾಯರು ಏಕೀಕರಣ ಹೋರಾಟದ ಅಗ್ರಗಣ್ಯರಲ್ಲಿ ಒಬ್ಬರು.`],
[`ಪ್ರತಿಭೆ`,`ಮಾದರಿ: ಪ್ರತಿ ಮಗುವಿನಲ್ಲೂ ಒಂದಲ್ಲ ಒಂದು ಪ್ರತಿಭೆ ಇರುತ್ತದೆ.`]]],
[`ಇ. ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರಿಸಿರಿ`,[
[`ರೇಡಿಯೋದಲ್ಲಿ ಯಾವ ನುಡಿ ಹರಿದು ಬಂತು?`,`"ಆಕಾಶವಾಣಿ, ಇದೀಗ ಮಕ್ಕಳ ಕಾರ್ಯಕ್ರಮ. ಕರ್ನಾಟಕ ಏಕೀಕರಣದಲ್ಲಿ ಭಾಗವಹಿಸಿದ ಹಿರಿಯರೊಬ್ಬರು ತಮ್ಮ ಅನುಭವಗಳನ್ನು ಪ್ರಸ್ತುತಪಡಿಸುತ್ತಾರೆ" ಎಂಬ ನುಡಿ ಹರಿದು ಬಂತು.`],
[`ಬ್ರಿಟಿಷರ ಆಳ್ವಿಕೆಯಲ್ಲಿ ಕನ್ನಡಿಗರು ಒಟ್ಟಾಗಿರಲು ಅವಕಾಶವೇ ಇರಲಿಲ್ಲ. ಯಾಕೆ?`,`ಮೈಸೂರು ಸಂಸ್ಥಾನ ಹೊರತುಪಡಿಸಿ ಉಳಿದ ಕನ್ನಡ ಪ್ರದೇಶಗಳು ಮುಂಬೈ, ಮದ್ರಾಸ್, ಕೊಡಗು ಮತ್ತು ಇತರ ಸಂಸ್ಥಾನಗಳಲ್ಲಿ ಹಂಚಿಹೋಗಿದ್ದವು; ಬ್ರಿಟಿಷರ ಆಳ್ವಿಕೆಯಲ್ಲಿ ಒಟ್ಟಾಗಲು ಅವಕಾಶವಿರಲಿಲ್ಲ.`],
[`ಕನ್ನಡದ ಪರವಾಗಿ ಹೋರಾಟ ಮಾಡಿದವರಲ್ಲಿ ಕೆಲವರ ಹೆಸರು ತಿಳಿಸಿ.`,`ರಾ.ಹ. ದೇಶಪಾಂಡೆ, ರೊದ್ದ ಶ್ರೀನಿವಾಸ ರಾವ್, ಆಲೂರು ವೆಂಕಟರಾಯ, ಡೆಪ್ಯೂಟಿ ಚೆನ್ನಬಸಪ್ಪ.`],
[`ವಂಗಭಂಗ ಚಳುವಳಿಯನ್ನು ಯಾರು ನಡೆಸಿದರು?`,`ಬಂಗಾಳಿಗಳು ನಡೆಸಿದರು.`],
[`ವಿದ್ಯಾವರ್ಧಕ ಸಂಘದ ಕೆಲಸವೇನಾಗಿತ್ತು?`,`ಕನ್ನಡದಲ್ಲಿ ಶಿಕ್ಷಣ, ಕನ್ನಡದಲ್ಲಿ ಸ್ವತಂತ್ರ ಕೃತಿಗಳ ರಚನೆ, 'ವಾಗ್ಭೂಷಣ' ಮಾಸಪತ್ರಿಕೆಯ ಪ್ರಕಟಣೆ – ಇವು ಅದರ ಕೆಲಸಗಳಾಗಿದ್ದವು.`],
[`ನಮ್ಮ ರಾಜ್ಯಕ್ಕೆ ಕರ್ನಾಟಕ ಎಂಬ ಹೆಸರು ಯಾವಾಗ ಬಂದಿತು?`,`1973ರ ನವೆಂಬರ್ 1ರಂದು.`]]],
[`ಈ. ಎರಡು–ಮೂರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರಿಸಿರಿ`,[
[`ಕನ್ನಡನಾಡು ಏಕೀಕರಣಗೊಳ್ಳಲು ಕನ್ನಡಿಗರಿಗೆ ಪ್ರೇರಣೆಯಾದ ಘಟನೆ ಯಾವುದು?`,`1905ರ ಆಗಸ್ಟ್ 16ರಂದು ಬ್ರಿಟಿಷ್ ಸರ್ಕಾರ ಬಂಗಾಳ ರಾಜ್ಯವನ್ನು ವಿಭಜಿಸಿತು. ಇದನ್ನು ವಿರೋಧಿಸಿ ಬಂಗಾಳಿಗರು 'ವಂಗಭಂಗ' ಚಳುವಳಿ ನಡೆಸಿದರು. ಸರ್ಕಾರ 1911ರಲ್ಲಿ ಮತ್ತೆ ಬಂಗಾಳವನ್ನು ಒಂದು ಮಾಡಿತು. ಈ ಘಟನೆಯಿಂದ ಪ್ರೇರಿತರಾಗಿ ಕನ್ನಡದ ಕಟ್ಟಾಳುಗಳು ಏಕೀಕರಣದ ಹೋರಾಟ ಆರಂಭಿಸಿದರು.`],
[`'ಕನ್ನಡ ಸಾಹಿತ್ಯ ಪರಿಷತ್ತು' ಕರ್ನಾಟಕ ಏಕೀಕರಣದ ಬೇಡಿಕೆಗೆ ವೇದಿಕೆ ಕಲ್ಪಿಸಿದ್ದು ಹೇಗೆ?`,`ಪರಿಷತ್ತು ಕನ್ನಡ ಗ್ರಂಥಗಳ ಪ್ರಕಟಣೆ, ಸಂಶೋಧನೆ, ನಿಘಂಟು ರಚನೆ ಮುಂತಾದ ಸವಾಲುಗಳನ್ನು ಎದುರಿಸಿತು. ಕನ್ನಡ ಮನ–ಮನೆ ಮುಟ್ಟಲು ಕನ್ನಡ ಸಾಹಿತ್ಯ ಸಮ್ಮೇಳನಗಳನ್ನು ಆಯೋಜಿಸಿ ಕನ್ನಡಿಗರನ್ನು ಒಂದುಗೂಡಿಸಿತು; ಹೀಗೆ ಏಕೀಕರಣದ ಬೇಡಿಕೆಗೆ ವೇದಿಕೆ ಕಲ್ಪಿಸಿತು.`],
[`ಕರ್ನಾಟಕ ಸಭೆಯ ಮೊದಲ ಕಾರ್ಯಕ್ರಮದಲ್ಲಿ ಏನೆಲ್ಲಾ ಘಟನೆಗಳು ನಡೆದವು?`,`ಗಾಂಧೀಜಿಯವರ ಅಧ್ಯಕ್ಷತೆಯಲ್ಲಿ ಕಾಂಗ್ರೆಸ್ ಮಹಾಧಿವೇಶನ ನಡೆದ ಸಂದರ್ಭದಲ್ಲಿ, 25–12–1924ರಂದು ಸರ್ ಸಿದ್ದಪ್ಪ ಕಂಬಳಿಯವರ ಅಧ್ಯಕ್ಷತೆಯಲ್ಲಿ 'ಕರ್ನಾಟಕ ಸಭೆ'ಯ ಮೊದಲ ಕಾರ್ಯಕ್ರಮ ನಡೆಯಿತು. ಹುಯಿಲಗೋಳ ನಾರಾಯಣರಾಯರು ರಚಿಸಿದ 'ಉದಯವಾಗಲಿ ನಮ್ಮ ಚೆಲುವ ಕನ್ನಡ ನಾಡು' ಗೀತೆಯನ್ನು ಮೊದಲಬಾರಿಗೆ ಹಾಡಲಾಯಿತು. ಇದರ ಪರಿಣಾಮವಾಗಿ ಮದ್ರಾಸ್ ಮತ್ತು ಮುಂಬೈ ವಿಧಾನ ಸಭೆಗಳಲ್ಲೂ ಏಕೀಕರಣದ ವಿಷಯ ಪ್ರಸ್ತಾಪಿತವಾಯಿತು.`]]],
[`ಉ. ಐದು–ಆರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರಿಸಿರಿ`,[
[`ಬಂಗಾಳದಲ್ಲಿ ನಡೆದ 'ವಂಗ ಭಂಗ' ಚಳುವಳಿಯ ಬಗ್ಗೆ ಬರೆಯಿರಿ.`,`ಬ್ರಿಟಿಷರದು ಒಡೆದು ಆಳುವ ನೀತಿ. ಅದರಂತೆ 1905ರ ಆಗಸ್ಟ್ 16ರಂದು ಬಂಗಾಳ ರಾಜ್ಯವನ್ನು ವಿಭಜಿಸಲು ಬ್ರಿಟಿಷ್ ಸರ್ಕಾರ ಮುಂದಾಯಿತು. ಇದನ್ನು ಪ್ರತಿಭಟಿಸಿದ ಬಂಗಾಳಿಗರು 'ವಂಗಭಂಗ' ಎಂಬ ಬೃಹತ್ ಚಳುವಳಿ ನಡೆಸಿದರು (ವಂಗ = ಬಂಗಾಳ). ಚಳುವಳಿಗೆ ಮಣಿದ ಸರ್ಕಾರ 1911ರಲ್ಲಿ ಪುನಃ ಬಂಗಾಳವನ್ನು ಒಂದು ಮಾಡಿತು. ಈ ಘಟನೆ ಕನ್ನಡಿಗರಿಗೂ ಒಂದಾಗಿ ಹೋರಾಡಲು ಪ್ರೇರಣೆ ನೀಡಿತು.`]]],
[`ಊ. ಪರಿಚ್ಛೇದವನ್ನು ಓದಿ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ (ಲಾಲ್ ಬಹಾದ್ದೂರ್ ಶಾಸ್ತ್ರಿ)`,[
[`ಲಾಲ್ ಬಹಾದ್ದೂರ್ ಶಾಸ್ತ್ರಿಯವರು ಯಾವ ಉನ್ನತ ಪದವಿಗೇರಿದರು?`,`ರಾಷ್ಟ್ರದ ಉನ್ನತ ಹುದ್ದೆಯಾದ ಪ್ರಧಾನಿ ಪದವಿಗೇರಿದರು.`],
[`ಲಾಲ್ ಬಹಾದ್ದೂರ್ ಶಾಸ್ತ್ರಿಯವರು ಎಲ್ಲಿ, ಯಾವಾಗ ಜನಿಸಿದರು?`,`1904ರ ಅಕ್ಟೋಬರ್ 2ರಂದು ವಾರಣಾಸಿ ಹತ್ತಿರದ ಮೊಗಲ್‌ಸರಾಯಿಯಲ್ಲಿ ಜನಿಸಿದರು.`],
[`ತಂದೆ ತೀರಿಕೊಂಡ ಬಳಿಕ ಶಾಸ್ತ್ರಿಯವರು ಹೇಗೆ ಬೆಳೆದರು?`,`ಒಂದೂವರೆ ವರ್ಷದ ಮಗುವಾಗಿದ್ದಾಗಲೇ ತಂದೆ ತೀರಿಕೊಂಡರು. ತಾಯಿಯ ಆರೈಕೆಯಲ್ಲಿ ಅಜ್ಜನ ಮನೆಯಲ್ಲಿ ಬೆಳೆದರು.`],
[`'ಅಕ್ಟೋಬರ್ 2' ಇಬ್ಬರು ಮಹಾನ್ ವ್ಯಕ್ತಿಗಳ ಜನ್ಮದಿನ. ಅವರ ಹೆಸರೇನು?`,`ಮಹಾತ್ಮ ಗಾಂಧೀಜಿ ಮತ್ತು ಲಾಲ್ ಬಹಾದ್ದೂರ್ ಶಾಸ್ತ್ರಿ. ⚠ ಗಾಂಧೀಜಿಯವರ ಜನ್ಮದಿನವೂ ಅಕ್ಟೋಬರ್ 2 ಎಂಬುದು ಸಾಮಾನ್ಯ ಜ್ಞಾನ.`],
[`ದೋಣಿ ದಾಟಿಸುವವನಿಗೆ ಕೊಡಲು ಹಣವಿಲ್ಲದಾಗ ಶಾಸ್ತ್ರಿ ಏನು ಮಾಡಿದರು?`,`ಗೆಳೆಯರ ಬಳಿ ಕೈಚಾಚಲು ಮನಸ್ಸಿರಲಿಲ್ಲ; ಸಂಜೆಯಾಗುತ್ತಿದ್ದಂತೆ ತುಂಬಿ ಹರಿಯುತ್ತಿದ್ದ ಗಂಗಾ ನದಿಯಲ್ಲಿ ಧುಮುಕಿ ಈಜಿ ಮನೆ ಸೇರಿದರು.`]]],
[`ಋ. ಚಿಕ್ಕ ಪ್ರಬಂಧ: ದೂರದರ್ಶನ ವೀಕ್ಷಣೆಯ ಸಾಧಕ–ಬಾಧಕಗಳು`,[
[`ಮಾದರಿ ಅಂಶಗಳು`,`ಪ್ರಸ್ತಾವನೆ: ದೂರದರ್ಶನ (ಟಿವಿ) ಮನರಂಜನೆ ಮತ್ತು ಮಾಹಿತಿಯ ಸಾಧನ. ಸಾಧಕಗಳು: ಸುದ್ದಿ, ಜ್ಞಾನ, ಶೈಕ್ಷಣಿಕ ಕಾರ್ಯಕ್ರಮ, ಮನರಂಜನೆ. ಬಾಧಕಗಳು: ಅತಿಯಾದ ವೀಕ್ಷಣೆಯಿಂದ ಕಣ್ಣಿಗೆ ಹಾನಿ, ಓದಿಗೆ ಸಮಯ ಕಡಿಮೆ, ಆಟ–ಪಾಠಕ್ಕೆ ತೊಂದರೆ. ಉಪಸಂಹಾರ: ಮಿತವಾಗಿ, ಒಳ್ಳೆಯ ಕಾರ್ಯಕ್ರಮಗಳನ್ನು ಮಾತ್ರ ನೋಡಬೇಕು. (ಮಾದರಿ)`]]],
[`ವ್ಯಾಕರಣ ಮಾಹಿತಿ – ಪತ್ರ ಲೇಖನ (ವ್ಯಾವಹಾರಿಕ ಪತ್ರ / ಅರ್ಜಿ)`,[
[`ವ್ಯಾವಹಾರಿಕ ಪತ್ರದ ಹಂತಗಳನ್ನು ತಿಳಿಸಿ.`,`1) ಬರೆಯುವವರ ವಿಳಾಸ ಮತ್ತು ದಿನಾಂಕ (ಲೆಟರ್ ಹೆಡ್ ಇದ್ದರೆ ದಿನಾಂಕ ಮಾತ್ರ); 2) ಯಾರಿಗೆ ಬರೆಯುತ್ತೇವೆಯೋ ಅವರ ವಿಳಾಸ (ಎಡಭಾಗ); 3) ಮಾನ್ಯರೇ / ಮಹನೀಯರೇ ಎಂಬ ಸಂಬೋಧನೆ; 4) ವಿಷಯ; 5) ಒಡಲು (ವಿಷಯದ ವಿವರಣೆ); 6) 'ವಂದನಾಪೂರ್ವಕ / ವಂದನೆಗಳೊಂದಿಗೆ' ಎಂಬ ಮುಕ್ತಾಯ; 7) ಕೊನೆಯಲ್ಲಿ ನಿಮ್ಮ ನಂಬುಗೆಯ / ವಿಶ್ವಾಸಿ ಎಂದು ಬರೆದು ಸಹಿ. ಲಕೋಟೆಯ ಮೇಲೂ ವಿಳಾಸ ಬರೆಯಬೇಕು.`],
[`ಖಾಸಗಿ ಪತ್ರಕ್ಕೂ ವ್ಯಾವಹಾರಿಕ ಪತ್ರಕ್ಕೂ ಇರುವ ವ್ಯತ್ಯಾಸ ಏನು?`,`ಖಾಸಗಿ ಪತ್ರದಲ್ಲಿ ಯಾರಿಗೆ ಬರೆಯುತ್ತೇವೆಯೋ ಅವರ ವಿಳಾಸವನ್ನು ಕೊನೆಯಲ್ಲಿ ಮಾತ್ರ ಬರೆಯುತ್ತೇವೆ ಮತ್ತು 'ವಿಷಯ' ಎಂಬ ಹಂತ ಇರುವುದಿಲ್ಲ. ವ್ಯಾವಹಾರಿಕ ಪತ್ರದಲ್ಲಿ ವಿಳಾಸವನ್ನು ಎರಡನೆಯ ಹಂತದಲ್ಲಿ ಬರೆಯುತ್ತೇವೆ ಮತ್ತು ವಿಷಯ ಹಂತ ಇರುತ್ತದೆ; ನಿರ್ದಿಷ್ಟ ಉದ್ದೇಶವಿರುತ್ತದೆ.`]]],
[`ವ್ಯಾಕರಣ ಮಾಹಿತಿ – ಪ್ರಬಂಧ ರಚನೆ`,[
[`ಪ್ರಬಂಧ ಎಂದರೇನು?`,`ಅರ್ಥಪೂರ್ಣ ವಾಕ್ಯಗಳಲ್ಲಿ ನಿರ್ದಿಷ್ಟ ವಿಷಯವನ್ನು ಕ್ರಮಬದ್ಧವಾಗಿ ನಿರೂಪಿಸಿದರೆ ಅದನ್ನು ಪ್ರಬಂಧ ಎನ್ನುವರು. ಒಂದೇ ವಿಷಯವನ್ನು ಕುರಿತಾದ ಅನೇಕ ವಾಕ್ಯಗಳ ಸಮುಚ್ಚಯವೇ ಪ್ರಬಂಧ.`],
[`ಪ್ರಬಂಧ ಬರೆಯುವ ಮೊದಲು ಅನುಸರಿಸಬೇಕಾದ ಸೂಚನೆಗಳು ಯಾವುವು?`,`ವಿಷಯ ಸಂಗ್ರಹ (ವಿಚಾರ–ಸಂಗತಿಗಳನ್ನು ಸಂಗ್ರಹಿಸುವುದು), ಕ್ರಮ ಬದ್ಧತೆ (ಯಾವ ವಿಷಯ ಮೊದಲು, ಯಾವುದು ನಂತರ ಎಂದು ನಿರ್ಧರಿಸುವುದು), ಭಾಷೆ ಮತ್ತು ಶೈಲಿ (ಸಮರ್ಥ ಶಬ್ದಗಳ ಬಳಕೆ, ಶುದ್ಧ ವಾಕ್ಯರಚನೆ, ಗ್ರಾಂಥಿಕ ಪದಗಳು, ಚಿಕ್ಕ ವಾಕ್ಯಗಳು).`],
[`ಪ್ರಬಂಧದ ಮೂರು ಪ್ರಧಾನ ಹಂತಗಳು ಯಾವುವು?`,`ಪ್ರಸ್ತಾವನೆ, ವಿಷಯ ವಿವರಣೆ, ವಿಷಯದ ಸಮಾಪ್ತಿ ಅಥವಾ ಉಪಸಂಹಾರ.`]]],
[`ಭಾಷಾ ಆಟ – 64 ಅಂಕಣಗಳಲ್ಲಿ ಭಾಷೆಗಳ ಹೆಸರು ಹುಡುಕಿ`,[
[`ಚೌಕದಲ್ಲಿ ಅಡಗಿರುವ ಭಾಷೆಗಳು`,`ಭಾರತದ ಭಾಷೆಗಳ ಹೆಸರುಗಳನ್ನು (ಉದಾ: ಕನ್ನಡ, ತೆಲುಗು, ತಮಿಳು, ಮಲಯಾಳಂ, ತುಳು, ಕೊಂಕಣಿ, ಹಿಂದಿ, ಉರ್ದು, ಬಂಗಾಳಿ, ಗುಜರಾತಿ, ಪಂಜಾಬಿ, ಸಂಸ್ಕೃತ, ಮರಾಠಿ) ಅಕ್ಷರಗಳನ್ನು ಜೋಡಿಸಿ ಪತ್ತೆ ಮಾಡಬೇಕು. ⚠ ಸೂಚಿತ – ಚೌಕವನ್ನು ನೋಡಿ ದೃಢಪಡಿಸಿ.`]]]
],
qb:[
M(`ವಂಗಭಂಗ ಚಳುವಳಿ ನಡೆದದ್ದು ಎಲ್ಲಿ?`,[`ಬಂಗಾಳ`,`ಬಿಹಾರ`,`ಮೈಸೂರು`,`ಗುಜರಾತ್`],0),
M(`ಕರ್ನಾಟಕ ವಿದ್ಯಾವರ್ಧಕ ಸಂಘ ಸ್ಥಾಪನೆಯಾದ ನಗರ:`,[`ಬೆಂಗಳೂರು`,`ಧಾರವಾಡ`,`ಮೈಸೂರು`,`ಹುಬ್ಬಳ್ಳಿ`],1),
M(`'ವಾಗ್ಭೂಷಣ' ಎಂಬ ಮಾಸಪತ್ರಿಕೆಯನ್ನು ಆರಂಭಿಸಿದ ಸಂಸ್ಥೆ:`,[`ಕರ್ನಾಟಕ ಸಭೆ`,`ಕರ್ನಾಟಕ ವಿದ್ಯಾವರ್ಧಕ ಸಂಘ`,`ಕನ್ನಡ ಸಾಹಿತ್ಯ ಪರಿಷತ್ತು`,`ಕಾಂಗ್ರೆಸ್`],1),
M(`ಕರ್ನಾಟಕ ರಾಜ್ಯ ಎಂದು ಹೆಸರು ಬಂದ ವರ್ಷ:`,[`1947`,`1956`,`1973`,`1924`],2),
M(`'ಅಸಹನೀಯ' ಪದದ ಅರ್ಥ:`,[`ಸಹಿಸಲು ಸಾಧ್ಯವಿಲ್ಲದ`,`ಒಳ್ಳೆಯ`,`ಸುಂದರ`,`ಕಠಿಣ`],0),
M(`ಲಾಲ್ ಬಹಾದ್ದೂರ್ ಶಾಸ್ತ್ರಿ ಯಾವ ಹುದ್ದೆಗೇರಿದರು?`,[`ರಾಷ್ಟ್ರಪತಿ`,`ಪ್ರಧಾನಿ`,`ರಾಜ್ಯಪಾಲ`,`ಮುಖ್ಯಮಂತ್ರಿ`],1,'m'),
O(`ವಂಗಭಂಗ ಚಳುವಳಿಯನ್ನು ಯಾರು ನಡೆಸಿದರು?`,`ಬಂಗಾಳಿಗರು.`),
O(`ಕರ್ನಾಟಕ ವಿದ್ಯಾವರ್ಧಕ ಸಂಘವನ್ನು ಸ್ಥಾಪಿಸಿದವರು ಯಾರು?`,`ರಾ.ಹ. ದೇಶಪಾಂಡೆ ಹಾಗೂ ಸಮಾನ ಮನಸ್ಕ ಕನ್ನಡಿಗರು.`),
O(`ಕರ್ನಾಟಕ ಸಾಹಿತ್ಯ ಪರಿಷತ್ತು ಯಾವ ವರ್ಷ ಸ್ಥಾಪನೆಯಾಯಿತು?`,`1915.`),
O(`'ಉದಯವಾಗಲಿ ನಮ್ಮ ಚೆಲುವ ಕನ್ನಡ ನಾಡು' ಗೀತೆಯನ್ನು ರಚಿಸಿದವರು ಯಾರು?`,`ಹುಯಿಲಗೋಳ ನಾರಾಯಣರಾಯರು.`),
O(`ಕರ್ನಾಟಕ ಸಭೆ ಯಾವ ವರ್ಷ ಸ್ಥಾಪನೆಯಾಯಿತು?`,`1916.`),
O(`ಮೈಸೂರು ರಾಜ್ಯ ಉದಯವಾದ ದಿನ ಯಾವುದು?`,`1956ರ ನವೆಂಬರ್ 1.`),
G(`'ಅಸ್ತಿತ್ವ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಇರುವಿಕೆ`,'e'),
G(`'ಆಂದೋಲನ' ಪದದ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಚಳುವಳಿ / ಕ್ರಾಂತಿ`,'e'),
G(`'ವಿಭಜನೆ' ಪದದ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ವಿಂಗಡಣೆ / ಬೇರ್ಪಡಿಸುವಿಕೆ`),
G(`'ನಿಘಂಟು' ಎಂದರೇನು?`,`ಶಬ್ದಕೋಶ / ಶಬ್ದಾರ್ಥ ಸಂಗ್ರಹ`),
G(`ಹೊಂದಿಸಿ ಬರೆಯಿರಿ: 1890 – ?`,`ಕರ್ನಾಟಕ ವಿದ್ಯಾವರ್ಧಕ ಸಂಘ ಸ್ಥಾಪನೆ`),
G(`ಹೊಂದಿಸಿ ಬರೆಯಿರಿ: 1973 – ?`,`ಕರ್ನಾಟಕ ರಾಜ್ಯ ಎಂಬ ಹೆಸರು ಬಂದಿದ್ದು`),
S(`ಕರ್ನಾಟಕ ಏಕೀಕರಣಕ್ಕೆ ಪ್ರೇರಣೆಯಾದ ಘಟನೆ ಯಾವುದು?`,`1905ರಲ್ಲಿ ಬ್ರಿಟಿಷ್ ಸರ್ಕಾರ ಬಂಗಾಳವನ್ನು ವಿಭಜಿಸಿತು. ಅದನ್ನು ವಿರೋಧಿಸಿ ಬಂಗಾಳಿಗರು 'ವಂಗಭಂಗ' ಚಳುವಳಿ ನಡೆಸಿದರು; ಸರ್ಕಾರ 1911ರಲ್ಲಿ ಬಂಗಾಳವನ್ನು ಪುನಃ ಒಂದು ಮಾಡಿತು. ಇದರಿಂದ ಪ್ರೇರಿತರಾಗಿ ಕನ್ನಡಿಗರು ಏಕೀಕರಣಕ್ಕಾಗಿ ಹೋರಾಟ ಆರಂಭಿಸಿದರು.`),
S(`ಕರ್ನಾಟಕ ವಿದ್ಯಾವರ್ಧಕ ಸಂಘದ ಕೆಲಸವೇನು?`,`ಕನ್ನಡದಲ್ಲಿ ಶಿಕ್ಷಣ ನೀಡುವುದು, ಕನ್ನಡದಲ್ಲಿ ಸ್ವತಂತ್ರ ಕೃತಿಗಳನ್ನು ರಚಿಸುವುದು ಹಾಗೂ 'ವಾಗ್ಭೂಷಣ' ಮಾಸಪತ್ರಿಕೆಯನ್ನು ಪ್ರಕಟಿಸುವುದು ಇದರ ಕೆಲಸವಾಗಿತ್ತು. ಇದು ಕನ್ನಡಿಗರೆಲ್ಲ ಒಂದಾಗಲು ಪ್ರೇರಣೆ ನೀಡಿತು.`),
S(`ಕನ್ನಡ ಸಾಹಿತ್ಯ ಪರಿಷತ್ತಿನ ಸಾಧನೆಗಳನ್ನು ಬರೆಯಿರಿ.`,`ಕನ್ನಡ ಗ್ರಂಥಗಳ ಪ್ರಕಟಣೆ, ಸಂಶೋಧನೆ, ನಿಘಂಟು ರಚನೆ ಮುಂತಾದ ಸವಾಲುಗಳನ್ನು ಎದುರಿಸಿತು. ಕನ್ನಡ ಸಾಹಿತ್ಯ ಸಮ್ಮೇಳನಗಳನ್ನು ಆಯೋಜಿಸಿ ಕನ್ನಡಿಗರನ್ನು ಒಂದುಗೂಡಿಸಿ ಏಕೀಕರಣದ ಬೇಡಿಕೆಗೆ ವೇದಿಕೆ ಕಲ್ಪಿಸಿತು.`),
S(`ವ್ಯಾವಹಾರಿಕ ಪತ್ರ ಬರೆಯುವ ಹಂತಗಳನ್ನು ಪಟ್ಟಿ ಮಾಡಿ.`,`ಬರೆಯುವವರ ವಿಳಾಸ–ದಿನಾಂಕ, ಯಾರಿಗೆ ಬರೆಯುತ್ತೇವೆಯೋ ಅವರ ವಿಳಾಸ, ಸಂಬೋಧನೆ (ಮಾನ್ಯರೇ), ವಿಷಯ, ಒಡಲು, 'ವಂದನೆಗಳೊಂದಿಗೆ' ಮುಕ್ತಾಯ, ನಂಬುಗೆಯ/ವಿಶ್ವಾಸಿ ಎಂದು ಬರೆದು ಸಹಿ – ಹೀಗೆ ಏಳು ಹಂತಗಳು.`),
L(`ಕರ್ನಾಟಕ ಏಕೀಕರಣದ ಚಳುವಳಿಯ ಪ್ರಮುಖ ಘಟನೆಗಳನ್ನು ಕ್ರಮವಾಗಿ ವಿವರಿಸಿ.`,`ಬ್ರಿಟಿಷರ ಆಳ್ವಿಕೆಯಲ್ಲಿ ಕನ್ನಡಿಗರು ಬೇರೆ ಬೇರೆ ಸಂಸ್ಥಾನ–ಪ್ರಾಂತ್ಯಗಳಲ್ಲಿ ಹಂಚಿಹೋಗಿದ್ದರು. 1905ರ ಬಂಗಾಳ ವಿಭಜನೆ ಮತ್ತು 'ವಂಗಭಂಗ' ಚಳುವಳಿ ಕನ್ನಡಿಗರಿಗೆ ಪ್ರೇರಣೆಯಾಯಿತು. ರಾ.ಹ. ದೇಶಪಾಂಡೆಯವರು 1890ರಲ್ಲಿ ಧಾರವಾಡದಲ್ಲಿ ಕರ್ನಾಟಕ ವಿದ್ಯಾವರ್ಧಕ ಸಂಘ ಸ್ಥಾಪಿಸಿದರು. 1915ರಲ್ಲಿ ಬೆಂಗಳೂರಿನಲ್ಲಿ ಕರ್ನಾಟಕ ಸಾಹಿತ್ಯ ಪರಿಷತ್ತು ಸ್ಥಾಪನೆಯಾಯಿತು. 1916ರಲ್ಲಿ ಆಲೂರು ವೆಂಕಟರಾಯ, ಗದಿಗೆಯ್ಯ ಹೊನ್ನಾಪುರಮಠ, ಕಡಪಾ ರಾಘವೇಂದ್ರರಾಯರು ಕರ್ನಾಟಕ ಸಭೆ ಕಟ್ಟಿದರು. 1924ರಲ್ಲಿ ಬೆಳಗಾವಿಯಲ್ಲಿ ಗಾಂಧೀಜಿ ಅಧ್ಯಕ್ಷತೆಯ ಕಾಂಗ್ರೆಸ್ ಅಧಿವೇಶನ ನಡೆಯಿತು; ಅಲ್ಲೇ ಕರ್ನಾಟಕ ಸಭೆಯ ಮೊದಲ ಕಾರ್ಯಕ್ರಮ ನಡೆಯಿತು. 1947ರಲ್ಲಿ ದೇಶಕ್ಕೆ ಸ್ವಾತಂತ್ರ್ಯ ಬಂತು; 1956ರ ನವೆಂಬರ್ 1ರಂದು ಕನ್ನಡಿಗರು ಒಂದೇ ರಾಜ್ಯದ ಆಡಳಿತಕ್ಕೆ ಬಂದು 'ಮೈಸೂರು ರಾಜ್ಯ' ಉದಯವಾಯಿತು. 1973ರ ನವೆಂಬರ್ 1ರಂದು 'ಕರ್ನಾಟಕ ರಾಜ್ಯ' ಎಂಬ ಹೆಸರು ಬಂದಿತು.`),
L(`ಬ್ರಿಟಿಷರ ಆಳ್ವಿಕೆಯಲ್ಲಿ ಕನ್ನಡಿಗರು ಎದುರಿಸಿದ ತೊಂದರೆಗಳನ್ನು ಮತ್ತು ಏಕೀಕರಣಕ್ಕಾಗಿ ಕೈಗೊಂಡ ಕಾರ್ಯಗಳನ್ನು ವಿವರಿಸಿ.`,`ಮೈಸೂರು ಸಂಸ್ಥಾನ ಹೊರತುಪಡಿಸಿ ಕನ್ನಡ ಪ್ರದೇಶಗಳು ಮುಂಬೈ, ಮದ್ರಾಸ್, ಕೊಡಗು ಮತ್ತಿತರ ಸಂಸ್ಥಾನಗಳಲ್ಲಿ ಹಂಚಿಹೋಗಿದ್ದರಿಂದ ಕನ್ನಡಿಗರು ಪರಕೀಯರಂತೆ ಜೀವನ ನಡೆಸುವ ಅಸಹನೀಯ ಪರಿಸ್ಥಿತಿ ಇತ್ತು. ಇದನ್ನು ಬದಲಾಯಿಸಲು ವಿದ್ಯಾವರ್ಧಕ ಸಂಘ, ಸಾಹಿತ್ಯ ಪರಿಷತ್ತು, ಕರ್ನಾಟಕ ಸಭೆಗಳು ಸ್ಥಾಪನೆಯಾದವು. ಕನ್ನಡದಲ್ಲಿ ಶಿಕ್ಷಣ, ಗ್ರಂಥ ಪ್ರಕಟಣೆ, ಸಾಹಿತ್ಯ ಸಮ್ಮೇಳನಗಳು, ಸಭೆಗಳ ಮೂಲಕ ಕನ್ನಡಿಗರನ್ನು ಒಂದುಗೂಡಿಸಿ ಏಕೀಕರಣದ ಬೇಡಿಕೆಗೆ ವೇದಿಕೆ ಒದಗಿಸಲಾಯಿತು. ಆಲೂರು ವೆಂಕಟರಾಯ, ರಾ.ಹ. ದೇಶಪಾಂಡೆ ಮುಂತಾದವರು ಅಗ್ರಗಣ್ಯರಾಗಿದ್ದರು.`)
]});

LS6.push({n:5,t:`ನೀ ನನಗಿದ್ದರೆ (ಪದ್ಯ 5)`,au:`ಕಯ್ಯಾರ ಕಿಞ್ಞಣ್ಣ ರೈ`,pg:33,
words:`ಹೊರೆ – ತೂಕ, ಭಾರ, ಕಂತೆ; ಕಂಗಾಲು – ಅಶಕ್ತವಾಗು, ದುರ್ಬಲವಾಗು; ಉಪಕಾರ – ಸಹಾಯ; ಸೊಕ್ಕು – ಮದ, ಗರ್ವ, ಬೀಗು; ಹಿಗ್ಗು – ಸಂತೋಷ; ಚಾಳಿಸು – ಹೀಯಾಳಿಸು, ಪೀಡಿಸು`,
notes:`ಹಿಂಡಿ – ಎಣ್ಣೆಯ ಕಾಳುಗಳಿಂದ ರಸ ತೆಗೆದ ಮೇಲೆ ಉಳಿಯುವ ಶೇಷ. ಮಣ – ತೂಕದ ಒಂದು ಪ್ರಮಾಣ. ಕವಿ: ಕಯ್ಯಾರ ಕಿಞ್ಞಣ್ಣ ರೈ (ಜೂನ್ 8, 1915 – ಆಗಸ್ಟ್ 9, 2015), ಕಾಸರಗೋಡು ಜಿಲ್ಲೆಯ ಕಯ್ಯಾರ ಗ್ರಾಮದವರು; ಶಿಕ್ಷಕ, ಸಾಹಿತಿ, ಪತ್ರಿಕೋದ್ಯಮಿ, ಸ್ವಾತಂತ್ರ್ಯ ಹೋರಾಟಗಾರ; ಶ್ರೀಮುಖ, ಐಕ್ಯಗಾನ, ಗಂಧವತಿ (ಕವನ ಸಂಕಲನ), ಅನ್ನದೇವರು ಇತ್ಯಾದಿ ಕೃತಿಗಳು; 1915ರಲ್ಲಿ ಜನನ; ಅರವತ್ತಾರನೆಯ ಅಖಿಲ ಭಾರತ ಕನ್ನಡ ಸಾಹಿತ್ಯ ಸಮ್ಮೇಳನದ ಅಧ್ಯಕ್ಷರಾಗಿದ್ದರು. ಸಂದೇಶ: ಕಷ್ಟದಲ್ಲಿರುವವರಿಗೆ ಸಾಧ್ಯವಾದಷ್ಟು ಸಹಾಯ ಮಾಡಬೇಕು. ಕೌಶಲ: ಬರೆಯುವುದು. ವ್ಯಾಕರಣ ಮಾಹಿತಿ: ಸಮಾಸ.`,
ab:[
[`ಅ. ಬಿಟ್ಟ ಸ್ಥಳಗಳನ್ನು ಸರಿಯಾದ ಪದಗಳಿಂದ ಭರ್ತಿಮಾಡಿರಿ`,[
[`ಕತ್ತೆಯ ಬೆನ್ನಿಗೆ ______ ಕುದುರೆಯ ಜತೆಯಲಿ ______`,`ಹೇರಿಸಿದ; ಸಾಗಿಸಿದ`],
[`ನಡುಗಿತು ಕತ್ತೆಯ ______ ಬಿದ್ದಿತು ಭೂಮಿಗೆ ______`,`ಕೈಕಾಲು; ಕಂಗಾಲು`],
[`ಹೊತ್ತಿತು ಕುದುರೆಯು ______ ಅತ್ತಿತು ಬಗ್ಗಿಸಿತದು ______`,`ಹೊರೆಯನ್ನ; ಬೆನ್ನ`],
[`ಒಂದಿಷ್ಟಾದರು ______ ನನ್ನಯ ಪ್ರಾಣವ ______`,`ಹೊತ್ತುಬಿಡು; ಉಳಿಸಿಕೊಡು`]]],
[`ಆ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರಿಸಿರಿ`,[
[`ಭೀಮಣ್ಣನು ಎಲ್ಲಿಗೆ ಹೋದನು?`,`ಭೀಮಣ್ಣನು ಸಂತೆಗೆ ಹೋದನು.`],
[`ಭೀಮಣ್ಣನು ಏನನ್ನು ಕೊಂಡನು?`,`ಭೀಮಣ್ಣನು ಹತ್ತು ಮಣ ಹಿಂಡಿಯನ್ನು ಕೊಂಡನು.`],
[`ಕತ್ತೆಯು ಹೊರೆಯನ್ನು ಯಾರಿಗೆ ಹೊರು ಎಂದು ಕೇಳಿತು?`,`ಕತ್ತೆಯು ಹೊರೆಯನ್ನು (ಅರ್ಧವನ್ನು) ತನ್ನ ಗೆಳೆಯನಾದ ಕುದುರೆಗೆ ಹೊರು ಎಂದು ಕೇಳಿತು.`],
[`ಕುದುರೆಯು "ನನ್ನಯ ಪ್ರಾಣವ ಉಳಿಸು" ಎಂದು ಯಾರನ್ನು ಕೇಳಿತು?`,`ಕುದುರೆಯು ಕತ್ತೆಯನ್ನು ಕೇಳಿತು.`],
[`'ನೀ ನನಗಿದ್ದರೆ' ಈ ಪದ್ಯದ ನೀತಿ ಏನು?`,`ಕಷ್ಟದಲ್ಲಿರುವವರಿಗೆ ಸಾಧ್ಯವಾದಷ್ಟು ಸಹಾಯ ಮಾಡಬೇಕು; ಇಲ್ಲದಿದ್ದರೆ ನಮಗೆ ಕಷ್ಟ ಬಂದಾಗ ಯಾರೂ ಸಹಾಯ ಮಾಡುವುದಿಲ್ಲ.`]]],
[`ಇ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಎರಡು–ಮೂರು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರಿಸಿರಿ`,[
[`ಕತ್ತೆಯು ಸಹಾಯ ಕೇಳಿದಾಗ ಕುದುರೆ ಏನೆಂದು ಹೇಳಿತು?`,`ಕುದುರೆಯು ಸೊಕ್ಕಿನಿಂದ, "ನಿನ್ನ ಬೆನ್ನಿಗೇ ಹೊರೆ ಹಾಕಿದ್ದಾನೆ, ಅದಕ್ಕಾಗಿಯೇ ನಿನ್ನನ್ನು ಸಾಕಿದ್ದಾನೆ; ನೀನೇ ಹೊತ್ತುಕೊಂಡು ಬೇಗ ನಡೆ, ಆಯಾಸವಿಲ್ಲದೆ ಹಾದಿ ಹಿಡಿ" ಎಂದು ಹೇಳಿತು (ಹೀಯಾಳಿಸಿತು).`],
[`ಕುದುರೆಯು ಕತ್ತೆಯನ್ನು ಏನೆಂದು ಬೇಡಿಕೊಂಡಿತು?`,`ಹೊರೆಯ ಭಾರದಿಂದ ಕಂಗಾಲಾದ ಕುದುರೆಯು, "ನಿನ್ನ ಉಪಕಾರವನ್ನು ಮರೆಯುವುದಿಲ್ಲ. ಒಂದಿಷ್ಟಾದರೂ (ಹೊರೆಯನ್ನು) ಹೊತ್ತುಬಿಡು, ನನ್ನ ಪ್ರಾಣವನ್ನು ಉಳಿಸಿಕೊಡು" ಎಂದು ಬೇಡಿಕೊಂಡಿತು.`]]],
[`ಈ. ಈ ಪದಗಳನ್ನು ಬಿಡಿಸಿ ಬರೆದು ಸಂಧಿ ಹೆಸರಿಸಿ`,[
[`ನಿನ್ನುಪಕಾರ`,`ನಿನ್ನ + ಉಪಕಾರ – ಲೋಪ ಸಂಧಿ ⚠ ಸೂಚಿತ (ಕನ್ನಡ ಸಂಧಿ)`],
[`ಒಂದಿಷ್ಟಾದರು`,`ಒಂದು + ಇಷ್ಟು + ಆದರು – ಲೋಪ ಸಂಧಿ ⚠ ಸೂಚಿತ`],
[`ನನಗಿದ್ದರೆ`,`ನನಗೆ + ಇದ್ದರೆ – ಲೋಪ ಸಂಧಿ ⚠ ಸೂಚಿತ`],
[`ನಮ್ಮೊಳಗೆ`,`ನಮ್ಮ + ಒಳಗೆ – ಲೋಪ ಸಂಧಿ ⚠ ಸೂಚಿತ`]]],
[`ಉ. ಈ ಪದ್ಯದಲ್ಲಿ ಬಂದಿರುವ ಪ್ರಾಸ ಪದಗಳನ್ನು ಪಟ್ಟಿಮಾಡಿ`,[
[`ಪ್ರಾಸ ಪದಗಳು`,`ಅಂತ್ಯಪ್ರಾಸ ಉದಾ: ಹೇರಿಸಿದ – ಸಾಗಿಸಿದ; ಕೇಳಿಸಿತು – ಚಾಳಿಸಿತು; ಹಾಕಿದನು – ಸಾಕಿದನು; ನಡಿ – ಹಿಡಿ; ಭೀಮಣ್ಣ – ಮಣ (ಗುರುತಿಸಿ). ಆದಿಪ್ರಾಸ ಉದಾ: ಹೊತ್ತಿತು – ಅತ್ತಿತು. ⚠ ಸೂಚಿತ`]]],
[`ಊ–ಋ. ಚಟುವಟಿಕೆಗಳು`,[
[`ಈ ಪದ್ಯವನ್ನು ವೈಯಕ್ತಿಕವಾಗಿ ಹಾಗೂ ಸಾಮೂಹಿಕವಾಗಿ ಹಾಡಿರಿ`,`ಮಕ್ಕಳು ರಾಗಬದ್ಧವಾಗಿ ಹಾಡುವ ಚಟುವಟಿಕೆ.`],
[`ಅಂಕಣದಲ್ಲಿರುವ ಅಕ್ಷರಗಳನ್ನು ಬಳಸಿ 50ಕ್ಕಿಂತ ಹೆಚ್ಚು ಶಬ್ದಗಳನ್ನು ಮಾಡಿ (ಉದಾ: ದೊಡ್ಡ, ಮೊಗ್ಗ)`,`ಚೌಕದ ಅಕ್ಷರಗಳನ್ನು ಎಲ್ಲಿಂದ ಬೇಕಾದರೂ ಬಳಸಿ ಹೆಚ್ಚು ಪದ ರಚಿಸುವ ಆಟ; ಅತಿ ಹೆಚ್ಚು ಪದ ರಚಿಸಿದವರನ್ನು ಮೆಚ್ಚಿ ಪ್ರೋತ್ಸಾಹಿಸಿ.`]]],
[`ವ್ಯಾಕರಣ ಮಾಹಿತಿ – ಸಮಾಸ`,[
[`ಸಮಾಸ ಎಂದರೇನು?`,`ಎರಡು ಅಥವಾ ಎರಡಕ್ಕಿಂತ ಹೆಚ್ಚು ಪದಗಳು ಅರ್ಥಕ್ಕೆ ಲೋಪ ಬಾರದ ರೀತಿಯಲ್ಲಿ ಸೇರಿ ಒಂದಾಗುವುದು ಸಮಾಸ. ಇವುಗಳಿಗೆ 'ಸಮಸ್ತಪದ' ಎಂದೂ ಕರೆಯುತ್ತಾರೆ.`],
[`ವಿಗ್ರಹ ವಾಕ್ಯ ಎಂದರೇನು?`,`ಸಮಾಸಪದವನ್ನು ಬಿಡಿಸಿ ಬರೆಯುವುದಕ್ಕೆ ವಿಗ್ರಹ ವಾಕ್ಯ ಎನ್ನುವರು. ಉದಾ: ತಲೆಯಲ್ಲಿ + ನೋವು = ತಲೆನೋವು. ಮೊದಲ ಪದ ಪೂರ್ವಪದ, ಎರಡನೆಯ ಪದ ಉತ್ತರಪದ.`],
[`ಸಮಾಸಗಳಲ್ಲಿ ಎಷ್ಟು ವಿಧ? ಹೆಸರಿಸಿ.`,`ಎಂಟು ವಿಧ: ತತ್ಪುರುಷ, ಕರ್ಮಧಾರಯ, ದ್ವಿಗು, ದ್ವಂದ್ವ, ಅಂಶಿ, ಬಹುವ್ರೀಹಿ, ಕ್ರಿಯಾ, ಗಮಕ ಸಮಾಸ.`],
[`ಸಮಾಸ ಪದಗಳ ಉದಾಹರಣೆಗಳು`,`ಅರಸನ + ಮನೆ = ಅರಮನೆ; ಹಿರಿದು + ಮರ = ಹೆಮ್ಮರ; ಗಿಡವೂ + ಮರವೂ + ಬಳ್ಳಿಯೂ = ಗಿಡಮರಬಳ್ಳಿಗಳು; ಕೈಯನ್ನು + ಮುಗಿ = ಕೈಮುಗಿ.`]]],
[`ಭಾಷಾ ಆಟ`,[
[`ಅ. ಬಾಯಾರಿದ ಕಾಗೆಯ ಕಥೆ`,`ಶಿಕ್ಷಕರು ಬಾಯಾರಿದ ಕಾಗೆಯ ಕಥೆಯನ್ನು ಹೇಳಬೇಕು; ವಿದ್ಯಾರ್ಥಿಗಳು ಆ ಕಥೆಯನ್ನು ತಮ್ಮ ಮಾತಿನಲ್ಲಿ ಬರೆಯಬೇಕು.`],
[`ಆ. ವೈದ್ಯ–ರೋಗಿ ಸಂಭಾಷಣೆ`,`ಮಕ್ಕಳಿಂದ ವೈದ್ಯ–ರೋಗಿ ಸಂಭಾಷಣೆ ಮಾಡಿಸುವುದು. ಉದಾ: ವೈದ್ಯ: ಏನಾಗಿದೆ ನಿನಗೆ? ರೋಗಿ: ರಾತ್ರಿಯೆಲ್ಲ ಚಳಿಜ್ವರ ಬಂದಿತು. ವೈದ್ಯ: ನಾಲಿಗೆ ಚಾಚು. ... ವೈದ್ಯ: ಈ ಮಾತ್ರೆ ತೆಗೆದುಕೋ, ಸರಿಯಾಗುತ್ತದೆ. (ಇನ್ನೊಂದು ಸಂದರ್ಭವನ್ನು ಮಕ್ಕಳೇ ಬರೆಯಬೇಕು.)`]]]
],
qb:[
M(`ಭೀಮಣ್ಣ ಸಂತೆಯಲ್ಲಿ ಏನನ್ನು ಕೊಂಡನು?`,[`ಬೆಲ್ಲ`,`ಹಿಂಡಿ`,`ಅಕ್ಕಿ`,`ಹಣ್ಣು`],1),
M(`ಭೀಮಣ್ಣ ಕೊಂಡದ್ದು ಎಷ್ಟು ಮಣ?`,[`ಐದು`,`ಹತ್ತು`,`ಇಪ್ಪತ್ತು`,`ಐವತ್ತು`],1),
M(`ಹೊರೆಯ ಭಾರಕ್ಕೆ ಕಂಗಾಲಾದ ಪ್ರಾಣಿ:`,[`ಕತ್ತೆ`,`ಕುದುರೆ`,`ಎತ್ತು`,`ಆನೆ`],1),
M(`'ಸೊಕ್ಕು' ಪದದ ಅರ್ಥ:`,[`ವಿನಯ`,`ಗರ್ವ`,`ಭಯ`,`ದುಃಖ`],1),
M(`'ಕಂಗಾಲು' ಪದದ ಅರ್ಥ:`,[`ಅಶಕ್ತನಾಗು`,`ಬಲಶಾಲಿಯಾಗು`,`ಓಡು`,`ಹಾರು`],0),
M(`'ಅರಮನೆ' – ಇದು ಯಾವ ಸಮಾಸಕ್ಕೆ ಉದಾಹರಣೆ? (ಅರಸನ + ಮನೆ)`,[`ತತ್ಪುರುಷ`,`ದ್ವಂದ್ವ`,`ಬಹುವ್ರೀಹಿ`,`ದ್ವಿಗು`],0,'h'),
O(`ಭೀಮಣ್ಣನು ಎಲ್ಲಿಗೆ ಹೋದನು?`,`ಸಂತೆಗೆ.`),
O(`ಹಿಂಡಿಯನ್ನು ಯಾರ ಬೆನ್ನಿಗೆ ಹೇರಿಸಿದನು?`,`ಕತ್ತೆಯ ಬೆನ್ನಿಗೆ.`),
O(`ಹೊರೆ ಹೊರಲು ಹೇಳಿದ್ದು ಯಾರು ಯಾರಿಗೆ?`,`ಕತ್ತೆಯು ಕುದುರೆಗೆ.`),
O(`ಕತ್ತೆಯ ಕೈಕಾಲು ಏನಾಯಿತು?`,`ನಡುಗಿತು.`),
O(`ಕತ್ತೆಯ ಬೆನ್ನ ಹೊರೆಯನ್ನು ಯಾರು ಹೊತ್ತರು?`,`ಕುದುರೆ ಹೊತ್ತಿತು (ಕಂಗಾಲಾದ ಮೇಲೆ).`),
O(`ಈ ಪದ್ಯದ ಕವಿ ಯಾರು?`,`ಕಯ್ಯಾರ ಕಿಞ್ಞಣ್ಣ ರೈ.`),
G(`'ಹೊರೆ' ಪದದ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಭಾರ / ತೂಕ / ಕಂತೆ`,'e'),
G(`'ಉಪಕಾರ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಸಹಾಯ`,'e'),
G(`'ಹಿಗ್ಗು' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಸಂತೋಷ`),
G(`ಸಮಾಸಪದ ಮಾಡಿ: ಅರಸನ + ಮನೆ`,`ಅರಮನೆ`),
G(`ಸಮಾಸಪದ ಮಾಡಿ: ಹಿರಿದು + ಮರ`,`ಹೆಮ್ಮರ`),
G(`ವಿಗ್ರಹ ವಾಕ್ಯ ಬರೆಯಿರಿ: ತಲೆನೋವು`,`ತಲೆಯಲ್ಲಿ + ನೋವು`),
S(`ಕತ್ತೆಯು ಸಹಾಯ ಕೇಳಿದಾಗ ಕುದುರೆ ಏನೆಂದು ಹೇಳಿತು?`,`"ನಿನ್ನ ಬೆನ್ನಿಗೇ ಹೊರೆ ಹಾಕಿದ್ದಾನೆ; ಅದಕ್ಕಾಗಿಯೇ ನಿನ್ನನ್ನು ಸಾಕಿದ್ದಾನೆ. ನೀನೇ ಹೊತ್ತುಕೊಂಡು ಬೇಗ ನಡೆ" ಎಂದು ಕುದುರೆ ಸೊಕ್ಕಿನಿಂದ ಹೇಳಿತು.`),
S(`ಕುದುರೆಯು ಕತ್ತೆಯನ್ನು ಏನೆಂದು ಬೇಡಿಕೊಂಡಿತು?`,`"ನಿನ್ನ ಉಪಕಾರವನ್ನು ಮರೆಯುವುದಿಲ್ಲ; ಒಂದಿಷ್ಟಾದರೂ ಹೊತ್ತುಬಿಡು, ನನ್ನ ಪ್ರಾಣವನ್ನು ಉಳಿಸಿಕೊಡು" ಎಂದು ಬೇಡಿಕೊಂಡಿತು.`),
S(`ಕತ್ತೆಯು ಕುದುರೆಗೆ ಯಾವ ಮಾತು ಹೇಳಿತು? ಅದರ ಅರ್ಥವೇನು?`,`"ನೀ ನನಗಿದ್ದರೆ ನಾ ನಿನಗೆ ನೆನಪಿರಲೀ ನುಡಿ ನಮ್ಮೊಳಗೆ" ಎಂದು ಕತ್ತೆ ಹೇಳಿತು. ನೀನು ನನಗೆ ಸಹಾಯ ಮಾಡಿದರೆ ಮಾತ್ರ ನಾನು ನಿನಗೆ ಮಾಡುವೆ – ಎಂಬುದು ಅರ್ಥ. ಆಗ ನೀನು ನನಗೆ ಸಹಾಯ ಮಾಡಲಿಲ್ಲ; ಈಗ ನಾನೇಕೆ ಮಾಡಲಿ? ಎಂಬ ಭಾವ.`),
S(`ಸಮಾಸ ಎಂದರೇನು? ಎರಡು ಉದಾಹರಣೆ ಕೊಡಿ.`,`ಎರಡು ಅಥವಾ ಹೆಚ್ಚು ಪದಗಳು ಅರ್ಥಕ್ಕೆ ಲೋಪ ಬಾರದಂತೆ ಸೇರಿ ಒಂದಾಗುವುದು ಸಮಾಸ. ಉದಾ: ಅರಸನ + ಮನೆ = ಅರಮನೆ; ಕೈಯನ್ನು + ಮುಗಿ = ಕೈಮುಗಿ.`),
L(`'ನೀ ನನಗಿದ್ದರೆ' ಪದ್ಯದ ಕಥೆಯನ್ನು ನಿಮ್ಮ ಮಾತುಗಳಲ್ಲಿ ಬರೆಯಿರಿ.`,`ಭೀಮಣ್ಣನು ಸಂತೆಗೆ ಹೋಗಿ ಹತ್ತು ಮಣ ಹಿಂಡಿ ಕೊಂಡನು. ಅದನ್ನು ಕತ್ತೆಯ ಬೆನ್ನಿಗೆ ಹೇರಿಸಿ ಕುದುರೆಯ ಜೊತೆ ಸಾಗಿಸಿದನು. ಭಾರದಿಂದ ಬಳಲಿದ ಕತ್ತೆ "ಗೆಳೆಯನೇ, ಅರ್ಧ ಹೊರೆ ನೀನು ಹೊರು" ಎಂದು ಕೇಳಿತು. ಸೊಕ್ಕಿನ ಕುದುರೆ ಹೊರಲು ನಿರಾಕರಿಸಿ ಹೀಯಾಳಿಸಿತು. ಭಾರಕ್ಕೆ ಕತ್ತೆಯ ಕೈಕಾಲು ನಡುಗಿ ಅದು ಕಂಗಾಲಾಗಿ ಬಿದ್ದಿತು. ಆಗ ಭೀಮಣ್ಣನು ಕತ್ತೆಯ ಎಲ್ಲಾ ಹೊರೆಯನ್ನೂ ಕುದುರೆಯ ಬೆನ್ನಿಗೆ ಹೊರಿಸಿದನು. ಭಾರ ತಾಳಲಾರದೆ ಕುದುರೆ ಕತ್ತೆಯ ಬಳಿ ಬೇಡಿಕೊಂಡಿತು. ಕತ್ತೆಯು "ನೀ ನನಗಿದ್ದರೆ ನಾ ನಿನಗೆ" ಎಂದು ಹೇಳಿತು.`),
L(`ಈ ಪದ್ಯದಿಂದ ನಾವು ಕಲಿಯಬೇಕಾದ ಪಾಠವನ್ನು ವಿವರಿಸಿ.`,`ಕಷ್ಟದಲ್ಲಿರುವವರನ್ನು ನೋಡಿ ಸಂತೋಷಪಡದೆ ಸಾಧ್ಯವಾದಷ್ಟು ಸಹಾಯ ಮಾಡಬೇಕು. ಇಂದು ನಾವು ಇನ್ನೊಬ್ಬರಿಗೆ ಸಹಾಯ ಮಾಡಿದರೆ ನಾಳೆ ನಮಗೆ ಕಷ್ಟ ಬಂದಾಗ ಅವರು ಸಹಾಯ ಮಾಡುತ್ತಾರೆ. ಗರ್ವ, ಸೊಕ್ಕು ಒಳ್ಳೆಯದಲ್ಲ. ಕುದುರೆ ಸಹಾಯ ಮಾಡದ ಕಾರಣ ತಾನೇ ಕಷ್ಟಕ್ಕೆ ಸಿಲುಕಿತು. ಸಹಕಾರ ಮತ್ತು ಪರೋಪಕಾರದಿಂದ ಎಲ್ಲರೂ ಸುಖವಾಗಿ ಬಾಳಬಹುದು.`)
]});

LS6.push({n:6,t:`ಗಂಗವ್ವ ತಾಯಿ (ಪದ್ಯ 6)`,au:`ಡಾ. ಸಿದ್ಧಲಿಂಗ ಪಟ್ಟಣಶೆಟ್ಟಿ`,pg:37,
words:`ದುಸ್ತರ – ಕಠಿಣ, ಕಷ್ಟಸಾಧ್ಯ; ಕಣ – ಅತ್ಯಂತ ಸೂಕ್ಷ್ಮವಾದ ಅಂಶ; ಪ್ರಾಣ – ಜೀವ, ಜೀವ ಉಳಿಯಲು ಕಾರಣವಾದ ಒಂದು ವಾಯು; ನಭ – ಆಕಾಶ, ಗಗನ, ಅಂಬರ; ಹೊಳೆ – ನದಿ, ಮಿನುಗು; ಕುಣಿ – ಕುಳಿ, ಹೊಂಡ, ನರ್ತಿಸು; ಕೊಳೆ – ಕಲ್ಮಷ, ಹೊಲಸು; ಚಿಮ್ಮು – ಹಾರು, ಜಿಗಿ, ನೆಗೆ; ತೊಳೆ – ನೀರಿನಿಂದ ಸ್ವಚ್ಛಗೊಳಿಸು; ಮಾಯ – ಇದ್ದಕ್ಕಿದ್ದಂತೆ ಕಾಣೆಯಾಗುವುದು, ಮರೆಯಾಗಿರುವುದು; ಹರಿ – ಓಡು, ಪ್ರವಹಿಸು, ಹೋಗು; ತುಣುಕು – ಚೂರು, ತುಂಡು`,
notes:`ಗಂಗವ್ವ – ಭಾರತದ ನೆಲದಲ್ಲಿ ಹರಿಯುವ ನೀರನ್ನು ಗಂಗೆ ಅಥವಾ ಗಂಗವ್ವ ಎಂದು ಕರೆಯುವರು; ಉತ್ತರ ಭಾರತದ ಪ್ರಮುಖ ನದಿಯೊಂದಕ್ಕೆ 'ಗಂಗಾ ನದಿ' ಎಂದು ಹೆಸರಿದೆ. ಪದಪದರಾಗ – ಪ್ರತಿ ಹಂತ ಹಂತಗಳಲ್ಲಿಯೂ, ಪೊರೆಪೊರೆಗಳಲ್ಲಿಯೂ. ಕವಿ: ಡಾ. ಸಿದ್ಧಲಿಂಗ ಪಟ್ಟಣಶೆಟ್ಟಿ (3-11-1939, ಧಾರವಾಡ ಸನಿಹದ ಯಾದವಾಡ); ತಂದೆ ಬಸೆಟ್ಟಪ್ಪ, ತಾಯಿ ಗಿರಿಜಾದೇವಿ; ಕೃತಿಗಳು: ನೀನಾ, ಔರಂಗಜೇಬ, ಪರದೇಸಿ ಹಾಡುಗಳು, ಅಯಸ್ಕಾಂತ, ಇಷ್ಟು ಹೇಳಿದ ಮೇಲೆ, ಅಪರಂಪಾರ (ಕವನ ಸಂಗ್ರಹ); ಮಾವ, ಹಕ್ಕಿಗಳು (ಕಥೆ); ಅನುಶೀಲನ, ರಂಗಾಯಣ (ವಿಮರ್ಶೆ); ಆಷಾಢದ ಒಂದು ದಿನ ಮುಂತಾದ ಅನುವಾದ ನಾಟಕಗಳು. ಪ್ರಸ್ತುತ ಕವನವನ್ನು 'ನಿನ್ನ ಮರೆಯೂ ಮಾತು' ಸಂಕಲನದಿಂದ ಆರಿಸಲಾಗಿದೆ. ಕೌಶಲ: ಮಾತನಾಡುವುದು. ವ್ಯಾಕರಣ: ಪ್ರಾಸಾಕ್ಷರಗಳು.`,
ab:[
[`ಅ. ಬಿಟ್ಟ ಸ್ಥಳವನ್ನು ಕೆಳಗೆ ನೀಡಲಾದ ಸೂಕ್ತ ಪದಗಳಿಂದ ಭರ್ತಿಮಾಡಿ`,[
[`ಬಾರವ್ವ ತಾಯಿ ______ ತಾಯಿ.`,`ಗಂಗವ್ವ`],
[`ಹೊಳೆಯವ್ವ ತಾಯಿ ______ ತಾಯಿ.`,`ನೀರವ್ವ`],
[`ಮೈಮನಸ ಹೊಲಸೆಲ್ಲ ______ ತಾಯಿ.`,`ತೊಳೆಯವ್ವ`],
[`ನೀರವ್ವ ಗಂಗವ್ವ ______ ಬಾರವ್ವ.`,`ಮಳಿಯಾಗಿ`],
[`ಒಣಗೀದ ನೆಲದಾಗ ______ ಹೊಳೆಯವ್ವ.`,`ಹಸುರಾಗಿ`]]],
[`ಆ. ಸಮಾನಾರ್ಥಕ ಪದಗಳನ್ನು ಬರೆಯಿರಿ`,[
[`ನೀರು`,`ಜಲ, ಉದಕ, ತೋಯ`],
[`ನಭ`,`ಆಕಾಶ, ಗಗನ, ಅಂಬರ`],
[`ಕುಣಿ`,`ನರ್ತಿಸು (ಕುಳಿ, ಹೊಂಡ ಎಂಬ ಅರ್ಥವೂ ಇದೆ)`],
[`ತಾಯಿ`,`ಅಮ್ಮ, ಮಾತೆ, ಜನನಿ`]]],
[`ಇ. ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರಿಸಿರಿ`,[
[`ನೀರು ಎಲ್ಲೆಲ್ಲಿ ತುಂಬಬೇಕು ಎಂದು ಕವಿ ಹೇಳುತ್ತಾರೆ?`,`ನೆಲದ ಕಣಕಣದಲ್ಲಿ ಮತ್ತು ಮನದ ಪದಪದರಿನಲ್ಲಿ (ನೆಲದ ಒಳಹೊರಗೆಲ್ಲ) ನೀರು ತುಂಬಬೇಕು ಎಂದು ಕವಿ ಹೇಳುತ್ತಾರೆ.`],
[`ನೀರು ಹೇಗೆಲ್ಲ ಹರಿದು ಬರಬೇಕೆಂದು ಕವಿ ವಿನಂತಿಸಿಕೊಂಡಿದ್ದಾರೆ?`,`ನಗುನಗುತ ನಲಿಯುತ್ತ, ಪುಟಿಯುತ್ತ, ಕುಣಿಯುತ್ತ, ಚಿಮ್ಮುತ್ತ, ಜಿಗಿಯುತ್ತ, ಹರಿಯುತ್ತ, ಸುರಿಯುತ್ತ ಧೋ ಧೋ ಎಂದು ಬರಬೇಕೆಂದು ವಿನಂತಿಸಿಕೊಂಡಿದ್ದಾರೆ.`],
[`ಒಣಗಿದ ನೆಲದಲ್ಲಿ ನೀರು ಹೇಗೆ ಹೊಳೆಯಬೇಕು ಎಂದು ಕವಿ ಹೇಳುತ್ತಾರೆ?`,`ಒಣಗಿದ ನೆಲದಲ್ಲಿ ನೀರು ಹಸುರಾಗಿ ಹೊಳೆಯಬೇಕು (ಹಸಿ ಹಸಿರು ನೆಡಲಾಕ) ಎಂದು ಕವಿ ಹೇಳುತ್ತಾರೆ.`],
[`'ಗಂಗವ್ವ ತಾಯಿ' ಕವನವನ್ನು ಬರೆದವರು ಯಾರು?`,`ಡಾ. ಸಿದ್ಧಲಿಂಗ ಪಟ್ಟಣಶೆಟ್ಟಿ.`]]],
[`ಈ. ಕೊಟ್ಟಿರುವ ಮಾತನ್ನು ಯಾರು ಯಾರಿಗೆ ಯಾವಾಗ ಹೇಳಿದರು?`,[
[`ನೆಲದ ಕಣಕಣದಾಗ ಮನದ ಪದಪದರಾಗ.`,`ಕವಿಯು ಗಂಗವ್ವನಿಗೆ (ನೀರಿನ ತಾಯಿಗೆ); ನೀರಿಲ್ಲದೆ ನೆಲ ಒಣಗಿದ್ದಾಗ ಮಳೆಯಾಗಿ ಬಾ ಎಂದು ಕೇಳುವಾಗ. ⚠ ಸೂಚಿತ`],
[`ಹರಿಯುತ್ತ ಸುರಿಯುತ್ತ ಧೋಧೋ ಬಾರವ್ವ.`,`ಕವಿಯು ಗಂಗವ್ವನಿಗೆ; ಮಳೆಯಾಗಿ ಭೂಮಿಗೆ ಇಳಿದು ಬರಲು ಆಹ್ವಾನಿಸುವಾಗ. ⚠ ಸೂಚಿತ`],
[`ಒಣಗೀದ ನೆಲದಾಗ ಹಸಿ ಹಸಿರು ನೆಡಲಾಕ.`,`ಕವಿಯು ಗಂಗವ್ವನಿಗೆ; ಒಣಗಿದ ನೆಲದಲ್ಲಿ ಹಸಿರು ಬೆಳೆಯಲು ನೀರು ಹರಿದು ಬರಬೇಕೆಂದು ಕೇಳುವಾಗ. ⚠ ಸೂಚಿತ`],
[`ಜೀವದಾ ತುಣುಕಾಗಿ ಮೈಮನಸ ಹೊಲಸೆಲ್ಲ.`,`ಕವಿಯು ಗಂಗವ್ವನಿಗೆ; ಜೀವ ಉಳಿಸುವ ತುಣುಕಾಗಿ ಮೈ–ಮನಸ್ಸಿನ ಕೊಳೆ ತೊಳೆಯಲು ಕೇಳುವಾಗ. ⚠ ಸೂಚಿತ`]]],
[`ಉ. ಎರಡು–ಮೂರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರಿಸಿರಿ`,[
[`ಗಂಗವ್ವ ಇದ್ದರೆ ಎಲ್ಲೆಲ್ಲಿ, ಏನೇನು ಆಗುವುದೆಂದು ಕವಿ ಹೇಳಿದ್ದಾರೆ?`,`ಗಂಗವ್ವ (ನೀರು) ಇದ್ದರೆ ನೆಲದ ಒಳಹೊರಗೆಲ್ಲ ಪ್ರಾಣ ತುಂಬುತ್ತದೆ; ಒಣಗಿದ ನೆಲದಲ್ಲಿ ಹಸಿರು ಬೆಳೆಯುತ್ತದೆ; ಉಸಿರು ಉಳಿಯುತ್ತದೆ; ಕೊಳೆಯೆಲ್ಲ ತೊಳೆದುಹೋಗುತ್ತದೆ; ಜಗತ್ತು ಮತ್ತು ಆಕಾಶ ಹೊಳೆ–ಹಳ್ಳ ಜಲ ಜಲ ಎಂದು ಹರಿಯುತ್ತದೆ.`],
[`ನೀರು ಯಾವ ಯಾವ ಕೆಲಸಕ್ಕೆ ಬೇಕು ಎಂದು ಕವಿ ಹೇಳಿದ್ದಾರೆ?`,`ನೆಲದ ಕಣಕಣವನ್ನು ತೇವಗೊಳಿಸಲು, ಒಣಗಿದ ನೆಲವನ್ನು ಹಸಿರಾಗಿಸಲು, ಜೀವದ ದಾಹ ತೀರಿಸಲು, ಉಸಿರು ಉಳಿಸಲು, ಮೈ–ಮನಸ್ಸಿನ ಹೊಲಸನ್ನು ತೊಳೆಯಲು ನೀರು ಬೇಕು ಎಂದು ಕವಿ ಹೇಳಿದ್ದಾರೆ.`]]],
[`ಊ. ನೀರಿನ ಉಪಯೋಗವನ್ನು ಸಂಗ್ರಹ ರೂಪದಲ್ಲಿ ತಿಳಿಸಿರಿ`,[
[`ಸಂಗ್ರಹ`,`ನೀರು ಕುಡಿಯಲು, ಅಡುಗೆ, ಸ್ನಾನ, ಬಟ್ಟೆ ಒಗೆಯಲು, ಕೃಷಿ (ನೀರಾವರಿ), ಕೈಗಾರಿಕೆ, ವಿದ್ಯುತ್ ಉತ್ಪಾದನೆ, ಸಸ್ಯ–ಪ್ರಾಣಿಗಳ ಜೀವಕ್ಕೆ ಬೇಕು. ಜಲ ಸಂರಕ್ಷಣೆ ನಮ್ಮೆಲ್ಲರ ಕರ್ತವ್ಯ.`]]],
[`ವ್ಯಾಕರಣ ಮಾಹಿತಿ – ಪ್ರಾಸಾಕ್ಷರಗಳು`,[
[`ಪ್ರಾಸಾಕ್ಷರ ಎಂದರೇನು?`,`ಪದ್ಯದ ನಿರ್ದಿಷ್ಟ ಸ್ಥಳದಲ್ಲಿ ಬರುವ ಪುನರಾವರ್ತಿತ ಅಕ್ಷರಗಳನ್ನು ಪ್ರಾಸಾಕ್ಷರ ಎನ್ನುವರು. ಉದಾ: "ಉತ್ತಮರ ಗೆಳೆತನ ಪುತ್ಥಳಿ ಬಂಗಾರ / ಮತ್ತಹೀನರ ಗೆಳೆತನ । ಮಾಡಿದರ / ಹಿತ್ತಾಳಿಗಿಂತ ಬಲುಹೀನ" – ಇಲ್ಲಿ 'ತ್ತ' ಅಕ್ಷರ ಎಲ್ಲ ಸಾಲುಗಳಲ್ಲಿ ಪುನರಾವರ್ತಿತವಾಗಿದೆ.`],
[`ಆದಿಪ್ರಾಸ ಎಂದರೇನು?`,`ಪದ್ಯದ ಪ್ರತಿಯೊಂದು ಸಾಲಿನ ಎರಡನೆಯ ಅಕ್ಷರವು ಪುನರಾವರ್ತಿತವಾದರೆ ಅದು ಆದಿಪ್ರಾಸ.`],
[`ಅಂತ್ಯಪ್ರಾಸ ಎಂದರೇನು? ಉದಾಹರಣೆ ಕೊಡಿ.`,`ಸಾಲಿನ ಕೊನೆಯ ಅಕ್ಷರವು ಪುನರಾವರ್ತಿತವಾದರೆ ಅದು ಅಂತ್ಯಪ್ರಾಸ. ಉದಾ: ನೀರವ್ವ ಗಂಗ'ವ್ವ'; ಮಳಿಯಾಗಿ ಬಾರ'ವ್ವ'; ಹೊಳಿಯಾಗಿ ಹರಿಯ'ವ್ವ' – ಇಲ್ಲಿ 'ವ್ವ' ಪ್ರತಿ ಸಾಲಿನ ಕೊನೆಯಲ್ಲಿ ಪುನರಾವರ್ತಿತವಾಗಿದೆ.`],
[`ಪ್ರಾಸಪದ ಗುರುತಿಸಿ: ಬೆಳ್ಳಾನ ಎರಡೆತ್ತು ಬೆಳ್ಳಿಯ ಬಾರುಕೋಲು / ಹಳ್ಳಾದ ಮಾಗಿ ಹೊಡೆದಾವು । ಎತ್ತಿನ / ತೆಳ್ಳಾನ ಹೊಟ್ಟಿ ಹಸಿದಾವು`,`ಬೆಳ್ಳಾನ, ಹಳ್ಳಾದ, ತೆಳ್ಳಾನ (ಎರಡನೆಯ ಅಕ್ಷರ 'ಳ್ಳಾ' ಪುನರಾವರ್ತಿತ – ಆದಿಪ್ರಾಸ)`]]],
[`ಭಾಷಾ ಆಟಗಳು`,[
[`ಅ. ವೃತ್ತಾಕಾರದಲ್ಲಿ ನಿಂತು ವಾಕ್ಯ ಹೇಳುವ ಆಟ`,`ಮಕ್ಕಳು ವೃತ್ತಾಕಾರದಲ್ಲಿ ನಿಲ್ಲಬೇಕು. ಒಬ್ಬರಿಗೆ ಒಂದು ವಿಷಯವನ್ನು ಸ್ಪಷ್ಟವಾದ ವಾಕ್ಯದಲ್ಲಿ ಇತರರಿಗೆ ಕೇಳದಂತೆ ಹೇಳಿ; ಆ ವಿದ್ಯಾರ್ಥಿ ಅದೇ ವಾಕ್ಯವನ್ನು ಪಕ್ಕದವರಿಗೆ ಗುಟ್ಟಾಗಿ ಹೇಳಲಿ. ಕೊನೆಯಲ್ಲಿರುವ ವಿದ್ಯಾರ್ಥಿ ತಾನು ಕೇಳಿಸಿಕೊಂಡದ್ದನ್ನು ಜೋರಾಗಿ ಹೇಳಲಿ; ಮೊದಲು ಹೇಳಿದ ವಾಕ್ಯಕ್ಕೆ ಹೋಲಿಸಿ.`],
[`ಆ. ಚರ್ಚಾಸ್ಪರ್ಧೆ`,`'ನೀರು ಅತ್ಯಮೂಲ್ಯ ಸಂಪನ್ಮೂಲ' ವಿಷಯದ ಕುರಿತು ಚರ್ಚಾಸ್ಪರ್ಧೆ ಏರ್ಪಡಿಸಿ.`],
[`ಇ. ಭಾಷಣ`,`ಜಲಸಂರಕ್ಷಣೆ, ನೀರಿನ ಮೂಲಗಳ ಸ್ವಚ್ಛತೆ ಕುರಿತು ಭಾಷಣ ಮಾಡಿ.`]]]
],
qb:[
M(`'ಗಂಗವ್ವ ತಾಯಿ' ಪದ್ಯದಲ್ಲಿ ಗಂಗವ್ವ ಎಂದರೆ:`,[`ನೀರು`,`ಬೆಂಕಿ`,`ಗಾಳಿ`,`ಭೂಮಿ`],0),
M(`'ನಭ' ಪದದ ಅರ್ಥ:`,[`ನೆಲ`,`ಆಕಾಶ`,`ನೀರು`,`ಬೆಂಕಿ`],1),
M(`'ದುಸ್ತರ' ಪದದ ಅರ್ಥ:`,[`ಸುಲಭ`,`ಕಠಿಣ`,`ಸುಂದರ`,`ದೊಡ್ಡದು`],1),
M(`'ತೊಳೆ' ಪದದ ಅರ್ಥ:`,[`ನೀರಿನಿಂದ ಸ್ವಚ್ಛಗೊಳಿಸು`,`ಕುಡಿ`,`ಓಡು`,`ಕೂಗು`],0),
M(`ಪದ್ಯದಲ್ಲಿ ನೀರು ಒಣಗಿದ ನೆಲದಲ್ಲಿ ಹೇಗೆ ಹೊಳೆಯಬೇಕು?`,[`ಕೆಂಪಾಗಿ`,`ಹಸುರಾಗಿ`,`ಕರಿಯಾಗಿ`,`ಬಿಳಿಯಾಗಿ`],1),
M(`'ವ್ವ' ಅಕ್ಷರ ಪ್ರತಿ ಸಾಲಿನ ಕೊನೆಯಲ್ಲಿ ಬಂದರೆ ಅದು:`,[`ಆದಿಪ್ರಾಸ`,`ಅಂತ್ಯಪ್ರಾಸ`,`ಲೋಪ ಸಂಧಿ`,`ಸಮಾಸ`],1,'m'),
O(`'ಗಂಗವ್ವ ತಾಯಿ' ಪದ್ಯದ ಕವಿ ಯಾರು?`,`ಡಾ. ಸಿದ್ಧಲಿಂಗ ಪಟ್ಟಣಶೆಟ್ಟಿ.`),
O(`ಈ ಕವನವನ್ನು ಯಾವ ಸಂಕಲನದಿಂದ ಆರಿಸಲಾಗಿದೆ?`,`'ನಿನ್ನ ಮರೆಯೂ ಮಾತು' ಸಂಕಲನದಿಂದ.`),
O(`ದ.ರಾ. ಬೇಂದ್ರೆಯವರು ಗಂಗೆಯನ್ನು ಭೂಮಿಗೆ ಹೇಗೆ ಆಹ್ವಾನಿಸಿದ್ದರು? (ಕವನದ ಹೆಸರು)`,`'ಇಳಿದು ಬಾ ತಾಯಿ ಇಳಿದು ಬಾ' ಎಂಬ ಕವನದ ಮೂಲಕ.`),
O(`ಕವಿ ನೀರಿಗೆ ಯಾವ ಹೆಸರುಗಳಿಂದ ಕರೆದಿದ್ದಾರೆ? ಒಂದು ಹೆಸರು ಬರೆಯಿರಿ.`,`ಗಂಗವ್ವ / ನೀರವ್ವ / ಬಾರವ್ವ / ಹೊಳೆಯವ್ವ.`),
O(`ಕವಿಯ ಪ್ರಕಾರ ನೆಲದ ಒಳಹೊರಗೆಲ್ಲ ತುಂಬುವುದು ಏನು?`,`ಪ್ರಾಣ (ನೀರಿನಿಂದ ಪ್ರಾಣ ತುಂಬುವುದು).`),
O(`ಈ ಪದ್ಯದ ಕವಿ ಯಾವ ಜಿಲ್ಲೆಯವರು?`,`ಧಾರವಾಡ (ಯಾದವಾಡ ಗ್ರಾಮ).`),
G(`'ನಭ' ಪದಕ್ಕೆ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಆಕಾಶ / ಗಗನ / ಅಂಬರ`,'e'),
G(`'ನೀರು' ಪದಕ್ಕೆ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಜಲ / ಉದಕ`,'e'),
G(`'ಕೊಳೆ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಕಲ್ಮಷ / ಹೊಲಸು`),
G(`ಬಿಟ್ಟ ಸ್ಥಳ ತುಂಬಿ: ಮೈಮನಸ ಹೊಲಸೆಲ್ಲ ______ ತಾಯಿ.`,`ತೊಳೆಯವ್ವ`),
G(`'ಪದಪದರಾಗ' ಎಂದರೇನು?`,`ಪ್ರತಿ ಹಂತ ಹಂತಗಳಲ್ಲಿಯೂ, ಪೊರೆಪೊರೆಗಳಲ್ಲಿಯೂ`),
G(`ಅಂತ್ಯಪ್ರಾಸ ಪದ ಗುರುತಿಸಿ: ನೀರವ್ವ ಗಂಗವ್ವ / ಮಳಿಯಾಗಿ ಬಾರವ್ವ`,`ಗಂಗವ್ವ, ಬಾರವ್ವ (ಕೊನೆಯ ಅಕ್ಷರ 'ವ್ವ')`),
S(`ಗಂಗವ್ವ ಇದ್ದರೆ ಏನೇನು ಆಗುವುದೆಂದು ಕವಿ ಹೇಳಿದ್ದಾರೆ?`,`ಗಂಗವ್ವ (ನೀರು) ಇದ್ದರೆ ನೆಲದ ಕಣಕಣದಲ್ಲಿ ಪ್ರಾಣ ತುಂಬುತ್ತದೆ; ಒಣಗಿದ ನೆಲ ಹಸಿರಾಗುತ್ತದೆ; ಉಸಿರು ಉಳಿಯುತ್ತದೆ; ಕೊಳೆ ತೊಳೆದುಹೋಗುತ್ತದೆ; ನದಿಯಾಗಿ ಹರಿದು ಜೀವನ ಸಾಗುತ್ತದೆ.`),
S(`ನೀರು ಯಾವ ಯಾವ ಕೆಲಸಕ್ಕೆ ಬೇಕು ಎಂದು ಕವಿ ಹೇಳಿದ್ದಾರೆ?`,`ನೆಲ ಹಸಿರಾಗಲು, ಜೀವ ಉಳಿಯಲು, ಜೀವದ ದಾಹ ತೀರಿಸಲು, ಮೈ–ಮನಸ್ಸಿನ ಹೊಲಸನ್ನು ತೊಳೆಯಲು ನೀರು ಬೇಕು.`),
S(`ಆದಿಪ್ರಾಸ ಮತ್ತು ಅಂತ್ಯಪ್ರಾಸ ಎಂದರೇನು?`,`ಪದ್ಯದ ಪ್ರತಿ ಸಾಲಿನ ಎರಡನೆಯ ಅಕ್ಷರ ಪುನರಾವರ್ತಿತವಾದರೆ ಆದಿಪ್ರಾಸ; ಪ್ರತಿ ಸಾಲಿನ ಕೊನೆಯ ಅಕ್ಷರ ಪುನರಾವರ್ತಿತವಾದರೆ ಅಂತ್ಯಪ್ರಾಸ.`),
S(`ನೀರಿನ ಉಪಯೋಗಗಳನ್ನು ಸಂಗ್ರಹವಾಗಿ ಬರೆಯಿರಿ.`,`ಕುಡಿಯಲು, ಅಡುಗೆ ಮಾಡಲು, ಸ್ನಾನ ಮತ್ತು ಬಟ್ಟೆ ಒಗೆಯಲು, ಕೃಷಿಗೆ, ಕೈಗಾರಿಕೆಗೆ, ವಿದ್ಯುತ್ ಉತ್ಪಾದನೆಗೆ ಹಾಗೂ ಸಕಲ ಜೀವರಾಶಿಗಳ ಬದುಕಿಗೆ ನೀರು ಬೇಕು.`),
L(`'ಗಂಗವ್ವ ತಾಯಿ' ಪದ್ಯದ ಸಾರಾಂಶವನ್ನು ನಿಮ್ಮ ಮಾತುಗಳಲ್ಲಿ ಬರೆಯಿರಿ.`,`ಕವಿಯು ನೀರನ್ನು ಗಂಗವ್ವ, ನೀರವ್ವ, ಬಾರವ್ವ, ಹೊಳೆಯವ್ವ ಎಂದು ತಾಯಿಯಂತೆ ಕರೆದು ಭೂಮಿಗೆ ಬರುವಂತೆ ಆಹ್ವಾನಿಸಿದ್ದಾರೆ. ನೆಲದ ಕಣಕಣದಲ್ಲಿ, ಮನದ ಪದರಿನಲ್ಲಿ ನೀರು ತುಂಬಲಿ; ಜೀವನ ನೀಡಲಿ ಎಂದು ಬೇಡಿದ್ದಾರೆ. ಗಂಗವ್ವ ಇದ್ದರೆ ಜಗತ್ತು, ಆಕಾಶ ಜಲ ಜಲ ಎಂದು ಹೊಳೆಯುತ್ತದೆ. ನಗುತ, ನಲಿಯುತ, ಕುಣಿಯುತ, ಚಿಮ್ಮುತ, ಹರಿಯುತ ಧೋ ಧೋ ಎಂದು ಮಳೆಯಾಗಿ ಬರಲಿ; ಒಣಗಿದ ನೆಲ ಹಸಿರಾಗಲಿ, ಉಸಿರು ಉಳಿಯಲಿ, ಮೈ–ಮನದ ಕೊಳೆ ತೊಳೆಯಲಿ ಎಂಬುದು ಕವಿಯ ಆಶಯ. ಕೊನೆಯಲ್ಲಿ ಮತ್ತೆ "ಬಾ ತಾಯಿ ಬಾ ತಾಯಿ" ಎಂದು ಕರೆಯುತ್ತಾರೆ.`),
L(`ನೀರಿನ ಮಹತ್ವವನ್ನು ಈ ಪದ್ಯದ ಆಧಾರದಿಂದ ವಿವರಿಸಿ.`,`ನೀರು ಇಲ್ಲದಿದ್ದರೆ ಬದುಕೇ ದುಸ್ತರ. ನೀರು ಭೂಮಿಗಿಳಿದು ನೆಲದಲ್ಲಿ ಹರಿದಾಗ ಒಣಗಿದ ನೆಲ ಹಸುರಾಗುತ್ತದೆ; ಬೆಳೆ, ಗಿಡ ಮರ ಬೆಳೆಯುತ್ತವೆ. ನೀರು ಜೀವದ ತುಣುಕು; ಮೈಮನಸ್ಸಿನ ಕೊಳೆ ತೊಳೆಯುತ್ತದೆ; ಉಸಿರು ಉಳಿಸುತ್ತದೆ. ಆದ್ದರಿಂದ ನೀರನ್ನು ಮಿತವಾಗಿ ಬಳಸಿ ಸಂರಕ್ಷಿಸಬೇಕು.`)
]});

LS6.push({n:7,t:`ಹೃದಯ ವಚನಗಳು (ಪದ್ಯ 7)`,au:`ಅಮೃತ ಸೋಮೇಶ್ವರ`,pg:43,
words:`ತಡವೆ – ಬಾರಿ, ಸಲ; ಉಪಕರಿಸು – ಉಪಕಾರ ಮಾಡು, ನೆರವು ನೀಡು; ಜರೆ – ನಿಂದಿಸು, ಬಯ್ಯು; ಸ್ತುತಿ – ಹೊಗಳಿಕೆ; ಓಲೈಸು – ಮೆಚ್ಚಿಸು; ಚಾಳಿ – ನಡವಳಿಕೆ, ವರ್ತನೆ; ಹುಲ್ಲೆ – ಜಿಂಕೆ, ಚಿಗರೆ; ಮೊರೆವ – ಗರ್ಜಿಸುವ; ಕುಪ್ಪಳಿಸು – ಹಾರು, ಜಿಗಿಯು; ಗಜ – ಆನೆ; ಗುಟುರು – ಹೂಂಕರಿಸು, ಜೋರಾಗಿ ಧ್ವನಿ ಮಾಡು; ನಂಜು – ವಿಷ; ನಿರಾಳ – ಶಾಂತಿ, ನೆಮ್ಮದಿ; ಹದನ – ರೀತಿ; ಎನಿತು – ಎಷ್ಟು; ಮಿಡಿತ – ಬಡಿತ, ಸ್ಪಂದನ; ಬೆಸುಗೆ – ಹೊಂದಿಕೆ, ಜೋಡಣೆ; ಸಾಧಿತ – ಸಾಧಿಸಿದ, ಸಿದ್ಧಿಯನ್ನು ಪಡೆದ; ದಾತ – ಒಡೆಯ, ಸ್ವಾಮಿ`,
notes:`ಸ್ತೋತ್ರಾತೀತ – ಹೊಗಳಿಕೆಗೆ ನಿಲುಕದ ಇಂದ್ರಿಯಗಳ ಹಿಡಿತಕ್ಕೆ ಸಿಗದ. ಬಹುರೂಪಿ – ಹಲವು ರೂಪಗಳಿಂದ ಕೂಡಿ ಕಾಣಿಸಿಕೊಳ್ಳುವಾತ. ವಚನ – ಹನ್ನೆರಡನೆಯ ಶತಮಾನದ ಶಿವಶರಣರು ರಚಿಸಿದ ಸಾಹಿತ್ಯ ಪ್ರಕಾರ; ಆಧುನಿಕ ಸಂದರ್ಭದಲ್ಲೂ ಅಂತಹ ವಚನಗಳು ರಚನೆಯಾಗುತ್ತಿವೆ. ಅಂಕಿತನಾಮ: 'ಹೃದಯೇಶ ಸೋಮೇಶಾ' (ವಚನದ ಕೊನೆಯ ಭಾಗದಲ್ಲಿ ಬರುತ್ತದೆ). ಕವಿ: ಡಾ. ಅಮೃತ ಸೋಮೇಶ್ವರ (27-09-1935, ದಕ್ಷಿಣ ಕನ್ನಡ ಜಿಲ್ಲೆಯ ಅಡ್ಕದಲ್ಲಿ ಜನನ); ಕನ್ನಡ ಮತ್ತು ತುಳು ಭಾಷೆಗಳ ವಿದ್ವಾಂಸರು; ಕೃತಿಗಳು: ಆಡುಂಬೊಲ, ಉಪ್ಪುಗಾಳಿ, ಹೃದಯ ವಚನಗಳು, ತಂಬಿಲ, ರಂಗಿತ; ಫಿನ್‌ಲ್ಯಾಂಡ್ ಮಹಾಕಾವ್ಯ ಕಲೆವಾಲವನ್ನು ತುಳುವಿಗೆ ಅನುವಾದಿಸಿದ್ದಾರೆ; ಎಲೆಗಳು, ರುದ್ರಶಿಲೆ ಸಾಕ್ಷಿ, ವನಮಾಲೆ, ಭಗವತಿ ಆರಾಧನೆ, ಮೋಯ ಮಲಯಾಳ ನಿಘಂಟು; ಕರ್ನಾಟಕ ರಾಜ್ಯೋತ್ಸವ ಪ್ರಶಸ್ತಿ. ಕೌಶಲ: ಓದುವುದು.`,
ab:[
[`ಅ. ಪದಗಳ ಅರ್ಥ ಬರೆಯಿರಿ`,[
[`ಉಪಕರಿಸು`,`ಉಪಕಾರ ಮಾಡು, ನೆರವು ನೀಡು`],
[`ಮೊರೆವ`,`ಗರ್ಜಿಸುವ`],
[`ನಿರಾಳ`,`ಶಾಂತಿ, ನೆಮ್ಮದಿ`],
[`ಸಾಧಿತ`,`ಸಾಧಿಸಿದ, ಸಿದ್ಧಿಯನ್ನು ಪಡೆದ`],
[`ಬಹುರೂಪಿ`,`ಹಲವು ರೂಪಗಳಿಂದ ಕೂಡಿ ಕಾಣಿಸಿಕೊಳ್ಳುವಾತ`]]],
[`ಆ. ಕೊಟ್ಟಿರುವ ವಚನವನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ`,[
[`ಎನಿತು ಭಾಷೆಗಳ ______ ಮಿಡಿತವರಿಯದನ್ನಕ? ... ಹೃದಯೇಶ ಸೋಮೇಶಾ.`,`ಎನಿತು ಭಾಷೆಗಳ ಕಲಿತಡೇನು ಹೃದಯದ ಭಾಷೆ ಕಲಿಯದನ್ನಕ? / ಎನಿತು ನುಡಿ ಸಡಗರ ತೋರ್ದಡೇನು ಎದೆಯ ಮಿಡಿತವರಿಯದನ್ನಕ? / ಎನಿತು ಶೋಧನೆಗೈದಡೇನು ಹೃದಯ ಶೋಧನೆಗೈಯದನ್ನಕ? / ಎನಿತು ಸಾಧನೆಗೈದಡೇನು ಹೃದಯದ ಬೆಸುಗೆ ಸಾಧಿತವಾಗದನ್ನಕ? / ಇವೆಲ್ಲಕ್ಕೂ ಜೀವಭಾವದಾತ ನೀನೆ ಕಾಣ ಹೃದಯೇಶ ಸೋಮೇಶಾ.`]]],
[`ಇ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರಿಸಿರಿ`,[
[`ಯಾವ ಚಾಳಿಯನ್ನು ದೂರವಿಡು ಎಂದು ಅಮೃತ ಸೋಮೇಶ್ವರರು ಹೇಳುತ್ತಾರೆ?`,`ಲೋಕದ ಓಲೈಕೆಯ (ಜನರನ್ನು ಮೆಚ್ಚಿಸುವ) ಚಾಳಿಯನ್ನು ದೂರವಿಡು ಎಂದು ಹೇಳುತ್ತಾರೆ.`],
[`ಹೃದಯದ ಬೆಸುಗೆ ಸಾಧಿತವಾಗುವುದು ಯಾವಾಗ?`,`ಹೃದಯದ ಭಾಷೆಯನ್ನು ಕಲಿತು, ಹೃದಯವನ್ನು ಅರಿತಾಗ ಹೃದಯದ ಬೆಸುಗೆ ಸಾಧಿತವಾಗುತ್ತದೆ. ⚠ ಸೂಚಿತ`],
[`ಅಂಕಿತನಾಮವು ವಚನದ ಯಾವ ಭಾಗದಲ್ಲಿ ಬರುತ್ತದೆ?`,`ವಚನದ ಕೊನೆಯಲ್ಲಿ ಬರುತ್ತದೆ (ಹೃದಯೇಶ ಸೋಮೇಶಾ).`],
[`ನಾವು ಮೊದಲು ಯಾವ ಭಾಷೆಯನ್ನು ಕಲಿಯಬೇಕು?`,`ಹೃದಯದ ಭಾಷೆಯನ್ನು ಕಲಿಯಬೇಕು.`],
[`ಜನ ಕೆರಳಿ ಜರೆಯುವುದು ಯಾವಾಗ?`,`ಒಂಬತ್ತು ಬಾರಿ ಉಪಕಾರ ಮಾಡಿ ಒಮ್ಮೆ ತಪ್ಪಿದರೆ ಜನ ಕೆರಳಿ ಜರೆಯುತ್ತಾರೆ; ಮೊದಲಿನದೆಲ್ಲವನ್ನು ಮರೆತುಬಿಡುತ್ತಾರೆ.`]]],
[`ಈ. ಈ ವಚನವನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ ಕಂಠಪಾಠ ಮಾಡಿರಿ`,[
[`ಒಂಬತ್ತು ತಡವೆ ...`,`ಒಂಬತ್ತು ತಡವೆ ಉಪಕರಿಸಿ ಒಮ್ಮೆ ತಪ್ಪಲು, ಮೊದಲಿನೆಲ್ಲವ ಮರೆವರಯ್ಯ / ಹತ್ತು ಬಾರಿ ಮೆಚ್ಚಿ ಮತ್ತೊಂದು ಬಾರಿ ಟೀಕಿಸಲು, ಕೆರಳಿ ಜರೆವರಯ್ಯ / ಸ್ತುತಿಗೆ ತಲೆಯೊಲೆಯಿಸಿ ನಲಿದೊಲಿವುದಯ್ಯ ಲೋಕ / ಓಲೈಕೆಯ ಚಾಳಿಯ ದೂರೀಕರಿಸಯ್ಯ ಸ್ತೋತ್ರಾತೀತ ಹೃದಯೇಶ ಸೋಮೇಶಾ॥`]]],
[`ಉ. ಕೆಳಗಿನ ಚಿಹ್ನೆಗಳನ್ನು ಗಮನಿಸಿ ಅದರ ಹೆಸರು ಬರೆಯಿರಿ`,[
[`;`,`ಅರ್ಧವಿರಾಮ`],
[`‘......’`,`ಏಕೋಕ್ತಿ ಚಿಹ್ನೆ (ಒಂದು ಉದ್ಧರಣ ಚಿಹ್ನೆ)`],
[`(.......)`,`ಆವರಣ (ಕಂಸ) ಚಿಹ್ನೆ`],
[`“.......”`,`ಉದ್ಧರಣ ಚಿಹ್ನೆ (ಜೋಡಿ ಉದ್ಧರಣ)`],
[`!`,`ಭಾವಸೂಚಕ / ಆಶ್ಚರ್ಯಸೂಚಕ ಚಿಹ್ನೆ`]]],
[`ಭಾಷಾ ಆಟ – ಅಕ್ಷರವೃಂದದಲ್ಲಿ ಅಡಗಿರುವ ಹತ್ತು ಮಂದಿ ವಚನಕಾರರ ಹೆಸರು ಹುಡುಕಿ`,[
[`ವಚನಕಾರರು (ಸೂಚಿತ)`,`ಬಸವಣ್ಣ, ಅಕ್ಕಮಹಾದೇವಿ, ಸಿದ್ಧರಾಮ, ಅಲ್ಲಮಪ್ರಭು, ಚೆನ್ನಬಸವಣ್ಣ, ಮಡಿವಾಳ ಮಾಚಿದೇವ, ದಾಸಿಮಯ್ಯ, ಅಕ್ಕನಾಗಮ್ಮ, ಸಿದ್ಧಯ್ಯ ಮುಂತಾದವರು. ⚠ ಚೌಕದಲ್ಲಿ ಹುಡುಕಿ ದೃಢಪಡಿಸಿ.`]]],
[`ಯೋಜನೆ / ಪೂರಕ ಓದು`,[
[`ಐದು ವಚನಗಳನ್ನು ಸಂಗ್ರಹಿಸಿ ಅವುಗಳ ಸಾರಾಂಶ ಬರೆಯಿರಿ.`,`ಬಸವಣ್ಣ, ಅಕ್ಕಮಹಾದೇವಿಯವರ ವಚನಗಳು, ಆಧುನಿಕ ವಚನಗಳು ಮತ್ತು ಗ್ರಂಥಾಲಯದಲ್ಲಿರುವ ವಚನ ಸಾಹಿತ್ಯವನ್ನು ಓದಿ, ಐದು ವಚನಗಳನ್ನು ಬರೆದು ಅವುಗಳ ಅರ್ಥ/ಸಾರಾಂಶವನ್ನು ಸ್ವಂತ ಮಾತಿನಲ್ಲಿ ಬರೆಯುವುದು.`]]]
],
qb:[
M(`'ಹೃದಯ ವಚನಗಳು' ಕೃತಿಯ ಕರ್ತೃ:`,[`ಬಸವಣ್ಣ`,`ಅಮೃತ ಸೋಮೇಶ್ವರ`,`ಕುವೆಂಪು`,`ಬೇಂದ್ರೆ`],1),
M(`ಈ ವಚನದ ಅಂಕಿತನಾಮ:`,[`ಕೂಡಲಸಂಗಮದೇವ`,`ಹೃದಯೇಶ ಸೋಮೇಶಾ`,`ಗುಹೇಶ್ವರ`,`ರಾಮನಾಥ`],1),
M(`'ನಿರಾಳ' ಪದದ ಅರ್ಥ:`,[`ಶಾಂತಿ, ನೆಮ್ಮದಿ`,`ಕೋಪ`,`ಭಯ`,`ದುಃಖ`],0),
M(`'ಎನಿತು' ಪದದ ಅರ್ಥ:`,[`ಎಷ್ಟು`,`ಯಾರು`,`ಎಲ್ಲಿ`,`ಏನು`],0),
M(`'ಗಜ' ಪದದ ಅರ್ಥ:`,[`ಕುದುರೆ`,`ಆನೆ`,`ಹುಲಿ`,`ಜಿಂಕೆ`],1),
M(`ವಚನಗಳನ್ನು ರಚಿಸಿದವರು ಯಾವ ಶತಮಾನದ ಶಿವಶರಣರು?`,[`ಎಂಟನೆಯ`,`ಹನ್ನೆರಡನೆಯ`,`ಹದಿನೈದನೆಯ`,`ಹತ್ತೊಂಬತ್ತನೆಯ`],1,'m'),
O(`ಅಮೃತ ಸೋಮೇಶ್ವರರು ಹುಟ್ಟಿದ ಊರು ಯಾವುದು?`,`ದಕ್ಷಿಣ ಕನ್ನಡ ಜಿಲ್ಲೆಯ ಅಡ್ಕ.`),
O(`ಹೃದಯದ ಯಾವುದನ್ನು ಅರಿಯದಿದ್ದರೆ ಎಷ್ಟು ಭಾಷೆ ಕಲಿತರೂ ವ್ಯರ್ಥ?`,`ಹೃದಯದ ಭಾಷೆಯನ್ನು.`),
O(`ಲೋಕವು ಯಾವುದಕ್ಕೆ ತಲೆದೂಗಿ ನಲಿದೊಲಿಯುತ್ತದೆ?`,`ಸ್ತುತಿಗೆ (ಹೊಗಳಿಕೆಗೆ).`),
O(`ಅಮೃತ ಸೋಮೇಶ್ವರರು ಯಾವ ಮಹಾಕಾವ್ಯವನ್ನು ತುಳುವಿಗೆ ಅನುವಾದಿಸಿದ್ದಾರೆ?`,`ಫಿನ್‌ಲ್ಯಾಂಡ್ ಮಹಾಕಾವ್ಯ 'ಕಲೆವಾಲ'.`),
O(`ಹೃದಯ ವಚನದಲ್ಲಿ ಹೃದಯವು ಯಾವ ಪ್ರಾಣಿಗಳಂತೆ ರೂಪ ತಾಳುತ್ತದೆಂದು ಹೇಳಿದೆ? ಒಂದು ಹೆಸರು.`,`ಹುಲ್ಲೆ, ಹುಲಿ, ಕುದುರೆ, ಗಜ, ಗೂಳಿ, ನಾಗ, ಮೀನು ಮುಂತಾದವು (ಯಾವುದಾದರೂ ಒಂದು).`),
O(`ವಚನ ಎಂಬುದು ಯಾವ ಸಾಹಿತ್ಯ ಪ್ರಕಾರ?`,`ಹನ್ನೆರಡನೆಯ ಶತಮಾನದ ಶಿವಶರಣರು ರಚಿಸಿದ ಸಾಹಿತ್ಯ ಪ್ರಕಾರ.`),
G(`'ನಿರಾಳ' ಪದಕ್ಕೆ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಶಾಂತಿ / ನೆಮ್ಮದಿ`,'e'),
G(`'ಜರೆ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ನಿಂದಿಸು / ಬಯ್ಯು`,'e'),
G(`'ಗಜ' ಪದದ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಆನೆ`),
G(`ಚಿಹ್ನೆಯ ಹೆಸರು ಬರೆಯಿರಿ: ;`,`ಅರ್ಧವಿರಾಮ`),
G(`ಚಿಹ್ನೆಯ ಹೆಸರು ಬರೆಯಿರಿ: !`,`ಭಾವಸೂಚಕ / ಆಶ್ಚರ್ಯಸೂಚಕ ಚಿಹ್ನೆ`),
G(`ಚಿಹ್ನೆಯ ಹೆಸರು ಬರೆಯಿರಿ: “.......”`,`ಉದ್ಧರಣ ಚಿಹ್ನೆ`),
S(`ಹೃದಯದ ಬೆಸುಗೆ ಸಾಧಿತವಾಗುವುದು ಯಾವಾಗ?`,`ಎಷ್ಟೇ ಭಾಷೆಗಳನ್ನು ಕಲಿತರೂ, ಸಾಧನೆ ಮಾಡಿದರೂ ಹೃದಯದ ಭಾಷೆಯನ್ನು (ಒಳ ಮನಸ್ಸಿನ ಮಿಡಿತವನ್ನು) ಅರಿಯದ ತನಕ ಹೃದಯದ ಬೆಸುಗೆ ಸಾಧ್ಯವಾಗುವುದಿಲ್ಲ; ಹೃದಯವನ್ನು ಅರಿತಾಗಲೇ ಅದು ಸಾಧಿತವಾಗುತ್ತದೆ.`),
S(`ಜನರು ಉಪಕಾರ ಮಾಡಿದವರನ್ನು ಹೇಗೆ ನಡೆಸಿಕೊಳ್ಳುತ್ತಾರೆ ಎಂದು ಕವಿ ಹೇಳಿದ್ದಾರೆ?`,`ಒಂಬತ್ತು ಬಾರಿ ಉಪಕಾರ ಮಾಡಿ ಒಮ್ಮೆ ತಪ್ಪಿದರೆ ಜನರು ಮೊದಲಿನದೆಲ್ಲವನ್ನೂ ಮರೆಯುತ್ತಾರೆ; ಹತ್ತು ಬಾರಿ ಮೆಚ್ಚಿ ಮತ್ತೊಂದು ಬಾರಿ ಟೀಕಿಸಿದರೆ ಕೆರಳಿ ಜರೆಯುತ್ತಾರೆ. ಜನರು ಹೊಗಳಿಕೆಗೆ ತಲೆದೂಗುವರು. ಓಲೈಕೆಯ ಚಾಳಿಯನ್ನು ಬಿಡಬೇಕು ಎಂದು ಕವಿ ಹೇಳುತ್ತಾರೆ.`),
S(`ವಚನ ಎಂದರೇನು? ಅಂಕಿತನಾಮ ಎಂದರೇನು?`,`ವಚನವು ಹನ್ನೆರಡನೆಯ ಶತಮಾನದ ಶಿವಶರಣರು ರಚಿಸಿದ ಸಾಹಿತ್ಯ ಪ್ರಕಾರ. ಪ್ರತಿ ವಚನಕಾರರು ತಮ್ಮ ಆರಾಧ್ಯ ದೈವವನ್ನು ವಚನದ ಕೊನೆಯಲ್ಲಿ ಒಂದು ವಿಶಿಷ್ಟ ಹೆಸರಿನಿಂದ ಕರೆಯುತ್ತಾರೆ; ಅದು ಅಂಕಿತನಾಮ. ಇಲ್ಲಿ 'ಹೃದಯೇಶ ಸೋಮೇಶಾ' ಅಂಕಿತನಾಮ.`),
S(`ಹೃದಯವು ಬಹುರೂಪಿ ಎಂದು ಕವಿ ಹೇಗೆ ತೋರಿಸಿದ್ದಾರೆ?`,`ಹೃದಯವು ಒಮ್ಮೆ ನೆಗೆವ ಹುಲ್ಲೆಯಾಗುತ್ತದೆ, ಒಮ್ಮೆ ಮೊರೆವ ಹುಲಿಯಾಗುತ್ತದೆ, ಒಮ್ಮೆ ಕೆನೆದು ಕುಪ್ಪಳಿಸುವ ಕುದುರೆ, ಗಂಭೀರ ಗತಿಯ ಗಜ, ಗುಟುರುವ ಗೂಳಿ, ಚಪಲತೆಯ ಕೋತಿ, ನಂಜಿನ ನಾಗ, ನೀರೊಳಗೆ ನಿರಾಳವಾಗಿ ಈಜುವ ಮೀನಾಗುತ್ತದೆ – ಹೀಗೆ ಹಲವು ರೂಪಗಳನ್ನು ತಾಳುತ್ತದೆ.`),
L(`'ಹೃದಯ ವಚನಗಳು' ಕೃತಿಯಲ್ಲಿರುವ ವಚನಗಳ ಸಾರಾಂಶವನ್ನು ನಿಮ್ಮ ಮಾತುಗಳಲ್ಲಿ ಬರೆಯಿರಿ.`,`ಮೊದಲ ವಚನದಲ್ಲಿ, ಒಂಬತ್ತು ಬಾರಿ ಉಪಕಾರ ಮಾಡಿದರೂ ಒಮ್ಮೆ ತಪ್ಪಿದರೆ ಜನ ಎಲ್ಲವನ್ನೂ ಮರೆಯುತ್ತಾರೆ; ಟೀಕಿಸಿದರೆ ಕೆರಳಿ ಜರೆಯುತ್ತಾರೆ; ಹೊಗಳಿಕೆಗೆ ಮಾತ್ರ ಸಂತೋಷಪಡುತ್ತಾರೆ; ಆದ್ದರಿಂದ ಓಲೈಕೆಯ ಚಾಳಿಯನ್ನು ದೂರ ಮಾಡು ಎಂದು ಕವಿ ಹೇಳಿದ್ದಾರೆ. ಎರಡನೆಯ ವಚನದಲ್ಲಿ, ಹೃದಯವು ಕೆಲವೊಮ್ಮೆ ಹುಲ್ಲೆ, ಹುಲಿ, ಕುದುರೆ, ಗಜ, ಕೋತಿ, ನಾಗ, ಮೀನು – ಹೀಗೆ ಬಹುರೂಪಿಯಾಗುತ್ತದೆ; ಈ ಪದ್ಧತಿ ತಿಳಿದವನು ದೇವರೇ ಎಂದಿದ್ದಾರೆ. ಮೂರನೆಯ ವಚನದಲ್ಲಿ, ಎಷ್ಟು ಭಾಷೆ ಕಲಿತರೂ, ಮಾತಿನ ಸಡಗರ ತೋರಿದರೂ, ಶೋಧನೆ–ಸಾಧನೆ ಮಾಡಿದರೂ ಹೃದಯದ ಭಾಷೆ ಅರಿಯದಿದ್ದರೆ ವ್ಯರ್ಥ; ಇವೆಲ್ಲಕ್ಕೂ ಜೀವಭಾವದ ದಾತ ನೀನೇ ಎಂದು ಹೇಳಿದ್ದಾರೆ.`),
L(`ಹೃದಯದ ಭಾಷೆಯನ್ನು ಅರಿಯುವುದು ಏಕೆ ಮುಖ್ಯ? ವಿವರಿಸಿ.`,`ಎಷ್ಟೇ ಭಾಷೆ, ವಿದ್ಯೆ, ಸಾಧನೆ ಇದ್ದರೂ ಮನುಷ್ಯರ ಹೃದಯವನ್ನು ಅರ್ಥಮಾಡಿಕೊಳ್ಳದಿದ್ದರೆ ಸಂಬಂಧಗಳು ಗಟ್ಟಿಯಾಗುವುದಿಲ್ಲ. ಹೃದಯದ ಮಿಡಿತ (ಭಾವನೆ) ಅರಿತವರು ಇತರರಿಗೆ ಕರುಣೆ, ಪ್ರೀತಿ, ನೆರವು ನೀಡುತ್ತಾರೆ. ಹೃದಯದ ಬೆಸುಗೆ ಸಾಧಿತವಾದರೆ ಬದುಕಿಗೆ ಶಾಂತಿ, ನೆಮ್ಮದಿ ಸಿಗುತ್ತದೆ. ಆದ್ದರಿಂದ ಹೃದಯದ ಭಾಷೆಯನ್ನು ಮೊದಲು ಕಲಿಯಬೇಕು.`)
]});

LS6.push({n:8,t:`ಕಿತ್ತೂರ ಕೇಸರಿ (ಪದ್ಯ 8)`,au:`ಪ.ಗು. ಸಿದ್ದಾಪುರ`,pg:47,
words:`ದಿಟ್ಟಹೆಜ್ಜೆ – ಧೈರ್ಯದ ಹೆಜ್ಜೆ, ಸಾಹಸದ ನಡೆ; ಚರಿತ್ರೆ – ಇತಿಹಾಸ; ಕುನ್ನಿ – ನಾಯಿಮರಿ; ಜನಜನಿತ – ಪ್ರಸಿದ್ಧವಾದ; ಪರಕೀಯ – ವಿದೇಶೀಯ, ಅನ್ಯ; ಕನವರಿಕೆ – ನಿದ್ದೆಯಲ್ಲಿ ಮಾತಾಡಿಕೊಳ್ಳುವಿಕೆ, ಒಂದೇ ವಿಷಯವನ್ನು ಮತ್ತೆ ಮತ್ತೆ ಯೋಚಿಸುವಿಕೆ; ಕೆಚ್ಚೆದೆ – ಗಟ್ಟಿಯಾದ ಎದೆ, ಎದೆಗಾರಿಕೆ; ರಣಚಂಡಿ – ಯುದ್ಧದೇವತೆ, ದುರ್ಗೆ; ದುರ್ಮತಿ – ಕೆಟ್ಟ ಬುದ್ಧಿ, ದುಷ್ಟ ವ್ಯಕ್ತಿ; ಮಮ್ಮಲ ಮರುಗು – ಅತಿಶಯವಾಗಿ ಮರುಗು, ವಿಶೇಷವಾಗಿ ದುಃಖಪಡು; ಅರಿ – ಶತ್ರು; ಸೆರೆಮನೆ – ಕಾರಾಗೃಹ, ಬಂದೀಖಾನೆ; ಕಲಿ – ವೀರ, ಶೂರ; ಮರುಜನ್ಮ – ಪುನರ್ಜನ್ಮ`,
notes:`ಕವಿ ಪರಗೊಂಡ ಗುರುಪಾದಪ್ಪ ಸಿದ್ದಾಪುರ (ಪ.ಗು. ಸಿದ್ದಾಪುರ): 01-06-1958ರಂದು ವಿಜಯಪುರ (ಬಿಜಾಪುರ) ಜಿಲ್ಲೆಯ ಬಸವನ ಬಾಗೇವಾಡಿಯ ದಾಶಾಳ ಗ್ರಾಮದಲ್ಲಿ ಜನಿಸಿದರು. ತಂದೆ ಗುರುಪಾದಪ್ಪ, ತಾಯಿ ಯಮುನಾಬಾಯಿ. ಎಂ.ಎ., ಎ.ಎಂ. (ಆರ್ಟ್ ಮಾಸ್ಟರ್) ಪದವಿ; ಬಸವನ ಬಾಗೇವಾಡಿಯ ಮುಳವಾಡ ಪ್ರೌಢಶಾಲೆಯಲ್ಲಿ ಚಿತ್ರಕಲಾ ಶಿಕ್ಷಕರಾಗಿ ಸೇವೆ ಸಲ್ಲಿಸಿದ್ದಾರೆ. ರಾಜ್ಯ ಉತ್ತಮ ಶಿಕ್ಷಕ ಪ್ರಶಸ್ತಿ – 2010. ಈ ಪದ್ಯವನ್ನು 'ಮಕ್ಕಳ ನೂರಾರು ಕವಿತೆಗಳು' ಕೃತಿಯಿಂದ ಆರಿಸಲಾಗಿದೆ. ಪದ್ಯದ ರಚನೆ: ಒಂಬತ್ತು ಪದ್ಯಗಳು (ನಾಲ್ಕು ಸಾಲುಗಳ ಚೌಪದಿ). ಕಿತ್ತೂರ ಕೇಸರಿ ರಾಣಿ ಚೆನ್ನಮ್ಮನ ಕುರಿತಾದ ಪದ್ಯ. ಪ್ರಮುಖ ಸೇನಾನಿಗಳು: ಅಮಟೂರು ಬಾಳಪ್ಪ, ಸಂಗೊಳ್ಳಿ ರಾಯಣ್ಣ. ಕೌಶಲ: ಆಲಿಸುವುದು. ವ್ಯಾಕರಣ: ವಾಕ್ಯಗಳ ವಿಧಗಳು.`,
ab:[
[`ಅ. ಬಿಟ್ಟ ಸ್ಥಳ ತುಂಬಿರಿ`,[
[`ಅನ್ನಕ್ಕೆ ಬಂದಿರುವ ______ ಮನ್ನಿಸದೆ`,`ಕುನ್ನಿಗಳ`],
[`ಹೋದರೀ ______ ಪರಕೀಯರಾ ವಶಕೆ!`,`ಸಿರಿನಾಡು`],
[`ಕರಿನೆಲದ ಗರಿಮೆಯನು ತೋರಿಸಲು ______`,`ಬಿಳಿಯರಿಗೆ`],
[`ಮಮ್ಮಲನೆ ಮರುಗಿದಳು ______ ಕೊರಗಿದಳು`,`ಮನನೊಂದು`]]],
[`ಆ. ಕೊಟ್ಟಿರುವ ಪದ ಬಳಸಿ ಸ್ವಂತ ವಾಕ್ಯ ಬರೆಯಿರಿ`,[
[`ಚರಿತ್ರೆ`,`ಮಾದರಿ: ಕಿತ್ತೂರು ರಾಣಿ ಚೆನ್ನಮ್ಮನ ಚರಿತ್ರೆ ಎಲ್ಲರಿಗೂ ಸ್ಫೂರ್ತಿ.`],
[`ಜಯಮಾಲೆ`,`ಮಾದರಿ: ಕಿತ್ತೂರಿನ ಸೇನೆ ಯುದ್ಧದಲ್ಲಿ ಜಯಮಾಲೆ ಧರಿಸಿತು.`],
[`ಋಣ`,`ಮಾದರಿ: ತಾಯ್ನಾಡಿನ ಋಣವನ್ನು ತೀರಿಸಬೇಕು.`]]],
[`ಇ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರಿಸಿರಿ`,[
[`ಚೆನ್ನಮ್ಮ ಏನೆಂದು ಕನವರಿಸಿ ಹಲ್ಲು ಕಡಿದಳು?`,`"ಮಲ್ಲಸಜ್ಜನ ಮನಕೆ ನೋವಾಗದಿರಬಹುದೆ? ಹೋದರೀ ಸಿರಿನಾಡು ಪರಕೀಯರಾ ವಶಕೆ!" ಎಂದು ಕನವರಿಸಿ ಹಲ್ಲು ಕಡಿದಳು.`],
[`ನಮ್ಮ ಅನ್ನವನ್ನು ಉಂಡು ಕೊಬ್ಬಿರುವವರು ಯಾರು?`,`ಕುನ್ನಿಗಳು (ಬ್ರಿಟಿಷರ ಸೈನಿಕರು / ದ್ರೋಹಿಗಳು).`],
[`ಚೆನ್ನಮ್ಮ ಸೈನಿಕರನ್ನು ಕುರಿತು ಏನೆಂದು ಹೇಳಿದಳು?`,`"ಏಳಿರೈ ಕೆಚ್ಚೆದೆಯ ಕಲಿಗಳೇ ನೀವು! ಕರಿನೆಲದ ಗರಿಮೆಯನು ತೋರಿಸಲು ಬಿಳಿಯರಿಗೆ ಛಲ ತೊಟ್ಟು ಹುಲಿಯಂತೆ ನುಗ್ಗೋಣ ನಾವು" ಎಂದು ಹೇಳಿದಳು.`],
[`ಯಾರ ಕೃಪೆಯಿಂದ ಸೈನ್ಯವನ್ನು ಕಟ್ಟಲಾಯಿತು?`,`ರಾಜಗುರುವಿನ ಕೃಪೆ ಪಡೆದು ಅಮಟೂರು ಬಾಳಪ್ಪ, ಸಂಗೊಳ್ಳಿ ರಾಯಣ್ಣ ಮುಂತಾದವರು ಸೇನೆ ಕಟ್ಟಿದರು.`],
[`ಮರುಜನ್ಮ ನೀಡೆಂದು ಚೆನ್ನಮ್ಮ ಯಾರಲ್ಲಿ, ಯಾಕೆ ಕೇಳಿದಳು?`,`ಕರುನಾಡ ಒಡತಿಯಲ್ಲಿ (ಕರ್ನಾಟಕ ಮಾತೆ/ತಾಯಿ ಕನ್ನಡ ನಾಡಿನಲ್ಲಿ); ತಾಯ್ನಾಡಿನ ಋಣವನ್ನು ತೀರಿಸಲು ಈ ಒಂದೇ ಜನ್ಮ ಸಾಲದೆಂದು, ಮತ್ತೆ ಈ ನೆಲದಲ್ಲಿ ಹೆಣ್ಣಾಗಿ ಹುಟ್ಟಲು ಕೇಳಿದಳು.`]]],
[`ಈ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಎರಡು–ಮೂರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರಿಸಿರಿ`,[
[`ರಾಣಿ ಚೆನ್ನಮ್ಮ ಹಲ್ಲು ಕಡಿದದ್ದು ಯಾಕೆ?`,`ಸಿರಿನಾಡಾದ ಕಿತ್ತೂರು ಪರಕೀಯರ (ಬ್ರಿಟಿಷರ) ವಶವಾಯಿತು. ಇದರಿಂದ ಪತಿ ಮಲ್ಲಸರ್ಜನ ಮನಕ್ಕೆ ನೋವಾಗುವುದೆಂದು ಕನವರಿಸುತ್ತ ಕೋಪ–ದುಃಖದಿಂದ ಹಲ್ಲು ಕಡಿದಳು.`],
[`ಕೆಚ್ಚೆದೆಯ ಕಲಿಗಳಿಗೆ ಚೆನ್ನಮ್ಮ ಏನೆಂದು ಹೇಳಿದಳು?`,`"ಕೆಚ್ಚೆದೆಯ ಕಲಿಗಳೇ, ಏಳಿ! ಕರುನಾಡಿನ ಗರಿಮೆಯನ್ನು ಬಿಳಿಯರಿಗೆ (ಬ್ರಿಟಿಷರಿಗೆ) ತೋರಿಸಲು ಛಲ ತೊಟ್ಟು ಹುಲಿಯಂತೆ ನುಗ್ಗೋಣ; ನಮ್ಮ ಅನ್ನವನ್ನು ಉಂಡು ಕೊಬ್ಬಿರುವ ಕುನ್ನಿಗಳ ಶಿರಮಾಲೆಯನ್ನು ಕೊರಳೊಳಗೆ ಧರಿಸೋಣ" ಎಂದು ಹೇಳಿದಳು.`],
[`ಚೆನ್ನಮ್ಮನಿಗೆ ನೋವಾಗಲು ಕಾರಣವೇನು?`,`ಕಿತ್ತೂರು ಸಾಮ್ರಾಜ್ಯವು ಪರಕೀಯರ ವಶವಾಗಿ ತಾನು ಸೆರೆಮನೆ ಸೇರಬೇಕಾಯಿತು; ತಾಯಿನಾಡಿನ ರಕ್ಷಣೆ ಕೈ ಮೀರಿತು ಎಂದು ಮನನೊಂದು ನೋವಾಯಿತು.`],
[`ಕಿತ್ತೂರ ಕೇಸರಿ ಕಣ್ಮುಚ್ಚಿ ಏನೆಂದು ಬೇಡಿಕೊಂಡಳು?`,`"ನಿನ್ನ ಋಣ ತೀರಿಸಲು ನನಗಾಗಲಿಲ್ಲಮ್ಮ; ಈ ಒಂದೇ ಜನ್ಮದಲಿ ಕರುನಾಡ ಒಡತಿ, ಮರುಜನ್ಮ ನೀಡೆನಗೆ ಹೆಣ್ಣಾಗಿ ಈ ನೆಲದಿ" ಎಂದು ಕಣ್ಮುಚ್ಚಿ ಬೇಡಿಕೊಂಡಳು.`]]],
[`ಉ. ಪದ್ಯ ಪೂರ್ಣಗೊಳಿಸಿರಿ`,[
[`ಮಲ್ಲಸಜ್ಜನ ______ ... ಹಲ್ ಕಡಿದಳಾಕೆ`,`ಮಲ್ಲಸಜ್ಜನ ಮನಕೆ ನೋವಾಗದಿರಬಹುದೆ? / ಹೋದರೀ ಸಿರಿನಾಡು ಪರಕೀಯರಾ ವಶಕೆ! / ಮಂಚಕ್ಕೆ ಒರಗಿರುವ ಕಿರಿಯರಸಿ ಚೆನ್ನಮ್ಮ / ಕನವರಿಸಿ ಕಟಕಟನೆ ಹಲ್ ಕಡಿದಳಾಕೆ`],
[`ನಿನ್ನ ಋಣ ______ ... ಕಿತ್ತೂರ ಕೇಸರಿ`,`ನಿನ್ನ ಋಣ ತೀರಿಸಲು ನನಗಾಗಲಿಲ್ಲಮ್ಮ / ಈ ಒಂದೆ ಜನ್ಮದಲಿ ಕರುನಾಡ ಒಡತಿ / 'ಮರುಜನ್ಮ ನೀಡೆನಗೆ ಹೆಣ್ಣಾಗಿ ಈ ನೆಲದಿ' / ಕಣ್ಮುಚ್ಚಿ ಬೇಡಿದಳು ಕಿತ್ತೂರ ಕೇಸರಿ`]]],
[`ಊ. ಈ ಪದ್ಯದಲ್ಲಿರುವ ಪ್ರಾಸಪದಗಳನ್ನು ಆರಿಸಿ ಪಟ್ಟಿ ಮಾಡಿರಿ`,[
[`ಪ್ರಾಸಪದಗಳು`,`ಅಂತ್ಯಪ್ರಾಸ ಉದಾ: ಚೆನ್ನಮ್ಮ – ... ; ಕಲಿಗಳೇ ನೀವು – ನಾವು; ಹೆಜ್ಜೆಯನಿಟ್ಟ – ... ; ಮನಕೆ – ವಶಕೆ (ಕೆ); ಹಲ್ ಕಡಿದಳಾಕೆ – ನೋವಾಗದಿರಬಹುದೆ; ಶಿರಮಾಲೆ ಕೊರಳೊಳಗೆ – ... (ಮಕ್ಕಳೇ ಸಂಗ್ರಹಿಸಿ). ⚠ ಸೂಚಿತ`]]],
[`ವ್ಯಾಕರಣ ಮಾಹಿತಿ – ವಾಕ್ಯಗಳ ವಿಧಗಳು`,[
[`ವಾಕ್ಯಗಳಲ್ಲಿ ಎಷ್ಟು ವಿಧ? ಹೆಸರಿಸಿ.`,`ಮೂರು ವಿಧ: 1) ಸಾಮಾನ್ಯ (ಸರಳ) ವಾಕ್ಯ, 2) ಸಂಯೋಜಿತ ವಾಕ್ಯ, 3) ಮಿಶ್ರವಾಕ್ಯ.`],
[`ಸಾಮಾನ್ಯ ವಾಕ್ಯ ಎಂದರೇನು? ಉದಾಹರಣೆ ಕೊಡಿ.`,`ಒಂದೇ ಪೂರ್ಣ ಕ್ರಿಯಾಪದದೊಡನೆ ಸ್ವತಂತ್ರ ಮತ್ತು ಖಚಿತ ಅರ್ಥ ಕೊಡುವ ವಾಕ್ಯ. ಉದಾ: ಹಕ್ಕಿ ಹಣ್ಣನ್ನು ತಿನ್ನುತ್ತದೆ. ಮೀನು ನೀರಲ್ಲಿ ಈಜುತ್ತದೆ.`],
[`ಸಂಯೋಜಿತ ವಾಕ್ಯ ಎಂದರೇನು? ಉದಾಹರಣೆ ಕೊಡಿ.`,`ಎರಡು ಅಥವಾ ಅನೇಕ ಸಾಮಾನ್ಯ ವಾಕ್ಯಗಳು ಅರ್ಥಸ್ಪಷ್ಟತೆಗಾಗಿ ಸಂಬಂಧಾವ್ಯಯದ ಮೂಲಕ ಸೇರಿಕೊಂಡು ಒಂದು ಪೂರ್ಣ ಅರ್ಥವನ್ನು ನೀಡುವಂತೆ ರಚಿತವಾದ ವಾಕ್ಯ. ಉದಾ: ಮಕ್ಕಳು ಹಾಲನ್ನು ಕುಡಿಯುತ್ತಾರೆ ಮತ್ತು ಹಣ್ಣನ್ನೂ ತಿನ್ನುತ್ತಾರೆ. ಬೆಕ್ಕು ಕಿಟಕಿಯಿಂದ ಹಾಲು ಕುಡಿಯಲು ಮನೆಯೊಳಗೆ ಬಂದಿತು ಆದರೆ ಮನೆಯೊಳಗೆ ಹಾಲಿರಲಿಲ್ಲ.`],
[`ಮಿಶ್ರವಾಕ್ಯ ಎಂದರೇನು? ಉದಾಹರಣೆ ಕೊಡಿ.`,`ಒಂದು ಅಥವಾ ಅನೇಕ ವಾಕ್ಯಗಳು ಒಂದು ಪ್ರಧಾನ ವಾಕ್ಯಕ್ಕೆ ಅಧೀನಗಳಾಗಿರುವಂತೆ ರಚಿತವಾದ ವಾಕ್ಯ. ಉದಾ: ತಮ್ಮ ಗ್ರಾಮಕ್ಕೆ ಹೆಚ್ಚು ಬಸ್ಸು ಬರುವುದೆಂದು ತಿಳಿದು ಗ್ರಾಮಸ್ಥರು ಸಂತಸಪಟ್ಟರು. ಕುವೆಂಪು ಅವರ ಭಾವಗೀತೆಗಳನ್ನು ಕೇಳಿ ವಿದ್ಯಾರ್ಥಿಗಳು ಮೈಮರೆತರು.`]]],
[`ಭಾಷಾ ಆಟಗಳು – ದೇಶೀಯ / ಅನ್ಯದೇಶೀಯ ಪದಗಳು`,[
[`ಅ. ಅಚ್ಚಗನ್ನಡ, ಸಂಸ್ಕೃತ, ಇಂಗ್ಲಿಷ್, ಪೋರ್ಚುಗೀಸ್ ಭಾಷೆಯ ಪದಗಳಾಗಿ ವಿಂಗಡಿಸಿ`,`ಅಚ್ಚಗನ್ನಡ: ಮನೆ, ಹೊಲ, ಗದ್ದೆ, ಹಿತ್ತಿಲು, ತಿಳಿವಳಿಕೆ, ಬಾಯಿ. ಸಂಸ್ಕೃತ: ಭೂಮಿ, ನದಿ, ಸಂಧ್ಯಾ, ಆರ್ಯ, ರಾತ್ರಿ. ಇಂಗ್ಲಿಷ್: ರೋಡ್, ಛೇರ್‌ಮನ್, ಕೋರ್ಟ್, ಸ್ಕೂಲ್, ಬ್ಯಾಂಕ್. ಪೋರ್ಚುಗೀಸ್: ಅಲಮಾರು, ಸಾಬೂನು, ಮೇಜು, ಪಾದ್ರಿ.`],
[`ಆ. ದೇಶೀಯ ಮತ್ತು ಅನ್ಯದೇಶೀಯ ಪದಗಳನ್ನು ಪ್ರತ್ಯೇಕಿಸಿ ಬರೆಯಿರಿ`,`ದೇಶೀಯ ಪದಗಳು: ಬೆಲ್ಲ, ನೀರು, ಹುಲ್ಲು, ಹೊಲ, ಆಟ, ಲಾವಣಿ. ಅನ್ಯದೇಶೀಯ ಪದಗಳು: ದಿವಾನ, ಸೈಕಲ್, ಅನಾನಸು, ವಜಾ, ಜರೂರು, ಸರದಾರ, ಸಿನಿಮಾ, ಖಾನಾವಳಿ, ಶಿಫಾರಸ್ಸು, ಮೇಜು, ಪಗಾರ, ಸಾಬೂನು, ಎಕರೆ, ಸರಕಾರ, ಕಚೇರಿ, ಜಾನುವಾರು, ಬಟಾಟೆ, ಅಮಲ್ದಾರ್. ⚠ ಪಠ್ಯದ ಪದಪಟ್ಟಿಯನ್ನು ನೋಡಿ ಶಿಕ್ಷಕರು ಪರಿಶೀಲಿಸಿ (ಉದಾ: 'ಚೂಡ').`],
[`ಏ. ಪದ್ಯ ಓದಿ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರ ಬರೆಯಿರಿ (ಬಂತಪ್ಪ ಬಂತು ಮಳೆಗಾಲ)`,`1. ಕಾಲಗಳು: ಮಳೆಗಾಲ, ಚಳಿಗಾಲ, ಬೇಸಿಗೆ ಕಾಲ. 2. ಮಳೆಗಾಲದಲ್ಲಿ ಬೆಳೆಯನ್ನು ಬೆಳೆಯುತ್ತಾರೆ (ಬೀಜ ಬಿತ್ತುವ, ಬೆಳೆ ಬೆಳೆಯುವ ಕಾಲ). 3. ಎಲೆಗಳು ಚಳಿಗಾಲದಲ್ಲಿ ಉದುರುತ್ತವೆ. 4. ಮಾವು ಹೆಚ್ಚಾಗಿ ಬೇಸಿಗೆ ಕಾಲದಲ್ಲಿ ಸಿಗುತ್ತದೆ.`]]]
],
qb:[
M(`'ಕಿತ್ತೂರ ಕೇಸರಿ' ಪದ್ಯವು ಯಾರ ಬಗ್ಗೆ?`,[`ಒನಕೆ ಓಬವ್ವ`,`ಕಿತ್ತೂರು ರಾಣಿ ಚೆನ್ನಮ್ಮ`,`ರಾಣಿ ಅಬ್ಬಕ್ಕ`,`ಬೆಳವಡಿ ಮಲ್ಲಮ್ಮ`],1),
M(`ಕಿತ್ತೂರ ಕೇಸರಿ ಪದ್ಯವನ್ನು ಬರೆದವರು:`,[`ಕಯ್ಯಾರ ಕಿಞ್ಞಣ್ಣ ರೈ`,`ಪ.ಗು. ಸಿದ್ದಾಪುರ`,`ಅಮೃತ ಸೋಮೇಶ್ವರ`,`ಸಿದ್ಧಲಿಂಗ ಪಟ್ಟಣಶೆಟ್ಟಿ`],1),
M(`'ಕುನ್ನಿ' ಪದದ ಅರ್ಥ:`,[`ನಾಯಿಮರಿ`,`ಹುಲಿ`,`ಕುದುರೆ`,`ಹಸು`],0),
M(`'ಅರಿ' ಪದದ ಅರ್ಥ:`,[`ಮಿತ್ರ`,`ಶತ್ರು`,`ತಾಯಿ`,`ಗುರು`],1),
M(`'ಸೆರೆಮನೆ' ಪದದ ಅರ್ಥ:`,[`ಅರಮನೆ`,`ಕಾರಾಗೃಹ`,`ದೇವಾಲಯ`,`ಶಾಲೆ`],1),
M(`'ಹಕ್ಕಿ ಹಣ್ಣನ್ನು ತಿನ್ನುತ್ತದೆ' – ಇದು ಯಾವ ವಾಕ್ಯ?`,[`ಸಾಮಾನ್ಯ ವಾಕ್ಯ`,`ಸಂಯೋಜಿತ ವಾಕ್ಯ`,`ಮಿಶ್ರವಾಕ್ಯ`,`ಪ್ರಶ್ನಾರ್ಥಕ`],0,'m'),
O(`ರಾಣಿ ಚೆನ್ನಮ್ಮ ಯಾವ ಸಂಸ್ಥಾನದ ರಾಣಿ?`,`ಕಿತ್ತೂರು ಸಂಸ್ಥಾನದ.`),
O(`ಚೆನ್ನಮ್ಮನ ಗಂಡನ ಹೆಸರೇನು?`,`ಮಲ್ಲಸರ್ಜ (ಮಲ್ಲಸಜ್ಜ).`),
O(`ಚೆನ್ನಮ್ಮನ ಸೇನೆ ಕಟ್ಟಿದ ಇಬ್ಬರು ವೀರರ ಹೆಸರು ಬರೆಯಿರಿ.`,`ಅಮಟೂರು ಬಾಳಪ್ಪ ಮತ್ತು ಸಂಗೊಳ್ಳಿ ರಾಯಣ್ಣ.`),
O(`ಈ ಪದ್ಯವನ್ನು ಯಾವ ಕೃತಿಯಿಂದ ಆರಿಸಲಾಗಿದೆ?`,`'ಮಕ್ಕಳ ನೂರಾರು ಕವಿತೆಗಳು'.`),
O(`ಪ.ಗು. ಸಿದ್ದಾಪುರ ಅವರ ವೃತ್ತಿ ಯಾವುದು?`,`ಚಿತ್ರಕಲಾ ಶಿಕ್ಷಕರು.`),
O(`ಮರುಜನ್ಮದಲ್ಲಿ ಚೆನ್ನಮ್ಮ ಏನಾಗಿ ಹುಟ್ಟಲು ಬೇಡಿದಳು?`,`ಈ ನೆಲದಲ್ಲಿ ಹೆಣ್ಣಾಗಿ ಹುಟ್ಟಲು.`),
G(`'ಚರಿತ್ರೆ' ಪದಕ್ಕೆ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಇತಿಹಾಸ`,'e'),
G(`'ಅರಿ' ಪದದ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಶತ್ರು`,'e'),
G(`'ಕಲಿ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ವೀರ, ಶೂರ`),
G(`ಅಚ್ಚಗನ್ನಡ ಪದ ಗುರುತಿಸಿ: ಭೂಮಿ, ಮನೆ, ರಾತ್ರಿ, ನದಿ`,`ಮನೆ`),
G(`ಇಂಗ್ಲಿಷ್ ಭಾಷೆಯ ಪದ ಗುರುತಿಸಿ: ಅಲಮಾರು, ರೋಡ್, ಸಾಬೂನು, ಮೇಜು`,`ರೋಡ್`),
G(`ವಾಕ್ಯದ ವಿಧ ಹೆಸರಿಸಿ: "ಮೀನು ನೀರಲ್ಲಿ ಈಜುತ್ತದೆ."`,`ಸಾಮಾನ್ಯ (ಸರಳ) ವಾಕ್ಯ`),
S(`ರಾಣಿ ಚೆನ್ನಮ್ಮ ಹಲ್ಲು ಕಡಿದದ್ದು ಯಾಕೆ?`,`ಸಿರಿನಾಡು ಪರಕೀಯರ ವಶವಾಯಿತು; ಇದರಿಂದ ಪತಿ ಮಲ್ಲಸರ್ಜನ ಮನಕ್ಕೆ ನೋವಾಗುವುದೆಂದು ಕನವರಿಸುತ್ತಾ ಕೋಪ–ದುಃಖದಿಂದ ಚೆನ್ನಮ್ಮ ಹಲ್ಲು ಕಡಿದಳು.`),
S(`ಚೆನ್ನಮ್ಮ ತನ್ನ ಸೈನಿಕರನ್ನು ಉದ್ದೇಶಿಸಿ ಏನು ಹೇಳಿದಳು?`,`"ಕೆಚ್ಚೆದೆಯ ಕಲಿಗಳೇ, ಏಳಿರಿ! ಕರುನಾಡಿನ ಗರಿಮೆಯನ್ನು ಬಿಳಿಯರಿಗೆ ತೋರಿಸಲು ಛಲ ತೊಟ್ಟು ಹುಲಿಯಂತೆ ನುಗ್ಗೋಣ" ಎಂದು ಹೇಳಿ ಹುರಿದುಂಬಿಸಿದಳು.`),
S(`ಸಂಯೋಜಿತ ವಾಕ್ಯ ಮತ್ತು ಮಿಶ್ರವಾಕ್ಯಗಳ ವ್ಯತ್ಯಾಸ ತಿಳಿಸಿ.`,`ಎರಡು ಅಥವಾ ಹೆಚ್ಚು ಸಾಮಾನ್ಯ ವಾಕ್ಯಗಳು ಸಂಬಂಧಾವ್ಯಯಗಳಿಂದ ಸೇರಿದರೆ ಸಂಯೋಜಿತ ವಾಕ್ಯ (ಉದಾ: ಬೆಕ್ಕು ಬಂದಿತು ಆದರೆ ಹಾಲಿರಲಿಲ್ಲ). ಒಂದು ಪ್ರಧಾನ ವಾಕ್ಯಕ್ಕೆ ಇತರ ವಾಕ್ಯಗಳು ಅಧೀನವಾಗಿ ಇದ್ದರೆ ಮಿಶ್ರವಾಕ್ಯ (ಉದಾ: ಬಸ್ಸು ಬರುವುದೆಂದು ತಿಳಿದು ಗ್ರಾಮಸ್ಥರು ಸಂತಸಪಟ್ಟರು).`),
S(`ಸ್ವಾತಂತ್ರ್ಯ ಹೋರಾಟದಲ್ಲಿ ಚೆನ್ನಮ್ಮನ ಪಾತ್ರವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಬರೆಯಿರಿ.`,`ಚೆನ್ನಮ್ಮ ಕಿತ್ತೂರು ಸಂಸ್ಥಾನದ ರಾಣಿ. ಬ್ರಿಟಿಷರ ವಿರುದ್ಧ ರಣಚಂಡಿಯಂತೆ ಹೋರಾಡಿ ಸೈನ್ಯವನ್ನು ಮುನ್ನಡೆಸಿ ಒಮ್ಮೆ ಜಯಗಳಿಸಿದಳು. ನಂತರ ಸೋತು ಸೆರೆಮನೆ ಸೇರಿದರೂ ನಾಡಿಗಾಗಿ ಮರುಜನ್ಮ ಬೇಡಿದ ದೇಶಭಕ್ತೆ.`),
L(`'ಕಿತ್ತೂರ ಕೇಸರಿ' ಪದ್ಯದ ಸಾರಾಂಶವನ್ನು ನಿಮ್ಮ ಮಾತುಗಳಲ್ಲಿ ಬರೆಯಿರಿ.`,`ಕಿತ್ತೂರು ರಾಣಿ ಚೆನ್ನಮ್ಮನ ವೀರಚರಿತೆ ಕಟ್ಟುಕತೆಯಲ್ಲ; ಧೈರ್ಯದ ಹೆಜ್ಜೆಯನ್ನಿಟ್ಟ ವೀರವನಿತೆಯ ಚರಿತ್ರೆ. ಅನ್ನಕ್ಕೆ ಬಂದ ಕುನ್ನಿಗಳನ್ನು (ಬ್ರಿಟಿಷರ ಕೈಕೂಸುಗಳನ್ನು) ಮನ್ನಿಸದೆ ಸಮರ ಸಾರಿದವಳು. ಮಲ್ಲಸರ್ಜನ ಮನ ನೋಯುತ್ತದೆ ಎಂದು ಕನವರಿಸಿ ಹಲ್ಲು ಕಡಿದಳು. ತುತ್ತೂರಿ ಊದಿ ಸೈನಿಕರನ್ನು ಕರೆದು ಕೆಚ್ಚು ತುಂಬಿದಳು; ಅಮಟೂರು ಬಾಳಪ್ಪ, ಸಂಗೊಳ್ಳಿ ರಾಯಣ್ಣ ಸೇನೆ ಕಟ್ಟಿದರು. ರಣಚಂಡಿಯಾಗಿ ಖಡ್ಗ ಬೀಸಿದಳು. ಜಯಮಾಲೆ ಧರಿಸಿದರೂ ಮುಂದೆ ದುರ್ಮತಿಗಳ ಕುತಂತ್ರದಿಂದ ಸೋತು ಸೆರೆಮನೆ ಸೇರಿದಳು. ಕರುನಾಡ ತಾಯಿಯ ಋಣ ತೀರಿಸಲಾಗಲಿಲ್ಲವೆಂದು ಮರುಜನ್ಮ ನೀಡೆಂದು ಕಣ್ಮುಚ್ಚಿ ಬೇಡಿದಳು.`),
L(`ಚೆನ್ನಮ್ಮನ ದೇಶಪ್ರೇಮ ಮತ್ತು ವೀರತ್ವವನ್ನು ಪದ್ಯದ ಆಧಾರದಿಂದ ವರ್ಣಿಸಿ.`,`ಚೆನ್ನಮ್ಮನಿಗೆ ತನ್ನ ನಾಡು ಪರಕೀಯರ ವಶವಾದುದರ ನೋವು ತೀವ್ರವಾಗಿತ್ತು. ಸೈನಿಕರಿಗೆ "ಏಳಿರೈ ಕೆಚ್ಚೆದೆಯ ಕಲಿಗಳೇ" ಎಂದು ಹುರಿದುಂಬಿಸಿ, ತುತ್ತೂರಿ ಊದಿ ಹೋರಾಟಕ್ಕೆ ಕರೆ ನೀಡಿದಳು. ಸ್ವತಃ ರಣಚಂಡಿಯಂತೆ ಖಡ್ಗ ಬೀಸಿ ಮುಂದೆ ಸಾಗಿದಳು. ಸೆರೆಮನೆಯಲ್ಲಿದ್ದರೂ "ತಾಯ್ ನೆಲದ ರಕ್ಷಣೆ ಕೈ ಮೀರಿತು" ಎಂದು ಮರುಗಿದಳು. ಮರುಜನ್ಮದಲ್ಲೂ ಇದೇ ನೆಲದಲ್ಲಿ ಹೆಣ್ಣಾಗಿ ಹುಟ್ಟಿ ನಾಡಿನ ಋಣ ತೀರಿಸುವೆನೆಂದಳು. ಇದು ಅವಳ ಅಪ್ರತಿಮ ದೇಶಪ್ರೇಮ ಮತ್ತು ಧೈರ್ಯವನ್ನು ತೋರಿಸುತ್ತದೆ.`)
]});

LS6.push({n:9,t:`ಗಾಢ ಕತ್ತಲು ಮತ್ತು ಗುಮ್ಮಗಳು (ಪೂರಕ ಪಾಠ 3 – ಗದ್ಯ)`,au:`ವಿಜಯಶ್ರೀ ಹಾಲಾಡಿ`,pg:54,
words:`ಗುಮ್ಮ – ಭಯ ಹುಟ್ಟಿಸುವ ಕಲ್ಪಿತ ಜೀವಿ; ಗುಬೆ – ಗೂಬೆ (ಒಂದು ಹಕ್ಕಿ); ಮಸಿ – ಕಪ್ಪು ಬಣ್ಣದ ದ್ರವ; ಅಮಾವಾಸ್ಯೆ – ಚಂದ್ರ ಕಾಣದ ದಿನ; ಚಿಮಣಿದೀಪ – ಸೀಮೆಎಣ್ಣೆ ದೀಪ; ಉಪ್ಪರಿಗೆ – ಮನೆಯ ಮಹಡಿ; ಸೂಡಿ – ತೆಂಗು/ಅಡಿಕೆ ಗರಿಗಳಿಂದ ಕಟ್ಟಿದ ಕೈದೀಪ; ಅಪಶಕುನ – ಕೆಟ್ಟ ಸೂಚನೆ; ಯಕ್ಷಗಾನ – ಕರ್ನಾಟಕದ ಕರಾವಳಿಯ ಜನಪ್ರಿಯ ರಂಗಕಲೆ`,
notes:`ಲೇಖಕಿ ವಿಜಯಶ್ರೀ ಹಾಲಾಡಿ (ಜನನ: 28 ಏಪ್ರಿಲ್ 1975) – ಉಡುಪಿ ಜಿಲ್ಲೆಯ ಕುಂದಾಪುರ ತಾಲ್ಲೂಕಿನ ಹಾಲಾಡಿ ಗ್ರಾಮದ ಮುದೂರಿ ಹಳ್ಳಿಯವರು. ತಂದೆ ಎಂ. ಬಾಬು ರಾವ್, ತಾಯಿ ರತ್ನಾವತಿ. ಸರ್ಕಾರಿ ಪ್ರೌಢಶಾಲೆಯ ಕನ್ನಡ ಭಾಷಾ ಶಿಕ್ಷಕಿ. ಮಕ್ಕಳ ಕೃತಿಗಳು: ಓತಿಕ್ಯಾತ ತಲೆಕುಣಿಸ್ಸಿ, ಪಪ್ಪು ನಾಯಿಯ ಪೀಪಿ, ಸೂರಕ್ಕಿ ಗೇಟ್, ಜಂಬಿಕೊಳ್ಳಿ ಮತ್ತು ಪುಟ್ಟ ವಿಜಿ, ಕಾಡಂಚಿನ ಊರಿನಲ್ಲಿ. 'ಪಪ್ಪು ನಾಯಿಯ ಪೀಪಿ' ಕೃತಿಗೆ 2015ರ ಕರ್ನಾಟಕ ಸಾಹಿತ್ಯ ಅಕಾಡೆಮಿ ಪುಸ್ತಕ ಬಹುಮಾನ ಬಂದಿದೆ.`,
ab:[
[`ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ`,[
[`ವಿಜಿಗೆ ಗುಮ್ಮಗಳ ಬಗ್ಗೆ ಭಯ ಹುಟ್ಟಿದ್ದೇಕೆ?`,`ಅಕ್ಕಂದಿರು "ಗುಮ್ಮನ ಚಿತ್ರ ಬಿಡಿಸು" ಎಂದರೆ ದೊಡ್ಡ ಕಣ್ಣು ಬಿಡಿಸಿ ಭಯಾನಕ ವೇಷ ಬರೆಯುತ್ತಿದ್ದರು; ಹಾಲು ಕುಡಿಯದಿದ್ದರೆ, ಊಟ ಮಾಡದಿದ್ದರೆ "ಗುಮ್ಮ ಬರುತ್ತದೆ" ಎಂದು ಹೆದರಿಸುತ್ತಿದ್ದರು; ಮನೆಯ ಹತ್ತಿರ ಮಳೆಗಾಲದ ರಾತ್ರಿಗಳಲ್ಲಿ ಗುಮ್ಮಗಳು 'ಊಂ ಹೂಂ' ಎಂದು ಕೂಗುವುದನ್ನು ಕೇಳಿ ಭಯವಾಗಿತ್ತು.`],
[`ಹಳ್ಳಿಯಲ್ಲಿ ರಾತ್ರಿಯ ಕತ್ತಲು ಹೇಗಿರುತ್ತದೆ?`,`ವಿದ್ಯುತ್ ಇಲ್ಲದ ಊರಿನಲ್ಲಿ ಸುತ್ತಲೂ ದಟ್ಟ ಕಾಡು, ಗದ್ದೆ, ತೋಟ ಇರುವುದರಿಂದ ಕತ್ತಲು ದಟ್ಟವಾಗಿರುತ್ತದೆ. ಜಗವೆಲ್ಲ ಮಸಿಯಲ್ಲಿ ಅದ್ದಿದಂತೆ; ಕಣ್ಣಿಗೆ ಕಣ್ಣು ತಾಗಿಸಿದರೂ ಕತ್ತಲಲ್ಲದೆ ಬೇರೇನೂ ಕಾಣುವುದಿಲ್ಲ. ಮೋಡದ ಮಳೆಗಾಲ ಮತ್ತು ಅಮಾವಾಸ್ಯೆಯಲ್ಲಿ ಇನ್ನೂ ಹೆಚ್ಚು ಕಟುವಾಗಿರುತ್ತದೆ.`],
[`ರಾತ್ರಿಯ ಕತ್ತಲಿನಲ್ಲಿ ಬೆಳಕು ಹುಟ್ಟಿಸಿಕೊಳ್ಳಲು ಹಳ್ಳಿಗರು ಏನೇನು ಉಪಾಯಗಳನ್ನು ಮಾಡುತ್ತಾರೆ?`,`ಚಿಮಣಿದೀಪ, ಒಂದೆರಡು ಲ್ಯಾಂಪುಗಳು, ದೇವರ ದೀಪ ಹಚ್ಚುತ್ತಿದ್ದರು; ಉಪ್ಪರಿಗೆ, ಕೋಣೆ, ಬಚ್ಚಲುಮನೆ ಮೊದಲಾದ ಕಡೆ ಹೋಗುವಾಗ ಚಿಮಣಿ ಹಿಡಿದು ಹೋಗುತ್ತಿದ್ದರು; ತೋಟ ಅಥವಾ ದೂರ ಹೋಗುವಾಗ ಬ್ಯಾಟರಿ ಬಳಸುತ್ತಿದ್ದರು; ದೂರದ ಪ್ರಯಾಣಕ್ಕೆ ತೆಂಗು, ಅಡಿಕೆಯ ಗರಿಗಳಿಂದ ತಯಾರಿಸಿ ಬಾಳೆನಾರಿನಿಂದ ಕಟ್ಟಿದ ಸೂಡಿಯನ್ನು ಬೆಂಕಿ ಹಚ್ಚಿ ಬೀಸುತ್ತ ನಡೆಯುತ್ತಿದ್ದರು.`],
[`ಯಕ್ಷಗಾನ ನೋಡಲು ಹೋಗಿಬರುವ ರಾತ್ರಿಗಳ ಅನುಭವಗಳೇನು?`,`ಅಮ್ಮ, ದೊಡ್ಡಮ್ಮ, ವಿಜಿ, ತಂಗಿ ನೀಲಿಮಾ ಮತ್ತು ಅಕ್ಕಂದಿರು ರಾತ್ರಿ ಯಕ್ಷಗಾನಕ್ಕೆ ಹೋಗುತ್ತಿದ್ದರು. ನೀರವ ರಾತ್ರಿಯಲ್ಲಿ ಬ್ಯಾಟರಿ ಹಿಡಿದು ಕಾಡಿನ ದಾರಿಯಲ್ಲಿ ನಡೆದುಹೋಗುವಾಗ ಕಾಡಿನ ಗಾಳಿಯನ್ನು ಹೀರಿಕೊಳ್ಳುತ್ತಿದ್ದಳು. ಹಿಂತಿರುಗುವಾಗ ನೋಡಿದ ಯಕ್ಷಗಾನದ ಕುರಿತು ವಿಮರ್ಶೆ, ಟೀಕೆ ಟಿಪ್ಪಣಿಗಳ ಚರ್ಚೆ ನಡೆಯುತ್ತಿತ್ತು. ಆಗಿನ ಖುಷಿಯನ್ನು ವರ್ಣಿಸಲು ಅಸಾಧ್ಯ.`],
[`ವಿಜಿ ಕತ್ತಲಿನ ಭಯವನ್ನು ಹೇಗೆ ಗೆದ್ದಳು?`,`ಗುಮ್ಮನಂತೆ "ಊಂ ಹೂಂ" ಕೂಗುತ್ತಿದ್ದವರು ಆಚೆಮನೆ ದೊಡ್ಡಮ್ಮನೇ ಎಂದು ತಿಳಿದಾಗ ಭಯ ಕಡಿಮೆಯಾಯಿತು. ಕಾಡು ಮತ್ತು ಕತ್ತಲೆಯ ವಾತಾವರಣದಲ್ಲಿ ಬಾಲ್ಯದಿಂದಲೂ ಬೆಳೆದುದರಿಂದ ಒಬ್ಬಳೇ ಬ್ಯಾಟರಿ ಹಿಡಿದು ತೋಟದ ತನಕ ಹೋಗುವ ಧೈರ್ಯ ಬೆಳೆಯಿತು. ಒಂಬತ್ತನೇ ತರಗತಿಗೆ ಬಂದಾಗ ರಾತ್ರಿ ಒಬ್ಬಳೇ ಉಪ್ಪರಿಗೆಯಲ್ಲಿ ಮಲಗಿ ಕತ್ತಲನ್ನು ದಿಟ್ಟಿಸುತ್ತ ಮಲಗುವುದು ಅಭ್ಯಾಸವಾಯಿತು; ಗಾಢ ಕತ್ತಲು, ರಾತ್ರಿ ಮತ್ತು ಮಳೆ ಅವಳಿಗೆ ಇಷ್ಟವಾಗಿ ಹೋಯಿತು.`]]]
],
qb:[
M(`ವಿಜಿಯ ಕಲ್ಪನೆಯಲ್ಲಿ ಕತ್ತಲೆಂದರೆ:`,[`ಬೆಳಕು`,`ಗುಮ್ಮ`,`ಹೂವು`,`ಹಣ್ಣು`],1),
M(`ವಿಜಿ ಬೆಳೆದ ಮನೆ ಇರುವ ಸ್ಥಳ:`,[`ನಗರ`,`ಹಳ್ಳಿ`,`ಬಂದರು`,`ಮರುಭೂಮಿ`],1),
M(`'ಸೂಡಿ' ತಯಾರಿಸಲು ಬಳಸುವ ವಸ್ತು:`,[`ತೆಂಗು/ಅಡಿಕೆ ಗರಿ`,`ಕಬ್ಬು`,`ರೇಷ್ಮೆ`,`ಪ್ಲಾಸ್ಟಿಕ್`],0),
M(`'ಉಪ್ಪರಿಗೆ' ಎಂದರೆ:`,[`ಮನೆಯ ಮಹಡಿ`,`ಅಡುಗೆಮನೆ`,`ತೋಟ`,`ಬಾವಿ`],0),
M(`ಗುಮ್ಮ ಬಂದಂತೆ ಕೂಗುತ್ತಿದ್ದವರು ಯಾರೆಂದು ವಿಜಿಗೆ ತಿಳಿಯಿತು?`,[`ಅಜ್ಜಿ`,`ಆಚೆಮನೆ ದೊಡ್ಡಮ್ಮ`,`ಅಕ್ಕ`,`ತಂಗಿ`],1),
M(`ಲೇಖಕಿಯ ಯಾವ ಕೃತಿಗೆ 2015ರ ಕರ್ನಾಟಕ ಸಾಹಿತ್ಯ ಅಕಾಡೆಮಿ ಪುಸ್ತಕ ಬಹುಮಾನ ಬಂದಿದೆ?`,[`ಸೂರಕ್ಕಿ ಗೇಟ್`,`ಪಪ್ಪು ನಾಯಿಯ ಪೀಪಿ`,`ಓತಿಕ್ಯಾತ ತಲೆಕುಣಿಸ್ಸಿ`,`ಕಾಡಂಚಿನ ಊರಿನಲ್ಲಿ`],1,'m'),
O(`ವಿಜಿಯ ತಂಗಿಯ ಹೆಸರೇನು?`,`ನೀಲಿಮಾ.`),
O(`ಗುಮ್ಮ ಎಂದರೆ ವಿಜಿಗೆ ಏನೆಂದು ತಿಳಿದಿತ್ತು? (ನಿಜವಾಗಿ)`,`ಗೂಬೆ ಎನ್ನುವ ಒಂದು ಹಕ್ಕಿ.`),
O(`ವಿಜಿ ಮತ್ತು ಅಜ್ಜಿ ಎಷ್ಟು ಗಂಟೆಗೆ ಮಲಗುತ್ತಿದ್ದರು?`,`ಸರಿಯಾಗಿ ಒಂಬತ್ತು ಗಂಟೆಗೆ.`),
O(`ವಿಜಿ ರಾತ್ರಿ ಎಲ್ಲಿ ಒಬ್ಬಳೇ ಮಲಗುತ್ತಿದ್ದಳು?`,`ಉಪ್ಪರಿಗೆಯಲ್ಲಿ.`),
O(`ಮಳೆಗಾಲದ ರಾತ್ರಿ ವಿಜಿ–ನೀಲಿಮಾ ಏನೆಂದು ಪ್ರಾರ್ಥಿಸುತ್ತಿದ್ದರು?`,`"ಜೋರಾಗಿ ಮಳೆ ಬರಲಿ ದೇವರೇ" ಎಂದು.`),
O(`ಲೇಖಕಿಯ ತಂದೆಯ ಹೆಸರೇನು?`,`ಎಂ. ಬಾಬು ರಾವ್.`),
G(`'ಅಪಶಕುನ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ಕೆಟ್ಟ ಸೂಚನೆ`,'e'),
G(`'ಕತ್ತಲು' ಪದದ ವಿರುದ್ಧಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಬೆಳಕು`,'e'),
G(`'ಗುಮ್ಮ' ಪದದ ಬಹುವಚನ ರೂಪ ಬರೆಯಿರಿ.`,`ಗುಮ್ಮಗಳು`),
G(`'ಅಮಾವಾಸ್ಯೆ' ಎಂದರೇನು?`,`ಚಂದ್ರ ಕಾಣದ ದಿನ`),
G(`'ಮಳೆಗಾಲ' ಪದದ ಸಂಧಿ ಹೆಸರೇನು? (ಮಳೆ + ಕಾಲ)`,`ಕನ್ನಡ ಸಂಧಿ – ಆದೇಶ ಸಂಧಿ ⚠ ಸೂಚಿತ`,'h'),
G(`'ಸೂಡಿ' ಎಂದರೇನು?`,`ತೆಂಗು/ಅಡಿಕೆ ಗರಿಗಳಿಂದ ಕಟ್ಟಿದ ಕೈದೀಪ`),
S(`ವಿಜಿಗೆ ಗುಮ್ಮಗಳ ಬಗ್ಗೆ ಭಯ ಹುಟ್ಟಿದ್ದೇಕೆ?`,`ಅಕ್ಕಂದಿರು ಗುಮ್ಮನ ಭಯಾನಕ ಚಿತ್ರ ಬರೆಯುತ್ತಿದ್ದರು; ಹಾಲು ಕುಡಿಯದಿದ್ದರೆ ಗುಮ್ಮ ಬರುತ್ತದೆ ಎಂದು ಹೆದರಿಸುತ್ತಿದ್ದರು; ಮಳೆಗಾಲದ ರಾತ್ರಿಯಲ್ಲಿ ಗುಮ್ಮಗಳು ಕೂಗುವುದು ಕೇಳಿಸುತ್ತಿತ್ತು. ಹೀಗಾಗಿ ಭಯ ಹುಟ್ಟಿತು.`),
S(`ಹಳ್ಳಿಯಲ್ಲಿ ರಾತ್ರಿಯ ಕತ್ತಲು ಹೇಗಿರುತ್ತದೆ?`,`ಹಳ್ಳಿಯಲ್ಲಿ ವಿದ್ಯುತ್ ಇಲ್ಲದಿದ್ದರೆ ಸುತ್ತಲೂ ದಟ್ಟ ಕಾಡು. ಜಗತ್ತೆಲ್ಲ ಮಸಿಯಲ್ಲಿ ಅದ್ದಿದಂತಿರುತ್ತದೆ. ಕಣ್ಣಿಗೆ ಕಣ್ಣು ತಾಗಿಸಿದರೂ ಕತ್ತಲಲ್ಲದೆ ಬೇರೇನೂ ಕಾಣುವುದಿಲ್ಲ.`),
S(`ರಾತ್ರಿಯಲ್ಲಿ ಬೆಳಕಿಗಾಗಿ ಹಳ್ಳಿಗರು ಮಾಡುವ ಉಪಾಯಗಳನ್ನು ಬರೆಯಿರಿ.`,`ಚಿಮಣಿದೀಪ, ಲ್ಯಾಂಪ್, ದೇವರ ದೀಪ, ಬ್ಯಾಟರಿ ಹಾಗೂ ದೂರದ ಪ್ರಯಾಣಕ್ಕೆ ತೆಂಗು–ಅಡಿಕೆ ಗರಿಗಳಿಂದ ತಯಾರಿಸಿದ ಸೂಡಿಯನ್ನು ಬಳಸುತ್ತಿದ್ದರು.`),
S(`ವಿಜಿ ಕತ್ತಲಿನ ಭಯವನ್ನು ಹೇಗೆ ಗೆದ್ದಳು?`,`ಗುಮ್ಮನ ಕೂಗು ಆಚೆಮನೆ ದೊಡ್ಡಮ್ಮನದೆಂದು ತಿಳಿದಾಗ ಭಯ ಹೋಯಿತು. ಕಾಡಿನ ವಾತಾವರಣದಲ್ಲಿ ಬೆಳೆದುದರಿಂದ ಧೈರ್ಯ ಬಂದಿತು. ಒಂಬತ್ತನೇ ತರಗತಿಯಲ್ಲಿ ಒಬ್ಬಳೇ ಉಪ್ಪರಿಗೆಯಲ್ಲಿ ಮಲಗುವ ಅಭ್ಯಾಸ ಮಾಡಿಕೊಂಡಳು.`),
L(`'ಗಾಢ ಕತ್ತಲು ಮತ್ತು ಗುಮ್ಮಗಳು' ಪಾಠದ ಸಾರಾಂಶವನ್ನು ಬರೆಯಿರಿ.`,`ವಿಜಿಯ ಕಲ್ಪನೆಯಲ್ಲಿ ಕತ್ತಲೆಂದರೆ ಗುಮ್ಮ. ಅಕ್ಕಂದಿರ ಗುಮ್ಮನ ಚಿತ್ರ, ದೊಡ್ಡವರ ಹೆದರಿಕೆಯ ಮಾತು, ಮಳೆಗಾಲದ ಗುಮ್ಮನ ಕೂಗು ಇವುಗಳಿಂದ ಅವಳಿಗೆ ಭಯವಿತ್ತು. ವಿದ್ಯುತ್ ಇಲ್ಲದ ಹಳ್ಳಿಯ ದಟ್ಟ ಕತ್ತಲಲ್ಲಿ ಜನ ಚಿಮಣಿ, ಬ್ಯಾಟರಿ, ಸೂಡಿ ಬಳಸಿ ಓಡಾಡುತ್ತಿದ್ದರು. ಗುಮ್ಮನಂತೆ ಕೂಗುತ್ತಿದ್ದವರು ದೊಡ್ಡಮ್ಮನೇ ಎಂದು ಗೊತ್ತಾದ ಮೇಲೆ ಭಯ ಕಡಿಮೆಯಾಯಿತು. ರಾತ್ರಿ ಯಕ್ಷಗಾನಕ್ಕೆ ಹೋಗಿಬರುವ ಅನುಭವಗಳಿಂದ ಕತ್ತಲಿನ ಭಯ ದೂರಾಯಿತು. ಕೊನೆಗೆ ಗಾಢಕತ್ತಲು, ರಾತ್ರಿ, ಮಳೆ ಅವಳಿಗೆ ಇಷ್ಟವಾದವು.`),
L(`ಹಳ್ಳಿಯಲ್ಲಿ ವಿದ್ಯುತ್ ಇಲ್ಲದ ದಿನಗಳ ಬದುಕನ್ನು ಪಾಠದ ಆಧಾರದಿಂದ ವಿವರಿಸಿ.`,`ವಿದ್ಯುತ್ ಇಲ್ಲದ ಊರಿನಲ್ಲಿ ಸಂಜೆಯಾದೊಡನೆ ಚಿಮಣಿದೀಪ, ಲ್ಯಾಂಪ್, ದೇವರ ದೀಪ ಹಚ್ಚುತ್ತಿದ್ದರು. ಉಪ್ಪರಿಗೆ, ಕೊಟ್ಟಿಗೆ, ಬಚ್ಚಲುಮನೆ, ಬಾವಿಕಟ್ಟೆಗೆ ಹೋಗಲೂ ಚಿಮಣಿ ತೆಗೆದುಕೊಂಡು ಹೋಗಬೇಕಿತ್ತು. ದೂರ ಹೋಗುವಾಗ ಬ್ಯಾಟರಿ ಅಥವಾ ಸೂಡಿ ಬಳಸುತ್ತಿದ್ದರು. ರಾತ್ರಿ ಎಂಟು ಗಂಟೆಗೇ ನಿದ್ದೆ ಬರುತ್ತಿತ್ತು; ಒಂಬತ್ತಕ್ಕೆ ಮಲಗಿ ಆರು ಗಂಟೆಗೆ ಏಳುತ್ತಿದ್ದರು. ಇಷ್ಟು ತೊಂದರೆಯಿದ್ದರೂ ಹಳ್ಳಿಯ ಜನ ಒಟ್ಟಾಗಿ ಯಕ್ಷಗಾನದಂತಹ ಕಾರ್ಯಕ್ರಮಗಳನ್ನು ಸಂಭ್ರಮಿಸುತ್ತಿದ್ದರು.`)
]});

LS6.push({n:10,t:`ಹುಚ್ಚು ಹುರುಳು (ಪೂರಕ ಪಾಠ 4 – ಪತ್ರ)`,au:`ಬೀಚಿ`,pg:57,
words:`ನಾಡಹಬ್ಬ – ದಸರಾ; ನಿರ್ಧಾರ – ತೀರ್ಮಾನ; ಸುಪ್ರಸಿದ್ಧ – ತುಂಬ ಪ್ರಸಿದ್ಧ; ಸಹಕರಿಸು – ಸಹಾಯ ಮಾಡು; ಭಾಷಣ – ಉಪನ್ಯಾಸ; ಜ್ಞಾನಾಮೃತ – ಜ್ಞಾನವೆಂಬ ಅಮೃತ; ಆಮಂತ್ರಣ – ಆಹ್ವಾನ; ನಿಷ್ಠುರ – ಕಠಿಣ; ಅರಗಳಿಗೆ – ಅರ್ಧಕ್ಷಣ; ನಿರ್ದಾಕ್ಷಿಣ್ಯ – ಸಂಕೋಚವಿಲ್ಲದೆ; ದುಃಸ್ಥಿತಿ – ಕೆಟ್ಟ ಸ್ಥಿತಿ; ನಿರ್ಭಾಗ್ಯ – ದುರದೃಷ್ಟವುಳ್ಳ`,
notes:`ಬೀಚಿ – 'ರಾಯಸಂ' ಭೀಮಸೇನಾ ರಾವ್ (1913ರಲ್ಲಿ ಹರಪನಹಳ್ಳಿಯಲ್ಲಿ ಜನನ); ಹಾಸ್ಯಕವಿ; ಕೃತಿಗಳು: ನಿರ್ಭಯಾಗ್ರಫಿ, ತಿಮ್ಮನ ತಲೆ, ತಿಮ್ಮರಸಾಯನ ಮುಂತಾದ ಹಾಸ್ಯಕೃತಿಗಳು. ಈ ಭಾಗವನ್ನು ಅವರ 'ಹುಚ್ಚು ಹುರುಳು' ನಗೆ ಬರಹದಿಂದ ಆರಿಸಲಾಗಿದೆ. ಇಲ್ಲಿ ಐದು ಪತ್ರಗಳಿವೆ: (1) ನಾಡಹಬ್ಬ ಸಮಿತಿ ಕಾರ್ಯದರ್ಶಿಯ ಆಮಂತ್ರಣ; (2) ಭಾಷಣಕಾರರ ಉತ್ತರ (ಖರ್ಚಿನ ಬೇಡಿಕೆ); (3) ಸಮಿತಿಯ ಒಪ್ಪಿಗೆ; (4) ಭಾಷಣಕಾರರ ಇನ್ನೊಂದು ಪತ್ರ; (5) ಭಾಷಣ ರದ್ದು.`,
ab:[
[`ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿರಿ`,[
[`ಮೊದಲನೆಯ ಪತ್ರದಲ್ಲಿ ಭಾಷಣಕಾರರು ಯಾವ ಸಮಸ್ಯೆಯನ್ನು ಹೇಳಿಕೊಳ್ಳುತ್ತಾರೆ?`,`ಭಾಷಣಕಾರರು (ಎರಡನೇ ಪತ್ರದಲ್ಲಿ) ಪ್ರಯಾಣದ ವೆಚ್ಚದ ಸಮಸ್ಯೆಯನ್ನು ಹೇಳುತ್ತಾರೆ: ರೈಲಿನಲ್ಲಿ ಎರಡನೆಯ ದರ್ಜೆ ಪ್ರಯಾಣ ಸಾಧ್ಯವಿಲ್ಲ; ತಮ್ಮಂತಹ ಪ್ರಸಿದ್ಧರ ಗೌರವಕ್ಕೆ ಕುಂದು. ಕನಿಷ್ಠ ಮೊದಲ ವರ್ಗದ ವೆಚ್ಚ ಭರಿಸಬೇಕು. ಜೊತೆಗೆ ಮೂರನೆಯ ಮಗನ ಅರ್ಧ ಚಾರ್ಜು ಭರಿಸಬೇಕು. ⚠ ಪಾಠದ ಕ್ರಮ ನೋಡಿ ಶಿಕ್ಷಕರು ದೃಢಪಡಿಸಿ.`],
[`ಭಾಷಣಕಾರರ ಭಾಷಣದ ವಿಷಯವೇನು?`,`"ನಮ್ಮ ಆರ್ಥಿಕ ದುಃಸ್ಥಿತಿ" – ಇದೇ ಅವರ ಭಾಷಣದ ವಿಷಯ.`],
[`ಭಾಷಣಕಾರರಿಗೆ ಪತ್ರ ಬರೆದವರು ಯಾರು?`,`ನಾಡಹಬ್ಬ ಸಮಿತಿಯ ಕಾರ್ಯದರ್ಶಿ.`],
[`ಭಾಷಣಕಾರರ ಭಾಷಣ ರದ್ದು ಪಡಿಸಲು ಕಾರಣವೇನು?`,`"ನಮ್ಮ ಆರ್ಥಿಕ ದುಃಸ್ಥಿತಿ" – ಸಮಿತಿಯ ಹಣದ ತೊಂದರೆ (ಭಾಷಣಕಾರರ ಖರ್ಚಿನ ಬೇಡಿಕೆ ಹೆಚ್ಚಾದುದರಿಂದ).`],
[`ಭಾಷಣಕಾರರ ಸಮಸ್ಯೆಗೆ ಕಾರ್ಯದರ್ಶಿಗಳ ಕೊನೆಯ ಉತ್ತರವೇನು?`,`"ತಾವು ದಯವಿಟ್ಟು ಹೊರಡಬೇಡಿ; ತಮ್ಮ ಭಾಷಣದ ಕಾರ್ಯಕ್ರಮವನ್ನು ರದ್ದುಗೊಳಿಸಲಾಗಿದೆ. ಇದಕ್ಕೆ ಕಾರಣ 'ನಮ್ಮ ಆರ್ಥಿಕ ದುಃಸ್ಥಿತಿ'" ಎಂಬುದು ಕೊನೆಯ ಉತ್ತರ.`]]]
],
qb:[
M(`'ಹುಚ್ಚು ಹುರುಳು' ಪಾಠದ ಲೇಖಕರು:`,[`ಕುವೆಂಪು`,`ಬೀಚಿ`,`ಬೇಂದ್ರೆ`,`ಮಾಸ್ತಿ`],1),
M(`ನಾಡಹಬ್ಬ ಎಂದರೆ ಯಾವ ಹಬ್ಬ?`,[`ದಸರಾ`,`ದೀಪಾವಳಿ`,`ಯುಗಾದಿ`,`ಸಂಕ್ರಾಂತಿ`],0),
M(`ಭಾಷಣಕಾರರಿಗೆ ಪತ್ರ ಬರೆದವರು:`,[`ಅಧ್ಯಕ್ಷರು`,`ಕಾರ್ಯದರ್ಶಿ`,`ಖಜಾಂಚಿ`,`ಶಿಕ್ಷಕರು`],1),
M(`ಭಾಷಣದ ವಿಷಯ ಯಾವುದು?`,[`ನಮ್ಮ ಆರ್ಥಿಕ ದುಃಸ್ಥಿತಿ`,`ದೇಶಭಕ್ತಿ`,`ಕನ್ನಡ ಭಾಷೆ`,`ಪರಿಸರ`],0),
M(`'ದುಃಸ್ಥಿತಿ' ಪದದ ಅರ್ಥ:`,[`ಒಳ್ಳೆಯ ಸ್ಥಿತಿ`,`ಕೆಟ್ಟ ಸ್ಥಿತಿ`,`ದೊಡ್ಡ ಹಣ`,`ವಿಶ್ರಾಂತಿ`],1),
M(`'ಆಮಂತ್ರಣ' ಪದದ ಅರ್ಥ:`,[`ಆಹ್ವಾನ`,`ಕೋಪ`,`ಉಡುಗೊರೆ`,`ಶಿಕ್ಷೆ`],0,'m'),
O(`ಬೀಚಿಯವರ ನಿಜವಾದ ಹೆಸರೇನು?`,`ರಾಯಸಂ ಭೀಮಸೇನಾ ರಾವ್.`),
O(`ಬೀಚಿ ಹುಟ್ಟಿದ ಊರು ಯಾವುದು?`,`ಹರಪನಹಳ್ಳಿ.`),
O(`ಬೀಚಿಯವರು ಯಾವ ಬಗೆಯ ಕವಿ?`,`ಹಾಸ್ಯಕವಿ.`),
O(`ಬೀಚಿಯವರ ಒಂದು ಹಾಸ್ಯ ಕೃತಿಯ ಹೆಸರು ಬರೆಯಿರಿ.`,`ತಿಮ್ಮನ ತಲೆ / ತಿಮ್ಮರಸಾಯನ / ನಿರ್ಭಯಾಗ್ರಫಿ.`),
O(`ಭಾಷಣಕಾರರ ಮೂರನೆಯ ಮಗನಿಗೆ ರೈಲಿನಲ್ಲಿ ಎಷ್ಟು ಚಾರ್ಜು ಇತ್ತು?`,`ಅರ್ಧ ಚಾರ್ಜು.`),
O(`ಈ ಪಾಠದಲ್ಲಿ ಎಷ್ಟು ಪತ್ರಗಳಿವೆ?`,`ಐದು.`),
G(`'ಭಾಷಣ' ಪದದ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಉಪನ್ಯಾಸ`,'e'),
G(`'ಆಮಂತ್ರಣ' ಪದದ ಸಮಾನಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಆಹ್ವಾನ`,'e'),
G(`'ದುಃಸ್ಥಿತಿ' ಪದದ ವಿರುದ್ಧಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.`,`ಸುಸ್ಥಿತಿ`),
G(`'ನಿರ್ಭಾಗ್ಯ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ದುರದೃಷ್ಟವುಳ್ಳ`),
G(`ಸಂಬೋಧನೆಯ ಪದ ಬರೆಯಿರಿ: ವ್ಯಾವಹಾರಿಕ ಪತ್ರದ ಆರಂಭದಲ್ಲಿ ಬರೆಯುವ ಪದ`,`ಮಾನ್ಯರೇ / ಮಹನೀಯರೇ`),
G(`'ಸುಪ್ರಸಿದ್ಧ' ಪದದ ಅರ್ಥ ಬರೆಯಿರಿ.`,`ತುಂಬ ಪ್ರಸಿದ್ಧ`),
S(`ಮೊದಲ ಪತ್ರದಲ್ಲಿ ನಾಡಹಬ್ಬ ಸಮಿತಿಯ ಕಾರ್ಯದರ್ಶಿ ಭಾಷಣಕಾರರನ್ನು ಏನೆಂದು ಆಹ್ವಾನಿಸಿದ್ದಾರೆ?`,`ಪ್ರತಿ ವರ್ಷದಂತೆ ಈ ವರ್ಷವೂ ತಮ್ಮೂರಿನಲ್ಲಿ ದಸರೆಯಲ್ಲಿ ನಾಡಹಬ್ಬದ ಕಾರ್ಯಕ್ರಮ ನಡೆಸಲು ನಿರ್ಧರಿಸಿದ್ದೇವೆ. ತಮ್ಮಂತಹ ಸುಪ್ರಸಿದ್ಧ ಸಾಹಿತಿಗಳು ಬಂದು ಭಾಷಣದಿಂದ ಜ್ಞಾನಾಮೃತ ಪಾನ ಮಾಡಿಸಬೇಕು; ಅನುಕೂಲವಾದ ದಿನ ಮತ್ತು ಭಾಷಣದ ವಿಷಯವನ್ನು ತಿಳಿಸಿರಿ ಎಂದು ಆಹ್ವಾನಿಸಿದ್ದಾರೆ.`),
S(`ಭಾಷಣಕಾರರು ತಮ್ಮ ಪತ್ರದಲ್ಲಿ ಯಾವ ಷರತ್ತುಗಳನ್ನು ಹಾಕಿದ್ದಾರೆ?`,`ಮೊದಲನೆಯ ವರ್ಗದ ರೈಲು ಪ್ರಯಾಣದ ವೆಚ್ಚ ಭರಿಸಬೇಕು; ತಮ್ಮ ಮೂರನೆಯ ಮಗನ ಅರ್ಧ ಚಾರ್ಜನ್ನೂ ಭರಿಸಬೇಕು; ಎರಡನೆಯ ದರ್ಜೆ ಪ್ರಯಾಣ ಸಾಧ್ಯವಿಲ್ಲ ಎಂದು ಷರತ್ತು ಹಾಕಿದ್ದಾರೆ. ⚠ ಪಾಠ ನೋಡಿ ದೃಢಪಡಿಸಿ.`),
S(`ಭಾಷಣ ರದ್ದಾದ ಸಂದರ್ಭವನ್ನು ವಿವರಿಸಿ.`,`ಭಾಷಣಕಾರರು ಮತ್ತೆ ಪತ್ರ ಬರೆದು ಟ್ಯಾಕ್ಸಿ, ಕೂಲಿ, ಹಣ್ಣು–ಹಂಪಲು ಮುಂತಾದ ಖರ್ಚುಗಳನ್ನು ತಿಳಿಸಿ "ನನ್ನ ಭಾಷಣದ ವಿಷಯ 'ನಮ್ಮ ಆರ್ಥಿಕ ದುಃಸ್ಥಿತಿ'" ಎಂದರು. ಇದರಿಂದ ಸಮಿತಿ ಕಾರ್ಯದರ್ಶಿ "ತಾವು ದಯವಿಟ್ಟು ಹೊರಡಬೇಡಿ, ಭಾಷಣ ರದ್ದುಗೊಳಿಸಲಾಗಿದೆ; ಕಾರಣ ನಮ್ಮ ಆರ್ಥಿಕ ದುಃಸ್ಥಿತಿ" ಎಂದು ಉತ್ತರ ಬರೆದರು.`),
S(`ಈ ಪಾಠದಲ್ಲಿ ಹಾಸ್ಯವೆಲ್ಲಿದೆ? ವಿವರಿಸಿ.`,`ಭಾಷಣಕಾರರು ಹೆಚ್ಚು ಹಣ ಕೇಳುತ್ತಾರೆ; ಅವರ ಭಾಷಣದ ವಿಷಯ 'ನಮ್ಮ ಆರ್ಥಿಕ ದುಃಸ್ಥಿತಿ' ಎಂಬುದು ಸ್ವತಃ ಅವರ ಹಣದ ಮೇಲಿನ ಒತ್ತಾಯಕ್ಕೆ ಹೊಂದುತ್ತದೆ. ಸಮಿತಿಯೂ ತನ್ನ ಆರ್ಥಿಕ ದುಃಸ್ಥಿತಿಯನ್ನು ಕಾರಣವಾಗಿಟ್ಟುಕೊಂಡು ಭಾಷಣವನ್ನೇ ರದ್ದು ಮಾಡುತ್ತದೆ. ಈ ವಿಡಂಬನೆಯೇ ಹಾಸ್ಯ.`),
L(`'ಹುಚ್ಚು ಹುರುಳು' ಪತ್ರಗಳ ಕಥೆಯನ್ನು ನಿಮ್ಮ ಮಾತುಗಳಲ್ಲಿ ಬರೆಯಿರಿ.`,`ನಾಡಹಬ್ಬ ಸಮಿತಿಯ ಕಾರ್ಯದರ್ಶಿ ಭಾಷಣಕಾರರಿಗೆ ದಸರೆಯ ಕಾರ್ಯಕ್ರಮದಲ್ಲಿ ಭಾಷಣ ಮಾಡಲು ಪತ್ರ ಬರೆದು ಆಹ್ವಾನಿಸಿದರು. ಭಾಷಣಕಾರರು ಒಪ್ಪಿ, ತಮ್ಮ ಪ್ರಯಾಣದ ಖರ್ಚು ಮತ್ತು ಮಗನ ಅರ್ಧ ಚಾರ್ಜನ್ನು ಭರಿಸಬೇಕೆಂದು ಷರತ್ತು ಹಾಕಿದರು. ಸಮಿತಿ ಒಪ್ಪಿ ದಿನಾಂಕ ಹೇಳಲು ಕೋರಿತು. ಭಾಷಣಕಾರರು ಮತ್ತೆ ಟ್ಯಾಕ್ಸಿ, ಕೂಲಿ, ಹಣ್ಣು–ಹಂಪಲು ಖರ್ಚುಗಳ ಬಗ್ಗೆ ತಿಳಿಸಿ ತಮ್ಮ ಭಾಷಣದ ವಿಷಯ 'ನಮ್ಮ ಆರ್ಥಿಕ ದುಃಸ್ಥಿತಿ' ಎಂದರು. ಇದರಿಂದ ಬೇಸತ್ತ ಸಮಿತಿ ಭಾಷಣವನ್ನೇ ರದ್ದು ಮಾಡಿ, ಕಾರಣ 'ನಮ್ಮ ಆರ್ಥಿಕ ದುಃಸ್ಥಿತಿ' ಎಂದು ತಿಳಿಸಿತು. ಹೀಗೆ ಪತ್ರಗಳ ಮೂಲಕ ಹಾಸ್ಯ ಹುಟ್ಟುತ್ತದೆ.`),
L(`ವ್ಯಾವಹಾರಿಕ ಪತ್ರ ಬರೆಯುವ ಕ್ರಮ ಮತ್ತು ಈ ಪಾಠದ ಪತ್ರಗಳ ಲಕ್ಷಣಗಳನ್ನು ವಿವರಿಸಿ.`,`ಪತ್ರದಲ್ಲಿ ಊರು, ದಿನಾಂಕ, ಸಂಬೋಧನೆ (ಮಾನ್ಯರೇ), ವಿಷಯದ ವಿವರಣೆ, ಮುಕ್ತಾಯ (ಇತಿ ನಿಮ್ಮವ), ಸಹಿ ಇರುತ್ತದೆ. ಈ ಪಾಠದ ಪತ್ರಗಳಲ್ಲಿ ಊರು, ದಿನಾಂಕ, ಸಂಬೋಧನೆ, ವಿನಂತಿ, ಉತ್ತರ, ಮುಕ್ತಾಯ, ಸಹಿ ಎಲ್ಲವೂ ಇವೆ. ಜೊತೆಗೆ ಹಣದ ವಿಷಯದಲ್ಲಿ ತಮಾಷೆಯ ವಿರುದ್ಧ ಬೇಡಿಕೆ–ಉತ್ತರಗಳಿವೆ.`)
]});

LS6.push({n:11,t:`ಇರುವೆಯ ಪಯಣ (ಪೂರಕ ಪಾಠ 5 – ಪದ್ಯ)`,au:`ಡಾ. ಎನ್.ಎಸ್. ಲಕ್ಷ್ಮೀನಾರಾಯಣ ಭಟ್ಟ`,pg:61,
words:`ಬಿರುಕು – ಬಿರುಕು, ಸೀಳು; ಸಂದು – ಸಂದಿ, ಇಕ್ಕಟ್ಟಿನ ಜಾಗ; ಹಿತ್ಲು – ಮನೆಯ ಹಿಂಭಾಗದ ತೋಟ; ಜೇಬು – ಕಿಸೆ; ಥರ – ರೀತಿ; ಹಾದಿ – ದಾರಿ; ಬಂಡೆ – ಕಲ್ಲು; ಬೆಟ್ಟ – ಗುಡ್ಡ; ಬಾವಿ – ಕೂಪ`,
notes:`ಕವಿ ಡಾ. ಎನ್.ಎಸ್. ಲಕ್ಷ್ಮೀನಾರಾಯಣ ಭಟ್ಟ (ಜನನ: 29 ಅಕ್ಟೋಬರ್ 1936; ಮರಣ: 6 ಮಾರ್ಚ್ 2021) ಬೆಂಗಳೂರು ವಿಶ್ವವಿದ್ಯಾನಿಲಯದ ಕನ್ನಡ ವಿಭಾಗದ ಮುಖ್ಯಸ್ಥರಾಗಿ ನಿವೃತ್ತರಾದವರು. ಮೂಲತಃ ಶಿವಮೊಗ್ಗದವರು; ತಂದೆ ಶಿವರಾಮ ಭಟ್ಟ, ತಾಯಿ ಮೂಕಾಂಬಿಕೆ; ಪೂರ್ಣ ಹೆಸರು ನೈಲಾಡಿ ಶಿವರಾಮ ಲಕ್ಷ್ಮೀನಾರಾಯಣ ಭಟ್ಟ. ಕವಿ, ವಿಮರ್ಶಕ, ವಾಗ್ಮಿ. ಶಿಶುಸಾಹಿತ್ಯ ಅವರಿಗೆ ಅತ್ಯಂತ ಪ್ರಿಯ. ಕೃತಿಗಳು: ಕಿನ್ನರಲೋಕ, ಭಾಳ ಒಳ್ಳೇವ್ರು ನಂ ಮಿಸ್ಸು, ಗೇರ್ ಗೇರ್ ಮಂಗಣ್ಣ, ಕಿಶೋರಿ. ಪುರಸ್ಕಾರಗಳು: ಎನ್.ಸಿ.ಆರ್.ಟಿ.ಇ. ಬಾಲ ಸಾಹಿತ್ಯ ಪುರಸ್ಕಾರ, ಕೇಂದ್ರ ಸಾಹಿತ್ಯ ಅಕಾಡೆಮಿಯ ಬಾಲ ಪುರಸ್ಕಾರ; ಮೂರು ಬಾರಿ ರಾಜ್ಯ ಸಾಹಿತ್ಯ ಅಕಾಡೆಮಿ ಪ್ರಶಸ್ತಿ. ಈ ಪದ್ಯವು ಇರುವೆಯ ಕಣ್ಣಿನಿಂದ ಜಗತ್ತನ್ನು ನೋಡುವ ಕವನ.`,
ab:[
[`ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿರಿ`,[
[`ಇರುವೆ ಯಾವ ಯಾವ ಊರುಗಳನ್ನು ನೋಡಿ ಬಂದಿದೆ?`,`ಬಾಗಿಲ ಸಂದು, ಗೋಡೆ ಬಿರುಕು, ಬೆಲ್ಲದ ಡಬ್ಬ, ಹಿತ್ಲು, ತಿಂಡಿ ಇರೋ ಹುಡುಗನ ಜೇಬು, ಹಾಲಿನ ಪಾತ್ರೆ ಸುತ್ತಲೂ – ಇವೆಲ್ಲ ಇರುವೆಗೆ ಒಂದೊಂದು ಊರು.`],
[`ಬಸ್ಸೇ ಇಲ್ಲದ ಊರಿಗೆ ಇರುವೆ ಹೋಗಿ ಬಂದದ್ದು ಹೇಗೆ?`,`ಚಪ್ಪಲಿ ಇಲ್ಲದೆ ಕಾಲ್ನಡಿಗೆಯಲ್ಲಿ ನಡೆದುಕೊಂಡೇ ಹೋಗಿ ಬಂದಿದೆ.`],
[`ಹುಡುಗನ ಜೇಬಿನತ್ತ ಇರುವೆ ಹೋಗಿದ್ದೇಕೆ?`,`ಆ ಜೇಬಿನಲ್ಲಿ ತಿಂಡಿ ಇರುವುದರಿಂದ (ಹುಡುಗನ ಜೇಬು ತಿಂಡಿ ಇರೋ ಜೇಬು) ತಿನ್ನಲು ಹೋಗಿತ್ತು.`],
[`ಹಾಲಿನ ಲೋಟವು ಇರುವೆಗೆ ಹೇಗೆ ಕಾಣಿಸುತ್ತದೆ?`,`ಹಾಲಿನ ಲೋಟವು ಇರುವೆಗೆ ದೊಡ್ಡ ಬಾವಿಯಂತೆ (ಹಾಲಿನ ಲೋಟದ ಬಾವಿ) ಕಾಣಿಸುತ್ತದೆ.`],
[`ಇರುವೆ ಯಾವುದನ್ನು ಬಂಡೆ, ಬೆಟ್ಟ ಎಂದು ಹೇಳುತ್ತಿದೆ?`,`ಸಕ್ಕರೆಯನ್ನು 'ಸಕ್ಕರೆ ಬಂಡೆ' ಎಂದೂ ಬೆಲ್ಲವನ್ನು 'ಬೆಲ್ಲದ ಬೆಟ್ಟ' ಎಂದೂ ಹೇಳುತ್ತಿದೆ.`],
[`ಇರುವೆಯ ಕಣ್ಣಲ್ಲಿ ಸಣ್ಣ ಸಂಗತಿಗಳೂ ಹೇಗೆ ಬೃಹತ್ತಾಗಿ ಕಾಣುತ್ತವೆ ಎಂಬುದನ್ನು ಉದಾಹರಣೆ ಸಹಿತ ವಿವರಿಸಿ.`,`ಇರುವೆ ಚಿಕ್ಕದಾದುದರಿಂದ ಅದಕ್ಕೆ ನಮ್ಮ ಸಣ್ಣ ವಸ್ತುಗಳೇ ದೊಡ್ಡದಾಗಿ ಕಾಣುತ್ತವೆ. ಸಕ್ಕರೆಯ ಹರಳು ಅದಕ್ಕೆ ಬಂಡೆ; ಬೆಲ್ಲದ ಉಂಡೆ ಬೆಟ್ಟ; ಹಾಲಿನ ಲೋಟ ಬಾವಿ; ಬಾಗಿಲ ಸಂದು, ಗೋಡೆಯ ಬಿರುಕು ಒಂದೊಂದು ಊರು; ಹುಡುಗನ ಜೇಬು ತಿಂಡಿಯ ಊರು.`]]]
],
qb:[
M(`ಇರುವೆ ಯಾರಿಗೆ ಬಾ ಎಂದು ಕರೆಯುತ್ತದೆ?`,[`ಇಲ್ಲಿಗೆ ಬಾ (ಮಕ್ಕಳೇ/ಓದುಗರೇ)`,`ಬೆಕ್ಕು`,`ಕಾಗೆ`,`ಹುಲಿ`],0),
M(`ಇರುವೆ ಹುಡುಗನ ಜೇಬಿನತ್ತ ಹೋಗಿದ್ದು ಏಕೆ?`,[`ತಿಂಡಿ ಇರುವುದರಿಂದ`,`ಬಿಸಿಲಿಗೆ`,`ಹಣಕ್ಕಾಗಿ`,`ನಿದ್ದೆಗಾಗಿ`],0),
M(`ಹಾಲಿನ ಲೋಟ ಇರುವೆಗೆ ಹೇಗೆ ಕಾಣಿಸುತ್ತದೆ?`,[`ಬೆಟ್ಟ`,`ಬಾವಿ`,`ಬಂಡೆ`,`ಮರ`],1),
M(`ಸಕ್ಕರೆಯನ್ನು ಇರುವೆ ಏನೆಂದು ಕರೆಯುತ್ತದೆ?`,[`ಸಕ್ಕರೆ ಬಂಡೆ`,`ಸಕ್ಕರೆ ಬೆಟ್ಟ`,`ಸಕ್ಕರೆ ಬಾವಿ`,`ಸಕ್ಕರೆ ಊರು`],0),
M(`'ಹಾದಿ' ಪದದ ಅರ್ಥ:`,[`ದಾರಿ`,`ಮನೆ`,`ಊರು`,`ನೀರು`],0),
M(`ಇರುವೆ ಕಾಲಿಗೆ ಏನು ಇಲ್ಲದೆ ನಡೆದುಕೊಂಡು ಹೋಗಿತ್ತು?`,[`ಚಪ್ಪಲಿ`,`ಬಟ್ಟೆ`,`ಗೆಜ್ಜೆ`,`ಉಂಗುರ`],0,'m'),
O(`'ಇರುವೆಯ ಪಯಣ' ಪದ್ಯದ ಕವಿ ಯಾರು?`,`ಡಾ. ಎನ್.ಎಸ್. ಲಕ್ಷ್ಮೀನಾರಾಯಣ ಭಟ್ಟ.`),
O(`ಇರುವೆ ಯಾವ ಯಾವ ಊರು ನೋಡಿದ್ದೆ ಎಂದು ಪ್ರಶ್ನಿಸಲಾಗಿದೆ?`,`ಯಾವ್ಯಾವ್ ಊರು ನೋಡಿದ್ದೀ? (ಇರುವೆಗೆ ಕೇಳಿದ ಪ್ರಶ್ನೆ).`),

O(`ಕವಿ ಎನ್.ಎಸ್. ಲಕ್ಷ್ಮೀನಾರಾಯಣ ಭಟ್ಟರು ಎಲ್ಲಿ ಮುಖ್ಯಸ್ಥರಾಗಿದ್ದರು?`,`ಬೆಂಗಳೂರು ವಿಶ್ವವಿದ್ಯಾನಿಲಯದ ಕನ್ನಡ ವಿಭಾಗದಲ್ಲಿ.`),

/* ===== Back-button guard (PWA): Back never closes the app directly =====
   History: [root guard] -> [app entries...]. Back from Home lands on the root guard,
   which asks for a second Back within 2 seconds before actually exiting. */

 if(exitArmed){clearTimeout(exitTimer);exitArmed=false;history.back();return}

function vPaper(){const P=ST.ptype,cfg=PT[P],o=selOpts(P),v=ST.sel[P];
 const sub=['unit','fa3','fa4','sa2'].map(k=>`<button class="tb sm ${P===k?'on':''}" onclick="ST.ptype='${k}';render()">${U().names[k]+' ('+PT[k].max+')'}</button>`).join('');
 return `<div class="tabs">${sub}</div><div class="card glass neu"><label class="fl" style="margin-top:0">${U().pick}</label>${dd('psel',pOpts(o),v,x=>{ST.sel[ST.ptype]=x})}
 <div class="pills"><button class="btn" onclick="ST.seed[ST.ptype]++;render()">${U().newP}</button><button class="btn" onclick="ST.showAns=!ST.showAns;render()">${ST.showAns?U().hide:U().show}</button><button class="btn" onclick="window.print()">${U().prt}</button></div></div>${buildPaper()}`}
function buildPaper(){const P=ST.ptype,cfg=PT[P],ls=parseSel(ST.sel[P]);const pool=allQ().filter(q=>ls.includes(q.ch));const r=rng(ST.seed[P]*7919+ls.length*31+P.length);
 const secs=U().secs;
 let n=1,tot=0;const rg=ls.length>1?`${ls[0]}–${ls[ls.length-1]}`:ls[0];
 let h=`<div class="paper fade"><div class="ph"><b style="font-size:1.25em">${U().names[P]}${P==='unit'?'':U().assess}</b><br>${U().hdr(rg,cfg.max,P)}</div>`;
 secs.forEach(s=>{const qs=shuffle(pool.filter(q=>q.t===s[2]),r).slice(0,cfg.c[s[2]]);if(!qs.length)return;const m=MK[s[2]];tot+=qs.length*m;
  h+=`<div class="sec"><b>${s[0]}. ${s[1]}</b> <span class="mk">(${qs.length} × ${m} = ${qs.length*m})</span>`;
  qs.forEach(q=>{h+=`<div class="pq"><div>${n++}. ${esc(q.q)}</div>`;if(q.t==='mcq')h+='<div class="po">'+q.o.map((o,i)=>`(${U().ol[i]}) ${esc(o)}`).join(' &nbsp; ')+'</div>';
   if(ST.showAns)h+=`<div class="ans"><b>${U().a}</b> ${q.t==='mcq'?'('+U().ol[q.a]+') '+esc(q.o[q.a]):esc(q.a)}</div>`;h+='</div>'});h+='</div>'});
 return h+`<div class="ph" style="border:0;border-top:2px solid #232a45;padding-top:.6rem">${U().total} ${tot}</div></div>`}
/* ===== ರೆಂಡರ್ ===== */
function render(){
 const hero=$('hero');hero.classList.toggle('sm',ST.view!=='home');
 $('herop').textContent=ST.view==='home'?'Shikshana Parva · ಕಲಿಕೆಯ ಹಬ್ಬ':'ಶಿಕ್ಷಕರಿಗಾಗಿ ಕಲಿಕಾ ಸಂಪನ್ಮೂಲ ವೇದಿಕೆ';
 $('bk').disabled=ST.view==='home';
 let c='<b>ಮುಖಪುಟ</b>';if(ST.cls)c+=` › ${ORD[ST.cls-1]} ತರಗತಿ`;if(ST.sub&&ST.view==='subject')c+=` › <b>${cur().title}</b>`;$('crumb').innerHTML=c;
 $('main').innerHTML=ST.view==='home'?vHome():ST.view==='class'?vClass():vSubject();}
render();
</script>
