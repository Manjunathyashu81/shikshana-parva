LSE.push({n:14,t:`I Can Draw Too (Supplementary Reading)`,au:`Activity`,pg:50,
words:`beak – the hard pointed part of a bird's mouth; tail – the part at the back of an animal's body; wings – the parts of a bird used for flying; curve – a line that bends smoothly; imagination – the power of thinking of new pictures in the mind`,
notes:`A drawing activity. Children learn to draw a pigeon (Sajan) in eight steps using simple shapes (letters O, U, W and a triangle). They also see how letters and numbers can turn into pictures: the letter h becomes a camel, the letter S becomes a mouse and the number 2 becomes a duck. The textbook says to check the finished drawing against the picture at the end.`,
ab:[
[`I. Sajan the Pigeon in eight steps`,[
[`Steps 1 to 8`,`1. Draw an O for the head. 2. Add a U for the body. 3. Make two black dots for the eyes. 4. Draw a triangle for the beak. 5. Draw two upside down V's for the feet. 6. Draw a W and a U for the tail. 7. Give the pigeon wings to fly in the sky. 8. Draw two curves for the hills. (The textbook asks children to check their drawing with the picture on the page given; compare with the last page of the reader.)`]]],
[`II. Figures hidden in a single letter of the alphabet`,[
[`Letter h`,`Activity: With a little imagination the letter h can be turned into a camel – the tall line becomes the neck and head and the curve becomes the hump.`]]],
[`III. Sudheer and the letter S`,[
[`Letter S`,`Activity: When the letter S is drawn lying down, it can be turned into a mouse creeping out of it – add ears, eyes, legs and a long tail.`]]],
[`IV. Shapes hidden in numbers`,[
[`Number 2`,`Activity: The number 2 can be turned into a duck – the top curve becomes the neck and head, then add a beak, an eye, a tail and wavy lines of water.`]]]
],
qb:[
M(`Sajan is a:`,[`pigeon`,`parrot`,`crow`,`duck`],0),
M(`We start drawing Sajan with the letter:`,[`O`,`U`,`W`,`S`],0),
M(`The letter S can be turned into a:`,[`camel`,`mouse`,`duck`,`pigeon`],1),
M(`The number 2 can be turned into a:`,[`mouse`,`camel`,`duck`,`pigeon`],2),
M(`The letter h can be turned into a:`,[`camel`,`duck`,`mouse`,`bird`],0,'m'),
O(`Which shape is used for Sajan's beak?`,`A triangle.`),
O(`What is used for Sajan's body?`,`The letter U.`),
O(`What are drawn for the feet of Sajan?`,`Two upside down V's.`),
O(`In how many steps do we draw Sajan the pigeon?`,`In eight steps.`,'m'),
G(`Write the meaning of 'curve'.`,`a line that bends smoothly`),
G(`Write the meaning of 'imagination'.`,`the power of thinking of new pictures in the mind`,'m'),
G(`Write the plural of 'mouse'.`,`mice`),
G(`Write the plural of 'foot'.`,`feet`),
S(`How do we draw the tail of Sajan the pigeon?`,`We draw a W and a U for the tail of Sajan.`),
S(`What does Sudheer see when the letter S sleeps?`,`He sees a mouse creeping out of the letter S.`),
L(`Describe the eight steps to draw Sajan the pigeon.`,`First we draw an O for Sajan's head. Then we add a U for his body. We make two black dots for his eyes and draw a triangle for his beak. Next we draw two upside down V's for his feet. With a W and a U we draw his tail. Then we give him wings to fly in the sky. Finally we draw two curves for hills for him to fly over.`)
]});

LSE5.push({n:1,t:`Shabale (Sabala) – Unit 5 Prose`,au:`Prose (Story)`,pg:1,
words:`sage – hermit; greet – welcome; entire – complete, whole; drag – to pull forcefully; amazing – surprising; udder – part of the cow where milk is stored; chased – drove; wisdom – knowledge, learning, sound judgement; devotion – great love for God; meditation – praying with concentration; gushed – to flow or burst out; greedy – desiring more than you need`,
notes:`Sage Vasishta lived in a forest with his cow Shabale (also called Nandini, daughter of Kamadhenu, the Heavenly Cow). King Kaushika came hunting and was impressed by the tasty meal Shabale gave. He asked for her in exchange for ten thousand cows and even his kingdom, but Vasishta refused. When the king tried to take her by force, Shabale produced soldiers from her body and chased the king's army out. Kaushika realised that force cannot win everything, became a sage and was called Vishwamitra ('friend of the world'). Language work: past tense forms, pronouns, dialogue practice, speech sound 'o' as in 'go'.`,
ab:[
[`Warm-up Task A. Re-arrange the words to form sentences`,[
[`are / beings. / Animals / living`,`Animals are living beings.`],
[`us. / Animals / feel / also / like`,`Animals also feel like us.`],
[`useful / us. / to / are / Animals`,`Animals are useful to us.`]]],
[`V1. Are these sentences right (✓) or wrong (✗)?`,[
[`Vasishta lived in a forest.`,`Right (✓)`],
[`Kaushika did not ask Vasishta to give Shabale to him.`,`Wrong (✗). Kaushika asked Vasishta to give Shabale in exchange for ten thousand cows.`],
[`Kaushika decided to take Shabale by force.`,`Right (✓)`],
[`Finally Shabale went with Kaushika.`,`Wrong (✗). Shabale freed herself and stood next to Vasishta.`]]],
[`V2. Tick the correct word`,[
[`Shabale was also known as ______ (a) Nandini b) Kamadhenu c) Surabhi)`,`a) Nandini`],
[`Kaushika was a ______ (a) sage b) soldier c) king)`,`c) king`],
[`Who wanted to take Shabale to his palace? (a) Vasishta b) Kaushika c) Valmiki)`,`b) Kaushika`],
[`Kaushika put a ______ around Shabale's neck and dragged her. (a) rope b) thread c) cover)`,`a) rope`]]],
[`C1. Answer the following questions`,[
[`Who was Vasishta?`,`Vasishta was a sage who lived in a forest.`],
[`Where did he live?`,`He lived in a forest.`],
[`What was special about Shabale?`,`Shabale was the daughter of Kamadhenu, the Heavenly Cow. She gave Vasishta whatever he asked for, such as food, drink and clothes.`],
[`What did Kaushika ask Vasishta?`,`Kaushika asked Vasishta to give Shabale to him in exchange for ten thousand cows (and later offered his entire kingdom).`],
[`What did Kaushika realize?`,`Kaushika realized that he was not powerful enough and could not win anything by force.`]]],
[`C2. Put the sentences in the appropriate columns`,[
[`Shabale with Vasishta`,`She gave him food, drink, clothes etc.`],
[`Shabale with the king Kaushika`,`She underwent an amazing change. / She was producing fierce warriors to protect her master. / Her head and neck grew larger. / Balls of fire came out from her tail. / Many soldiers came out from her mouth, udder and her sides.`]]],
[`L1. Write the past tense forms of`,[
[`pray`,`prayed`],[`drag`,`dragged`],[`refuse`,`refused`],[`give`,`gave`],[`ask`,`asked`],[`go`,`went`],[`order`,`ordered`],[`kill`,`killed`]]],
[`L2. Complete the passage using the correct form of the verbs`,[
[`One morning, a king ______ (go/went) to a village. He ______ (see/saw) an old woman planting mango saplings.`,`went; saw`],
[`She ______ (look/looked) weak and tired. The king ______ (ask/asked) her how many years would it take...`,`looked; asked`],
[`The old woman ______ (replied/reply) that it would take around ten years. The king ______ (ask/asked) if she would be alive...`,`replied; asked`],
[`She ______ (said/say) that she ______ (is/was) not planting them for herself, but for others.`,`said; was`],
[`The king ______ (feel/felt) happy and ______ (gave/give) her a silver mango. She ______ (thanked/thank) the king and ______ (smile/smiled).`,`felt; gave; thanked; smiled`]]],
[`L3. Dialogue practice (read in pairs with expressions)`,[
[`Dialogue 1: Soldier – King (at the forest)`,`Activity: In pairs read aloud. The tired soldier suggests resting, sees huts that look like a hermitage, and the King agrees to go and meet the sage who lives there.`],
[`Dialogue 2: Vasishta – King – Shabale (at the hermitage)`,`Activity: Vasishta welcomes Kaushika and offers food and rest. The king hesitates as his whole army is with him, but Vasishta asks Shabale to give them a hearty meal, and she agrees to serve a meal they will never forget.`]]],
[`L4. Speech sounds – 'o' as in 'go'`,[
[`Keep your teeth well apart and the lips rounded. Say: Not a word Joe spoke...`,`Activity: Repeat after the teacher. Words with the sound: go, Joe, spoke, croak, moan, groan, bone, joke, choke, throat.`]]]
],
qb:[
M(`Vasishta was a:`,[`king`,`sage`,`soldier`,`merchant`],1),
M(`Shabale was the daughter of:`,[`Surabhi`,`Kamadhenu`,`Nandini`,`Vasishta`],1),
M(`Kaushika first offered ______ in exchange for Shabale.`,[`his kingdom`,`ten thousand cows`,`his army`,`gold`],1),
M(`Kaushika put a ______ around Shabale's neck.`,[`thread`,`cover`,`rope`,`chain`],2),
M(`Kaushika later came to be called:`,[`Valmiki`,`Vishwamitra`,`Vasishta`,`Narada`],1),
M(`'Vishwamitra' means:`,[`friend of the world`,`king of the world`,`lover of cows`,`great sage`],0),
M(`'Udder' is the part of a cow where ______ is stored.`,[`water`,`food`,`milk`,`grass`],2,'m'),
M(`'Gushed' means:`,[`to stop`,`to flow or burst out`,`to sleep`,`to hide`],1,'m'),
O(`Where did Vasishta live?`,`In a forest.`),
O(`Why did Kaushika and his soldiers come to the forest?`,`They came to the forest to hunt.`),
O(`What did Vasishta pray to Shabale to give his guests?`,`A tasty meal.`),
O(`What did Vasishta say about Shabale?`,`Shabale belongs to the Gods and Goddesses and she should not be misused.`,'m'),
O(`Did Shabale's soldiers kill anyone?`,`No, they chased Kaushika and his men out of the ashram but did not kill anyone.`),
O(`What did Kaushika do to become a true sage?`,`He left his kingdom and spent many years in prayer and meditation in the forest.`,'m'),
G(`Write the past tense of 'drag'.`,`dragged`),
G(`Write the past tense of 'give'.`,`gave`),
G(`Write the past tense of 'go'.`,`went`),
G(`Write the past tense of 'refuse'.`,`refused`),
G(`Write the meaning of 'greet'.`,`welcome`,'e'),
G(`Write the meaning of 'entire'.`,`complete, whole`,'e'),
G(`Fill in the blank with the correct verb form: The king ______ (felt/feel) happy.`,`felt`),
S(`What happened when Kaushika tried to take Shabale by force?`,`Kaushika put a rope around Shabale's neck and dragged her, but she was unwilling. She freed herself, ran and stood next to Vasishta. Soldiers came out of her body and chased the king and his men out of the ashram.`),
S(`Describe the amazing change that Shabale underwent.`,`Fire gushed out of Shabale's eyes and her head and neck grew larger. Balls of fire came out from her tail. Many soldiers came out from her mouth, udder and sides to protect her master.`),
S(`Why did Kaushika want Shabale?`,`Kaushika was impressed by the tasty meal that Shabale gave him and his men within minutes. He wanted to take her to his palace.`),
L(`Narrate the story of Shabale in your own words.`,`Sage Vasishta lived in a forest with his cow Shabale, who gave him whatever he asked for. One day King Kaushika and his soldiers came hunting and rested at his hut. Vasishta prayed to Shabale and she gave them a tasty meal. Kaushika wanted Shabale and offered ten thousand cows and even his kingdom, but Vasishta refused. The king tried to drag her away with a rope. Shabale freed herself, and soldiers came out from her body and chased Kaushika's army away without killing anyone. Kaushika realized that force could not win everything. He became a sage and, after years of prayer and meditation, came to be called Vishwamitra, 'the friend of the world'.`),
L(`What lesson does the story of Kaushika and Shabale teach us?`,`The story teaches that greed and force cannot win everything. Kaushika wanted something that belonged to the Gods and tried to take it by force, but he failed. He realized his mistake, gave up his kingdom and became a true sage through devotion and meditation. We should not be greedy and should respect what belongs to others.`,'h')
]});

LSE5.push({n:2,t:`The Cow (Poem) – Unit 5 Poetry`,au:`Robert Louis Stevenson`,pg:11,
words:`cream – the thick, rich part of milk (ಕೆನೆ); might – strength; apple tart – apple cake; wanders – goes here and there without any aim; lowing – sound made by cows; stray – deviate; pleasant – nice; meadow – grassland`,
notes:`A short poem by Robert Louis Stevenson about a friendly red and white cow. The poet loves the cow with all his heart because she gives cream to eat with apple-tart. The cow walks lowing in the pleasant open air and light of day, blown by winds, wet with showers, among the meadow grass, eating meadow flowers. Theme: love for the cow and joy of nature. Activity pages: match animals with their sounds; domestic and wild animals.`,
ab:[
[`C1. Answer the following questions`,[
[`What does the cow give us?`,`The cow gives us cream (milk), which we eat with apple-tart.`],
[`Where does she walk?`,`She walks among the meadow grass, in the pleasant open air.`],
[`What does she eat?`,`She eats the meadow flowers (and meadow grass).`],
[`'In what kind of air' does the cow wander?`,`The cow wanders in the pleasant open air.`],
[`Who has written this poem?`,`Robert Louis Stevenson.`]]],
[`A1. Match the animals with their sounds`,[

[`A2. List these animals under Domestic Animals and Wild Animals`,[
[`Domestic Animals`,`dog, cow, sheep, goat, ox, buffalo`],
[`Wild Animals`,`fox, tiger, elephant, bear, lion, giraffe`]]]
],
qb:[

M(`The cow in the poem is:`,[`black`,`red and white`,`brown`,`all white`],1),
M(`The cow gives cream to eat with:`,[`bread`,`rice`,`apple-tart`,`honey`],2),
M(`'Lowing' means:`,[`sound made by cows`,`sound made by dogs`,`walking slowly`,`eating grass`],0),
M(`'Meadow' means:`,[`river`,`grassland`,`hill`,`forest`],1),
M(`'Might' in the poem means:`,[`strength`,`maybe`,`night`,`milk`],0,'m'),
O(`What colour is the cow in the poem?`,`Red and white.`),
O(`What does the cow give the poet?`,`Cream.`),
O(`What does the poet eat the cream with?`,`Apple-tart.`),
O(`Where does the cow walk?`,`Among the meadow grass.`),
O(`What does the cow eat?`,`The meadow flowers.`),
G(`Write the meaning of 'wanders'.`,`goes here and there without any aim`),
G(`Write the meaning of 'pleasant'.`,`nice`,'e'),
G(`Write the word from the poem that rhymes with 'heart'.`,`tart`),
G(`Write the word from the poem that rhymes with 'stray'.`,`day`),
G(`Write the word from the poem that rhymes with 'pass'.`,`grass`),
G(`Which animal 'moos'?`,`A cow`,'e'),

S(`Why does the poet love the cow?`,`The poet loves the friendly cow with all his heart because she gives him cream with all her might. He eats the cream with apple-tart.`),
S(`Describe how the cow spends her day.`,`The cow wanders here and there, lowing, in the pleasant open air and the light of day. She is blown by the winds and wet with the showers. She walks among the meadow grass and eats the meadow flowers.`),

L(`Write a paragraph on how a cow is useful to us.`,`The cow is a very useful animal. She gives us milk, from which we get curd, butter, ghee and cream. The poet loves her because she gives cream to eat with apple-tart. Bullocks help farmers to plough the fields and pull carts. Cow dung is used as manure and fuel. So the cow is rightly called our friend.`,'h')
]});

LSE5.push({n:3,t:`Dignity of Labour – Unit 6 Prose`,au:`Prose (Story)`,pg:14,
words:`lazy – one who does not want to work; responsible – one who can take up work and finish it; realise – become aware or understand something; labour – hard work; scare – get frightened; melt – get softened; wisdom – knowledge; supper – meal eaten at night; accept – agree; tremble – shake due to fear or excess work; ache – pain; rashes – red marks on the skin`,
notes:`A rich businessman had a lazy son and wanted him to realise the value of labour. He told the boy to earn something or go without food. The mother gave a gold coin and later the sister gave a rupee coin; the wise father guessed and made him throw each into the well. At last, with no one to help, the boy carried a shopkeeper's bag for two rupees. He sweated, trembled and ached, and refused to throw his hard-earned money into the well. The father was happy and handed over the keys of his shop. Moral: hard work has dignity. Language work: genders, short forms (apostrophe), speech sound 'oi' as in 'oil'.`,
ab:[
[`Warm-up Task B. Work done by mother and father (sample)`,[
[`Mother`,`cuts grass, cooks food, washes clothes, sweeps the house, fetches water (Model answer)`],
[`Father`,`ploughs the field, works in the office/shop, repairs things at home, buys vegetables, drives the vehicle (Model answer)`]]],
[`V1. Write the other genders of the underlined words`,[
[`Raju's father and ______ went to the market.`,`mother`],
[`My uncle and ______ came to our house.`,`aunt`],
[`My grandfather and ______ go for a walk.`,`grandmother`],
[`Boys and ______ play in the playground.`,`girls`],
[`The wife was cool and calm but her ______ was tensed.`,`husband`]]],
[`V2. Match the following`,[
[`businessman`,`rich`],[`mother`,`gold coin`],[`sister`,`one rupee`],[`son`,`lazy`],[`shopkeeper`,`two rupees`]]],
[`V3. Select the words and write them in the right column`,[
[`Father`,`wise, guess, strict, happy, value of hard work`],
[`Son`,`scared, lazy, tears, sweat, rashes, ache, promised`]]],
[`C1. Answer the following questions`,[
[`What kind of a boy was the businessman's son?`,`The businessman's son was a lazy boy.`],
[`What did the businessman tell his son?`,`He told his son to go out and earn something, otherwise he would not be given food that night.`],
[`Why did the mother give her son a gold coin?`,`The boy went crying to his mother. Her heart melted at the sight of tears in her son's eyes, so she gave him a gold coin.`],
[`What did the father ask the son to do with the coins?`,`The father asked the son to throw the coins into the well in front of their house.`],
[`Why did the son go to the market?`,`There was no one to help him, so he went to the market in search of work.`],
[`How did he earn two rupees?`,`A shopkeeper offered him two rupees for carrying his bag to his house, and the boy did the work.`],
[`Why was the boy not ready to throw the two-rupee coin into the well?`,`He had worked hard for it; his body was aching and his palms had rashes. It was his hard-earned money.`]]],
[`C2. Answer in four to six sentences`,[
[`Describe the attitude of the boy towards work.`,`At first the boy was lazy and not used to any kind of work. He was scared when his father asked him to earn, and he cried and depended on his mother and sister. But after carrying the heavy bag and suffering pain, he understood the value of hard work. He refused to waste his hard-earned money and promised never to be lazy. (Model answer)`],
[`'... you are asking me to throw my hard earned money into the well!' Explain the feelings of the boy when he said this.`,`The boy was in pain, tired and upset. His body was aching, his feet were trembling and his palms had rashes. He felt it was unfair to throw away the money that he had earned with so much effort. This showed that he now respected the value of labour. (Model answer)`]]],
[`L1(a). Write the short forms`,[
[`Has not`,`hasn't`],[`Are not`,`aren't`],[`Have not`,`haven't`],[`They are`,`they're`],[`I will`,`I'll`]]],
[`L1(b). Write the full forms`,[
[`Weren't`,`were not`],[`Doesn't`,`does not`],[`I've`,`I have`],[`What's`,`what is`],[`She'll`,`she will`]]],
[`L2. Speech sounds – 'oi' as in 'oil'`,[
[`Say: boil, coil, soil, spoil, coin, join, voice, choice.`,`Activity: Repeat after the teacher with the correct 'oi' sound.`]]]
],
qb:[
M(`The businessman's son was:`,[`hard-working`,`lazy`,`clever`,`sick`],1),
M(`The mother gave the boy a:`,[`rupee coin`,`gold coin`,`silver mango`,`two-rupee coin`],1),
M(`The sister gave the boy a:`,[`gold coin`,`rupee coin`,`two-rupee coin`,`bag`],1),
M(`The boy earned ______ by carrying a bag.`,[`one rupee`,`two rupees`,`ten rupees`,`a gold coin`],1),
M(`Where did the father ask the boy to throw the coins?`,[`river`,`well`,`pond`,`garden`],1),
M(`The father finally handed over the ______ to his son.`,[`keys of his shop`,`gold coin`,`house`,`bag`],0),
M(`'Supper' means:`,[`meal eaten in the morning`,`meal eaten at night`,`meal eaten at noon`,`a snack`],1,'m'),
M(`'Rashes' means:`,[`red marks on the skin`,`pain`,`sweat`,`tears`],0,'m'),
O(`What did the father want his son to realise?`,`The value of labour (hard work).`),
O(`Why did the boy go crying to his mother?`,`He was scared by his father's demand to go out and earn something.`),
O(`Who guessed that the gold coin was given by the wife?`,`The father, who was a man of wisdom.`),
O(`Where did the father send his wife and daughter?`,`He sent his wife to her parents' house and his daughter back to her in-law's house.`,'m'),
O(`How did the boy feel when he finished carrying the bag?`,`He was sweating a lot, his feet were trembling and his neck and back were aching.`),
O(`What did the son promise at the end?`,`He promised never to be lazy.`),
G(`Write the other gender of 'uncle'.`,`aunt`),
G(`Write the other gender of 'grandfather'.`,`grandmother`),
G(`Write the other gender of 'wife'.`,`husband`),
G(`Write the short form of 'cannot'.`,`can't`),
G(`Write the short form of 'We will'.`,`we'll`),
G(`Write the full form of 'isn't'.`,`is not`),
G(`Write the full form of 'I've'.`,`I have`),
S(`Why did the father ask his son to throw the gold coin into the well?`,`The father knew that the boy had not earned the coin by himself. He guessed that his wife had given it. By throwing it into the well, he wanted the boy to learn that money which is not earned with hard work has no value to him.`),
S(`What happened on the third day?`,`There was no one to help the boy. He went to the market in search of work and a shopkeeper offered him two rupees for carrying his bag to his house. The boy accepted. He was sweating and aching when he finished the work.`),
S(`How did the businessman feel at the end of the story? Why?`,`The businessman was happy because his son had realised the value of hard work. The son promised never to be lazy, so the father handed over the keys of his shop to him.`),
L(`Narrate the story 'Dignity of Labour' in your own words.`,`A rich businessman had a lazy son. To teach him the value of labour, he told him to earn something or go without food. The boy cried to his mother, who gave him a gold coin. The father asked him to throw it into the well. The next day the sister gave him a rupee coin and the father again made him throw it into the well. Then the father sent away both his wife and daughter. This time the boy went to the market and carried a shopkeeper's bag for two rupees. He was tired and in pain. When the father asked him to throw the coin into the well, he cried out that it was his hard-earned money. The father was happy and gave him the keys of his shop.`),
L(`What does the story 'Dignity of Labour' teach us?`,`The story teaches us that hard work has its own value and dignity. Money that we earn through our own labour is precious, while money got easily can be wasted. The boy understood this only when he worked himself. We should be hard-working and responsible and never be lazy.`,'h')
]});

LSE5.push({n:4,t:`Results and Roses (Poem) – Unit 6 Poetry`,au:`Edgar A. Guest`,pg:21,
words:`attain – to reach or succeed in getting something; to achieve; repose – to rest or stay; seek – to try to find or get something; fair – beautiful`,
notes:`A poem by Edgar A. Guest. A man who wants a beautiful garden, small or big, must bend his back and dig. Few things on earth can be got by wishes alone; whatever is worth having, we have to work to gain. Whatever goal we seek, the secret is the same: dig from week to week to get Results or Roses. Theme: hard work is the key to success.`,
ab:[
[`C1. Answer the following questions`,[
[`What do these words from the poem refer to: fair, small, big?`,`They refer to the garden: a beautiful ('fair') garden, either small or very big.`],
[`What does this poem mean?`,`The poem means that nothing worth having can be got by mere wishing. Just as a gardener must dig to get roses, we must work hard to get results and achieve our goals.`],
[`What should the man (you) do to get beautiful roses?`,`He should bend his back and dig, that is, work hard from week to week.`],
[`Who is the poet of this poem?`,`Edgar A. Guest.`]]],
[`A1. Complete the sets of rhyming words`,[
[`fair`,`there`],[`big`,`dig`],[`worth`,`earth`],[`reposes`,`roses`],[`attain`,`gain`],[`seek`,`week`]]],
[`A2. Identify the words from the jumbled letters`,[
[`mslal`,`small`],[`forelsw`,`flowers`],[`ogla`,`goal`],[`utrlses`,`results`],[`cabk`,`back`],[`renagd`,`garden`]]]
],
qb:[
M(`The poem 'Results and Roses' is written by:`,[`Edgar A. Guest`,`Robert Louis Stevenson`,`Thomas Davis`,`Rabindranath Tagore`],0),
M(`The man who wants a garden must:`,[`sleep`,`bend his back and dig`,`only wish`,`pray`],1),
M(`'Attain' means:`,[`to lose`,`to reach or achieve`,`to rest`,`to dig`],1),
M(`'Fair' in the poem means:`,[`unjust`,`beautiful`,`small`,`dark`],1),
M(`'Seek' means:`,[`to try to find or get something`,`to hide`,`to sleep`,`to throw`],0),
M(`Which word rhymes with 'dig'?`,[`big`,`dog`,`dug`,`day`],0,'m'),
O(`Who wants a garden fair?`,`The man (anyone who wants a beautiful garden).`),
O(`What must the man do to get a garden?`,`He must bend his back and dig.`),
O(`What do we have to do to gain anything worth having?`,`We have to work to gain it.`),
O(`What is the secret of success according to the poet?`,`To dig (work hard) from week to week.`),
O(`What are the two things the poet names in the last line?`,`Results and Roses.`,'m'),
G(`Write the word from the poem that rhymes with 'week'.`,`seek`),
G(`Write the word from the poem that rhymes with 'worth'.`,`earth`),
G(`Write the word from the poem that rhymes with 'gain'.`,`attain`),
G(`Unscramble the letters: 'ogla'.`,`goal`),
G(`Unscramble the letters: 'renagd'.`,`garden`),
G(`Write the meaning of 'repose'.`,`to rest or stay`,'e'),
S(`What does the poet say about wishes?`,`The poet says that the things that wishes can attain are mighty few on earth. Whatever we want that is of any worth, we have to work to gain it.`),
S(`What is the secret of every goal, according to the poet?`,`It does not matter what goal we seek. The secret is the same: we have to dig from week to week, that is, work hard continuously, to get results or roses.`),
S(`What is the message of the poem?`,`The message is that hard work is necessary for success. Just as a garden needs digging and care, every goal needs continuous effort.`),
L(`Explain the poem 'Results and Roses' in your own words.`,`The poet says that a man who wants a beautiful garden, small or big, with flowers growing here and there, must bend his back and dig. Very few things on earth can be got by wishing alone. Whatever is valuable, we have to work for it. The secret is the same for every goal: we must dig, that is, work hard week after week. Only then will we get results, or roses. The poem teaches the value of hard work and patience.`,'h')
]});

LSE5.push({n:5,t:`A Great Coachman – Unit 7 Prose`,au:`Prose (Biography)`,pg:23,
words:`coach – horse-drawn carriage; desire – wish; scholar – a learned person; wandering – moving from place to place; monk – a holy man; social evils – evils that affect the society (ಸಾಮಾಜಿಕ ಪಿಡುಗುಗಳು); caste system – different groups in the society; superstitions – blind faith (ಮೂಢನಂಬಿಕೆಗಳು); religions – systems of faith and worship; brotherhood – a feeling that all belong to a family and are brothers and sisters (ಸೋದರಭಾವ); motto – that expresses the aims and beliefs of a person (ಸೂಕ್ತಿ, ಧ್ಯೇಯವಾಕ್ಯ); achievements – great works`,
notes:`Little Naren said he wanted to be a coachman. His mother wisely told him to be a coachman like Krishna who guided Arjuna and showed the path to people. Narendra (born 12 January 1863 to Vishwanath Dutta and Bhuvaneshwari Devi) became Swami Vivekananda. He met his guru Ramakrishna Paramahamsa, became a wandering monk, spoke on education and fought social evils. In 1893 he gave a great speech at the Parliament of Religions in Chicago. He established Belur Math, the centre of Ramakrishna Mission, whose motto is 'Work is Worship'. He lived only 39 years. Language work: prepositions, completing a dialogue, speech sound 'oo' as in 'school'.`,
ab:[
[`V1. Make words from UNDERSTAND and EXPERIENCE`,[
[`UNDERSTAND`,`under, stand, stud, tan, and, sand, red, dust, treat... (Model answer: any valid words made from the letters)`],
[`EXPERIENCE`,`experience, ripe, pen, rice, price, nice, expert, peer, pine... (Model answer: any valid words made from the letters)`]]],
[`V2. Fill in the blanks with suitable words from the box (with, to, under, for, on)`,[
[`A mouse ran ______ the wall and hid ______ the table.`,`on; under`],
[`I poked it ______ a stick. It jumped ______ the stool and was there ______ sometime.`,`with; on; for`]]],
[`C1. Answer in two to three sentences each`,[
[`What did Naren tell his mother one day?`,`Naren told his mother that he wanted to be a coachman like the coachman who drove the coach. He said how nice it is to drive a coach.`],
[`What picture did the mother show him?`,`The mother showed him the picture of Krishna as the charioteer (coachman) of Arjuna and told him to be a coachman like Krishna, who guided Arjuna. ⚠ (The text mentions only her words; check this answer with the textbook.)`],
[`When was Naren born?`,`Naren was born on 12th January 1863.`],
[`Who was Narendranath's guru?`,`Ramakrishna Paramahamsa was Narendranath's guru.`],
[`What is the motto of Ramakrishna Mission?`,`The motto of Ramakrishna Mission is 'Work is Worship'.`]]],
[`C2. Answer in five to six sentences each`,[
[`'...you should be a coachman like Krishna.' What did Naren's mother mean?`,`Naren's mother meant that he should guide people on the right path just as Krishna, as Arjuna's charioteer, guided Arjuna. She wanted him to show the path to the innocent people of the world. Later Naren became Swami Vivekananda and fulfilled his mother's wish by guiding people through his teachings. (Model answer)`],
[`What did Vivekananda tell in the Parliament of World Religions at Chicago?`,`He said that all religions in the world preach the same truth. Therefore everyone in the world should develop a sense of brotherhood and love each other. He returned to India and began to teach tolerance and love.`],
[`Collect pictures of Swami Vivekananda and write about his life.`,`Activity: Children collect pictures and write a short life sketch using the lesson: birth in 1863, school at six, guru Ramakrishna Paramahamsa, wandering monk, Chicago speech in 1893, Belur Math, died at 39.`]]],
[`L1. Fill in the blanks with the correct words`,[
[`I went ______ (in / into) the park.`,`into`],
[`I saw a lot ______ (of / off) children playing ______ (on / in) the playground.`,`of; in`],
[`A little girl wanted ______ (too / to) read a book.`,`to`],
[`Her parents asked her to go ______ (out / in) and play.`,`out`],
[`But she said that she would continue ______ (to / for) sit in her room and read a book.`,`to`]]],
[`L2. Complete the following dialogue`,[
[`"Hello Nayana, where ______?"`,`are you going`],
[`"Why ______?" "Who is ______?"`,`Why (are you going to the doctor)? / Who is (sick/ill)?`],
[`"My mother ______ stomach ache."`,`has (a)`],
[`"Yes, I'll get some medicine and then ______."`,`come to school (Model answer)`]]],
[`L3. Speech sounds – 'oo' as in 'school'`,[
[`Say: moon, toon, soon, spoon, glue, true.`,`Activity: Repeat after the teacher; read the lines about Linda and Brinda in blue.`]]]
],
qb:[
M(`Naren wanted to be a:`,[`doctor`,`coachman`,`teacher`,`soldier`],1),
M(`Naren's mother told him to be a coachman like:`,[`Rama`,`Krishna`,`Arjuna`,`Hanuman`],1),
M(`Narendra became famous as:`,[`Swami Vivekananda`,`Ramakrishna`,`Valmiki`,`Veereshwara`],0),
M(`Narendra was born in the year:`,[`1857`,`1863`,`1893`,`1902`],1),
M(`Vivekananda's guru was:`,[`Vishwanath Dutta`,`Ramakrishna Paramahamsa`,`Krishna`,`Vasishta`],1),
M(`The motto of Ramakrishna Mission is:`,[`Truth alone triumphs`,`Work is Worship`,`Unity in Diversity`,`Service to all`],1),
M(`Vivekananda made a great speech in the Parliament of Religions at:`,[`Delhi`,`Calcutta`,`Chicago`,`London`],2,'m'),
M(`'Brotherhood' means a feeling that:`,[`all belong to a family and are like brothers and sisters`,`everyone is rich`,`all are equal in height`,`all live in a city`],0,'m'),
O(`Who were Narendra's parents?`,`Vishwanath Dutta and Bhuvaneshwari Devi.`),
O(`What name did the parents first give the child, and why?`,`Veereshwara, because they considered the child a gift from Lord Veereshwara.`,'m'),
O(`At what age was Narendra sent to school?`,`At the age of six.`),
O(`In which year did Vivekananda go to the USA?`,`In 1893.`),
O(`Which math did he establish in Calcutta?`,`Belur Math.`),
O(`For how many years did Vivekananda live?`,`Only 39 years.`),
G(`Fill in the blank: A mouse ran ______ the wall. (on / for)`,`on`),
G(`Fill in the blank: I poked it ______ a stick. (with / under)`,`with`),
G(`Fill in the blank: I went ______ the park. (in / into)`,`into`),
G(`Write the meaning of 'scholar'.`,`a learned person`,'e'),
G(`Write the meaning of 'monk'.`,`a holy man`,'e'),
G(`Write the meaning of 'achievements'.`,`great works`,'e'),
G(`Fill in the blank: The mouse hid ______ the table. (under / to)`,`under`),
S(`What did Vivekananda say about education?`,`Vivekananda spoke to the people about the importance of education. He said that education should develop a complete human being.`),
S(`Which social evils did Vivekananda fight against?`,`Vivekananda fought against social evils like the caste system and superstitions.`),
S(`Why is Vivekananda remembered even today?`,`Though he lived for only 39 years, his achievements are great. He made the world understand that India was a great country and his words guide us even today.`),
L(`Write about the life of Swami Vivekananda.`,`Narendranath Dutta was born on 12th January 1863 to Vishwanath Dutta and Bhuvaneshwari Devi. He went to school at six and read stories from the Ramayana and Mahabharatha. He wanted to study more and to see God. He met his guru Ramakrishna Paramahamsa, experienced God and stayed with him for a few years. Then he became a wandering monk, visiting different places in India and speaking about education. He fought against social evils like the caste system and superstitions. In 1893 he gave a great speech at the Parliament of Religions in Chicago. He established Belur Math in Calcutta, the centre of Ramakrishna Mission, whose motto is 'Work is Worship'. He lived only 39 years.`),
L(`Explain what Vivekananda said at the Parliament of Religions in Chicago and how it helped India.`,`In 1893 Vivekananda went to the USA and gave a great speech at the Parliament of Religions in Chicago. He said that all religions in the world preach the same truth, so everyone should develop a sense of brotherhood and love one another. After returning to India he began to teach tolerance and love. His speech made the world understand that India was a great country.`,'h')
]});

LSE5.push({n:6,t:`Paper Boats (Poem) – Unit 7 Poetry`,au:`Rabindranath Tagore`,pg:30,
words:`stream – flowing water; strange – unknown; shiuli flowers – white and orange parijatha flowers; blooms – bud opening into flower; dawn – time of first sunshine; launch – send; bulging – swollen; playmate – a friend; fairies – beautiful, charming ladies who live in the other world; lading – load`,
notes:`A poem by Rabindranath Tagore. A child floats paper boats down a running stream day by day, writing his name and the name of his village in big black letters, hoping that someone in a strange land will find them. He loads them with shiuli flowers. Looking at the sky he sees little clouds sailing like white-sailed boats and wonders which playmate sends them to race with his boats. At night he dreams that the boats float under the midnight stars carrying fairies of sleep and baskets full of dreams. Theme: childhood imagination.`,
ab:[
[`C1. Answer in two to three sentences each`,[
[`How many boats did the child float?`,`The child floated paper boats day by day, one by one, so many boats (not a fixed number).`],
[`Why did the child write its name on the boat?`,`The child wrote his name and his village's name in big black letters because he hoped that someone in some strange land would find the boats and know who he was.`],
[`What did the child load the boat with?`,`The child loaded the little boats with shiuli flowers from their garden.`],
[`What did the child dream at night?`,`The child dreamt that his paper boats floated on and on under the midnight stars, with the fairies of sleep sailing in them and their baskets full of dreams as the load.`]]],
[`C2. Pick out words or phrases from the poem that mean the following`,[
[`flowing water  s _ _ _ _ m`,`stream`],
[`flowers that blossom in the early morning  s _ _ _ _ i`,`shiuli`],
[`set the paper boats afloat  l _ _ _ _ h`,`launch`],
[`imaginary friend  p _ _ _ _ _ _ e`,`playmate`]]],
[`A1. Riddle`,[
[`I go up and down a lot... My name rhymes with daughter. I am your friend named ______`,`Water`]],],
[`A2. Make a paper boat and decorate it`,[
[`Paper boat`,`Activity: Fold a sheet of paper into a boat as shown by the teacher and decorate it with colours and flowers.`]]]
],
qb:[
M(`The poem 'Paper Boats' is written by:`,[`Rabindranath Tagore`,`Edgar A. Guest`,`Robert Louis Stevenson`,`Thomas Davis`],0),
M(`The child floats the paper boats down the:`,[`sea`,`running stream`,`well`,`road`],1),
M(`The child loads the boats with ______ flowers.`,[`rose`,`lotus`,`shiuli`,`jasmine`],2),
M(`The little clouds in the sky have ______ sails.`,[`red`,`white bulging`,`black`,`golden`],1),
M(`'Dawn' means:`,[`time of first sunshine`,`midnight`,`evening`,`noon`],0),
M(`'Lading' means:`,[`load`,`ladder`,`flower`,`water`],0,'m'),
M(`'Bulging' means:`,[`shrinking`,`swollen`,`broken`,`light`],1,'m'),
O(`What does the child write on his boats?`,`His name and the name of the village where he lives.`),
O(`Who does the child hope will find his boats?`,`Someone in some strange land.`),
O(`With what are the little boats loaded?`,`Shiuli flowers from the garden.`),
O(`What does the child see in the sky?`,`Little clouds setting their white bulging sails.`),
O(`Who are sailing in the boats in the child's dream?`,`The fairies of sleep.`),
O(`What do the fairies carry in their baskets?`,`Dreams.`,'m'),
G(`Write the meaning of 'stream'.`,`flowing water`,'e'),
G(`Write the meaning of 'strange'.`,`unknown`,'e'),
G(`Write the meaning of 'launch'.`,`send`,'e'),
G(`Write the meaning of 'playmate'.`,`a friend`,'e'),
G(`Unscramble to get a word from the poem: 'maetrs'.`,`stream`),
G(`Who is the friend described in the riddle whose name rhymes with 'daughter'?`,`Water`),
S(`Why does the child write his name and village name on the boats?`,`The child hopes that someone in some strange land will find the boats and know who he is and where he lives.`),
S(`What does the child think about the clouds in the sky?`,`The child sees the little clouds setting their white bulging sails and thinks that a playmate of his in the sky sends them down to race with his paper boats.`),
S(`What does the child hope for his flower-loaded boats?`,`The child hopes that these blooms of the dawn will be carried safely to land in the night.`),
L(`Describe the child's dream in the poem 'Paper Boats'.`,`When night comes, the child buries his face in his arms and dreams. In his dream his paper boats float on and on under the midnight stars. The fairies of sleep are sailing in them, and the load they carry is their baskets full of dreams. The poem shows the child's love for his boats and his rich imagination.`,'h')
]});

LSE5.push({n:7,t:`Children of Courage – Bravery Awards – Unit 8 Prose`,au:`Prose (Informative)`,pg:34,
words:`shamiana – decorated tent; initiate – to begin something; recipient – a person who receives something; eve – evening, before the event; valour – great courage; atop – on the top of; confer – to give somebody an award; averted – avoided; stampede – a situation in which a group of people suddenly start running; salute – show of honour for somebody in public for their achievement`,
notes:`Every year the Indian Council for Child Welfare (ICCW) gives bravery awards to about 25 children below 16. National bravery awards began in 1957 after 14-year-old scout Harish Chandra cut a burning shamiana at Ramlila ground, Red Fort, on 2 October 1957 and saved hundreds of lives; he became the first recipient. Awards are announced on 14 November (Children's Day) and presented before Republic Day; awardees get a medal, certificate and cash and ride elephants in the Republic Day Parade. The lesson tells of Gagan and Bhoomika, Rahul, Silver Kharbani, Vishal Patil, Gaurav Saini, Prity Devi, Priyanshu Joshi, Gurjeevan Singh and Moonis Khan. Language work: nouns and adjectives.`,
ab:[
[`V1. Fill in the blanks with the words in the box`,[
[`It was ______ that Abhi and his friends met with an accident...`,`unfortunate`],
[`His friend Nitin showed ______ in saving them...`,`courage`],
[`Nitin received an award for ______.`,`bravery`],
[`He is always ______ to help his friends.`,`ready`]]],
[`V2. Match the following`,[
[`Gagan and Bhoomika J. Murthy`,`c. saved a baby that was caught in the path of two bulls`],
[`Moonis Khan`,`a. saved an old man from a train accident`],
[`Rahul`,`e. identified criminals who had planted bombs`],
[`Silver Kharbani`,`b. saved the life of her cousin from a fire`],
[`Kumari Maibam Prity Devi`,`d. used her bare hands to dispose of a live grenade`],
[`Priyanshu Joshi (option f, extra)`,`f. fought off a leopard that was trying to attack his sister`]]],
[`V3. Fill in the blanks with suitable adjectives`,[
[`This is an ______ story. (adventure/adventurous)`,`adventurous`],
[`She is a ______ girl. (beautiful/beauty)`,`beautiful`],
[`He is a ______ boy. (young/youth)`,`young`],
[`This is a ______ tree. (tall/high)`,`tall`],
[`Our teacher is ______ to us. (better/good)`,`good`]]],
[`C1. Answer the following questions`,[
[`When was the first Bravery Award for children given in India?`,`The national awards for bravery began in 1957 (first given to Harish Chandra for his act on 2nd October 1957).`],
[`Why are the Bravery Awards given?`,`They are given to acknowledge the extraordinary courage displayed by children in difficult situations, and to encourage children to use their presence of mind and show courage in real life.`],
[`What is the age group that is considered for the Bravery Awards?`,`Children below the age of 16.`],
[`What do the awardees receive?`,`The awardees receive a medal, a certificate and cash as a token of appreciation of their valour. Some also get financial assistance for higher education.`]]],
[`C2. Discuss and write a note on the act that impressed you most`,[
[`I feel that ______ was a very brave act. The child who did this is ______ from ______. She/he was ___ years old. I think it was very brave because ______.`,`Model answer: I feel that fighting off a leopard was a very brave act. The child who did this is Priyanshu Joshi from Uttarakhand. He was ten years old. I think it was very brave because he saved his sister without thinking of his own life.`]]],
[`C3. Identify the adjectives in paragraph number 10`,[
[`Paragraph 10 (Kumari Maibam Prity Devi)`,`bare (hands), live (grenade), mother's (shop – possessive). ('Bare' and 'live' are the adjectives.)`]]],
[`L1. Discuss with your partner why you like or don't like to do the following`,[
[`Speaking, taking an injection, telling the truth, etc.`,`Activity: Pair discussion. Sample: I like to speak before the school because I want to share my ideas. / I don't like injections because they are painful but I take them to become well.`]]],
[`L2. Underline the nouns in the paragraph on Indian music`,[
[`Indian music is very expressive... Both systems are fundamentally similar but differ in performance.`,`music, methods, system, pillars, rag, tal, form, interpretation, India, traditions, sangeet, performance (also: Hindustani, Carnatic as proper nouns)`]]],
[`L3. Speech sounds – tongue-twisters`,[
[`Red bulb blue bulb / She sells sea-shells by the sea-shore / I scream, you scream, we all scream for ice-cream.`,`Activity: Repeat the tongue-twisters quickly and clearly after the teacher.`]]]
],
qb:[
M(`The national Bravery Awards began in the year:`,[`1947`,`1957`,`1967`,`1977`],1),
M(`The first Bravery Award was given to:`,[`Rahul`,`Gaurav Singh Saini`,`Harish Chandra`,`Moonis Khan`],2),
M(`Harish Chandra cut the burning shamiana with a:`,[`knife`,`sword`,`stick`,`rope`],0),
M(`The Bravery Awards are announced on:`,[`26 January`,`15 August`,`14 November`,`2 October`],2),
M(`Awardees ride atop decorated ______ in the Republic Day Parade.`,[`horses`,`elephants`,`camels`,`cars`],1),
M(`Priyanshu Joshi fought off a:`,[`bull`,`leopard`,`snake`,`thief`],1),
M(`'Valour' means:`,[`great courage`,`fear`,`laziness`,`anger`],0,'m'),
M(`'Stampede' means:`,[`a group of people suddenly start running`,`a quiet prayer`,`a decorated tent`,`a bank robbery`],0,'m'),
O(`Who is ICCW?`,`The Indian Council for Child Welfare, which awards brave children every year.`),
O(`How old was Harish Chandra when he saved the people?`,`He was a 14-year-old scout.`),
O(`Who inspired the awards? / Who initiated the awards?`,`Pandit Jawaharlal Nehru, India's first Prime Minister, initiated the awards.`),
O(`What did Gagan and Bhoomika do?`,`They pulled an eighteen-month-old child away from the path of two bulls.`),
O(`How did Rahul help the police?`,`His information about the men who planted bombs helped the police make sketches of the criminals.`),
O(`Who saved a woman and her child from drowning?`,`Vishal Suryaji Patil of Maharashtra.`),
O(`What did Maibam Prity Devi do?`,`She used her bare hands to dispose of a live grenade hurled at her mother's shop in Imphal.`,'m'),
G(`Fill in the blank: This is an ______ story. (adventure/adventurous)`,`adventurous`),
G(`Fill in the blank: She is a ______ girl. (beautiful/beauty)`,`beautiful`),
G(`Fill in the blank: This is a ______ tree. (tall/high)`,`tall`),
G(`Write the meaning of 'recipient'.`,`a person who receives something`,'e'),
G(`Write the meaning of 'initiate'.`,`to begin something`,'e'),
G(`Identify the adjective in: 'It was an unfortunate accident.'`,`unfortunate`),
G(`Identify one noun in: 'Indian music is very expressive.'`,`music`),
S(`How did Harish Chandra save the lives of hundreds of people?`,`A fire broke out in a shamiana at the Ramlila ground in the Red Fort through a short-circuit. Harish Chandra, a 14-year-old scout, quickly took out his knife and cut the burning shamiana. This act saved hundreds of trapped people.`),
S(`What happens on the Republic Day for the awardees?`,`The Bravery Awards are presented by the Prime Minister on the eve of Republic Day. On 26th January the awardees take part in the Republic Day Parade in New Delhi, riding atop decorated elephants.`),
S(`What did Gurjeevan Singh of Punjab do?`,`Eleven-year-old Gurjeevan Singh helped prevent a bank robbery by attacking the thieves with bricks. The thieves opened fire but he escaped. The pistol slipped from their hands and others managed to catch the robbers.`),
S(`Write about the courage of Gaurav Singh Saini.`,`Thirteen-year-old Gaurav Singh Saini from Haryana received the National Bravery Award in 2009. He saved 50–60 people during a stampede at the Naina Devi temple in Himachal Pradesh.`),
L(`Describe how the Bravery Awards for children began and why they are given.`,`On 2nd October 1957 India's first Prime Minister Jawaharlal Nehru was watching a performance at the Ramlila ground in the Red Fort. A fire broke out in a shamiana through a short-circuit. Harish Chandra, a 14-year-old scout, cut the burning shamiana with his knife and saved hundreds of lives. Nehru was inspired and asked the authorities to honour brave children from all over the country. Harish Chandra became the first recipient. The awards are given to acknowledge the extraordinary courage of children and to encourage them to use presence of mind and show courage in real life.`),
L(`Write about any three child heroes mentioned in the lesson.`,`Gagan and Bhoomika J. Murthy of Bengaluru, six-year-old twins, pulled an eighteen-month-old child away from two running bulls. Priyanshu Joshi of Uttarakhand, aged ten, single-handedly fought off a leopard that attacked his sister on their way to school. Moonis Khan of Madhya Pradesh, aged 15, saved an old man from a railway accident. These children showed great courage and presence of mind.`,'h')
]});

LSE5.push({n:8,t:`My Land (Poem) – Unit 8 Poetry`,au:`Thomas Davis`,pg:43,
words:`rare – uncommon (ಅಪರೂಪದ); fair – beautiful; waver – hesitate, be scared of; native land – land of one's birth; lot – one's fortune; divine – god-like; bold – courageous`,
notes:`A patriotic poem by Thomas Davis in praise of one's native land. She is rich, rare, fresh, fair, dear, warm, bold, true and old. No men are braver and her women's hearts never waver. The poet would freely die to save her and think his lot divine. The word 'land' is described as 'she' (the motherland). Theme: love for the motherland and patriotism.`,
ab:[
[`C1. Answer the following questions`,[
[`How is the native land?`,`The native land is rich, rare, fresh, fair, dear, warm, bold, true and old.`],
[`How are the men or women in this land?`,`The men are braver than any others and the hearts of her women never waver (they are brave).`],
[`Write a short paragraph of five sentences on India – My Motherland.`,`Model answer: India is my motherland. It is a very large and beautiful country. People of many religions and languages live here together. Our country has great rivers, mountains and forests. I love my country and will always serve it with honesty.`]]],
[`A1. Write the opposites of the following words`,[
[`dull`,`bright (sharp)`],[`brave`,`cowardly`],[`warm`,`cold`],[`fearful`,`fearless`],[`plenty`,`scarcity (few)`]]],
[`A2. Read the paragraph on Laxmi Bai and do the tasks`,[
[`Give a suitable title to this paragraph.`,`Rani Laxmi Bai of Jhansi (or: The Brave Queen of Jhansi)`],
[`Identify the nouns in the paragraph.`,`Laxmi Bai, queen, Jhansi, struggle, British, battle, June, Sir Hugh Rose, fortress, March, traitors, gates, night, April, Tantia Tope, Kalpi, fort, Gwalior, Sindhia`]]]
],

M(`'Waver' means:`,[`hesitate, be scared of`,`dance`,`run`,`shine`],0),
M(`'Divine' means:`,[`ordinary`,`god-like`,`foolish`,`dirty`],1),
M(`'Bold' means:`,[`shy`,`courageous`,`weak`,`lazy`],1,'m'),
M(`'Native land' means:`,[`land of one's birth`,`a foreign country`,`a big city`,`a forest`],0,'m'),
O(`Which words are used in the poem to describe the land?`,`Rich, rare, fresh, fair, dear, warm, bold, true and old.`,'m'),
O(`Who are braver than her men?`,`No men are braver than her men (her men are the bravest).`),

G(`Write the opposite of 'dull'.`,`bright`),
G(`Write the opposite of 'brave'.`,`cowardly`),
G(`Write the opposite of 'warm'.`,`cold`),
G(`Write the opposite of 'fearful'.`,`fearless`),
G(`Write the opposite of 'plenty'.`,`scarcity`),
G(`Write the meaning of 'lot'.`,`one's fortune`,'e'),
G(`Identify one noun from: 'Laxmi Bai was the queen of Jhansi.'`,`Laxmi Bai (queen, Jhansi)`),
S(`How does the poet describe his native land?`,`The poet describes his native land as rich and rare, fresh and fair, dear, warm and bold, true and old. He says she is not a dull or cold land.`),
S(`What does the poet say about the men and women of his land?`,`The poet says that no men are braver than the men of his land and her women's hearts never waver. He is ready to die freely to save his land.`),
S(`Write a note on Rani Laxmi Bai of Jhansi.`,`Laxmi Bai was the queen of Jhansi. She fought the British bravely. Jhansi was captured when traitors opened the gates of the fortress. She escaped, joined Tantia Tope at Kalpi and captured the fort of Gwalior from Sindhia. She died fighting the British on 17th June 1858 at Gwalior.`),
L(`Explain the poem 'My Land' in your own words.`,`The poet praises his native land with love. He says she is a rich and rare land, fresh and fair, dear and true, warm and bold, not dull or cold. No men are braver than her men and the hearts of her women never waver. The poet says he would freely die to save his land and would think his lot divine, which means he would feel it as a great fortune. The poem teaches us to love and respect our motherland.`,'h'),
L(`Write a paragraph on 'India – My Motherland'.`,`India is my motherland. It is a big country with high mountains, great rivers and green forests. People of different religions, languages and cultures live here together as brothers and sisters. Our country has had many brave people such as Rani Laxmi Bai of Jhansi and many freedom fighters. I am proud to be an Indian and I will always work to make my country strong and happy. (Model answer)`,'h')
]});

LSE6.push({n:1,t:`A Chat with a Grasshopper – Unit 5 Prose`,au:`Prose (Dialogue & Facts)`,pg:1,
words:`foe – an enemy; toxic – poisonous; mate – friend, partner; snap – move (with a sharp sound); hind – at the back; weird – strange; dine – eat; weed – a wild plant; striped – marked with long narrow lines; exoskeleton – skeleton on the outside of the body; antennae – two long thin parts on the head of some insects; vibration – shaking movement; barley – a grain used as food`,
notes:`Students of class VI visit a park with their teacher. Roshan, Teena, Rani and Ani meet a green insect named Hoppi, a grasshopper (a 'summer time singer' and 'farmer's friend'). Hoppi tells them that there are 11,000 to 18,000 varieties of grasshoppers, that it has two sets of wings, three pairs of strong legs, five eyes and a pair of antennae which help it to sense danger and pick up vibrations from the air and the ground. It eats plants, wheat, oat, corn and barley. Extra facts: the exoskeleton, the chirping sound made by rubbing the back leg against the forewing, grasshoppers as friends of farmers (Turnbull and two-striped grasshoppers), the smallest (pygmy) and the largest (giant) grasshoppers. Language work: framing wh-questions, names of male/female/young ones of animals, paragraph writing, web diagram, instructions and slogans.`,
ab:[
[`C1. Read the questions and discuss the answers`,[
[`What helps a grasshopper fly?`,`Its two sets of wings (four wings) help a grasshopper to fly.`],
[`How many wings does a grasshopper have? (2, 4, 6, 8, 10)`,`4 (two sets of wings)`],
[`How many eyes does a grasshopper have? (1, 3, 5, 7, 9)`,`5`],
[`How long are the world's largest grasshoppers? (20 mm, 90 mm, 100 mm, 120 mm)`,`90 mm (the female giant grasshopper is 60–90 mm long)`],
[`Grasshopper makes a chirping sound by: a) rubbing two legs together b) rubbing one of its legs along one of its wings c) rubbing its wings together d) rubbing its back leg against one of its antennae`,`b) rubbing one of its legs along one of its wings`],
[`Say True or False: A grasshopper is blind and deaf.`,`False. It has five eyes and its antennae pick up vibrations.`],
[`Grasshoppers do not have ears, yet they can pick up vibrations. How?`,`They pick up vibrations from the air and the ground with the help of their antennae.`]]],
[`V1. Circle the words used in the lesson`,[
[`farmer, toxic, exoskeleton, strong, fruits, vibration, weird, turnbull, housefly, insecticide`,`Used in the lesson: farmer, toxic, exoskeleton, strong, vibration, weird, turnbull. (Not used: fruits, housefly, insecticide)`]]],
[`V2. Find words from the lesson with the following meanings`,[
[`a) grain used to make flour`,`wheat`],
[`b) poisonous to eat or drink`,`toxic`],
[`c) an enemy`,`foe`],
[`d) outside skin of an animal body`,`exoskeleton`],
[`e) two long thin parts on the heads of some insects`,`antennae`]]],
[`V3. Fill in the blanks using the appropriate words`,[
[`The two-striped grasshopper will eat plants that are ________ to cattle.`,`toxic`],
[`The grasshoppers make sounds of ________ on a summer-night.`,`chirp chirp (chirping)`],
[`The ________ organ can pick up vibrations from the air and on the ground to the grasshopper.`,`antenna (antennae)`]]],
[`V4. Choose the correct answers from the words in brackets [bees, mosquitoes, spiders, caterpillars]`,[
[`The insects that make the sound of buzz`,`bees`],
[`The insects that irritate at night`,`mosquitoes`],
[`The insects that build their own webs`,`spiders`],
[`The insects that reform as butterflies`,`caterpillars`]]],
[`V5. Male, female and young ones of animals`,[
[`lion`,`Male: lion; Female: lioness; Young one: cub`],
[`goat`,`Male: billy goat; Female: nanny goat; Young one: kid`],
[`tiger`,`Male: tiger; Female: tigress; Young one: cub`],
[`cock`,`Male: cock; Female: hen; Young one: chick`],
[`horse (example given)`,`Male: stallion; Female: mare; Young one: foal`]]],
[`W1. Write a short paragraph about grasshoppers (5–6 sentences)`,[
[`Model paragraph`,`Model answer: A grasshopper is a green insect. It has three pairs of strong legs and two sets of wings. It has five eyes and a pair of antennae. The antennae help it to sense danger and pick up vibrations. A grasshopper eats plants, wheat, oat, corn and barley. It is a friend of farmers. Male grasshoppers make a chirping sound by rubbing the back leg against the forewing.`]]],
[`W2. Web diagram – the white tiger (read the passage)`,[
[`Colour and features`,`Creamy white fur with stripes, blue eyes and a pink nose.`],
[`Size`,`About three metres long; weighs approximately 180–258 kg.`],
[`Habitat`,`Grassy or swampy areas and forests (mainland of south-eastern Asia, central and southern India); most are now in zoos or wildlife sanctuaries.`],
[`Habits`,`Good swimmers but poor climbers; slow runners but stealthy; solitary animals which mostly hunt at night.`],
[`Two sentences on how the tiger can be saved`,`Model answer: 1. We should stop cutting down forests and protect the tiger's habitat. 2. Hunting and poaching of tigers should be stopped by strict laws and more sanctuaries should be set up.`]]],
[`S1. Ask questions using the clues`,[
[`(where/live)`,`Where does a grasshopper live?`],
[`(how many/eyes)`,`How many eyes does a grasshopper have?`],
[`(what/eat) – example`,`What does a grasshopper eat?`]]],
[`S3. Frame questions using the clues in brackets`,[
[`A: This book is mine. B: ____? (whose)`,`Whose book is this?`],
[`A: I like blue colour. B: ____? (what)`,`What colour do you like?`],
[`A: We celebrate Vanamahotsava on June 5th. B: ____? (when)`,`When do we celebrate Vanamahotsava?`],
[`A: Deon likes cows because they give us milk. B: ____? (why)`,`Why does Deon like cows?`],
[`A: Sachin is my favourite batsman. B: ____? (who)`,`Who is your favourite batsman?`],
[`A: Naija goes to school every day. B: ____? (where)`,`Where does Naija go every day?`]]],
[`S4. Instructions / slogans and where we see them`,[
[`Write some more instructions/slogans`,`Model answer: 1) Save water, save life. 2) Do not litter. 3) Plant trees, save earth.`],
[`Beware of dogs.`,`At the gate of a house or a farm.`],
[`Thanks for not smoking.`,`In hospitals, restaurants, buses and other public places.`],
[`Leave your footwear outside.`,`At the entrance of a temple, a mosque or a house.`],
[`Switch off your mobile phone.`,`In a hospital, library, theatre, exam hall or a place of worship.`]]],
[`Extended Activity – And…what? (chain sentences)`,[
[`Topic: fruits, vegetables and eatables`,`Model answer: I went to the shop and bought mangoes, bananas, tomatoes and biscuits.`],
[`Topic: toys and gift items`,`Model answer: For my birthday I got a bat, a ball, a toy car and a story book.`],
[`Topic: Birds and animals`,`Model answer: I saw a peacock, a deer, a monkey and a tiger in the forest.`]]],
[`Further Reading – 'Hurt No Living Thing' by Christina Rossetti (new words)`,[
[`ladybird, moth, cricket, gnat, beetle`,`Model answer (dictionary meanings): ladybird – a small red beetle with black spots; moth – an insect like a butterfly that flies at night; cricket – a jumping insect that makes a chirping sound; gnat – a tiny flying insect that bites; beetle – an insect with hard wing-covers.`]]]
],
qb:[

M(`'Foe' means:`,[`friend`,`enemy`,`farmer`,`mate`],1),
M(`The Band-winged Grasshopper makes a crackling sound by:`,[`rubbing its legs`,`snapping its hindwings`,`beating its antennae`,`stamping its feet`],1,'m'),
O(`Who are the four children that meet the grasshopper?`,`Roshan, Teena, Rani and Ani.`),
O(`What is a grasshopper called in the lesson because it sings in summer?`,`A summer time singer.`),
O(`How do the antennae help a grasshopper?`,`They help it to sense danger and to pick up vibrations from the air and the ground.`),
O(`What does a grasshopper eat?`,`It eats plants, wheat, oat, corn and barley.`),
O(`Why is the grasshopper called the farmer's friend?`,`Some grasshoppers eat weeds that kill crops and plants that are toxic to cattle.`,'m'),

G(`Write the meaning of 'toxic'.`,`poisonous`),
G(`Write the meaning of 'weird'.`,`strange`),
G(`Write the meaning of 'dine'.`,`eat`),
G(`Write the female of 'tiger'.`,`tigress`),
G(`Write the young one of a 'lion'.`,`cub`),
G(`Write the male of 'goat'.`,`billy goat`),
G(`Frame a question using 'what/eat': a grasshopper.`,`What does a grasshopper eat?`),
S(`How does a grasshopper escape from its enemies?`,`A grasshopper has five eyes and a pair of antennae. The antennae help it to sense danger and it swiftly escapes. It also has three pairs of strong legs, so it can jump and walk fast, and two sets of wings for flying.`),
S(`How does a male grasshopper make a chirping sound?`,`A male grasshopper rubs its back leg against its forewing to make a chirping sound. It does this to attract a mate or to warn off other males.`),
S(`Why are grasshoppers a help to farmers?`,`The Turnbull grasshopper eats the weeds that kill crops. The two-striped grasshopper eats plants that are toxic to cattle. So grasshoppers help farmers.`),
L(`Write a paragraph about the grasshopper using the facts you read in the lesson.`,`A grasshopper is a green insect. It is called a summer time singer and a friend of farmers. It has three pairs of strong legs and can walk and jump twenty times the length of its body. It has two sets of wings for flying, five eyes and a pair of antennae. The antennae help it to sense danger and pick up vibrations from the air and the ground. Male grasshoppers chirp by rubbing the back leg against the forewing. Grasshoppers eat plants, wheat, oat, corn and barley. There are 11,000 to 18,000 varieties of grasshoppers in the world.`),
L(`Describe the conversation between the children and Hoppi.`,`The children saw a green insect in the park and were surprised. Hoppi told them that he was a grasshopper, a summer time singer. He said he lived everywhere and that there were thousands of varieties. He told them he had two sets of wings, three pairs of strong legs, five eyes and a pair of antennae. When Teena invited him for lunch, he said he ate only plants, wheat, oat, corn and barley. The children had to leave as it was getting late, and they said goodbye to their new friend.`,'h')
]});

LSE6.push({n:2,t:`The Fly (Poem) – Unit 5 Poetry`,au:`Tony Bradman`,pg:14,
words:`insane – mad; wardrobe – place in the cupboard where we hang up clothes; ceiling – roof (of a room); buzzed off – gone away; pane – a sheet of glass in a window; lampshade – cover of a lamp; bedpost – the post at the corner of a bed`,
notes:`A funny poem by Tony Bradman. A fly is in the poet's bedroom and is driving him insane. It buzzes round the wardrobe, sits on the window pane, flies round the lampshade, lands on his pillow and walks on his nose and even looks into his eyeball. The poet cannot sleep. When the fly finally buzzes off and he closes his eyes, the buzzing starts again. Theme: a small irritation can be very annoying; humour. Activity: match sound makers with sounds; rhyming words; voice modulation while reciting.`,
ab:[
[`Preparatory activity (a). Match the sound makers with the sounds`,[
[`a dog`,`d – barks`],[`a cow`,`g – moos`],[`a fly`,`a – buzzes`],[`a crow`,`c – caws`],[`a bird`,`b – chirps`],[`a snake`,`h – hisses`],[`a cat`,`e – mews`],[`a horse`,`f – neighs`]]],
[`Let's Understand. Answer the following questions`,[
[`Where was the fly found?`,`The fly was found inside the poet's bedroom.`],
[`How did the poet feel when he saw the fly?`,`The poet felt irritated; the fly was driving him insane (mad).`],
[`Why can't the poet sleep?`,`The fly keeps buzzing and flying around him – on his pillow, nose and eyeball – so he cannot sleep.`],
[`Does the poem make you laugh? What is so funny?`,`Model answer: Yes. It is funny that the fly walks on the poet's nose, looks into his eyeball and comes back with a 'surprise' just when he is about to sleep.`],
[`Make a list of the places where the fly goes.`,`Bedroom, wardrobe, window pane, lampshade, pillow, nose, eyeball, ceiling, bedpost, floor, toys and door.`]]],
[`Let's Appreciate 1. Pick out the rhyming words from the poem`,[
[`Stanza 1`,`insane – pane`],
[`Stanza 2`,`close – nose`],
[`Stanza 3 / 4`,`again – insane (stanza 3); again – pain (stanza 4)`],
[`Stanza 5`,`floor – door`],
[`Stanza 6`,`eyes – surprise`]]],
[`Let's Appreciate 2. Fill in the blanks with appropriate words from the poem`,[
[`There's a fly …… my bedroom.`,`inside`],
[`It's flying …… the lampshade.`,`round`],
[`It's walking …… my nose.`,`on`],
[`It's looking …… my eyeball.`,`in`],
[`It's walking …… the floor.`,`on`],
[`It's flying …… my toys.`,`round`]]],
[`Let's Appreciate 3 & 4`,[
[`Read the poem in groups – voice modulation, facial expression, volume`,`Activity: Each group reads aloud. Good readers vary the voice to show irritation, use the buzzing sound 'zzz' and use expressions and gestures.`],
[`Write a poem / a few lines on any other insect`,`Model answer: The mosquito hums at night, / It gives me such a fright. / It bites me on my toe, / Then off it quickly goes.`]]],
[`Let's Do`,[
[`Collect the pictures of insects`,`Activity: Collect pictures of a butterfly, bee, ant, ladybird, grasshopper, dragonfly etc. and paste them in a scrap book.`]]],
[`About the Poet`,[
[`Who is Tony Bradman?`,`Tony Bradman (born 22 January 1954) is an English poet and author of children's books, best known for the Dilly the Dinosaur series.`]]]
],
qb:[
M(`The poem 'The Fly' is written by:`,[`Tony Bradman`,`Norman Macleod`,`Christina Rossetti`,`F. Joanna`],0),
M(`The fly in the poem is inside the poet's:`,[`kitchen`,`bedroom`,`classroom`,`garden`],1),
M(`The fly is driving the poet:`,[`away`,`home`,`insane`,`outside`],2),
M(`'Insane' means:`,[`sad`,`mad`,`sleepy`,`tired`],1),
M(`Which animal 'hisses'?`,[`a snake`,`a horse`,`a cat`,`a crow`],0),
M(`Which of these rhymes with 'pane'?`,[`insane`,`floor`,`nose`,`close`],0,'m'),
M(`The fly walks on the poet's:`,[`hand`,`nose`,`book`,`shoe`],1),
O(`Where does the fly sit on the window?`,`On the window pane.`),
O(`Where does the fly land in the second stanza?`,`On the poet's pillow.`),
O(`What does the fly do on the ceiling?`,`It walks on the ceiling.`),
O(`What happens when the fly buzzes off and the poet closes his eyes?`,`He hears buzzing again; the fly is back.`),
O(`Who wrote 'Dilly the Dinosaur' series?`,`Tony Bradman.`,'m'),
G(`Write the word from the poem that rhymes with 'close'.`,`nose`),
G(`Write the word from the poem that rhymes with 'floor'.`,`door`),
G(`Write the word from the poem that rhymes with 'eyes'.`,`surprise`),
G(`Write the meaning of 'ceiling'.`,`roof (of a room)`,'e'),
G(`Write the meaning of 'buzzed off'.`,`gone away`),
G(`Which animal 'neighs'?`,`A horse`,'e'),
G(`Which animal 'caws'?`,`A crow`,'e'),
S(`Why is the fly so irritating to the poet?`,`The fly keeps buzzing and moving all over the room. It walks on the poet's nose, looks into his eyeball and flies round his pillow. Because of this the poet cannot sleep.`),
S(`List any five places where the fly goes.`,`The fly goes to the wardrobe, the window pane, the lampshade, the pillow and the poet's nose (also the ceiling, bedpost, floor, toys and door).`),
S(`What is the surprise at the end of the poem?`,`The fly buzzes off and the poet closes his eyes to sleep. But then he hears buzzing again and the fly is back. This is the surprise.`),
L(`Write the summary of the poem 'The Fly' in your own words.`,`The poet finds a fly in his bedroom and it is driving him insane. It buzzes round the wardrobe, sits on the window pane and flies round the lampshade. It lands on his pillow, walks on his nose and even looks into his eyeball. It walks on the ceiling and the floor, flies round his toys and buzzes on the door. At last the fly buzzes off and the poet closes his eyes to sleep, but he hears buzzing again. The fly is back. The poem is funny and shows how a tiny insect can disturb us.`,'h')
]});

LSE6.push({n:3,t:`Where There is a Will, There is a Way – Unit 6 Prose`,au:`Prose (Biography of two athletes)`,pg:18,
words:`event – an important happening; exciting – causing strong feelings; participate – take part in; victim – one who suffers pain or disability as a result of an accident or disease; massage – pressing or rubbing to remove pain; gazelle – a deer-like animal; recommend – suggest, advise; sprinter – a fast runner; spikes – pointed pieces of metal on running shoes; decathlon – a competition of ten separate events; perseverance – continuing to try; differently abled – having a physical challenge; laurels – honour and praise; impediment – something that stops or delays; infancy – young age`,
notes:`Introduction: no one is born great; one becomes great by deeds, willpower, patience and perseverance. The lesson tells the stories of two athletes who achieved their best in spite of physical challenges. Wilma Rudolf (USA), the 'Black Gazelle', was the fourteenth child of a large African American family, weak at birth, had polio at the age of four and was in bed for two years. Her family massaged her leg daily; she began to walk, played basketball, trained as a sprinter under a coach, went to the Melbourne Olympics, and won three gold medals at Rome. Rafer Johnson's left leg was badly crushed in a machine when he was twelve; the surgeon saved the leg but it never healed completely. Yet he practised hard, took part in the decathlon at the Olympics and won first place – 'the greatest all round athlete in the world'. Both had a dream, set a goal and worked with a will. Listening: Dr Vinod Sena, a visually challenged man, developed a website for the blind. Language work: adverbs (happily, slowly …), opposites, homophones, conjunctions 'and' and 'but', bio-data, seeking and offering help.`,
ab:[
[`Let's Listen and Respond – Dr Vinod Sena`,[
[`What is a website?`,`A website is a place on the Internet where you can find information about something.`],
[`Who is Dr Vinod Sena?`,`He is a visually challenged retired English professor of Delhi University who developed a website for the blind.`],
[`How did Dr Vinod Sena connect the visually challenged people to the world of internet?`,`He developed a website that can be used without a mouse. With text-to-speech software it becomes audio-based, so visually challenged people can use it without sighted help.`],
[`Do you know any other specially abled persons who have done great things?`,`Model answer: Helen Keller, who was blind and deaf, became a great writer and speaker. Stephen Hawking, who had a serious disease, became a great scientist.`]]],
[`C1. Choose the right answer`,[
[`Wilma Rudolf is famous as`,`d. black gazelle`],
[`Wilma is a ________`,`b. sprinter`],
[`Wilma's legs were weak because`,`b. her legs were affected by polio`],
[`Rafer found it difficult to run`,`d. wearing spiked shoes`],
[`Decathlon is ________`,`a. a competition where athletes take part in ten separate events`]]],
[`C2. Answer the following questions`,[
[`Where was the 1992 Olympics held?`,`In Barcelona.`],
[`Who are the two athletes that this lesson talks about?`,`Wilma Rudolf and Rafer Johnson.`],
[`To which country did Wilma belong?`,`The U.S.A.`],
[`What was the doctor's recommendation to improve Wilma's legs?`,`The doctors recommended regular massage to get her limp leg back to normal.`],
[`What happened to Rafer's left leg?`,`When he was twelve, his left leg was badly crushed in a machine. The surgeon saved the leg, but it did not heal completely.`],
[`List out the events in decathlon.`,`100 mt dash, long jump, shot put, high jump, 400 mt run, 110 mt hurdle, discus throw, pole vault, javelin throw and 1500 mt run.`]]],
[`C3. Discuss in groups and answer`,[
[`Many countries send their teams to the Olympics. Why?`,`The Olympics is one of the world's biggest events and it is an honour for a country to send her athletes to take part in these games.`],
[`Why are the players not happy when they just win?`,`Model answer: They want to set a new record and become the world's best ever; so they are not satisfied with just a win.`],
[`How did Wilma's family help her?`,`Each member of her family spent some time massaging her leg every day, and in course of time she was able to walk.`],
[`How did Rafer suffer as a boy?`,`His left leg was badly crushed in a machine, the toe was hanging out, and the surgeon feared the entire leg might have to be cut off. He lay in bed for a long time.`],
[`What do you learn from the lives of these two great athletes?`,`Model answer: With a dream, hard work and willpower, we can overcome any difficulty and succeed.`],
[`Have you met anyone who has made great achievement?`,`Model answer: Share about a teacher, a relative or a sportsperson you know who has achieved something in spite of difficulties.`]]],
[`C4. Arrange the details in a sequential order and rewrite as a paragraph`,[
[`Correct order`,`3, 6, 1, 5, 2, 4`],
[`Paragraph`,`Wilma was weak as a baby. She had an attack of polio in her fourth year. She was in bed for two years. She had regular massage of her limp leg. She became well in course of time. She played for her school in one of the matches.`]]],
[`V1. Who are the following?`,[
[`One who participates in a running race. r__n_r`,`runner`],
[`One who takes part in field and track events. a_hl_t_`,`athlete`],
[`One who runs fast for short distances. s__i_t__r`,`sprinter`],
[`One who is injured as a result of a disease. v__ct_`,`victim`]]],
[`V2. Choose the correct word from the brackets`,[
[`________ (Some, Sum) of them participated in individual events`,`Some`],
[`went to cheer up ________ (there, their) friends`,`their`],
[`When the ________ (race, rays) began`,`race`],
[`all his friends ________ (new, knew) that he`,`knew`],
[`he ________ (would, wood) win`,`would`],
[`Rohit ________ (one, won) the first`,`won`],
[`first ________ (prize, price)`,`prize`]]],
[`V3. Circle the words that do not belong to the group`,[
[`running, relay, high jump, long jump, kabaddi`,`kabaddi (the others are athletic events)`],
[`coach, carpenter, batsman, bowler, umpire, wicket keeper`,`carpenter (the others are connected with cricket/sports)`],
[`chess, carrom, football, table tennis, snake and ladder`,`football (the others are indoor games)`],
[`Tendulkar, Sehwag, Dhoni, Mahesh Bhupathi, Yuvraj Singh`,`Mahesh Bhupathi (a tennis player; the others are cricketers)`]]],
[`V4. Match the awards with the achievements`,[
[`1. Khel Ratna`,`d) highest award given by the central government for outstanding achievement in any game`],
[`2. Arjuna award`,`c) outstanding performance in any game; given by the central government`],
[`3. Drona award`,`e) outstanding coach`],
[`4. Ekalavya award`,`a) outstanding performance in any game; given by the state government`],
[`5. Dhyanchand award`,`b) outstanding performance in hockey`]]],
[`V5. Write any four famous players of the following games`,[
[`Cricket`,`Model answer: Sachin Tendulkar, Kapil Dev, M.S. Dhoni, Virat Kohli`],
[`Hockey`,`Model answer: Dhyan Chand, Dhanraj Pillay, P.R. Sreejesh, Harmanpreet Singh`],
[`Football`,`Model answer: Sunil Chhetri, Bhaichung Bhutia, Lionel Messi, Cristiano Ronaldo`],
[`Tennis`,`Model answer: Sania Mirza, Leander Paes, Mahesh Bhupathi, Rohan Bopanna`],
[`Chess`,`Model answer: Viswanathan Anand, Koneru Humpy, D. Gukesh, R. Praggnanandhaa`]]],
[`V6. Circle the opposites in the search box`,[
[`thick`,`thin`],[`far`,`near`],[`wrong`,`right`],[`beautiful`,`ugly`],[`strong`,`weak`],[`cruel`,`kind`],[`fast`,`slow`],[`finish`,`start`]]],
[`V7. Complete the phrases using words from the cloud (happily, slowly, politely, quietly, easily, carefully, safely, softly)`,[
